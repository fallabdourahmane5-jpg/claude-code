ion elle-même selon les dégroupages de Baldwin. Le centre de gravité a par ailleurs quitté l’Europe pour l’Asie émergente. La comparaison conserve néanmoins une vertu majeure : elle rappelle, par le précédent de 1929, qu’une intégration peut se défaire."}, "ch21-13": {"commentaire": "Sujet explicatif qui appelle un plan par facteurs et non un plan dialectique. Trois familles d’explications structurent le devoir : la nature de la spécialisation initiale, les institutions, et la capacité à faire évoluer l’une et les autres. Il faut éviter le déterminisme comme le volontarisme : Prebisch et la malédiction des ressources montrent le poids des contraintes, Acemoglu et Robinson celui des institutions, List et la montée en gamme chinoise celui des stratégies. Le rôle du financement extérieur, avec Nurkse et le contre-exemple du choc Volcker, complète utilement l’analyse.", "intro": "Deux économies peuvent s’ouvrir au même moment et connaître des trajectoires opposées : l’une s’industrialise, monte en gamme et rattrape les économies avancées ; l’autre reste cantonnée à l’exportation de quelques produits primaires dont les cours commandent ses recettes. L’ouverture ne produit donc pas mécaniquement le développement, et la théorie des avantages comparatifs, qui garantit un gain à l’échange, ne garantit rien quant à la trajectoire ensuite suivie. Raúl Prebisch en a donné la première formulation systématique en opposant un centre industrialisé à une périphérie enfermée dans la spécialisation primaire. Réussir son insertion signifiera ici transformer l’ouverture en gains de productivité durables et en diversification productive.", "problematique": "Qu’est-ce qui explique que l’ouverture internationale nourrisse le développement de certaines économies et enferme les autres dans des trajectoires peu favorables ?", "plan": ["I. La nature de la spécialisation initiale pèse lourdement", "A. Toutes les spécialisations ne procurent pas les mêmes revenus", "1) Une activité à forte technologie, forte valeur ajoutée et forte productivité ne rapporte pas comme une activité peu qualifiée et facilement reproductible.", "2) Il faut donc distinguer le gain global à l’échange de la répartition de ce gain entre partenaires.", "3) La DIT traditionnelle attribuait aux périphéries les matières premières et les produits primaires, aux pays du centre les produits manufacturés.", "B. Prebisch décrit un mécanisme d’enfermement", "1) La détérioration des termes de l’échange oblige les pays spécialisés dans le primaire à exporter toujours davantage pour financer les mêmes importations.", "2) Les recettes deviennent dépendantes de cours mondiaux sur lesquels le pays n’a aucune prise.", "3) Les théories de l’échange inégal prolongent cette analyse en lisant le commerce mondial comme un rapport de domination.", "C. La malédiction des ressources en est la forme contemporaine", "1) La dépendance aux matières premières, produits agricoles ou ressources énergétiques engendre une forte volatilité des revenus.", "2) Elle s’accompagne d’une faible diversification et de difficultés durables d’industrialisation.", "3) La rente peut dispenser d’investir dans les capacités productives et éducatives qui permettraient d’en sortir.", "II. Les institutions déterminent largement ce que l’ouverture produit", "A. Acemoglu et Robinson opposent deux types d’institutions", "1) Les institutions inclusives protègent les droits, encouragent l’investissement et diffusent largement les gains de l’activité économique.", "2) Les institutions extractives sont conçues pour extraire les ressources d’une partie de la population ou du territoire au bénéfice d’une minorité.", "3) Dans le contexte colonial, terres, mines, main-d’œuvre et ressources naturelles étaient organisées au profit des puissances dominantes.", "B. Ces héritages survivent aux indépendances", "1) Les structures productives et administratives construites pour l’extraction ne se reconvertissent pas spontanément.", "2) Elles orientent durablement l’allocation des investissements et la formation des élites économiques.", "3) L’ouverture peut alors accroître les recettes sans modifier la structure qui les capte.", "C. Les institutions conditionnent aussi l’usage du financement extérieur", "1) Nurkse avait montré que la faiblesse de l’épargne bloque le développement : « un pays est pauvre parce qu’il est pauvre ».", "2) Le recours à l’épargne étrangère peut rompre ce cercle, à condition de financer l’investissement productif.", "3) Le choc Volcker de 1979 a montré le risque inverse : la hausse des taux américains a rapatrié les capitaux et précipité la crise de la dette latino-américaine.", "III. La réussite tient finalement à la capacité de transformer sa spécialisation", "A. Les avantages comparatifs se construisent", "1) List soutient dès 1841 qu’une industrie naissante ne peut affronter immédiatement une industrie étrangère déjà compétitive.", "2) Le protectionnisme éducateur doit alors être temporaire, ciblé et destiné à construire une compétitivité future.", "3) Hamilton avait défendu une logique comparable pour protéger les producteurs américains de la concurrence britannique.", "B. Les chaînes de valeur offrent une porte d’entrée ambivalente", "1) Le second dégroupage de Baldwin permet de s’insérer sur une seule tâche sans maîtriser tout le processus productif.", "2) Cette insertion partielle peut servir de point de départ à une montée en gamme progressive.", "3) Mais elle peut aussi cantonner durablement l’économie aux tâches d’assemblage à faible valeur ajoutée.", "C. La Chine illustre une trajectoire de montée en gamme réussie", "1) Industrialisation rapide, croissance très forte et progression continue des exportations en constituent les premières étapes.", "2) Elle ne se contente plus de produits peu sophistiqués et vise désormais la frontière technologique.", "3) Cette montée en gamme suscite en retour une arsenalisation des politiques économiques — restrictions technologiques, contrôle des exportations — destinée à la ralentir."], "conclusion": "La réussite d’une insertion internationale dépend d’abord du contenu de la spécialisation : Prebisch montre que la spécialisation primaire enferme dans une détérioration des termes de l’échange, dont la malédiction des ressources est la forme contemporaine. Elle dépend ensuite des institutions, Acemoglu et Robinson opposant celles qui diffusent les gains à celles qui les captent au profit d’une minorité. Elle dépend enfin de la capacité à transformer cette spécialisation, ce que List avait théorisé dès 1841 et que la montée en gamme chinoise illustre aujourd’hui. L’ouverture n’est donc ni bénéfique ni nuisible en soi : elle amplifie les trajectoires que la spécialisation et les institutions avaient déjà engagées."}, "ch21-14": {"commentaire": "Sujet proche du sujet 2 mais centré sur la mesure : la difficulté est ici de distinguer inégalités entre pays et inégalités à l’intérieur des pays, qui évoluent en sens opposés. Le devoir doit s’articuler autour de cette distinction et culminer sur la courbe de l’éléphant, qui l’intègre en un seul graphique. Milanovic et son « big bang » des inégalités globales fournissent la profondeur historique, Stolper-Samuelson le mécanisme interne, Prebisch la dimension structurelle. La conclusion doit expliquer pourquoi une même évolution peut être lue comme une réduction et comme un creusement.", "intro": "Répondre que la mondialisation réduit ou accroît les inégalités suppose d’abord de préciser de quelles inégalités on parle, car deux mesures coexistent et n’évoluent pas dans le même sens. Les inégalités entre pays se sont réduites sous l’effet du rattrapage des grands émergents ; les inégalités à l’intérieur des économies avancées se sont au contraire creusées. Branko Milanovic a rendu cette ambivalence lisible avec la courbe de l’éléphant, construite sur l’évolution des revenus mondiaux entre 1988 et 2008. Il rappelle par ailleurs que la révolution industrielle a provoqué un véritable « big bang » des inégalités globales, en faisant décrocher les économies non industrialisées. L’inégalité se mesurera ici par l’écart des revenus réels entre groupes, selon le périmètre retenu.", "problematique": "La mondialisation réduit-elle les inégalités de revenus, ou son effet dépend-il entièrement du périmètre — entre pays ou à l’intérieur des pays — dans lequel on les mesure ?", "plan": ["I. Elle a réduit certaines inégalités entre pays", "A. Le rattrapage des grands émergents est massif", "1) L’hypermondialisation accompagne un déplacement du centre de gravité économique vers l’Asie émergente.", "2) La Chine connaît une industrialisation rapide, une croissance très forte et une montée en gamme continue.", "3) Les inégalités entre certains pays ont donc diminué, ce qui constitue le principal succès de la période.", "B. Ce rattrapage corrige un décrochage historique", "1) Milanovic décrit un « big bang » des inégalités globales provoqué par la révolution industrielle.", "2) Certains pays s’industrialisent, connaissent de forts gains de productivité et s’enrichissent rapidement, tandis que d’autres restent à l’écart.", "3) Les données de Maddison rappellent que les futurs BRIC pesaient environ 51 % du PIB mondial vers 1700 : l’écart s’était donc creusé, puis se réduit.", "C. L’ouverture a fourni les moyens de ce rattrapage", "1) Le second dégroupage décrit par Baldwin permet de s’insérer dans l’industrie mondiale par une seule tâche.", "2) Le recours à l’épargne étrangère permet de rompre le cercle vicieux de la pauvreté décrit par Nurkse.", "3) Les transferts de technologie associés aux IDE accélèrent les gains de productivité.", "II. Mais elle a creusé les inégalités à l’intérieur des pays", "A. Stolper-Samuelson en fournit le mécanisme", "1) Issu du modèle HOS, ce résultat établit que les facteurs de production ne bénéficient pas également de l’ouverture.", "2) La demande augmente pour certains facteurs et diminue pour d’autres, modifiant durablement les rémunérations relatives.", "3) Dans les économies avancées, le travail peu qualifié, directement mis en concurrence, en subit les effets.", "B. Un même individu peut occuper des positions contradictoires", "1) Il est à la fois salarié, consommateur et parfois détenteur d’épargne, positions dont les intérêts divergent face à l’ouverture.", "2) Le consommateur gagne à la baisse des prix quand le salarié perd à la concurrence sur son emploi.", "3) Cette ambiguïté explique que les effets de la mondialisation soient si difficiles à établir dans le débat public.", "C. Les effets se cumulent avec les transformations du travail", "1) La mise en concurrence internationale pèse sur les salaires des secteurs exposés et alimente la précarisation.", "2) La désindustrialisation dissout les collectifs de travail qui portaient la négociation salariale.", "3) La menace de délocalisation réduit à son tour la capacité de négociation des salariés.", "III. La courbe de l’éléphant articule ces deux mouvements", "A. La période retenue est significative", "1) Milanovic étudie l’évolution des revenus mondiaux entre 1988 et 2008.", "2) La fin des années 1980 correspond à la chute du bloc soviétique, à la transition des économies socialistes et à l’ouverture de nouveaux marchés.", "3) Une part beaucoup plus importante de l’humanité entre alors dans l’économie de marché mondiale.", "B. Les gains se distribuent selon la position dans la hiérarchie mondiale", "1) Les classes moyennes émergentes enregistrent les plus fortes progressions de revenu réel.", "2) Les très hauts revenus mondiaux progressent également fortement.", "3) Les classes populaires et moyennes inférieures des pays avancés stagnent, d’où un sentiment de déclassement relatif.", "C. Cette configuration produit des effets politiques directs", "1) Les populations se percevant comme perdantes soutiennent droits de douane, relocalisation et préférence nationale.", "2) Aux États-Unis, le soutien d’anciennes régions industrielles à Donald Trump en fournit l’illustration.", "3) L’enchaînement est explicite : mondialisation, perception de perte, demande de protection, retour du protectionnisme."], "conclusion": "La mondialisation a réellement réduit les inégalités entre pays, en permettant le rattrapage de grands émergents et en corrigeant partiellement le décrochage produit par la révolution industrielle, ce que Milanovic nomme le « big bang » des inégalités globales. Mais elle a simultanément creusé les inégalités à l’intérieur des économies avancées, conformément au mécanisme de Stolper-Samuelson et aux effets de la désindustrialisation sur les salaires. La courbe de l’éléphant articule précisément ces deux mouvements : elle montre que les gagnants sont les classes moyennes émergentes et les très hauts revenus, les perdants relatifs étant les classes populaires des pays riches. Affirmer que la mondialisation réduit ou creuse les inégalités revient donc à choisir un périmètre de mesure — et à taire l’autre."}, "ch21-15": {"commentaire": "Sujet en alternative qu’il faut dépasser par la distinction des types de capitaux. La première partie établit l’utilité du financement extérieur, avec Nurkse et le cercle vicieux de la pauvreté. La deuxième expose les canaux de l’instabilité, avec le choc Volcker de 1979 comme cas central et développé. La troisième distingue IDE, investissements de portefeuille et prêts, et montre que le risque tient à la composition des flux et à la monnaie d’endettement plutôt qu’à l’ouverture elle-même. Béraud fournit la comparaison historique utile entre les deux mondialisations financières.", "intro": "Ouvrir son compte financier revient à accepter que l’épargne du monde entier puisse financer ses investissements — et à accepter aussi qu’elle puisse s’en retirer. Cette ambivalence est constitutive. Ragnar Nurkse avait résumé le blocage auquel l’ouverture apporte une réponse : « un pays est pauvre parce qu’il est pauvre », la faiblesse des revenus limitant l’épargne, donc l’investissement, donc les gains de productivité. Mais l’histoire fournit aussi le contre-exemple : lorsque Paul Volcker relève fortement les taux directeurs américains à partir de 1979, les capitaux refluent vers les États-Unis et les économies latino-américaines basculent dans une crise de la dette. L’ouverture financière désigne la liberté de circulation des capitaux entre une économie et le reste du monde.", "problematique": "La libre circulation internationale des capitaux stabilise-t-elle le financement des économies en élargissant l’accès à l’épargne mondiale, ou introduit-elle une vulnérabilité que les économies fermées ne connaissaient pas ?", "plan": ["I. L’ouverture financière apporte des ressources décisives", "A. Elle permet de dépasser la contrainte d’épargne intérieure", "1) Nurkse décrit un cercle vicieux : revenus faibles, épargne faible, investissement insuffisant, productivité stagnante.", "2) L’épargne étrangère fournit la source de financement manquante, situation fréquente au début du développement.", "3) Un déficit courant peut alors signaler un fort dynamisme d’investissement plutôt qu’une faiblesse.", "B. Elle améliore l’allocation mondiale du capital", "1) Les capitaux se dirigent en principe vers les économies où les rendements attendus sont les plus élevés.", "2) Les épargnants diversifient leurs placements et réduisent ainsi leur exposition aux chocs nationaux.", "3) L’identité X − M = (S − I) + (T − G) rappelle que ces flux financiers sont la contrepartie nécessaire des déséquilibres courants.", "C. Certains flux transfèrent aussi des capacités productives", "1) L’IDE correspond à un investissement réalisé dans un autre pays dans une logique productive : usine créée, filiale implantée, entreprise acquise.", "2) Il s’accompagne fréquemment de transferts de technologie et de compétences organisationnelles.", "3) Il permet une insertion dans les chaînes de valeur mondiales, porte d’entrée d’une montée en gamme ultérieure.", "II. Mais elle expose les économies à des retournements brutaux", "A. Le choc Volcker en fournit la démonstration historique", "1) Paul Volcker arrive à la tête de la Fed en 1979 dans un contexte d’inflation élevée.", "2) La Fed relève fortement les taux d’intérêt, ce qui rend les placements américains bien plus attractifs.", "3) Les capitaux mondiaux refluent massivement vers les États-Unis et les économies latino-américaines, endettées en devises, basculent dans la crise de la dette.", "B. Le mécanisme de transmission est puissant", "1) Une hausse des taux étrangers renchérit immédiatement le coût du crédit pour les débiteurs, donc réduit l’investissement.", "2) Le retrait des capitaux déprécie la monnaie nationale, ce qui alourdit mécaniquement la dette libellée en devises.", "3) Les décisions de politique monétaire d’une économie dominante produisent ainsi des effets qu’aucune politique nationale ne peut compenser.", "C. L’hypermondialisation a amplifié cette volatilité", "1) Elle se caractérise par une mobilité financière massive, multidirectionnelle et beaucoup plus volatile que par le passé.", "2) Les capitaux peuvent entrer et sortir rapidement, sans lien avec la capacité productive du pays d’accueil.", "3) Les positions extérieures accumulées lient durablement les économies, propageant les chocs bien au-delà de leur origine.", "III. Le risque tient à la composition des flux plutôt qu’à l’ouverture elle-même", "A. Les formes de capitaux n’ont pas le même degré de réversibilité", "1) Les IDE correspondent à des implantations productives durables, difficilement liquidables du jour au lendemain.", "2) Les investissements de portefeuille et les prêts sont liquides, donc susceptibles de se retirer massivement.", "3) Béraud rappelle que lors de la première mondialisation, les placements de portefeuille représentaient 80 à 90 % des mouvements de capitaux contre 10 à 20 % pour les IDE.", "B. La monnaie d’endettement change radicalement le risque", "1) Un pays endetté dans sa propre monnaie ne subit pas l’effet de bilan lié à une dépréciation.", "2) Le privilège exorbitant permet aux États-Unis d’attirer massivement des capitaux et d’emprunter dans leur monnaie.", "3) Une économie émergente endettée en devises subit au contraire simultanément la hausse des taux et la dépréciation du change.", "C. L’enjeu devient celui de la gestion du financement extérieur", "1) Hélène Rey montre que les déséquilibres mondiaux excessifs traduisent des stratégies nationales de croissance elles-mêmes déséquilibrées.", "2) Privilégier les IDE, allonger la maturité de la dette et constituer des réserves atténuent la vulnérabilité sans fermer le compte financier.", "3) La question pertinente n’est donc pas de s’ouvrir ou non, mais de choisir la composition et la maturité des capitaux accueillis."], "conclusion": "L’ouverture financière apporte des ressources décisives : elle permet de rompre le cercle vicieux décrit par Nurkse, améliore l’allocation mondiale du capital et transfère, par les IDE, des capacités productives réelles. Mais elle expose aussi à des retournements que nulle politique nationale ne peut compenser, comme l’a montré le reflux des capitaux consécutif au choc Volcker de 1979 et la crise de la dette latino-américaine qui en a résulté. L’alternative entre stabilité et instabilité est donc mal posée : tout dépend de la composition des flux et de la monnaie d’endettement. Une ouverture reposant sur des IDE longs n’expose pas au même risque qu’un financement par capitaux courts libellés en devises étrangères."}, "ch21-16": {"commentaire": "Sujet centré sur Giraud, à traiter comme une question de mécanismes et non de morale. La première partie établit la réalité de la compétition : mobilité des firmes, arbitrage entre sites, recherche d’attractivité. La deuxième en montre les coûts : concurrence fiscale et sociale, capture de la décision publique, jeu potentiellement à somme négative. La troisième doit examiner les conditions d’une sortie : coordination internationale, spécialisation par les compétences plutôt que par les coûts. Éviter de conclure que la compétition serait soit naturelle soit purement politique : elle résulte de décisions qui peuvent être modifiées.", "intro": "Pierre-Noël Giraud décrit la mondialisation comme une généralisation des compétitions, et cette compétition concerne d’abord les territoires eux-mêmes. La raison en est simple : la firme globale arbitre entre sites d’implantation, tandis que le territoire, lui, ne peut se déplacer. Les États cherchent dès lors à conserver les entreprises présentes, à attirer les investissements directs étrangers, à empêcher certaines délocalisations et à protéger les activités jugées stratégiques. Le chapitre formule cette relation comme une tension fondamentale entre la souveraineté de l’État et la mobilité de la firme. La compétition entre territoires désigne ainsi la rivalité par laquelle des espaces économiques cherchent à capter des activités mobiles au détriment les uns des autres.", "problematique": "La mise en concurrence des territoires découle-t-elle nécessairement de la mobilité des activités, ou résulte-t-elle de choix politiques susceptibles d’être coordonnés autrement ?", "plan": ["I. La mobilité des activités engendre mécaniquement une rivalité entre territoires", "A. La firme globale arbitre entre sites d’implantation", "1) L’IDE consiste à créer une usine à l’étranger, acquérir une entreprise étrangère ou implanter une filiale : chaque décision est un choix de localisation.", "2) Le second dégroupage de Baldwin permet de répartir les étapes d’un même processus productif entre plusieurs pays.", "3) Chaque tâche peut donc être localisée là où les conditions offertes sont les plus favorables.", "B. Les États répondent par des politiques d’attractivité", "1) Ils cherchent à conserver les entreprises, attirer les IDE et empêcher certaines délocalisations.", "2) Cette recherche pèse sur la fiscalité, la réglementation, les infrastructures et la formation.", "3) Giraud en tire la formule d’une généralisation des compétitions, qui met simultanément en concurrence territoires et acteurs.", "C. L’asymétrie de mobilité fonde le rapport de force", "1) La firme peut partir, le territoire ne le peut pas : cette asymétrie structure toute la négociation.", "2) Le chapitre formule la tension centrale comme l’opposition entre souveraineté de l’État et mobilité de la firme.", "3) Michalet montre d’ailleurs que la configuration multinationale a précisément fait de l’implantation productive un enjeu international.", "II. Mais cette compétition engendre des coûts collectifs importants", "A. Elle peut dégénérer en concurrence fiscale et sociale", "1) Chaque territoire est incité à abaisser ses prélèvements pour attirer les activités mobiles.", "2) L’effet d’ensemble est négatif : les recettes publiques diminuent sans que la localisation des activités s’en trouve durablement modifiée.", "3) Le financement des infrastructures et de la formation, qui fondent pourtant l’attractivité réelle, s’en trouve fragilisé.", "B. Elle expose la décision publique à la pression des acteurs mobiles", "1) La menace de délocalisation confère un pouvoir de négociation permanent aux firmes implantées.", "2) Ce pouvoir réduit la capacité des salariés à négocier et affaiblit la protection sociale dans les secteurs exposés.", "3) Elle alimente le sentiment de déclassement qui nourrit les demandes de droits de douane, de relocalisation et de préférence nationale.", "C. Elle peut conduire à des spécialisations défavorables", "1) Attirer par les coûts revient à se spécialiser sur des activités à faible valeur ajoutée et facilement reproductibles.", "2) Prebisch avait montré qu’une telle spécialisation enferme dans une détérioration des termes de l’échange.", "3) Le territoire reste alors vulnérable au premier concurrent offrant des coûts inférieurs.", "III. Elle résulte pourtant de choix qui pourraient être coordonnés autrement", "A. La coordination internationale est possible", "1) Le contrôle des concentrations et la régulation ex ante des plateformes montrent qu’un grand marché peut imposer ses normes.", "2) Le Digital Markets Act en fournit l’exemple : la taille du marché constitue elle-même un instrument de négociation.", "3) Une règle commune supprime précisément l’avantage que chaque territoire cherchait à obtenir en s’en écartant.", "B. L’attractivité durable repose sur des facteurs non reproductibles", "1) Compétences, recherche, infrastructures et stabilité juridique attirent des activités que les seuls coûts salariaux ne déterminent pas.", "2) Ces facteurs ne se délocalisent pas, contrairement aux avantages fiscaux qui peuvent être aussitôt égalés.", "3) List l’avait pressenti dès 1841 : la compétitivité se construit par l’investissement plutôt qu’elle ne se reçoit.", "C. Les États disposent d’instruments que les firmes n’ont pas", "1) L’arsenalisation de la politique économique — droits de douane, sanctions, restrictions technologiques, contrôle des exportations — reste une prérogative publique.", "2) La maîtrise des matériaux critiques, lithium, terres rares, cobalt, nickel, semi-conducteurs, confère un levier réel.", "3) Les mouvements récents de relocalisation sélective montrent que la puissance publique peut réorienter les localisations qu’elle juge stratégiques."], "conclusion": "La compétition entre territoires découle bien d’une asymétrie structurelle : la firme globale arbitre entre sites d’implantation quand le territoire, immobile, ne peut que se rendre attractif — c’est la généralisation des compétitions décrite par Giraud. Mais elle engendre des coûts collectifs réels : concurrence fiscale à somme négative, affaiblissement de la négociation sociale et spécialisation sur des activités facilement reproductibles. Elle n’est pourtant pas inévitable dans sa forme, car elle dépend de règles que les États peuvent coordonner et d’atouts — compétences, recherche, infrastructures — qui ne se délocalisent pas. Ce qui est inévitable, c’est l’arbitrage des firmes ; ce qui ne l’est pas, c’est la surenchère par laquelle les territoires y répondent."}, "ch21-17": {"commentaire": "Sujet classique mais piégeux : il faut résister aussi bien au réquisitoire libre-échangiste qu’à l’apologie protectionniste. La première partie expose rigoureusement le coût du protectionnisme, avec Ricardo et le précédent de 1929-1930. La deuxième présente l’argument de List dans sa forme exacte — temporaire, ciblé, éducateur — et Hamilton comme antécédent. La troisième doit dégager les conditions de validité : la protection n’est utile qu’assortie d’une stratégie de montée en gamme et d’une échéance crédible. L’arsenalisation contemporaine permet de conclure sur un protectionnisme qui n’est plus seulement commercial.", "intro": "Le protectionnisme est traditionnellement présenté comme l’erreur économique par excellence : en renchérissant les importations, il prive le consommateur de prix bas et le producteur d’une concurrence stimulante, et il expose au risque de représailles. Le précédent de l’entre-deux-guerres semble clore le débat, puisque la hausse générale des tarifs après 1929 — tarif Hawley-Smoot aux États-Unis, retour de droits élevés au Royaume-Uni — a fait reculer le commerce international et fragmenté l’économie mondiale. Friedrich List avait pourtant soutenu dès 1841 qu’une industrie naissante ne peut affronter immédiatement une industrie étrangère déjà compétitive. Le protectionnisme désigne l’ensemble des mesures restreignant les importations afin de protéger les producteurs nationaux.", "problematique": "Le protectionnisme constitue-t-il en toute circonstance une perte pour l’économie qui le pratique, ou peut-il, sous certaines conditions, servir une stratégie de développement productif ?", "plan": ["I. Le protectionnisme a un coût économique bien établi", "A. Il prive des gains de la spécialisation", "1) Smith et Ricardo montrent que la spécialisation procure gains de productivité, baisse des coûts et hausse de la production disponible.", "2) Restreindre les importations revient à renoncer à une partie de ces gains et à renchérir les prix pour les consommateurs.", "3) Les producteurs protégés perdent en outre l’aiguillon concurrentiel qui les poussait à innover.", "B. Il expose à un enchaînement cumulatif de représailles", "1) Après la crise de 1929, les tarifs augmentent fortement dans l’ensemble des grandes économies.", "2) Les États-Unis adoptent le tarif Hawley-Smoot et le Royaume-Uni rétablit des droits de douane élevés.", "3) L’effet est cumulatif : commerce international en recul, fragmentation accrue, démondialisation.", "C. Il désorganise les chaînes de production contemporaines", "1) Le second dégroupage décrit par Baldwin a réparti les étapes d’un même processus entre plusieurs pays.", "2) Un droit de douane frappe donc des biens intermédiaires et renchérit la production nationale elle-même.", "3) L’effet protecteur recherché peut ainsi se retourner contre les producteurs que la mesure prétendait défendre.", "II. Mais l’argument du protectionnisme éducateur conserve sa force", "A. List en donne la formulation canonique", "1) En 1841, il affirme qu’une industrie naissante ne peut pas toujours affronter immédiatement une industrie étrangère déjà compétitive.", "2) La protection doit alors être temporaire, ciblée et destinée à construire la compétitivité.", "3) L’Allemagne, en retard industriel sur le Royaume-Uni, constitue le cas qui motive son analyse.", "B. Hamilton en avait posé les bases quelques décennies plus tôt", "1) Il défend un protectionnisme industriel destiné à protéger les producteurs américains de la concurrence britannique.", "2) L’objectif est explicitement de favoriser l’industrialisation nationale plutôt que de préserver des rentes.", "3) Le libre-échange y apparaît comme l’intérêt du pays déjà le plus avancé, ce qui en relativise la neutralité.", "C. Les analyses du développement prolongent cet argument", "1) Prebisch montre que la spécialisation primaire enferme les périphéries dans une détérioration des termes de l’échange.", "2) Sortir de cette spécialisation suppose de développer des activités d’abord non compétitives.", "3) La malédiction des ressources illustre le coût de l’absence d’une telle stratégie : volatilité, faible diversification, dépendance.", "III. Sa valeur dépend donc entièrement des conditions de sa mise en œuvre", "A. Trois conditions distinguent la protection utile de la rente", "1) Elle doit être temporaire, avec une échéance crédible qui contraint à la montée en gamme.", "2) Elle doit être ciblée sur des secteurs à fort potentiel plutôt que généralisée.", "3) Elle doit s’accompagner d’investissements en formation, en recherche et en infrastructures, faute de quoi elle protège l’inefficacité.", "B. Les trajectoires récentes le confirment", "1) La Chine s’est insérée par l’assemblage avant d’engager une montée en gamme vers la frontière technologique.", "2) Cette trajectoire a combiné ouverture sélective, accueil des IDE et soutien public à des secteurs identifiés.", "3) Une protection sans stratégie productive n’aurait produit ni transfert de technologie ni gains de productivité.", "C. Le protectionnisme contemporain dépasse d’ailleurs le cadre tarifaire", "1) On parle d’arsenalisation de la politique économique lorsque des instruments économiques servent d’armes de puissance.", "2) Sanctions, restrictions technologiques, contrôle des exportations et restrictions aux investissements en composent la panoplie.", "3) L’objectif peut être de ralentir la montée en gamme d’un rival, ce qui relève de la géopolitique plus que de la politique commerciale."], "conclusion": "Le protectionnisme a un coût réel et documenté : il prive des gains de la spécialisation, expose à des représailles cumulatives comme l’a montré l’enchaînement ouvert par le tarif Hawley-Smoot, et désorganise des chaînes de production devenues internationales. Mais l’argument de List, formulé en 1841, conserve sa force : une industrie naissante peut avoir besoin d’une protection temporaire et ciblée pour construire sa compétitivité, et les analyses de Prebisch sur la détérioration des termes de l’échange en renforcent la portée. Tout dépend donc des conditions : sans échéance, sans ciblage et sans stratégie productive, la protection devient une rente. Le protectionnisme contemporain pose en outre une question nouvelle, puisque l’arsenalisation en fait moins un instrument commercial qu’une arme de puissance."}, "ch21-18": {"commentaire": "Sujet d’actualité à traiter avec une distance analytique. Le verbe « gagner » doit être interrogé : gagner par rapport à quel objectif et à quelle échéance ? Le plan doit établir l’ampleur réelle de la réussite chinoise, en identifier les limites internes et externes, puis montrer que la partie se joue désormais sur la frontière technologique, où l’issue n’est pas déterminée. Attention à ne pas confondre le poids économique agrégé et le niveau de vie par habitant, ni la montée en gamme et l’accession effective à la frontière technologique. L’arsenalisation est la donnée nouvelle décisive.", "intro": "En quatre décennies, la Chine est passée du statut d’économie périphérique à celui de principal moteur du déplacement du centre de gravité économique mondial vers l’Asie. Industrialisation rapide, croissance très forte, progression continue des exportations et montée en gamme technologique : la trajectoire paraît valider sans réserve une stratégie d’insertion. L’évaluation est pourtant moins simple qu’il n’y paraît, car « gagner la mondialisation » peut signifier peser davantage dans la production mondiale, élever le niveau de vie de sa population, ou accéder à la frontière technologique. Ces objectifs n’ont pas été atteints au même degré, et la rivalité qui en résulte a précisément conduit les États-Unis à convertir leurs instruments économiques en instruments de puissance.", "problematique": "La trajectoire chinoise constitue-t-elle une réussite achevée de l’insertion internationale, ou une montée en puissance dont les conditions de poursuite sont désormais contestées ?", "plan": ["I. La réussite chinoise est incontestable dans ses dimensions productives", "A. La trajectoire économique est exceptionnelle", "1) La Chine connaît une industrialisation rapide et une croissance très forte sur plusieurs décennies.", "2) Ses exportations progressent continûment, ce qui en fait un acteur central du commerce mondial.", "3) Elle devient progressivement capable de contester la position des États-Unis.", "B. Elle a su transformer sa spécialisation initiale", "1) Le second dégroupage décrit par Baldwin lui a permis de s’insérer d’abord sur des tâches d’assemblage.", "2) L’exemple de l’iPhone illustre cette position initiale : un appareil exporté à 1 000 dollars n’incorporait qu’une faible valeur créée localement.", "3) Elle ne s’est pourtant pas laissée enfermer dans cette position et a engagé une montée en gamme continue.", "C. Elle contribue au rééquilibrage des inégalités mondiales", "1) L’hypermondialisation accompagne un déplacement du centre de gravité économique vers l’Asie émergente.", "2) Les inégalités entre certains pays ont diminué, ce que la courbe de l’éléphant de Milanovic rend lisible sur la période 1988-2008.", "3) Les données de Maddison rappellent d’ailleurs que les futurs BRIC pesaient environ 51 % du PIB mondial vers 1700 : il s’agit en partie d’un retour.", "II. Mais cette réussite comporte des limites et des vulnérabilités", "A. Le poids agrégé ne se confond pas avec le niveau de vie", "1) Le PIB total d’une économie très peuplée peut être élevé sans que le revenu par habitant rejoigne celui des économies avancées.", "2) Les inégalités internes se sont creusées durant la période de forte croissance.", "3) La courbe de l’éléphant mesure la progression des classes moyennes émergentes, non un alignement sur les niveaux de vie occidentaux.", "B. Le modèle de croissance présente ses propres déséquilibres", "1) Hélène Rey montre que les déséquilibres mondiaux excessifs traduisent des stratégies nationales de croissance elles-mêmes déséquilibrées.", "2) La Chine figure parmi les quatre zones qu’elle identifie, aux côtés des États-Unis, de l’Union européenne et des pays exportateurs de pétrole.", "3) Un excédent durable peut signaler une demande intérieure insuffisante autant qu’une compétitivité forte.", "C. La dépendance aux marchés extérieurs constitue un risque", "1) Un modèle fondé sur l’exportation est exposé au ralentissement de ses débouchés.", "2) Depuis 2008, le commerce mondial ne progresse plus beaucoup plus vite que le PIB mondial : c’est la slowbalization.", "3) La réorganisation des chaînes de valeur en fonction du risque peut réduire la part captée par un fournisseur unique.", "III. La partie décisive se joue désormais sur la frontière technologique", "A. La nature de la rivalité a changé", "1) La Chine ne se contente plus de produits peu sophistiqués et d’activités à faible coût.", "2) Elle cherche explicitement à atteindre la frontière technologique.", "3) Le conflit n’oppose donc plus un pays développé à un pays atelier, mais deux puissances technologiques.", "B. Les domaines disputés sont clairement identifiés", "1) La rivalité porte sur le numérique, l’intelligence artificielle et les semi-conducteurs.", "2) Elle s’étend aux technologies vertes et aux industries jugées stratégiques.", "3) Ces secteurs commandent la position future dans la division internationale du travail, bien plus que les parts de marché actuelles.", "C. Les États-Unis répondent par l’arsenalisation de leur politique économique", "1) Des instruments économiques sont employés comme armes de puissance : droits de douane, sanctions, restrictions technologiques.", "2) Le contrôle des exportations et les restrictions aux investissements complètent cette panoplie.", "3) L’objectif affiché est de ralentir la montée en gamme du rival, ce qui rend l’issue de la rivalité indéterminée."], "conclusion": "La Chine a incontestablement réussi son insertion productive : industrialisation rapide, croissance forte, exportations en progression continue et, surtout, capacité à transformer une position initiale d’assemblage en montée en gamme technologique. Cette réussite ne vaut pourtant pas victoire : le poids agrégé ne se confond pas avec le niveau de vie, le modèle de croissance présente les déséquilibres qu’analyse Hélène Rey, et la dépendance aux marchés extérieurs demeure. La partie décisive s’est d’ailleurs déplacée vers la frontière technologique — numérique, intelligence artificielle, semi-conducteurs, technologies vertes — où les États-Unis opposent désormais une arsenalisation explicite de leur politique économique. La Chine a gagné une étape, non la mondialisation."}, "ch21-19": {"commentaire": "Sujet comparatif à traiter avec prudence : il faut distinguer décrochage relatif et décrochage absolu. La perte de part dans le PIB mondial est mécanique dès lors que d’autres zones croissent plus vite, et ne constitue pas en soi un appauvrissement. Le devoir doit donc identifier ce qui relèverait d’un véritable décrochage : retard sur la frontière technologique, absence de firmes de taille critique, dépendances stratégiques. La troisième partie doit exposer les atouts européens réels — taille du marché, pouvoir normatif — dont le DMA et le refus de la fusion Alstom-Siemens en 2019 sont les illustrations.", "intro": "Entre 1870 et 1913, le centre de gravité de l’économie mondiale se situait en Europe occidentale, le Royaume-Uni y cumulant avance industrielle, empire, puissance commerciale et puissance financière. Un siècle plus tard, ce centre s’est déplacé vers l’Asie émergente, dont la Chine constitue le principal moteur. Ce mouvement conduit régulièrement à diagnostiquer un décrochage européen. Encore faut-il préciser ce que le mot recouvre : une perte de part relative dans un PIB mondial en croissance n’équivaut pas à un appauvrissement, et les données de Maddison rappellent que la domination européenne fut elle-même une parenthèse historique. Décrocher signifierait ici perdre durablement la capacité de se maintenir sur les activités qui commandent la valeur future.", "problematique": "La perte de poids relatif de l’Europe dans l’économie mondiale traduit-elle un décrochage durable de ses capacités productives, ou le simple rééquilibrage d’une domination historiquement exceptionnelle ?", "plan": ["I. Le recul relatif de l’Europe est une réalité mesurable", "A. Le centre de gravité s’est déplacé", "1) Entre 1870 et 1913, l’Europe occidentale concentrait la puissance industrielle, commerciale et financière mondiale.", "2) L’hypermondialisation déplace ce centre vers l’Asie émergente, portée par l’industrialisation rapide de la Chine.", "3) L’entrée des BRICS sur la scène internationale traduit ce rééquilibrage dans les instances économiques mondiales.", "B. Ce recul est en partie mécanique", "1) Dès lors que d’autres zones croissent plus vite, la part européenne diminue sans que la richesse européenne baisse.", "2) Les données de Maddison montrent que les futurs BRIC pesaient environ 51 % du PIB mondial vers 1700 et 55 % en 1820.", "3) L’exception historique fut donc la domination européenne, produite par l’industrialisation, et non son reflux actuel.", "C. Mais certains indicateurs signalent une difficulté propre", "1) Les parts de marché européennes reculent dans plusieurs industries exposées à la concurrence internationale.", "2) La désindustrialisation a réduit la base productive de plusieurs économies européennes.", "3) Le ralentissement du commerce mondial depuis 2008 pèse davantage sur les économies très ouvertes.", "II. Des faiblesses structurelles alimentent le diagnostic de décrochage", "A. La question de la taille critique se pose", "1) La compétition mondiale exige des firmes capables de financer une recherche coûteuse et incertaine.", "2) Le refus de la fusion Alstom-Siemens en 2019 a relancé le débat européen sur la définition du marché pertinent.", "3) Appliquer un critère national ou européen plutôt que mondial peut interdire la constitution de champions à l’échelle de la concurrence réelle.", "B. Les dépendances stratégiques se sont révélées", "1) Un matériau critique est indispensable à la production, difficilement substituable et concentré chez peu de fournisseurs.", "2) Le lithium, les terres rares, le cobalt, le nickel et certains semi-conducteurs entrent dans cette catégorie.", "3) Les dépendances immatérielles — technologies, logiciels, infrastructures numériques — sont plus difficiles encore à réduire.", "C. La rivalité technologique se joue largement ailleurs", "1) Le conflit sino-américain porte sur le numérique, l’intelligence artificielle, les semi-conducteurs et les technologies vertes.", "2) Il oppose deux puissances technologiques, configuration dans laquelle l’Europe peine à apparaître comme un troisième pôle.", "3) L’arsenalisation des politiques économiques par les deux rivaux place l’Europe en position d’arbitrage subi plutôt que choisi.", "III. L’Europe conserve pourtant des atouts spécifiques", "A. La taille de son marché constitue un instrument de puissance", "1) L’accès à un grand marché se négocie, ce qui confère un pouvoir normatif réel.", "2) Le Digital Markets Act régule ex ante les plateformes structurantes, y compris non européennes.", "3) Le contrôle des concentrations permet d’interdire une opération, ce qu’a montré la décision de 2019 sur Alstom-Siemens.", "B. Ses positions productives restent significatives", "1) Elle demeure présente dans des industries à forte valeur ajoutée où la qualité prime sur le coût.", "2) Ses niveaux de formation et ses infrastructures constituent des facteurs d’attractivité non délocalisables.", "3) List rappelait dès 1841 que la compétitivité se construit par l’investissement plutôt qu’elle ne se reçoit.", "C. Le véritable enjeu est celui de la coordination", "1) Giraud décrit une généralisation des compétitions qui met les territoires en concurrence, y compris entre eux au sein de l’Europe.", "2) La concurrence fiscale interne affaiblit l’ensemble sans modifier durablement la localisation des activités.", "3) La souveraineté économique suppose donc moins de se protéger de l’extérieur que de cesser de se concurrencer à l’intérieur."], "conclusion": "Le recul relatif de l’Europe est réel mais largement mécanique : dès lors que l’Asie émergente croît plus vite, sa part diminue, et les données de Maddison rappellent que la domination européenne de 1870-1913 fut elle-même une parenthèse. Des faiblesses propres existent néanmoins — question de la taille critique posée par le refus de la fusion Alstom-Siemens en 2019, dépendances sur les matériaux critiques, absence de position nette dans la rivalité technologique sino-américaine. Mais l’Europe conserve un pouvoir normatif que la taille de son marché lui confère, comme l’illustre le Digital Markets Act. Le décrochage n’est donc pas acquis : il dépend de sa capacité à cesser de se concurrencer elle-même pour peser comme un acteur unique."}, "ch21-20": {"commentaire": "Sujet de synthèse du chapitre : il doit mobiliser l’ensemble des mécanismes vus. La tension centrale est formulée par le cours lui-même — souveraineté de l’État contre mobilité de la firme globale. Le plan attendu montre d’abord que l’ouverture contraint effectivement la souveraineté, puis que les États conservent des instruments majeurs, enfin que la souveraineté se redéfinit comme maîtrise des dépendances critiques plutôt que comme autarcie. L’arsenalisation, les matériaux critiques et les dépendances immatérielles sont les notions décisives. Éviter de conclure par un simple appel à l’équilibre.", "intro": "La mondialisation met en présence deux logiques que rien ne garantit compatibles : celle de l’État, qui exerce son autorité sur un territoire fixe, et celle de la firme globale, qui arbitre entre territoires et peut déplacer ses implantations. Le chapitre formule cette opposition comme une tension fondamentale entre la souveraineté de l’État et la mobilité de la firme. Les épisodes récents de rupture d’approvisionnement l’ont rendue concrète : une économie peut détenir toutes les compétences juridiques et rester incapable de produire faute d’un composant venu d’ailleurs. La souveraineté économique se définira ici comme la capacité d’un État à décider de ses orientations économiques sans y être contraint par des dépendances extérieures.", "problematique": "L’intégration économique internationale prive-t-elle les États de leur capacité de décision, ou les conduit-elle à redéfinir la souveraineté comme maîtrise des dépendances plutôt que comme autonomie complète ?", "plan": ["I. L’ouverture contraint effectivement l’exercice de la souveraineté", "A. La mobilité des firmes limite les politiques nationales", "1) L’IDE est par nature délocalisable : créer une usine ailleurs ou implanter une filiale relève d’un arbitrage permanent.", "2) Les États cherchent dès lors à conserver les entreprises, attirer les IDE et empêcher certaines délocalisations.", "3) Cette recherche d’attractivité pèse sur la fiscalité, la réglementation et le droit du travail.", "B. La fragmentation productive crée des dépendances techniques", "1) Le second dégroupage de Baldwin répartit les étapes d’un même processus productif entre plusieurs pays.", "2) Un matériau critique est indispensable, difficilement substituable et concentré chez un petit nombre de fournisseurs : lithium, terres rares, cobalt, nickel, certains semi-conducteurs.", "3) Une interruption d’approvisionnement peut alors perturber des secteurs entiers, indépendamment de toute décision nationale.", "C. L’ouverture financière contraint également les politiques économiques", "1) L’hypermondialisation se caractérise par une mobilité financière massive, multidirectionnelle et volatile.", "2) Le choc Volcker de 1979 l’a montré : la hausse des taux américains rapatrie les capitaux et précipite la crise de la dette latino-américaine.", "3) Une économie endettée en devises subit simultanément la hausse des taux et la dépréciation de sa monnaie.", "II. Mais les États conservent des instruments décisifs", "A. Ils disposent d’un pouvoir normatif réel", "1) Le droit de la concurrence, la fiscalité et la régulation sectorielle s’appliquent sur le territoire quel que soit le siège de la firme.", "2) Le Digital Markets Act régule ex ante les plateformes structurantes, y compris non européennes.", "3) Le contrôle des concentrations permet d’interdire une opération, comme l’a montré le refus de la fusion Alstom-Siemens en 2019.", "B. Ils peuvent convertir l’économie en instrument de puissance", "1) L’arsenalisation de la politique économique consiste à employer des instruments économiques comme des armes.", "2) Droits de douane, sanctions, restrictions technologiques, contrôle des exportations et restrictions aux investissements en composent la panoplie.", "3) L’objectif peut être de ralentir la montée en gamme d’un rival, ce qu’aucune firme ne pourrait accomplir seule.", "C. Certaines positions confèrent une marge de manœuvre supplémentaire", "1) Le dollar occupe une place centrale dans le système monétaire international et les titres publics américains sont très recherchés.", "2) Le privilège exorbitant permet aux États-Unis d’emprunter dans leur propre monnaie, ce qui allège fortement la contrainte extérieure.", "3) La taille du marché constitue en elle-même un instrument de négociation, ce que l’Europe exploite par sa capacité normative.", "III. La souveraineté se redéfinit dès lors comme maîtrise des dépendances", "A. L’autarcie n’est ni possible ni souhaitable", "1) Renoncer à la spécialisation reviendrait à renoncer aux gains établis depuis Ricardo.", "2) Certaines compétences industrielles perdues ne se reconstituent ni rapidement ni à volonté.", "3) Une chaîne entièrement nationale peut d’ailleurs être plus vulnérable si le choc frappe le territoire lui-même.", "B. La réponse réaliste consiste à réduire les dépendances critiques", "1) Diversifier les fournisseurs réduit l’exposition sans abandonner la division internationale du travail.", "2) Les stocks stratégiques atténuent les ruptures temporaires sur les intrants indispensables.", "3) Les dépendances immatérielles — technologies, logiciels, brevets, infrastructures numériques — exigent un effort spécifique de recherche.", "C. Cette redéfinition suppose une coordination politique", "1) Giraud décrit une généralisation des compétitions qui met les territoires en concurrence, y compris alliés entre eux.", "2) La concurrence fiscale interne affaiblit la capacité collective à financer ce que la souveraineté exige.", "3) La relocalisation sélective des secteurs stratégiques traduit cet arbitrage nouveau entre efficacité et résilience."], "conclusion": "L’ouverture contraint réellement la souveraineté : la mobilité de la firme globale limite l’autonomie fiscale et réglementaire, la fragmentation productive crée des dépendances sur des matériaux critiques, et la mobilité des capitaux expose à des retournements dont le choc Volcker de 1979 a donné la mesure. Mais les États conservent des instruments décisifs — pouvoir normatif, contrôle des concentrations, arsenalisation des politiques économiques — et ces instruments sont d’autant plus efficaces que le marché est vaste ou la monnaie dominante. La compatibilité n’est donc ni acquise ni impossible : elle suppose d’abandonner l’idée d’une souveraineté comme autonomie complète au profit d’une souveraineté comme maîtrise des dépendances critiques. Ce déplacement est précisément ce que traduit le mouvement actuel de relocalisation sélective."}}, MOB = {"10": {"1": "Ch. 10 (Weber, rationalisation, bureaucratie ; Crozier, zone d’incertitude) · Ch. 9 (rationalité limitée, théories de la firme) · Ch. 4 (rationalité du producteur) · Ch. 8 (organisation du travail) · Auteurs : Weber, Simon, Crozier, Morel, Bronner", "2": "Ch. 10 (bureaucratie wébérienne, cercle vicieux, monde formel/informel) · Ch. 9 (coûts de transaction, hiérarchie) · Ch. 8 (taylorisme, formes U et M) · Auteurs : Weber (L’Éthique protestante, 1905), Crozier (Le Phénomène bureaucratique, 1963)", "3": "Ch. 10 (holisme et individualisme méthodologiques, fait social, action sociale) · Ch. 3 (méthode et courants en économie) · Ch. 4 (individualisme méthodologique) · Auteurs : Durkheim (Les Règles de la méthode sociologique, 1895), Weber", "4": "Ch. 10 (Crozier, analyse stratégique, SEITA, sources de pouvoir) · Ch. 9 (théorie de l’agence, gouvernance) · Ch. 8 (managers, actionnaires) · Auteurs : Crozier et Friedberg (L’Acteur et le système, 1977), Marx, Weber", "5": "Ch. 10 (Morel, décisions absurdes, métarègles ; Asch, Janis) · Ch. 9 (rationalité limitée, Simon) · Ch. 4 (rationalité du décideur) · Auteurs : Morel, Asch (1951), Janis (Groupthink, 1982), Kahneman, Simon", "6": "Ch. 10 (Bronner, marché cognitif, avarice cognitive, loi de Brandolini) · Ch. 8 (plateformes, capitalisme numérique) · Ch. 9 (pouvoir des plateformes, DMA) · Auteurs : Bronner (La Démocratie des crédules, 2013 ; Apocalypse cognitive, 2021), Kahneman", "7": "Ch. 10 (Durkheim, intégration et régulation ; Castel, désaffiliation) · Ch. 1 (revenu, pauvreté monétaire) · Ch. 8 (salariat, précarisation) · Ch. 7 (inégalités) · Auteurs : Durkheim (De la division du travail social, 1893), Castel (Les Métamorphoses de la question sociale, 1995), Aubenas (Le Quai de Ouistreham, 2010)", "8": "Ch. 10 (solidarités mécanique et organique, anomie, groupe professionnel) · Ch. 8 (division du travail, industrialisation) · Ch. 3 (Smith, division du travail) · Auteurs : Durkheim (De la division du travail social, 1893), Smith", "9": "Ch. 10 (chômage BIT, catégories France Travail, halo du chômage, désaffiliation) · Ch. 1 (revenu, pauvreté) · Ch. 6 (croissance et emploi) · Ch. 7 (inégalités) · Auteurs : Castel, Aubenas", "10": "Ch. 10 (syndicats, taux de syndicalisation, institutionnalisation des conflits) · Ch. 8 (désindustrialisation, monde ouvrier) · Ch. 2ᵉ année ch. 1 (mondialisation, ubérisation) · Auteurs : Durkheim (groupe professionnel), Castel", "11": "Ch. 10 (coopération et conflit, interdépendance, Crozier) · Ch. 9 (théorie de l’agence, nœud de contrats) · Ch. 8 (gouvernance, parties prenantes) · Auteurs : Crozier, Durkheim, Alchian et Demsetz, Jensen et Meckling", "12": "Ch. 10 (conformisme d’Asch, Groupthink de Janis, métarègles de Morel) · Ch. 9 (décision en organisation) · Ch. 4 (rationalité) · Auteurs : Asch (1951), Janis (1982), Morel, Kahneman", "13": "Ch. 10 (idéal-type, bureaucratie, cercle vicieux bureaucratique) · Ch. 9 (hiérarchie et coûts de transaction) · Ch. 3 (méthode et abstraction) · Auteurs : Weber, Crozier (Le Phénomène bureaucratique, 1963 ; L’Acteur et le système, 1977)", "14": "Ch. 10 (rationalisation, désenchantement du monde, cage d’acier) · Ch. 8 (industrialisation, taylorisme) · Ch. 6 (progrès technique) · Ch. 3 (modernité et pensée économique) · Auteurs : Weber (L’Éthique protestante et l’esprit du capitalisme, 1905)", "15": "Ch. 10 (Mayo, effet Hawthorne, École des relations humaines) · Ch. 8 (taylorisme, fordisme, toyotisme) · Ch. 6 (productivité) · Auteurs : Mayo (The Human Problems of an Industrial Civilization, 1933), Taylor", "16": "Ch. 10 (Crozier, marges de manœuvre, zone d’incertitude ; conformisme) · Ch. 9 (rationalité limitée) · Ch. 8 (organisation du travail) · Auteurs : Crozier, Simon, Asch, Morel", "17": "Ch. 10 (société salariale, flexibilité, précarisation, désaffiliation) · Ch. 8 (salariat, protection sociale) · Ch. 1 (revenu, pauvreté laborieuse) · Ch. 7 (inégalités) · Auteurs : Castel (Les Métamorphoses de la question sociale, 1995), Aubenas", "18": "Ch. 10 (monde ouvrier, désindustrialisation, Simone Weil) · Ch. 8 (révolutions industrielles, taylorisme) · Ch. 6 (tertiarisation) · 2ᵉ année ch. 1 (mondialisation et délocali u et Robinson", "8": "2ᵉ année ch. 1 (FMN, firme globale, arsenalisation) · Ch. 9 (concentration, pouvoir de marché, DMA) · Ch. 8 (gouvernance, capitalisme) · Auteurs : Michalet, Giraud", "9": "2ᵉ année ch. 1 (déplacement du centre de gravité, BRICS, privilège exorbitant) · Ch. 7 (émergents, rattrapage) · Ch. 6 (croissance comparée) · Auteurs : Michalet, Giraud, Milanovic", "10": "2ᵉ année ch. 1 (balance des paiements, comptes courant et financier) · Ch. 2 (financement de l’économie) · Ch. 1 (épargne, capacité de financement) · Auteurs : Hélène Rey", "11": "2ᵉ année ch. 1 (déséquilibres mondiaux, déficits jumeaux, position extérieure) · Ch. 2 (globalisation financière) · Ch. 6 (croissance déséquilibrée) · Auteurs : Hélène Rey, Volcker (choc de 1979)", "12": "2ᵉ année ch. 1 (première mondialisation, étalon-or, migrations, DIPP) · Ch. 8 (révolutions industrielles) · Ch. 2 (systèmes monétaires) · Auteurs : Bairoch, Baldwin, Béraud", "13": "2ᵉ année ch. 1 (stratégies d’insertion, montée en gamme, malédiction des ressources) · Ch. 7 (stratégies de développement, institutions) · Ch. 9 (montée en gamme des firmes) · Auteurs : Prebisch, Acemoglu et Robinson, Nurkse", "14": "2ᵉ année ch. 1 (courbe de l’éléphant, inégalités entre et dans les pays) · Ch. 7 (inégalités, IDH) · Ch. 1 (revenu, redistribution) · Ch. 10 (précarisation) · Auteurs : Milanovic, Piketty, Stolper et Samuelson", "15": "2ᵉ année ch. 1 (ouverture financière, IDE, capitaux de portefeuille) · Ch. 2 (financement, crises financières) · Ch. 6 (investissement et croissance) · Auteurs : Béraud, Nurkse, Hélène Rey", "16": "2ᵉ année ch. 1 (Giraud, compétition des territoires, attractivité) · Ch. 9 (firmes globales, arbitrage entre sites) · Ch. 1 (fiscalité, État) · Auteurs : Giraud, Michalet", "17": "2ᵉ année ch. 1 (protectionnisme éducateur, entre-deux-guerres, souveraineté) · Ch. 3 (libre-échange, classiques) · Ch. 7 (stratégies de développement) · Auteurs : List (1841), Bairoch, Ricardo", "18": "2ᵉ année ch. 1 ( function appliquer(){
  if(typeof SUBJECTS_BANK_PREMIUM === 'undefined') return false;
  var nc = 0, nm = 0, na = 0;
  SUBJECTS_BANK_PREMIUM.forEach(function(s){
    var cle = String(s.chapter);
    /* 1. chapitres 9, 10 et 2e annee ch.1 : corriges entierement refondus */
    var r = NEW[s.id];
    if(r){
      if(MOB[cle] && MOB[cle][String(s.num)]) s.mobiliser = MOB[cle][String(s.num)];
      else if(r.mobiliser) s.mobiliser = r.mobiliser;
      s.commentaire  = r.commentaire;
      s.intro        = r.intro;
      s.problematique= r.problematique;
      s.plan         = r.plan;
      s.conclusion   = r.conclusion;
      nc++;
      return;
    }
    /* 2. filet de securite : chapitres a mobiliser analyses */
    if(MOB[cle] && MOB[cle][String(s.num)]){
      s.mobiliser = MOB[cle][String(s.num)];
      nm++;
      return;
    }
    /* 3. chapitres 1 a 8 : ajout transversal cible */
    var base = String(s.mobiliser || '').trim();
    if(base && /^[0-9,\s]+$/.test(base)){ base = 'Ch. ' + base.replace(/\s+/g,' '); s.mobiliser = base; }
    var add = ADD18[s.id];
    if(add && s.mobiliser.indexOf(add) === -1){
      s.mobiliser = base ? (base + ' \u00b7 ' + add) : add;
      na++;
    }
  });
  window.__ECO_MAJ_SUJ2_STATS = {corriges:nc, mobiliser:nm, enrichis:na};
  return true;
}
function rafraichir(){
  try{ if(typeof window.renderSubjectsPremium === 'function') window.renderSubjectsPremium(); }catch(e){}
}
function boot(){ if(appliquer()) rafraichir(); }
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
setTimeout(boot, 900);
setTimeout(boot, 2400);
if(typeof window.showPg === 'function'){
  var old = window.showPg;
  window.showPg = function(pg){
    var r = old.apply(this, arguments);
    if(pg === 'subjects'){ try{ appliquer(); setTimeout(rafraichir, 40); }catch(e){} }
    return r;
  };
}
})();
