ation procurent main-d’œuvre qualifiée, fournisseurs proches et diffusion des savoir-faire.", "3) La Silicon Valley en constitue l’exemple contemporain le plus célèbre.", "II. Mais l’intégration conserve ses raisons d’être", "A. Les coûts de transaction justifient la hiérarchie", "1) Coase établit dès 1937 que le recours au marché a un coût de recherche, de négociation et de contrôle.", "2) Williamson montre que la rationalité limitée et l’opportunisme rendent le contrat risqué.", "3) Internaliser reste préférable lorsque les actifs sont spécifiques à la relation.", "B. Chandler décrit des structures adaptées à la taille", "1) La forme U, fonctionnelle, convient aux entreprises de taille modeste.", "2) La forme M, multidivisionnelle, devient nécessaire avec la croissance et la diversification.", "3) Ces structures montrent que la grande entreprise a su se réorganiser plutôt que disparaître.", "C. Le réseau crée ses propres dépendances", "1) Le coordinateur impose ses conditions à des partenaires plus petits et moins diversifiés.", "2) La perte d’un donneur d’ordres peut menacer l’existence d’un sous-traitant.", "3) Les ruptures d’approvisionnement récentes ont révélé la fragilité de ces chaînes.", "III. Les deux formes coexistent et se combinent", "A. Une coexistence documentée", "1) François et Lemercier distinguent entreprises distribuées et entreprises intégrées.", "2) Les deux formes répondent à des contraintes différentes de coût, de contrôle et d’incertitude.", "3) Aucune ne s’est substituée à l’autre dans le capitalisme contemporain.", "B. Des modèles hybrides s’imposent", "1) Amazon combine intégration verticale — logistique, stockage, distribution — et plateforme ouverte à d’autres vendeurs.", "2) L’entreprise choisit d’intégrer là où l’incertitude est forte et d’externaliser ailleurs.", "3) La frontière de la firme devient mobile et se redéfinit en permanence.", "C. La relocalisation réactive l’intégration", "1) Les dépendances critiques révélées par les chaînes de valeur remettent la sécurité au premier plan.", "2) Certaines productions stratégiques sont réintégrées malgré un coût supérieur.", "3) L’arbitrage de Williamson se rejoue donc sur un critère nouveau, celui de la robustesse."], "conclusion": "La firme-réseau introduit une flexibilité et un ancrage territorial que l’entreprise intégrée n’offre pas, et la fragmentation productive lui a donné une place centrale. Mais elle ne remplace pas le modèle hiérarchique, dont les coûts de transaction continuent de justifier l’existence. Le cas d’Amazon montre que les deux logiques se combinent, et les ruptures récentes des chaînes de valeur réactivent même l’argument de l’intégration."}, "ch9-17": {"title": "Le démantèlement est-il une solution efficace contre les monopoles ?", "mobiliser": "Ch. 9 (antitrust, démantèlement, contrôle des concentrations) · Ch. 5 (monopole naturel) · Ch. 8 (capitalisme industriel) · 2ᵉ année ch. 1 (régulation des acteurs mondiaux)", "commentaire": "Il faut nuancer par l’ironie historique : les sociétés issues du démantèlement de la Standard Oil refusionnent dans les années 1990. Le sujet oppose une sanction structurelle, spectaculaire mais réversible, et des instruments préventifs. AT&T et Microsoft fournissent les autres cas. Le monopole naturel rappelle qu’il existe des situations où le démantèlement serait contre-productif.", "intro": "Le démantèlement consiste à découper une entreprise dominante en plusieurs sociétés indépendantes. Appliqué à la Standard Oil de John D. Rockefeller en 1911, il constitue l’arme ultime des autorités de la concurrence et le symbole de la puissance publique face aux trusts. Son efficacité dans la durée est pourtant discutée : dans les années 1990, plusieurs sociétés issues de ce démantèlement ont refusionné dans un contexte de mondialisation.", "problematique": "Le démantèlement permet-il de restaurer durablement la concurrence sur un marché dominé ?", "plan": ["I. Une arme puissante et dissuasive", "A. Une action directe sur la structure du marché", "1) Le pouvoir de marché est fractionné entre plusieurs entités désormais autonomes.", "2) La sanction atteint la position elle-même et non seulement le comportement.", "3) Le démantèlement de la Standard Oil en 1911 demeure la référence historique de cette logique.", "B. Une menace qui infléchit les comportements", "1) AT&T a été effectivement démantelé, ce qui a constitué un précédent majeur.", "2) Microsoft y a échappé de peu dans les années 1990, mais la perspective a pesé sur ses pratiques.", "3) L’existence même de cette sanction exerce un effet dissuasif sur les firmes dominantes.", "C. Une réponse aux positions inexpugnables", "1) Lorsque les barrières à l’entrée sont infranchissables, la sanction comportementale ne suffit plus.", "2) Les amendes peuvent être absorbées comme un simple coût d’exploitation.", "3) Seule une intervention structurelle rouvre alors la possibilité d’une concurrence effective.", "II. Mais une efficacité limitée dans le temps", "A. Les refusions annulent partiellement l’effet", "1) Dans les années 1990, plusieurs sociétés issues du démantèlement de Rockefeller se sont regroupées.", "2) La mondialisation a fourni le motif de ces rapprochements, au nom de la taille critique.", "3) La structure démantelée tend donc à se reconstituer si les forces économiques demeurent.", "B. Les logiques de concentration persistent", "1) Les économies d’échelle continuent de rendre la grande taille avantageuse.", "2) Les effets de réseau produisent une reconcentration rapide dans le numérique.", "3) Le démantèlement traite le symptôme sans modifier les déterminants de la concentration.", "C. Une sanction lourde et risquée", "1) Elle peut détruire des synergies productives réelles et des économies d’échelle légitimes.", "2) Elle serait contre-productive dans un monopole naturel, où la duplication est inefficace.", "3) Sa mise en œuvre est longue, complexe et juridiquement incertaine.", "III. Les instruments préventifs sont désormais privilégiés", "A. Agir en amont plutôt qu’en aval", "1) Le contrôle des concentrations examine les fusions avant qu’elles ne créent la position dominante.", "2) La définition du marché pertinent y est décisive, comme l’a montré l’affaire Alstom-Siemens.", "3) Empêcher la formation du problème coûte moins que le défaire ensuite.", "B. Détecter et sanctionner les comportements", "1) La procédure de clémence permet de révéler les cartels secrets en incitant à la dénonciation.", "2) L’abus de position dominante est sanctionné sans remettre en cause l’existence de la firme.", "3) L’approche par la contestabilité oriente l’action vers la levée des barrières à l’entrée.", "C. La régulation ex ante complète l’arsenal", "1) Le Digital Markets Act interdit certaines pratiques par principe aux plateformes structurantes.", "2) Il agit en continu plutôt qu’au terme de procédures longues.", "3) Il vise à restaurer la contestabilité sans recourir au découpage des entreprises."], "conclusion": "Le démantèlement modifie directement la structure du marché et exerce un effet dissuasif réel, comme l’attestent les cas de la Standard Oil, d’AT&T et de Microsoft. Mais son efficacité s’érode : les refusions des années 1990 rappellent que les forces économiques de concentration persistent après la sanction. C’est pourquoi les autorités privilégient désormais la prévention — contrôle des concentrations, clémence, régulation ex ante — plutôt que cette arme lourde et réversible."}, "ch9-15": {"title": "Les effets d’agglomération expliquent-ils la localisation des entreprises ?", "mobiliser": "Ch. 9 (districts industriels, Marshall, agglomération) · Ch. 6 (croissance endogène, externalités) · Ch. 8 (industrialisation, territoires) · 2ᵉ année ch. 1 (DIPP, délocalisation, attractivité)", "commentaire": "Marshall et les districts industriels sont attendus, avec la Silicon Valley comme exemple contemporain. Le piège serait de s’en tenir aux avantages : la mondialisation autorise l’éclatement des activités, et l’agglomération crée ses propres fragilités. Le sujet appelle donc une réponse nuancée où la proximité explique beaucoup sans tout expliquer.", "intro": "La proximité géographique renforce les réseaux d’entreprises. Alfred Marshall l’avait déjà observé dans ses Principes d’économie politique publiés en 1890, en décrivant les districts industriels : des concentrations locales d’entreprises spécialisées bénéficiant d’une main-d’œuvre, de savoir-faire et de fournisseurs communs. La Silicon Valley en constitue aujourd’hui l’illustration la plus célèbre. Pourtant, la fragmentation internationale de la production disperse au contraire les activités.", "problematique": "Dans quelle mesure la concentration géographique des activités procure-t-elle des avantages décisifs de localisation ?", "plan": ["I. Des avantages économiques bien identifiés", "A. Un marché du travail spécialisé", "1) La main-d’œuvre qualifiée est disponible localement, ce qui réduit les coûts et délais de recrutement.", "2) Les salariés trouvent plus facilement un autre employeur, ce qui les attire vers le territoire.", "3) Les savoir-faire se transmettent par la mobilité des personnes entre entreprises voisines.", "B. Un tissu dense de fournisseurs", "1) La proximité des sous-traitants réduit les coûts logistiques et les délais de production.", "2) Elle facilite les ajustements rapides en cas de variation de la demande.", "3) Les relations répétées réduisent les coûts de transaction et limitent l’opportunisme.", "C. Une diffusion rapide de l’innovation", "1) Les échanges informels accélèrent la circulation des connaissances techniques.", "2) Les externalités de connaissance profitent à l’ensemble du district sans contrepartie marchande.", "3) La croissance endogène montre que ces externalités entretiennent durablement la productivité.", "II. Mais une explication partielle de la localisation", "A. D’autres facteurs pèsent lourdement", "1) Les coûts de production, les salaires et la fiscalité orientent fortement les choix d’implantation.", "2) L’accès au marché final peut primer sur la proximité des concurrents.", "3) Les infrastructures et la stabilité institutionnelle conditionnent l’attractivité d’un territoire.", "B. La mondialisation autorise l’éclatement", "1) La décomposition internationale des processus productifs répartit les étapes entre plusieurs pays.", "2) Chaque module est localisé là où les conditions de coût ou de compétence sont les meilleures.", "3) La baisse des coûts de transport et de communication a rendu cette dispersion possible.", "C. La firme-réseau relativise la proximité physique", "1) La coordination contractuelle peut s’exercer à distance, sans colocalisation.", "2) Les outils numériques réduisent le besoin de contacts directs pour de nombreuses activités.", "3) Le district cède alors la place à une chaîne de valeur étendue à l’échelle mondiale.", "III. Une concentration qui comporte aussi des risques", "A. Une dépendance territoriale", "1) Une crise sectorielle frappe simultanément toutes les entreprises du district.", "2) La spécialisation locale réduit la capacité de reconversion du territoire.", "3) La désindustrialisation a durement touché les bassins les plus spécialisés.", "B. Des coûts locaux croissants", "1) Le succès du district renchérit le foncier et les salaires.", "2) Ces hausses peuvent chasser les activités les moins rentables.", "3) La Silicon Valley illustre cette tension entre attractivité et coût de la localisation.", "C. Un arbitrage désormais réévalué", "1) Les ruptures d’approvisionnement ont révélé les vulnérabilités des chaînes dispersées.", "2) La relocalisation de productions stratégiques réintroduit un critère de sécurité.", "3) La proximité redevient un argument, non plus d’efficacité seulement, mais de robustesse."], "conclusion": "Les effets d’agglomération procurent des avantages substantiels — main-d’œuvre spécialisée, fournisseurs proches, diffusion rapide de l’innovation — que Marshall avait identifiés dès 1890. Ils n’expliquent pourtant pas seuls la localisation : coûts, accès aux marchés et fragmentation internationale pèsent tout autant, et la concentration territoriale engendre ses propres fragilités. Les ruptures récentes des chaînes de valeur redonnent néanmoins à la proximité une valeur de robustesse."}, "ch9-16": {"title": "La concentration des entreprises menace-t-elle la démocratie ?", "mobiliser": "Ch. 9 (risques fiscal, économique et politique, DMA) · Ch. 10 (pouvoir, information, Bronner) · Ch. 1 (État, fiscalité) · Ch. 7 (inégalités) · 2ᵉ année ch. 1 (souveraineté numérique, GAFAM)", "commentaire": "Sujet à forte dimension politique. Il faut mobiliser les trois risques identifiés dans le chapitre — fiscal, économique et politique — puis montrer que l’enjeu démocratique tient surtout au contrôle de l’information. Bronner apporte le marché cognitif. Le piège serait de rester dans l’indignation : il faut montrer des mécanismes et rappeler les instruments de réponse.", "intro": "Les très grandes entreprises ne se contentent pas d’occuper des positions économiques dominantes : elles pèsent sur les finances publiques, sur la structure des marchés et sur le débat public. Plusieurs auteurs contemporains alertent sur les dérives du capitalisme numérique, où le contrôle des données et des flux d’information se concentre entre quelques mains. La question dépasse alors l’efficacité économique pour atteindre les conditions mêmes de la délibération démocratique.", "problematique": "Le pouvoir acquis par les très grandes entreprises constitue-t-il une menace pour le fonctionnement démocratique ?", "plan": ["I. Un pouvoir qui excède le champ économique", "A. Un risque fiscal", "1) L’optimisation fiscale réduit les recettes publiques et les marges de manœuvre des États.", "2) La mobilité des profits complique l’assiette de l’impôt pour les activités immatérielles.", "3) La concurrence fiscale entre territoires accentue ce déséquilibre.", "B. Un risque économique", "1) Les barrières à l’entrée freinent la dynamique concurrentielle et figent les positions.", "2) La dépendance des partenaires et des sous-traitants s’accroît avec la taille du donneur d’ordres.", "3) La contestabilité s’effondre là où les effets de réseau sont les plus puissants.", "C. Un risque politique", "1) Le lobbying pèse sur l’élaboration des règles qui encadrent ces mêmes entreprises.", "2) Certaines firmes exercent des fonctions — infrastructures, satellites, paiements — relevant historiquement des États.", "3) Leur influence peut ainsi concurrencer la décision publique.", "II. Un enjeu proprement démocratique : le contrôle de l’information", "A. Les plateformes structurent l’espace public", "1) Elles maîtrisent les flux d’information et les modalités de leur diffusion.", "2) Gérald Bronner montre que ce marché cognitif dérégulé favorise les contenus les plus attractifs.", "3) Les logiques d’audience et les algorithmes orientent ce qui devient visible.", "B. La délibération collective s’en trouve affectée", "1) L’insularité cognitive enferme les individus dans des chambres d’écho.", "2) Le biais de confirmation y renforce les opinions préexistantes.", "3) La loi de Brandolini rappelle qu’il est bien plus coûteux de réfuter une fausse information que de la produire.", "C. La souveraineté devient un enjeu public", "1) La souveraineté numérique désigne la capacité d’un État à maîtriser technologies, données et infrastructures.", "2) La dépendance à des acteurs étrangers réduit l’autonomie de décision publique.", "3) L’arsenalisation de la politique économique transforme ces dépendances en leviers de rapport de force.", "III. Des réponses existent, mais leur portée est incertaine", "A. Les instruments classiques conservent leur utilité", "1) Les lois antitrust et le contrôle des concentrations encadrent la formation des positions dominantes.", "2) La sanction de l’abus de position dominante demeure un instrument effectif.", "3) Le démantèlement reste disponible, malgré ses limites démontrées.", "B. La régulation ex ante change d’échelle", "1) Le Digital Markets Act vise explicitement les plateformes structurantes.", "2) Il interdit certaines pratiques par principe plutôt qu’après constat d’abus.", "3) Il assortit ces interdictions de sanctions financières élevées.", "C. L’efficacité dépend de la coordination internationale", "1) Une régulation régionale se heurte à des acteurs de dimension mondiale.", "2) Les divergences entre États-Unis, Union européenne et Chine limitent la portée des règles.", "3) L’enjeu démocratique excède donc les seuls instruments de la politique de concurrence."], "conclusion": "La concentration produit des risques fiscaux et économiques documentés, mais l’enjeu le plus lourd est politique : le contrôle des données et des flux d’information par quelques acteurs affecte les conditions de la délibération collective. Les instruments classiques de la concurrence restent utiles et le Digital Markets Act marque un tournant, mais leur efficacité dépendra d’une coordination internationale encore incertaine."}, "ch9-19": {"title": "La taille de l’entreprise détermine-t-elle son organisation ?", "mobiliser": "Ch. 9 (Chandler, formes U et M, PME/ETI) · Ch. 8 (taylorisme, toyotisme, organisation du travail) · Ch. 10 (Crozier, bureaucratie, rationalité limitée) · 2ᵉ année ch. 1 (firmes globales, DIPP)", "commentaire": "Chandler est central avec les formes U et M. Il faut aussi mobiliser taylorisme et toyotisme comme rationalités productives distinctes, puis montrer que la stratégie et l’environnement pèsent autant que la dimension. Crozier apporte la limite décisive : l’organisation réelle s’écarte toujours de l’organigramme, quelle que soit la taille.", "intro": "Une petite entreprise ne s’organise pas comme un grand groupe : les circuits de décision, la répartition des responsabilités et les modes de contrôle y diffèrent profondément. Alfred Chandler a montré que la croissance et la diversification imposent des transformations structurelles, avec le passage de la forme fonctionnelle à la forme multidivisionnelle. La taille apparaît ainsi comme un déterminant majeur, sans pour autant épuiser l’explication.", "problematique": "Dans quelle mesure la croissance de l’entreprise commande-t-elle son mode d’organisation ?", "plan": ["I. La taille impose des structures nouvelles", "A. De la forme U à la forme M", "1) La forme U est fonctionnelle : elle structure l’entreprise par grands métiers, production, commercial, finance.", "2) Elle convient aux entreprises de taille modeste dont l’activité reste homogène.", "3) La forme M est multidivisionnelle : elle organise le groupe par produits ou par zones géographiques.", "B. La diversification appelle la décentralisation", "1) Les divisions gagnent en autonomie opérationnelle à mesure que les activités se différencient.", "2) La direction générale se recentre sur la stratégie et l’allocation du capital.", "3) Le conglomérat pousse cette logique à son terme, au risque de la décote de conglomérat.", "C. La coordination devient elle-même un coût", "1) Les coûts d’organisation interne croissent avec la taille et le nombre d’échelons.", "2) Williamson montre que ce coût borne l’avantage de l’internalisation.", "3) Au-delà d’un seuil, externaliser redevient préférable à intégrer.", "II. Mais le mode de production pèse tout autant", "A. Deux rationalités productives distinctes", "1) Le taylorisme sépare conception et exécution et fonde l’organisation scientifique du travail.", "2) Le toyotisme mise sur la polyvalence, la qualité totale et le juste-à-temps.", "3) Ces modèles s’appliquent à des entreprises de tailles très différentes.", "B. La technologie structure l’organisation", "1) L’intensité capitalistique conditionne le degré de standardisation des tâches.", "2) Le numérique permet une coordination à distance qui réduit le besoin d’échelons intermédiaires.", "3) La production modulaire dissocie organisation interne et frontière juridique de la firme.", "C. La stratégie précède parfois la structure", "1) Le choix d’internaliser ou d’externaliser dépend des coûts de transaction, non de la seule dimension.", "2) La firme-réseau coordonne par contrat un ensemble d’entreprises de tailles diverses.", "3) Apple illustre une organisation mondiale reposant sur des partenaires qu’elle ne possède pas.", "III. L’organisation réelle échappe partiellement à la structure formelle", "A. Crozier distingue deux mondes", "1) Le monde formel est celui de l’organigramme et des règles écrites.", "2) Le monde informel est celui des relations réelles et des arrangements quotidiens.", "3) L’écart entre les deux existe dans les petites comme dans les grandes structures.", "B. Les acteurs disposent de marges de manœuvre", "1) La maîtrise d’une zone d’incertitude confère du pouvoir indépendamment du rang hiérarchique.", "2) L’enquête sur la SEITA montre des ouvriers d’entretien en position décisive.", "3) L’organisation est donc un jeu d’acteurs autant qu’un dispositif structurel.", "C. La rationalité organisationnelle reste limitée", "1) Herbert Simon montre que les décisions se prennent en information incomplète.", "2) Le cercle vicieux bureaucratique produit de la rigidité indépendamment de la forme retenue.", "3) Aucune structure ne garantit donc à elle seule l’efficacité du fonctionnement réel."], "conclusion": "La taille commande largement l’organisation, comme l’illustre le passage de la forme U à la forme M décrit par Chandler, et la coordination devient elle-même un coût qui borne la croissance. Mais le mode de production, la technologie et la stratégie pèsent tout autant, et Crozier rappelle que l’organisation réelle s’écarte toujours de l’organigramme. La structure résulte donc d’un arbitrage, non d’une contrainte mécanique de dimension."}, "ch9-20": {"title": "Que nous apprend l’entreprise sur la méthode des économistes ?", "mobiliser": "Ch. 9 (théories de la firme, modèle SCP, abstraction) · Ch. 3 (courants, méthode en économie) · Ch. 4 (modélisation, hypothèses) · Ch. 10 (démarche sociologique, idéal-type) · Ch. 6 (théories concurrentes)", "commentaire": "Sujet réflexif, à traiter comme une conclusion de chapitre. Il faut montrer la démarche : observer des régularités, construire des concepts transposables, puis en mesurer la limite. La théorie de l’agence sert d’exemple de généralisation réussie. Le modèle SCP illustre au contraire le risque du déterminisme. Ne pas transformer le sujet en dissertation d’épistémologie déconnectée du chapitre.", "intro": "L’entreprise n’est pas seulement un objet d’étude : la manière dont les économistes l’analysent révèle leur méthode. Face au même objet, la théorie néoclassique voit un automate combinant capital et travail, l’approche contractuelle un nœud de contrats, l’approche transactionnelle une alternative au marché. Cette pluralité d’interprétations d’un même phénomène éclaire la façon dont la science économique construit ses concepts et en éprouve la portée.", "problematique": "En quoi l’analyse de l’entreprise éclaire-t-elle la démarche même de la science économique ?", "plan": ["I. Une démarche de généralisation à partir de l’observation", "A. Partir de régularités observées", "1) Les économistes repèrent des comportements récurrents : concentration, ententes, barrières à l’entrée.", "2) L’étude de Combe sur 111 cartels entre 1969 et 2009 illustre cette démarche empirique.", "3) Le cas particulier devient alors matériau pour une analyse plus générale.", "B. Construire des concepts transposables", "1) Les coûts de transaction, forgés par Coase puis Williamson, dépassent le seul cas de la firme.", "2) L’asymétrie d’information s’applique à l’assurance, au crédit ou au marché du travail.", "3) La théorie de l’agence, née du rapport actionnaire-manager, éclaire toute relation principal-agent.", "C. Formaliser pour comparer", "1) L’indice de Lerner permet de mesurer le pouvoir de marché indépendamment du secteur.", "2) Le modèle SCP fournit une grille commune applicable à des industries très différentes.", "3) La formalisation rend possible la comparaison et le test des hypothèses.", "II. Mais une méthode qui comporte ses limites", "A. Le risque de l’abstraction excessive", "1) La firme néoclassique réduite à une fonction de production néglige l’organisation réelle.", "2) Le modèle SCP impose une causalité unilatérale que les faits démentent.", "3) L’abstraction facilite le raisonnement mais peut écraser la diversité des situations.", "B. Les hypothèses conditionnent les conclusions", "1) La rationalité parfaite conduit à des résultats que la rationalité limitée invalide.", "2) Herbert Simon montre que relâcher cette hypothèse change l’analyse de fond en comble.", "3) Le choix des hypothèses est donc un acte théorique, non une simple commodité technique.", "C. Les approches concurrentes coexistent durablement", "1) Approche contractuelle et approche transactionnelle ne se sont pas départagées.", "2) Chacune éclaire une dimension différente du même objet.", "3) Le désaccord entre écoles n’est donc pas un échec mais un mode de progression.", "III. Une démarche qui gagne à s’ouvrir aux autres sciences sociales", "A. La sociologie éclaire ce que l’économie modélise", "1) Crozier montre par l’enquête ce que les modèles supposent : l’écart entre règle et pratique.", "2) Weber construit l’idéal-type comme instrument de comparaison, non comme description du réel.", "3) Les deux disciplines partagent donc une même exigence de conceptualisation.", "B. L’entreprise est un objet partagé", "1) Économistes et sociologues étudient la même organisation avec des outils distincts.", "2) Les frontières se brouillent : certains sociologues analysent les phénomènes économiques.", "3) L’analyse de la firme bénéficie de ce croisement méthodologique.", "C. La validité se juge à la portée explicative", "1) Une théorie vaut par sa capacité à rendre compte de faits qu’elle n’avait pas anticipés.", "2) Les coûts de transaction expliquent aujourd’hui les arbitrages de relocalisation.", "3) C’est cette fécondité, plus que l’élégance formelle, qui fonde la valeur d’un concept."], "conclusion": "L’étude de l’entreprise révèle une méthode qui part de régularités observées pour construire des concepts transposables, du coût de transaction à la théorie de l’agence. Elle en montre aussi les limites : abstraction excessive, dépendance aux hypothèses, déterminisme du modèle SCP. La coexistence durable d’approches concurrentes n’est pas un échec mais le mode même de progression de la discipline, que le dialogue avec la sociologie enrichit encore."}, "ch10-1": {"commentaire": "Sujet d’ouverture du chapitre : il commande tout le reste. Le piège serait de traiter « rationalité » comme un mot unique. Il faut distinguer la rationalité substantielle, qui suppose un calcul optimal, et la rationalité procédurale de Simon, qui se contente d’une solution satisfaisante. Il faut ensuite montrer que Weber décrit l’organisation moderne comme le lieu par excellence de la rationalisation, avant que Mayo, Crozier et Morel n’en montrent les angles morts : le monde informel, les zones d’incertitude et les décisions absurdes. La conclusion attendue n’est pas que l’organisation serait irrationnelle, mais que sa rationalité est locale, limitée et collectivement construite.", "intro": "La fiche de poste, l’organigramme, la procédure écrite, le tableau de bord : tout dans l’entreprise contemporaine affiche la volonté d’agir méthodiquement plutôt qu’au hasard. Max Weber a fait de ce mouvement le trait distinctif de la modernité : dans L’Éthique protestante et l’esprit du capitalisme (1905), il décrit une rationalisation qui gagne l’économie, le droit, la science et jusqu’aux croyances. L’organisation apparaît alors comme la forme sociale où ce processus est le plus abouti. Pourtant l’explosion de la navette Challenger en 1986, décidée par une organisation experte, procédurière et compétente, rappelle que des structures entièrement construites pour décider rationnellement peuvent produire des catastrophes. Est rationnel ici un comportement dont les moyens sont ajustés méthodiquement à une fin explicite.", "problematique": "L’organisation constitue-t-elle réellement le lieu d’une rationalité maîtrisée, ou faut-il admettre que sa rationalité reste limitée, contournée et parfois retournée contre ses propres fins ?", "plan": ["I. L’organisation est bien le lieu où la rationalité se déploie le plus complètement", "A. Weber fait de la rationalisation le principe des sociétés modernes", "1) Weber distingue quatre déterminants de l’action : l’action rationnelle en finalité, l’action rationnelle en valeur, le comportement traditionnel et le comportement affectuel ; la modernité fait reculer les deux derniers.", "2) La rationalisation ne concerne pas la seule économie : l’explication scientifique supplante l’explication magique, ce que Weber nomme le désenchantement du monde.", "3) La foudre cesse d’être un signe divin pour devenir un phénomène électrique : le monde devient calculable, donc administrable.", "B. La bureaucratie est la traduction organisationnelle de cette rationalité", "1) Elle repose sur une division du travail précise, une hiérarchie explicite, des règles impersonnelles et des compétences définies par le poste.", "2) La séparation entre la personne et sa fonction garantit que la décision ne dépend ni de l’affect ni du lien personnel : le fonctionnaire applique la règle, pas sa préférence.", "3) Elle relève de la domination légale-rationnelle, la troisième des dominations wébériennes, où l’on obéit à la règle et non à la personne.", "C. Cette rationalité produit des gains réels et mesurables", "1) La formalisation rend l’action prévisible : chacun sait qui décide, selon quelle procédure et dans quel délai.", "2) Elle réduit l’arbitraire : le recrutement sur compétence et le statut attaché au poste limitent le favoritisme.", "3) Elle rejoint l’analyse économique de la firme : chez Ronald Coase, dès 1937, la hiérarchie existe précisément parce qu’elle coordonne à moindre coût que le marché.", "II. Mais cette rationalité affichée se heurte aux comportements réels des acteurs", "A. Le monde formel ne recouvre jamais le monde informel", "1) Michel Crozier oppose l’organigramme, qui décrit la hiérarchie officielle, au sociogramme, qui restitue les relations effectives entre acteurs.", "2) Dans l’enquête du « monopole industriel » menée à la SEITA et publiée dans Le Phénomène bureaucratique (1963), les ouvriers d’entretien détiennent un pouvoir que l’organigramme ne leur accorde pas.", "3) Ils maîtrisent la seule incertitude qui subsiste, la panne des machines, et cette zone d’incertitude vaut davantage que la position hiérarchique.", "B. Les conditions matérielles ne suffisent pas à expliquer les conduites", "1) Elton Mayo, dans The Human Problems of an Industrial Civilization (1933), observe à la Western Electric que la productivité augmente même quand l’éclairage n’est pas amélioré.", "2) L’expérience de la Test Room confirme ce paradoxe : c’est l’attention portée aux ouvrières, non le réglage technique, qui modifie leur comportement.", "3) L’École des relations humaines en tire que l’entreprise est un système social, et non un simple agencement technique de postes.", "C. La rationalité des individus est elle-même limitée", "1) Herbert Simon montre que l’acteur ne maximise pas : il s’arrête à la première solution satisfaisante, faute d’information et de temps.", "2) Crozier reprend cette limite : l’acteur est stratégique mais ne possède ni toutes les informations ni toutes les conséquences de ses choix.", "3) Gérald Bronner décrit la même économie mentale sous le nom d’avarice cognitive, rapprochée du système 1 de Daniel Kahneman, rapide et intuitif.", "III. La rationalité organisationnelle est donc une construction collective, fragile et perfectible", "A. Une organisation rationnelle peut produire des décisions absurdes", "1) Christian Morel définit la décision absurde comme une décision prise collectivement, durablement, et allant contre le but recherché.", "2) Challenger en est le cas exemplaire : en 1986, après vingt-quatre lancements réussis, la navette explose alors que le risque lié au froid sur les joints des boosters était connu de plusieurs acteurs.", "3) Trois causes se combinent : la crainte de contester l’autorité, la dynamique de groupe et des erreurs de raisonnement partagées.", "B. Le groupe peut dégrader la qualité de la décision", "1) Le paradigme de Solomon Asch, en 1951, montre qu’un individu se range à l’avis du groupe même lorsque cet avis est manifestement faux.", "2) Irving Janis nomme Groupthink, en 1982, cette recherche d’harmonie qui produit une illusion d’unanimité alors que les doutes individuels existent.", "3) Le biais de confirmation achève le mécanisme en conduisant chacun à ne retenir que ce qui conforte la position déjà prise.", "C. La rationalité se travaille donc par des dispositifs, non par la seule règle", "1) Morel propose des métarègles : hiérarchie restreinte impliquée, débat contradictoire organisé, décision par consensus.", "2) Ne pas sanctionner systématiquement l’erreur permet qu’elle soit signalée, donc corrigée avant l’accident.", "3) La check-list, importée de l’aéronautique, supplée la mémoire défaillante et rend explicite ce que la routine avait rendu invisible."], "conclusion": "L’organisation est bien le lieu où la rationalité moderne s’incarne le plus nettement : la bureaucratie wébérienne formalise, hiérarchise et dépersonnalise la décision, et cette rationalisation produit des gains d’efficacité et d’équité incontestables. Mais Mayo, Crozier, Simon et Morel montrent que cette rationalité affichée est traversée par le monde informel, les zones d’incertitude, les limites cognitives des acteurs et les effets de groupe. La rationalité organisationnelle n’est donc ni un acquis ni une illusion : elle est une construction collective, toujours partielle, qui ne se maintient qu’au prix de dispositifs explicitement conçus pour la protéger d’elle-même."}, "ch10-2": {"commentaire": "Sujet de confrontation directe entre Weber et Crozier. La première exigence est lexicale : le mot « bureaucratie » a un sens péjoratif dans le langage courant, alors que chez Weber il désigne un idéal-type d’organisation rationnelle. Il faut donc écarter le sens commun avant de discuter. Le plan doit montrer que la bureaucratie est efficace par construction, qu’elle produit pourtant des effets pervers, et que ces effets ne condamnent pas le modèle mais en révèlent la condition : elle est efficace là où l’activité est stable et prévisible. Les notions de cercle vicieux bureaucratique, de règle impersonnelle et de cage d’acier sont indispensables.", "intro": "Rien n’est plus courant que de dénoncer la lourdeur bureaucratique d’une administration ou d’un grand groupe. Pourtant, lorsque Max Weber forge le concept, il ne décrit pas un dysfonctionnement mais la forme d’organisation la plus rationnelle que la modernité ait produite : une structure fondée sur des règles impersonnelles, une hiérarchie claire et des compétences attachées au poste plutôt qu’à la personne. La bureaucratie est pour lui l’expression organisationnelle de la domination légale-rationnelle. Michel Crozier, enquêtant à la SEITA au début des années 1960, aboutit pourtant à un constat inverse : les règles y engendrent la rigidité, et la rigidité engendre de nouvelles règles. La bureaucratie est un ensemble de règles générales, écrites et impersonnelles encadrant une organisation hiérarchisée.", "problematique": "La bureaucratie constitue-t-elle une organisation efficace par nature, ou son efficacité dépend-elle de conditions que ses propres mécanismes tendent à détruire ?", "plan": ["I. La bureaucratie est conçue pour être l’organisation la plus efficace", "A. Elle repose sur des principes explicitement rationnels", "1) La division du travail attribue à chaque agent une tâche définie, ce qui permet la spécialisation et la compétence technique.", "2) La hiérarchie clairement définie fixe qui décide, qui contrôle et qui rend des comptes, supprimant l’ambiguïté sur la responsabilité.", "3) Le statut associé au poste et la séparation entre la personne et sa fonction garantissent la continuité : l’agent change, la fonction demeure.", "B. Elle rend l’action prévisible et impersonnelle", "1) La règle écrite s’applique identiquement à tous, ce qui limite l’arbitraire et le favoritisme.", "2) La domination y est légale-rationnelle : on obéit à la règle légitimement établie et non à la personne du chef, contrairement aux dominations traditionnelle et charismatique.", "3) Cette impersonnalité est une protection : elle place l’usager et l’agent sous le même droit.", "C. Elle répond à un besoin économique réel de coordination", "1) Ronald Coase montre dès 1937 que la firme existe parce que la coordination hiérarchique évite les coûts de transaction du marché.", "2) Oliver Williamson prolonge cette analyse : plus les transactions sont spécifiques et incertaines, plus l’internalisation hiérarchique est avantageuse.", "3) La grande entreprise moderne est ainsi, selon Weber lui-même, bâtie sur les trois piliers de la division du travail, de la formalisation et de la domination légale-rationnelle.", "II. Mais elle engendre des effets pervers qui la retournent contre ses propres fins", "A. Crozier met au jour un cercle vicieux bureaucratique", "1) Les règles impersonnelles produisent de la rigidité, car elles n’anticipent pas les situations particulières.", "2) Cette rigidité engendre des problèmes de communication et de fonctionnement que l’organisation traite en créant de nouvelles règles.", "3) La règle supplémentaire accroît la rigidité initiale : le mécanisme correcteur devient le mécanisme aggravant.", "B. La règle ne supprime pas le pouvoir, elle le déplace", "1) À la SEITA, créée en 1926 et détentrice jusqu’en 1976 du monopole du tabac et des allumettes, tout est réglé sauf la panne des machines.", "2) Les ouvriers d’entretien contrôlent cette unique zone d’incertitude et en tirent un pouvoir réel sur les ouvrières de production et les chefs d’atelier.", "3) La maîtrise des règles elles-mêmes devient, chez Crozier, l’une des quatre sources de pouvoir, avec la compétence, les relations et l’information.", "C. Weber avait lui-même identifié ces dangers", "1) Il redoute la routinisation du travail, le refus de l’innovation et la perte d’autonomie des individus.", "2) Il craint la formation d’un groupe bureaucratique défendant ses intérêts propres plutôt que la finalité de l’organisation.", "3) La « cage d’acier » résume le paradoxe : la rationalité conçue pour libérer des contraintes arbitraires finit par enfermer dans les procédures.", "III. Son efficacité est donc conditionnelle et dépend de l’environnement de l’organisation", "A. Elle est adaptée aux activités stables et répétitives", "1) Là où les cas sont standardisés, la règle écrite traite rapidement un grand nombre de situations identiques.", "2) L’égalité de traitement y constitue un critère d’efficacité et non un simple principe juridique.", "3) La prévisibilité permet la planification, donc l’allocation efficace des moyens.", "B. Elle est inadaptée aux environnements incertains et changeants", "1) Face à l’imprévu, la procédure retarde la décision au lieu de l’éclairer, et l’agent préfère s’abriter derrière la règle.", "2) Crozier explique ainsi pourquoi les organisations changent difficilement : chaque acteur défend la zone d’incertitude qui fonde son pouvoir.", "3) L’innovation suppose une marge de manœuvre que la formalisation intégrale supprime.", "C. L’efficacité passe alors par la reconnaissance du monde informel", "1) Mayo montre dès 1933 que les relations humaines et le sens donné au travail pèsent autant que l’organisation technique.", "2) Morel propose des métarègles — débat contradictoire, hiérarchie restreinte impliquée, non-sanction systématique de l’erreur — qui corrigent la rigidité sans supprimer la règle.", "3) Crozier s’oppose ainsi à Taylor : l’efficacité ne vient pas de la prescription intégrale des gestes mais de la capacité des acteurs à coopérer malgré leurs intérêts divergents."], "conclusion": "La bureaucratie n’est pas, chez Weber, un dysfonctionnement mais la forme organisationnelle la plus rationnelle de la modernité : elle divise, hiérarchise, formalise, et protège ainsi de l’arbitraire tout en abaissant les coûts de coordination. Crozier montre néanmoins que ses propres règles produisent de la rigidité, que la rigidité appelle de nouvelles règles et que le pouvoir se reconstitue là où l’incertitude subsiste. Son efficacité n’est donc ni générale ni nulle : elle est réelle dans les activités stables et répétitives, et devient contre-productive dès que l’environnement exige de l’adaptation. C’est pourquoi les organisations contemporaines cherchent moins à supprimer la règle qu’à ménager, à côté d’elle, les marges de manœuvre sans lesquelles elle s’étouffe."}, "ch10-3": {"commentaire": "Sujet d’épistémologie : il porte sur la méthode de la sociologie, pas sur un objet social particulier. Il faut opposer clairement le holisme méthodologique de Durkheim, qui explique le social par le social, et l’individualisme méthodologique de Weber, qui part du sens que les individus donnent à leurs actions. Le piège serait de trancher pour l’un des deux : la troisième partie doit montrer que les deux démarches sont complémentaires et que la sociologie des organisations les articule effectivement. Les notions de fait social, de règles de la méthode, d’action sociale et d’idéal-type sont attendues, ainsi que les limites propres à chaque approche.", "intro": "Lorsqu’un sociologue constate que le taux de syndicalisation français est tombé à 10,3 % des salariés en 2019, il peut chercher l’explication dans deux directions opposées. Soit il rapporte ce recul à des transformations structurelles — désindustrialisation, mondialisation, montée de l’individualisme — qui s’imposent aux individus indépendamment de leurs intentions. Soit il reconstitue les raisons qu’ont les salariés de ne plus se syndiquer, c’est-à-dire le sens qu’ils donnent à cette abstention. Cette alternative n’est pas de détail : elle sépare les deux fondateurs de la discipline. Émile Durkheim, dans Les Règles de la méthode sociologique (1895), énonce qu’il faut « traiter les faits sociaux comme des choses » ; Max Weber fait au contraire de la compréhension du sens subjectif le point de départ de l’analyse.", "problematique": "L’explication des comportements sociaux exige-t-elle de remonter aux structures qui s’imposent aux individus, ou doit-elle partir du sens que ces individus donnent eux-mêmes à leurs actions ?", "plan": ["I. Durkheim soutient que le social s’explique par le social, indépendamment des individus", "A. Le fait social s’impose de l’extérieur", "1) Dans Les Règles de la méthode sociologique (1895), Durkheim définit le fait social par son extériorité et son pouvoir de contrainte sur les consciences individuelles.", "2) La société et les structures sociales influencent les individus : c’est le schéma du holisme méthodologique, qui part du tout pour expliquer les parties.", "3) L’individu ne choisit ni la langue qu’il parle, ni les normes qu’il intériorise, ni le système de parenté dans lequel il naît.", "B. La méthode qui en découle est délibérément objectiviste", "1) Il faut « traiter les faits sociaux comme des choses », c’est-à-dire écarter les prénotions et les explications spontanées des acteurs.", "2) Dans Le Suicide (1897), Durkheim explique un acte apparemment intime par le degré d’intégration et de régulation des groupes d’appartenance.", "3) La variation des taux entre groupes sociaux, et non les motifs individuels, constitue la véritable donnée sociologique.", "C. Cette démarche éclaire des phénomènes que l’individu ne perçoit pas", "1) L’anomie désigne une insuffisance de normes collectives qu’aucun individu ne décide, mais qui désoriente chacun.", "2) Dans De la division du travail social (1893), le passage de la solidarité mécanique à la solidarité organique est un processus structurel.", "3) Robert Castel raisonne de même lorsqu’il analyse, dans Les Métamorphoses de la question sociale (1995), la désaffiliation comme effet de l’effritement de la condition salariale.", "II. Mais Weber montre qu’aucune conduite ne s’explique sans le sens que lui donnent les acteurs", "A. La sociologie doit comprendre avant d’expliquer", "1) Weber part de l’action sociale, c’est-à-dire d’un comportement auquel l’individu attache une signification subjective orientée vers autrui.", "2) L’individualisme méthodologique part donc des individus pour reconstituer les phénomènes collectifs, exactement à l’inverse de Durkheim.", "3) Une même conduite extérieurement identique peut relever de significations totalement différentes, que seule la compréhension distingue.", "B. Les quatre déterminants de l’action donnent l’outil de cette compréhension", "1) L’action rationnelle en finalité ajuste méthodiquement les moyens à une fin, comme l’entrepreneur qui calcule son investissement.", "2) L’action rationnelle en valeur obéit à une conviction indépendamment des conséquences, comme le capitaine qui refuse d’abandonner son navire.", "3) Le comportement traditionnel relève de l’habitude et le comportement affectuel de l’émotion : la modernité fait reculer ces deux derniers sans les supprimer.", "C. Cette approche éclaire des mécanismes que le holisme laisse dans l’ombre", "1) Michel Crozier ne peut comprendre le pouvoir des ouvriers d’entretien de la SEITA qu’en reconstituant leurs stratégies individuelles.", "2) Christian Morel explique les décisions absurdes par des raisons individuelles — crainte de contester l’autorité, autocensure liée au sentiment d’incompétence.", "3) Gérald Bronner part des invariants mentaux et de l’avarice cognitive des individus pour expliquer un phénomène collectif, la circulation des fausses informations.", "III. Les deux démarches sont en réalité complémentaires et la sociologie des organisations les articule", "A. Chaque approche prise isolément a ses limites", "1) Le holisme risque de faire disparaître l’acteur : s’il n’est que le produit des structures, on ne comprend ni l’innovation ni la déviance.", "2) L’individualisme risque à l’inverse de négliger les contraintes objectives — capital, diplôme, statut — qui ne relèvent d’aucun choix.", "3) Aucune des deux ne fournit à elle seule une explication complète : elles éclairent des niveaux différents du même phénomène.", "B. L’articulation est méthodologique avant d’être théorique", "1) L’idéal-type wébérien est une construction abstraite accentuant certains traits, destinée à être comparée à la réalité et non à la décrire.", "2) La neutralité axiologique impose au chercheur de distinguer ce qui est de ce qui devrait être, exigence commune aux deux traditions.", "3) L’enquête de terrain de Crozier, fondée sur des entretiens, reconstitue les stratégies individuelles tout en décrivant les contraintes structurelles qui les bornent.", "C. Les organisations offrent le lieu privilégié de cette articulation", "1) Le monde formel — organigramme, règles, hiérarchie — relève d’une contrainte structurelle réelle qui s’impose aux agents.", "2) Le monde informel — sociogramme, alliances, stratégies — ne se comprend qu’en partant des acteurs et de leurs marges de manœuvre.", "3) L’acteur crozérien est ainsi contraint et stratégique à la fois : sa rationalité est limitée, mais elle demeure une rationalité d’acteur."], "conclusion": "Durkheim a raison de soutenir que les comportements sociaux ne se réduisent pas à la somme des intentions : le fait social est extérieur, contraignant, et se mesure au niveau des groupes plus qu’à celui des personnes. Weber a raison de répondre qu’une contrainte n’agit jamais mécaniquement et qu’il faut reconstituer le sens que les individus donnent à leurs conduites. Les deux démarches ne s’excluent donc pas : elles répondent à des questions différentes, l’une sur les régularités, l’autre sur les motifs. La sociologie des organisations le montre concrètement, puisqu’elle décrit des structures formelles contraignantes tout en restituant les stratégies par lesquelles les acteurs s’en saisissent."}, "ch10-4": {"commentaire": "Sujet classiquement crozérien, mais qui exige d’être élargi au chapitre 9. Il faut d’abord reconnaître la réalité du pouvoir hiérarchique — propriété du capital, autorité légale-rationnelle, droit de direction — avant de montrer avec Crozier que le pouvoir est en réalité relationnel et qu’il naît partout où existe une zone d’incertitude. La troisième partie doit mobiliser la gouvernance d’entreprise : la théorie de l’agence montre que même le sommet est contraint, et que le dirigeant n’est pas le détenteur ultime du pouvoir. L’enquête de la SEITA est ici incontournable et doit être exposée précisément, pas seulement citée.", "intro": "L’organigramme d’une entreprise dessine une pyramide : les décisions descendent, les comptes remontent, et le pouvoir semble se confondre avec la position occupée. Cette représentation trouve un appui théorique solide, puisque Max Weber fait de la hiérarchie clairement définie l’un des traits constitutifs de la bureaucratie, et que la propriété du capital confère juridiquement le droit de diriger. Pourtant, lorsque Michel Crozier enquête à la SEITA, entreprise créée en 1926 et détentrice jusqu’en 1976 du monopole français du tabac et des allumettes, il découvre que les acteurs les plus influents de l’atelier ne sont pas ceux que l’organigramme désigne. Le pouvoir se définira ici comme la capacité d’obtenir d’autrui un comportement qu’il n’aurait pas spontanément adopté.", "problematique": "Le pouvoir dans l’entreprise coïncide-t-il avec la position hiérarchique, ou naît-il de la maîtrise de ressources que l’organigramme ne fait pas apparaître ?", "plan": ["I. Le pouvoir hiérarchique est une réalité juridique et organisationnelle incontestable", "A. La propriété du capital fonde un droit de direction", "1) L’actionnaire, propriétaire des moyens de production, détient le droit de nommer et de révoquer les dirigeants.", "2) Karl Marx analyse ce rapport comme une domination de classe, le détenteur du capital disposant de la force de travail qu’il achète.", "3) Le contrat de travail lui-même institue un lien de subordination, ce qui distingue le salarié de l’indépendant.", "B. Weber en donne la justification rationnelle", "1) La domination légale-rationnelle fait obéir non à la personne mais à la règle qui attribue l’autorité au poste.", "2) La séparation entre la personne et sa fonction rend cette autorité transférable : le chef change, l’autorité du poste demeure.", "3) La hiérarchie clairement définie constitue, avec la division du travail et les règles impersonnelles, l’un des piliers de la bureaucratie.", "C. Cette centralisation répond à une nécessité économique", "1) Ronald Coase montre en 1937 que la firme substitue l’autorité au marché parce que la coordination hiérarchique coûte moins cher que la négociation contractuelle.", "2) Armen Alchian et Harold Demsetz ajoutent que quelqu’un doit surveiller l’effort de chacun dans une production en équipe.", "3) L’organisation en forme unitaire, fortement centralisée, incarne cette logique de commandement descendant.", "II. Mais Crozier montre que le pouvoir réel se distribue bien au-delà du sommet", "A. L’enquête de la SEITA renverse la lecture de l’organigramme", "1) Officiellement, les chefs d’atelier dirigent les ouvrières de production, et les ouvriers d’entretien dépendent d’un ingénieur technique peu présent.", "2) En réalité, tout est réglé dans l’atelier sauf un événement : la panne des machines, dont dépend l’activité entière.", "3) Les ouvriers d’entretien, seuls capables d’y remédier, deviennent les acteurs déterminants sans occuper aucune position d’autorité.", "B. Le pouvoir naît de la maîtrise d’une zone d’incertitude", "1) L’incertitude est une contrainte pour l’organisation, mais une ressource pour qui la contrôle.", "2) Les ouvrières n’osent pas critiquer ouvertement la qualité des réparations, de crainte que leurs machines soient réparées plus tard ou moins bien.", "3) Le pouvoir est donc relationnel : il n’est pas une propriété que l’on possède, mais une relation d’échange déséquilibrée.", "C. Quatre sources de pouvoir traversent toute l’organisation", "1) La maîtrise d’une compétence que les autres n’ont pas, comme celle des ouvriers d’entretien sur la mécanique des machines.", "2) La maîtrise des relations avec l’environnement de l’organisation et la maîtrise de la communication et de l’information.", "3) La maîtrise des règles elles-mêmes, qui permet de les invoquer, de les contourner ou de les appliquer avec zèle.", "III. Le sommet lui-même est contraint, ce qui achève de décentrer le pouvoir", "A. Crozier s’oppose ainsi à Marx sur la nature de la domination", "1) Chez Marx, le pouvoir découle de la position dans les rapports de production et se concentre entre les mains des propriétaires.", "2) Chez Crozier, il est plus diffus : il se construit dans les interactions quotidiennes et se redistribue selon les incertitudes du moment.", "3) L’acteur n’est jamais passif ; même le subordonné dispose de marges de manœuvre qu’il utilise stratégiquement.", "B. La gouvernance montre que le dirigeant n’est pas le détenteur final du pouvoir", "1) La théorie de l’agence de Michael Jensen et William Meckling décrit le dirigeant comme l’agent d’un principal, l’actionnaire, dont les intérêts divergent des siens.", "2) L’asymétrie d’information joue ici au bénéfice du dirigeant, qui connaît l’entreprise mieux que ceux qui le contrôlent.", "3) Crozier se distingue toutefois de Williamson et Akerlof : là où ces derniers cherchent à réduire les asymétries, il observe que les acteurs ont intérêt à les maintenir.", "C. Le pouvoir se négocie donc en permanence", "1) Être dans une organisation, c’est devoir coopérer, mais cette coopération reste conflictuelle car les intérêts divergent.", "2) Le conflit n’est pas une pathologie : il est la conséquence normale de l’interdépendance entre acteurs aux objectifs distincts.", "3) C’est pourquoi les organisations changent difficilement : toute réforme menace la zone d’incertitude qui fonde le pouvoir de quelqu’un."], "conclusion": "Le pouvoir hiérarchique est réel : la propriété du capital, le lien de subordination et la domination légale-rationnelle fondent une autorité descendante qui répond à un besoin effectif de coordination. Mais Crozier établit, par l’enquête de la SEITA, que le pouvoir véritable appartient à qui contrôle une zone d’incertitude, fût-il en bas de l’organigramme. Le sommet lui-même se révèle contraint, puisque le dirigeant n’est que l’agent d’actionnaires mal informés. Le pouvoir n’est donc ni concentré ni également réparti : il est relationnel, mouvant, et se reconstitue partout où subsiste une incertitude que quelqu’un maîtrise seul."}, "ch10-5": {"commentaire": "Sujet centré sur Morel, mais qui exige de partir du modèle rationnel pour mesurer l’écart. Il faut définir précisément la décision absurde : une décision prise collectivement, de façon persistante, et qui va à l’encontre du but poursuivi. Challenger doit être traité comme un cas analysé, avec ses trois familles de causes, et non cité en passant. La troisième partie doit être constructive : les métarègles montrent que l’irrationalité collective se corrige par des dispositifs et non par un appel à la vigilance individuelle. Le lien avec Simon et Kahneman est attendu.", "intro": "Une organisation dispose en principe de tout ce qui manque à l’individu isolé : des experts, des procédures, des données, du temps de délibération et une hiérarchie chargée d’arbitrer. On attendrait donc d’elle des décisions supérieures à celles d’un individu seul. Le 28 janvier 1986, pourtant, la navette Challenger explose peu après son décollage, alors que les vingt-quatre lancements précédents s’étaient bien déroulés et que plusieurs acteurs connaissaient le risque que les températures exceptionnellement basses faisaient peser sur les joints des boosters. Christian Morel nomme « décision absurde » ce type de choix : une décision prise collectivement, durablement maintenue, et qui va à l’encontre du but recherché par ceux-là mêmes qui la prennent.", "problematique": "Les organisations, mieux dotées que les individus en information et en procédures, décident-elles plus rationnellement, ou leurs mécanismes collectifs produisent-ils une irrationalité qui leur est propre ?", "plan": ["I. Les organisations sont construites pour décider rationnellement", "A. La formalisation vise explicitement cet objectif", "1) La bureaucratie wébérienne répartit les compétences, écrit les procédures et attribue la décision à des postes définis.", "2) L’action rationnelle en finalité, premier des quatre déterminants wébériens, ajuste méthodiquement les moyens à une fin explicite.", "3) La domination légale-rationnelle fonde l’obéissance sur la règle, censée avoir été établie de façon raisonnée.", "B. Le collectif corrige en principe les erreurs individuelles", "1) Un groupe rassemble davantage d’informations qu’un individu isolé, chacun apportant sa compétence propre.", "2) La confrontation des points de vue permet en théorie de repérer les failles d’un raisonnement.", "3) La délibération autorise la correction mutuelle, ce qui devrait réduire la probabilité d’erreur.", "C. Les outils d’aide à la décision renforcent cette ambition", "1) Expertise technique, mesure du risque et procédures de validation encadrent les choix engageants.", "2) Les organisations se dotent de check-lists, de revues de projet et de comités destinés à objectiver la décision.", "3) Ronald Coase justifiait dès 1937 l’existence de la firme par sa capacité à coordonner à moindre coût que le marché.", "II. Pourtant des mécanismes collectifs produisent des décisions absurdes", "A. Le poids de la hiérarchie inhibe l’expression du désaccord", "1) La crainte de contester l’autorité conduit un subordonné à taire une information qu’il juge pourtant déterminante.", "2) La crainte d’insister fait qu’une objection exprimée une fois, puis écartée, n’est pas reformulée.", "3) L’autocensure liée au sentiment d’incompétence achève le silence : chacun suppose que les autres savent mieux.", "B. La dynamique de groupe amplifie le phénomène", "1) Le paradigme de Solomon Asch, en 1951, montre qu’un individu se range à l’avis unanime du groupe même lorsqu’il est manifestement faux.", "2) Irving Janis nomme Groupthink, en 1982, la recherche d’harmonie qui pousse chacun à éviter le conflit et crée une illusion d’unanimité.", "3) Le biais de confirmation conduit enfin à ne retenir que les éléments confortant la position déjà adoptée.", "C. Challenger illustre la combinaison de ces mécanismes", "1) Le risque lié au froid sur les joints flexibles des boosters était identifié par des ingénieurs avant le lancement.", "2) La pression en faveur du lancement, ajoutée à la réussite des vingt-quatre vols précédents, a fait traiter l’alerte comme une objection marginale.", "3) Aucun acteur n’a pris seul une décision absurde : l’absurdité est une œuvre collective, ce qui la rend d’autant plus difficile à imputer.", "III. L’irrationalité collective n’est cependant ni inévitable ni irrémédiable", "A. Elle prolonge des limites cognitives déjà connues", "1) Herbert Simon avait établi que l’acteur, faute d’information et de temps, se contente d’une solution satisfaisante plutôt qu’optimale.", "2) Daniel Kahneman oppose un système 1 rapide, intuitif et automatique à un système 2 lent et contrôlé, le premier économisant l’effort au prix de biais.", "3) Gérald Bronner retrouve la même avarice cognitive à l’échelle du marché de l’information : on préfère l’explication simple à l’explication exacte.", "B. Des métarègles permettent de corriger ces mécanismes", "1) La hiérarchie restreinte impliquée réduit la distance entre décideurs et opérateurs, de sorte que l’objection remonte réellement.", "2) Le débat contradictoire organisé oblige à formuler l’avis minoritaire au lieu de le laisser s’éteindre.", "3) La décision par consensus évite qu’une majorité de façade recouvre des doutes que personne n’exprime.", "C. Ces dispositifs supposent de changer le rapport à l’erreur", "1) Ne pas punir systématiquement l’erreur permet qu’elle soit signalée à temps, donc corrigée avant l’accident.", "2) La check-list, importée de l’aéronautique, supplée la mémoire et rend explicite ce que la routine a rendu invisible.", "3) La rationalité organisationnelle apparaît ainsi comme un résultat à produire par des procédures, non comme une propriété naturelle du collectif."], "conclusion": "Les organisations sont conçues pour décider rationnellement et disposent effectivement de ressources — expertise, procédures, délibération — dont l’individu isolé est dépourvu. Mais Morel établit que ces mêmes ressources engendrent des mécanismes spécifiques d’erreur : le silence hiérarchique, le conformisme d’Asch et le Groupthink de Janis transforment des doutes individuels fondés en unanimité apparente, comme l’a montré Challenger en 1986. L’irrationalité n’est donc pas l’échec d’une organisation défaillante, mais un risque inhérent à toute décision collective. C’est précisément pourquoi elle se traite par des dispositifs explicites — débat contradictoire, consensus, non-sanction de l’erreur, check-lists — plutôt que par un appel à la lucidité de chacun."}, "ch10-6": {"commentaire": "Sujet le plus contemporain du chapitre. Il faut résister à la tentation du procès à charge comme à celle de l’éloge technophile. L’architecture attendue est : Internet élargit objectivement l’accès au savoir ; mais le marché cognitif y fonctionne selon une logique d’offre et de demande qui favorise les contenus captivants plutôt que vrais ; la conclusion doit passer par les solutions de Bronner et par le lien avec Weber, puisque la rationalisation des moyens techniques n’entraîne pas mécaniquement la rationalité des fins. Les notions d’invariants mentaux, d’avarice cognitive, d’insularité cognitive et la loi de Brandolini sont attendues.", "intro": "Jamais l’accès à l’information n’a été aussi immédiat : une encyclopédie collaborative, les archives de la presse mondiale et des publications scientifiques sont accessibles en quelques secondes. Si la rationalité dépendait de la quantité d’informations disponible, la question serait tranchée. Or Gérald Bronner observe l’inverse : dans Apocalypse cognitive (2021), il montre que la libération du temps de cerveau disponible et la mise en concurrence de toutes les informations révèlent des tendances humaines que les médias traditionnels contenaient. Le marché cognitif désigne ce marché de l’information où des offres concurrentes rencontrent une demande façonnée par nos invariants mentaux. La question n’est donc pas celle de l’accès, mais celle des mécanismes de sélection.", "problematique": "L’élargissement considérable de l’accès à l’information renforce-t-il l’exercice de la raison, ou expose-t-il davantage les individus aux biais qui la limitent ?", "plan": ["I. Internet élargit objectivement les conditions matérielles de la rationalité", "A. Il abaisse radicalement le coût d’accès au savoir", "1) La vérification d’une affirmation, autrefois coûteuse en temps et en déplacement, devient presque instantanée.", "2) Les sources primaires — textes de loi, données statistiques, articles scientifiques — sont directement consultables par le public.", "3) La pluralité des offres rompt le monopole d’un petit nombre de médias sur la mise à l’agenda.", "B. Il rend possible la confrontation des points de vue", "1) Un même événement peut être lu simultanément à travers des traitements nationaux et idéologiques différents.", "2) La contradiction publique est facilitée : une erreur peut être relevée et corrigée par n’importe quel lecteur compétent.", "3) Des outils de vérification collaborative se sont développés en réponse à la circulation des fausses informations.", "C. Cette évolution prolonge le mouvement de rationalisation décrit par Weber", "1) La rationalisation consiste à substituer des explications rationnelles et scientifiques aux explications magiques ou surnaturelles.", "2) Ce processus produit le désenchantement du monde : la foudre cesse d’être un signe divin pour devenir un phénomène explicable.", "3) La diffusion massive du savoir scientifique participe en principe de cette dynamique.", "II. Mais le marché cognitif sélectionne les contenus captivants plutôt que les contenus vrais", "A. Nos invariants mentaux orientent la demande d’information", "1) L’attirance pour certains contenus — conflit, menace, sexualité, anomalie — structure ce que nous regardons effectivement.", "2) Le goût pour la visibilité sociale pousse à produire et partager ce qui sera vu, non ce qui est exact.", "3) La préférence pour les plaisirs à court terme favorise les contenus immédiatement gratifiants.", "B. L’avarice cognitive économise l’effort intellectuel", "1) Les individus n’aiment pas dépenser beaucoup d’énergie à comprendre des problèmes complexes et privilégient les explications simples.", "2) Bronner rapproche cette tendance du système 1 de Daniel Kahneman, mode de pensée rapide, intuitif et automatique.", "3) Une explication complotiste, qui donne un sens complet et une intention à des événements dispersés, est cognitivement moins coûteuse qu’une explication probabiliste.", "C. L’offre exploite systématiquement cette demande", "1) La publicité finance l’attention, ce qui fait de la durée d’exposition, et non de l’exactitude, le critère de réussite d’un contenu.", "2) Les algorithmes de recommandation proposent ce qui ressemble à ce qui a déjà été consulté, produisant l’insularité cognitive et les chambres d’écho.", "3) L’éditorialisation du monde fait que chaque fait reçoit instantanément son commentaire, l’interprétation précédant souvent la vérification.", "III. La rationalité suppose donc un travail méthodique qui ne va pas de soi", "A. L’asymétrie entre production et réfutation du faux est structurelle", "1) La loi de Brandolini, énoncée en 2013, souligne que réfuter une fausse information exige bien plus d’énergie que la produire.", "2) Une affirmation fausse se formule en quelques mots sans preuve ; sa réfutation suppose de rechercher les sources, d’expliquer le contexte et de vérifier.", "3) L’effet de réitération aggrave le déséquilibre : une information répétée paraît plus crédible, indépendamment de sa véracité.", "B. Bronner propose des règles de méthode plutôt qu’une censure", "1) Ne pas confondre savoirs et opinions : toutes les affirmations n’ont pas le même statut épistémique.", "2) Accepter la complexité et l’incertitude, car plus le savoir progresse, plus la surface de contact avec l’inconnu s’étend.", "3) Croiser les sources et sortir du biais de confirmation, en cherchant délibérément ce qui contredit l’hypothèse retenue.", "C. Le lien avec Weber donne la portée générale du sujet", "1) Weber décrit une rationalisation des moyens qui n’entraîne aucune rationalisation des fins : la technique perfectionnée peut servir n’importe quel but.", "2) Bronner montre le même écart : des outils d’information extraordinairement efficaces peuvent servir à diffuser l’erreur plus vite que la vérité.", "3) La « démocratie des crédules » qu’il redoute n’est donc pas un effet de la technique, mais d’une rationalité collective que les institutions doivent entretenir."], "conclusion": "Internet élargit indiscutablement les conditions matérielles de la rationalité : il abaisse le coût de l’information, rend les sources primaires accessibles et rompt le monopole de la mise à l’agenda. Mais Bronner établit que le marché cognitif ne sélectionne pas le vrai : il sélectionne ce qui rencontre nos invariants mentaux, et l’avarice cognitive, les algorithmes et la loi de Brandolini donnent au faux un avantage structurel. Internet ne rend donc les individus ni plus ni moins rationnels par lui-même : il révèle et amplifie des tendances préexistantes. Comme chez Weber, la rationalisation des moyens n’emporte pas celle des fins, et la raison reste un travail méthodique que ni la technique ni le nombre ne dispensent d’accomplir."}, "ch10-7": {"commentaire": "Sujet de synthèse de la seconde moitié du chapitre. L’adverbe « encore » commande le plan : il suppose que le travail a intégré, qu’il intègre moins, et invite à mesurer ce qui subsiste. Il faut partir de Durkheim — intégration, régulation, groupe professionnel — puis passer à Castel pour la société salariale et la désaffiliation, avant de nuancer : le travail reste un facteur d’identité, mais son pouvoir intégrateur n’est plus automatique. Les données du chapitre (taux de syndicalisation, part des jeunes en CDI, chômage des 15-24 ans, grande démission) doivent servir d’appui, non d’ornement.", "intro": "Perdre son emploi, c’est perdre un revenu ; mais les enquêtes montrent que c’est aussi perdre des collègues, un rythme, un statut et souvent une part de l’estime que l’on se porte. Cette observation confirme une thèse ancienne : pour Émile Durkheim, dans De la division du travail social (1893), le travail spécialisé ne détruit pas le lien social mais le refonde en créant de l’interdépendance entre individus différents. Le XXe siècle a institutionnalisé cette fonction en associant au salaire un statut et des droits, du droit de grève reconnu en 1864 à la création de la Sécurité sociale en 1945. Or Robert Castel, dans Les Métamorphoses de la question sociale (1995), décrit l’effritement de cette condition salariale. Intégrer signifie ici rattacher durablement l’individu à des groupes et à des normes communes.", "problematique": "Le travail conserve-t-il la capacité d’intégrer durablement les individus à la société, ou les transformations de l’emploi ont-elles rendu cette intégration incertaine ?", "plan": ["I. Le travail a été conçu et institué comme le principal opérateur d’intégration", "A. Durkheim fait de la division du travail le fondement de la solidarité moderne", "1) La solidarité mécanique repose sur la ressemblance entre individus et sur une conscience collective forte dans les sociétés traditionnelles.", "2) La solidarité organique naît au contraire de la différenciation : la spécialisation rend chacun indispensable aux autres.", "3) Division du travail, spécialisation, complémentarité et interdépendance forment ainsi la chaîne par laquelle le travail relie.", "B. Le travail remplit concrètement cinq fonctions intégratrices", "1) Il crée des relations quotidiennes et rattache l’individu à un groupe identifiable, le groupe professionnel.", "2) Il produit de la complémentarité et de l’interdépendance, chacun dépendant du travail des autres pour que le sien ait un sens.", "3) Il fournit des normes : Durkheim voit dans le groupe professionnel le remède à l’égoïsme et à l’anomie que la fragilisation de la famille, de la religion et des communautés locales a laissée béante.", "C. La société salariale a institutionnalisé cette fonction", "1) La salarisation a fait du salariat la forme dominante de l’emploi, face à un travail indépendant longtemps majoritaire.", "2) Les droits se sont accumulés : légalisation des syndicats en 1884, loi sur les accidents du travail en 1898, accords Matignon de 1936 avec la semaine de 40 heures et les congés payés.", "3) Castel montre qu’au XXe siècle le salaire donne bien plus qu’un revenu : un statut, des droits sociaux et une appartenance à la collectivité.", "II. Mais les transformations de l’emploi ont fragilisé cette fonction intégratrice", "A. Le chômage de masse produit une rupture sociale et non seulement monétaire", "1) Depuis les années 1970-1980, la montée du chômage prive l’individu de son revenu mais aussi de ses collègues, de son rythme et de son statut.", "2) Castel nomme désaffiliation ce processus de décrochage cumulatif à l’égard du travail et des réseaux de sociabilité.", "3) Les jeunes y sont surexposés : en France, le taux de chômage atteint 18,7 % chez les 15-24 ans contre 7,4 % pour l’ensemble.", "B. La précarisation fragmente le salariat lui-même", "1) Le passage du CDI vers des contrats plus courts multiplie les statuts : CDD, intérim, alternance, stages, emploi indépendant.", "2) Chez les 15-24 ans, seulement 39,8 % des personnes en emploi sont en CDI d’après les données de 2025 mobilisées dans le chapitre.", "3) La pauvreté laborieuse apparaît : avoir un emploi ne garantit plus de sortir de la pauvreté lorsqu’il est mal rémunéré, à temps partiel ou irrégulier.", "C. L’enquête de terrain rend visible cette intégration défaillante", "1) Florence Aubenas, dans Le Quai de Ouistreham (2010), vit la condition des travailleuses précaires du nettoyage pour en restituer le quotidien.", "2) Elle montre que le permis de conduire devient une condition d’accès à l’emploi, tant les horaires sont décalés et les lieux mal desservis.", "3) L’isolement social y accompagne la pauvreté : la précarité de l’emploi se double d’une précarité des liens.", "III. Le travail reste pourtant intégrateur, mais son pouvoir n’est plus automatique", "A. Les fonctions identitaires du travail demeurent fortes", "1) Le travail continue de structurer le temps, de fournir un statut et de construire l’identité sociale.", "2) La quête d’un travail « qui a du sens » — utilité sociale, fierté, épanouissement — témoigne d’attentes intégratrices intactes, voire accrues.", "3) La « grande démission » observée entre 2020 et 2022, environ quatre millions de départs aux États-Unis et de l’ordre de 500 000 en France en 2022, traduit moins un rejet du travail qu’une exigence sur ses conditions.", "B. Mais les institutions qui relayaient l’intégration s’affaiblissent", "1) Le taux de syndicalisation n’atteint plus que 10,3 % des salariés en 2019, avec un fort écart entre le public, 18,4 %, et le privé, 7,8 %.", "2) La désindustrialisation a dispersé les collectifs ouvriers qui portaient l’identité professionnelle la plus structurée.", "3) La montée de l’individualisme et l’ubérisation isolent le travailleur du collectif auquel Durkheim confiait la production des normes.", "C. L’intégration devient dès lors inégale selon les positions", "1) Elle reste solide pour les salariés en CDI qualifiés, dotés d’un statut stable et de perspectives de carrière.", "2) Elle devient fragile pour les travailleurs précaires, dont la rotation empêche l’insertion dans un collectif durable.", "3) Ces écarts prolongent les inégalités du chapitre 7 : l’accès au travail intégrateur constitue lui-même une inégalité de condition."], "conclusion": "Le travail a bien été l’opérateur central de l’intégration : Durkheim en fait le fondement de la solidarité organique, et la société salariale a converti cette fonction en droits, statuts et protections. La montée du chômage de masse, la précarisation et la pauvreté laborieuse ont cependant enclenché le processus de désaffiliation décrit par Castel, tandis que l’affaiblissement syndical et la désindustrialisation privaient le travail de ses relais collectifs. Le travail intègre donc encore — il demeure une source majeure d’identité, comme le montre la quête de sens — mais il n’intègre plus automatiquement. L’intégration dépend désormais de la qualité de l’emploi occupé, ce qui en fait une inégalité de plus."}, "ch10-8": {"commentaire": "Sujet strictement durkheimien, à traiter avec rigueur conceptuelle. La thèse commune — la spécialisation isole — doit être présentée sérieusement, en mobilisant Smith et Marx, avant que Durkheim ne la renverse : la solidarité ne disparaît pas, elle change de forme. Le cœur du devoir est l’opposition entre solidarité mécanique et solidarité organique, à exposer complètement (fondement, conscience collective, type de droit, exemples). La troisième partie doit porter sur l’anomie : la division du travail n’est destructrice que lorsqu’elle se développe sans régulation, ce qui permet d’articuler le sujet à la précarisation contemporaine.", "intro": "Adam Smith ouvre La Richesse des nations en 1776 sur la manufacture d’épingles : dix ouvriers spécialisés produisent infiniment plus que dix ouvriers accomplissant chacun toutes les opérations. La division du travail est donc d’abord un principe d’efficacité productive. Mais elle a très tôt inquiété : en fragmentant les tâches, ne fragmente-t-elle pas aussi la société, chacun ne partageant plus rien avec son voisin ? Émile Durkheim consacre à cette question sa thèse, De la division du travail social (1893), et y soutient une position contre-intuitive : c’est précisément la différenciation qui produit la forme moderne de la cohésion. Le lien social désignera ici l’ensemble des relations et des normes qui rattachent les individus à la collectivité.", "problematique": "La spécialisation croissante des tâches dissout-elle la cohésion sociale, ou transforme-t-elle la nature même du lien qui unit les individus ?", "plan": ["I. La division du travail semble d’abord dissoudre ce qui unissait les individus", "A. Elle brise l’unité de l’activité et l’homogénéité des situations", "1) Chez Adam Smith, la décomposition du travail en opérations élémentaires accroît l’habileté et la productivité, mais réduit chacun à un geste.", "2) Le taylorisme pousse cette logique à son terme en séparant la conception et l’exécution, et en prescrivant les gestes et les temps.", "3) Smith lui-même redoutait que la répétition d’une opération unique ne rende l’ouvrier « aussi stupide qu’il est possible à une créature humaine de le devenir ».", "B. Elle éloigne les individus les uns des autres", "1) Des salariés d’une même entreprise peuvent n’avoir ni formation, ni horaires, ni statut, ni conditions de travail comparables.", "2) Simone Weil, qui fait en 1934 l’expérience de l’usine, y décrit « le lieu du silence, de la contrainte et de la soumission ».", "3) Marx y voit une aliénation : le travailleur ne se reconnaît plus dans un produit dont il n’a fait qu’une fraction.", "C. Elle affaiblit les appartenances traditionnelles", "1) Durkheim constate lui-même la fragilisation de la famille élargie, de la religion et des communautés locales.", "2) Ces groupes assuraient la régulation des conduites et l’intégration des individus dans un ordre partagé.", "3) Leur affaiblissement laisse craindre une société d’individus juxtaposés sans conscience commune.", "II. Mais Durkheim montre que la solidarité change de forme au lieu de disparaître", "A. La solidarité mécanique reposait sur la ressemblance", "1) Dans les sociétés traditionnelles, les individus effectuent des activités semblables et partagent les mêmes croyances.", "2) La conscience collective y est forte : l’individu se pense d’abord comme membre du groupe.", "3) La transgression y est sévèrement sanctionnée, car elle atteint directement les croyances communes.", "B. La solidarité organique repose sur la différenciation", "1) La division du travail engendre la spécialisation, donc la différenciation des individus, donc leur complémentarité.", "2) Cette complémentarité crée une interdépendance : dans une entreprise, production, maintenance, commercial et comptabilité dépendent les uns des autres.", "3) La conscience individuelle s’y développe sans détruire le lien, car ce lien repose désormais sur le besoin que chacun a des autres.", "C. Les deux solidarités ne se succèdent pas mécaniquement", "1) Elles peuvent coexister dans une même société, la seconde devenant dominante sans supprimer la première.", "2) La modernité ne détruit donc pas la cohésion : elle substitue un lien fondé sur la différence à un lien fondé sur la ressemblance.", "3) Crozier confirmera empiriquement cette interdépendance en montrant, à la SEITA, que des groupes a
