ent sur des niveaux différents du même objet.", "3) La sociologie partage ce trait avec l’économie, où des courants concurrents — classiques, néoclassiques, keynésiens, institutionnalistes — coexistent également."], "conclusion": "L’entreprise apprend d’abord que la sociologie construit son objet : elle rompt avec l’organigramme comme avec les catégories administratives du chômage, et découvre régulièrement l’inverse de ce qu’elle attendait. Elle apprend ensuite que la discipline dispose de méthodes contrôlées et complémentaires — idéal-type, enquête de terrain, expérimentation — dont les critiques font partie intégrante de la démarche, et d’une exigence de neutralité axiologique. Elle apprend enfin que plusieurs courants y coexistent, du holisme durkheimien à l’individualisme wébérien, sans que cette pluralité soit une faiblesse. Ce que l’entreprise révèle, en définitive, c’est qu’une science sociale ne se juge pas à l’unanimité de ses réponses mais à la rigueur avec laquelle elle construit ses questions."}, "ch21-1": {"commentaire": "Sujet d’ouverture du chapitre : il commande la maîtrise du cadre de Michalet. La réponse attendue est clairement négative, mais elle doit être construite historiquement et non assénée. Il faut montrer que la dimension commerciale a réellement dominé la première mondialisation, puis que la dimension productive puis financière s’y sont ajoutées, et surtout que ces configurations sont cumulatives et non successives. Le mot « processus » de la définition est essentiel : la mondialisation n’est pas un état. Attention à ne pas confondre internationalisation, multinationalisation et globalisation.", "intro": "Le taux d’ouverture est l’indicateur le plus souvent cité pour mesurer la mondialisation, comme si l’intensité des échanges de biens et services en épuisait la définition. Charles-Albert Michalet objecte, dans Qu’est-ce que la mondialisation ? (2002), que le phénomène est multidimensionnel : il comporte des échanges de biens et services, des investissements directs à l’étranger et une circulation de capitaux financiers, dont l’importance relative a varié dans le temps. La mondialisation se définit comme le processus qui conduit à l’interdépendance croissante des économies par la multiplication des flux économiques et financiers, faisant de l’économie mondiale un espace de plus en plus intégré. Chaque terme compte, à commencer par celui de processus.", "problematique": "La mondialisation se laisse-t-elle mesurer par la seule intensité des échanges commerciaux, ou son analyse exige-t-elle de distinguer des dimensions productive et financière irréductibles au commerce ?", "plan": ["I. La dimension commerciale a effectivement dominé la première vague de mondialisation", "A. La première mondialisation de 1870 à 1913 est d’abord commerciale", "1) Elle repose sur l’essor des échanges, la baisse des coûts de transport et l’approfondissement de la spécialisation internationale.", "2) Le taux d’ouverture moyen atteint environ 14 à 15 % à son sommet, ce qui constitue une rupture historique.", "3) Michalet y voit sa première configuration, dite internationale, où l’ouverture des économies nationales aux échanges de biens et services est le moteur essentiel.", "B. Un facteur technique explique largement cette ouverture", "1) Selon Bairoch, le coût réel moyen du transport est presque divisé par dix entre le début du XIXᵉ siècle et 1910 environ.", "2) Cette baisse concerne le transport ferroviaire comme le transport maritime, ce qui rend rentables des échanges auparavant impossibles.", "3) L’enchaînement est mécanique : coûts de transport en baisse, échanges rentables plus nombreux, commerce international en hausse, taux d’ouverture accru.", "C. Les théories du commerce international rendent compte de cette dynamique", "1) Smith et Ricardo établissent que les pays ont intérêt à se spécialiser, la spécialisation engendrant gains de productivité et baisse des coûts.", "2) La division internationale du travail traditionnelle oppose alors des pays du centre exportant des produits manufacturés et des périphéries fournissant matières premières et produits primaires.", "3) Le commerce apparaît ainsi comme la forme d’interdépendance la plus directement observable et la plus aisément mesurable.", "II. Mais la mondialisation productive puis financière excède largement le commerce", "A. La deuxième configuration est multinationale et non plus commerciale", "1) Elle repose sur les investissements directs à l’étranger : création d’usines, acquisition d’entreprises, implantation de filiales.", "2) L’IDE n’est pas un échange de produits mais un déplacement du capital productif lui-même, ce qu’aucun taux d’ouverture ne saisit.", "3) Les firmes issues de petits marchés nationaux s’internationalisent pour dépasser l’étroitesse de leur demande intérieure.", "B. Baldwin montre que la production elle-même se fragmente", "1) Le premier dégroupage sépare le lieu de production du lieu de consommation, rendu possible par la chute des coûts de transport.", "2) Le second dégroupage sépare les étapes du processus productif entre plusieurs pays, ce que Baldwin nomme un « commerce de tâches ».", "3) On échange désormais massivement des biens intermédiaires, ce qui modifie la nature même de ce que mesure la statistique commerciale.", "C. La troisième configuration est financière et globale", "1) Les capitaux circulent sous forme d’IDE, d’investissements de portefeuille et de prêts, selon des logiques distinctes.", "2) Béraud montre que lors de la première mondialisation les placements de portefeuille représentaient déjà 80 à 90 % des mouvements de capitaux, contre 10 à 20 % pour les IDE.", "3) L’hypermondialisation contemporaine se caractérise par une mobilité financière massive, multidirectionnelle et beaucoup plus volatile.", "III. Ces dimensions sont cumulatives, ce qui interdit toute mesure unidimensionnelle", "A. Les configurations de Michalet s’ajoutent au lieu de se remplacer", "1) Dans la troisième vague, le commerce continue, les IDE se poursuivent et les capitaux financiers explosent.", "2) L’hypermondialisation correspond donc au cumul du commercial, du productif et du financier.", "3) Réduire le phénomène au commerce revient à ne retenir que la strate la plus ancienne.", "B. Les indicateurs commerciaux eux-mêmes deviennent trompeurs", "1) Le taux d’ouverture compare des exportations comptabilisées en valeur brute à un PIB mesuré en valeur ajoutée.", "2) Le cas de l’iPhone l’illustre : un appareil exporté à 1 000 dollars n’incorpore qu’une faible valeur créée dans le pays d’assemblage.", "3) L’indicateur surestime donc fortement l’ouverture des économies spécialisées dans l’assemblage, d’où la mesure du commerce en valeur ajoutée.", "C. D’autres flux encore échappent à la seule mesure commerciale", "1) Le facteur travail circule également, les migrations constituant une dimension à part entière de l’intégration internationale.", "2) Les dépenses d’un non-résident sur le territoire national sont assimilées à des exportations de services, ce qui brouille l’intuition ordinaire du commerce.", "3) La balance des paiements le montre : le compte courant comprend des revenus, et le compte financier enregistre des flux que le solde commercial ignore totalement."], "conclusion": "La mondialisation a bien été, dans sa première vague de 1870 à 1913, un phénomène principalement commercial, porté par la chute des coûts de transport et la spécialisation internationale. Mais Michalet établit qu’elle comporte trois dimensions — commerciale, productive et financière — et que ces configurations sont cumulatives : l’hypermondialisation ne remplace pas les formes antérieures, elle les additionne. La réduire au commerce reviendrait donc à ignorer les IDE, la fragmentation des chaînes de production décrite par Baldwin et la circulation massive des capitaux. Cette réduction est d’autant plus fautive que le taux d’ouverture, mesuré en valeur brute, surestime lui-même l’intensité commerciale des économies d’assemblage."}, "ch21-2": {"commentaire": "Sujet distributif : l’enjeu est de distinguer rigoureusement le gain global et sa répartition. Il faut mobiliser Ricardo pour le gain à l’échange, Stolper-Samuelson pour les effets internes, Milanovic pour les effets mondiaux, et la courbe de l’éléphant qui articule les deux. Le piège serait de répondre par une opposition pays riches/pays pauvres : la courbe montre précisément que les lignes de partage traversent les pays. La conséquence politique — sentiment de déclassement, vote populiste, retour du protectionnisme — fait partie du sujet et ne doit pas être traitée comme un hors-sujet.", "intro": "Les premières théories du commerce international, de Smith à Ricardo, établissent que la spécialisation accroît la richesse globale : chaque pays gagne à se concentrer sur les productions où il est relativement le plus efficace. Ce résultat ne dit pourtant rien de la manière dont ce gain se répartit, ni entre pays ni à l’intérieur de chacun d’eux. Branko Milanovic a rendu cette question mesurable avec la courbe de l’éléphant, qui retrace l’évolution des revenus mondiaux entre 1988 et 2008 et montre des gains très inégaux selon la position occupée dans la distribution mondiale. Profiter signifie ici voir son revenu réel progresser du fait de l’ouverture, ce qui suppose de distinguer le gain global de l’échange et sa répartition effective.", "problematique": "L’ouverture internationale améliore-t-elle la situation de tous les agents, ou produit-elle simultanément des gagnants et des perdants dont les positions traversent les frontières nationales ?", "plan": ["I. La mondialisation produit un gain global incontestable", "A. La spécialisation élève la richesse produite", "1) Smith et Ricardo montrent que la spécialisation engendre des gains de productivité, une efficacité accrue et une baisse des coûts.", "2) L’augmentation de la production disponible se traduit par des prix plus bas pour les consommateurs.", "3) L’accès à une variété de biens plus large accroît le pouvoir d’achat réel, effet souvent sous-estimé dans le débat public.", "B. Elle a permis un rattrapage historique de grands pays émergents", "1) L’hypermondialisation accompagne un déplacement du centre de gravité économique mondial vers l’Asie émergente.", "2) La Chine connaît une industrialisation rapide, une croissance très forte, une montée en gamme et une progression continue de ses exportations.", "3) Les inégalités entre certains pays ont ainsi diminué, ce qui constitue le principal succès de la période.", "C. Elle a rendu possible le financement du développement", "1) Nurkse avait décrit un cercle vicieux de la pauvreté résumé par la formule « un pays est pauvre parce qu’il est pauvre ».", "2) La faiblesse des revenus limite l’épargne, donc l’investissement, donc les gains de productivité nécessaires au développement.", "3) L’ouverture financière permet de recourir à l’épargne étrangère pour rompre ce cercle, un déficit courant pouvant alors signaler un dynamisme d’investissement.", "II. Mais la répartition de ces gains est profondément inégale", "A. Toutes les spécialisations ne se valent pas", "1) Une activité à forte technologie, forte valeur ajoutée et forte productivité ne procure pas les mêmes revenus qu’une activité peu qualifiée et facilement reproductible.", "2) Prebisch montre que la spécialisation primaire enferme les périphéries dans une détérioration des termes de l’échange, les contraignant à exporter toujours plus pour financer leurs importations manufacturées.", "3) Les théories de l’échange inégal radicalisent ce constat en analysant le commerce mondial comme un rapport de domination.", "B. Les institutions héritées prolongent ces asymétries", "1) Acemoglu et Robinson opposent institutions inclusives et institutions extractives, ces dernières organisant l’extraction des ressources au bénéfice d’une minorité.", "2) Dans le contexte colonial, terres, mines, main-d’œuvre et ressources naturelles ont été organisées au profit des puissances dominantes.", "3) La malédiction des ressources en est l’héritage contemporain : volatilité des revenus, faible diversification, dépendance extérieure.", "C. L’ouverture redistribue aussi à l’intérieur des pays", "1) Le théorème de Stolper-Samuelson, issu du modèle HOS, établit que les facteurs de production ne bénéficient pas également de l’ouverture.", "2) La demande augmente pour le facteur abondant et diminue pour le facteur rare, ce qui modifie durablement les rémunérations relatives.", "3) Dans les économies avancées, le travail peu qualifié, mis en concurrence internationale, en subit directement les effets.", "III. La courbe de l’éléphant montre que les lignes de partage traversent les pays", "A. La période retenue n’est pas arbitraire", "1) Milanovic étudie l’évolution des revenus mondiaux entre 1988 et 2008, deux bornes chargées de sens.", "2) La fin des années 1980 correspond à la chute du bloc soviétique, à la transition des économies socialistes et à l’ouverture de nouveaux marchés.", "3) Une part beaucoup plus importante de l’humanité entre alors dans l’économie de marché mondiale.", "B. Les gains se concentrent sur des positions précises de la distribution", "1) Les classes moyennes émergentes, notamment asiatiques, enregistrent les progressions de revenu les plus fortes.", "2) Les très hauts revenus mondiaux progressent également de manière marquée.", "3) Les classes populaires et moyennes inférieures des pays avancés connaissent en revanche une quasi-stagnation, d’où le sentiment de déclassement.", "C. Cette configuration produit des effets politiques directs", "1) Les populations se considérant comme perdantes soutiennent des programmes de droits de douane, de relocalisation et de préférence nationale.", "2) Aux États-Unis, le soutien d’anciennes régions industrielles à Donald Trump illustre cet enchaînement.", "3) La chaîne logique est claire : mondialisation, perception de perte, demande de protection, retour du protectionnisme."], "conclusion": "La mondialisation produit un gain global réel : la spécialisation accroît la richesse disponible, elle a permis le rattrapage spectaculaire de grands pays émergents et l’accès à l’épargne étrangère pour financer le développement. Mais ce gain se répartit très inégalement, parce que toutes les spécialisations ne se valent pas, parce que les institutions héritées de la colonisation prolongent les asymétries, et parce que l’ouverture modifie les rémunérations à l’intérieur même des pays. La courbe de l’éléphant établie par Milanovic en donne la formule : les gagnants et les perdants ne se répartissent pas entre nations mais à l’intérieur de chacune. C’est précisément cette configuration qui alimente aujourd’hui le retour des demandes de protection."}, "ch21-3": {"commentaire": "Sujet technique qui exige la maîtrise de l’identité macroéconomique. Il faut poser X − M = (S − I) + (T − G) et l’interpréter : un déficit courant signifie que la nation dépense plus qu’elle ne produit, donc qu’elle emprunte au reste du monde. Le devoir doit montrer qu’un déficit peut être vertueux (financement de l’investissement, Nurkse) ou dangereux (déficits jumeaux, dépendance aux capitaux volatils). Le cas américain du privilège exorbitant et la crise de la dette latino-américaine après le choc Volcker de 1979 sont les deux exemples décisifs. Ne pas confondre solde commercial et solde courant.", "intro": "En 2025, la France exporte pour 624 milliards d’euros de biens et en importe pour 682 milliards, soit un déficit commercial de biens de 58 milliards. Ce chiffre est régulièrement commenté comme un symptôme de déclin, comme si tout déficit extérieur traduisait mécaniquement une faiblesse. L’identité macroéconomique invite pourtant à la prudence : le solde courant, X − M, est égal à la somme de l’épargne privée nette, S − I, et du solde public, T − G. Un déficit signifie donc que la nation dépense davantage qu’elle ne produit et recourt à l’épargne étrangère. Reste à savoir ce que cette épargne finance, car un déficit extérieur n’est un problème que si les ressources empruntées ne créent pas les moyens de leur remboursement.", "problematique": "Un déficit du compte courant constitue-t-il par lui-même un déséquilibre à corriger, ou sa signification dépend-elle de l’usage fait des capitaux empruntés et de la soutenabilité du financement ?", "plan": ["I. Un déficit extérieur peut accompagner une dynamique de développement", "A. L’identité macroéconomique en donne la lecture exacte", "1) Le solde courant s’écrit X − M = (S − I) + (T − G) : il reflète l’écart entre l’épargne nationale et l’investissement.", "2) Un déficit courant peut donc provenir d’un investissement supérieur à l’épargne privée et non d’une consommation excessive.", "3) Il traduit alors un besoin de financement de la nation, couvert par un excédent du compte financier.", "B. Le recours à l’épargne étrangère peut rompre un cercle vicieux", "1) Nurkse formule le blocage par une phrase célèbre : « un pays est pauvre parce qu’il est pauvre ».", "2) La faiblesse des revenus réduit l’épargne disponible, ce qui limite l’investissement et empêche les gains de productivité.", "3) L’entrée de capitaux étrangers fournit la source de financement manquante, situation fréquente au début du développement économique.", "C. La nature des capitaux entrants est déterminante", "1) Les IDE correspondent à un investissement productif durable : usine créée, filiale implantée, entreprise acquise.", "2) Les investissements de portefeuille et les prêts sont plus liquides, donc plus facilement réversibles.", "3) Un déficit financé par des IDE engage la capacité productive future ; un déficit financé par des placements courts n’offre pas la même garantie.", "II. Mais un déficit durable révèle souvent un déséquilibre structurel", "A. Il peut traduire une insuffisance de compétitivité", "1) Un déficit commercial persistant signale que les produits nationaux se vendent moins bien que les produits importés.", "2) Il faut cependant distinguer le solde commercial, qui porte sur les biens et services, du solde courant, qui comprend aussi les revenus.", "3) Un pays peut ainsi afficher un déficit commercial tout en percevant d’importants revenus d’investissements à l’étranger.", "B. L’hypothèse des déficits jumeaux éclaire l’origine budgétaire de certains déficits", "1) Les déficits jumeaux désignent la coexistence d’un déficit budgétaire et d’un déficit courant.", "2) Le mécanisme est direct : déficit public accru, demande intérieure soutenue, importations en hausse, solde courant dégradé.", "3) Le déficit extérieur n’est alors qu’un symptôme, et son traitement passe par la politique budgétaire plutôt que par le commerce extérieur.", "C. La dépendance aux capitaux étrangers expose à des retournements brutaux", "1) Paul Volcker arrive à la tête de la Fed en 1979 dans un contexte d’inflation élevée et relève fortement les taux d’intérêt.", "2) Les placements américains deviennent plus attractifs et les capitaux mondiaux refluent massivement vers les États-Unis.", "3) Les économies latino-américaines, endettées en devises, basculent dans une crise de la dette : le financement extérieur s’était retourné contre elles.", "III. La soutenabilité, et non le signe du solde, constitue le critère pertinent", "A. Tout dépend de l’usage fait des ressources empruntées", "1) Un déficit finançant des investissements productifs crée les capacités d’exportation qui permettront de le résorber.", "2) Un déficit finançant la consommation courante accroît la position débitrice sans contrepartie productive.", "3) La position extérieure nette, qui cumule ces flux, importe donc davantage que le solde d’une année isolée.", "B. Hélène Rey montre que les déséquilibres reflètent des modèles de croissance", "1) Les déséquilibres mondiaux excessifs résultent de stratégies nationales de croissance elles-mêmes déséquilibrées.", "2) Les principales zones concernées sont les États-Unis, la Chine, l’Union européenne et les pays exportateurs de pétrole.", "3) Un excédent durable n’est donc pas davantage une vertu qu’un déficit n’est un vice : il peut signaler une demande intérieure insuffisante.", "C. Les positions ne sont pas symétriques entre pays", "1) Le dollar occupe une place centrale dans le système monétaire international et les titres publics américains sont particulièrement recherchés.", "2) Les États-Unis peuvent ainsi attirer massivement des capitaux et emprunter dans leur propre monnaie : c’est le « privilège exorbitant ».", "3) Un déficit identique n’a donc pas la même signification selon que le pays emprunte dans sa monnaie ou en devises étrangères."], "conclusion": "Un déficit extérieur n’est pas en soi un problème : l’identité X − M = (S − I) + (T − G) montre qu’il traduit un recours à l’épargne étrangère, lequel peut financer l’investissement et rompre le cercle vicieux décrit par Nurkse. Il devient préoccupant lorsqu’il signale une insuffisance de compétitivité, lorsqu’il accompagne un déficit budgétaire selon la logique des déficits jumeaux, ou lorsqu’il repose sur des capitaux volatils — comme l’a montré la crise latino-américaine après le choc Volcker de 1979. Le critère pertinent est donc la soutenabilité, non le signe du solde. Et il n’est même pas identique pour tous, puisque le privilège exorbitant permet aux États-Unis de s’endetter dans leur propre monnaie."}, "ch21-4": {"commentaire": "Sujet méthodologique, rare et discriminant. Il ne s’agit pas de décrire la mondialisation mais d’examiner les instruments qui la mesurent. Le plan attendu est : le taux d’ouverture est l’indicateur de référence et présente de réels avantages ; il souffre d’un biais majeur, le double comptage lié à la fragmentation productive ; la mesure en valeur ajoutée corrige ce biais mais ne suffit pas davantage à épuiser le phénomène. L’exemple de l’iPhone est le cœur du devoir et doit être quantifié. Les dégroupages de Baldwin expliquent pourquoi le biais s’est aggravé avec le temps.", "intro": "Mesurer la mondialisation commerciale paraît simple : on rapporte les échanges extérieurs à la richesse produite, et l’on obtient un taux d’ouverture immédiatement comparable dans le temps et entre pays. C’est ainsi que l’on établit que la première mondialisation, entre 1870 et 1913, atteignait un taux d’ouverture moyen de l’ordre de 14 à 15 % à son sommet. L’indicateur souffre pourtant d’un défaut de construction : il compare des exportations comptabilisées en valeur brute à un PIB mesuré en valeur ajoutée. Or, depuis que les processus productifs sont fragmentés entre plusieurs pays, un même composant traverse plusieurs frontières et se trouve compté plusieurs fois. Mesurer suppose donc d’abord de savoir ce que l’indicateur additionne réellement.", "problematique": "Le taux d’ouverture mesure-t-il fidèlement l’intensité de l’intégration commerciale, ou la fragmentation internationale de la production impose-t-elle de reconstruire l’indicateur ?", "plan": ["I. Le taux d’ouverture constitue l’indicateur de référence", "A. Sa construction est simple et comparable", "1) Il rapporte les échanges extérieurs, exportations et importations, à la richesse produite par l’économie.", "2) Il permet des comparaisons internationales immédiates et le suivi d’une même économie dans la durée.", "3) Il a rendu possible l’établissement d’un repère historique : environ 14 à 15 % au sommet de la première mondialisation de 1870 à 1913.", "B. Il traduit effectivement une réalité économique", "1) Sa progression accompagne la chute des coûts de transport, que Bairoch estime presque divisés par dix entre le début du XIXᵉ siècle et 1910 environ.", "2) Il capte la spécialisation internationale croissante et l’élargissement des débouchés.", "3) Il permet d’objectiver le ralentissement observé depuis 2008, lorsque le commerce mondial cesse de croître plus vite que le PIB mondial.", "C. Il s’insère dans un ensemble d’indicateurs complémentaires", "1) La balance des paiements enregistre l’ensemble des flux entre une économie et le reste du monde.", "2) Le solde commercial au sens strict porte sur les biens, au sens élargi sur les biens et services : en 2025 la France exporte 624 milliards d’euros de biens et en importe 682.", "3) Le solde courant ajoute les revenus, ce qui interdit de le confondre avec le seul solde commercial.", "II. Mais la fragmentation productive fausse profondément cette mesure", "A. Baldwin explique pourquoi la production s’est dispersée", "1) Le premier dégroupage sépare le lieu de production du lieu de consommation grâce à la baisse des coûts de transport.", "2) Le second dégroupage sépare les étapes du processus productif lui-même entre plusieurs pays.", "3) On échange dès lors massivement des biens intermédiaires, ce que Baldwin nomme un « commerce de tâches ».", "B. Le double comptage en résulte mécaniquement", "1) Un composant franchissant plusieurs frontières est enregistré à chaque passage pour sa valeur totale.", "2) Les statistiques commerciales additionnent donc plusieurs fois une même valeur créée en amont.", "3) Le biais est d’autant plus fort que l’économie est spécialisée dans l’assemblage en fin de chaîne.", "C. L’iPhone fournit le cas d’école", "1) Un iPhone est conçu aux États-Unis, incorpore des composants de plusieurs pays, est assemblé en Chine puis réexporté.", "2) Un prix exporté de 1 000 dollars est intégralement inscrit aux exportations chinoises, alors que la valeur réellement créée en Chine est faible.", "3) L’expression « Made in World » traduit cette impossibilité d’attribuer un produit à un seul pays d’origine.", "III. La mesure en valeur ajoutée corrige le biais sans épuiser le phénomène", "A. Elle rétablit la cohérence de l’indicateur", "1) Elle ne retient que la valeur effectivement créée dans chaque pays, ce qui met numérateur et dénominateur sur la même base.", "2) Elle réduit sensiblement les taux d’ouverture apparents des économies d’assemblage.", "3) Elle modifie la lecture des déséquilibres bilatéraux, une part du déficit attribué à un pays revenant en réalité à ses fournisseurs.", "B. Elle permet de mieux interpréter le ralentissement récent", "1) Depuis 2008, le commerce mondial progresse à un rythme proche de celui du PIB mondial, d’où le terme de slowbalization.", "2) Ce ralentissement peut refléter une réorganisation des chaînes de valeur plutôt qu’un recul de l’intégration.", "3) Distinguer ces deux hypothèses suppose précisément de raisonner en valeur ajoutée et non en flux bruts.", "C. Aucune mesure commerciale ne suffit pourtant à saisir la mondialisation", "1) Michalet rappelle que le phénomène comporte aussi des IDE et des flux financiers, que le commerce ne capte pas.", "2) Béraud montrait déjà, pour la première mondialisation, que les placements de portefeuille représentaient 80 à 90 % des mouvements de capitaux.", "3) Les migrations, qui font circuler le facteur travail, échappent également à toute statistique commerciale."], "conclusion": "Le taux d’ouverture demeure l’instrument de référence de la mondialisation commerciale : simple, comparable, il fournit des repères historiques solides comme les 14 à 15 % atteints entre 1870 et 1913. Mais la fragmentation productive décrite par Baldwin le fausse profondément, puisqu’il additionne en valeur brute des flux dont une même valeur ajoutée est comptée plusieurs fois — ce que l’exemple de l’iPhone rend immédiatement visible. La mesure en valeur ajoutée corrige ce double comptage et permet d’interpréter correctement la slowbalization observée depuis 2008. Elle ne suffit pas pour autant, car la mondialisation comporte des dimensions productive et financière qu’aucun indicateur commercial ne saurait enregistrer."}, "ch21-5": {"commentaire": "Sujet très actuel, à traiter sans céder au récit. Il faut d’abord établir la rationalité économique des chaînes de valeur : le second dégroupage de Baldwin, les gains de spécialisation et l’abaissement des coûts. Puis montrer précisément par quels canaux la dépendance devient un risque : matériaux critiques, concentration des fournisseurs, arsenalisation des instruments économiques. La troisième partie doit arbitrer entre efficacité et résilience, et discuter la relocalisation sans la présenter comme une solution évidente. Les notions de matériau critique et de dépendance non matérielle sont attendues.", "intro": "Un produit manufacturé contemporain n’a plus de pays d’origine identifiable : conçu dans une économie, composé d’éléments venus de plusieurs autres, assemblé dans une troisième, il incarne ce que l’on nomme le « Made in World ». Richard Baldwin a montré que cette organisation résulte d’un second dégroupage, qui sépare les étapes du processus productif entre pays et substitue au commerce de biens finis un « commerce de tâches ». Cette fragmentation a longtemps été analysée comme un pur gain d’efficacité. Les ruptures d’approvisionnement récentes ont rappelé qu’elle crée aussi des dépendances. Une chaîne de valeur mondiale désigne l’ensemble des étapes de production d’un bien réparties entre plusieurs pays, chacune y apportant une valeur ajoutée spécifique.", "problematique": "La fragmentation internationale de la production constitue-t-elle un gain d’efficacité, ou expose-t-elle les économies à des dépendances dont le coût excède ces gains ?", "plan": ["I. Les chaînes de valeur mondiales répondent à une logique économique puissante", "A. Elles prolongent la logique de la spécialisation", "1) Chaque étape est localisée là où elle est réalisée au moindre coût, ce qui pousse à son terme le raisonnement ricardien.", "2) La spécialisation par tâche est plus fine que la spécialisation par produit : elle permet des gains que la seconde n’atteignait pas.", "3) Le premier dégroupage avait séparé production et consommation ; le second sépare les étapes de la production elle-même.", "B. Elles abaissent les coûts et élargissent les marchés", "1) La baisse des coûts de transport et de communication rend la coordination internationale économiquement viable.", "2) Les firmes issues de petits marchés nationaux dépassent ainsi l’étroitesse de leur demande intérieure.", "3) Les consommateurs bénéficient de prix plus bas et d’une variété de produits plus large.", "C. Elles ont permis à des économies d’entrer dans l’industrie mondiale", "1) Un pays peut s’insérer sur une seule tâche sans maîtriser l’ensemble du processus productif.", "2) Cette insertion partielle a servi de point de départ à des stratégies de montée en gamme, notamment en Asie.", "3) La Chine en est l’exemple central : industrialisation rapide, montée en gamme progressive et développement technologique.", "II. Mais cette organisation crée des dépendances difficiles à substituer", "A. Certains intrants sont devenus des matériaux critiques", "1) Un matériau est dit critique lorsqu’il est indispensable à la production, difficilement substituable et concentré chez un petit nombre de fournisseurs.", "2) Le lithium en est l’exemple type, aux côtés des terres rares, du cobalt, du nickel et de certains semi-conducteurs.", "3) Une interruption d’approvisionnement peut alors perturber des secteurs entiers, et non un seul produit.", "B. Les dépendances ne sont pas seulement matérielles", "1) Elles portent aussi sur des technologies, des logiciels, des brevets et des infrastructures numériques.", "2) Une économie peut disposer des matières premières tout en dépendant des outils nécessaires à leur transformation.", "3) Ces dépendances immatérielles sont plus difficiles à identifier, donc plus difficiles à réduire.", "C. Elles peuvent être transformées en instruments de puissance", "1) On parle d’arsenalisation de la politique économique lorsque des instruments économiques deviennent des armes.", "2) Droits de douane, sanctions, restrictions technologiques, contrôle des exportations et restrictions aux investissements en constituent l’arsenal.", "3) L’objectif peut être explicitement de ralentir la montée en gamme d’un rival, ce qui déplace la question sur le terrain géopolitique.", "III. L’enjeu est donc l’arbitrage entre efficacité et résilience", "A. La relocalisation n’est pas une solution évidente", "1) Elle suppose de renoncer à une partie des gains de spécialisation, donc d’accepter des coûts de production plus élevés.", "2) Certaines compétences industrielles perdues ne se reconstituent ni rapidement ni à volonté.", "3) Une chaîne entièrement nationale peut d’ailleurs être plus vulnérable qu’une chaîne diversifiée, si le choc frappe le territoire lui-même.", "B. La diversification constitue souvent la réponse la plus réaliste", "1) Multiplier les fournisseurs réduit l’exposition sans supprimer les gains de la division internationale du travail.", "2) La constitution de stocks stratégiques atténue les ruptures temporaires sur les intrants critiques.", "3) Williamson avait montré que plus une transaction est spécifique et incertaine, plus l’internalisation devient avantageuse : l’arbitrage marché-hiérarchie se pose ici à l’échelle mondiale.", "C. Cette question réactive celle de la souveraineté économique", "1) La mobilité de la firme globale limite l’autonomie des politiques nationales, et les États cherchent à reprendre le contrôle des secteurs stratégiques.", "2) Giraud décrit une généralisation des compétitions qui met les territoires eux-mêmes en concurrence pour retenir les activités.", "3) Le ralentissement observé depuis 2008, qualifié de slowbalization, traduit peut-être moins un recul de l’intégration qu’une réorganisation des chaînes en fonction du risque."], "conclusion": "Les chaînes de valeur mondiales prolongent la logique de la spécialisation jusqu’à la tâche élémentaire, et elles ont procuré des gains réels : coûts abaissés, marchés élargis, insertion industrielle de nouvelles économies. Mais elles créent des dépendances concentrées sur des matériaux critiques et des technologies difficilement substituables, et ces dépendances peuvent être converties en instruments de puissance par l’arsenalisation des politiques économiques. Elles ne fragilisent donc pas les économies par nature : elles déplacent le risque de la production vers l’approvisionnement. L’enjeu n’est pas de choisir entre ouverture et repli, mais d’arbitrer entre efficacité et résilience, ce que la diversification permet mieux que la relocalisation."}, "ch21-6": {"commentaire": "Sujet historique par excellence : la réponse est fournie par l’entre-deux-guerres, mais elle doit être démontrée et non affirmée. La première partie doit établir le précédent : la première mondialisation a bel et bien été interrompue, et le tarif Hawley-Smoot en est le symbole. La deuxième doit montrer ce qui rend un tel retournement plus difficile aujourd’hui : l’imbrication productive et financière. La troisième arbitre en distinguant recul et transformation, ce que le terme de slowbalization permet précisément de penser. Le sujet interdit de conclure abruptement dans un sens ou dans l’autre.", "intro": "La mondialisation est souvent présentée comme un processus irréversible, porté par des évolutions techniques que nul ne saurait défaire. L’histoire contredit cette certitude. La première mondialisation, entre 1870 et 1913, avait porté le taux d’ouverture moyen à 14 ou 15 % ; elle s’est pourtant interrompue, et la crise de 1929 a transformé un retour protectionniste en véritable mouvement de démondialisation, dont le tarif Hawley-Smoot aux États-Unis constitue le symbole. Un précédent existe donc. Reste à savoir s’il est transposable à une intégration devenue productive et financière autant que commerciale. Une mondialisation réversible serait un processus dont l’intensité peut durablement décroître sous l’effet de décisions politiques ou de chocs économiques.", "problematique": "L’intégration économique mondiale peut-elle véritablement reculer, comme elle l’a fait dans l’entre-deux-guerres, ou sa nature actuelle rend-elle un tel retournement impossible ?", "plan": ["I. L’histoire établit qu’un recul est possible", "A. La première mondialisation a bien été interrompue", "1) Entre 1870 et 1913, l’intégration commerciale atteint un sommet avec un taux d’ouverture de l’ordre de 14 à 15 %.", "2) Ce mouvement ne résultait pas d’une loi naturelle mais d’une conjonction de facteurs techniques et politiques.", "3) La rupture est profonde : la période suivante voit le commerce international reculer et l’économie mondiale se fragmenter.", "B. La crise de 1929 transforme le repli en démondialisation", "1) Après 1929, les tarifs douaniers augmentent fortement dans l’ensemble des grandes économies.", "2) Les États-Unis adoptent le tarif Hawley-Smoot et le Royaume-Uni rétablit des droits de douane élevés.", "3) L’enchaînement est cumulatif : commerce international en baisse, fragmentation accrue, démondialisation.", "C. Le protectionnisme dispose d’une justification théorique ancienne", "1) Alexander Hamilton défend un protectionnisme industriel destiné à protéger les producteurs américains de la concurrence britannique.", "2) Friedrich List formule en 1841 le protectionnisme éducateur : une industrie naissante ne peut affronter immédiatement une industrie étrangère déjà compétitive.", "3) La protection doit y être temporaire, ciblée et destinée à construire la compétitivité, ce qui en fait un argument économique et non seulement défensif.", "II. Mais l’intégration actuelle est d’une nature différente", "A. Elle est productive et non seulement commerciale", "1) Michalet montre que les configurations sont cumulatives : le commercial, le productif et le financier s’additionnent.", "2) Le second dégroupage de Baldwin a réparti les étapes d’un même processus productif entre plusieurs pays.", "3) Défaire ces chaînes suppose de reconstituer des capacités industrielles entières, ce qui prend des années et coûte cher.", "B. Elle est financière et donc difficilement réversible", "1) L’hypermondialisation se caractérise par une mobilité financière massive, multidirectionnelle et volatile.", "2) Les positions extérieures accumulées lient durablement les économies entre elles, créanciers et débiteurs.", "3) Un repli commercial ne défait pas ces engagements financiers, qui continuent de produire leurs effets.", "C. Les acteurs eux-mêmes résistent au repli", "1) Les firmes globales arbitrent entre territoires et n’ont aucun intérêt à voir se fermer les marchés qui fondent leur modèle.", "2) Giraud décrit une généralisation des compétitions dans laquelle les territoires cherchent à retenir ces firmes plutôt qu’à les exclure.", "3) Les consommateurs bénéficient de prix bas dont la remise en cause serait immédiatement perceptible.", "III. Le mouvement actuel relève davantage de la transformation que du recul", "A. Le ralentissement observé depuis 2008 est réel mais ambigu", "1) Pendant l’hypermondialisation, le commerce mondial progressait beaucoup plus vite que le PIB mondial.", "2) Depuis 2008, il croît à un rythme proche de celui du PIB, d’où le terme de slowbalization.", "3) Ce ralentissement peut traduire une réorganisation des chaînes de valeur autant qu’un reflux de l’intégration.", "B. Des forces politiques poussent néanmoins au repli", "1) Les populations se percevant comme perdantes soutiennent droits de douane, relocalisation et préférence nationale.", "2) Aux États-Unis, le soutien d’anciennes régions industrielles à Donald Trump illustre la traduction politique de ce sentiment.", "3) L’arsenalisation de la politique économique — sanctions, restrictions technologiques, contrôle des exportations — fragmente délibérément certains marchés.", "C. La forme la plus probable est une recomposition régionale et stratégique", "1) Les échanges se réorganisent autour de blocs et d’alliances plutôt qu’ils ne disparaissent.", "2) Les secteurs jugés stratégiques — semi-conducteurs, technologies vertes, matériaux critiques — sont traités à part du reste des échanges.", "3) La leçon de l’entre-deux-guerres demeure toutefois : un repli cumulatif reste possible, et il ne résulte d’aucune fatalité mais de décisions politiques."], "conclusion": "La mondialisation est réversible, et l’histoire en fournit la preuve : la première mondialisation s’est interrompue, et la crise de 1929 a converti le repli protectionniste en démondialisation cumulative, dont le tarif Hawley-Smoot reste le symbole. Mais l’intégration contemporaine est d’une autre nature : productive et financière autant que commerciale, elle lie les économies par des chaînes de valeur et des positions extérieures qu’un simple relèvement tarifaire ne défait pas. Le ralentissement observé depuis 2008 traduit donc plutôt une recomposition — régionale, stratégique, sélective — qu’un reflux général. La leçon de l’entre-deux-guerres subsiste néanmoins : rien n’y est naturel, et ce qu’une décision politique a construit, une autre peut le défaire."}, "ch21-7": {"commentaire": "Sujet qui oppose frontalement la théorie classique et les analyses du développement. La première partie doit exposer correctement le gain à l’échange — Ricardo, avantages comparatifs, HOS — sans le caricaturer. La deuxième montre que toutes les spécialisations ne se valent pas : c’est la distinction entre gain global et répartition, avec Prebisch et la détérioration des termes de l’échange. La troisième introduit les institutions (Acemoglu et Robinson) et la malédiction des ressources, pour conclure que l’avantage dépend du contenu de la spécialisation et de la capacité à en changer.", "intro": "Ricardo a légué à l’analyse économique un résultat d’une force rare : même un pays désavantagé dans toutes les productions gagne à se spécialiser là où son désavantage est le plus faible. Le commerce international serait ainsi avantageux pour tous, indépendamment des niveaux de développement. L’observation historique complique pourtant ce résultat. Raúl Prebisch montre que les économies spécialisées dans les produits primaires subissent une détérioration des termes de l’échange qui les contraint à exporter toujours davantage pour financer les mêmes importations manufacturées. La spécialisation désigne la concentration d’une économie sur certaines productions ; la question est de savoir si son contenu importe autant que son principe.", "problematique": "Toute spécialisation internationale procure-t-elle un avantage équivalent, ou la nature des productions retenues détermine-t-elle la trajectoire de développement d’une économie ?", "plan": ["I. La spécialisation procure un gain global démontré", "A. Les classiques en établissent le principe", "1) Smith fonde l’échange sur l’avantage absolu, chaque pays produisant ce qu’il réalise au moindre coût.", "2) Ricardo généralise avec l’avantage comparatif : le gain subsiste même lorsqu’un pays est désavantagé partout.", "3) La spécialisation procure gains de productivité, efficacité accrue, baisse des coûts et augmentation de la production disponible.", "B. Le modèle HOS en précise le fondement", "1) Les pays se spécialisent selon leurs dotations relatives en facteurs de production.", "2) L’échange équivaut alors à un échange indirect de facteurs, chacun exportant celui dont il est abondamment doté.", "3) Le théorème de Stolper-Samuelson en tire la conséquence distributive : les facteurs ne bénéficient pas également de l’ouverture.", "C. L’histoire confirme la réalité de ces gains", "1) La première mondialisation, de 1870 à 1913, associe approfondissement de la spécialisation et forte croissance des échanges.", "2) La baisse des coûts de transport, estimée par Bairoch à une division par dix environ entre le début du XIXᵉ siècle et 1910, en a été le moteur.", "3) Plus récemment, l’insertion dans les chaînes de valeur a permis à des économies asiatiques d’entrer dans l’industrie mondiale.", "II. Mais toutes les spécialisations n’ouvrent pas les mêmes perspectives", "A. Le contenu de la spécialisation détermine les revenus", "1) Une activité à forte technologie, forte valeur ajoutée et forte productivité ne procure pas les mêmes revenus qu’une activité peu qualifiée et facilement reproductible.", "2) Il faut donc distinguer le gain global à l’échange et la répartition de ce gain entre partenaires.", "3) La division internationale du travail traditionnelle opposait précisément un centre exportant des produits manufacturés et des périphéries fournissant des produits primaires.", "B. Prebisch analyse le mécanisme de l’enfermement", "1) Le centre correspond aux économies industrialisées, la périphérie à celles spécialisées dans les matières premières et les activités à faible valeur ajoutée.", "2) La détérioration des termes de l’échange oblige les périphéries à exporter des volumes croissants pour financer les mêmes importations.", "3) Les théories de l’échange inégal prolongent cette analyse en décrivant le commerce mondial comme un rapport de domination.", "C. Cette spécialisation n’a pas toujours été choisie", "1) Pendant la colonisation, les puissances européennes ont largement imposé aux territoires colonisés leur place dans la division du travail.", "2) Acemoglu et Robinson montrent que des institutions extractives ont été construites pour capter terres, mines, main-d’œuvre et ressources naturelles.", "3) Ces institutions survivent souvent aux indépendances et continuent d’orienter les trajectoires productives.", "III. L’avantage dépend donc de la capacité à faire évoluer sa spécialisation", "A. La malédiction des ressources illustre le risque de l’immobilisme", "1) Une spécialisation primaire expose à la volatilité des revenus et à une faible diversification.", "2) Elle engendre une dépendance extérieure et des difficultés durables d’industrialisation.", "3) La rente peut dispenser d’investir dans les capacités productives et éducatives nécessaires au changement.", "B. La montée en gamme constitue la stratégie déterminante", "1) Les avantages comparatifs ne sont pas donnés une fois pour toutes : ils se construisent par l’investissement et la technologie.", "2) List l’avait soutenu dès 1841 avec le protectionnisme éducateur, protection temporaire et ciblée destinée à bâtir une compétitivité future.", "3) La Chine en fournit l’exemple contemporain : d’une insertion par l’assemblage à une montée en gamme visant la frontière technologique.", "C. Les chaînes de valeur rendent cette évolution à la fois plus accessible et plus incertaine", "1) Le second dégroupage de Baldwin permet d’entrer dans l’industrie mondiale par une seule tâche, sans maîtriser tout le processus.", "2) Mais l’économie peut aussi rester durablement cantonnée aux tâches d’assemblage à faible valeur ajoutée.", "3) L’arsenalisation de la politique économique — restrictions technologiques, contrôle des exportations — vise d’ailleurs explicitement à ralentir la montée en gamme des rivaux."], "conclusion": "La spécialisation internationale procure un gain global démontré depuis Ricardo, et l’histoire de la première mondialisation comme celle de l’insertion asiatique récente le confirment. Mais ce gain global ne dit rien de sa répartition, et toutes les spécialisations n’ouvrent pas les mêmes perspectives : Prebisch montre que la spécialisation primaire enferme les périphéries dans une détérioration des termes de l’échange, souvent héritée d’institutions extractives que décrivent Acemoglu et Robinson. L’avantage ne tient donc pas au principe de la spécialisation mais à son contenu, et surtout à la capacité d’en changer. C’est pourquoi la montée en gamme, déjà pressentie par List en 1841, reste la véritable variable stratégique."}, "ch21-8": {"commentaire": "Sujet de rapport de force, à traiter avec des mécanismes précis et non avec des comparaisons de chiffre d’affaires et de PIB, qui n’ont pas le même statut comptable. Il faut montrer les leviers réels de la firme globale — mobilité, arbitrage entre territoires, maîtrise technologique — puis rappeler que l’État conserve des instruments majeurs, y compris ceux de l’arsenalisation. La troisième partie doit poser la tension centrale du chapitre : souveraineté de l’État contre mobilité de la firme. Giraud et Michalet sont les deux auteurs directeurs.", "intro": "La firme globale arbitre en permanence entre territoires : elle choisit où produire, où déclarer ses résultats, où investir, et peut déplacer ces décisions plus vite qu’un État ne modifie sa législation. Cette asymétrie de vitesse a nourri l’idée d’un basculement du pouvoir économique des États vers les entreprises. Pierre-Noël Giraud décrit en ce sens une généralisation des compétitions qui met les territoires eux-mêmes en concurrence pour attirer et retenir les activités. Le chapitre formule pourtant la relation comme une tension et non comme une hiérarchie : souveraineté de l’État contre mobilité de la firme. Une firme multinationale se définit comme une entreprise implantée productivement dans plusieurs pays, au-delà de la seule exportation.", "problematique": "La mobilité des firmes multinationales leur confère-t-elle une primauté sur les États, ou modifie-t-elle un rapport de force dans lequel la puissance publique conserve des instruments décisifs ?", "plan": ["I. Les firmes multinationales disposent de leviers considérables", "A. Leur mobilité contraint les politiques nationales", "1) L’IDE est par nature délocalisable : créer une usine ailleurs, acquérir une entreprise étrangère ou implanter une filiale relèvent d’un arbitrage.", "2) Les États cherchent dès lors à conserver les entreprises, attirer les IDE et empêcher certaines délocalisations.", "3) Cette recherche d’attractivité pèse sur la fiscalité, la réglementation et le droit du travail.", "B. Elles organisent la production à l’échelle mondiale", "1) Le second dégroupage décrit par Baldwin leur permet de répartir les étapes d’un même processus entre plusieurs pays.", "2) Elles pilotent ainsi des chaînes de valeur qui traversent les frontières et échappent à tout cadre national unique.", "3) La valeur créée se localise où elles le décident, ce qui rend la matière imposable elle-même mobile.", "C. Certaines détiennent un pouvoir de marché considérable", "1) La concentration confère à quelques firmes une position dominante sur des marchés mondiaux.", "2) Dans le numérique, effets de réseau et avantage du premier entrant rendent l’entrée de concurrents peu crédible.", "3) Giraud décrit cette généralisation des compétitions comme une mise en concurrence simultanée des territoires et des acteurs.", "II. Mais les États conservent des instruments décisifs", "A. Ils demeurent maîtres du cadre juridique et fiscal", "1) Le droit de la concurrence, la fiscalité et la régulation sectorielle s’appliquent sur le territoire, quel que soit le siège de la firme.", "2) Le Digital Markets Act européen régule ex ante les plateformes structurantes, ce qui montre la capacité de la puissance publique à contraindre.", "3) Le contrôle des concentrations permet d’interdire une opération, comme l’a montré le refus de la fusion Alstom-Siemens en 2019.", "B. Ils disposent d’instruments de puissance proprement économiques", "1) L’arsenalisation de la politique économique consiste à employer des instruments économiques comme des armes.", "2) Droits de douane, sanctions, restrictions technologiques, contrôle des exportations et restrictions aux investissements en composent la panoplie.", "3) L’objectif affiché peut être de ralentir la montée en gamme d’un rival, ce qu’aucune firme ne pourrait accomplir seule.", "C. Ils conservent la maîtrise des ressources stratégiques", "1) Les matériaux critiques — lithium, terres rares, cobalt, nickel, certains semi-conducteurs — sont concentrés dans un petit nombre de pays.", "2) L’accès à ces ressources relève de décisions publiques que les firmes subissent plus qu’elles ne les orientent.", "3) Les infrastructures, la formation et la recherche fondamentale restent largement financées par la puissance publique.", "III. Le rapport est donc une tension permanente et non une hiérarchie établie", "A. Les positions ne sont pas symétriques entre États", "1) Un grand marché dispose d’un pouvoir de régulation qu’une petite économie ouverte n’a pas.", "2) Le privilège exorbitant américain illustre une asymétrie comparable dans le domaine monétaire et financier.", "3) Les firmes elles-mêmes dépendent de la protection juridique et diplomatique de leur État d’origine.", "B. Les objectifs se recouvrent partiellement", "1) Un État peut avoir intérêt à voir ses firmes conquérir des marchés extérieurs, d’où la question de la taille critique.", "2) Les firmes ont besoin de stabilité juridique, d’infrastructures et de main-d’œuvre qualifiée que seuls les États fournissent.", "3) La rivalité sino-américaine porte ainsi simultanément sur des firmes et sur des politiques publiques, dans le numérique, l’IA, les semi-conducteurs et les technologies vertes.", "C. La question redevient celle de la souveraineté économique", "1) La mobilité de la firme globale limite l’autonomie des politiques nationales, ce que le chapitre formule comme une tension fondamentale.", "2) Les États cherchent à reprendre le contrôle sur les implantations et les secteurs jugés stratégiques.", "3) Le mouvement récent de relocalisation sélective traduit cette reprise en main, sans pour autant remettre en cause l’ouverture générale."], "conclusion": "Les firmes multinationales disposent de leviers réels : leur mobilité contraint les politiques d’attractivité, leur pilotage des chaînes de valeur rend la valeur créée elle-même mobile, et la concentration leur confère sur certains marchés un pouvoir considérable. Mais les États conservent le cadre juridique et fiscal, la régulation ex ante des plateformes, le contrôle des concentrations, la maîtrise des ressources critiques et les instruments d’une arsenalisation que nulle entreprise ne peut égaler. Il n’y a donc pas primauté d’un acteur sur l’autre, mais la tension permanente que décrit le chapitre entre souveraineté de l’État et mobilité de la firme. Et cette tension se rejoue différemment selon la taille du marché et la monnaie dont dispose chaque État."}, "ch21-9": {"commentaire": "Sujet de géographie économique à traiter dans la longue période. Le chapitre fournit les données de Maddison sur le poids des futurs BRIC en 1700 et 1820, qui permettent de montrer que le déplacement contemporain est en partie un retour. Le plan doit distinguer trois moments : la domination européenne de 1870-1913, le basculement vers l’Asie émergente, et la persistance des asymétries qui empêchent de conclure à un simple renversement — privilège exorbitant, frontière technologique. Éviter d’écrire que la Chine aurait « remplacé » les États-Unis : la rivalité est en cours, pas tranchée.", "intro": "On présente souvent le basculement de l’économie mondiale vers l’Asie comme une nouveauté historique. Les données de long terme rassemblées par Maddison conduisent à nuancer ce jugement : vers 1700, les futurs BRIC représentaient déjà environ 51 % du PIB mondial, et encore près de 55 % en 1820. C’est l’industrialisation européenne qui a produit l’exception, en concentrant pour un siècle et demi la richesse et la puissance technologique sur une fraction étroite du monde. Entre 1870 et 1913, le centre de gravité de l’économie mondiale se situe ainsi en Europe occidentale, le Royaume-Uni y combinant avance industrielle, empire, puissance commerciale et puissance financière. Parler de déplacement suppose donc de choisir la période de référence.", "problematique": "Le basculement contemporain vers l’Asie émergente constitue-t-il un renversement inédit de la hiérarchie économique mondiale, ou le retour d’une configuration que l’industrialisation européenne avait interrompue ?", "plan": ["I. La première mondialisation avait concentré la puissance en Europe occidentale", "A. Le Royaume-Uni en constitue le centre", "1) Entre 1870 et 1913, le centre de gravité de l’économie mondiale se situe en Europe occidentale.", "2) Le Royaume-Uni bénéficie simultanément de son avance industrielle, de son empire, de sa puissance commerciale et de sa puissance financière.", "3) Cette combinaison explique qu’il structure à la fois les flux de marchandises et les flux de capitaux.", "B. Cette domination s’appuie sur une division internationale du travail asymétrique", "1) La DIT traditionnelle attribue aux pays du centre les produits manufacturés et aux périphéries les matières premières.", "2) Prebisch montre que cette répartition enferme les périphéries dans une détérioration des termes de l’échange.", "3) La colonisation impose largement cette place, Acemoglu et Robinson décrivant les institutions extractives qui l’organisent.", "C. Elle repose aussi sur la maîtrise des capitaux", "1) Béraud établit que les investissements de portefeuille représentent alors 80 à 90 % des mouvements de capitaux, contre 10 à 20 % pour les IDE.", "2) La première mondialisation financière est donc une mondialisation de placements et de prêts plutôt que d’implantations productives.", "3) Les économies européennes exportent leur épargne et en tirent des revenus, ce qui consolide leur position.", "II. L’hypermondialisation déplace ce centre vers l’Asie émergente", "A. La Chine en constitue le moteur principal", "1) Elle connaît une industrialisation rapide, une croissance très forte et une progression continue de ses exportations.", "2) Sa montée en gamme et son développement technologique la rendent progressivement capable de contester les États-Unis.", "3) Son insertion par les chaînes de valeur, rendue possible par le second dégroupage de Baldwin, a servi de point de départ.", "B. L’affirmation des BRICS rend ce déplacement visible", "1) Leur entrée sur la scène internationale traduit un poids économique désormais difficile à ignorer dans les instances mondiales.", "2) Les données de Maddison montrent que ce poids constitue en partie un retour : environ 51 % du PIB mondial vers 1700 et 55 % en 1820.", "3) L’industrialisation européenne avait donc interrompu une configuration ancienne plus qu’elle n’avait inauguré la norme.", "C. Ce déplacement modifie les inégalités mondiales", "1) Milanovic parle d’un « big bang » des inégalités globales provoqué par la révolution industrielle et le décrochage des économies non industrialisées.", "2) Le rattrapage récent réduit certaines inégalités entre pays, ce que la courbe de l’éléphant établie sur 1988-2008 rend lisible.", "3) Les classes moyennes émergentes enregistrent les plus fortes progressions de revenu de la période.", "III. Le renversement demeure pourtant inachevé", "A. Des asymétries monétaires et financières majeures subsistent", "1) Le dollar occupe une place centrale dans le système monétaire international et les titres publics américains restent particulièrement recherchés.", "2) Les États-Unis peuvent ainsi attirer massivement les capitaux et emprunter dans leur propre monnaie : c’est le privilège exorbitant.", "3) Le choc Volcker de 1979 avait déjà montré que les décisions monétaires américaines commandent les flux de capitaux mondiaux.", "B. La rivalité porte désormais sur la frontière technologique", "1) La Chine ne se contente plus de produits peu sophistiqués et d’activités à faible coût : elle vise la frontière technologique.", "2) La rivalité porte sur le numérique, l’intelligence artificielle, les semi-conducteurs, les technologies vertes et les industries stratégiques.", "3) Le conflit n’oppose donc plus un pays développé à un pays atelier, mais deux puissances technologiques.", "C. Le déplacement se heurte à des instruments de puissance", "1) L’arsenalisation de la politique économique vise explicitement à ralentir la montée en gamme du rival.", "2) Droits de douane, sanctions, restrictions technologiques et contrôle des exportations en sont les leviers directs.", "3) Giraud décrit ainsi une généralisation des compétitions où les territoires eux-mêmes s’affrontent, ce qui interdit de lire le déplacement comme un processus paisible."], "conclusion": "Le centre de gravité de l’économie mondiale s’est bien déplacé : après avoir été concentré en Europe occidentale entre 1870 et 1913, autour d’un Royaume-Uni cumulant puissance industrielle, commerciale et financière, il s’est porté vers l’Asie émergente sous l’effet de l’hypermondialisation. Mais les données de Maddison invitent à requalifier ce mouvement : avec 51 % du PIB mondial vers 1700, les futurs BRIC retrouvent une position que l’industrialisation européenne leur avait fait perdre. Ce retour demeure toutefois inachevé, car le privilège exorbitant du dollar et la maîtrise de la frontière technologique restent disputés. Le déplacement est donc engagé mais contesté, et c’est précisément ce qui explique l’arsenalisation actuelle des politiques économiques."}, "ch21-10": {"commentaire": "Sujet d’évaluation d’un instrument : il faut expliquer sa construction avant de la juger. La première partie doit présenter rigoureusement les trois comptes — courant, capital, financier — et l’égalité comptable qui les lie. La deuxième montre ce qu’elle révèle réellement : le besoin ou la capacité de financement, les stratégies de croissance derrière les déséquilibres. La troisième expose ses limites : elle enregistre des flux et non des stocks, elle ne dit rien de la soutenabilité, et un même solde n’a pas la même signification selon la monnaie d’endettement. Ne pas confondre solde commercial et solde courant.", "intro": "La balance des paiements est le document de référence qui enregistre l’ensemble des flux entre une économie nationale et le reste du monde : échanges de biens et services, revenus, transferts et opérations financières. Sa lecture semble donc fournir un diagnostic complet. Le commentaire public s’arrête pourtant le plus souvent au seul solde commercial de biens — pour la France, 624 milliards d’euros d’exportations contre 682 milliards d’importations en 2025, soit un déficit de 58 milliards — alors que ce solde n’est qu’une composante du compte courant. Évaluer la santé d’une économie suppose de savoir ce que chaque compte enregistre, et surtout ce qu’aucun d’eux n’enregistre : la soutenabilité des positions accumulées.", "problematique": "La balance des paiements fournit-elle un diagnostic fiable de la situation économique d’un pays, ou sa lecture exige-t-elle des informations que sa construction même ne contient pas ?", "plan": ["I. Elle offre une vision complète et cohérente des relations avec l’extérieur", "A. Sa structure distingue trois comptes", "1) Le compte courant enregistre les échanges de biens et services, les revenus et les transferts courants.", "2) Le compte de capital, quantitativement secondaire, enregistre certains transferts en capital et des opérations sur actifs non financiers non produits comme les droits et licences.", "3) Le compte financier retrace les IDE, les investissements de portefeuille et les autres opérations financières.", "B. Elle impose des distinctions que le débat public néglige", "1) Le solde commercial porte au sens strict sur les biens, au sens élargi sur les biens et services.", "2) Le solde courant y ajoute les revenus, si bien qu’un pays peut être déficitaire commercialement tout en percevant d’importants revenus d’investissements.", "3) Les dépenses d’un non-résident sur le territoire sont comptées comme exportations de services, ce que l’intuition ordinaire ignore.", "C. Elle révèle la position de financement de la nation", "1) Les soldes déterminent si l’économie est en besoin ou en capacité de financement vis-à-vis du reste du monde.", "2) L’identité X − M = (S − I) + (T − G) relie ce solde à l’écart entre épargne et investissement et au solde public.", "3) Un déficit courant signifie donc que la nation recourt à l’épargne étrangère, information qu’aucun autre document ne fournit aussi directement.", "II. Elle éclaire des déséquilibres qui ont une réelle signification économique", "A. Elle permet de lire les stratégies de croissance", "1) Hélène Rey montre que les déséquilibres mondiaux excessifs traduisent des stratégies nationales de croissance elles-mêmes déséquilibrées.", "2) Les principales zones concernées sont les États-Unis, la Chine, l’Union européenne et les pays exportateurs de pétrole.", "3) Un excédent durable peut ainsi signaler une demande intérieure insuffisante autant qu’une compétitivité forte.", "B. Elle met en évidence les déficits jumeaux", "1) Ces derniers désignent la coexistence d’un déficit budgétaire et d’un déficit courant.", "2) Le mécanisme est direct : déficit public accru, demande intérieure soutenue, importations en hausse, solde courant dégradé.", "3) La balance des paiements permet donc de rattacher un déséquilibre extérieur à une cause budgétaire interne.", "C. Elle distingue la nature des financements reçus", "1) Un déficit financé par des IDE engage des capacités productives durables sur le territoire.", "2) Un déficit financé par des investissements de portefeuille ou des prêts repose sur des capitaux plus liquides, donc réversibles.", "3) Le choc Volcker de 1979 en a fourni la démonstration : la hausse des taux américains a rapatrié les capitaux et précipité la crise de la dette latino-américaine.", "III. Elle ne constitue pourtant pas un diagnostic suffisant", "A. Elle enregistre des flux et non des stocks", "1) Le solde d’une année ne dit rien du patrimoine extérieur accumulé au fil du temps.", "2) La position extérieure nette, qui cumule ces flux, est bien plus informative sur la vulnérabilité d’une économie.", "3) Un pays peut afficher un déficit modéré tout en ayant accumulé une position débitrice considérable.", "B. Un même solde n’a pas partout la même signification", "1) Nurkse rappelle qu’un déficit peut accompagner un fort dynamisme d’investissement au début du développement.", "2) Le privilège exorbitant permet aux États-Unis d’emprunter dans leur propre monnaie, ce qui change radicalement la nature du risque.", "3) Une économie endettée en devises étrangères subit au contraire de plein fouet les retournements de change et de taux.", "C. Elle ignore des dimensions essentielles de la santé économique", "1) Elle ne mesure ni la productivité, ni le chômage, ni les inégalités internes, ni la soutenabilité environnementale.", "2) La comptabilisation en valeur brute fausse d’ailleurs la lecture des déséquilibres bilatéraux, comme le montre le cas de l’iPhone.", "3) Elle doit donc être croisée avec d’autres indicateurs, faute de quoi un solde isolé conduit à des diagnostics erronés."], "conclusion": "La balance des paiements est un instrument irremplaçable : elle enregistre l’ensemble des flux avec le reste du monde, impose des distinctions que le débat public néglige — solde commercial contre solde courant — et révèle si la nation est en besoin ou en capacité de financement. Elle éclaire aussi les stratégies de croissance derrière les déséquilibres, comme le montre Hélène Rey, et la nature des capitaux qui financent un déficit. Mais elle enregistre des flux et non des stocks, ne dit rien de la soutenabilité des positions accumulées, et un même solde ne signifie pas la même chose selon la monnaie dans laquelle le pays s’endette. C’est donc un excellent instrument de description, et un mauvais indicateur pris isolément."}, "ch21-11": {"commentaire": "Sujet macroéconomique et systémique : il ne porte pas sur un pays mais sur la configuration mondiale. Il faut expliquer pourquoi les soldes s’équilibrent nécessairement à l’échelle mondiale — l’excédent des uns est le déficit des autres — puis montrer avec Hélène Rey que ces déséquilibres traduisent des modèles de croissance nationaux eux-mêmes déséquilibrés. Le danger se démontre par des canaux : volatilité des capitaux, dépendance au dollar, retournements de taux. Le choc Volcker de 1979 est l’exemple central et doit être développé comme un enchaînement, pas cité.", "intro": "À l’échelle mondiale, la somme des soldes courants est nulle par construction : l’excédent des uns est le déficit des autres. Cette évidence comptable a une conséquence rarement tirée : dénoncer les déficits sans interroger les excédents revient à ne traiter qu’une moitié du problème. Hélène Rey soutient en ce sens que les déséquilibres mondiaux excessifs sont la conséquence de stratégies nationales de croissance elles-mêmes déséquilibrées, et elle identifie quatre zones principales : les États-Unis, la Chine, l’Union européenne et les pays exportateurs de pétrole. Un déséquilibre extérieur mondial désigne la persistance de soldes courants importants et de sens opposés entre grandes zones économiques. Leur danger tient moins à leur existence qu’à leur durée et à leur mode de financement.", "problematique": "Les déséquilibres courants entre grandes zones économiques constituent-ils une menace pour la stabilité financière mondiale, ou traduisent-ils des situations économiques que leur seule ampleur ne suffit pas à condamner ?", "plan": ["I. Ces déséquilibres traduisent d’abord des situations économiques légitimes", "A. Un déficit peut accompagner un investissement dynamique", "1) L’identité X − M = (S − I) + (T − G) montre qu’un déficit courant peut refléter un investissement supérieur à l’épargne privée.", "2) Nurkse avait décrit le cercle vicieux de la pauvreté par la formule « un pays est pauvre parce qu’il est pauvre ».", "3) Le recours à l’épargne étrangère permet alors de financer un développement que l’épargne domestique ne pourrait porter.", "B. Un excédent peut refléter une structure démographique ou productive", "1) Une population vieillissante épargne davantage, ce qui dégage mécaniquement une capacité de financement.", "2) Une économie fortement spécialisée dans l’exportation accumule des excédents sans stratégie délibérée d’accumulation.", "3) Les pays exportateurs de pétrole en fournissent l’illustration, leurs recettes dépendant largement des prix mondiaux.", "C. Les soldes sont nécessairement complémentaires à l’échelle mondiale", "1) La somme des soldes courants mondiaux est nulle : aucun pays ne peut être excédentaire sans qu’un autre soit déficitaire.", "2) Un excédent durable suppose donc qu’une autre zone accepte durablement de s’endetter.", "3) Le débat ne peut se réduire à une condamnation des déficits sans interroger symétriquement les excédents.", "II. Mais leur persistance révèle des modèles de croissance déséquilibrés", "A. Hélène Rey en donne la clé de lecture", "1) Les déséquilibres mondiaux excessifs sont la conséquence de stratégies nationales de croissance elles-mêmes déséquilibrées.", "2) Les quatre zones concernées sont les États-Unis, la Chine, l’Union européenne et les pays exportateurs de pétrole.", "3) Le déséquilibre extérieur devient ainsi le symptôme d’un problème interne : insuffisance de la demande ici, insuffisance de l’épargne là.", "B. Les déficits jumeaux ajoutent une dimension budgétaire", "1) Ils désignent la coexistence d’un déficit budgétaire et d’un déficit courant.", "2) L’enchaînement est direct : déficit public accru, demande intérieure soutenue, importations en hausse, solde courant dégradé.", "3) Corriger le déséquilibre extérieur suppose alors d’agir sur la politique budgétaire, non sur le commerce extérieur.", "C. Le rééquilibrage exige une action des deux côtés", "1) Réduire un excédent suppose de soutenir la demande intérieure et de réduire l’écart entre épargne et investissement.", "2) Réduire un déficit suppose d’accroître l’épargne nationale ou de restaurer la compétitivité.", "3) Aucun de ces ajustements n’est immédiat, ce qui explique la persistance des configurations observées.", "III. Le danger tient au mode de financement plus qu’à l’ampleur des soldes", "A. Le choc Volcker illustre le risque de retournement", "1) Paul Volcker arrive à la Fed en 1979 dans un contexte d’inflation élevée et relève fortement les taux d’intérêt.", "2) Les placements américains deviennent plus attractifs et les capitaux mondiaux refluent massivement vers les États-Unis.", "3) Les économies latino-américaines, endettées en devises, basculent alors dans une crise de la dette : le financement s’était retourné.", "B. La nature des capitaux détermine la vulnérabilité", "1) Les IDE correspondent à des implantations productives durables et difficilement réversibles.", "2) Les investissements de portefeuille et les prêts sont liquides et peuvent se retirer rapidement.", "3) L’hypermondialisation se caractérise précisément par une mobilité financière massive, multidirectionnelle et beaucoup plus volatile.", "C. Les positions ne sont pas symétriques entre pays", "1) Le dollar occupe une place centrale dans le système monétaire international et les titres publics américains sont particulièrement recherchés.", "2) Le privilège exorbitant permet aux États-Unis d’attirer massivement des capitaux et d’emprunter dans leur propre monnaie.", "3) Un déficit de même ampleur constitue donc un risque très inégal selon que le pays s’endette dans sa monnaie ou en devises étrangères."], "conclusion": "Les déséquilibres extérieurs mondiaux ne sont pas dangereux par eux-mêmes : ils traduisent des situations légitimes — investissement dynamique, structure démographique, spécialisation exportatrice — et sont comptablement complémentaires, l’excédent des uns étant le déficit des autres. Leur persistance révèle cependant, comme le soutient Hélène Rey, des stratégies nationales de croissance elles-mêmes déséquilibrées, dont le rééquilibrage exige une action des deux côtés. Le danger réside surtout dans le mode de financement : un déficit couvert par des capitaux liquides expose à des retournements brutaux, comme l’a montré la crise latino-américaine déclenchée par le choc Volcker de 1979. Et ce risque reste profondément asymétrique, puisque tous les pays ne s’endettent pas dans leur propre monnaie."}, "ch21-12": {"commentaire": "Sujet de comparaison historique, qui exige des critères explicites plutôt qu’une juxtaposition. Trois critères s’imposent : la dimension dominante (commerciale contre cumulative), la nature des flux financiers (portefeuille contre IDE et capitaux volatils), et la géographie du pouvoir (Europe contre Asie émergente). Les chiffres du chapitre — taux d’ouverture de 14 à 15 %, ratio 80-90 % contre 10-20 % de Béraud — sont indispensables. La conclusion doit montrer que la comparaison est légitime mais que les différences l’emportent, notamment du fait des dégroupages de Baldwin.", "intro": "La comparaison entre la mondialisation d’avant 1914 et celle d’aujourd’hui est devenue un lieu commun : le taux d’ouverture de la Belle Époque, de l’ordre de 14 à 15 % à son sommet, est régulièrement mobilisé pour relativiser l’originalité de la période contemporaine. L’argument a sa force, puisqu’il rappelle que l’intégration n’a rien de linéaire et qu’elle a déjà connu un sommet suivi d’un effondrement. Il suppose pourtant que les deux périodes soient comparables selon des critères pertinents. Or Charles-Albert Michalet distingue trois configurations — commerciale, productive et financière — dont la première seule caractérisait 1870-1913, tandis que l’hypermondialisation les cumule. Comparer exige donc de fixer d’abord ce que l’on compare.", "problematique": "La mondialisation contemporaine constitue-t-elle une simple reprise du mouvement d’intégration interrompu en 1914, ou une transformation de nature que les indicateurs communs ne permettent pas de saisir ?", "plan": ["I. Des analogies réelles justifient la comparaison", "A. Les deux périodes reposent sur une révolution des coûts de circulation", "1) Selon Bairoch, le coût réel moyen du transport est presque divisé par dix entre le début du XIXᵉ siècle et 1910 environ.", "2) Cette baisse concerne le ferroviaire comme le maritime, et rend rentables des échanges auparavant impossibles.", "3) La période contemporaine connaît une révolution comparable avec la chute des coûts de communication et de coordination.", "B. Les deux périodes associent ouverture commerciale et spécialisation", "1) La première mondialisation approfondit la division internationale du travail sur la base des théories de Smith et Ricardo.", "2) L’hypermondialisation prolonge cette logique jusqu’à la spécialisation par tâche.", "3) Dans les deux cas, l’ouverture suscite des gains globaux et des demandes de protection chez les perdants.", "C. Les deux périodes voient circuler le travail et les capitaux", "1) Les migrations internationales sont massives durant la première mondialisation et constituent une dimension à part entière de l’intégration.", "2) Les capitaux circulent alors abondamment, l’épargne européenne finançant des projets lointains.", "3) L’interdépendance n’est donc pas une invention récente, ce qui légitime la comparaison.", "II. Mais la nature des flux a profondément changé", "A. La dimension dominante n’est plus la même", "1) Entre 1870 et 1913, la mondialisation est principalement commerciale : les échanges de biens et services en constituent le moteur.", "2) L’hypermondialisation cumule au contraire le commercial, le productif et le financier.", "3) Les configurations de Michalet ne se succèdent pas, elles s’additionnent : c’est la différence décisive.", "B. Les flux financiers ont changé de fonction", "1) Béraud établit que les investissements de portefeuille représentaient alors 80 à 90 % des mouvements de capitaux, contre 10 à 20 % pour les IDE.", "2) La première mondialisation financière était donc une mondialisation de placements et de prêts, non d’implantations productives.", "3) L’hypermondialisation se caractérise à l’inverse par des IDE massifs et une mobilité financière multidirectionnelle et volatile.", "C. La production elle-même s’est fragmentée", "1) Baldwin distingue un premier dégroupage, qui sépare production et consommation, et un second, qui sépare les étapes du processus productif.", "2) Le commerce contemporain est largement un commerce de biens intermédiaires, un « commerce de tâches ».", "3) Rien de tel n’existait avant 1914, où l’on échangeait essentiellement des biens finis et des matières premières.", "III. La géographie et les rapports de puissance ont également basculé", "A. Le centre de gravité s’est déplacé", "1) Entre 1870 et 1913, il se situe en Europe occidentale, le Royaume-Uni combinant avance industrielle, empire, puissance commerciale et financière.", "2) L’hypermondialisation le déplace vers l’Asie émergente, dont la Chine est le principal moteur.", "3) Les données de Maddison rappellent que les futurs BRIC pesaient environ 51 % du PIB mondial vers 1700 : le basculement est en partie un retour.", "B. Les formes de domination ont changé de nature", "1) La première mondialisation repose largement sur la colonisation, qui impose aux territoires colonisés leur place dans la division du travail.", "2) Acemoglu et Robinson montrent comment des institutions extractives organisaient cette captation.", "3) Aujourd’hui la domination passe par la technologie, les normes et l’arsenalisation des instruments économiques plutôt que par la souveraineté directe.", "C. La trajectoire des deux périodes demeure toutefois instructive", "1) La première mondialisation s’est interrompue, et la crise de 1929 l’a convertie en démondialisation avec le tarif Hawley-Smoot.", "2) Le ralentissement observé depuis 2008, qualifié de slowbalization, invite à ne pas tenir l’intégration actuelle pour acquise.", "3) La comparaison vaut donc surtout comme avertissement : ce qui a été construit politiquement peut être défait de même."], "conclusion": "La comparaison est légitime : les deux périodes reposent sur une chute des coûts de circulation, approfondissent la spécialisation internationale et font circuler travail et capitaux. Mais les différences l’emportent. La première mondialisation était essentiellement commerciale et financièrement dominée par les placements de portefeuille, à 80 ou 90 % selon Béraud, tandis que l’hypermondialisation cumule commerce, IDE et capitaux volatils, et fragmente la product
