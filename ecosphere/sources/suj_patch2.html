
<script id="eco-maj-sujets-2">
(function(){
'use strict';
if(window.__ECO_MAJ_SUJ2) return;
window.__ECO_MAJ_SUJ2 = true;
var NEW = {"ch9-1": {"title": "La concentration des entreprises nuit-elle à la concurrence ?", "mobiliser": "Ch. 9 (concentration, pouvoir de marché, contestabilité) · Ch. 5 (monopole, défaillances) · Ch. 8 (révolutions industrielles, économies d’échelle) · Ch. 3 (Smith, concurrence) · 2ᵉ année ch. 1 (concentration à l’échelle mondiale, GAFAM)", "commentaire": "Sujet central du chapitre. Le piège serait de répondre mécaniquement par l’affirmative : moins d’entreprises, donc moins de concurrence. Il faut distinguer la concentration, qui est un processus d’augmentation de taille, de la position dominante, qui est un état, et de l’abus, qui est un comportement sanctionné. Il faut aussi opposer l’approche standard, fondée sur l’atomicité, et l’approche élargie d’Emmanuel Combe, fondée sur la contestabilité. Les notions de barrières à l’entrée, de coûts irrécupérables et d’économies d’échelle sont indispensables, de même que la distinction entre concentration horizontale, verticale et conglomérale.", "intro": "Depuis la révolution industrielle, les entreprises connaissent un mouvement continu d’agrandissement : les progrès techniques, la mécanisation puis la mondialisation les poussent à investir davantage et à conquérir des marchés plus vastes. Ce mouvement favorise fusions et rachats, d’où l’apparition de grandes firmes, d’oligopoles et parfois de situations proches du monopole. Cette évolution nourrit une inquiétude ancienne, à l’origine des lois antitrust américaines et du démantèlement de la Standard Oil en 1911. Pourtant, la théorie des marchés contestables a montré qu’un marché concentré n’est pas nécessairement un marché sans concurrence.", "problematique": "La concentration des entreprises réduit-elle nécessairement l’intensité de la concurrence, ou peut-elle demeurer compatible avec un marché resté contestable ?", "plan": ["I. La concentration réduit le nombre d’acteurs et renforce le pouvoir de marché", "A. Elle diminue mécaniquement l’atomicité du marché", "1) La concentration horizontale supprime des concurrents directs en réunissant des entreprises du même secteur, ce qui redistribue les parts de marché au profit du groupe issu de la fusion.", "2) L’oligopole, puis le monopole, deviennent possibles : les entreprises cessent d’être preneuses de prix pour devenir donneuses de prix.", "3) L’indice de Lerner, L = (P – Cm)/P, mesure cet écart entre le prix et le coût marginal : plus il s’éloigne de zéro, plus le pouvoir de marché est établi.", "B. Elle facilite les comportements anticoncurrentiels", "1) Un petit nombre d’acteurs rend la coordination plus facile : Emmanuel Combe, dans La politique de la concurrence (2016), montre sur 111 cartels étudiés entre 1969 et 2009 qu’ils apparaissent surtout sur des marchés oligopolistiques.", "2) Le cartel de Phoebus, de 1929 à 1939, illustre cette dérive : les fabricants d’ampoules limitent volontairement la durée de vie des lampes, première forme documentée d’obsolescence programmée.", "3) L’abus de position dominante devient un risque concret : prix prédateurs inférieurs au coût variable moyen, ventes liées, accords d’exclusivité ou dénigrement des concurrents.", "C. Elle peut verrouiller durablement l’accès au marché", "1) Les barrières à l’entrée s’élèvent : coûts fixes importants, coûts irrécupérables, brevets et effets de réseau dissuadent les entrants potentiels.", "2) Dans le numérique, l’avantage du premier entrant se cumule aux effets de réseau, ce qui rend l’entrée nouvelle peu crédible.", "3) Le risque politique s’ajoute au risque économique : certaines firmes atteignent une taille qui leur permet de peser sur la régulation elle-même.", "II. Mais la concentration produit aussi des gains d’efficacité", "A. Elle engendre des économies d’échelle", "1) La hausse de la taille répartit les coûts fixes sur un plus grand nombre d’unités, ce qui abaisse le coût moyen unitaire.", "2) Les investissements lourds en équipements et en recherche ne deviennent rentables qu’à partir d’un certain volume de production.", "3) Le monopole naturel constitue le cas limite : une seule entreprise y produit à moindre coût que plusieurs concurrentes, ce qui justifie la régulation plutôt que la fragmentation.", "B. Elle soutient l’innovation et la compétitivité internationale", "1) Les grandes firmes disposent des marges nécessaires pour financer une recherche coûteuse et incertaine.", "2) La compétition mondiale exige une taille critique : le refus de la fusion Alstom-Siemens en 2019 a relancé ce débat en Europe.", "3) La concentration verticale peut sécuriser les approvisionnements et réduire l’incertitude sur des maillons critiques de la chaîne de production.", "C. Elle n’exclut pas la rivalité entre firmes", "1) La concurrence se déplace vers la différenciation des produits : Edward Chamberlin théorise dès 1933 la concurrence monopolistique.", "2) Les oligopoles se livrent une concurrence intense hors prix, par l’innovation, la qualité ou l’image de marque.", "3) La contestabilité maintient une pression : même dominante, une firme modère ses prix si l’entrée reste possible.", "III. Le critère décisif n’est donc pas le nombre d’acteurs mais la contestabilité du marché", "A. L’approche standard montre ses limites", "1) Le modèle SCP d’Edward Mason et Joe Bain, formalisé dans les années 1950, fait dériver les comportements de la seule structure du marché.", "2) Cette causalité est trop mécanique : les stratégies des firmes transforment elles-mêmes la structure du marché.", "3) Compter les entreprises ne dit rien de la facilité réelle d’entrer sur le marché.", "B. L’approche élargie déplace le critère", "1) William Baumol, John Panzar et Robert Willig développent dans les années 1980 la théorie des marchés contestables.", "2) Un marché est contestable si l’entrée et la sortie sont libres, c’est-à-dire sans coûts irrécupérables importants.", "3) Emmanuel Combe oppose ainsi l’approche standard, centrée sur l’atomicité, et l’approche élargie, centrée sur la menace crédible d’entrée.", "C. La politique de concurrence en tire les conséquences", "1) Elle sanctionne moins la position que son exploitation abusive : la position dominante n’est pas condamnée en elle-même.", "2) Elle agit en amont par le contrôle des concentrations, ce qui suppose de définir le marché pertinent, enjeu central de l’affaire Alstom-Siemens.", "3) Le Digital Markets Act prolonge cette logique en régulant ex ante les plateformes structurantes, dont la contestabilité s’était effondrée."], "conclusion": "La concentration réduit effectivement le nombre d’acteurs, renforce le pouvoir de marché et facilite les comportements anticoncurrentiels, ce qui justifie une vigilance ancienne. Mais elle procure aussi des économies d’échelle, finance l’innovation et n’exclut pas une rivalité intense hors prix. Le critère pertinent n’est donc pas l’atomicité mais la contestabilité : un marché concentré peut rester concurrentiel si l’entrée demeure possible, ce qui déplace le rôle des politiques publiques de la fragmentation vers la levée des barrières."}, "ch9-2": {"title": "Pourquoi les entreprises cherchent-elles à grandir ?", "mobiliser": "Ch. 9 (croissance interne et externe, économies d’échelle) · Ch. 8 (révolutions industrielles, Schumpeter) · Ch. 6 (croissance, progrès technique) · Ch. 2 (financement) · 2ᵉ année ch. 1 (taille critique et mondialisation)", "commentaire": "Il faut articuler trois ordres de causes — techniques, concurrentielles et mondiales — sans se limiter à la recherche du profit. Distinguer soigneusement croissance interne et croissance externe, puis les trois formes de concentration. Le piège serait de confondre la cause du mouvement, qui tient aux conditions de production et de marché, et son résultat, qui est la concentration. Les économies d’échelle, la taille critique et les effets de réseau doivent être expliqués comme des mécanismes, non cités comme des mots.", "intro": "La révolution industrielle transforme les structures productives : les innovations techniques exigent des investissements de plus en plus lourds, ce qui favorise l’agrandissement des entreprises et la concentration des activités. Ce mouvement se prolonge dans l’économie numérique, où quelques plateformes atteignent en quelques années une taille mondiale. General Electric, né autour de l’électricité et de l’ampoule électrique, devient ainsi l’un des plus grands conglomérats du XXᵉ siècle. Comprendre pourquoi les entreprises grandissent suppose donc d’identifier les forces qui rendent la grande taille avantageuse.", "problematique": "Quelles logiques économiques poussent les entreprises à augmenter continuellement leur taille, et ces logiques sont-elles de même nature selon les époques ?", "plan": ["I. Des logiques techniques et productives", "A. L’innovation impose des investissements lourds", "1) Les révolutions industrielles reposent sur la mécanisation, la standardisation et la production de masse, qui exigent des machines coûteuses.", "2) Seule une production de grande ampleur permet de rentabiliser ces équipements et la recherche qui les précède.", "3) Joseph Schumpeter montre que l’innovation est le moteur du capitalisme, mais elle suppose des moyens financiers que la petite taille ne procure pas.", "B. Les économies d’échelle abaissent le coût moyen", "1) Les coûts fixes se répartissent sur un plus grand nombre d’unités, ce qui réduit le coût unitaire de production.", "2) Cet avantage de coût se convertit en avantage concurrentiel, par des prix plus bas ou des marges plus élevées.", "3) Lorsque ces économies sont très fortes, on aboutit au monopole naturel, où la duplication des installations serait inefficace.", "C. La croissance interne prolonge cette logique productive", "1) L’entreprise augmente ses capacités par ses propres investissements, sans racheter de concurrent.", "2) Ce mode de croissance est plus lent mais préserve la cohérence de l’organisation et son contrôle.", "3) Il suppose une capacité d’autofinancement ou un accès au crédit, ce qui relie la taille aux conditions de financement de l’économie.", "II. Des logiques concurrentielles", "A. Grandir pour affaiblir la concurrence", "1) La croissance externe, par fusion ou rachat, supprime directement des concurrents et redessine le marché.", "2) La concentration horizontale répond à une logique simple : réduire l’intensité de la concurrence pour augmenter la puissance économique du groupe.", "3) John D. Rockefeller construit ainsi la Standard Oil, fondée en 1870, jusqu’à sa position de trust dominant.", "B. Grandir pour maîtriser la chaîne de production", "1) La concentration verticale permet de contrôler l’amont, les approvisionnements, ou l’aval, la distribution.", "2) Oliver Williamson explique cette internalisation par la réduction des coûts de transaction, de l’incertitude et de l’opportunisme.", "3) Elle sécurise les maillons critiques et limite la dépendance à des fournisseurs susceptibles de se comporter en opportunistes.", "C. Grandir pour diversifier le risque", "1) La concentration conglomérale réunit des activités très différentes au sein d’un même groupe.", "2) General Electric, dirigé par Jack Welch pendant plus de trente ans, intervient dans l’électricité, le pétrole, les médias, la finance et la gestion industrielle.", "3) Cette diversification peut toutefois se retourner : la décote de conglomérat traduit une valeur boursière inférieure à la somme des activités prises séparément.", "III. Des logiques mondiales et contemporaines", "A. La mondialisation impose une taille critique", "1) Les marchés deviennent mondiaux, et la compétitivité se joue désormais à cette échelle.", "2) Les entreprises doivent atteindre un seuil de taille pour financer la recherche et affronter des concurrents étrangers déjà installés.", "3) La fragmentation internationale de la production, ou DIPP, oblige à coordonner des activités réparties entre plusieurs territoires.", "B. Le numérique amplifie le phénomène", "1) Les effets de réseau font croître la valeur d’une plateforme avec le nombre de ses utilisateurs.", "2) L’avantage du premier entrant devient déterminant, car il se cumule aux effets de réseau.", "3) Les GAFAM et les BATX illustrent une concentration d’un type nouveau, fondée sur les données autant que sur le capital.", "C. La taille devient enfin un enjeu de puissance", "1) Certaines firmes atteignent une influence comparable à celle d’États, ce qui déplace la question de l’économie vers le politique.", "2) La souveraineté numérique devient un objectif public, et l’Union européenne y répond par le Digital Markets Act.", "3) L’arsenalisation de la politique économique transforme la dépendance à ces acteurs en levier de rapport de force international."], "conclusion": "Les entreprises grandissent d’abord parce que la technique l’exige : financer l’innovation et exploiter les économies d’échelle suppose un volume de production élevé. Elles grandissent ensuite pour réduire la concurrence, maîtriser leur chaîne de production ou diversifier leur risque. Elles grandissent enfin parce que la mondialisation et le numérique imposent une taille critique. La grande taille n’est donc pas un accident du capitalisme mais l’une de ses tendances structurelles, ce qui explique la permanence des politiques de concurrence."}, "ch9-3": {"title": "Les grandes entreprises sont-elles favorables à l’innovation ?", "mobiliser": "Ch. 9 (pouvoir de marché, barrières, DMA) · Ch. 8 (Schumpeter, destruction créatrice) · Ch. 6 (croissance endogène, R&D) · Ch. 5 (monopole) · 2ᵉ année ch. 1 (concurrence technologique Chine/États-Unis)", "commentaire": "Sujet à double détente. La taille facilite le financement de la recherche, mais la domination peut installer une rente qui décourage l’effort d’innovation. Il faut mobiliser Schumpeter et la destruction créatrice, puis montrer que la rente protégée par des barrières à l’entrée produit l’effet inverse. Le cartel de Phoebus et l’obsolescence programmée fournissent le contre-exemple décisif : l’innovation peut être détournée contre le consommateur. Ne pas confondre dépenses de R&D et innovation effectivement mise sur le marché.", "intro": "La concentration a fait émerger des groupes capables de mobiliser des moyens de recherche considérables, et l’on associe volontiers grande firme et progrès technique. Joseph Schumpeter voyait d’ailleurs dans l’entrepreneur innovateur le moteur du capitalisme. Pourtant, l’histoire économique montre que les positions dominantes peuvent aussi freiner le renouvellement des produits, comme l’illustre le cartel de Phoebus qui, de 1929 à 1939, organisa la réduction volontaire de la durée de vie des ampoules. La relation entre taille et innovation n’a donc rien d’automatique.", "problematique": "La grande taille stimule-t-elle réellement l’innovation, ou installe-t-elle des rentes qui la freinent ?", "plan": ["I. La grande taille favorise l’innovation", "A. Elle permet de financer une recherche coûteuse", "1) Les investissements de recherche sont lourds, incertains et à rendement différé : seules des firmes disposant de marges élevées peuvent les supporter.", "2) Les économies d’échelle dégagent précisément ces marges et rendent l’effort de recherche soutenable dans la durée.", "3) La croissance endogène montre que la R&D et l’accumulation de connaissances entretiennent la croissance, ce qui valorise les structures capables de les financer.", "B. La concurrence internationale pousse à innover", "1) La compétitivité hors-prix devient décisive lorsque la concurrence par les coûts est perdue d’avance.", "2) La différenciation des produits crée un pouvoir de marché durable, mécanisme théorisé par Edward Chamberlin en 1933.", "3) La rivalité technologique entre la Chine et les États-Unis illustre aujourd’hui cette course à l’innovation entre très grands acteurs.", "C. Les plateformes innovent pour capter les utilisateurs", "1) Les effets de réseau récompensent celui qui s’impose le premier, ce qui accélère la course à l’innovation initiale.", "2) L’investissement dans les infrastructures numériques exige des capacités financières hors de portée des petites structures.", "3) La diversification conglomérale permet de redéployer les profits d’une activité mature vers des activités émergentes.", "II. Mais la domination peut freiner l’innovation", "A. La rente décourage l’effort", "1) Une position protégée par des barrières à l’entrée réduit la pression concurrentielle qui incite à innover.", "2) Les coûts irrécupérables et les effets de réseau dissuadent les entrants, donc les innovateurs potentiels.", "3) Le cartel de Phoebus montre que l’innovation peut être retournée contre le consommateur par l’obsolescence programmée.", "B. Les stratégies d’exclusion étouffent les entrants", "1) Les prix prédateurs, inférieurs au coût variable moyen, éliminent les nouveaux venus avant qu’ils n’atteignent une taille viable.", "2) Les accords d’exclusivité verrouillent les canaux de distribution et privent l’innovateur d’accès au marché.", "3) Le rachat systématique des jeunes entreprises innovantes peut neutraliser la menace plutôt que diffuser l’innovation.", "C. La destruction créatrice est alors ralentie", "1) Schumpeter décrit un capitalisme où les innovations détruisent les activités anciennes tout en en créant de nouvelles.", "2) Or les firmes installées ont intérêt à retarder l’obsolescence de leurs propres actifs.", "3) L’innovation risque de devenir incrémentale et défensive plutôt que radicale.", "III. Tout dépend donc du maintien de la contestabilité", "A. La menace d’entrée discipline l’innovateur installé", "1) Baumol, Panzar et Willig montrent qu’un marché contestable contraint les firmes dominantes, même en l’absence de concurrents effectifs.", "2) L’absence de coûts irrécupérables importants est la condition décisive de cette contestabilité.", "3) Le critère pertinent n’est donc pas le nombre de firmes mais la possibilité réelle d’entrer.", "B. Le brevet illustre l’ambivalence du dispositif", "1) Il constitue une barrière à l’entrée, mais tolérée, car il protège temporairement l’innovation.", "2) Il permet à l’innovateur de rentabiliser un investissement risqué, donc encourage l’effort initial.", "3) Sa durée excessive peut à l’inverse figer une rente et bloquer les innovations suivantes.", "C. La régulation cherche à rouvrir l’accès", "1) Le Digital Markets Act interdit ex ante certaines pratiques des plateformes structurantes, notamment l’auto-préférence.", "2) Le contrôle des concentrations examine si une acquisition supprime un concurrent innovant potentiel.", "3) La souveraineté numérique devient un objectif assumé, au-delà de la seule efficacité économique."], "conclusion": "La grande taille finance l’innovation, soutient la compétitivité hors-prix et permet des investissements que la petite entreprise ne peut assumer. Mais la domination peut se transformer en rente et fermer le marché aux innovateurs, comme le montrent les stratégies d’exclusion et l’obsolescence programmée. La variable décisive n’est donc pas la taille mais la contestabilité : c’est la menace crédible d’une entrée qui maintient l’incitation à innover, ce que la régulation contemporaine cherche précisément à restaurer."}, "ch9-4": {"title": "Faut-il interdire les monopoles ?", "mobiliser": "Ch. 9 (monopole, antitrust, démantèlement) · Ch. 5 (monopole naturel, défaillances du marché) · Ch. 3 (Smith, concurrence) · Ch. 8 (innovation, brevets) · 2ᵉ année ch. 1 (régulation des plateformes mondiales)", "commentaire": "Piège du tout ou rien : certains monopoles sont autorisés, voire souhaitables. Il faut distinguer le monopole comme structure, la position dominante comme état et l’abus comme comportement. Le monopole naturel et le brevet constituent les deux exceptions majeures à traiter. Le démantèlement de la Standard Oil en 1911 doit être mobilisé, mais aussi son ironie historique : les refusions des années 1990. Mentionner l’indice de Lerner pour mesurer le pouvoir de marché.", "intro": "Le monopole apparaît spontanément comme l’ennemi de la concurrence : une seule entreprise y fixe le prix sans contrainte extérieure, réduit les quantités et capte une rente. C’est ce qui a justifié les lois antitrust américaines et le démantèlement de la Standard Oil de John D. Rockefeller en 1911. Pourtant, toutes les situations de monopole ne sont pas condamnées : le monopole naturel est économiquement plus efficace qu’une pluralité de producteurs, et le brevet institue un monopole temporaire délibérément accordé. La question n’est donc pas de principe mais de discernement.", "problematique": "Le monopole doit-il être systématiquement interdit, ou certaines situations de monopole sont-elles économiquement justifiées ?", "plan": ["I. Le monopole est dangereux pour le fonctionnement du marché", "A. Il confère un pouvoir de marché sans contrepartie", "1) L’entreprise devient donneuse de prix et non plus preneuse de prix, ce qui lui permet d’élever le prix au-dessus du coût marginal.", "2) Les quantités offertes sont réduites, ce qui nuit au consommateur et dégrade le surplus collectif.", "3) L’indice de Lerner, L = (P – Cm)/P, mesure cet écart : il tend vers zéro en concurrence parfaite et s’en éloigne d’autant plus que le pouvoir est fort.", "B. Il ouvre la voie aux abus", "1) L’abus de position dominante prend des formes variées : ventes liées, prix prédateurs, dénigrement, accords d’exclusivité.", "2) L’exploitation d’un avantage historique, hérité d’un ancien monopole public, fausse durablement la concurrence.", "3) Le démantèlement de la Standard Oil en 1911 marque la volonté des autorités américaines de briser ces positions.", "C. Il peut devenir un pouvoir politique", "1) Certaines firmes atteignent une taille qui leur donne une capacité d’influence sur la régulation elle-même.", "2) Le contrôle des données et des flux d’information par quelques acteurs soulève un enjeu démocratique.", "3) La souveraineté numérique devient alors un motif d’intervention distinct de l’efficacité économique.", "II. Mais certains monopoles sont économiquement justifiés", "A. Le monopole naturel est plus efficace", "1) Lorsque les coûts fixes sont très élevés, une seule entreprise produit à un coût moyen inférieur à celui de plusieurs concurrentes.", "2) Dupliquer les infrastructures — réseaux d’eau, d’électricité, ferroviaires — serait un gaspillage de ressources.", "3) La réponse n’est donc pas l’interdiction mais la régulation des prix et des conditions d’accès.", "B. Certains monopoles temporaires sont délibérément accordés", "1) Le brevet crée un monopole limité dans le temps, tolérée parce qu’il protège l’innovation.", "2) Il permet à l’innovateur de rentabiliser une recherche coûteuse et risquée.", "3) Sans cette protection, l’incitation à innover serait affaiblie par l’imitation immédiate.", "C. Le monopole peut résulter d’une efficacité supérieure", "1) Une firme peut dominer parce qu’elle innove mieux ou produit à moindre coût, et non par des pratiques déloyales.", "2) Sanctionner ce succès reviendrait à pénaliser l’efficacité que la concurrence est censée récompenser.", "3) C’est pourquoi la position dominante n’est pas condamnée en elle-même : seul l’abus l’est.", "III. Le critère décisif est la contestabilité, non la structure", "A. Un monopole contestable reste discipliné", "1) Baumol, Panzar et Willig montrent que la seule menace d’entrée suffit à modérer le comportement du monopoleur.", "2) L’absence de coûts irrécupérables rend cette menace crédible.", "3) Inversement, un marché comptant plusieurs firmes mais fermé à l’entrée peut être moins concurrentiel qu’un monopole contestable.", "B. Le démantèlement montre ses limites", "1) Il modifie la structure du marché et exerce un effet dissuasif réel, comme l’ont éprouvé AT&T puis Microsoft dans les années 1990.", "2) Mais les entités séparées peuvent se reconcentrer : les refusions des années 1990 dans le pétrole en témoignent.", "3) Les forces économiques de concentration — économies d’échelle, mondialisation — demeurent après la sanction.", "C. Les politiques publiques privilégient désormais la prévention", "1) Le contrôle des concentrations agit en amont, avant que la position dominante ne se constitue.", "2) La procédure de clémence permet de détecter les ententes secrètes en incitant à la dénonciation.", "3) Le Digital Markets Act régule ex ante les plateformes structurantes plutôt que de sanctionner après coup."], "conclusion": "Le monopole est dangereux lorsqu’il s’accompagne d’abus et de barrières durables, ce qui justifie l’arsenal antitrust hérité du démantèlement de la Standard Oil. Mais le monopole naturel et le brevet montrent que certaines situations sont économiquement fondées. Le critère pertinent n’est donc pas la structure mais le comportement et la contestabilité : les politiques de concurrence sanctionnent moins la position dominante que son exploitation abusive, et privilégient désormais la prévention sur le démantèlement."}, "ch9-5": {"title": "Les cartels sont-ils durables ?", "mobiliser": "Ch. 9 (cartels, dilemme du prisonnier, clémence) · Ch. 5 (défaillances, collusion) · Ch. 4 (théorie des jeux, rationalité) · Ch. 10 (conformisme, décisions collectives) · 2ᵉ année ch. 1 (ententes internationales)", "commentaire": "Le cœur du sujet est la tension entre profitabilité collective et rationalité individuelle. Il faut mobiliser le dilemme du prisonnier, puis résoudre le paradoxe du cartel : le dilemme suppose l’absence de communication alors que le cartel repose sur une entente. La distinction entre formation et fonctionnement dans le temps est la clé. L’étude d’Emmanuel Combe sur 111 cartels entre 1969 et 2009 fournit la base empirique, et la procédure de clémence explique l’action publique.", "intro": "Le cartel est une entente entre entreprises visant à limiter la concurrence, sur les prix, les quantités ou la répartition des marchés. Emmanuel Combe, dans La politique de la concurrence (2016), étudie 111 cartels entre 1969 et 2009 et montre qu’ils sont souvent durables, qu’ils augmentent effectivement les prix et qu’ils apparaissent surtout sur des marchés oligopolistiques. Le cartel de Phoebus, actif de 1929 à 1939, en offre l’illustration historique la plus célèbre. Pourtant, la théorie prédit leur instabilité.", "problematique": "Pourquoi les cartels, bien que profitables pour leurs membres, se révèlent-ils structurellement instables, et qu’est-ce qui explique malgré tout leur persistance ?", "plan": ["I. Le cartel est collectivement profitable", "A. Il permet de se comporter comme un monopole", "1) Les membres coordonnent leurs prix ou leurs quantités, ce qui reproduit le résultat d’un monopole sans fusion juridique.", "2) Les quantités offertes sont réduites et les prix élevés au-dessus du niveau concurrentiel.", "3) L’étude de Combe confirme empiriquement cette hausse des prix sur les 111 cartels analysés.", "B. Il réduit l’incertitude concurrentielle", "1) Les parts de marché sont stabilisées, ce qui protège les positions acquises.", "2) La rivalité par les prix, coûteuse pour tous, est neutralisée.", "3) L’entente peut porter sur les prix, les quantités, la répartition géographique ou celle des clients.", "C. Il prospère sur des structures de marché particulières", "1) Les marchés oligopolistiques facilitent la coordination car les acteurs sont peu nombreux et se surveillent.", "2) Des produits homogènes et une demande peu élastique renforcent l’intérêt de l’entente.", "3) Le cartel de Phoebus réunissait ainsi les principaux fabricants mondiaux d’ampoules entre 1929 et 1939.", "II. Mais il est individuellement instable", "A. Le dilemme du prisonnier explique la tricherie", "1) Chaque membre a intérêt à dévier seul en baissant son prix pour capter la demande des autres.", "2) La tricherie est donc individuellement rationnelle alors même qu’elle détruit le gain collectif.", "3) La matrice des gains montre que la défection domine, ce qui fragilise l’accord dès sa conclusion.", "B. Le paradoxe du cartel doit être levé", "1) Le dilemme du prisonnier suppose l’absence de communication, alors qu’un cartel repose précisément sur une entente explicite.", "2) La solution consiste à distinguer le moment de la formation du cartel et son fonctionnement répété dans le temps.", "3) La répétition permet la surveillance mutuelle et la menace de représailles, ce qui stabilise partiellement l’accord.", "C. La surveillance interne a un coût", "1) Détecter la tricherie suppose d’observer les prix et les volumes effectifs des partenaires.", "2) Plus les membres sont nombreux, plus cette surveillance devient coûteuse et imparfaite.", "3) Toute innovation ou tout entrant nouveau déstabilise l’équilibre péniblement construit.", "III. L’action publique exploite cette fragilité", "A. La procédure de clémence retourne le dilemme", "1) Elle réduit, voire supprime, la sanction de l’entreprise qui dénonce le cartel auquel elle participait.", "2) Elle transforme la dénonciation en stratégie individuellement rationnelle, exactement comme la tricherie.", "3) Comme les cartels sont secrets, elle constitue l’outil de détection le plus efficace dont disposent les autorités.", "B. La preuve reste néanmoins difficile à établir", "1) Le parallélisme des comportements désigne des stratégies similaires adoptées sans accord explicite.", "2) Les autorités doivent distinguer l’entente illicite de la simple réaction rationnelle à un même environnement.", "3) Cette difficulté explique le poids donné aux aveux obtenus par la clémence.", "C. Toutes les coopérations ne sont pas condamnées", "1) Les ententes technologiques portant sur la recherche ou l’innovation peuvent être tolérées.", "2) Les ententes verticales, entre fabricant et distributeur, relèvent d’une appréciation au cas par cas.", "3) La frontière passe donc entre coopération productive et restriction de concurrence."], "conclusion": "Le cartel est collectivement profitable : il élève les prix et stabilise les positions, ce que confirme l’étude de Combe. Mais il est individuellement instable, car le dilemme du prisonnier rend la tricherie rationnelle, et sa survie suppose une surveillance coûteuse rendue possible par la répétition. Les autorités exploitent précisément cette fragilité par la procédure de clémence. La durabilité d’un cartel dépend donc moins de l’accord initial que de sa capacité à discipliner ses propres membres."}, "ch9-6": {"title": "Les PME ont-elles encore leur place dans le capitalisme contemporain ?", "mobiliser": "Ch. 9 (PME, ETI, firmes-réseaux, districts) · Ch. 8 (organisation du travail, formes d’entreprise) · Ch. 2 (financement, dépendance bancaire) · Ch. 10 (taille et organisation) · 2ᵉ année ch. 1 (chaînes de valeur, sous-traitance internationale)", "commentaire": "Éviter la thèse de la disparition. Les PME conservent des atouts propres mais restent fragiles, et surtout elles s’insèrent dans des réseaux dominés par de grandes firmes. Il faut mobiliser Marshall et les districts industriels, les effets d’agglomération, la firme-réseau et l’ETI comme forme intermédiaire. Le sujet appelle une réponse en trois temps : persistance, fragilité, puis recomposition du rapport entre petites et grandes structures.", "intro": "La montée des grands groupes multinationaux pourrait laisser penser que les petites structures ont disparu du capitalisme contemporain. Or les PME restent très nombreuses et occupent des positions que les grandes firmes ne peuvent pas toujours tenir. Alfred Marshall avait déjà montré, dans ses Principes d’économie politique publiés en 1890, que la concentration locale de petites entreprises spécialisées pouvait produire des avantages comparables à ceux de la grande taille. La question est donc moins celle de leur survie que celle de leur place.", "problematique": "Comment expliquer la persistance des PME face à des groupes de taille mondiale, et quelle place occupent-elles réellement dans l’organisation productive contemporaine ?", "plan": ["I. Les PME conservent des atouts spécifiques", "A. La souplesse organisationnelle", "1) Les circuits de décision sont courts, ce qui permet une adaptation rapide aux variations de la demande.", "2) La proximité avec le client autorise une réactivité et une personnalisation que la grande firme peine à égaler.", "3) Cette simplicité limite les coûts de coordination interne qui pèsent sur les grandes organisations.", "B. Le positionnement sur des marchés de niche", "1) Les grandes firmes délaissent les segments trop étroits pour justifier leurs investissements.", "2) La PME y trouve une rentabilité protégée par la taille même du marché.", "3) La spécialisation construit un savoir-faire distinctif qui réduit la substituabilité de son offre.", "C. L’ancrage territorial", "1) Marshall décrit dès 1890 les districts industriels : des concentrations locales d’entreprises spécialisées.", "2) Les effets d’agglomération procurent main-d’œuvre qualifiée, fournisseurs proches et diffusion rapide des savoir-faire.", "3) La Silicon Valley en fournit l’illustration contemporaine la plus célèbre.", "II. Mais elles demeurent fragiles", "A. Une fragilité financière", "1) L’accès au financement est plus difficile et plus coûteux que pour les grands groupes.", "2) La dépendance au crédit bancaire les expose directement au durcissement des conditions monétaires.", "3) Leur trésorerie limitée réduit leur capacité à absorber un choc durable.", "B. Une vulnérabilité aux crises", "1) Les retournements conjoncturels les frappent en premier, faute de réserves et de diversification.", "2) Elles ne peuvent pas compenser les pertes d’une activité par les profits d’une autre, contrairement au conglomérat.", "3) Leur disparition est donc plus fréquente, ce qui alimente un renouvellement permanent du tissu productif.", "C. Une dépendance aux donneurs d’ordres", "1) La sous-traitance les place en position de négociation défavorable face à des clients concentrés.", "2) La perte d’un client unique peut menacer l’existence même de l’entreprise.", "3) La fragmentation internationale de la production accentue cette asymétrie dans les chaînes de valeur.", "III. Leur place s’est recomposée plus qu’elle n’a disparu", "A. La firme-réseau redéfinit le rapport de taille", "1) La grande entreprise est reliée à un ensemble de PME par des relations contractuelles plutôt que par la propriété.", "2) La production devient modulaire : chaque entreprise réalise un module spécialisé ensuite assemblé.", "3) Apple illustre ce modèle où la marque coordonne un réseau de fournisseurs sans les posséder.", "B. L’ETI constitue une forme intermédiaire", "1) L’entreprise de taille intermédiaire combine une taille critique suffisante et une souplesse préservée.", "2) Elle dispose d’un meilleur accès au financement et à l’exportation que la PME.", "3) Son développement est souvent présenté comme un enjeu de compétitivité pour l’économie française.", "C. Grandes et petites structures coexistent durablement", "1) François et Lemercier montrent que plusieurs formes d’organisation coexistent : entreprises intégrées et entreprises distribuées.", "2) Amazon combine les deux logiques, intégration verticale et plateforme ouverte à d’autres vendeurs.", "3) Le capitalisme contemporain articule donc ces formes plutôt qu’il ne les substitue l’une à l’autre."], "conclusion": "Les PME persistent parce que leur souplesse, leur spécialisation et leur ancrage territorial répondent à des besoins que les grands groupes ne couvrent pas. Leur fragilité financière et leur dépendance aux donneurs d’ordres rappellent toutefois que cette persistance s’inscrit dans des réseaux largement structurés par les grandes firmes. La question n’est donc pas celle de leur disparition mais de leur recomposition : firmes-réseaux et ETI dessinent aujourd’hui les formes intermédiaires de cette coexistence."}, "ch9-7": {"title": "Pourquoi la firme existe-t-elle plutôt que le marché ?", "mobiliser": "Ch. 9 (théories de la firme, coûts de transaction) · Ch. 4 (rationalité, producteur) · Ch. 5 (asymétries d’information) · Ch. 10 (rationalité limitée, organisation) · Ch. 8 (formes d’entreprise)", "commentaire": "Sujet théorique majeur. Il faut opposer l’approche contractuelle d’Alchian et Demsetz, proche de la théorie néoclassique, et l’approche transactionnelle de Coase et Williamson, qui fonde l’existence de la firme sur les imperfections du marché. Le piège serait de confondre les deux. Mobiliser la rationalité limitée d’Herbert Simon et l’opportunisme, les deux hypothèses de Williamson. La question de Coase, posée dès 1937, doit structurer l’ensemble.", "intro": "La théorie néoclassique traditionnelle réduit l’entreprise à une fonction de production, sorte d’automate combinant capital et travail en réaction aux prix. Ronald Coase renverse la question dès 1937 : si le marché coordonne efficacement les activités, pourquoi observe-t-on des organisations hiérarchiques où les ordres remplacent les prix ? Cette interrogation fonde toute l’analyse moderne de la firme et débouche sur deux réponses concurrentes, contractuelle et transactionnelle.", "problematique": "Qu’est-ce qui justifie l’existence de la firme comme mode de coordination distinct du marché ?", "plan": ["I. L’approche contractuelle : la firme comme nœud de contrats", "A. Une conception proche de la théorie néoclassique", "1) Pour Armen Alchian et Harold Demsetz, la firme est un « nœud de contrats » entre acteurs aux intérêts divers.", "2) Elle n’est donc pas de nature différente du marché : elle en est une modalité contractuelle particulière.", "3) Michael Jensen et William Meckling prolongent cette lecture en y voyant un faisceau de relations contractuelles bilatérales.", "B. Le travail en équipe justifie le contrôle", "1) La production collective rend difficile la mesure de la contribution individuelle de chacun.", "2) Cette difficulté ouvre la possibilité de comportements de passager clandestin.", "3) Le contrôle hiérarchique naît donc du besoin de surveiller un effort non directement observable.", "C. Le créancier résiduel garantit l’efficacité", "1) Il perçoit le revenu qui reste une fois tous les autres apporteurs de facteurs rémunérés.", "2) Il a donc un intérêt direct à ce que l’entreprise soit efficace.", "3) L’asymétrie d’information entre lui et les autres acteurs conduit à la théorie de l’agence.", "II. L’approche transactionnelle : la firme comme réponse aux imperfections du marché", "A. Coase et le coût du recours au marché", "1) Recourir au marché a un coût : recherche d’information, négociation, rédaction et contrôle des contrats.", "2) Lorsque ce coût devient trop élevé, il devient rationnel d’internaliser la transaction.", "3) La firme coordonne alors par la hiérarchie là où le marché coordonnait par les prix.", "B. Williamson et les coûts de transaction", "1) La rationalité est limitée, au sens d’Herbert Simon : les agents ne disposent ni de toute l’information ni de capacités de calcul illimitées.", "2) Les contrats sont donc nécessairement incomplets et laissent place à l’interprétation.", "3) L’opportunisme conduit certains agents à exploiter cette incomplétude à leur avantage.", "C. L’arbitrage entre externaliser et internaliser", "1) L’externalisation réduit les coûts fixes et accroît la flexibilité.", "2) Mais elle expose à la dépendance et au comportement opportuniste du partenaire.", "3) L’internalisation sécurise la relation au prix d’une organisation plus lourde à gérer.", "III. Les deux approches éclairent des dimensions complémentaires", "A. Elles ne répondent pas à la même question", "1) L’approche contractuelle explique comment la firme organise les incitations en son sein.", "2) L’approche transactionnelle explique pourquoi la frontière de la firme se situe à tel endroit.", "3) La première est statique, la seconde rend compte du déplacement de cette frontière.", "B. La réalité organisationnelle dépasse les deux modèles", "1) Michel Crozier montre que le monde informel s’écarte de l’organigramme officiel.", "2) Les acteurs y disposent de marges de manœuvre liées à la maîtrise de zones d’incertitude.", "3) La firme n’est donc ni un pur contrat ni une pure hiérarchie, mais un système d’acteurs.", "C. Les formes hybrides se multiplient", "1) La firme-réseau coordonne par contrat sans posséder ses partenaires.", "2) La fragmentation internationale de la production déplace les frontières de la firme à l’échelle mondiale.", "3) Les dépendances critiques révélées par les chaînes de valeur relancent aujourd’hui l’arbitrage de Williamson."], "conclusion": "L’approche contractuelle voit dans la firme un nœud de contrats proche du marché, tandis que l’approche transactionnelle la conçoit comme une alternative rendue nécessaire par les coûts du recours au marché. C’est cette seconde lecture, de Coase à Williamson, qui explique le mieux l’arbitrage entre externalisation et internalisation. Les formes hybrides contemporaines, firmes-réseaux et chaînes de valeur fragmentées, montrent que cette frontière reste mobile."}, "ch9-8": {"title": "Les barrières à l’entrée sont-elles toujours nuisibles à la concurrence ?", "mobiliser": "Ch. 9 (barrières, brevets, marchés contestables) · Ch. 5 (monopole naturel) · Ch. 8 (innovation, brevets) · Ch. 6 (progrès technique) · 2ᵉ année ch. 1 (barrières réglementaires, protectionnisme)", "commentaire": "Certaines barrières sont tolérées par la théorie elle-même : coûts fixes, brevets, monopole naturel. Le sujet appelle donc une distinction fine entre barrières naturelles, technologiques, stratégiques et réglementaires. Le piège serait de les condamner en bloc. L’ubérisation et le cas des taxis illustrent l’ambivalence des barrières réglementaires, qui protègent mais limitent. La théorie des marchés contestables fournit le critère d’appréciation.", "intro": "Les barrières à l’entrée désignent les obstacles qui empêchent ou freinent l’arrivée de nouvelles entreprises sur un marché. Elles semblent par nature contraires à la concurrence, puisqu’elles protègent les firmes installées. Pourtant la théorie économique n’en condamne pas toutes : certains coûts fixes reflètent simplement la technologie de production, et le brevet institue délibérément une protection temporaire. Baumol, Panzar et Willig ont montré dans les années 1980 que c’est leur effet sur la contestabilité qui importe.", "problematique": "Toutes les barrières à l’entrée doivent-elles être considérées comme des atteintes à la concurrence ?", "plan": ["I. Les barrières ferment le marché et protègent les rentes", "A. Elles réduisent la libre entrée", "1) Les coûts fixes élevés dissuadent les entrants qui ne peuvent atteindre rapidement la taille rentable.", "2) Les coûts irrécupérables aggravent le risque : ce qui est engagé ne sera pas récupéré en cas de sortie.", "3) Les effets de réseau protègent le premier entrant, dont la plateforme devient incontournable.", "B. Certaines sont créées stratégiquement", "1) Les prix prédateurs, inférieurs au coût variable moyen, éliminent les concurrents et dissuadent les suivants.", "2) Les accords d’exclusivité verrouillent la distribution et privent l’entrant d’accès au marché.", "3) Le rachat préventif d’un concurrent émergent supprime la menace avant qu’elle ne se matérialise.", "C. Elles atteignent doublement la concurrence", "1) Elles réduisent l’atomicité en éliminant des acteurs présents.", "2) Elles suppriment la libre entrée en décourageant les acteurs potentiels.", "3) Le marché cesse alors d’être contestable, ce qui libère le comportement de la firme dominante.", "II. Mais certaines barrières sont justifiées", "A. Des barrières tolérées par la théorie", "1) Les coûts fixes ne sont pas anormaux : ils reflètent la technologie de production du secteur.", "2) Le monopole naturel est plus efficace qu’une pluralité de producteurs lorsque ces coûts sont très élevés.", "3) La réponse pertinente est alors la régulation des prix et de l’accès, non la fragmentation.", "B. Le brevet protège l’innovation", "1) Il constitue une barrière explicitement acceptée par le droit et la théorie.", "2) Il permet à l’innovateur de rentabiliser un investissement coûteux et incertain.", "3) Sans cette protection temporaire, l’imitation immédiate découragerait l’effort de recherche.", "C. Les barrières réglementaires poursuivent d’autres objectifs", "1) Licences, diplômes obligatoires et normes protègent la qualité et la sécurité des prestations.", "2) Les professions réglementées assurent une garantie de compétence au consommateur.", "3) Le cas des taxis face à l’ubérisation montre que ces barrières comportent aussi une dimension sociale.", "III. Le critère d’appréciation est l’effet sur la contestabilité", "A. La théorie des marchés contestables fournit le test", "1) Un marché est contestable si l’entrée et la sortie sont libres, sans coûts irrécupérables importants.", "2) La menace crédible d’entrée suffit alors à discipliner les firmes installées.", "3) Le nombre d’entreprises présentes devient un indicateur secondaire.", "B. Il faut distinguer la barrière de son usage", "1) Une barrière technique subie diffère d’une barrière érigée volontairement pour exclure.", "2) Une baisse de prix peut relever d’une concurrence normale ou d’une stratégie prédatrice durable.", "3) Les autorités doivent donc apprécier l’intention et les effets, non la seule existence de l’obstacle.", "C. Les politiques publiques arbitrent au cas par cas", "1) Elles sanctionnent les barrières stratégiques comme les prix prédateurs ou les exclusivités abusives.", "2) Elles tolèrent les barrières technologiques justifiées par l’innovation ou l’efficacité.", "3) Le Digital Markets Act cherche précisément à rouvrir l’accès aux plateformes devenues incontournables."], "conclusion": "Les barrières à l’entrée limitent la contestabilité et peuvent servir des stratégies délibérées d’exclusion, ce qui justifie leur surveillance. Mais coûts fixes, brevets, monopole naturel et réglementations professionnelles répondent aussi à des justifications techniques, incitatives ou sociales. Ce n’est donc pas l’existence de la barrière qui doit être sanctionnée, mais son caractère stratégique et son effet durable sur la possibilité réelle d’entrer."}, "ch9-9": {"title": "Le nombre d’entreprises est-il un bon indicateur de la concurrence ?", "mobiliser": "Ch. 9 (SCP, contestabilité, Lerner, Combe) · Ch. 5 (concurrence pure et parfaite) · Ch. 4 (marché, atomicité) · Ch. 3 (Smith) · 2ᵉ année ch. 1 (concentration mondiale)", "commentaire": "Sujet directement centré sur l’opposition entre approche standard et approche élargie chez Emmanuel Combe. Il faut expliquer le modèle SCP de Mason et Bain, puis sa critique, et montrer que la contestabilité remplace l’atomicité comme critère. L’indice de Lerner sert d’instrument de mesure. Le piège serait de rester descriptif : il faut montrer pourquoi compter les firmes ne dit rien de la pression concurrentielle réelle.", "intro": "L’approche standard de la concurrence retient l’atomicité : plus les entreprises sont nombreuses, plus le marché serait concurrentiel, et le monopole y apparaît comme l’ennemi naturel. Cette intuition a longtemps structuré l’économie industrielle et le modèle Structure-Comportements-Performances formalisé par Edward Mason puis Joe Bain dans les années 1950. La théorie des marchés contestables, développée dans les années 1980 par Baumol, Panzar et Willig, a pourtant remis ce critère en cause.", "problematique": "La concurrence se mesure-t-elle au nombre d’entreprises présentes ou à la possibilité effective d’entrer sur le marché ?", "plan": ["I. L’approche standard privilégie le nombre d’acteurs", "A. L’atomicité comme critère central", "1) La concurrence pure et parfaite suppose de nombreux offreurs, chacun trop petit pour influencer le prix.", "2) Les entreprises y sont preneuses de prix et non donneuses de prix.", "3) Le monopole apparaît dès lors comme la négation même de la concurrence.", "B. Le modèle SCP formalise cette logique", "1) Edward Mason puis Joe Bain relient la structure du marché aux comportements des firmes, puis aux performances.", "2) Une structure concentrée engendrerait mécaniquement des comportements anticoncurrentiels.", "3) Les performances — marges, profits, rentabilité — en découleraient à leur tour.", "C. Des instruments de mesure existent", "1) L’indice de Lerner, L = (P – Cm)/P, mesure la part de la marge dans le prix.", "2) Il tend vers zéro en concurrence parfaite, où le prix égalise le coût marginal.", "3) Il fournit donc un indicateur du pouvoir de marché indépendant du simple comptage.", "II. Mais le nombre d’entreprises est un indicateur trompeur", "A. Un marché concentré peut rester concurrentiel", "1) Baumol, Panzar et Willig montrent que la menace d’entrée discipline les prix sans concurrent effectif.", "2) L’absence de coûts irrécupérables importants rend cette menace crédible.", "3) Un monopole contestable peut donc se comporter comme une firme concurrentielle.", "B. Un marché atomisé peut être fermé", "1) De nombreuses firmes peuvent coexister derrière des barrières réglementaires qui interdisent l’entrée.", "2) Les ententes permettent à des acteurs nombreux de se comporter collectivement comme un monopole.", "3) Le parallélisme des comportements produit un résultat anticoncurrentiel sans accord explicite.", "C. Le modèle SCP est critiqué dans son principe", "1) Sa causalité est trop mécanique : elle va uniquement de la structure vers les comportements.", "2) Or les stratégies des firmes transforment elles-mêmes la structure du marché.", "3) L’innovation redessine les frontières sectorielles, ce que le modèle statique ne capte pas.", "III. La contestabilité s’impose comme critère pertinent", "A. Emmanuel Combe oppose deux approches", "1) L’approche standard raisonne sur l’atomicité et le nombre d’acteurs.", "2) L’approche élargie raisonne sur la libre entrée et la contestabilité du marché.", "3) Dans cette seconde lecture, la concentration n’est plus condamnable en soi.", "B. Les politiques publiques changent d’objectif", "1) Il ne s’agit plus de multiplier artificiellement le nombre d’entreprises.", "2) Il s’agit de lever les barrières qui rendent l’entrée impossible ou trop risquée.", "3) La portabilité du numéro dans la téléphonie illustre une réforme qui a rendu un marché plus contestable.", "C. Le numérique met ce critère à l’épreuve", "1) Les effets de réseau et l’avantage du premier entrant réduisent fortement la contestabilité.", "2) Le nombre de plateformes concurrentes ne renseigne pas sur la possibilité réelle d’en créer une nouvelle.", "3) Le Digital Markets Act intervient donc ex ante pour restaurer cette contestabilité perdue."], "conclusion": "Le nombre d’entreprises reste un indicateur commode, mais il est insuffisant : un marché concentré peut demeurer concurrentiel si l’entrée reste possible, tandis qu’un marché atomisé peut être verrouillé par des ententes ou des barrières réglementaires. La contestabilité constitue donc un critère plus pertinent que l’atomicité, ce qui déplace l’action publique de la fragmentation des acteurs vers la levée des obstacles à l’entrée."}, "ch9-10": {"title": "La politique de concurrence est-elle efficace face aux géants du numérique ?", "mobiliser": "Ch. 9 (antitrust, contrôle des concentrations, DMA) · Ch. 8 (plateformes, capitalisme numérique) · Ch. 5 (monopole, externalités de réseau) · Ch. 10 (pouvoir, souveraineté) · 2ᵉ année ch. 1 (GAFAM, BATX, souveraineté numérique)", "commentaire": "Il faut mobiliser les outils classiques — lois antitrust, contrôle des concentrations, sanction des cartels — puis montrer précisément pourquoi ils sont partiellement inadaptés aux plateformes. La difficulté de définition du marché pertinent et l’effondrement de la contestabilité par les effets de réseau sont les deux arguments centraux. Le DMA marque un changement de méthode, du contrôle ex post à la régulation ex ante. Ne pas oublier la dimension politique et démocratique.", "intro": "Les GAFAM et les BATX ont atteint en deux décennies des positions dominantes fondées sur les effets de réseau et le contrôle des données. Les instruments traditionnels de la politique de concurrence, forgés à l’époque des trusts industriels et du démantèlement de la Standard Oil en 1911, se révèlent partiellement inadaptés à ces marchés. L’Union européenne a répondu par le Digital Markets Act, qui change de méthode en interdisant certaines pratiques par principe plutôt qu’après constat d’abus.", "problematique": "Les instruments de la politique de concurrence permettent-ils encore d’encadrer le pouvoir des grandes plateformes numériques ?", "plan": ["I. Des instruments éprouvés et toujours mobilisés", "A. Un arsenal ancien et complet", "1) Les lois antitrust américaines sanctionnent les monopoles et les ententes depuis la fin du XIXᵉ siècle.", "2) Le démantèlement reste l’arme ultime : AT&T l’a subi, Microsoft y a échappé de peu dans les années 1990.", "3) En Europe, la politique de concurrence protège le marché commun et surveille les aides d’État.", "B. Quatre domaines d’intervention", "1) La surveillance des aides d’État empêche les subventions qui fausseraient la concurrence.", "2) Le contrôle des concentrations autorise, encadre ou refuse les fusions-acquisitions.", "3) La sanction des cartels s’appuie sur la procédure de clémence pour détecter les ententes secrètes.", "C. Des sanctions réelles", "1) Les autorités européennes ont infligé des amendes considérables à plusieurs plateformes.", "2) L’abus de position dominante, notamment par auto-préférence, a été caractérisé à plusieurs reprises.", "3) La menace de sanction modifie effectivement certains comportements des acteurs dominants.", "II. Mais des instruments partiellement inadaptés", "A. Le marché pertinent est difficile à délimiter", "1) Les plateformes opèrent sur des marchés multifaces, où l’usager ne paie pas toujours le service.", "2) L’échelle géographique est mondiale, alors que les autorités raisonnent souvent au niveau national ou régional.", "3) L’affaire Alstom-Siemens a montré combien la définition du marché pertinent détermine la décision.", "B. La contestabilité s’est effondrée", "1) Les effets de réseau font croître la valeur de la plateforme avec le nombre d’utilisateurs.", "2) L’avantage du premier entrant devient cumulatif et quasiment irrattrapable.", "3) L’entrée d’un concurrent nouveau cesse d’être une menace crédible, ce qui neutralise la discipline de marché.", "C. Le contrôle ex post arrive trop tard", "1) Les procédures durent des années, alors que les positions se consolident en quelques mois.", "2) Le rachat préventif de jeunes entreprises innovantes échappe souvent aux seuils de contrôle.", "3) L’amende, même élevée, peut être absorbée comme un coût d’exploitation.", "III. Une régulation renouvelée mais aux enjeux plus larges", "A. Le DMA change de méthode", "1) Il vise explicitement les acteurs structurants, désignés en raison de leur position.", "2) Il interdit certaines pratiques par principe, notamment l’auto-préférence, sans attendre la preuve d’un abus.", "3) Il prévoit de fortes sanctions financières en cas de manquement.", "B. Les enjeux dépassent la concurrence", "1) Le contrôle des données et des flux d’information devient un enjeu démocratique.", "2) La souveraineté numérique désigne la capacité d’un État à maîtriser ses technologies et ses infrastructures.", "3) Certaines firmes exercent désormais des fonctions qui relevaient historiquement des États.", "C. L’efficacité dépendra de l’échelle d’action", "1) Une régulation purement régionale se heurte à des acteurs mondiaux.", "2) L’arsenalisation de la politique économique transforme ces dépendances en instruments de rapport de force.", "3) La coordination internationale conditionne donc l’effectivité de toute régulation."], "conclusion": "Les instruments classiques conservent leur utilité mais peinent à saisir des marchés mondiaux, multifaces et structurés par les effets de réseau, où le contrôle ex post arrive trop tard. Le Digital Markets Act marque un tournant en régulant ex ante les plateformes structurantes. Mais son efficacité dépendra de l’échelle d’action, et l’enjeu dépasse désormais la seule concurrence : il touche à la souveraineté et au fonctionnement démocratique."}, "ch9-11": {"title": "La concentration verticale s’explique-t-elle uniquement par la recherche de profit ?", "mobiliser": "Ch. 9 (concentration verticale, Williamson, coûts de transaction) · Ch. 5 (asymétries d’information) · Ch. 4 (producteur) · Ch. 8 (organisation productive) · 2ᵉ année ch. 1 (chaînes de valeur, dépendances critiques)", "commentaire": "Le sujet appelle Williamson. Au-delà du profit immédiat, l’intégration réduit les coûts de transaction, l’incertitude et l’opportunisme. Il faut distinguer intégration amont et aval, expliquer la rationalité limitée de Simon, puis montrer que la sécurisation des approvisionnements est devenue un motif autonome. Le piège serait de s’en tenir à une explication par la marge captée.", "intro": "La concentration verticale consiste à contrôler plusieurs étapes de la chaîne de production, en amont vers les fournisseurs ou en aval vers la distribution. Une lecture immédiate y voit une simple captation de la marge des intermédiaires. L’analyse néo-institutionnaliste, d’Oliver Williamson prolongeant Ronald Coase, propose une explication plus fine, fondée sur les coûts du recours au marché. Les ruptures d’approvisionnement récentes ont ajouté un troisième motif, celui de la sécurité.", "problematique": "L’intégration verticale répond-elle seulement à une logique de profit, ou traduit-elle une réponse aux imperfections du marché ?", "plan": ["I. Une logique de profit et de maîtrise", "A. Capter la marge des intermédiaires", "1) L’intégration amont sécurise les approvisionnements et supprime la marge du fournisseur.", "2) L’intégration aval capte la marge du distributeur et la relation directe au client.", "3) L’entreprise internalise ainsi une valeur qu’elle versait auparavant à des tiers.", "B. Renforcer le pouvoir de marché", "1) Contrôler la chaîne permet de limiter l’accès des concurrents aux intrants ou aux réseaux de distribution.", "2) La dépendance des partenaires restants s’accroît, ce qui déplace le rapport de force.", "3) Cette stratégie peut basculer dans l’abus lorsqu’elle vise explicitement l’éviction.", "C. Améliorer la coordination productive", "1) L’intégration synchronise les étapes de production et réduit les délais.", "2) Elle facilite l’adaptation de la qualité des intrants aux besoins de la production finale.", "3) Elle permet de partager l’information technique sans passer par un contrat.", "II. Mais une réponse aux imperfections du marché", "A. Les coûts de transaction expliquent l’internalisation", "1) Recourir au marché suppose de rechercher l’information, négocier, rédiger et contrôler les contrats.", "2) Ronald Coase établit dès 1937 que ces coûts justifient l’existence même de la firme.", "3) Williamson en tire un critère d’arbitrage : internaliser quand le marché devient trop coûteux.", "B. Rationalité limitée et opportunisme", "1) La rationalité est limitée, au sens d’Herbert Simon : l’information est incomplète et les capacités de calcul bornées.", "2) Les contrats sont donc nécessairement incomplets et laissent place à l’interprétation.", "3) L’opportunisme conduit certains partenaires à exploiter cette incomplétude, ce qui rend le marché risqué.", "C. La spécificité des actifs renforce l’argument", "1) Un investissement adapté à un partenaire unique perd sa valeur hors de cette relation.", "2) Celui qui l’a réalisé devient vulnérable à une renégociation défavorable.", "3) L’intégration protège alors un investissement que le contrat ne suffit pas à sécuriser.", "III. Un troisième motif contemporain : la sécurité des approvisionnements", "A. Les chaînes de valeur ont révélé des dépendances critiques", "1) La fragmentation internationale de la production a multiplié les maillons et les points de rupture.", "2) Un intrant sans alternative suffit à bloquer l’ensemble de la chaîne.", "3) Le contenu en importations des exportations mesure l’ampleur de cette exposition.", "B. La relocalisation change le critère de décision", "1) La sécurité prime alors sur le coût, ce qui inverse l’arbitrage habituel.", "2) Certaines productions jugées stratégiques sont réintégrées malgré un coût supérieur.", "3) L’intégration verticale redevient un instrument de souveraineté économique.", "C. Les autorités examinent ces opérations avec attention", "1) Le contrôle des concentrations apprécie si l’intégration verrouille l’accès au marché.", "2) Les accords d’exclusivité peuvent produire un effet équivalent sans fusion juridique.", "3) L’appréciation dépend donc des effets concrets sur la contestabilité du marché."], "conclusion": "La concentration verticale procure des marges supplémentaires et du pouvoir de marché, mais cette explication est insuffisante. Elle s’explique surtout par les coûts de transaction : face à la rationalité limitée et à l’opportunisme, internaliser devient plus sûr que contracter. Les ruptures récentes des chaînes de valeur ont ajouté un motif de sécurité qui, en faisant primer la robustesse sur le coût, réactive l’arbitrage de Williamson dans un contexte nouveau."}, "ch9-12": {"title": "La différenciation des produits est-elle une forme de concurrence ?", "mobiliser": "Ch. 9 (différenciation, Chamberlin, élasticité) · Ch. 4 (préférences, élasticité-prix) · Ch. 5 (concurrence imparfaite) · Ch. 10 (normes sociales, consommation) · Ch. 6 (innovation)", "commentaire": "Piège : la différenciation intensifie la rivalité hors-prix mais réduit la substituabilité, donc crée du pouvoir de marché. Chamberlin et la concurrence monopolistique sont incontournables. Il faut distinguer différenciation verticale, qui porte sur la qualité, et horizontale, qui porte sur le style ou la localisation, puis montrer l’effet sur l’élasticité-prix de la demande.", "intro": "Les entreprises cherchent rarement à vendre un produit strictement identique à celui de leurs concurrents. En rendant leur offre distincte aux yeux du consommateur, elles modifient le rapport de celui-ci au produit. Edward Chamberlin a théorisé ce mécanisme dès 1933 sous le nom de concurrence monopolistique : chaque firme détient alors une sorte de petit monopole sur son segment différencié. La différenciation apparaît ainsi à la fois comme une forme de rivalité et comme un instrument de pouvoir.", "problematique": "La différenciation des produits relève-t-elle d’une intensification de la concurrence ou d’une stratégie d’acquisition de pouvoir de marché ?", "plan": ["I. Une forme réelle de rivalité entre entreprises", "A. Une concurrence par la qualité et par l’image", "1) La différenciation verticale joue sur la qualité et le prix, ce qui segmente la clientèle selon son pouvoir d’achat.", "2) La différenciation horizontale joue sur le style, le goût, l’univers visuel ou la localisation.", "3) Dans les deux cas, la firme cherche à être préférée sans nécessairement baisser son prix.", "B. Une stimulation de l’innovation", "1) La compétitivité hors-prix devient un axe d’effort permanent pour les entreprises.", "2) Le renouvellement des gammes et des fonctionnalités entretient la dynamique concurrentielle.", "3) Le consommateur bénéficie d’une offre plus variée et mieux adaptée à ses préférences.", "C. Une concurrence accessible aux petites structures", "1) La différenciation permet d’échapper à une guerre des prix perdue d’avance face à un grand groupe.", "2) Les marchés de niche reposent précisément sur cette logique de distinction.", "3) Elle constitue donc un instrument de survie pour les PME.", "II. Mais un instrument de pouvoir de marché", "A. Une réduction de la substituabilité", "1) Les biens cessent d’être interchangeables aux yeux du consommateur.", "2) La comparaison devient difficile, ce qui affaiblit la discipline exercée par les prix concurrents.", "3) L’élasticité-prix de la demande diminue : le consommateur fidèle accepte de payer davantage.", "B. La concurrence monopolistique selon Chamberlin", "1) De nombreuses entreprises coexistent, mais chacune dispose d’un pouvoir sur son segment.", "2) Chaque firme fait donc face à une demande décroissante et non à un prix imposé par le marché.", "3) Le résultat s’écarte durablement de l’équilibre concurrentiel.", "C. La marque devient une barrière", "1) La notoriété construite dans la durée constitue un actif difficile à imiter rapidement.", "2) Les dépenses publicitaires représentent un coût d’entrée considérable pour un nouvel arrivant.", "3) La différenciation protège ainsi la position acquise autant qu’elle la conquiert.", "III. Une rivalité qui déplace la concurrence plutôt qu’elle ne la supprime", "A. La concurrence change de terrain", "1) Elle se déplace du prix vers la qualité perçue, l’image et l’innovation.", "2) Cette rivalité reste réelle : une marque peut être détrônée par une offre jugée plus désirable.", "3) La différenciation n’abolit donc pas la pression concurrentielle, elle en modifie la forme.", "B. Elle ouvre la voie à la discrimination tarifaire", "1) Le monopole discriminant pratique des prix différents selon la sensibilité au prix des consommateurs.", "2) Cette tarification différentielle s’appuie sur l’élasticité-prix réduite par la différenciation.", "3) Elle n’est pas systématiquement condamnée par les autorités de la concurrence.", "C. Le droit sanctionne l’usage abusif, non la différenciation", "1) Différencier son produit est une stratégie légitime et attendue d’une entreprise.", "2) Le dénigrement d’un concurrent ou les ventes liées relèvent en revanche de l’abus.", "3) La frontière passe donc entre distinction de l’offre et éviction du concurrent."], "conclusion": "La différenciation entretient une rivalité réelle, mais déplacée du prix vers la qualité, l’image et l’innovation. En réduisant la substituabilité et l’élasticité-prix, elle confère cependant à chaque entreprise un pouvoir de marché durable : c’est tout le sens de la concurrence monopolistique décrite par Chamberlin en 1933. Elle ne supprime donc pas la concurrence, elle en change le terrain — et ce n’est que son usage abusif que le droit sanctionne."}, "ch9-13": {"title": "Le modèle SCP permet-il de comprendre le fonctionnement des marchés ?", "mobiliser": "Ch. 9 (modèle SCP, Mason, Bain, Lerner, Combe) · Ch. 5 (structures de marché) · Ch. 4 (équilibre) · Ch. 3 (méthode en économie) · 2ᵉ année ch. 1 (concentration mondiale)", "commentaire": "Exposer le modèle, puis sa limite principale : le sens de la causalité peut s’inverser. Mason et Bain doivent être datés des années 1950. L’indice de Lerner sert d’instrument de mesure des performances. La critique débouche sur l’approche par la contestabilité de Combe, qu’il faut présenter comme un dépassement et non comme une réfutation totale.", "intro": "Né avec l’économie industrielle, le modèle Structure-Comportements-Performances a longtemps constitué la grille de lecture dominante des marchés. Formalisé par Edward Mason puis Joe Bain dans les années 1950, il relie la configuration du marché aux stratégies des firmes, puis à leurs résultats économiques. Sa clarté en a fait un outil pédagogique durable, mais il a ensuite été critiqué pour son caractère trop mécanique et pour l’unilatéralité de sa causalité.", "problematique": "Le modèle SCP rend-il compte de la complexité réelle des marchés, ou son déterminisme en limite-t-il la portée ?", "plan": ["I. Un cadre d’analyse clair et structurant", "A. Trois dimensions articulées", "1) La structure décrit la configuration du marché : nombre d’entreprises, barrières à l’entrée, différenciation des produits.", "2) Les comportements en découlent : politique de prix, ententes, stratégies d’exclusion.", "3) Les performances closent la chaîne : profits, marges, rentabilité.", "B. Une mesure du pouvoir de marché", "1) L’indice de Lerner, L = (P – Cm)/P, quantifie la part de la marge dans le prix.", "2) Il tend vers zéro en concurrence parfaite, où le prix rejoint le coût marginal.", "3) Il permet donc de relier empiriquement structure et performance.", "C. Un modèle fondateur de l’économie industrielle", "1) Il déplace l’analyse du marché abstrait vers l’étude des secteurs réels.", "2) Il fournit une grille commune permettant la comparaison entre industries.", "3) Il inspire durablement les autorités de concurrence dans leur diagnostic.", "II. Mais un modèle trop mécanique", "A. La causalité peut s’inverser", "1) Les comportements stratégiques des firmes transforment eux-mêmes la structure du marché.", "2) Une politique de prix prédateurs modifie le nombre d’acteurs, donc la structure supposée initiale.", "3) L’innovation redessine les frontières sectorielles que le modèle traite comme données.", "B. Le modèle est statique", "1) Il décrit un état plutôt qu’une dynamique concurrentielle.", "2) Il intègre mal la destruction créatrice décrite par Schumpeter.", "3) Il ne rend pas compte de l’émergence rapide de positions dominantes dans le numérique.", "C. Il surestime le rôle de l’atomicité", "1) Il assimile concentration et affaiblissement de la concurrence.", "2) Or un marché concentré peut rester discipliné par la menace d’entrée.", "3) Inversement, un marché atomisé peut être verrouillé par des ententes.", "III. Un modèle dépassé mais non abandonné", "A. L’approche élargie propose une alternative", "1) Baumol, Panzar et Willig substituent la contestabilité à l’atomicité comme critère.", "2) Emmanuel Combe oppose explicitement approche standard et approche élargie de la concurrence.", "3) Le critère devient la libre entrée, non le comptage des acteurs.", "B. Les politiques publiques en tirent les conséquences", "1) L’objectif n’est plus de multiplier artificiellement les entreprises.", "2) Il s’agit de lever les barrières qui rendent l’entrée impossible ou trop risquée.", "3) Le Digital Markets Act applique cette logique aux plateformes structurantes.", "C. Le SCP conserve une valeur descriptive", "1) Il reste un point de départ utile pour caractériser un secteur.", "2) Ses trois dimensions demeurent les catégories du diagnostic concurrentiel.", "3) C’est son déterminisme, non son architecture, que la critique a invalidé."], "conclusion": "Le modèle SCP offre un cadre clair reliant structure, comportements et performances, et fournit avec l’indice de Lerner un instrument de mesure. Mais son déterminisme est excessif : les stratégies des firmes façonnent aussi la structure du marché, et l’atomicité s’avère un critère insuffisant. L’approche par la contestabilité le dépasse sans l’abolir : le SCP demeure une grille descriptive utile, à condition de renoncer à sa causalité unilatérale."}, "ch9-18": {"title": "L’entreprise est-elle un lieu de coopération ou de conflit ?", "mobiliser": "Ch. 9 (théories de la firme, théorie de l’agence) · Ch. 10 (Crozier, Durkheim, pouvoir, interdépendance) · Ch. 8 (organisation du travail, gouvernance) · Ch. 5 (asymétries d’information) · Ch. 1 (agents économiques)", "commentaire": "Sujet de synthèse à forte transversalité. Il faut montrer que la coopération est nécessaire mais conflictuelle, en mobilisant l’analyse stratégique de Crozier et la théorie de l’agence. Durkheim apporte la solidarité organique et l’interdépendance. Le piège serait de trancher : l’entreprise est structurellement ambivalente, et le conflit y est la conséquence normale de l’interdépendance.", "intro": "Travailler ensemble suppose de coordonner ses actions, et l’entreprise est d’abord un dispositif de coordination productive. Mais les acteurs qui la composent — salariés, managers, actionnaires — poursuivent des objectifs qui ne coïncident pas toujours. Michel Crozier, dans L’Acteur et le système publié en 1977 avec Erhard Friedberg, fait de cette tension le cœur de l’analyse stratégique des organisations. L’entreprise apparaît ainsi comme un lieu où coopération et conflit sont indissociables.", "problematique": "La coopération dans l’organisation exclut-elle le conflit, ou en est-elle indissociable ?", "plan": ["I. Une coopération nécessaire à la production", "A. L’interdépendance impose la coordination", "1) Les tâches sont complémentaires : nul ne produit seul le résultat final.", "2) Alchian et Demsetz montrent que le travail en équipe rend la production collective indivisible.", "3) La firme existe précisément pour coordonner ce que le marché ne coordonne pas efficacement.", "B. Des dispositifs organisent cette coopération", "1) Les règles et procédures formelles rendent l’action prévisible et réduisent l’incertitude.", "2) Les relations informelles fluidifient le fonctionnement réel, au-delà de l’organigramme.", "3) Les formes U et M décrites par Chandler structurent la coordination selon la taille et la diversification.", "C. La division du travail crée du lien", "1) Durkheim montre que la spécialisation engendre une solidarité organique fondée sur la complémentarité.", "2) Le travail rattache l’individu à un groupe professionnel et lui fournit des normes.", "3) L’interdépendance produit ainsi de la cohésion autant que de la dépendance.", "II. Mais des intérêts durablement divergents", "A. La théorie de l’agence formalise l’opposition", "1) Le principal et l’agent ne poursuivent pas le même objectif.", "2) L’asymétrie d’information empêche le principal d’observer l’effort réel de l’agent.", "3) Jensen et Meckling analysent la firme comme un faisceau de relations contractuelles traversées par ces conflits.", "B. Le partage de la valeur est disputé", "1) Salaires et profits constituent des usages concurrents de la valeur ajoutée.", "2) Le créancier résiduel perçoit ce qui reste, ce qui l’oppose aux autres apporteurs de facteurs.", "3) La gouvernance arbitre entre actionnaires, dirigeants et parties prenantes.", "C. Le pouvoir se joue dans les interstices", "1) Crozier montre que le monde informel s’écarte durablement du monde formel.", "2) La maîtrise d’une zone d’incertitude confère du pouvoir indépendamment de la position hiérarchique.", "3) L’exemple des ouvriers d’entretien de la SEITA, étudié dans Le Phénomène bureaucratique en 1963, l’illustre.", "III. Une ambivalence structurelle plutôt qu’une alternative", "A. Le conflit découle de l’interdépendance elle-même", "1) Les acteurs doivent coopérer tout en poursuivant des stratégies propres.", "2) Le conflit n’est donc pas une pathologie mais une conséquence normale de l’organisation.", "3) Il explique la difficulté persistante des organisations à se réformer.", "B. La coopération peut être conflictuelle", "1) Les acteurs coopèrent effectivement tout en négociant leur contribution et leur rétribution.", "2) Chacun défend ses marges de manœuvre, ce qui ralentit le changement.", "3) La résistance au changement traduit la défense de zones d’incertitude acquises.", "C. Les dispositifs tentent d’articuler les deux dimensions", "1) Les métarègles proposées par Christian Morel organisent la contradiction au lieu de l’étouffer.", "2) La gouvernance élargie aux parties prenantes institutionnalise la négociation.", "3) L’institutionnalisation des conflits transforme l’affrontement en procédure réglée."], "conclusion": "L’entreprise repose sur la coopération des acteurs pour produire, et la division du travail y engendre une véritable solidarité organique. Mais elle est traversée par des intérêts divergents que la théorie de l’agence met en évidence et par des rapports de pouvoir que l’analyse stratégique de Crozier révèle. Le conflit n’y est donc pas un dysfonctionnement : il est la conséquence normale de l’interdépendance, que la gouvernance a pour fonction d’organiser."}, "ch9-14": {"title": "Les firmes-réseaux remettent-elles en cause la grande entreprise intégrée ?", "mobiliser": "Ch. 9 (firmes-réseaux, districts, Chandler, Williamson) · Ch. 8 (formes d’entreprise, organisation) · Ch. 10 (organisation, pouvoir) · 2ᵉ année ch. 1 (DIPP, chaînes de valeur)", "commentaire": "Opposer entreprises intégrées et entreprises distribuées, puis montrer qu’elles coexistent. Marshall et les districts industriels, les effets d’agglomération, la DIPP et le cas Amazon sont attendus. Le piège serait d’annoncer le remplacement d’une forme par l’autre : Chandler et Williamson restent pertinents pour expliquer le maintien de l’intégration.", "intro": "La firme-réseau désigne une grande entreprise reliée à un ensemble de PME et de partenaires par des relations contractuelles plutôt que par la propriété. Ce modèle, appuyé sur une production modulaire, s’est imposé avec la fragmentation internationale des processus productifs. François et Lemercier montrent toutefois que plusieurs formes d’organisation coexistent aujourd’hui, entreprises distribuées et entreprises intégrées, ce qui interdit de conclure trop vite au dépassement du modèle hiérarchique.", "problematique": "La firme-réseau constitue-t-elle un dépassement de la grande entreprise intégrée ou une forme complémentaire ?", "plan": ["I. La firme-réseau conteste le modèle intégré", "A. Une production modulaire", "1) Chaque entreprise réalise un module spécialisé, ensuite assemblé par le coordinateur du réseau.", "2) La décomposition internationale des processus productifs répartit ces modules entre territoires.", "3) Apple illustre ce modèle : la marque coordonne un réseau de fournisseurs sans les posséder.", "B. Des avantages de flexibilité", "1) Les coûts fixes sont réduits et partagés entre les membres du réseau.", "2) L’adaptation est plus rapide : le réseau se recompose sans restructuration interne.", "3) Le risque est transféré vers des partenaires qui supportent les variations d’activité.", "C. Un ancrage territorial puissant", "1) Marshall décrit dès 1890 les districts industriels, concentrations locales d’entreprises spécialisées.", "2) Les effets d’agglomér
