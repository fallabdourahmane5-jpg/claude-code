ux intérêts opposés sont contraints de coopérer.", "III. La division du travail n’est destructrice que lorsqu’elle se développe sans régulation", "A. L’anomie constitue la véritable menace", "1) L’anomie désigne une situation où les normes collectives sont absentes, insuffisantes ou imprécises.", "2) L’individu ne sait alors plus quelles limites respecter ni ce qu’il peut légitimement attendre : Durkheim parle d’une « passion de l’infini » qui ne peut être satisfaite.", "3) Ce n’est donc pas la spécialisation qui détruit le lien, mais la vitesse d’une transformation que les règles n’ont pas suivie.", "B. Le groupe professionnel devait fournir cette régulation", "1) Il lutte contre l’égoïsme en rattachant l’individu à un collectif concret, plus proche de lui que l’État.", "2) Il lutte contre l’anomie en produisant des règles adaptées à l’activité exercée.", "3) Le recul syndical — 10,3 % des salariés syndiqués en 2019 — affaiblit précisément ce relais normatif.", "C. Les formes contemporaines du travail relancent la question", "1) La précarisation multiplie les statuts et raccourcit les durées d’emploi, ce qui empêche l’insertion durable dans un collectif professionnel.", "2) Castel analyse la désaffiliation comme l’aboutissement de ce décrochage à l’égard du travail et des réseaux de sociabilité.", "3) L’ubérisation pousse la logique plus loin encore en individualisant le rapport au travail jusqu’à supprimer le collectif de travail lui-même."], "conclusion": "La division du travail paraît détruire le lien social parce qu’elle fragmente les tâches, différencie les conditions et affaiblit les appartenances traditionnelles. Durkheim renverse pourtant cette lecture : en rendant les individus différents, elle les rend nécessaires les uns aux autres, et substitue une solidarité organique fondée sur l’interdépendance à une solidarité mécanique fondée sur la ressemblance. Le danger ne vient donc pas de la spécialisation elle-même, mais de son développement sans régulation, c’est-à-dire de l’anomie. C’est pourquoi le recul des groupes professionnels et la précarisation contemporaine, en privant le travail de ses relais normatifs, réactivent aujourd’hui une inquiétude que Durkheim croyait pouvoir dissiper."}, "ch10-9": {"commentaire": "Sujet à double détente : statistique puis sociologique. Il faut d’abord établir que le chômage est une construction statistique — définition du BIT, catégories de France Travail, halo du chômage, frontière actif/inactif — pour montrer que même sa mesure ne va pas de soi. La deuxième partie traite la perte de revenu et ses effets matériels. La troisième, décisive, mobilise Castel : le chômage rompt des liens sociaux et enclenche la désaffiliation. Le mot « seulement » impose de ne pas s’arrêter à la dimension monétaire : c’est là que se joue la note.", "intro": "Le Bureau international du travail définit le chômeur par trois critères simultanés : être sans emploi, être disponible et rechercher activement un travail. Cette définition, d’apparence technique, décide de qui est compté et de qui ne l’est pas, et elle ne recouvre pas les catégories administratives de France Travail. Ce simple constat indique que le chômage n’est pas un fait brut mais une construction sociale et statistique. Il indique aussi que la privation d’emploi n’épuise pas le phénomène : Robert Castel, dans Les Métamorphoses de la question sociale (1995), montre que perdre son travail, dans une société salariale, revient à perdre bien davantage qu’un salaire. Le chômage se définira comme la situation d’une personne active, sans emploi, disponible et en recherche.", "problematique": "Le chômage se réduit-il à la perte d’un revenu d’activité, ou constitue-t-il une rupture des liens et des statuts que le travail conférait ?", "plan": ["I. Le chômage est d’abord une catégorie statistique construite", "A. La mesure du BIT repose sur des critères restrictifs", "1) Être sans emploi, être disponible pour travailler dans un délai court et effectuer une recherche active : les trois conditions doivent être réunies.", "2) Le chômeur appartient donc à la population active, contrairement à l’inactif qui ne participe pas au marché du travail selon les critères statistiques.", "3) Une personne découragée qui cesse de chercher sort mécaniquement des statistiques sans avoir retrouvé d’emploi.", "B. La mesure administrative de France Travail obéit à une autre logique", "1) La catégorie A regroupe les demandeurs sans aucune activité, tenus de rechercher un emploi.", "2) Les catégories B et C incluent ceux qui ont exercé une activité réduite, courte pour la première, plus longue pour la seconde.", "3) Les catégories D et E recouvrent des situations particulières, formation ou emploi aidé, qui échappent à la définition du BIT.", "C. Le halo du chômage révèle le caractère flou de la frontière", "1) Certaines personnes souhaitent travailler sans être disponibles immédiatement, ou sans rechercher activement à cet instant.", "2) D’autres exercent une activité si réduite qu’elles ne sont comptées ni comme chômeurs ni comme véritablement en emploi.", "3) Le nombre de chômeurs varie donc selon les critères retenus : la statistique construit en partie son objet.", "II. Il est ensuite une privation matérielle aux effets cumulatifs", "A. La perte du revenu d’activité dégrade la situation économique", "1) Le revenu d’activité constitue la ressource principale des ménages, et son interruption entame immédiatement le niveau de vie.", "2) L’indemnisation ne compense que partiellement et pour une durée limitée, ce qui fait glisser certains ménages sous le seuil de pauvreté.", "3) La pauvreté laborieuse montre d’ailleurs que la frontière emploi-pauvreté est déjà poreuse : un emploi mal rémunéré, à temps partiel ou irrégulier ne protège plus.", "B. Les effets se cumulent avec d’autres privations", "1) L’enquête de Florence Aubenas dans Le Quai de Ouistreham (2010) montre que le permis de conduire conditionne l’accès à des emplois aux horaires décalés et mal desservis.", "2) Le chômage restreint la mobilité, l’accès au logement et parfois l’accès aux soins, chaque privation en renforçant une autre.", "3) Ces effets frappent inégalement : en France, le taux de chômage atteint 18,7 % chez les 15-24 ans contre 7,4 % pour l’ensemble.", "C. La comparaison internationale confirme l’ampleur de cette inégalité générationnelle", "1) En Allemagne, le chômage des jeunes s’établit à 6,6 % pour un taux d’ensemble de 3,4 %.", "2) En Italie, il atteint 20,3 % contre 6,5 % pour l’ensemble de la population active.", "3) L’écart entre jeunes et ensemble tient largement à leur entrée récente sur le marché du travail et à leur surexposition aux contrats temporaires.", "III. Il constitue surtout une rupture sociale, ce que montre la désaffiliation", "A. Le travail conférait bien plus qu’un salaire", "1) Dans la société salariale décrite par Castel, le salaire s’accompagne d’un statut, de droits sociaux et d’une appartenance à la collectivité.", "2) Durkheim avait montré que le travail crée des relations, rattache à un groupe professionnel et fournit des normes.", "3) Perdre son emploi, c’est donc perdre simultanément ses collègues, son rythme quotidien et une part de son identité sociale.", "B. La désaffiliation décrit ce décrochage cumulatif", "1) Castel montre que le chômage de masse apparu dans les années 1970-1980 ne produit pas seulement une perte de revenu mais une perte de liens.", "2) L’isolement s’installe progressivement, et il rend à son tour le retour à l’emploi plus difficile.", "3) La « question sociale » du XIXᵉ siècle, celle du paupérisme ouvrier, se déplace ainsi au XXᵉ siècle vers la fragilisation de la condition salariale elle-même.", "C. Cette dimension sociale explique certains comportements que le seul revenu n’éclaire pas", "1) La recherche d’un travail « qui a du sens » — utilité sociale, fierté, épanouissement — montre que l’emploi est attendu comme autre chose qu’une rémunération.", "2) La « grande démission » de 2020 à 2022, environ quatre millions de départs aux États-Unis et de l’ordre de 500 000 en France en 2022, relève souvent d’une reconversion et non d’un retrait du travail.", "3) Le chômage étant une rupture de liens autant qu’une perte de ressources, les politiques d’accompagnement ne peuvent se limiter à l’indemnisation."], "conclusion": "Le chômage est d’abord une catégorie construite, dont la mesure varie selon que l’on retient les critères du BIT ou les catégories de France Travail, et dont le halo montre la frontière incertaine avec l’inactivité. Il est ensuite une privation matérielle réelle, aux effets cumulatifs qui frappent particulièrement les jeunes. Mais il est surtout, comme l’établit Castel, une rupture sociale : dans une société où le salaire donnait un statut, des droits et une appartenance, en être privé enclenche un processus de désaffiliation. Le chômage n’est donc pas seulement une privation d’emploi, et c’est pourquoi le traiter par la seule compensation monétaire laisserait intacte la part la plus durable de ses effets."}, "ch10-10": {"commentaire": "Sujet explicatif et non argumentatif : il appelle un plan par causes, non un plan dialectique artificiel. Le chapitre fournit trois causes explicites — désindustrialisation, individualisme, mondialisation — qu’il faut développer et hiérarchiser plutôt que juxtaposer. Il faut impérativement commencer par établir le fait avec les données disponibles, et distinguer le recul de l’adhésion de celui de l’influence, car l’institutionnalisation des conflits maintient un rôle syndical réel malgré la faiblesse du taux de syndicalisation. Durkheim et le groupe professionnel donnent la portée théorique du sujet.", "intro": "Avec 10,3 % de salariés syndiqués en 2019, la France figure parmi les pays développés où l’adhésion syndicale est la plus faible, alors même que les syndicats y négocient des accords qui couvrent la quasi-totalité des salariés. Ce paradoxe interdit de confondre deux réalités distinctes : le nombre d’adhérents et la capacité d’influence. Le recul de l’adhésion n’en est pas moins massif et ancien, puisqu’il succède à un mouvement ouvrier structuré depuis la légalisation des syndicats en 1884 et étroitement lié aux transformations du monde du travail. Un syndicat se définit comme une organisation qui représente collectivement les travailleurs afin de défendre leurs intérêts professionnels. Comprendre son affaiblissement revient donc à comprendre la recomposition du salariat lui-même.", "problematique": "Le recul du syndicalisme français traduit-il un désintérêt des salariés pour l’action collective, ou résulte-t-il de transformations structurelles du travail qui en ont défait les bases ?", "plan": ["I. Le recul de l’adhésion est un fait mesuré, mais qu’il faut caractériser avec précision", "A. Les données situent l’ampleur du phénomène", "1) Le taux de syndicalisation rapporte le nombre de salariés syndiqués au nombre total de salariés : il s’établit à 10,3 % en 2019.", "2) L’écart entre secteurs est considérable : 18,4 % dans le secteur public contre 7,8 % dans le privé.", "3) L’écart entre femmes et hommes est plus modeste, 9,5 % contre 11 %, mais reflète la ségrégation professionnelle.", "B. Ce recul succède à une implantation historiquement forte", "1) Le droit de grève est reconnu en 1864 et les syndicats légalisés en 1884, ouvrant un siècle de structuration du mouvement ouvrier.", "2) Les accords Matignon de 1936 — semaine de 40 heures, congés payés, hausse des salaires — attestent d’un rapport de force syndical déterminant.", "3) Syndicats et partis ont longtemps été liés, le PCF jouant un rôle important dans la représentation politique du monde ouvrier.", "C. Le recul de l’adhésion n’équivaut pas à une disparition de l’influence", "1) L’institutionnalisation des conflits a doté les syndicats d’un rôle reconnu de négociation et de représentation.", "2) Le conflit social est ainsi encadré par des procédures — négociation collective, instances représentatives — plutôt que réglé par l’affrontement direct.", "3) Les accords négociés s’appliquent bien au-delà des seuls adhérents, ce qui affaiblit l’incitation individuelle à adhérer.", "II. Trois transformations structurelles expliquent principalement ce recul", "A. La désindustrialisation a dissous les collectifs les plus syndiqués", "1) La grande usine concentrait des travailleurs aux conditions homogènes, ce qui facilitait l’organisation collective.", "2) La baisse de l’emploi industriel et la montée des services ont dispersé ces collectifs dans des unités plus petites.", "3) Le monde ouvrier, structuré entre 1880 et 1910 puis transformé par la rationalisation et l’immigration de 1910 à 1930, n’a pas disparu mais s’est recomposé et fragmenté.", "B. La montée de l’individualisme a affaibli l’adhésion collective", "1) Les parcours professionnels se personnalisent : mobilité, négociation individuelle des rémunérations, carrières discontinues.", "2) L’identification à une condition commune s’affaiblit à mesure que les situations se différencient au sein d’une même entreprise.", "3) Durkheim avait anticipé le risque : privé de groupe professionnel, l’individu est exposé à l’égoïsme comme à l’anomie.", "C. La mondialisation a déplacé le rapport de force", "1) La menace de délocalisation réduit la capacité de négociation des salariés dans les secteurs exposés à la concurrence internationale.", "2) Les chaînes de valeur mondiales dispersent la production entre unités et pays, ce qui rend l’action collective plus difficile à coordonner.", "3) L’ubérisation prolonge ce mouvement en substituant des statuts d’indépendants au salariat, hors du champ traditionnel du syndicalisme.", "III. Ce recul traduit moins un désintérêt pour l’action collective qu’une recomposition de ses formes", "A. La précarisation dissuade l’engagement", "1) Chez les 15-24 ans, seulement 39,8 % des personnes en emploi occupent un CDI selon les données de 2025 mobilisées dans le chapitre.", "2) Un salarié en contrat court, en intérim ou en stage s’engage difficilement dans une organisation dont il ne verra pas les résultats.", "3) La rotation rapide empêche la constitution du collectif de travail sur lequel repose toute syndicalisation.", "B. Les attentes à l’égard du travail restent pourtant collectives", "1) La recherche d’un travail porteur de sens — utilité sociale, fierté, épanouissement — exprime des exigences partagées.", "2) La « grande démission » entre 2020 et 2022 manifeste un rapport de force individuel exercé faute de canal collectif.", "3) De nouvelles formes de mobilisation, souvent extérieures aux organisations établies, prennent le relais de manière discontinue.", "C. L’enjeu rejoint la question de l’intégration par le travail", "1) Castel montre que la société salariale associait au salaire un statut et une appartenance : l’affaiblissement syndical accompagne l’effritement de cet ensemble.", "2) Le groupe professionnel durkheimien devait produire les normes et lutter contre l’anomie : son affaiblissement laisse ce rôle vacant.", "3) Le recul du syndicalisme n’est donc pas seulement organisationnel, il affecte la capacité du travail à intégrer durablement."], "conclusion": "Le recul du syndicalisme français est établi — 10,3 % de syndiqués en 2019, avec un écart marqué entre public et privé — mais il concerne l’adhésion bien plus que l’influence, l’institutionnalisation des conflits ayant maintenu aux syndicats un rôle de négociation. Trois transformations structurelles l’expliquent : la désindustrialisation, qui a dissous les collectifs ouvriers ; l’individualisation des parcours, qui affaiblit l’identification à une condition commune ; la mondialisation et l’ubérisation, qui déplacent le rapport de force et sortent des travailleurs du salariat. Ce recul ne traduit donc pas un désintérêt pour l’action collective, mais la disparition des bases matérielles qui la rendaient évidente — et il laisse vacante la fonction normative que Durkheim confiait au groupe professionnel."}, "ch10-11": {"commentaire": "Sujet en « ou » : il faut refuser l’alternative et montrer que la coopération et le conflit procèdent de la même cause, l’interdépendance. La première partie établit que l’entreprise contraint à coopérer — Durkheim, solidarité organique, nœud de contrats. La deuxième montre que cette coopération est traversée d’intérêts divergents — théorie de l’agence, pouvoir crozérien, conflits de statut. La troisième dépasse l’opposition avec la formule de Crozier : le conflit est la conséquence normale de l’interdépendance, et la coopération elle-même est conflictuelle. Attention à ne pas confondre conflit et dysfonctionnement.", "intro": "Une entreprise ne peut produire sans que des services aux métiers distincts articulent leurs contributions : la production dépend de la maintenance, la maintenance des approvisionnements, le commercial de la production. Cette exigence de coopération est inscrite dans la nature même de l’activité productive. Pourtant, les mêmes entreprises connaissent des grèves, des conflits de rémunération, des rivalités entre services et des désaccords entre dirigeants et actionnaires. Michel Crozier, dans L’Acteur et le système (1977) écrit avec Erhard Friedberg, apporte à ce paradoxe une réponse qui refuse l’alternative : la coopération est obligatoire, mais elle demeure conflictuelle. Le conflit se définira ici comme l’opposition d’acteurs aux intérêts divergents au sein d’un même ensemble.", "problematique": "La coopération et le conflit constituent-ils deux états opposés de l’entreprise, ou deux conséquences simultanées de l’interdépendance qui lie ses membres ?", "plan": ["I. L’entreprise contraint structurellement ses membres à coopérer", "A. La division du travail crée une interdépendance objective", "1) Durkheim montre dans De la division du travail social (1893) que la spécialisation rend chacun indispensable aux autres.", "2) La solidarité organique repose précisément sur cette complémentarité : personne ne peut produire seul le résultat final.", "3) Dans l’atelier de la SEITA, les ouvrières de production ne peuvent travailler sans l’intervention des ouvriers d’entretien.", "B. L’organisation formalise cette coopération", "1) La bureaucratie wébérienne définit les tâches, les rattachements hiérarchiques et les procédures d’articulation entre services.", "2) Les règles impersonnelles règlent par avance une part des interactions, ce qui économise la négociation permanente.", "3) Ronald Coase justifie en 1937 l’existence même de la firme par sa capacité à coordonner à moindre coût que le marché.", "C. La théorie économique de la firme y voit un système de contrats coopératifs", "1) Armen Alchian et Harold Demsetz décrivent la firme comme une production en équipe où le résultat n’est pas décomposable individuellement.", "2) Michael Jensen et William Meckling la définissent comme un nœud de contrats liant actionnaires, dirigeants, salariés et créanciers.", "3) Chaque partie prenante y trouve un intérêt à la poursuite de l’activité commune, ce qui fonde une coopération durable.", "II. Mais cette coopération réunit des acteurs aux intérêts divergents", "A. Les objectifs des parties prenantes ne coïncident pas", "1) La théorie de l’agence montre que le dirigeant, agent, poursuit des objectifs propres — croissance, prestige, sécurité — distincts de ceux de l’actionnaire.", "2) L’asymétrie d’information lui permet d’entretenir cet écart, puisqu’il connaît l’entreprise mieux que ceux qui le contrôlent.", "3) Le partage de la valeur ajoutée entre salaires, dividendes et investissement constitue un arbitrage par nature conflictuel.", "B. Le pouvoir se dispute en permanence dans l’organisation", "1) Chez Crozier, le pouvoir naît de la maîtrise d’une zone d’incertitude et non de la position hiérarchique.", "2) Chaque acteur défend donc la ressource qui fonde son influence : compétence, information, relations ou maîtrise des règles.", "3) Les ouvrières de la SEITA, mécontentes de la qualité des réparations, n’osent pas critiquer ouvertement ceux dont elles dépendent : la coopération y est vécue sous tension.", "C. Les inégalités internes alimentent ces oppositions", "1) Les statuts diffèrent — CDI, CDD, intérim, alternance, stages — et n’offrent pas la même sécurité.", "2) Les écarts de rémunération sont considérables : selon l’INSEE, en équivalent temps plein, un cadre supérieur perçoit environ 4 629 € nets mensuels contre 1 941 € pour un employé, soit un rapport de 2,4.", "3) Ces écarts sont l’objet même de la négociation collective, ce qui fait du conflit une composante ordinaire de la vie de l’entreprise.", "III. Coopération et conflit procèdent en réalité de la même cause", "A. Crozier fait du conflit la conséquence normale de l’interdépendance", "1) Être dans une organisation, c’est devoir coopérer avec des acteurs que l’on n’a pas choisis et dont les intérêts diffèrent.", "2) Le conflit n’est donc pas une pathologie mais la forme que prend la coopération entre acteurs stratégiques.", "3) C’est aussi pourquoi les organisations changent difficilement : toute réforme menace la zone d’incertitude de quelqu’un.", "B. Les dispositifs institutionnels transforment le conflit plutôt qu’ils ne le suppriment", "1) L’institutionnalisation des conflits encadre l’affrontement par la négociation collective et les instances représentatives.", "2) Les grandes avancées sociales en sont issues, des accords Matignon de 1936 à la loi sur les 35 heures en 1998.", "3) Le conflit canalisé devient ainsi producteur de règles, c’est-à-dire de coopération future.", "C. La coopération se construit donc, elle ne se décrète pas", "1) Elton Mayo montre dès 1933, à la Western Electric, que l’écoute et la reconnaissance modifient les comportements davantage que les conditions matérielles.", "2) Crozier s’oppose à Taylor sur ce point : prescrire intégralement les gestes ne produit pas la coopération, car l’acteur conserve des marges de manœuvre.", "3) Morel montre enfin qu’un désaccord exprimé vaut mieux qu’une harmonie de façade, le Groupthink transformant le consensus apparent en risque collectif."], "conclusion": "L’entreprise est un lieu de coopération par construction : la division du travail y crée une interdépendance dont aucun membre ne peut s’affranchir, et l’organisation formalise cette articulation. Mais elle réunit des acteurs aux intérêts divergents — actionnaires et dirigeants, services rivaux, statuts inégaux — dont chacun défend la ressource qui fonde son pouvoir. Il n’y a donc pas à choisir entre les deux termes : comme l’établit Crozier, le conflit est la conséquence normale de l’interdépendance, et la coopération réelle est toujours conflictuelle. Ce qui distingue les organisations n’est pas la présence du conflit, mais leur capacité à l’institutionnaliser au lieu de le nier."}, "ch10-12": {"commentaire": "Sujet de psychologie sociale appliquée aux organisations. Le plan doit être net : le groupe devrait mieux décider ; en pratique il produit des mécanismes d’erreur spécifiques ; ces mécanismes se corrigent par des dispositifs. Asch et Janis doivent être exposés comme des expériences et des concepts, pas comme des noms. La difficulté est d’éviter une conclusion défaitiste : le message de Morel est que le groupe décide mieux à condition d’être organisé pour faire remonter le désaccord. Le lien avec Simon et Kahneman assure la cohérence avec la première partie du chapitre.", "intro": "L’intuition commune veut que plusieurs têtes valent mieux qu’une : un groupe rassemble plus d’informations, plus de compétences et plus de points de vue qu’un individu isolé, et devrait donc décider mieux. C’est sur cette conviction que reposent les comités, les collèges d’experts et les procédures de validation collective. Pourtant, l’explosion de la navette Challenger en 1986 met en cause cette évidence : plusieurs acteurs détenaient des informations permettant d’identifier le danger, et c’est le fonctionnement collectif lui-même qui a empêché ces informations de peser. Christian Morel en tire une formule décisive : une décision absurde est une œuvre collective. Décider mieux signifiera ici parvenir plus souvent à un choix conforme au but effectivement poursuivi.", "problematique": "La délibération collective améliore-t-elle la qualité des décisions, ou engendre-t-elle des mécanismes d’erreur que l’individu seul n’aurait pas produits ?", "plan": ["I. Le groupe dispose en principe de tout ce qui manque à l’individu", "A. Il corrige les limites cognitives individuelles", "1) Herbert Simon a montré que l’individu, faute d’information et de temps, s’arrête à la première solution satisfaisante plutôt qu’optimale.", "2) Daniel Kahneman oppose un système 1 rapide et intuitif, source de biais, à un système 2 lent et contrôlé, coûteux en effort.", "3) Le groupe peut en principe activer le second en obligeant chacun à expliciter et justifier son raisonnement.", "B. Il agrège des informations dispersées", "1) Chaque membre détient une part de l’information pertinente, que nul ne possède intégralement.", "2) La confrontation permet de reconstituer un tableau plus complet de la situation.", "3) Les compétences spécialisées se complètent, selon la logique même de la division du travail.", "C. Les organisations institutionnalisent cette délibération", "1) La bureaucratie wébérienne attribue la décision à des instances collégiales dotées de procédures explicites.", "2) Comités, revues de projet et validations successives sont conçus comme autant de filtres à l’erreur.", "3) La légitimité de la décision s’en trouve renforcée, ce qui facilite son acceptation et sa mise en œuvre.", "II. Mais le collectif engendre des mécanismes d’erreur qui lui sont propres", "A. Le conformisme fait taire le jugement individuel", "1) Le paradigme de Solomon Asch, en 1951, montre qu’un individu se range à l’avis unanime du groupe même lorsque cet avis est manifestement faux.", "2) Le mécanisme est robuste : lorsque plusieurs personnes affirment la même chose, le doute se retourne contre le jugement propre.", "3) Le biais de confirmation prolonge l’effet en conduisant chacun à ne retenir que ce qui conforte la position dominante.", "B. La recherche d’harmonie produit une unanimité illusoire", "1) Irving Janis nomme Groupthink, en 1982, cette tendance des membres d’un groupe à privilégier l’entente sur l’examen critique.", "2) Chacun tait son désaccord pour éviter le conflit, et interprète le silence des autres comme un accord réel.", "3) Le groupe se croit alors unanime alors qu’aucun de ses membres n’était pleinement convaincu.", "C. La hiérarchie ajoute ses propres inhibitions", "1) La crainte de contester l’autorité empêche de formuler une objection devant un supérieur.", "2) La crainte d’insister fait abandonner une alerte pourtant fondée dès qu’elle a été écartée une fois.", "3) L’autocensure liée au sentiment d’incompétence achève le silence : chacun suppose que les autres en savent davantage, comme lors du lancement de Challenger.", "III. Le groupe décide donc mieux, mais seulement s’il est organisé pour cela", "A. La qualité de la décision dépend des dispositifs, non des personnes", "1) Morel propose la hiérarchie restreinte impliquée, qui réduit la distance entre décideurs et opérateurs pour que l’objection remonte.", "2) Le débat contradictoire organisé oblige à formuler l’avis minoritaire au lieu de le laisser s’éteindre.", "3) La décision par consensus évite qu’un vote majoritaire recouvre des doutes que nul n’a exprimés.", "B. Le rapport à l’erreur doit être transformé", "1) Ne pas punir systématiquement les erreurs permet qu’elles soient signalées à temps, donc corrigées.", "2) La check-list, importée de l’aéronautique, supplée la mémoire et rend explicite ce que la routine a rendu invisible.", "3) Ces métarègles ne suppriment pas la hiérarchie : elles en neutralisent les effets inhibiteurs sur l’information.", "C. Ce constat rejoint la leçon d’ensemble du chapitre", "1) Crozier montre que les acteurs conservent toujours des marges de manœuvre, y compris celle de se taire.", "2) Mayo avait établi dès 1933 que l’écoute modifie les comportements plus sûrement que la contrainte technique.", "3) La rationalité collective n’est donc pas une propriété naturelle du groupe, mais un résultat que l’organisation doit produire délibérément."], "conclusion": "Le groupe devrait décider mieux : il agrège des informations dispersées, confronte des compétences et active en principe le raisonnement contrôlé que l’individu isolé économise. Mais Asch, Janis et Morel établissent qu’il produit des mécanismes d’erreur spécifiques — conformisme, illusion d’unanimité, silence hiérarchique — qui transforment des doutes individuels fondés en décision collective absurde, comme l’a montré Challenger. La supériorité du collectif n’est donc pas acquise : elle dépend entièrement des dispositifs qui garantissent l’expression du désaccord. Un groupe bien organisé décide mieux qu’un individu ; un groupe qui recherche l’harmonie décide moins bien que chacun de ses membres pris séparément."}, "ch10-13": {"commentaire": "Sujet de comparaison d’auteurs : le risque est le catalogue. Il faut construire l’opposition (Weber décrit un modèle rationnel, Crozier observe des dysfonctionnements), puis la relativiser en montrant que Weber avait lui-même identifié les dangers — routinisation, groupe bureaucratique, cage d’acier. La troisième partie doit porter sur la différence de statut des deux démarches : l’idéal-type n’est pas une description mais un instrument de comparaison, si bien que l’enquête de Crozier prolonge Weber au lieu de le réfuter. La différence de méthode, abstraction contre enquête de terrain, est un élément d’analyse à part entière.", "intro": "Lire successivement Max Weber et Michel Crozier donne d’abord l’impression d’une contradiction frontale. Le premier fait de la bureaucratie la forme d’organisation la plus rationnelle qu’ait produite la modernité, fondée sur des règles impersonnelles, une hiérarchie explicite et des compétences attachées au poste. Le second, enquêtant à la SEITA et publiant Le Phénomène bureaucratique en 1963, décrit une organisation où les règles engendrent la rigidité, où la rigidité appelle de nouvelles règles, et où le pouvoir réel échappe à l’organigramme. L’opposition paraît totale. Elle suppose pourtant que les deux auteurs fassent la même chose, ce qui n’est pas le cas : l’idéal-type est une construction intellectuelle destinée à être comparée au réel, non une description de ce réel.", "problematique": "Crozier réfute-t-il l’analyse wébérienne de la bureaucratie, ou en prolonge-t-il l’usage en confrontant l’idéal-type à l’observation du terrain ?", "plan": ["I. Les deux analyses semblent effectivement s’opposer terme à terme", "A. Weber présente la bureaucratie comme le sommet de la rationalité organisationnelle", "1) Elle repose sur la division du travail, une hiérarchie clairement définie, des règles impersonnelles et un statut associé au poste.", "2) La séparation entre la personne et sa fonction supprime l’arbitraire et rend la décision prévisible.", "3) Elle relève de la domination légale-rationnelle : on obéit à la règle légitimement établie, non à la personne du chef.", "B. Crozier y observe au contraire un cercle vicieux", "1) Les règles impersonnelles produisent de la rigidité, car elles n’anticipent pas les situations particulières.", "2) Cette rigidité engendre des problèmes de communication et de fonctionnement, auxquels l’organisation répond par de nouvelles règles.", "3) La règle supplémentaire accroît la rigidité initiale : le remède devient la cause, et le processus s’auto-entretient.", "C. Ils divergent aussi sur la localisation du pouvoir", "1) Chez Weber, l’autorité découle du poste occupé dans la hiérarchie légale-rationnelle.", "2) Chez Crozier, elle découle de la maîtrise d’une zone d’incertitude, indépendamment de la position occupée.", "3) À la SEITA, les ouvriers d’entretien, seuls capables de réparer les machines, disposent d’un pouvoir que l’organigramme ne leur reconnaît pas.", "II. Mais Weber avait lui-même identifié les dangers que Crozier observe", "A. Il décrit explicitement les risques de la bureaucratie", "1) Il redoute la routinisation du travail, la rigidité et la multiplication des procédures.", "2) Il craint le refus de l’innovation et la perte d’autonomie des individus soumis à des règles de plus en plus nombreuses.", "3) Il anticipe la formation d’un groupe bureaucratique défendant ses propres intérêts plutôt que la finalité de l’organisation.", "B. La « cage d’acier » formule ce paradoxe", "1) La rationalisation devait réduire l’arbitraire et permettre d’organiser efficacement l’activité.", "2) Elle enferme pourtant les individus dans des règles, des procédures, des hiérarchies et des fonctions spécialisées.", "3) L’outil de libération devient contrainte : c’est exactement le mécanisme que Crozier documente empiriquement.", "C. Les deux auteurs partagent d’ailleurs l’idée d’une rationalité limitée", "1) Weber souligne que la rationalisation des moyens n’entraîne aucune rationalisation des fins.", "2) Crozier reprend explicitement la rationalité limitée de Herbert Simon : l’acteur ne dispose ni de toute l’information ni de toutes les conséquences.", "3) L’acteur crozérien demeure rationnel, mais d’une rationalité stratégique et située, non d’une rationalité optimisatrice.", "III. Leur différence tient surtout au statut et à la méthode de leurs analyses", "A. L’idéal-type n’est pas une description de la réalité", "1) Il s’agit d’une construction intellectuelle abstraite qui accentue certains traits d’un phénomène.", "2) Le mot « idéal » n’a aucun sens normatif : il ne signifie pas souhaitable mais construit par la pensée.", "3) Sa fonction est de fournir un modèle de comparaison : constater un écart entre l’idéal-type et le terrain n’est pas réfuter l’idéal-type, c’est l’utiliser.", "B. Les méthodes des deux auteurs diffèrent radicalement", "1) Weber procède par construction conceptuelle et comparaison historique à grande échelle.", "2) Crozier procède par enquête de terrain, avec observation et entretiens dans une organisation précise.", "3) Cette différence de méthode explique une bonne part de la différence des résultats : l’un dégage un modèle, l’autre décrit des pratiques.", "C. Crozier ajoute néanmoins une dimension absente chez Weber", "1) Il distingue systématiquement le monde formel, saisi par l’organigramme, et le monde informel, saisi par le sociogramme.", "2) Il fait de l’acteur un stratège actif, capable d’utiliser les failles de l’organisation, là où Weber raisonnait sur la règle.", "3) Il se démarque aussi de Williamson et Akerlof : quand ceux-ci cherchent à réduire les asymétries d’information, il observe que les acteurs ont intérêt à les maintenir."], "conclusion": "L’opposition entre Weber et Crozier est réelle dans ses conclusions : le premier décrit un modèle d’organisation rationnelle, le second un cercle vicieux où la règle engendre la rigidité et où le pouvoir échappe à la hiérarchie. Mais elle est moins radicale qu’il n’y paraît, puisque Weber avait lui-même identifié la routinisation, le refus de l’innovation et la cage d’acier. La véritable différence est de méthode et de statut : l’idéal-type wébérien est un instrument de comparaison, et l’enquête de terrain de Crozier en constitue précisément l’usage attendu. Crozier ne réfute donc pas Weber : il lui ajoute l’acteur stratégique et le monde informel, que l’analyse par la règle ne pouvait faire apparaître."}, "ch10-14": {"commentaire": "Sujet le plus théorique du chapitre, qui engage toute la sociologie wébérienne. Il faut définir la rationalisation comme processus — substitution d’explications rationnelles aux explications magiques, extension du calcul à tous les domaines — et non comme simple synonyme d’efficacité. Le devoir doit montrer les gains réels, puis les coûts (désenchantement, cage d’acier), puis poser la distinction décisive entre rationalité en finalité et rationalité en valeur : la rationalisation perfectionne les moyens sans rien dire des fins. Bronner et Morel fournissent les prolongements contemporains.", "intro": "Mesurer, calculer, prévoir, codifier : le mouvement par lequel les sociétés modernes substituent la méthode à la coutume paraît se confondre avec l’idée même de progrès. Max Weber, dans L’Éthique protestante et l’esprit du capitalisme (1905), en fait le trait distinctif de la modernité occidentale et montre qu’il traverse l’économie, le droit, la science et jusqu’aux conduites religieuses. Il en tire pourtant une conclusion ambivalente : ce mouvement produit le désenchantement du monde, c’est-à-dire le recul d’une compréhension magique ou surnaturelle au profit d’explications rationnelles, et il peut enfermer les individus dans une « cage d’acier ». La rationalisation désigne ici l’extension du calcul méthodique des moyens à des domaines toujours plus nombreux de la vie sociale.", "problematique": "L’extension du calcul méthodique constitue-t-elle un progrès pour les sociétés modernes, ou perfectionne-t-elle des moyens sans rien garantir quant aux fins qu’ils servent ?", "plan": ["I. La rationalisation produit des gains incontestables", "A. Elle substitue l’explication à la croyance", "1) Le désenchantement du monde traduit le recul des explications magiques, mystiques ou surnaturelles au profit d’explications scientifiques.", "2) La foudre cesse d’être interprétée comme un signe divin pour devenir un phénomène électrique explicable et prévisible.", "3) Ce qui est explicable devient maîtrisable : la connaissance rationnelle ouvre la voie à l’action technique.", "B. Elle rend l’organisation sociale plus prévisible et plus équitable", "1) La bureaucratie fonde l’autorité sur la règle et non sur la personne, ce qui limite l’arbitraire.", "2) Le recrutement sur compétence et la séparation entre la personne et sa fonction réduisent le favoritisme.", "3) La domination légale-rationnelle remplace ainsi des dominations traditionnelle et charismatique bien plus contingentes.", "C. Elle soutient la croissance économique", "1) Weber relie la rationalisation au développement du capitalisme, qui suppose calcul, comptabilité et prévision.", "2) Le taylorisme puis le fordisme appliquent ce calcul à l’organisation du travail et élèvent fortement la productivité.", "3) Le progrès technique, moteur de la croissance, est lui-même un produit de la démarche scientifique rationalisée.", "II. Mais elle a un coût que Weber désigne lui-même", "A. Elle appauvrit le rapport au monde", "1) Le désenchantement fait perdre aux conduites une part de leur signification symbolique et affective.", "2) Les comportements traditionnels et affectuels, deux des quatre déterminants de l’action, reculent sans disparaître.", "3) Weber admet une limite : la science explique les mécanismes mais ne fournit aucune réponse sur le sens de l’existence.", "B. Elle enferme dans ses propres dispositifs", "1) La « cage d’acier » désigne l’enfermement des individus dans les règles, procédures, hiérarchies et fonctions spécialisées.", "2) La routinisation du travail, la rigidité et le refus de l’innovation en sont les manifestations organisationnelles.", "3) Crozier documente empiriquement ce mécanisme par le cercle vicieux bureaucratique observé à la SEITA.", "C. Elle peut dégrader la condition concrète du travail", "1) Le taylorisme rationalise les gestes en séparant conception et exécution, au prix de l’autonomie de l’exécutant.", "2) Simone Weil, qui fait en 1934 l’expérience de l’usine, y décrit « le lieu du silence, de la contrainte et de la soumission ».", "3) Mayo établit dès 1933 que la seule optimisation technique ne suffit pas, l’attention portée aux personnes pesant davantage que le réglage des conditions matérielles.", "III. La rationalisation perfectionne les moyens sans rien garantir quant aux fins", "A. La distinction entre les deux rationalités est décisive", "1) L’action rationnelle en finalité ajuste méthodiquement les moyens à une fin, sans interroger cette fin.", "2) L’action rationnelle en valeur obéit à une conviction indépendamment de l’efficacité du résultat.", "3) Rationaliser, c’est perfectionner les moyens : la question des fins relève d’un autre ordre, que la neutralité axiologique interdit au sociologue de trancher.", "B. Des organisations parfaitement rationalisées peuvent produire des résultats absurdes", "1) Morel définit la décision absurde comme un choix collectif durable allant contre le but recherché.", "2) Challenger, en 1986, en fournit le cas exemplaire : experts, procédures et données n’ont pas empêché le lancement malgré un risque identifié.", "3) Le conformisme d’Asch et le Groupthink de Janis montrent que la procédure collective peut elle-même produire l’erreur.", "C. Le cas des techniques d’information le confirme aujourd’hui", "1) Bronner montre que des outils extraordinairement efficaces diffusent le faux plus vite que le vrai sur le marché cognitif.", "2) La loi de Brandolini, énoncée en 2013, établit que réfuter une fausse information coûte bien plus que la produire.", "3) La rationalisation des moyens de communication n’a donc pas rationalisé le débat public : elle en a seulement accéléré les mécanismes."], "conclusion": "La rationalisation constitue un progrès réel : elle substitue l’explication scientifique à la croyance, fonde l’autorité sur la règle plutôt que sur la personne et soutient le développement économique. Mais Weber en désigne lui-même le prix — le désenchantement du monde et la cage d’acier — que Crozier, Simone Weil et Mayo documentent chacun à leur manière. La difficulté centrale tient à ce qu’elle porte sur les moyens : l’action rationnelle en finalité perfectionne les instruments sans jamais statuer sur les fins qu’ils servent. Les décisions absurdes analysées par Morel et le fonctionnement du marché cognitif décrit par Bronner le vérifient : une société peut devenir plus méthodique sans devenir plus raisonnable."}, "ch10-15": {"commentaire": "Sujet centré sur Mayo, mais dont le mot clé est « suffisent ». Il ne s’agit donc pas de démontrer que les relations humaines comptent — le chapitre l’établit — mais de mesurer la portée explicative de ce facteur. Le plan attendu est : les facteurs techniques et organisationnels expliquent une part majeure de la productivité ; Mayo établit que le facteur humain en explique une autre, ignorée par Taylor ; mais l’École des relations humaines a été critiquée, notamment par l’effet Hawthorne lui-même et par la faiblesse des échantillons. Les critiques doivent être exposées précisément, elles font la valeur du devoir.", "intro": "Lorsque les chercheurs de la Western Electric Company font varier l’éclairage des ateliers pour en mesurer l’effet sur la productivité, ils attendent une relation simple entre conditions matérielles et rendement. Le résultat les déconcerte : la productivité augmente même lorsque l’éclairage n’est pas amélioré, et parfois lorsqu’il est réduit. Elton Mayo, dans The Human Problems of an Industrial Civilization (1933), en tire une conclusion qui bouleverse la conception taylorienne du travail : les conditions matérielles ne suffisent pas, car les salariés réagissent à l’attention qui leur est portée et au sens qu’ils donnent à leur activité. La productivité se définit ici comme le rapport entre la production obtenue et les facteurs employés pour l’obtenir.", "problematique": "Le facteur humain suffit-il à rendre compte des variations de productivité, ou ne constitue-t-il qu’une dimension parmi d’autres d’un phénomène largement technique et organisationnel ?", "plan": ["I. La productivité s’explique d’abord par des facteurs techniques et organisationnels", "A. L’organisation scientifique du travail a produit des gains considérables", "1) Taylor sépare la conception et l’exécution, prescrit les gestes et chronomètre les temps pour éliminer les temps morts.", "2) Le fordisme y ajoute le travail à la chaîne et la standardisation, ce qui accroît fortement les volumes produits.", "3) Avant Mayo, l’amélioration de la productivité était recherchée par l’organisation technique et les conditions matérielles du travail.", "B. La division du travail élève l’efficacité productive", "1) Adam Smith montre dès 1776 que la spécialisation accroît l’habileté et supprime les temps de passage d’une tâche à l’autre.", "2) Durkheim décrit le même mouvement comme une spécialisation croissante des fonctions dans la société tout entière.", "3) La complémentarité qui en résulte permet des gains que l’addition de travaux isolés n’atteindrait pas.", "C. Le capital et le progrès technique restent déterminants", "1) La mécanisation substitue du capital au travail et augmente la production par heure travaillée.", "2) Le progrès technique améliore la productivité globale des facteurs, au-delà de la seule accumulation.", "3) Les investissements lourds ne sont rentables qu’à partir d’un certain volume, ce qui lie productivité et taille de l’entreprise.", "II. Mais Mayo établit que le facteur humain explique une part que ces analyses ignoraient", "A. L’expérience sur l’éclairage révèle un paradoxe", "1) La question de départ portait sur l’effet des conditions matérielles d’éclairage sur le rendement des ouvrières.", "2) Le résultat est paradoxal : la productivité augmente même lorsque l’éclairage n’est pas amélioré.", "3) Les conditions matérielles ne suffisent donc pas à expliquer les variations observées.", "B. L’expérience de la Test Room confirme et précise ce constat", "1) Un groupe restreint d’ouvrières est observé dans des conditions modifiées, avec un suivi rapproché par les chercheurs.", "2) La productivité progresse indépendamment du sens des modifications apportées aux conditions de travail.", "3) Les entretiens menés ensuite confirment l’importance de l’écoute et du sens donné au travail.", "C. L’École des relations humaines en tire une conception nouvelle de l’entreprise", "1) L’entreprise est un système social et non un simple agencement technique de postes de travail.", "2) Contre Taylor, Mayo soutient que le travailleur n’est pas seulement mû par la rémunération et la contrainte.", "3) L’enjeu devient de concilier les facteurs techniques de production avec les facteurs humains et sociaux.", "III. Les relations humaines ne suffisent pourtant pas, et les travaux de Mayo ont été discutés", "A. L’effet Hawthorne fragilise l’interprétation elle-même", "1) Les ouvrières de la Test Room savaient participer à une expérience et bénéficiaient de l’attention des chercheurs.", "2) L’effet Hawthorne, ou effet d’observation, désigne la modification du comportement des sujets du seul fait d’être observés.", "3) La hausse de productivité pourrait donc provenir en partie du dispositif expérimental et non du facteur étudié.", "B. Les conditions méthodologiques de l’enquête ont été critiquées", "1) Les échantillons expérimentaux étaient de très faible effectif, ce qui limite la portée des conclusions.", "2) La situation observée était particulière, ce qui en réduit la généralisation à d’autres contextes productifs.", "3) L’environnement social extérieur à l’usine a été insuffisamment pris en compte dans l’analyse.", "C. D’autres dimensions du travail restent décisives", "1) Crozier montre que les relations dans l’atelier sont traversées par des rapports de pouvoir, et pas seulement par des besoins de reconnaissance.", "2) Les statuts et les rémunérations pèsent sur l’implication : l’écart entre 4 629 € nets mensuels pour un cadre supérieur et 1 941 € pour un employé, selon l’INSEE en équivalent temps plein, n’est pas sans effet.", "3) La quête contemporaine d’un travail porteur de sens confirme l’intuition de Mayo sans valider pour autant l’idée que la seule qualité des relations expliquerait la productivité."], "conclusion": "La productivité s’explique d’abord par des facteurs techniques et organisationnels — division du travail, mécanisation, progrès technique — dont le taylorisme a tiré des gains considérables. Mayo établit néanmoins, à la Western Electric, que ces facteurs n’expliquent pas tout : l’attention portée aux salariés et le sens qu’ils donnent à leur travail modifient leur comportement indépendamment des conditions matérielles. Mais ses conclusions ont été fragilisées par l’effet Hawthorne, par la faiblesse des échantillons et par le caractère particulier de la situation observée. Les relations humaines constituent donc un facteur explicatif réel et longtemps négligé, sans jamais constituer un facteur suffisant : elles complètent l’analyse technique, elles ne s’y substituent pas."}, "ch10-16": {"commentaire": "Sujet de philosophie sociale appliquée, à traiter avec des concepts sociologiques précis. La liberté doit être entendue comme marge de manœuvre effective, non comme absence de contrainte. Le plan doit montrer : l’organisation contraint massivement (règles, hiérarchie, conformisme) ; l’acteur conserve pourtant des marges de manœuvre réelles (Crozier) ; mais cette liberté est limitée à la fois par la structure et par les limites cognitives de l’acteur (Simon, Kahneman, Bronner). Le sujet doit se conclure sur une liberté relationnelle et située, ce qui est exactement la position de l’analyse stratégique.", "intro": "Entrer dans une organisation, c’est accepter un règlement intérieur, une place dans un organigramme, des horaires, des procédures et un lien de subordination inscrit dans le contrat de travail. Tout semble donc y restreindre la liberté individuelle, et Max Weber va jusqu’à évoquer une « cage d’acier » pour décrire l’enfermement produit par la rationalisation. Michel Crozier, pourtant, tire de son enquête à la SEITA la conclusion inverse : aucun acteur n’est jamais totalement passif, et chacun dispose de marges de manœuvre qu’il utilise stratégiquement. Être libre signifiera ici disposer d’une capacité effective d’action non entièrement déterminée par la position occupée, et non échapper à toute contrainte.", "problematique": "L’organisation réduit-elle l’individu au rôle que lui assigne sa position, ou lui laisse-t-elle une capacité d’action que la structure ne détermine pas entièrement ?", "plan": ["I. L’organisation exerce sur l’individu des contraintes considérables", "A. Le monde formel encadre étroitement les conduites", "1) La bureaucratie wébérienne définit les tâches, les rattachements hiérarchiques et les procédures applicables à chaque situation.", "2) Les règles impersonnelles s’imposent identiquement à tous, indépendamment des préférences individuelles.", "3) Le lien de subordination inscrit dans le contrat de travail donne juridiquement à l’employeur un pouvoir de direction.", "B. La rationalisation peut enfermer dans ses propres dispositifs", "1) La « cage d’acier » désigne l’enfermement dans les règles, procédures, hiérarchies et fonctions spécialisées.", "2) La routinisation du travail et la perte d’autonomie figurent parmi les risques que Weber identifie lui-même.", "3) Le taylorisme pousse cette logique à son terme en prescrivant les gestes et les temps, réduisant l’exécutant à l’application.", "C. Le collectif ajoute une contrainte moins visible mais efficace", "1) Le paradigme de Solomon Asch, en 1951, montre qu’un individu se range à un avis unanime même manifestement faux.", "2) Le Groupthink d’Irving Janis, en 1982, fait taire les désaccords au nom de l’harmonie du groupe.", "3) La crainte de contester l’autorité et l’autocensure liée au sentiment d’incompétence achèvent d’inhiber l’expression individuelle.", "II. Mais l’acteur conserve des marges de manœuvre que l’organisation ne supprime pas", "A. Crozier fait de l’acteur un stratège et non un exécutant", "1) L’individu n’est jamais passif : il interprète les règles, choisit son degré d’implication et utilise les failles du dispositif.", "2) La maîtrise d’une zone d’incertitude lui confère un pouvoir que sa position hiérarchique ne lui donnait pas.", "3) Les ouvriers d’entretien de la SEITA, indispensables en cas de panne, disposent ainsi d’une autonomie réelle face aux chefs d’atelier.", "B. Le monde informel échappe largement au contrôle", "1) L’organigramme décrit la hiérarchie officielle, mais le sociogramme restitue les relations effectives entre acteurs.", "2) Alliances, échanges de services et arrangements locaux se nouent hors de toute prescription.", "3) Mayo avait déjà observé à la Western Electric que les relations informelles pèsent sur les comportements autant que les consignes.", "C. Ces marges expliquent des comportements collectifs observables", "1) La résistance au changement s’explique par la défense des zones d’incertitude que toute réforme menace.", "2) L’application zélée de la règle peut devenir un instrument d’obstruction, ce qui retourne la contrainte en ressource.", "3) La « grande démission » de 2020 à 2022 illustre une liberté de sortie exercée massivement, à défaut de liberté d’aménagement.", "III. Cette liberté demeure cependant située et limitée", "A. Elle est inégalement distribuée", "1) Elle dépend de la rareté de la ressource maîtrisée : une compétence indispensable donne plus de marge qu’une tâche substituable.", "2) Les statuts précaires — CDD, intérim, stages — réduisent fortement la capacité de négociation individuelle.", "3) La liberté dans l’organisation reproduit ainsi les inégalités de position qui la traversent.", "B. Elle est bornée par les limites cognitives de l’acteur", "1) Herbert Simon montre que l’acteur ne dispose ni de toute l’information ni de toutes les conséquences de ses choix.", "2) Crozier reprend explicitement cette rationalité limitée : l’acteur est stratégique sans être omniscient.", "3) Bronner ajoute l’avarice cognitive, rapprochée du système 1 de Kahneman, qui fait préférer les raisonnements rapides et intuitifs.", "C. La liberté y est donc relationnelle plutôt qu’absolue", "1) Être dans une organisation, c’est devoir coopérer, et cette interdépendance borne par principe l’action de chacun.", "2) Le conflit qui en résulte n’est pas une pathologie mais la forme ordinaire de l’ajustement entre libertés concurrentes.", "3) Morel montre enfin que la capacité même de dire non se construit par des dispositifs — débat contradictoire, non-sanction de l’erreur — et non par la seule volonté individuelle."], "conclusion": "L’organisation contraint réellement : règles impersonnelles, hiérarchie, prescription des gestes et pression du groupe restreignent fortement l’initiative individuelle, jusqu’à la cage d’acier décrite par Weber. Mais Crozier établit qu’aucun acteur n’y est jamais passif : la maîtrise d’une zone d’incertitude, le monde informel et l’interprétation des règles ouvrent des marges de manœuvre effectives, y compris au bas de l’organigramme. Cette liberté reste toutefois située : elle dépend de la rareté de la ressource maîtrisée, de la sécurité du statut et des limites cognitives de l’acteur. L’individu n’est donc ni déterminé ni souverain ; il est stratégique, c’est-à-dire libre à l’intérieur de contraintes qu’il contribue lui-même à déplacer."}, "ch10-17": {"commentaire": "Sujet historique et conceptuel : il exige de définir la société salariale comme un ensemble, non comme un simple état du marché du travail. Il faut restituer sa construction historique par les grandes dates du droit social, puis montrer ce que la précarisation défait : sécurité du statut, garantie de revenu, protection contre la pauvreté. La troisième partie doit nuancer : la société salariale n’est pas abolie mais fragmentée, et la désaffiliation frappe inégalement. Les données du chapitre sur les statuts des jeunes et la pauvreté laborieuse sont indispensables.", "intro": "Au terme d’un siècle de conquêtes juridiques — droit de grève reconnu en 1864, syndicats légalisés en 1884, accords Matignon de 1936, création de la Sécurité sociale en 1945 — le salariat avait cessé d’être une simple relation marchande pour devenir un statut. Robert Castel nomme société salariale cet ensemble dans lequel le salaire donne bien davantage qu’un revenu : il confère des droits sociaux et une appartenance à la collectivité. Or, dans Les Métamorphoses de la question sociale (1995), il décrit l’effritement de cette condition sous l’effet du chômage de masse et de la flexibilité. La précarisation désigne le développement de formes d’emploi instables, marquées par des contrats courts, des revenus irréguliers et une incertitude durable sur l’avenir.", "problematique": "La précarisation constitue-t-elle une simple évolution du marché du travail, ou remet-elle en cause l’édifice de droits et de protections que constituait la société salariale ?", "plan": ["I. La société salariale reposait sur un ensemble cohérent de protections", "A. Elle s’est construite par étapes juridiques successives", "1) Le droit de grève est reconnu en 1864 et les syndicats légalisés en 1884, donnant aux salariés des moyens d’action collective.", "2) La loi de 1898 sur les accidents du travail cesse d’imputer l’accident à une faute personnelle du salarié ; le repos hebdomadaire est institué en 1906.", "3) Les accords Matignon de 1936 apportent la semaine de 40 heures, deux semaines de congés payés et une hausse des salaires ; la Sécurité sociale est créée en 1945 et la durée légale abaissée à 35 heures en 1998.", "B. La salarisation a fait du salariat la forme dominante d’emploi", "1) La part des salariés dans la population en emploi a progressé au détriment du travail indépendant — agriculteurs, commerçants, professions libérales.", "2) Cette transformation accompagne le passage d’une économie industrielle à une économie largement tertiarisée.", "3) Le CDI est devenu la norme de référence, à laquelle les autres contrats sont comparés comme des exceptions.", "C. Le salaire y conférait un statut et une appartenance", "1) Castel montre que le salaire s’y accompagne de droits sociaux et d’une inscription dans la collectivité.", "2) Durkheim avait établi que le travail rattache à un groupe professionnel et fournit des normes, luttant contre l’égoïsme et l’anomie.", "3) L’emploi stable garantissait ainsi une intégration durable et non une simple rémunération.", "II. La précarisation défait méthodiquement chacun de ces éléments", "A. La flexibilité fragmente les statuts", "1) L’emploi se diversifie en CDD, intérim, alternance, stages et emploi indépendant, qui n’offrent pas la même sécurité.", "2) Le passage du CDI vers des formes temporaires substitue l’incertitude à la prévisibilité des parcours.", "3) Les jeunes sont les premiers concernés : chez les 15-24 ans, seulement 39,8 % des personnes en emploi sont en CDI d’après les données de 2025 mobilisées dans le chapitre.", "B. L’emploi ne protège plus systématiquement de la pauvreté", "1) La pauvreté laborieuse désigne la situation de personnes qui travaillent mais dont les revenus restent insuffisants.", "2) Elle résulte d’emplois faiblement rémunérés, à temps partiel, irréguliers ou précaires : le temps partiel concerne 26,6 % des femmes contre 9,2 % des hommes.", "3) Florence Aubenas, dans Le Quai de Ouistreham (2010), montre que le permis de conduire devient une condition d’accès à des emplois aux horaires décalés et mal desservis.", "C. Le chômage de masse enclenche la désaffiliation", "1) À partir des années 1970-1980, la perte d’emploi ne produit pas seulement une perte de revenu mais une perte de liens.", "2) Castel nomme désaffiliation ce décrochage cumulatif à l’égard du travail et des réseaux de sociabilité.", "3) La « question sociale » se déplace ainsi du paupérisme ouvrier du XIXᵉ siècle vers la fragilisation de la condition salariale au XXᵉ.", "III. La société salariale n’est pourtant pas abolie, elle est fragmentée", "A. Le socle juridique demeure et continue de protéger la majorité", "1) Le CDI reste la forme dominante de l’emploi salarié pris dans son ensemble.", "2) Protection sociale, assurance chômage et droit du travail continuent de s’appliquer à la très grande majorité des salariés.", "3) La négociation collective, héritée de l’institutionnalisation des conflits, couvre des salariés bien au-delà des seuls syndiqués.", "B. Mais la protection devient inégalement distribuée", "1) Un clivage s’installe entre salariés stables, protégés, et travailleurs en contrats courts, exposés à la rotation.", "2) Les inégalités de statut se cumulent aux inégalités de temps de travail et de salaire, du cadre supérieur à 4 629 € nets mensuels à l’employé à 1 941 € selon l’INSEE.", "3) Le recul syndical, 10,3 % de salariés syndiqués en 2019, affaiblit la capacité collective à défendre les plus exposés.", "C. De nouvelles formes d’emploi échappent au cadre salarial", "1) L’ubérisation développe des statuts d’indépendants qui reproduisent la subordination sans les droits qui l’accompagnaient.", "2) La mondialisation accroît la pression concurrentielle sur les secteurs exposés et limite la négociation salariale.", "3) L’enjeu devient dès lors d’attacher les protections à la personne plutôt qu’au seul contrat de travail."], "conclusion": "La société salariale n’était pas un simple état du marché du travail : elle associait au salaire un statut, des droits et une appartenance, édifiés d’étape en étape depuis 1864. La précarisation en défait successivement les éléments — fragmentation des statuts, pauvreté laborieuse, désaffiliation décrite par Castel — et frappe massivement les jeunes, dont moins de quatre sur dix en emploi occupent un CDI. Elle ne l’abolit pas pour autant : le socle juridique demeure et protège la majorité des salariés. Ce qu’elle produit est plus insidieux qu’un effondrement : une société salariale à deux vitesses, où la protection devient elle-même une inégalité."}, "ch10-18": {"commentaire": "Sujet d’histoire sociale, à traiter avec des repères chronologiques précis. L’erreur serait de confondre le recul de l’emploi industriel avec la disparition d’un groupe social. Il faut donc distinguer trois choses : l’effectif ouvrier, l’identité collective et les conditions de travail. Le chapitre fournit une périodisation explicite — hétérogénéité initiale, 1880-1910, 1910-1930, après 1945, désindustrialisation — qu’il faut utiliser. La conclusion attendue est celle du cours : un monde ouvrier transformé, et non disparu, mais privé des institutions qui portaient sa visibilité.", "intro": "Parler du monde ouvrier au passé est devenu banal : la fermeture des grandes usines, la tertiarisation de l’économie et le recul du vote ouvrier semblent attester la disparition d’un groupe qui avait structuré la société industrielle. Cette lecture confond pourtant trois réalités distinctes : le nombre de personnes occupant des emplois ouvriers, l’existence d’une identité collective organisée, et la persistance de conditions de travail spécifiques. Le chapitre rappelle que ce groupe fut d’abord très hétérogène avant de se constituer comme classe entre 1880 et 1910, puis d’être transformé par la rationalisation et l’immigration entre 1910 et 1930. On entendra par monde ouvrier l’ensemble des travailleurs employés à des tâches manuelles d’exécution, et les formes de vie collective qui s’y rattachent.", "problematique": "La désindustrialisation a-t-elle fait disparaître le monde ouvrier, ou en a-t-elle transformé la composition, les conditions et la visibilité sociale ?", "plan": ["I. Le monde ouvrier s’est constitué historiquement comme un groupe social organisé", "A. Il fut d’abord très hétérogène", "1) Avant 1945, le groupe rassemble des situations disparates, de l’artisan qualifié au manœuvre sans spécialité.", "2) Les origines, les qualifications et les conditions de travail y variaient fortement d’une branche à l’autre.", "3) Il n’existait donc pas d’emblée une conscience commune, mais une juxtaposition de conditions ouvrières.", "B. La période 1880-1910 voit émerger une classe ouvrière moderne", "1) La concentration industrielle rassemble de grands effectifs dans des usines aux conditions homogènes.", "2) La légalisation des syndicats en 1884 donne à cette condition commune une expression organisée.", "3) Le droit social se construit en parallèle : accidents du travail en 1898, repos hebdomadaire en 1906.", "C. La période 1910-1930 la transforme par la rationalisation", "1) La mécanisation et l’organisation scientifique du travail redéfinissent les qualifications et les gestes.", "2) La présence de travailleurs étrangers s’accroît dans les activités les plus pénibles.", "3) Simone Weil, qui fait en 1934 l’expérience de l’usine, la décrit comme « le lieu du silence, de la contrainte et de la soumission », soulignant la pénibilité, la discipline et le manque d’autonomie.", "II. La désindustrialisation a profondément défait cet ensemble", "A. L’emploi industriel a fortement reculé", "1) La désindustrialisation désigne la baisse de la part de l’industrie dans l’emploi et la production.", "2) Les grandes unités qui concentraient les effectifs ont fermé ou réduit leurs activités.", "3) La mondialisation et les délocalisations ont accéléré ce mouvement dans les secteurs exposés à la concurrence internationale.", "B. Les institutions qui portaient l’identité ouvrière se sont affaiblies", "1) Le taux de syndicalisation n’atteint plus que 10,3 % des salariés en 2019, et seulement 7,8 % dans le privé.", "2) Les liens entre syndicats et partis, dont le rôle historique du PCF dans la représentation du monde ouvrier, se sont distendus.", "3) La dispersion des collectifs de travail dans des unités plus petites a rendu l’action collective plus difficile à organiser.", "C. Les conditions de travail se sont diversifiées", "1) La tertiarisation a déplacé une partie des emplois d’exécution vers les services, la logistique et la manutention.", "2) La précarisation y multiplie les statuts : CDD, intérim, sous-traitance, emploi indépendant.", "3) Florence Aubenas, dans Le Quai de Ouistreham (2010), décrit précisément ce travail d’exécution devenu invisible parce qu’il a quitté l’usine.", "III. Le monde ouvrier est transformé, non disparu", "A. Les emplois d’exécution demeurent nombreux", "1) Les tâches manuelles subsistent dans l’industrie résiduelle, le bâtiment, la logistique, le nettoyage et l’agroalimentaire.", "2) La pénibilité, les horaires décalés et la faible autonomie continuent d’y caractériser le travail.", "3) Le chapitre conclut explicitement à un monde ouvrier transformé plutôt qu’à sa disparition.", "B. Ce qui a disparu, c’est surtout la visibilité collective", "1) La dispersion géographique et statutaire empêche la constitution d’un collectif identifiable.", "2) Le recul syndical prive ce groupe du porte-parole qui lui donnait une existence publique.", "3) Durkheim aurait vu dans cet affaiblissement du groupe professionnel une source d’anomie, faute de normes produites collectivement.", "C. Les inégalités qui le caractérisaient se maintiennent", "1) Les écarts de salaire demeurent considérables : un cadre supérieur perçoit environ 2,4 fois le salaire d’un employé selon l’INSEE.", "2) Les statuts précaires exposent davantage aux interruptions d’emploi et à la pauvreté laborieuse.", "3) Castel montre que cette fragilisation enclenche la désaffiliation, prolongeant sous une forme nouvelle la question sociale du XIXᵉ siècle."], "conclusion": "Le monde ouvrier s’est constitué comme groupe organisé entre 1880 et 1910, avant d’être transformé par la rationalisation puis stabilisé par la société salariale. La désindustrialisation, la mondialisation et le recul syndical ont défait cet édifice : les grandes concentrations ont disparu, les collectifs se sont dispersés et l’identité ouvrière a perdu ses porte-parole. Mais les emplois d’exécution subsistent, déplacés vers les services, la logistique et le nettoyage, avec leur pénibilité et leur précarité propres. Ce n’est donc pas le monde ouvrier qui a disparu, mais sa visibilité collective — et cette invisibilité est précisément ce qui rend ses inégalités plus difficiles à contester."}, "ch10-19": {"commentaire": "Sujet quantitatif : il exige des données, et le chapitre en fournit d’exploitables. Il faut distinguer trois familles d’inégalités — statut, temps de travail, salaire — et traiter chacune séparément avant de conclure. Le passage décisif est la décomposition de l’écart salarial femmes-hommes : 23,5 % en masse salariale, 14,9 % à temps de travail égal, environ 4 % toutes choses égales par ailleurs. Cette décomposition doit être expliquée, car elle montre ce que mesure chaque indicateur et ce qui relève proprement de la discrimination. Éviter d’affirmer une tendance générale sans préciser de quelle inégalité on parle.", "intro": "Affirmer que les inégalités au travail se réduisent ou s’accroissent n’a aucun sens tant que l’on n’a pas précisé lesquelles. Le chapitre distingue en effet trois dimensions qui n’évoluent pas ensemble : l’inégalité de statut, qui oppose les salariés stables aux travailleurs en contrats courts ; l’inégalité de temps de travail, qui sépare le temps plein du temps partiel, souvent subi ; l’inégalité de salaire enfin, qui traverse les catégories socioprofessionnelles et les sexes. La décomposition de l’écart salarial entre femmes et hommes l’illustre : de 23,5 % en masse salariale, il tombe à 14,9 % à temps de travail égal, puis à environ 4 % à diplôme, expérience et secteur comparables.", "problematique": "Les inégalités au travail suivent-elles une tendance commune à la réduction, ou faut-il distinguer des dimensions dont certaines se résorbent quand d’autres se creusent ?", "plan": ["I. Certaines inégalités se réduisent sous l’effet des institutions et de la formation", "A. Le droit du travail a égalisé une partie des conditions", "1) La construction du droit social, du repos hebdomadaire en 1906 aux 35 heures en 1998, a uniformisé les durées et les protections.", "2) Les accords Matignon de 1936 puis la création de la Sécurité sociale en 1945 ont étendu à tous des droits auparavant réservés à quelques-uns.", "3) La négociation collective, issue de l’institutionnalisation des conflits, applique ses accords bien au-delà des seuls syndiqués.", "B. L’élévation du niveau de formation a réduit certains écarts", "1) L’allongement de la scolarité a ouvert aux femmes des positions professionnelles longtemps fermées.", "2) L’écart de salaire « toutes choses égales par ailleurs » — à diplôme, expérience et secteur d’activité comparables — se limite à environ 4 %.", "3) Cette part résiduelle, quoique faible en proportion, isole précisément ce qui relève de la discrimination.", "C. Les écarts de participation au marché du travail se sont resserrés", "1) Le taux d’activité féminin a fortement progressé au cours du XXᵉ siècle.", "2) L’écart de syndicalisation entre femmes et hommes reste modeste, 9,5 % contre 11 % des salariés.", "3) La mixité des qualifications a progressé dans un nombre croissant de secteurs.", "II. Mais d’autres inégalités se maintiennent ou s’accroissent", "A. Les inégalités de statut se sont creusées", "1) Tous les travailleurs ne disposent pas de la même sécurité : CDI, CDD, intérim, alternance, stages et emploi indépendant coexistent.", "2) Les jeunes sont les plus exposés : chez les 15-24 ans, seulement 39,8 % des personnes en emploi sont en CDI selon les données de 2025 du chapitre.", "3) La précarisation, en substituant des contrats courts au CDI, transforme la sécurité de l’emploi en privilège inégalement réparti.", "B. Les inégalités de temps de travail restent fortement genrées", "1) Le temps partiel concerne 26,6 % des femmes contre 9,2 % des hommes.", "2) Il touche davantage les employés peu qualifiés et constitue une forme de précarité lorsqu’il est subi.", "3) Ces différences de durée se répercutent directement sur les revenus perçus et sur les droits à la retraite.", "C. Les écarts de salaire demeurent considérables", "1) Selon l’INSEE, en équivalent temps plein, un cadre supérieur perçoit environ 4 629 € nets mensuels contre 1 941 € pour un employé.", "2) Le rapport est donc de l’ordre de 2,4, avant même de tenir compte des écarts de temps de travail.", "3) L’écart de masse salariale entre femmes et hommes atteint environ 23,5 %, et encore 14,9 % à temps de travail égal.", "III. L’analyse exige donc de distinguer ce que mesure chaque indicateur", "A. La décomposition de l’écart salarial est instructive", "1) L’écart de masse salariale, 23,5 %, agrège les différences de durée du travail et de positions professionnelles.", "2) À temps de travail égal, il tombe à 14,9 %, ce qui isole l’effet propre du temps partiel.", "3) Toutes choses égales par ailleurs, il reste environ 4 % associés notamment à la discrimination, c’est-à-dire à un traitement différencié non justifié par les caractéristiques du poste.", "B. Les inégalités se cumulent plutôt qu’elles ne se compensent", "1) Un statut précaire s’accompagne souvent d’un temps partiel subi et d’une faible rémunération.", "2) La pauvreté laborieuse en résulte : l’emploi ne garantit plus de sortir de la pauvreté.", "3) L’enquête de Florence Aubenas dans Le Quai de Ouistreham (2010) montre concrètement ce cumul chez les travailleuses du nettoyage.", "C. L’accès au travail lui-même constitue une inégalité", "1) Le chômage frappe inégalement : 18,7 % chez les 15-24 ans en France contre 7,4 % pour l’ensemble.", "2) La comparaison européenne confirme cet écart générationnel, de 6,6 % contre 3,4 % en Allemagne à 20,3 % contre 6,5 % en Italie.", "3) Castel montre que cette privation d’emploi enclenche la désaffiliation, ce qui ajoute une inégalité de liens à l’inégalité de revenus."], "conclusion": "Les inégalités au travail ne suivent pas une tendance unique. Certaines se sont réduites sous l’effet du droit social et de l’élévation du niveau de formation, au point que l’écart salarial entre femmes et hommes ne dépasse plus environ 4 % à diplôme, expérience et secteur comparables. D’autres se sont au contraire creusées : les inégalités de statut, avec moins de quatre jeunes en emploi sur dix en CDI, et les inégalités de temps de travail, avec 26,6 % de femmes à temps partiel contre 9,2 % des hommes. Ces dimensions se cumulent plutôt qu’elles ne se compensent, produisant la pauvreté laborieuse. Répondre suppose donc de préciser l’indicateur retenu : la moyenne masque ici des évolutions opposées."}, "ch10-20": {"commentaire": "Sujet de synthèse méthodologique, le plus exigeant du chapitre. Il ne s’agit pas de réciter les auteurs mais de montrer ce que l’étude d’un objet apprend sur la discipline elle-même. Trois enseignements structurent le devoir : la sociologie se donne un objet construit et non évident ; elle dispose de méthodes rigoureuses et diverses ; elle est traversée de courants concurrents dont la pluralité est un atout, non une faiblesse. Les notions d’idéal-type, de neutralité axiologique, de fait social, d’enquête de terrain et l’opposition holisme/individualisme méthodologique sont toutes attendues.", "intro": "L’entreprise semble un objet trop familier pour être sociologique : chacun croit savoir ce qui s’y passe, y voyant une structure économique organisée par un organigramme et régie par la recherche du profit. C’est précisément ce caractère d’évidence qui en fait un révélateur de la démarche sociologique, car celle-ci commence par rompre avec les prénotions. Lorsque Michel Crozier enquête à la SEITA, il découvre que le pouvoir réel n’est pas là où l’organigramme le situe ; lorsque Elton Mayo mesure l’effet de l’éclairage à la Western Electric, il obtient l’inverse de ce qu’il attendait. Faire de la sociologie consiste ici à construire un objet, à l’étudier par des méthodes contrôlées et à en rendre compte sans jugement de valeur.", "problematique": "En quoi l’étude sociologique de l’entreprise éclaire-t-elle la manière dont la sociologie construit ses objets, ses méthodes et ses explications ?", "plan": ["I. Elle montre d’abord que la sociologie construit son objet au lieu de le recevoir", "A. La démarche commence par une rupture avec les évidences", "1) Durkheim exige dans Les Règles de la méthode sociologique (1895) que l’on écarte les prénotions et que l’on traite les faits sociaux comme des choses.", "2) L’organigramme est une prénotion : il décrit ce que l’organisation dit d’elle-même, non ce qu’elle fait.", "3) Crozier oppose ainsi l’organigramme, qui restitue le monde formel, au sociogramme, qui restitue les relations effectives.", "B. Les catégories employées sont elles-mêmes construites", "1) Le chômage en fournit la démonstration : sa mesure varie selon les critères du BIT ou les catégories A, B, C, D et E de France Travail.", "2) Le halo du chômage montre que la frontière entre emploi, chômage et inactivité est une convention et non une donnée naturelle.", "3) Compter suppose donc de définir, et définir engage déjà une analyse.", "C. Les résultats contredisent souvent l’attente initiale", "1) Mayo cherchait l’effet de l’éclairage sur la productivité et a trouvé que celle-ci augmentait même sans amélioration.", "2) Crozier cherchait à décrire une hiérarchie et a découvert le pouvoir des ouvriers d’entretien.", "3) Morel cherchait des erreurs individuelles et a trouvé des mécanismes collectifs : la décision absurde est une œuvre collective.", "II. Elle montre ensuite que la sociologie dispose de méthodes rigoureuses et complémentaires", "A. L’idéal-type est un instrument de comparaison", "1) Il s’agit d’une construction intellectuelle abstraite qui accentue certains traits d’un phénomène.", "2) Le mot « idéal » n’a aucun sens normatif : il ne signifie pas souhaitable mais élaboré par la pensée.", "3) La bureaucratie wébérienne et les trois types de domination en sont des exemples : l’écart au réel s’interprète, il ne réfute pas le modèle.", "B. L’enquête de terrain et l’expérimentation produisent d’autres formes de preuve", "1) Crozier procède par observation et entretiens dans une entreprise précise, la SEITA, créée en 1926 et titulaire du monopole du tabac jusqu’en 1976.", "2) Mayo procède par expérimentation contrôlée, avec les expériences sur l’éclairage puis la Test Room.", "3) Les critiques adressées à ces expériences — effet Hawthorne, échantillons trop faibles, situation particulière — font partie de la démarche scientifique elle-même.", "C. La neutralité axiologique encadre l’interprétation", "1) Weber impose au chercheur de distinguer ce qui est de ce qui devrait être, et de ne pas transformer l’analyse en jugement moral.", "2) Dire que la bureaucratie est rationnelle n’est donc pas la recommander, et décrire ses dysfonctionnements n’est pas la condamner.", "3) Cette exigence distingue le sociologue du militant sans lui interdire de traiter d’objets politiquement sensibles.", "III. Elle montre enfin que la sociologie est traversée de courants concurrents", "A. Deux démarches opposées coexistent dès la fondation", "1) Le holisme méthodologique de Durkheim explique les comportements par les structures sociales qui s’imposent aux individus.", "2) L’individualisme méthodologique de Weber part du sens que les individus donnent à leurs actions pour reconstituer les phénomènes collectifs.", "3) Chacune a ses limites : la première risque d’effacer l’acteur, la seconde de sous-estimer les contraintes objectives.", "B. L’entreprise permet précisément de les articuler", "1) Le monde formel — règles, hiérarchie, statuts — constitue une contrainte structurelle réelle.", "2) Le monde informel — stratégies, alliances, zones d’incertitude — ne se comprend qu’en partant des acteurs.", "3) L’acteur crozérien est contraint et stratégique à la fois, sa rationalité étant limitée au sens de Simon.", "C. La pluralité des explications est un atout et non une faiblesse", "1) Weber éclaire la rationalisation, Mayo le facteur humain, Crozier le pouvoir, Morel la décision, Durkheim l’intégration, Bronner la circulation des croyances.", "2) Ces analyses ne se contredisent pas : elles port
