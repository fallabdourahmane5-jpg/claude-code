sion des crises ;</li><li>perte de souveraineté ;</li><li>vulnérabilité géopolitique.</li></ul>\n<h4>Idée</h4>\n<p>Les chaînes de valeur mondiales augmentent l’efficacité productive mais rendent simultanément les économies plus vulnérables aux ruptures d’approvisionnement et aux tensions géopolitiques.</p>\n<h3>Y. Conclusion</h3>\n<p>Le commerce en valeur ajoutée montre que la mondialisation contemporaine ne doit plus être analysée seulement par les quantités exportées ou importées.</p>\n<p>Les chaînes de valeur mondiales ont créé des dépendances beaucoup plus profondes :</p>\n<ul><li>dépendance aux intrants ;</li><li>dépendance technologique ;</li><li>dépendance financière ;</li><li>dépendance aux marchés étrangers ;</li><li>dépendance aux infrastructures de services.</li></ul>\n<p>Ces interdépendances expliquent pourquoi une crise chinoise, une rupture d’approvisionnement ou une hausse des droits de douane peut rapidement produire des effets bien au-delà du pays concerné.</p>\n<h4>Idée</h4>\n<p>La mondialisation productive transforme l’ouverture commerciale en interdépendance structurelle : les chaînes de valeur mondiales permettent des gains d’efficacité considérables, mais elles exposent également les économies à de nouvelles vulnérabilités commerciales, technologiques et financières.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XI. La première mondialisation : origines, ruptures et logiques</h2>\n<p>Comment la première mondialisation se met-elle en place et pourquoi est-elle fragile ?</p>\n<h3>A. Idée générale</h3>\n<p>La première mondialisation montre une chose essentielle :</p>\n<p>👉 l’ouverture internationale n’est jamais irréversible.</p>\n<p>On pourrait penser que les économies s’ouvrent progressivement et de manière continue.</p>\n<p>Mais l’histoire montre au contraire que :</p>\n<ul><li>les échanges peuvent progresser ;</li><li>puis être remis en cause ;</li><li>les tensions géopolitiques peuvent conduire au protectionnisme ;</li><li>et une phase de mondialisation peut déboucher sur une phase de démondialisation.</li></ul>\n<p>La première mondialisation est donc intéressante parce qu’elle permet de comprendre :</p>\n<ul><li>comment les échanges augmentent ;</li><li>comment les économies deviennent interdépendantes ;</li><li>mais aussi comment les tensions internationales peuvent briser cette dynamique.</li></ul>\n<h4>Idée</h4>\n<p>La première mondialisation montre que l’ouverture internationale n’est pas un processus linéaire : elle peut être remise en cause par les tensions géopolitiques, le protectionnisme et la fragmentation du système international.</p>\n<p>Cette idée est fondamentale aujourd’hui, car certaines caractéristiques contemporaines rappellent justement cette première mondialisation.</p>\n<h3>B. Une première leçon : la mondialisation peut être réversible</h3>\n<p>La première mondialisation se développe fortement à la fin du XI Xe siècle.</p>\n<p>Mais elle finit par se briser sous l’effet :</p>\n<ul><li>des rivalités entre puissances ;</li><li>de l’impérialisme ;</li><li>du nationalisme ;</li><li>des tensions géopolitiques ;</li><li>puis de la Première Guerre mondiale.</li></ul>\n<h4>Conséquence</h4>\n<p>Après 1914 :</p>\n<p>→ guerre → protectionnisme → fermeture progressive des économies → démondialisation.</p>\n<h4>Idée importante</h4>\n<p>Cela signifie que :</p>\n<p>👉 une forte intégration économique n’empêche pas les conflits.</p>\n<p>Et même :</p>\n<p>👉 les tensions entre puissances peuvent finir par remettre en cause les échanges.</p>\n<h4>Idée</h4>\n<p>La première mondialisation révèle que l’interdépendance économique n’empêche pas les rivalités géopolitiques et peut être brutalement interrompue par la guerre et le protectionnisme.</p>\n<p>C’est précisément ce précédent historique qui permet d’éclairer certaines évolutions actuelles.</p>\n<h3>C. Un parallèle possible avec la période actuelle</h3>\n<p>Le retour contemporain de politiques commerciales unilatérales et de rivalités entre grandes puissances rappelle certains traits de la première mondialisation, sans pour autant signifier une répétition mécanique de l’histoire.</p>\n<p>Après les deux guerres mondiales, les États vont justement essayer de tirer les leçons de cet échec.</p>\n<h3>D. Après 1945 : reconstruire une mondialisation plus encadrée</h3>\n<p>Après 1945, la reconstruction du commerce international repose sur la volonté d’encadrer l’ouverture par des institutions et des règles multilatérales afin d’éviter le retour des conflits économiques de l’entre-deux-guerres.</p>\n<p>Cette reconstruction conduit progressivement à une nouvelle phase de mondialisation, puis à l’hypermondialisation.</p>\n<h3>E. Des vagues successives de mondialisation</h3>\n<p>On peut distinguer plusieurs grandes phases.</p>\n<h4>1. Première mondialisation</h4>\n<p>👉 environ 1870-1913</p>\n<h4>2. Phase de démondialisation</h4>\n<p>👉 1914 jusqu’à l’après-Seconde Guerre mondiale</p>\n<h4>3. Remondialisation</h4>\n<p>👉 après 1945</p>\n<h4>4. Hypermondialisation</h4>\n<p>👉 surtout années 1980-2008</p>\n<h4>5. Depuis 2008</h4>\n<p>Question centrale :</p>\n<p>👉 stagnation ? ralentissement ? démondialisation ?</p>\n<h4>Problématique moderne</h4>\n<p>Est-ce que la mondialisation est :</p>\n<ul><li>simplement arrivée sur un plateau ;</li></ul>\n<h4>ou engagée dans un véritable mouvement de recul ?</h4>\n<h4>Idée</h4>\n<p>L’histoire de la mondialisation est faite de vagues successives d’ouverture et de fermeture, ce qui interdit de penser la mondialisation comme un processus continu et irréversible.</p>\n<p>Pour comprendre la première mondialisation, il faut d’abord préciser ce qui la distingue des échanges antérieurs.</p>\n<h3>F. La première mondialisation ne correspond pas au début des échanges internationaux</h3>\n<p>Erreur à éviter :</p>\n<p>👉 dire que le commerce international commence au XI Xe siècle.</p>\n<p>C’est faux.</p>\n<p>Les échanges existent depuis :</p>\n<ul><li>l’Antiquité ;</li><li>le Moyen Âge ;</li><li>les grandes découvertes.</li></ul>\n<p>Ce qui change avec la première mondialisation, ce n’est pas l’existence des échanges.</p>\n<p>C’est :</p>\n<p>👉 leur intensité👉 leur géographie👉 leur généralisation👉 leur impact sur les économies.</p>\n<p>Cl</p>\n<p>La première mondialisation ne marque pas la naissance des échanges internationaux, mais une intensification et une transformation profonde de leur ampleur, de leur géographie et de leurs effets économiques.</p>\n<p>Il faut donc revenir rapidement sur les échanges avant 1870.</p>\n<h3>G. Avant 1870 : des réseaux commerciaux anciens</h3>\n<p>Avant le XI Xe siècle, les échanges internationaux s’organisent autour de réseaux régionaux structurés notamment par la Méditerranée, l’océan Indien et les routes terrestres.</p>\n<p>La découverte de l’Amérique va profondément modifier cette géographie.</p>\n<h3>H. 1492 : le basculement vers l’axe atlantique</h3>\n<p>À partir des grandes découvertes, le centre de gravité du commerce international se déplace vers l’Atlantique et renforce progressivement la domination économique européenne.</p>\n<p>Cette montée en puissance s’accompagne d’un commerce particulièrement violent : le commerce triangulaire.</p>\n<p>Le commerce triangulaire illustre une mondialisation ancienne fondée sur des rapports de domination, des migrations forcées et l’exploitation coloniale.</p>\n<p>Cette organisation des échanges correspond à la pensée économique dominante de l’époque : le mercantilisme.</p>\n<h3>I. Avant le libre-échange : la logique mercantiliste</h3>\n<p>Dans la logique mercantiliste, le commerce international est pensé comme une compétition entre nations visant à accumuler les métaux précieux grâce aux excédents commerciaux.</p>\n<p>Mais cette logique ne correspond pas encore au commerce concurrentiel moderne.</p>\n<h3>J. Des échanges encore peu concurrentiels</h3>\n<p>Avant la première mondialisation, beaucoup d’échanges concernent :</p>\n<p>👉 les pays ne produisent pas nécessairement les mêmes biens.</p>\n<p>Résultat :</p>\n<ul><li>concurrence faible ;</li><li>faible convergence des prix ;</li><li>marchés encore segmentés.</li></ul>\n<h4>Idée centrale</h4>\n<p>La grande rupture de la première mondialisation sera précisément :</p>\n<p>👉 l’intégration plus forte des marchés.</p>\n<h4>Idée</h4>\n<p>Avant la première mondialisation, les échanges portent souvent sur des biens complémentaires et non concurrents, ce qui limite la convergence des prix et l’intégration réelle des marchés.</p>\n<p>Le commerce maritime va néanmoins préparer cette transformation grâce à de nombreuses innovations.</p>\n<h3>K. Le commerce international stimule les innovations</h3>\n<h3>L. Innovations technologiques</h3>\n<p>La navigation concentre de nombreux progrès :</p>\n<ul><li>navires ;</li><li>transport maritime ;</li><li>techniques de navigation.</li></ul>\n<h3>M. Innovations financières</h3>\n<p>Les échanges au long cours sont risqués.</p>\n<p>Ils favorisent donc :</p>\n<ul><li>sociétés par actions ;</li><li>assurances ;</li><li>financement du commerce.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’un voyage commercial nécessite :</p>\n<ul><li>beaucoup de capital ;</li><li>partage des risques ;</li><li>assurance contre les pertes.</li></ul>\n<h4>Idée</h4>\n<p>Le développement du commerce maritime stimule à la fois les innovations technologiques et les innovations financières nécessaires au financement et à l’assurance des échanges à longue distance.</p>\n<p>La deuxième moitié du XI Xe siècle marque néanmoins une rupture décisive.</p>\n<h3>N. La première mondialisation devient véritablement significative dans la seconde moitié du</h3>\n<p>Même si sa datation précise fait débat, la première mondialisation devient véritablement significative dans la seconde moitié du XI Xe siècle, généralement autour de 1870.</p>\n<p>Cette phase est largement impulsée par la puissance dominante de l’époque.</p>\n<h3>O. Le Royaume-Uni : leader de la première mondialisation</h3>\n<p>La puissance industrielle britannique pousse le Royaume-Uni à promouvoir l’ouverture commerciale afin d’écouler sa production et de sécuriser l’accès aux matières premières nécessaires à son industrialisation.</p>\n<p>C’est dans ce contexte que la pensée économique évolue.</p>\n<h3>P. Du mercantilisme au libre-échange</h3>\n<p>La première mondialisation accompagne le basculement doctrinal du mercantilisme vers le libre-échange, notamment sous l’influence des économistes classiques Smith et Ricardo.</p>\n<p>Mais il ne faut surtout pas caricaturer cette première mondialisation comme une période entièrement libérale.</p>\n<h3>Q. Une mondialisation encore profondément mercantiliste et impérialiste</h3>\n<p>Même si le libre-échange progresse :</p>\n<ul><li>Libre-échange dans les discours≠ disparition des rapports de puissance.</li></ul>\n<p>Cl</p>\n<p>La première mondialisation est paradoxale : elle se développe sous l’influence du libre-échange tout en restant profondément structurée par l’impérialisme, le colonialisme et les rapports de puissance.</p>\n<p>Cela explique aussi pourquoi cette mondialisation ne bénéficie pas de la même manière à tous les pays.</p>\n<h3>R. Une mondialisation encore très incomplète géographiquement</h3>\n<p>On parle de « mondialisation », mais :</p>\n<p>👉 tous les pays ne participent pas également.</p>\n<p>Les échanges sont concentrés entre :</p>\n<ul><li>pays européens ;</li><li>Royaume-Uni ;</li><li>États-Unis ;</li><li>certaines colonies et périphéries.</li></ul>\n<h4>Deux types d’intégration</h4>\n<h4>1. Intégration volontaire</h4>\n<p>Certains pays choisissent de s’ouvrir.</p>\n<h4>2. Intégration contrainte</h4>\n<p>D’autres pays sont insérés par :</p>\n<ul><li>colonisation ;</li><li>domination politique ;</li><li>impérialisme.</li></ul>\n<h4>Idée</h4>\n<p>La première mondialisation reste géographiquement limitée et asymétrique, car certaines économies s’y insèrent volontairement tandis que d’autres y sont intégrées sous la contrainte coloniale.</p>\n<p>Cette asymétrie contribue à une forte divergence des trajectoires de développement.</p>\n<h3>S. Une divergence croissante entre le Nord et le Sud</h3>\n<p>La première mondialisation contribue à une divergence des niveaux de vie entre les pays industrialisés du Nord et de nombreuses économies périphériques maintenues dans des spécialisations primaires.</p>\n<p>C’est ce qui conduit Pierre-Noël Giraud à insister à la fois sur les émergences et sur les fragmentations.</p>\n<div class=\"db\"><div class=\"dt\">Pierre-Noël Giraud</div><div class=\"dd\">mondialisation = émergence + fragmentation</div></div>\n<p>La mondialisation :</p>\n<p>👉 crée des gagnants.</p>\n<p>Mais aussi :</p>\n<p>👉 crée ou renforce des écarts.</p>\n<p>Donc elle combine :</p>\n<ul><li>émergence ;</li><li>convergence pour certains ;</li><li>fragmentation ;</li><li>divergence pour d’autres.</li></ul>\n<p>Cl</p>\n<p>Pour Pierre-Noël Giraud, les globalisations produisent simultanément des dynamiques d’émergence et de fragmentation, car l’intégration internationale ne profite pas uniformément à tous les territoires.</p>\n<p>La première mondialisation repose enfin sur plusieurs types de flux, et pas uniquement sur les marchandises.</p>\n<h3>T. Une mondialisation multidimensionnelle</h3>\n<p>La première mondialisation ne se limite pas aux marchandises (B et S) : elle repose également sur une circulation très importante des capitaux et des travailleurs.</p>\n<p>Contrairement aux migrations du commerce triangulaire, ces migrations sont davantage volontaires.</p>\n<h3>U. Une différence avec les migrations antérieures</h3>\n<p>La première mondialisation se distingue des migrations forcées de l’époque coloniale par une mobilité internationale du travail largement liée aux opportunités économiques.</p>\n<p>Cette mobilité contribue à rapprocher les économies.</p>\n<h3>V. La première mondialisation produit de l’intégration économique</h3>\n<p>L’intégration signifie :</p>\n<p>👉 les différences entre économies ont tendance à diminuer.</p>\n<h4>Exemple</h4>\n<p>Les écarts de salaires entre :</p>\n<p>👉 Royaume-Uniet👉 États-Unis</p>\n<p>ont tendance à se réduire.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que :</p>\n<ul><li>les travailleurs circulent ;</li><li>les capitaux circulent ;</li><li>les produits circulent ;</li><li>les marchés deviennent plus connectés.</li></ul>\n<h4>Idée</h4>\n<p>La mobilité des biens, des capitaux et du travail favorise une convergence partielle des prix et des salaires entre les économies participant à la première mondialisation.</p>\n<h3>W. Conclusion</h3>\n<p>La première mondialisation marque une rupture majeure dans l’histoire économique, non parce qu’elle invente le commerce international, mais parce qu’elle intensifie brutalement les échanges de biens, de capitaux et de travailleurs.</p>\n<p>Elle est portée par le Royaume-Uni et par la Révolution industrielle, accompagnée par la diffusion du libre-échange chez les économistes classiques.</p>\n<p>Mais elle reste profondément asymétrique :</p>\n<ul><li>impérialisme ;</li><li>colonisation ;</li><li>intégration contrainte de certains pays ;</li><li>divergence croissante des niveaux de vie.</li></ul>\n<p>Surtout, son effondrement à partir de 1914 rappelle une leçon essentielle :</p>\n<p>👉 la mondialisation peut se défaire.</p>\n<h4>Ìdée</h4>\n<p>La première mondialisation illustre le caractère profondément ambivalent de l’ouverture internationale : elle favorise l’intégration des marchés et la mobilité des facteurs, mais repose également sur des rapports de puissance et peut être remise en cause lorsque les tensions géopolitiques l’emportent sur les logiques économiques.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XII. Essor des flux, DIT traditionnelle et domination européenne</h2>\n<p>Comment la première mondialialisation transforme-t-elle quantitativement et qualitativement les échanges ?</p>\n<h3>A. Idée générale</h3>\n<p>La première mondialisation ne se caractérise pas seulement par une augmentation des échanges.</p>\n<p>Elle transforme aussi :</p>\n<ul><li>leur volume ;</li><li>leur composition ;</li><li>leur géographie ;</li><li>les spécialisations des pays ;</li><li>les flux de revenus et de capitaux.</li></ul>\n<p>Deux ruptures apparaissent :</p>\n<ul><li>rupture quantitative → les échanges progressent beaucoup plus vite que la production ;</li><li>rupture qualitative → la composition du commerce change et une division internationale du travail se structure.</li></ul>\n<p>Cl</p>\n<p>La première mondialisation correspond à une intensification spectaculaire des échanges, mais aussi à une transformation de leur composition et de leur géographie, qui organise une division internationale du travail dominée par les puissances européennes.</p>\n<p>Le premier changement est très visible dans les chiffres.</p>\n<h3>B. Une explosion quantitative des échanges internationaux</h3>\n<h3>C. Le commerce progresse beaucoup plus vite que la production</h3>\n<p>Sur l’ensemble du XI Xe siècle jusqu’en 1913 :</p>\n<ul><li>le commerce international par tête est multiplié par environ 25 ;</li><li>alors que le niveau de vie moyen n’est multiplié qu’environ par 2.</li></ul>\n<h4>Interprétation</h4>\n<p>Les échanges augmentent donc beaucoup plus vite que la production.</p>\n<p>Or :</p>\n<p>👉 quand les échanges progressent plus vite que le PIB, le taux d’ouverture augmente.</p>\n<h4>Idée</h4>\n<p>Au XI Xe siècle, la croissance du commerce international dépasse très largement celle de la production, ce qui traduit une ouverture croissante des économies.</p>\n<p>Cette accélération apparaît directement dans l’évolution du taux d’ouverture mondial.</p>\n<h3>D. Le taux d’ouverture mondial fait plus que tripler</h3>\n<p>En 1840 :</p>\n<p>👉 les exportations représentent environ 4,6 % du PIB mondial.</p>\n<p>En 1913 :</p>\n<p>👉 elles représentent près de 15 % du PIB mondial.</p>\n<h4>Idée</h4>\n<p>Entre 1840 et 1913, le taux d’ouverture mondial passe d’environ 5 % à près de 15 %, ce qui montre l’ampleur exceptionnelle de la première mondialisation commerciale.</p>\n<p>Cette ouverture n’est toutefois pas identique dans tous les pays.</p>\n<h3>E. Une ouverture surtout portée par les pays européens</h3>\n<h3>F. Royaume-Uni et France : forte hausse de l’ouverture</h3>\n<p>Pendant cette période :</p>\n<ul><li>le taux d’ouverture britannique augmente fortement ;</li><li>le taux d’ouverture français augmente également.</li></ul>\n<p>Dans les deux cas :</p>\n<p>👉 il double approximativement.</p>\n<h4>Idée centrale</h4>\n<p>Les pays européens sont les véritables moteurs de cette première mondialisation.</p>\n<h3>G. Les États-Unis restent relativement moins ouverts</h3>\n<p>La première mondialisation est avant tout portée par les économies européennes, tandis que les États-Unis restent relativement moins dépendants des échanges extérieurs grâce à l’ampleur de leur marché intérieur qui est important mais aussi une production relativement diversifiée</p>\n<p>Mais l’essor des échanges n’est pas seulement quantitatif : la nature des biens échangés évolue également.</p>\n<h3>H. Une transformation qualitative du commerce international</h3>\n<p>Malgré l’industrialisation, les produits primaires restent majoritaires dans le commerce mondial de la première mondialisation, représentant environ 60 % des échanges.</p>\n<p>Mais les biens manufacturés prennent progressivement une place croissante.</p>\n<h3>I. La montée des produits manufacturés</h3>\n<p>La progression des exportations manufacturières reflète directement l’industrialisation des économies européennes et l’évolution des secteurs moteurs des révolutions industrielles.</p>\n<p>Pour produire ces biens manufacturés, les pays européens importent massivement des produits primaires.</p>\n<h3>J. L’Europe importe des matières premières et exporte des biens manufacturés</h3>\n<h3>K. Composition des importations européennes</h3>\n<p>L’Europe industrielle importe massivement des produits primaires et réexporte des biens manufacturés, ce qui la place au cœur de la transformation productive mondiale.</p>\n<p>Cette organisation correspond à ce qu’on appelle la division internationale du travail traditionnelle.</p>\n<h3>L. La mise en place de la DIT traditionnelle</h3>\n<p>La première mondialisation met en place une DIT traditionnelle dans laquelle les pays industrialisés exportent des biens manufacturés tandis que les pays périphériques fournissent les matières premières nécessaires à leur production.</p>\n<p>Cette spécialisation structure profondément les filières productives européennes.</p>\n<h3>M. Les filières productives s’organisent pour l’exportation</h3>\n<h3>N. L’exemple britannique</h3>\n<p>Au Royaume-Uni, l’industrie n’est pas organisée uniquement pour satisfaire :</p>\n<p>👉 la demande intérieure.</p>\n<p>Elle est aussi organisée pour :</p>\n<p>👉 exporter massivement.</p>\n<h4>Exemple : industrie textile</h4>\n<p>Dès le début du XI Xe siècle :</p>\n<ul><li>les chemins de fer relient les centres industriels aux ports ;</li><li>les infrastructures sont pensées pour faciliter les exportations.</li></ul>\n<p>Vers les années 1870 :</p>\n<p>👉 environ 2/3 de la production textile britannique est exportée.</p>\n<h4>Idée</h4>\n<p>L’industrialisation britannique est profondément extravertie : une part croissante des infrastructures et de la production est organisée pour répondre à la demande mondiale.</p>\n<p>Cette orientation vers l’exportation renforce ensuite la compétitivité britannique.</p>\n<h3>O. Exporter permet au Royaume-Uni de bénéficier d’économies d’échelle</h3>\n<p>L’accès au marché mondial permet à l’industrie britannique de produire à grande échelle, de réduire ses coûts unitaires et de consolider sa compétitivité-prix. → économie d’échelle</p>\n<p>La France adopte une stratégie différente.</p>\n<h3>P. Royaume-Uni et France : deux spécialisations textiles différentes</h3>\n<p>Dès la première mondialisation, le Royaume-Uni privilégie une compétitivité-prix fondée sur les volumes et les économies d’échelle, tandis que la France s’oriente davantage vers une spécialisation qualitative et haut de gamme.</p>\n<p>Cette organisation productive renforce la domination des puissances industrialisées sur le commerce mondial.</p>\n<h3>Q. Une domination écrasante de l’Europe et de l’Amérique du Nord</h3>\n<p>À la veille de 1914, les économies industrialisées occidentales concentrent l’essentiel du commerce mondial de produits manufacturés (84%), ce qui traduit une forte polarisation de la puissance productive.</p>\n<p>Au sein de cet ensemble, l’Europe reste cependant le véritable centre du commerce mondial.</p>\n<h3>R. L’Europe domine la première mondialisation</h3>\n<p>En 1913, l’Europe ne représente qu’environ 15 % de la population mondiale mais réalise près de 40 % de la production industrielle et 60 % des exportations mondiales, ce qui traduit sa domination exceptionnelle sur l’économie mondiale.</p>\n<p>Cette domination commerciale européenne produit pourtant un résultat apparemment paradoxal : l’Europe présente un déficit commercial.</p>\n<h3>S. Le paradoxe européen : une balance commerciale déficitaire</h3>\n<p>Malgré sa domination industrielle, l’Europe présente un déficit commercial car la valeur de ses importations massives de produits primaires dépasse son excédent sur les biens manufacturés.</p>\n<p>Mais déficit commercial ne signifie pas nécessairement déficit courant.</p>\n<h3>T. Il faut distinguer balance commerciale et balance courante</h3>\n<p>Le déficit commercial européen ne doit pas être confondu avec son solde courant, car les excédents de services et surtout de revenus compensent largement le déficit sur les biens.</p>\n<p>C’est exactement ce qui se passe pendant la première mondialisation.</p>\n<h3>U. L’Europe présente une balance courante excédentaire</h3>\n<h3>V. Les services sont excédentaires</h3>\n<p>La domination commerciale britannique s’accompagne d’une spécialisation précoce dans les services financiers, bancaires, assurantiels et informationnels. → services a forte VA</p>\n<p>Mais le principal facteur d’excédent vient des revenus du capital.</p>\n<h3>W. Les revenus du capital compensent le déficit commercial</h3>\n<p>Les investissements européens à l’étranger génèrent d’importants revenus du capital qui compensent le déficit commercial et permettent à l’Europe de conserver une balance courante excédentaire.</p>\n<p>Cette situation mène directement à une sortie nette de capitaux.</p>\n<div class=\"db\"><div class=\"dt\">Excédent courant</div><div class=\"dd\">capacité de financement = sortie de capitaux</div></div>\n<p>L’excédent courant européen transforme l’Europe en créancier du reste du monde et alimente une première mondialisation financière fondée sur d’importantes exportations</p>\n<p>de capitaux.</p>\n<h3>X. Conclusion</h3>\n<p>La première mondialisation marque un changement d’échelle majeur dans l’histoire du commerce international.</p>\n<p>Les flux progressent beaucoup plus vite que la production, tandis qu’une véritable division internationale du travail se met en place :</p>\n<ul><li>l’Europe industrialisée importe les matières premières ;</li><li>elle les transforme ;</li><li>elle exporte les produits manufacturés.</li></ul>\n<p>Cette spécialisation renforce la puissance du Royaume-Uni et plus largement de l’Europe, qui domine largement la production industrielle et les exportations mondiales.</p>\n<p>Mais cette domination ne se traduit pas par un excédent commercial : l’Europe importe énormément de produits primaires. Son excédent courant repose surtout sur les services et sur les revenus de ses investissements extérieurs.</p>\n<p>Cl</p>\n<p>La première mondialisation organise ainsi une économie mondiale structurée autour d’un centre européen industrialisé, exportateur de biens manufacturés et de capitaux, et de périphéries largement spécialisées dans la fourniture de matières premières.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XIII. Les migrations internationales pendant la première mondialisation</h2>\n<p>En quoi les migrations internationales participent-elles à l’intégration économique pendant la première mondialisation ?</p>\n<h3>A. Idée générale</h3>\n<p>La première mondialisation ne concerne pas seulement les marchandises et les capitaux.</p>\n<p>Elle se caractérise aussi par :</p>\n<p>👉 une mobilité internationale massive du facteur travail.</p>\n<p>Entre 1872 et 1914 :</p>\n<p>👉 environ 50 millions d’Européens émigrent.</p>\n<p>Et, à l’échelle mondiale :</p>\n<p>👉 plus de 6 % de la population mondiale est concernée par une migration internationale.</p>\n<p>C’est extrêmement élevé.</p>\n<h4>Idée centrale</h4>\n<p>Ces migrations contribuent à rapprocher les marchés du travail entre l’Europe et les pays neufs.</p>\n<p>Cl</p>\n<p>La première mondialisation repose sur une mobilité exceptionnelle du facteur travail, qui contribue à rapprocher les conditions de rémunération entre les pays de départ et les pays d’accueil.</p>\n<p>Ces migrations sont d’abord caractérisées par leur ampleur.</p>\n<h3>B. Des flux migratoires massifs</h3>\n<p>Entre 1872 et 1914, près de 50 millions d’Européens émigrent, principalement vers les pays neufs, et en particulier vers les États-Unis (2/3).</p>\n<p>La particularité de cette période tient aussi à la nature de ces migrations.</p>\n<h3>C. Des migrations principalement libres</h3>\n<p>Les migrations de la première mondialisation sont largement volontaires au sens où elles ne relèvent plus de la contrainte servile (esclavage, déportation…), même si elles sont souvent provoquées par la pauvreté et la recherche de meilleures conditions économiques.</p>\n<p>Tous les pays européens ne jouent cependant pas le même rôle dans ces mouvements migratoires.</p>\n<h3>D. Une exception française : la France est déjà un pays d’immigration</h3>\n<h3>E. La plupart des pays européens sont des pays d’émigration</h3>\n<p>Exemples :</p>\n<ul><li>Italie ;</li><li>Irlande ;</li><li>Allemagne ;</li><li>Royaume-Uni.</li></ul>\n<p>Ils connaissent :</p>\n<p>👉 d’importantes sorties de population.</p>\n<h3>F. La France suit une trajectoire différente</h3>\n<p>À l’inverse :</p>\n<p>👉 la France n’est pas un grand pays d’émigration.</p>\n<p>Elle est déjà :</p>\n<p>👉 un pays d’immigration.</p>\n<p>À la fin du XI Xe siècle :</p>\n<p>👉 environ 8 % des ouvriers en France sont étrangers.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que la France réalise sa transition démographique :</p>\n<p>👉 plus tôt que les autres pays européens.</p>\n<p>Résultat :</p>\n<ul><li>natalité plus faible ;</li><li>croissance démographique ralentie ;</li><li>crainte d’un déclin démographique ;</li><li>manque relatif de main-d’œuvre.</li></ul>\n<p>L’immigration vient donc :</p>\n<p>👉 combler ce déficit démographique et de travail.</p>\n<h4>Idée</h4>\n<div class=\"db\"><div class=\"dt\">La France constitue une exception européenne</div><div class=\"dd\">sa transition démographique précoce ralentit la croissance de sa population et en fait dès la fin du XI Xe siècle un pays d’immigration.</div></div>\n<p>Pour comprendre ces migrations massives, il faut regarder les écarts démographiques et économiques entre l’Europe et les pays neufs.</p>\n<h3>G. Pourquoi les Européens émigrent-ils ?</h3>\n<h3>H. Une Europe relativement surpeuplée</h3>\n<p>Les migrations européennes s’expliquent en partie par un fort contraste démographique entre une Europe densément peuplée et des pays neufs caractérisés par une pénurie relative de main-d’œuvre.</p>\n<p>À ce facteur démographique s’ajoute la situation sociale des ouvriers européens.</p>\n<h3>I. La paupérisation ouvrière pousse à l’émigration</h3>\n<p>La première révolution industrielle améliore la production, mais elle s’accompagne aussi de :</p>\n<ul><li>conditions de travail difficiles ;</li><li>bas salaires ;</li><li>pauvreté ouvrière ;</li><li>revenus proches du salaire de subsistance.</li></ul>\n<h4>Donc</h4>\n<p>Europe :</p>\n<p>👉 travail abondant → salaires faibles.</p>\n<p>Pays neufs :</p>\n<p>👉 travail rare → salaires plus élevés.</p>\n<h4>Idée centrale</h4>\n<p>Les migrants suivent donc :</p>\n<p>👉 les écarts de rémunération.</p>\n<h4>Idée</h4>\n<p>La faiblesse des salaires et les mauvaises conditions de vie des ouvriers européens incitent à l’émigration vers les pays neufs où la rareté du travail permet des rémunérations plus élevées.</p>\n<p>Les États-Unis apparaissent alors comme un véritable Eldorado.</p>\n<h3>J. Les pays neufs attirent parce que le travail y est rare</h3>\n<p>Au milieu du XI Xe siècle, notamment aux États-Unis :</p>\n<p>👉 la main-d’œuvre est relativement rare.</p>\n<p>Donc :</p>\n<p>👉 son prix est élevé.</p>\n<p>Autrement dit :</p>\n<p>👉 les salaires sont plus élevés qu’en Europe.</p>\n<p>Les migrants européens recherchent donc :</p>\n<ul><li>emplois ;</li><li>terres ;</li><li>salaires plus élevés ;</li><li>perspectives d’ascension sociale.</li></ul>\n<h4>Idée</h4>\n<p>Les pays neufs attirent les migrants européens parce que la rareté relative de la main-d’œuvre y pousse les salaires à un niveau supérieur à celui observé en Europe.</p>\n<p>Mais ces migrations ne modifient pas seulement la population : elles transforment aussi les marchés du travail.</p>\n<h3>K. Les migrations entraînent une convergence des salaires</h3>\n<p>La mobilité internationale du travail rapproche les rémunérations entre les pays : l’émigration réduit l’offre de travail dans les pays de départ tandis que l’immigration l’augmente dans les pays d’accueil.</p>\n<p>Les données confirment cette convergence.</p>\n<h3>L. Une forte réduction des écarts de salaire</h3>\n<p>Dans le dernier quart du XI Xe siècle, les écarts de salaires ouvriers entre pays industrialisés diminuent presque de moitié, ce qui illustre l’intégration croissante des marchés du travail.</p>\n<p>La première mondialisation ne crée donc pas seulement une convergence des prix des biens : elle provoque aussi une convergence partielle du prix des facteurs.</p>\n<h3>M. Un exemple concret d’intégration économique</h3>\n<p>La mondialisation signifie :</p>\n<p>👉 multiplication des flux → interdépendance → intégration.</p>\n<p>Ici, ce n’est pas le prix d’un bien qui converge.</p>\n<p><strong>C’est</strong> :</p>\n<p>👉 le prix du travail, c’est-à-dire le salaire.</p>\n<h4>Idée essentielle</h4>\n<p>Plus le travail est mobile :</p>\n<p>→ moins les différences de salaires peuvent rester fortes.</p>\n<h4>Idée</h4>\n<p>La convergence salariale constitue une manifestation directe de l’intégration économique : la mobilité du facteur travail réduit les écarts de rémunération entre les territoires.</p>\n<h3>N. Conclusion</h3>\n<p>Les migrations internationales constituent une dimension fondamentale de la première mondialisation.</p>\n<p>Elles sont massives, principalement européennes, et orientées vers les pays neufs, surtout les États-Unis.</p>\n<p>Elles répondent à un déséquilibre simple :</p>\n<ul><li>abondance du travail en Europe ;</li><li>rareté du travail dans les pays neufs.</li></ul>\n<p>La mobilité du facteur travail contribue alors à réduire cet écart :</p>\n<ul><li>les salaires remontent dans les pays de départ ;</li><li>ils subissent une pression à la baisse dans les pays d’accueil.</li></ul>\n<h4>Idée</h4>\n<p>Les migrations internationales de la première mondialisation participent directement à l’intégration économique mondiale en permettant une meilleure allocation du facteur travail et en entraînant une convergence partielle des rémunérations entre l’Europe et les pays neufs.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XIV. La première mondialisation financière</h2>\n<p>Comment les échanges de capitaux participent-ils à la première mondialisation ?</p>\n<h3>A. Les trois grandes formes de mouvements de capitaux</h3>\n<p>Les mouvements internationaux de capitaux peuvent prendre la forme d’IDE productifs, d’investissements de portefeuille ou de prêts.</p>\n<p>Pendant la première mondialisation, ces formes n’ont pas le même poids.</p>\n<h3>B. Les investissements de portefeuille dominent largement</h3>\n<p>Selon Béraud :</p>\n<div class=\"alertb\"><p>👉 les investissements de portefeuille représentent environ 80 à 90 % des mouvements de capitaux.</p></div>\n<p>Les IDE représentent donc seulement :</p>\n<p>👉 environ 10 à 20 %.</p>\n<p>Cl</p>\n<p>La première mondialisation financière est donc surtout :</p>\n<p>👉 une mondialisation de placements et de prêts.</p>\n<p>Et beaucoup moins :</p>\n<p>👉 une mondialisation de l’implantation productive internationale.</p>\n<h4>Idée</h4>\n<p>Selon Béraud, 80 à 90 % des mouvements de capitaux de la première mondialisation correspondent à des investissements de portefeuille, tandis que les IDE n’en représentent qu’une faible part.</p>\n<p>Cela ne signifie toutefois pas que les IDE soient inexistants.</p>\n<h3>C. Les premières firmes multinationales apparaissent</h3>\n<p>Au XI Xe siècle, on voit apparaître :</p>\n<p>👉 les premières firmes multinationales.</p>\n<p>Elles réalisent des IDE pour deux grandes raisons.</p>\n<h3>D. Première logique d’IDE : se rapprocher des matières premières</h3>\n<h4>Une logique d’approvisionnement</h4>\n<p>Certaines entreprises s’implantent à l’étranger pour :</p>\n<p>👉 accéder directement aux ressources.</p>\n<h4>Exemples</h4>\n<ul><li>entreprises pétrolières américaines au Venezuela ;</li><li>entreprises agricoles et agroalimentaires en Amérique latine.</li></ul>\n<h4>Mécanisme</h4>\n<p>Besoin de matières premières → implantation au plus près de la ressource → IDE.</p>\n<h4>Idée</h4>\n<p>Les premiers IDE répondent principalement à une logique d’approvisionnement : les firmes s’implantent à l’étranger afin de se rapprocher des matières premières nécessaires à leur production.</p>\n<p>Mais une seconde logique existe aussi : la conquête de nouveaux marchés.</p>\n<h4>Deuxième logique d’IDE : contourner l’étroitesse du marché intérieur</h4>\n<p>Pour les firmes issues de petits marchés nationaux, l’internationalisation permet de dépasser l’étroitesse de la demande intérieure et d’accéder à des débouchés plus vastes.</p>\n<p>Cette transformation est analysée par Richard Baldwin à travers le concept de « dégroupage ».</p>\n<h3>E. Baldwin : le premier dégroupage</h3>\n<p>L’idée :</p>\n<ul><li>Avant, production et consommation devaient être relativement proches.</li></ul>\n<p>Avec la baisse des coûts de transport :</p>\n<div class=\"alertb\"><p>👉 une usine peut produire dans un payset👉 les consommateurs peuvent se trouver dans un autre.</p></div>\n<h4>Donc</h4>\n<p>Production et consommation deviennent géographiquement dissociées.</p>\n<h4>Idée</h4>\n<p>Pour Baldwin, la première mondialisation correspond à un premier dégroupage entre le lieu de production et le lieu de consommation, rendu possible par la baisse des coûts de transport.</p>\n<p>Cette notion est importante car elle permet de distinguer la première mondialisation de l’hypermondialisation.</p>\n<h3>F. Premier dégroupage vs deuxième dégroupage</h3>\n<h3>G. Deuxième dégroupage</h3>\n<p>Période :</p>\n<p>👉 hypermondialisation.</p>\n<p>Ce qui se sépare :</p>\n<p>👉 conception / assemblage.</p>\n<p>Exemple :</p>\n<p>👉 conçu en Californie👉 assemblé en Chine.</p>\n<p>Ce qu’on échange davantage :</p>\n<p>👉 des biens intermédiaires.</p>\n<p>Baldwin parle alors :</p>\n<p>👉 d’un « commerce de tâches ».</p>\n<h4>Idée</h4>\n<p>Le premier dégroupage sépare le lieu de production du lieu de consommation, tandis que le second dégroupage sépare les différentes étapes du processus productif lui-même.</p>\n<p>Mais malgré l’apparition des FMN, les placements financiers restent la forme dominante de circulation des capitaux.</p>\n<h3>H. Une nouvelle manière d’utiliser l’épargne</h3>\n<p>Avant la première mondialisation financière, l’épargne est largement orientée vers le foncier et l’immobilier, ce qui limite son rôle dans le financement productif.</p>\n<p>Le développement des marchés financiers internationaux change complètement cette situation.</p>\n<h3>I. Les marchés financiers internationaux ouvrent de nouvelles possibilités de placement</h3>\n<p>Dans la seconde moitié du XI Xe siècle :</p>\n<p>👉 les premiers véritables marchés financiers internationaux se développent.</p>\n<p>Les épargnants peuvent désormais :</p>\n<ul><li>acheter des actions étrangères ;</li><li>acheter des obligations étrangères ;</li><li>financer des entreprises étrangères ;</li><li>prêter à des États étrangers ;</li><li>financer des infrastructures dans d’autres pays.</li></ul>\n<h4>Idée centrale</h4>\n<p>L’épargne peut aller :</p>\n<p>👉 là où le rendement est le plus élevé.</p>\n<h4>Idée</h4>\n<p>La première mondialisation financière permet à l’épargne de dépasser les frontières nationales et de se diriger vers les placements offrant les rendements les plus attractifs.</p>\n<p>La Grande-Bretagne devient l’exemple majeur de cette internationalisation de l’épargne.</p>\n<h3>J. Les Britanniques placent une part massive de leur épargne à l’étranger</h3>\n<p>À la fin du XI Xe siècle, près de la moitié de l’épargne britannique est investie à l’étranger, illustrant l’ampleur exceptionnelle de la première mondialisation financière.</p>\n<p>Ces capitaux servent notamment à financer l’industrialisation et les infrastructures des pays neufs.</p>\n<h3>K. Les capitaux européens financent le développement des pays neufs</h3>\n<p>Les capitaux français et britanniques permettent notamment de financer :</p>\n<ul><li>chemins de fer ;</li><li>ports ;</li><li>mines ;</li><li>infrastructures ;</li><li>activités extractives.</li></ul>\n<h4>Exemples</h4>\n<p>États-Unis :</p>\n<p>👉 construction des chemins de fer.</p>\n<p>Argentine :</p>\n<p>👉 infrastructures ferroviaires et portuaires.</p>\n<p>Colonies :</p>\n<p>👉 infrastructures facilitant l’extraction des ressources.</p>\n<h4>Idée importante</h4>\n<p>Ces investissements ne sont pas neutres.</p>\n<p>Ils servent aussi :</p>\n<p>👉 les intérêts commerciaux des puissances européennes.</p>\n<h4>Idée</h4>\n<p>Les capitaux européens financent les infrastructures nécessaires au développement des pays neufs, mais aussi celles qui permettent l’exploitation et l’exportation de leurs ressources.</p>\n<ul><li>Pourquoi la France et le Royaume-Uni sont-ils capables de financer autant le reste du monde ?</li><li>Pourquoi la France et le Royaume-Uni deviennent-ils les grands créanciers du monde ?</li><li>Une industrialisation précoce</li></ul>\n<p>France et Royaume-Uni :</p>\n<p>👉 entrent tôt dans la révolution industrielle.</p>\n<p>Donc ils disposent déjà :</p>\n<ul><li>d’infrastructures développées ;</li><li>d’un appareil productif avancé ;</li><li>de chemins de fer déjà largement financés.</li></ul>\n<h4>Conséquence</h4>\n<p>Ils peuvent :</p>\n<p>👉 faire sortir une partie de leur épargne pour financer le reste du monde.</p>\n<h4>Idée</h4>\n<p>Leur avance industrielle permet à la France et au Royaume-Uni de dégager une épargne disponible pour financer des investissements extérieurs.</p>\n<p>À cette avance productive s’ajoute une forte concentration des revenus.</p>\n<h3>L. Les inégalités génèrent une forte capacité d’épargne</h3>\n<p>La première mondialisation est aussi une période :</p>\n<p>👉 de fortes inégalités.</p>\n<p>Or les ménages les plus riches :</p>\n<p>👉 épargnent davantage.</p>\n<p>Donc :</p>\n<ul><li>inégalités élevées → épargne concentrée → capacité de financement ↑.</li></ul>\n<h4>Idée importante</h4>\n<p>C’est un effet paradoxal :</p>\n<div class=\"alertb\"><p>👉 les inégalités peuvent favoriser l’accumulation d’épargne disponible pour l’investissement.</p></div>\n<h4>Idée</h4>\n<p>Les fortes inégalités de revenu concentrent l’épargne entre les mains des catégories les plus aisées, ce qui accroît les capacités de financement international.</p>\n<p>Enfin, ces investissements étrangers permettent aussi de soutenir l’équilibre extérieur européen.</p>\n<h3>M. Les placements extérieurs génèrent des revenus qui compensent le déficit commercial</h3>\n<p>Les investissements extérieurs permettent aux puissances européennes de percevoir des revenus du capital qui compensent leur déficit commercial et soutiennent leur excédent courant.</p>\n<p>La première mondialisation financière crée ainsi une nouveauté majeure : le développement d’un pays n’est plus limité à son épargne nationale.</p>\n<h3>N. La grande nouveauté : l’investissement peut être financé par l’épargne étrangère</h3>\n<p>Avant :</p>\n<p>👉 un pays doit surtout compter sur son épargne domestique.</p>\n<p>Avec la mondialisation financière :</p>\n<p>👉 il peut attirer des capitaux étrangers.</p>\n<h4>Donc</h4>\n<p>épargne domestique faible≠ impossibilité d’investir.</p>\n<p>Il devient possible de financer :</p>\n<ul><li>industrialisation ;</li><li>infrastructures ;</li><li>chemins de fer ;</li><li>développement économique</li></ul>\n<p>grâce à :</p>\n<p>👉 l’épargne du reste du monde.</p>\n<h4>Idée</h4>\n<p>La première mondialisation financière desserre la contrainte de l’épargne domestique en permettant aux pays en développement d’attirer les capitaux excédentaires du reste du monde.</p>\n<p>Les pays neufs vont largement profiter de cette possibilité.</p>\n<h3>O. Les pays neufs financent leur développement grâce aux capitaux étrangers</h3>\n<p>Les pays neufs utilisent les capitaux européens pour financer leur rattrapage, ce qui fait de la mobilité internationale de l’épargne un moteur important de leur développement.</p>\n<p>Cette première mondialisation financière reste néanmoins très différente de celle que l’on connaît depuis les années 1980.</p>\n<h3>P. Une mondialisation financière encore limitée</h3>\n<p>Il ne faut pas confondre :</p>\n<p>👉 première mondialisation financière</p>\n<p>et</p>\n<p>👉 globalisation financière contemporaine.</p>\n<p>La première est importante historiquement, mais :</p>\n<ul><li>les volumes sont beaucoup plus faibles ;</li><li>les instruments financiers sont moins nombreux ;</li><li>les marchés sont moins intégrés ;</li><li>les IDE restent limités.</li></ul>\n<p>Cl</p>\n<p>La première mondialisation financière constitue une rupture historique majeure, mais elle reste sans commune mesure avec l’ampleur et la sophistication de la globalisation financière contemporaine.</p>\n<h3>Q. Conclusion</h3>\n<p>La première mondialisation est donc aussi une première mondialisation financière.</p>\n<p>Elle repose essentiellement sur les investissements de portefeuille et les prêts, bien davantage que sur les IDE.</p>\n<p>Les puissances européennes, notamment le Royaume-Uni et la France, deviennent les grands créanciers du monde :</p>\n<ul><li>leur industrialisation précoce libère une partie de leur épargne ;</li><li>les fortes inégalités concentrent les capacités de financement ;</li><li>les placements extérieurs génèrent des revenus qui soutiennent leur balance courante.</li></ul>\n<p>Ces capitaux financent ensuite les chemins de fer, les ports, les mines et plus largement le développement des pays neufs.</p>\n<h4>Idée</h4>\n<p>La première mondialisation financière transforme profondément le financement du développement en permettant à l’épargne des pays industrialisés de se diriger vers les territoires où les besoins de capitaux sont les plus importants, desserrant ainsi la contrainte de l’épargne domestique.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XV. Les raisons et les leçons de la première mondialisation</h2>\n<p>Pourquoi la première mondialisation se développe-t-elle, et quelles leçons en tirer ?</p>\n<h3>A. Idée générale</h3>\n<p>La première mondialisation ne s’explique pas d’abord par une volonté politique générale de libre-échange.</p>\n<p>La raison principale est beaucoup plus concrète :</p>\n<p>👉 la chute spectaculaire des coûts de transport et de communication.</p>\n<p>Cette baisse rend les échanges lointains :</p>\n<ul><li>moins chers ;</li><li>plus rapides ;</li><li>plus sûrs ;</li><li>plus rentables.</li></ul>\n<p>Mais cette mondialisation reste paradoxale :</p>\n<ul><li>les flux augmentent fortement ;</li><li>les marchés s’intègrent ;</li><li>certaines économies convergent ;</li><li>pourtant le protectionnisme reste largement présent ;</li><li>et les écarts de développement entre régions du monde se creusent.</li></ul>\n<h4>Idée</h4>\n<p>La première mondialisation résulte principalement de la baisse des coûts de transport et de communication, davantage que d’une généralisation du libre-échange, et elle combine intégration croissante des marchés, maintien du protectionnisme et fortes asymétries de développement.</p>\n<p>La première explication est donc technologique et logistique.</p>\n<h3>B. La baisse des coûts de transport : moteur principal de la première mondialisation</h3>\n<h3>C. Une chute spectaculaire du coût réel du transport</h3>\n<p>Selon Bairoch, entre le début du XI Xe siècle et 1910 environ :</p>\n<p>👉 le coût réel moyen du transport est presque divisé par 10.</p>\n<p>Cette diminution concerne :</p>\n<ul><li>le transport ferroviaire ;</li><li>le transport maritime.</li></ul>\n<h4>Conséquence</h4>\n<p>Importer ou exporter depuis un pays lointain devient beaucoup moins coûteux.</p>\n<p>Donc :</p>\n<ul><li>coûts de transport ↓ → échanges rentables ↑ → commerce international ↑ → taux d’ouverture ↑.</li></ul>\n<h4>Idée</h4>\n<p>Selon Bairoch, la quasi-division par dix du coût réel des transports au XI Xe siècle constitue le principal moteur matériel de l’essor du commerce international.</p>\n<p>Cette chute des coûts vient d’abord de la révolution ferroviaire.</p>\n<h3>D. Le chemin de fer réduit fortement le coût des échanges terrestres</h3>\n<p>La généralisation du chemin de fer réduit les coûts internes d’acheminement et connecte davantage les centres de production nationaux aux marchés internationaux.</p>\n<p>La révolution est tout aussi importante dans le transport maritime.</p>\n<h3>E. Les progrès du transport maritime</h3>\n<p>Le percement des grands canaux (Suez, Panama…) réduit les distances maritimes et renforce l’intégration des marchés en diminuant simultanément les coûts, les délais et les risques du commerce à longue distance.</p>\n<h3>F. Des navires plus grands et plus sûrs</h3>\n<p>Les innovations concernent :</p>\n<ul><li>qualité de l’acier ;</li><li>hélice ;</li><li>moteur à turbine ;</li><li>augmentation de la taille des navires.</li></ul>\n<h4>Conséquence</h4>\n<p>→ capacité transportée ↑ → naufrages ↓ → coût unitaire ↓.</p>\n<p>Ces innovations permettent aussi d’échanger de nouveaux types de marchandises.</p>\n<h3>G. De nouveaux biens deviennent transportables</h3>\n<p>Les innovations dans la conservation et la spécialisation des navires élargissent la mondialisation à des produits auparavant difficilement échangeables, comme la viande réfrigérée ou le pétrole.</p>\n<p>Mais une économie mondiale intégrée nécessite également de pouvoir transmettre l’information rapidement.</p>\n<h3>H. La révolution des communications</h3>\n<h3>I. Le câble transatlantique</h3>\n<p>En 1865 :</p>\n<p>👉 première liaison télégraphique durable entre Europe et États-Unis.</p>\n<p>Puis :</p>\n<ul><li>télégraphe ;</li><li>téléphone.</li></ul>\n<h4>Conséquences</h4>\n<p>Les acteurs peuvent connaître rapidement :</p>\n<ul><li>prix ;</li><li>besoins ;</li><li>offres ;</li><li>conditions des marchés.</li></ul>\n<h4>Avant</h4>\n<p>L’information voyage pratiquement à la vitesse des bateaux.</p>\n<h4>Après</h4>\n<p>👉 l’information circule beaucoup plus vite que les marchandises.</p>\n<h4>Idée</h4>\n<p>La révolution des communications réduit les coûts d’information et permet aux marchés internationaux de fonctionner de manière beaucoup plus intégrée.</p>\n<p>Cette baisse des coûts de transport et d’information produit un résultat fondamental : la convergence des prix.</p>\n<h3>J. La mondialisation entraîne une convergence internationale des prix</h3>\n<h4>Exemple</h4>\n<p>👉 le coton et les textiles entre l’Inde et le Royaume-Uni.</p>\n<p>Avant :</p>\n<p>👉 écarts de prix importants selon les lieux.</p>\n<p>Avec la première mondialisation :</p>\n<p>👉 les prix ont tendance à se rapprocher.</p>\n<h4>Pourquoi ?</h4>\n<p>Supposons :</p>\n<ul><li>prix du coton en A &gt; prix du coton en B.</li></ul>\n<p>Si les coûts de transport sont faibles :</p>\n<p>→ les agents achètent en B ; → demande en A ↓ ; → prix en A ↓.</p>\n<p>En B :</p>\n<p>→ demande étrangère ↑ ; → prix en B ↑.</p>\n<p>Donc :</p>\n<p>👉 convergence des prix.</p>\n<h4>Idée</h4>\n<p>La baisse des coûts de transport facilite l’arbitrage international et conduit à une convergence des prix entre les marchés nationaux.</p>\n<p>Cette convergence nourrit l’idée d’un véritable marché mondial.</p>\n<h3>K. La loi du prix unique</h3>\n<p>À partir du moment où :</p>\n<ul><li>un même bien est échangeable ;</li><li>les coûts de transport sont faibles ;</li><li>les marchés sont ouverts ;</li><li>un différentiel de prix important ne peut normalement pas durer.</li></ul>\n<p>C’est la :</p>\n<p>👉 loi du prix unique.</p>\n<h4>Lien futur</h4>\n<p>Cette idée sera reprise par Cassel dans sa théorie de :</p>\n<p>👉 la parité des pouvoirs d’achat.</p>\n<h4>Idée</h4>\n<p>L’intégration commerciale fait émerger une loi du prix unique : les possibilités d’arbitrage limitent durablement les écarts de prix entre marchés.</p>\n<p>On pourrait penser que cette explosion des échanges vient aussi d’une victoire totale du libre-échange. Bairoch montre que ce serait une erreur.</p>\n<h3>L. Bairoch : le XI Xe siècle n’est pas le siècle du libre-échange</h3>\n<p>Dans Mythes et paradoxes de l’histoire économique,1993, Bairoch critique une idée répandue :</p>\n<p>Bairoch remet en cause le mythe d’un XI Xe siècle libre-échangiste : la première mondialisation progresse dans un environnement où le protectionnisme demeure largement la norme.</p>\n<p>Le protectionnisme possède d’ailleurs des défenseurs intellectuels importants.</p>\n<h3>M. Alexander Hamilton : protéger l’industrie américaine</h3>\n<h3>N. Un protectionnisme ancien aux États-Unis</h3>\n<p>En 1791, Alexander Hamilton, premier secrétaire au Trésor américain, propose :</p>\n<p>👉 une taxe sur les importations.</p>\n<p>Notamment :</p>\n<p>👉 les produits britanniques.</p>\n<h4>Objectif</h4>\n<ul><li>protéger les producteurs américains ;</li><li>utiliser les recettes pour soutenir l’industrie nationale.</li></ul>\n<h4>Idée</h4>\n<p>Dès 1791, Hamilton défend un protectionnisme industriel destiné à protéger les producteurs américains de la concurrence britannique et à favoriser l’industrialisation nationale.</p>\n<p>Cette idée est approfondie quelques décennies plus tard par Friedrich List.</p>\n<h3>O. Friedrich List : le protectionnisme éducateur</h3>\n<p>En 1841, Friedrich List affirme que :</p>\n<div class=\"alertb\"><p>👉 une industrie naissante ne peut pas toujours affronter immédiatement une industrie étrangère déjà compétitive.</p></div>\n<h4>Donc</h4>\n<p>Il faut une protection :</p>\n<ul><li>temporaire ;</li><li>ciblée ;</li><li>destinée à construire la compétitivité.</li></ul>\n<p>C’est le :</p>\n<p>👉 protectionnisme éducateur.</p>\n<h4>Exemple</h4>\n<p>Allemagne :</p>\n<div class=\"alertb\"><p>→ retard industriel sur le Royaume-Uni → protection temporaire → montée en puissance industrielle.</p></div>\n<h4>Idée</h4>\n<p>Pour List, les industries naissantes doivent être temporairement protégées afin d’acquérir les capacités productives nécessaires pour affronter ensuite la concurrence internationale.</p>\n<p>Les États disposent aussi d’une autre raison très concrète de conserver les tarifs douaniers.</p>\n<h3>P. Les droits de douane rapportent des recettes fiscales</h3>\n<p>Au XI Xe siècle :</p>\n<p>👉 les systèmes fiscaux modernes sont encore peu développés.</p>\n<p>Les droits de douane sont donc :</p>\n<p>👉 une source importante de revenus publics.</p>\n<p>Cela rend leur suppression difficile.</p>\n<h4>De plus</h4>\n<p>Les producteurs nationaux réclament souvent :</p>\n<p>👉 une protection contre les concurrents étrangers.</p>\n<p>Donc le protectionnisme repose à la fois sur :</p>\n<ul><li>logique budgétaire ;</li><li>logique industrielle ;</li><li>pression des producteurs.</li></ul>\n<h4>Idée</h4>\n<p>Le maintien du protectionnisme s’explique autant par la volonté de protéger les producteurs domestiques que par l’importance des recettes douanières dans les finances publiques.</p>\n<p>Le Royaume-Uni constitue néanmoins l’exception majeure.</p>\n<h3>Q. Le Royaume-Uni bascule progressivement vers le libre-échange</h3>\n<p>Au début du XI Xe siècle :</p>\n<p>👉 le Royaume-Uni reste protectionniste.</p>\n<p>Vers 1820, les droits de douane sur certains produits manufacturés sont très élevés.</p>\n<p>Mais progressivement :</p>\n<p>👉 le pays ouvre son économie.</p>\n<h4>Pourquoi peut-il le faire ?</h4>\n<p>Parce que :</p>\n<ul><li>son industrie est la plus compétitive ;</li><li>il dispose d’une avance technologique ;</li><li>il importe beaucoup de produits primaires ;</li><li>des tarifs faibles diminuent le coût de ses intrants.</li></ul>\n<h4>Idée</h4>\n<p>Le Royaume-Uni peut adopter plus facilement le libre-échange car son avance industrielle lui permet de supporter la concurrence tout en bénéficiant de matières premières importées à moindre coût.</p>\n<p>Le grand conflit politique britannique porte notamment sur les Corn Laws.</p>\n<h3>R. Les Corn Laws : protection des propriétaires terriens</h3>\n<p>En 1815 :</p>\n<p>👉 mise en place des Corn Laws.</p>\n<p>Elles limitent les importations de blé étranger quand les prix sont faibles.</p>\n<h4>Pourquoi ?</h4>\n<p>Pour protéger :</p>\n<p>👉 les propriétaires fonciers britanniques.</p>\n<p>Si le blé étranger bon marché entre :</p>\n<p>→ prix du blé britannique ↓ → rente foncière ↓.</p>\n<p>Donc les propriétaires veulent :</p>\n<p>👉 empêcher les importations.</p>\n<h4>Idée</h4>\n<p>Les Corn Laws illustrent un protectionnisme agricole destiné à défendre les revenus des propriétaires fonciers contre la concurrence du blé étranger.</p>\n<p>Ricardo s’oppose précisément à cette politique.</p>\n<h3>S. Ricardo : libre-échange et lutte contre la baisse du profit</h3>\n<h4>Son raisonnement</h4>\n<p>Blé moins cher → coût de subsistance ↓ → salaire de subsistance ↓ → part des profits ↑.</p>\n<p>Donc :</p>\n<p>👉 importer du blé bon marché protège le profit industriel.</p>\n<h4>Enjeu</h4>\n<p>Ricardo veut éviter :</p>\n<p>👉 la baisse tendancielle du taux de profit.</p>\n<h4>Idée</h4>\n<p>Pour Ricardo, le libre-échange agricole permet de contenir le coût des subsistances et donc les salaires, préservant ainsi les profits nécessaires à l’accumulation du capital.</p>\n<p>Les Corn Laws sont finalement abolies.</p>\n<p>L’étape suivante est internationale.</p>\n<h3>T. 1860 : le traité Cobden-Chevalier</h3>\n<p>Traité entre :</p>\n<p>👉 Franceet👉 Royaume-Uni.</p>\n<p>Il comporte deux éléments fondamentaux.</p>\n<h4>1. Baisse des droits de douane</h4>\n<p>Les échanges franco-britanniques sont libéralisés.</p>\n<h4>2. Clause de la nation la plus favorisée</h4>\n<p>👉 NPF</p>\n<p>Principe :</p>\n<ul><li>si un pays accorde un avantage douanier à un partenaire,</li></ul>\n<p>→ il doit normalement l’accorder aux autres partenaires concernés par la clause.</p>\n<h4>Idée centrale</h4>\n<p>C’est un ancêtre essentiel du :</p>\n<p>👉 multilatéralisme commercial.</p>\n<p>Cl</p>\n<p>Le traité Cobden-Chevalier de 1860 constitue une étape majeure de la libéralisation européenne en réduisant les droits de douane et en diffusant la clause de la nation la plus favorisée.</p>\n<p>Cette clause favorise la diffusion des baisses tarifaires.</p>\n<h3>U. La clause NPF favorise une diffusion du libre-échange</h3>\n<p>Après 1860 :</p>\n<p>👉 d’autres accords commerciaux s’inspirent du traité franco-britannique.</p>\n<p>Exemple :</p>\n<p>👉 France-Allemagne.</p>\n<h4>Mécanisme</h4>\n<p>avantage accordé à un partenaire → extension à d’autres → diffusion de la baisse des tarifs.</p>\n<h4>Mais</h4>\n<p>Il existe des exceptions, notamment :</p>\n<p>👉 les zones de libre-échange.</p>\n<p>Exemple moderne :</p>\n<ul><li>Union européenne :</li><li>droit de douane nul entre membres ;</li><li>droits différents vis-à-vis des pays tiers.</li></ul>\n<h4>Idée</h4>\n<p>La clause de la nation la plus favorisée contribue à généraliser les concessions tarifaires et préfigure les principes du multilatéralisme commercial de l’après-1945.</p>\n<p>La parenthèse libre-échangiste reste cependant fragile.</p>\n<h3>V. À partir de la fin des années 1870 : retour du protectionnisme</h3>\n<p>Dès que la conjoncture se dégrade :</p>\n<p>👉 les revendications protectionnistes reviennent.</p>\n<h4>Idée centrale</h4>\n<p>Les pays veulent protéger :</p>\n<ul><li>agriculture ;</li><li>industrie ;</li><li>producteurs domestiques.</li></ul>\n<p>Cl</p>\n<p>La fin du XI Xe siècle montre la fragilité du libre-échange : le ralentissement économique ravive rapidement les revendications protectionnistes.</p>\n<p>En France, le tarif Méline symbolise cette inflexion.</p>\n<h3>W. Le tarif Méline : retour du protectionnisme français</h3>\n<p>En 1892 :</p>\n<p>👉 mise en place du tarif Méline.</p>\n<p>Objectif :</p>\n<p>👉 protéger notamment les agriculteurs français de la concurrence étrangère.</p>\n<p>Certains droits agricoles remontent fortement.</p>\n<h4>Contexte</h4>\n<p>La France remet en cause la logique du traité Cobden-Chevalier.</p>\n<h4>Idée</h4>\n<p>Le tarif Méline de 1892 symbolise le retour français au protectionnisme afin de protéger les producteurs agricoles et industriels contre la concurrence internationale.</p>\n<p>Ce retour accompagne une période économique plus difficile.</p>\n<h3>X. La Grande Dépression de la fin du XI Xe siècle favorise le protectionnisme</h3>\n<p>La fin du XI Xe siècle connaît :</p>\n<ul><li>ralentissement ;</li><li>crises bancaires ;</li><li>krachs financiers ;</li><li>difficultés agricoles et industrielles.</li></ul>\n<h4>Effet politique</h4>\n<p>Crise → recherche d’un responsable → concurrence étrangère accusée → protectionnisme ↑.</p>\n<h4>Idée importante</h4>\n<p>Le libre-échange est souvent :</p>\n<p>👉 procyclique politiquement.</p>\n<p>Quand tout va bien :</p>\n<p>→ ouverture plus facile.</p>\n<p>Quand l’économie ralentit :</p>\n<p>→ protection demandée.</p>\n<h4>Idée</h4>\n<p>Les épisodes de crise fragilisent politiquement le libre-échange en renforçant la demande de protection des producteurs nationaux.</p>\n<p>L’entre-deux-guerres amplifie ensuite radicalement ce mouvement.</p>\n<h3>Y. Après 1929 : explosion du protectionnisme</h3>\n<p>Après la crise de 1929 :</p>\n<p>👉 les tarifs augmentent fortement.</p>\n<h4>États-Unis</h4>\n<p>👉 tarif Hawley-Smoot.</p>\n<h4>Royaume-Uni</h4>\n<p>👉 retour de droits de douane élevés.</p>\n<h4>Conséquence</h4>\n<p>Commerce international ↓ → fragmentation ↑ → démondialisation.</p>\n<h4>Idée</h4>\n<p>La crise de 1929 transforme le retour protectionniste en véritable mouvement de démondialisation, illustré notamment par le tarif Hawley-Smoot aux États-Unis.</p>\n<p>La première leçon est donc claire : la mondialisation du XI Xe siècle ne résulte pas principalement d’une volonté politique de libre-échange.</p>\n<div class=\"db\"><div class=\"dt\">Première grande leçon</div><div class=\"dd\">technologie &gt; volonté politique</div></div>\n<p>La raison principale de l’ouverture est :</p>\n<p>👉 la baisse des coûts de transport et de communication.</p>\n<p>Et non :</p>\n<p>👉 une victoire générale du libre-échange.</p>\n<h4>Donc</h4>\n<ul><li>progrès technique → échanges moins coûteux → ouverture ↑,</li></ul>\n<p>même dans un monde :</p>\n<p>👉 largement protectionniste.</p>\n<p>Cl</p>\n<p>La première mondialisation démontre qu’une forte progression des échanges peut se produire sans généralisation du libre-échange, dès lors que les coûts matériels de l’échange chutent suffisamment.</p>\n<p>Mais l’augmentation des flux produit aussi une véritable intégration économique.</p>\n<h3>Z. Deuxième leçon : ouverture et intégration ne sont pas la même chose</h3>\n<h4>Ouverture</h4>\n<p>👉 multiplication quantitative des flux.</p>\n<h4>Intégration</h4>\n<p>👉 rapprochement des structures et des prix.</p>\n<p>Pendant la première mondialisation, on observe :</p>\n<ul><li>taux d’ouverture ↑ ;</li><li>convergence des prix ;</li><li>convergence partielle des salaires.</li></ul>\n<h4>Exemple</h4>\n<ul><li>coton ;</li><li>salaires Europe / États-Unis.</li></ul>\n<h4>Idée</h4>\n<p>L’ouverture mesure l’intensité des flux, tandis que l’intégration mesure leurs effets sur la convergence des économies ; la première mondialisation combine les deux phénomènes.</p>\n<p>Mais cette convergence ne concerne pas tous les pays.</p>\n<h3>AA. Troisième leçon : convergence atlantique, divergence mondiale</h3>\n<p>On observe :</p>\n<p>👉 une convergence entre Europe occidentale et Amérique du Nord.</p>\n<p>Mais simultanément :</p>\n<p>👉 une divergence avec une partie du reste du monde.</p>\n<p>C’est :</p>\n<p>👉 la Grande Divergence.</p>\n<h4>Maddison</h4>\n<p>En 1820 :</p>\n<ul><li>niveau de vie des pays les plus riches ≈ 3 fois celui des plus pauvres.</li></ul>\n<p>En 1913 :</p>\n<p>👉 environ 10 fois.</p>\n<p>Cl</p>\n<p>Les inégalités internationales :</p>\n<p>👉 se creusent fortement.</p>\n<p>La première mondialisation produit une convergence au sein de l’espace atlantique tout en accentuant la divergence entre les puissances industrialisées et une grande partie des économies périphériques.</p>\n<p>Cette divergence s’explique en partie par une DIT extrêmement asymétrique.</p>\n<h3>AB. Une division internationale du travail asymétrique</h3>\n<p>La DIT traditionnelle ne résulte pas seulement des avantages comparatifs : elle est aussi le produit de rapports de domination qui orientent les économies périphériques vers les besoins du centre.</p>\n<p>L’Inde en donne un exemple particulièrement clair.</p>\n<h3>AC. L’Inde : de puissance textile à économie reprimarisée</h3>\n<p>La colonisation britannique transforme l’Inde d’exportatrice de textiles en fournisseur de coton et importateur de produits manufacturés, illustrant une reprimarisation imposée de l’économie coloniale.</p>\n<p>La Chine connaît également une intégration forcée.</p>\n<h3>AD. La Chine et les guerres de l’opium</h3>\n<p>Le Royaume-Uni cherche à acheter en Chine :</p>\n<ul><li>thé ;</li><li>soie ;</li><li>autres produits.</li></ul>\n<p>Pour financer ces achats :</p>\n<p>👉 il développe le commerce de l’opium produit en Inde.</p>\n<p>Mais :</p>\n<p>👉 l’opium est interdit en Chine.</p>\n<h4>Résultat</h4>\n<p>→ conflits militaires → guerres de l’opium → victoire britannique.</p>\n<p>La Chine est contrainte :</p>\n<ul><li>d’ouvrir son marché ;</li><li>d’accepter certains produits étrangers ;</li><li>de céder certains avantages territoriaux et commerciaux.</li></ul>\n<h4>Idée centrale</h4>\n<p>Il ne s’agit pas :</p>\n<p>👉 d’un libre-échange choisi.</p>\n<p>Mais :</p>\n<p>👉 d’une ouverture imposée par la puissance militaire.</p>\n<h4>Idée</h4>\n<p>Les guerres de l’opium montrent que la première mondialisation repose aussi sur une ouverture forcée des marchés, imposée par les puissances impériales lorsqu’elle sert leurs intérêts commerciaux.</p>\n<p>La même logique apparaît dans de nombreuses colonies africaines.</p>\n<h3>AE. Acemoglu et Robinson : les institutions extractives</h3>\n<p>Dans les colonies :</p>\n<div class=\"alertb\"><p>👉 les institutions sont souvent organisées pour extraire les ressources au bénéfice de la métropole.</p></div>\n<p>Ce sont :</p>\n<p>👉 les institutions extractives.</p>\n<p>Elles favorisent :</p>\n<ul><li>mines ;</li><li>exportation de matières premières ;</li><li>infrastructures vers les ports ;</li><li>exploitation des ressources.</li><li>Mais pas nécessairement :</li><li>agriculture vivrière ;</li><li>industrialisation locale ;</li><li>développement du marché intérieur.</li></ul>\n<h4>Idée</h4>\n<p>Les institutions extractives organisent l’économie coloniale en fonction des besoins du centre et limitent ainsi l’émergence d’un développement autonome dans les territoires périphériques.</p>\n<p>La domination est donc commerciale et productive, mais aussi financière.</p>\n<h3>AF. Une domination financière des périphéries</h3>\n<p>Les capitaux européens financent :</p>\n<ul><li>mines ;</li><li>chemins de fer ;</li><li>ports ;</li><li>dette des territoires périphériques.</li></ul>\n<p>Donc les pays périphériques deviennent :</p>\n<p>👉 dépendants des capitaux du centre.</p>\n<h4>Trois dimensions de domination</h4>\n<ul><li>commerciale → spécialisations imposées ;</li><li>productive → infrastructures conçues pour l’exportation ;</li><li>financière → dépendance aux capitaux étrangers.</li></ul>\n<p>Cl</p>\n<p>La première mondialisation organise une domination multidimensionnelle des périphéries, à la fois commerciale, productive et financière.</p>\n<p>On retrouve donc certains aspects de la logique mercantiliste.</p>\n<h3>AG. Une mondialisation qui reste partiellement mercantiliste</h3>\n<p>La première mondialisation reste partiellement mercantiliste car les puissances utilisent les échanges internationaux comme un instrument au service de leur puissance politique et économique. → Ils cherchent à : contrôler des marchés ; sécuriser des ressources ; imposer des spécialisations ; utiliser l’extérieur pour renforcer la puissance nationale.</p>\n<div class=\"db\"><div class=\"dt\">Autre idée importante</div><div class=\"dd\">cette mondialisation n’empêche pas l’État de se renforcer.</div></div>\n<h3>AH. Mondialisation et intervention de l’État ne sont pas incompatibles</h3>\n<p>Pendant cette période :</p>\n<p>👉 les États interviennent davantage.</p>\n<p>Ils agissent :</p>\n<ul><li>sur les droits de douane ;</li><li>sur les infrastructures ;</li><li>sur les politiques industrielles ;</li><li>sur la protection sociale.</li></ul>\n<h4>Exemple</h4>\n<p>Sous Bismarck :</p>\n<p>👉 premières grandes assurances sociales.</p>\n<h4>Idée importante</h4>\n<p>La mondialisation n’empêche donc pas :</p>\n<p>👉 la construction de l’État social.</p>\n<p>Cl</p>\n<p>La première mondialisation montre que l’ouverture internationale peut coexister avec une intervention croissante de l’État et avec l’émergence des premières formes de protection sociale.</p>\n<p>Cette situation contraste fortement avec l’hypermondialisation contemporaine.</p>\n<h3>AI. Première mondialisation vs hypermondialisation</h3>\n<h3>AJ. Première mondialisation</h3>\n<ul><li>Ouverture internationale</li><li>intervention publique ↑</li><li>premières protections sociales.</li></ul>\n<h3>AK. Hypermondialisation</h3>\n<p>La protection sociale peut être perçue comme :</p>\n<p>👉 un coût.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que :</p>\n<ul><li>cotisations sociales ↑ → coût du travail ↑ → compétitivité-prix ↓.</li></ul>\n<p>Donc la concurrence internationale peut pousser :</p>\n<p>👉 au désengagement de l’État.</p>\n<h4>Idée</h4>\n<p>Alors que la première mondialisation accompagne l’essor de l’État social, l’hypermondialisation tend davantage à présenter la protection sociale comme un coût susceptible d’affaiblir la compétitivité.</p>\n<p>Enfin, la dernière leçon est probablement la plus importante.</p>\n<h3>AL. Dernière leçon : une mondialisation peut échouer</h3>\n<p>Suzanne Berger insiste sur :</p>\n<p>👉 les leçons d’un échec oublié.</p>\n<p>La première mondialisation semblait :</p>\n<ul><li>profonde ;</li><li>durable ;</li><li>intégrée.</li></ul>\n<p>Pourtant :</p>\n<p>👉 elle s’effondre.</p>\n<h4>Pourquoi ?</h4>\n<ul><li>tensions géopolitiques ;</li><li>impérialisme ;</li><li>protectionnisme ;</li><li>guerres ;</li><li>crises.</li></ul>\n<h4>Donc</h4>\n<p>mondialisation≠ irréversibilité.</p>\n<h4>Idée</h4>\n<p>L’effondrement de la première mondialisation rappelle qu’une intégration économique très avancée peut être remise en cause lorsque les tensions politiques et géopolitiques deviennent dominantes.</p>\n<h3>AM. Conclusion</h3>\n<p>La première mondialisation repose d’abord sur une révolution technique : la baisse des coûts de transport et de communication rend possible une explosion des échanges malgré la persistance de politiques protectionnistes.</p>\n<p>Elle produit une réelle intégration des marchés, visible dans la convergence des prix et des salaires entre certaines économies.</p>\n<p>Mais cette intégration est profondément inégale. Alors que l’Europe occidentale et l’Amérique du Nord convergent, la domination coloniale impose à de nombreuses périphéries des spécialisations extractives et creuse les écarts de développement.</p>\n<div class=\"db\"><div class=\"dt\">Enfin, la période rappelle deux enseignements fondamentaux</div><div class=\"dd\">l’ouverture internationale peut parfaitement coexister avec une forte intervention de l’État, et aucune mondialisation n’est irréversible.</div></div>\n<p>Cl</p>\n<p>La première mondialisation montre que l’intégration économique mondiale résulte moins d’un triomphe doctrinal du libre-échange que de la réduction des coûts de distance ; elle reste politiquement fragile, socialement asymétrique et peut être renversée lorsque les logiques de puissance prennent le dessus sur celles du marché.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XVI. Le repli de l’entre-deux-guerres : protectionnisme, effondrement des flux et basculement de puissance</h2>\n<p>Pourquoi la première mondialisation s’effondre-t-elle entre les deux guerres ?</p>\n<h3>A. Idée générale</h3>\n<p>La première mondialisation s’interrompt brutalement avec :</p>\n<p>👉 la Première Guerre mondiale.</p>\n<p>Puis, après un redémarrage limité dans les années 1920, la crise de 1929 provoque :</p>\n<ul><li>une forte montée du protectionnisme ;</li><li>une guerre commerciale ;</li><li>une guerre monétaire ;</li><li>un effondrement des échanges ;</li><li>un recul des migrations ;</li><li>une baisse des mouvements de capitaux.</li></ul>\n<p>En parallèle :</p>\n<p>👉 la suprématie européenne recule.</p>\n<p>Et progressivement :</p>\n<p>👉 les États-Unis prennent le relais comme première puissance économique mondiale.</p>\n<h4>Idée</h4>\n<p>Le repli de l’entre-deux-guerres marque l’effondrement de la première mondialisation : la crise de 1929 provoque une escalade protectionniste qui contracte les échanges et accélère le basculement de la puissance économique mondiale de l’Europe vers les États-Unis.</p>\n<p>Le premier mécanisme de ce repli est la montée du protectionnisme.</p>\n<h3>B. La Première Guerre mondiale met fin à la première mondialisation</h3>\n<p>La première mondialisation se termine avec en 1914.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que la guerre :</p>\n<ul><li>désorganise les échanges ;</li><li>détruit des infrastructures ;</li><li>détourne les productions vers l’effort militaire ;</li><li>fragilise les grandes puissances européennes ;</li><li>réduit la circulation des capitaux et des hommes.</li></ul>\n<h4>Idée centrale</h4>\n<p>Après 1918, la mondialisation repart un peu, mais :</p>\n<p>👉 elle ne retrouve pas sa dynamique d’avant-guerre.</p>\n<p>Cl</p>\n<p>La Première Guerre mondiale constitue une rupture majeure car elle désorganise les flux commerciaux, financiers et migratoires et fragilise les puissances qui avaient porté la première mondialisation.</p>\n<p>La crise de 1929 transforme ensuite ce ralentissement en véritable effondrement.</p>\n<h3>C. La crise de 1929 déclenche une fermeture généralisée des économies</h3>\n<h3>D. Une crise de surproduction</h3>\n<p>La crise de 1929 est notamment interprétée comme une :</p>\n<p>👉 crise de surproduction.</p>\n<p>La production est trop importante par rapport à la demande effective.</p>\n<p>C’est ce que mettra en avant Keynes.</p>\n<h4>Problème</h4>\n<p>Chaque pays cherche alors à :</p>\n<p>👉 continuer à exporter</p>\n<p>tout en :</p>\n<p>👉 réduisant ses importations.</p>\n<p>Autrement dit :</p>\n<p>👉 exporter sa crise vers l’étranger.</p>\n<h4>Idée</h4>\n<p>Face à la faiblesse de la demande après 1929, les États cherchent à soutenir leur production nationale en exportant davantage tout en limitant leurs importations, ce qui déclenche une logique de confrontation commerciale.</p>\n<p>Mais si tous les pays font la même chose, le résultat est destructeur.</p>\n<h3>E. Une véritable guerre commerciale</h3>\n<p>Chaque pays veut :</p>\n<ul><li>protéger ses entreprises ;</li><li>limiter les importations ;</li><li>préserver l’emploi ;</li><li>maintenir ses exportations.</li></ul>\n<p>Résultat :</p>\n<p>👉 escalade protectionniste.</p>\n<h4>Mécanisme</h4>\n<p>Pays A augmente ses droits de douane → pays B riposte → exportations de A ↓ → A renforce sa protection → B riposte encore.</p>\n<p>C’est une :</p>\n<p>👉 guerre commerciale.</p>\n<h4>Idée</h4>\n<p>La guerre commerciale naît d’un enchaînement de représailles dans lequel chaque pays cherche individuellement à protéger son économie, mais contribue collectivement à réduire le commerce mondial.</p>\n<p>Cette guerre commerciale commence par le retour du protectionnisme tarifaire classique.</p>\n<h3>F. Le protectionnisme tarifaire s’accentue fortement</h3>\n<h3>G. Les États-Unis avant 1929</h3>\n<p>Même avant la crise :</p>\n<p>👉 les États-Unis sont déjà très protectionnistes.</p>\n<p>Le droit de douane moyen est proche de :</p>\n<p>👉 40 %.</p>\n<p>Ce qui est déjà extrêmement élevé.</p>\n<h3>H. Le tarif Hawley-Smoot de 1930</h3>\n<p>Après la crise :</p>\n<p>👉 Hawley-Smoot Tariff, 1930.</p>\n<p>Les droits de douane moyens dépassent :</p>\n<p>👉 50 % sur de nombreux produits.</p>\n<p>Certains tarifs deviennent extrêmes.</p>\n<h4>Exemple</h4>\n<p>Montres suisses :</p>\n<p>👉 jusqu’à environ 300 %.</p>\n<h4>Conséquence</h4>\n<p>Les importations européennes vers les États-Unis chutent fortement.</p>\n<p>👉 environ −70 %.</p>\n<h4>Idée</h4>\n<p>Le tarif Hawley-Smoot de 1930 symbolise l’escalade protectionniste américaine en portant les droits de douane à des niveaux exceptionnellement élevés et en provoquant une forte contraction des importations.</p>\n<p>Mais les États innovent également avec de nouvelles formes de protectionnisme.</p>\n<h3>I. L’apparition du protectionnisme non tarifaire</h3>\n<p>Le protectionnisme ne passe plus seulement par :</p>\n<p>👉 les droits de douane.</p>\n<p>Il utilise aussi :</p>\n<ul><li>préférences commerciales ;</li><li>quotas ;</li><li>contingentements ;</li><li>normes ;</li><li>discriminations entre partenaires.</li></ul>\n<h4>Idée</h4>\n<p>L’entre-deux-guerres voit apparaître un protectionnisme plus diversifié, fondé non seulement sur les droits de douane mais aussi sur des restrictions quantitatives et des préférences commerciales.</p>\n<h3>J. ⸻</h3>\n<h3>K. Transition</h3>\n<div class=\"db\"><div class=\"dt\">Premier exemple</div><div class=\"dd\">la préférence impériale.</div></div>\n<h3>L. La préférence impériale</h3>\n<p>Les accords d’Ottawa de 1932 traduisent le repli britannique sur son empire en organisant une préférence commerciale au bénéfice du Commonwealth.</p>\n<h3>M. La France fait de même</h3>\n<p>La France renforce ses échanges avec :</p>\n<p>👉 son empire colonial.</p>\n<p>Exemple :</p>\n<p>👉 Algérie.</p>\n<p>En 1934, l’Algérie devient :</p>\n<ul><li>premier client de la France ;</li><li>premier fournisseur de la France.</li></ul>\n<h4>Idée centrale</h4>\n<p>Les échanges mondiaux deviennent moins multilatéraux et davantage :</p>\n<p>👉 organisés en blocs.</p>\n<h4>Idée</h4>\n<p>La crise favorise une régionalisation des échanges autour des empires coloniaux, ce qui fragmente davantage le commerce mondial.</p>\n<p>Deuxième instrument : les quotas.</p>\n<h3>N. Les contingentements et quotas</h3>\n<p>Les États limitent directement :</p>\n<p>👉 les quantités pouvant être importées.</p>\n<p>Exemples :</p>\n<ul><li>produits agricoles ;</li><li>sidérurgie ;</li><li>produits industriels.</li></ul>\n<h4>Différence avec le droit de douane</h4>\n<p>Droit de douane :</p>\n<p>👉 importation possible mais plus chère.</p>\n<p>Quota :</p>\n<p>👉 quantité maximale imposée.</p>\n<p>Cl</p>\n<p>Les contingentements limitent directement les volumes importés et constituent une forme de protectionnisme non tarifaire particulièrement restrictive.</p>\n<p>L’addition de ces mesures provoque un effondrement spectaculaire du commerce mondial.</p>\n<h3>O. VEntre 1929 et 1933, le commerce mondial s’effondre</h3>\n<p>👉 les échanges internationaux sont divisés par trois entre 1929 et 1933.</p>\n<p>Ce n’est donc plus :</p>\n<p>👉 un simple ralentissement.</p>\n<p>C’est :</p>\n<p>👉 un effondrement.</p>\n<h4>Mécanisme</h4>\n<p>protectionnisme ↑ → importations ↓ → exportations des partenaires ↓ → production ↓ → chômage ↑ → nouvelle protection ↑.</p>\n<h4>C’est un cercle vicieux</h4>\n<p>protectionnisme → commerce ↓ → récession ↑ → protectionnisme ↑.</p>\n<h4>Idée</h4>\n<p>Entre 1929 et 1933, l’escalade protectionniste transforme la crise nationale en contraction mondiale, le commerce international étant divisé par environ trois.</p>\n<p>La démondialisation ne concerne pas seulement les marchandises.</p>\n<h3>P. Les migrations internationales ralentissent elles aussi</h3>\n<p>Le repli de l’entre-deux-guerres touche également les migrations, avec la mise en place de quotas restrictifs dans les principaux pays d’accueil, notamment aux États-Unis.👉 ils mettent en place des quotas migratoires.</p>\n<p>Les flux monétaires et financiers sont également affectés.</p>\n<h3>Q. Une guerre monétaire accompagne la guerre commerciale</h3>\n<p>Les pays cherchent à :</p>\n<p>👉 dévaluer leur monnaie.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’une dévaluation :</p>\n<p>→ rend les exportations moins chères → améliore potentiellement la compétitivité-prix.</p>\n<h4>Mais</h4>\n<p>Si tous les pays dévaluent :</p>\n<p>👉 personne ne gagne durablement.</p>\n<p>C’est une logique de :</p>\n<p>👉 dévaluations compétitives.</p>\n<h4>Idée</h4>\n<p>La guerre monétaire de l’entre-deux-guerres repose sur des dévaluations compétitives destinées à soutenir les exportations, mais leur généralisation annule les gains relatifs et accroît l’instabilité internationale.</p>\n<p>On assiste donc à une démon
