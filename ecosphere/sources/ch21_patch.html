avail."], ["Ouverture financière", "Circulation internationale des capitaux financiers, placements et titres, distincte de l’investissement productif."], ["Ouverture monétaire", "Dimension liée aux mouvements de devises qui accompagnent les échanges et les placements internationaux."], ["Commerce international", "Échanges internationaux de biens et de services entre résidents et non-résidents."], ["Exportation", "Vente par un résident d’un bien ou d’un service à un non-résident."], ["Importation", "Achat par un résident d’un bien ou d’un service auprès d’un non-résident."], ["IDE", "Investissement direct à l’étranger : investissement réalisé dans un autre pays dans une logique productive et de contrôle durable."], ["Investissement de portefeuille", "Achat d’actifs financiers étrangers dans une logique de placement, sans prise de contrôle de l’entreprise."], ["Capital productif", "Capital investi dans des moyens de production, par opposition au capital purement financier."], ["Capital financier", "Capital placé en titres et actifs financiers, mobile et liquide."], ["Marché des changes", "Marché sur lequel s’échangent les devises, passage obligé de la plupart des opérations internationales."], ["Devise", "Monnaie étrangère utilisée dans les transactions internationales."], ["Bon du Trésor", "Titre de dette publique ; son achat par un non-résident illustre l’articulation entre ouverture financière et ouverture monétaire."], ["Mondialisation", "Processus d’interdépendance et d’intégration croissantes des économies, qui dépasse le seul commerce international."], ["Interdépendance", "Situation dans laquelle les économies dépendent mutuellement les unes des autres."], ["Intégration", "Processus par lequel les économies nationales s’articulent en un ensemble de plus en plus unifié."], ["Charles-Albert Michalet", "Économiste montrant que la mondialisation est un processus multidimensionnel, irréductible au commerce international."], ["Configuration internationale", "Première configuration de Michalet : la mondialisation y passe essentiellement par les échanges commerciaux entre nations."], ["Configuration multinationale", "Deuxième configuration de Michalet : les firmes s’implantent à l’étranger et l’investissement direct devient central."], ["Configuration globale", "Troisième configuration de Michalet : la production est fragmentée et les marchés financiers s’unifient à l’échelle mondiale."], ["Hypermondialisation", "Cumul des trois dimensions — commerciale, productive et financière — aboutissant à une ouverture quantitativement sans précédent."], ["Pierre-Noël Giraud", "Économiste analysant les globalisations comme une généralisation des compétitions entre territoires."], ["Compétition des territoires", "Mise en concurrence des espaces nationaux pour attirer capitaux, activités et emplois."], ["Privilège exorbitant", "Avantage conféré aux États-Unis par le statut international du dollar : attirer durablement les capitaux et financer leurs déséquilibres à bas coût."], ["BRICS", "Brésil, Russie, Inde, Chine, Afrique du Sud : grands émergents dont la montée traduit un rééquilibrage de l’économie mondiale."], ["Rattrapage", "Processus par lequel une économie moins avancée comble son écart de développement avec les pays les plus riches."], ["Divergence", "Écartement des trajectoires économiques, notamment entre pays en développement inégalement insérés dans la mondialisation."], ["Arsenalisation", "Usage de la politique économique — sanctions, contrôles des exportations, droits de douane — comme instrument de rapport de force."], ["Centre / périphérie", "Grille de lecture opposant des économies industrialisées dominantes à des économies spécialisées dans les produits primaires."], ["Raúl Prebisch", "Économiste montrant que la spécialisation primaire enferme les périphéries dans une détérioration des termes de l’échange."], ["Termes de l’échange", "Rapport entre le prix des exportations et celui des importations ; leur détérioration oblige à exporter davantage pour importer autant."], ["DIT traditionnelle", "Division internationale du travail fondée sur une spécialisation verticale : matières premières au Sud, industrie au Nord."], ["Échange inégal", "Théorie selon laquelle le commerce mondial repose sur des rapports de domination et transfère de la valeur des périphéries vers le centre."], ["Acemoglu et Robinson", "Auteurs analysant le rôle des institutions extractives dans le blocage du développement."], ["Institutions extractives", "Institutions organisées au profit d’une minorité, qui découragent l’investissement et entravent le développement."], ["Économie du développement", "Branche de l’analyse économique née de l’étude des blocages spécifiques aux pays en développement."], ["Malédiction des ressources", "Paradoxe selon lequel l’abondance de matières premières peut freiner la diversification et le développement au lieu de les favoriser."], ["FMN", "Firme multinationale : entreprise implantée dans plusieurs pays, d’abord en quête de ressources et de marchés."], ["Firme globale", "Firme organisant sa production à l’échelle mondiale en fragmentant ses activités selon les avantages de chaque territoire."], ["DIPP", "Décomposition internationale des processus productifs : fragmentation de la chaîne de valeur entre plusieurs territoires."], ["Chaîne de valeur mondiale", "Fragmentation des étapes de production entre plusieurs pays, chacune localisée là où les conditions sont les plus favorables."], ["Stratégie offensive", "Politique d’insertion active dans la mondialisation, visant la montée en gamme et la conquête de positions, comme celle de la Chine."], ["Stratégie défensive", "Politique visant à protéger l’appareil productif et les positions acquises face à la concurrence internationale."], ["Ménage consommateur", "Généralement gagnant de la mondialisation par l’accès à des biens plus variés et moins chers."], ["Ménage travailleur", "Gagnant ou perdant selon l’exposition de son secteur et de sa qualification à la concurrence internationale."], ["Ménage épargnant", "Susceptible de bénéficier de la globalisation financière par la diversification de ses placements."], ["Branko Milanovic", "Économiste des inégalités mondiales, auteur de la courbe de l’éléphant."], ["Courbe de l’éléphant", "Représentation des gains de revenu par percentile mondial entre 1988 et 2008, montrant un double mouvement d’inégalités."], ["Big bang des inégalités", "Divergence brutale, à partir de la révolution industrielle, entre pays industrialisés et économies restées à l’écart."], ["Inégalités entre pays", "Écarts de revenu entre nations, réduits par le rattrapage des grands émergents."], ["Inégalités internes", "Écarts de revenu à l’intérieur d’un pays, que la mondialisation peut au contraire renforcer."], ["Balance des paiements", "Document comptable enregistrant l’ensemble des opérations entre les résidents d’un pays et le reste du monde."], ["Compte courant", "Composante de la balance des paiements regroupant les échanges de biens, de services, les revenus et les transferts courants."], ["Solde commercial", "Différence entre les exportations et les importations de biens ; il ne se confond pas avec le solde courant."], ["Solde courant", "Solde du compte courant, plus large que le solde commercial car il intègre services, revenus et transferts."], ["Compte financier", "Composante enregistrant les mouvements de capitaux entre résidents et non-résidents."], ["Compte de capital", "Compte intermédiaire enregistrant certains transferts en capital et acquisitions d’actifs non financiers."], ["Équilibre comptable", "Principe selon lequel la balance des paiements est équilibrée par construction : tout déficit courant a une contrepartie financière."], ["Identité macroéconomique", "Relation X − M = (S − I) + (T − G) reliant le solde extérieur à l’épargne privée et au solde public."], ["Épargne", "Partie du revenu non consommée ; son écart à l’investissement détermine en partie le solde extérieur."], ["Déficit jumeaux", "Situation où un déficit public s’accompagne d’un déficit extérieur, illustrée par les États-Unis sous Reagan."], ["Déficit extérieur", "Solde courant négatif ; il traduit un besoin de financement vis-à-vis du reste du monde, sans être nécessairement un problème."], ["Excédent extérieur", "Solde courant positif ; il traduit une capacité de financement, mais peut signaler une demande intérieure insuffisante."], ["Besoin de financement", "Situation d’une économie dont l’investissement excède l’épargne disponible, ce qui appelle des capitaux extérieurs."], ["Capacité de financement", "Situation inverse : l’épargne excède l’investissement et l’économie prête au reste du monde."], ["Déséquilibres mondiaux", "Persistance de larges excédents et déficits courants entre grandes zones, source d’instabilité financière internationale."], ["Taux d’ouverture", "Indicateur traditionnel mesurant le poids du commerce extérieur dans le PIB, calculé à partir des exportations et des importations."], ["Taux d’exportation", "Rapport des exportations au PIB, exprimé en pourcentage."], ["Commerce en valeur ajoutée", "Mesure corrigeant le double comptage des échanges de biens intermédiaires dans les chaînes de valeur mondiales."], ["Double comptage", "Biais des statistiques traditionnelles : un bien franchissant plusieurs fois les frontières est compté à chaque passage."], ["Biens intermédiaires", "Produits incorporés dans une production ultérieure ; leur circulation gonfle les statistiques commerciales brutes."], ["Contenu en importations des exportations", "Part des intrants étrangers dans ce qu’un pays exporte ; il mesure son insertion dans les chaînes de valeur."], ["Dépendance", "Situation d’un pays tributaire de l’étranger pour un intrant, un débouché ou une technologie critique."], ["Vulnérabilité", "Exposition d’une économie aux ruptures d’approvisionnement le long des chaînes de valeur mondiales."], ["Relocalisation", "Rapatriement d’activités productives précédemment délocalisées, motivé par la sécurité des approvisionnements."], ["Première mondialisation", "Phase d’intégration internationale allant du XIXᵉ siècle à 1914, portée par la révolution industrielle et les transports."], ["Révolution des transports", "Chemin de fer, navire à vapeur et canaux, qui abaissent les coûts et rendent possible l’essor des flux internationaux."], ["Étalon-or", "Régime monétaire international de la première mondialisation, garantissant la convertibilité et la stabilité des changes."], ["Migrations de la première mondialisation", "Mouvements de population massifs, notamment européens vers les Amériques, caractéristiques de l’avant-1914."], ["Première mondialisation financière", "Circulation massive de capitaux avant 1914, souvent dirigée du centre européen vers les économies neuves."], ["Entre-deux-guerres", "Période de repli marquée par le protectionnisme, l’effondrement des flux et le basculement de la puissance vers les États-Unis."], ["Protectionnisme", "Politique de restriction des importations par droits de douane, quotas ou normes."], ["Droits de douane", "Taxes sur les importations, instrument central du protectionnisme."], ["Remondialisation", "Réouverture progressive des économies après 1945, appuyée sur de nouvelles institutions internationales."], ["Nouvelle géographie des échanges", "Déplacement du centre de gravité du commerce mondial vers l’Asie émergente."], ["Mondialisation contemporaine", "Phase moins migratoire que la première mondialisation, mais beaucoup plus financière et productive."], ["Slowbalization", "Ralentissement de la progression de l’ouverture après 2008, sans recul massif des flux."], ["Démondialisation", "Recul effectif de l’intégration internationale ; le ralentissement observé depuis 2008 ne suffit pas à l’attester."], ["Fragmentation", "Recomposition des échanges en blocs régionaux ou affinitaires plutôt que repli généralisé."], ["Régionalisation", "Concentration croissante des échanges à l’intérieur de zones géographiques proches."], ["Crise de 2008", "Point d’inflexion à partir duquel la progression du commerce mondial ralentit durablement."], ["Spécialisation", "Concentration d’une économie sur certaines productions ; elle crée des gains mais aussi des différences de trajectoire."], ["Gains à l’échange", "Bénéfices tirés du commerce international, inégalement répartis entre pays et entre groupes sociaux."], ["Avantage comparatif", "Spécialisation selon les coûts relatifs ; celui de la Chine fondé sur le faible coût du travail s’érode avec sa montée en gamme."], ["Montée en gamme", "Déplacement d’une économie vers des productions à plus forte valeur ajoutée."], ["Délocalisation", "Transfert d’une activité productive vers un territoire offrant de meilleures conditions de coût ou d’accès au marché."], ["Attractivité", "Capacité d’un territoire à attirer capitaux, activités et compétences dans la compétition internationale."], ["Leadership économique", "Position dominante dans l’économie mondiale, passée de l’Europe aux États-Unis puis contestée par l’Asie émergente."], ["Rivalité Chine / États-Unis", "Compétition économique et technologique structurant la mondialisation contemporaine."], ["Souveraineté économique", "Capacité d’un État à maîtriser ses approvisionnements, ses technologies et ses choix de politique économique."], ["Décrochage européen", "Recul relatif du poids de l’Union européenne dans le PIB mondial et dans les parts de marché."], ["Parts de marché", "Poids d’un pays dans les exportations mondiales ; indicateur de compétitivité."], ["Résidents / non-résidents", "Distinction comptable fondant la balance des paiements et la mesure des échanges extérieurs."], ["Transferts courants", "Opérations sans contrepartie — aide, envois de fonds des migrants — enregistrées au compte courant."], ["Revenus primaires", "Revenus du travail et du capital échangés avec le reste du monde, composante du compte courant."], ["Flux de capitaux", "Mouvements internationaux de fonds, plus volatils que les échanges de biens et sensibles aux conditions financières."], ["Interdépendance financière", "Imbrication des systèmes financiers nationaux, qui propage rapidement les chocs d’un pays à l’autre."]], "methode": "<div class=\"nb\"><h2>✏️ Méthode — Deuxième année, chapitre 1</h2><h3>Copies types</h3><ul><li><strong>Mondialisation</strong> : ne jamais la réduire au commerce. Poser d’emblée les trois dimensions et mobiliser les configurations de Michalet.</li><li><strong>Solde commercial / solde courant</strong> : confusion la plus fréquente. Le compte courant intègre aussi services, revenus et transferts.</li><li><strong>Balance des paiements</strong> : elle est équilibrée <em>par construction</em>. Ce sont ses soldes internes qui informent, jamais son total.</li><li><strong>Déficit extérieur</strong> : jamais « bon » ou « mauvais » en soi. Passer par X − M = (S − I) + (T − G) pour en identifier l’origine.</li><li><strong>DIT traditionnelle ≠ DIPP</strong> : la première est une spécialisation verticale par produits, la seconde une fragmentation des étapes de production.</li><li><strong>Inégalités</strong> : toujours préciser l’échelle. Entre pays elles se réduisent, à l’intérieur elles peuvent croître — c’est tout le sens de la courbe de l’éléphant.</li><li><strong>Slowbalization</strong> : ralentissement de la progression, pas recul des flux. Ne pas conclure trop vite à la démondialisation.</li><li><strong>Décrochage européen</strong> : relatif, largement mécanique du fait du rattrapage des émergents.</li></ul>\n<h3>Références à mobiliser</h3><ul><li><strong>Michalet</strong> : mondialisation multidimensionnelle, trois configurations.</li><li><strong>Giraud</strong> : globalisations comme généralisation des compétitions.</li><li><strong>Prebisch</strong> : centre / périphérie, détérioration des termes de l’échange.</li><li><strong>Acemoglu &amp; Robinson</strong> : institutions extractives.</li><li><strong>Milanovic</strong> : big bang des inégalités, courbe de l’éléphant.</li></ul>\n<h3>Formules à savoir écrire</h3><ul><li>Y = C + I + G + X − M &nbsp;et&nbsp; Y = C + S + T</li><li><strong>X − M = (S − I) + (T − G)</strong></li><li>Taux d’ouverture = [(X + M) / 2] / PIB × 100</li><li>Taux d’exportation = X / PIB × 100</li></ul>\n<h3>Repères chronologiques</h3><ul><li>Première mondialisation : jusqu’en 1914, sous étalon-or.</li><li>Entre-deux-guerres : protectionnisme et effondrement des flux.</li><li>Après 1945 : remondialisation puis hypermondialisation.</li><li>Courbe de l’éléphant : 1988-2008.</li><li>Ralentissement du commerce mondial : depuis 2008.</li></ul>\n<div class=\"alertb\"><p><strong>Réflexe de dissertation :</strong> presque tous les sujets du chapitre se règlent en opposant <em>les gains globaux de l’ouverture</em> et <em>leur répartition inégale</em>, ou <em>ce que mesurent les indicateurs</em> et <em>ce qui se passe réellement</em>. Poser l’une de ces deux tensions sécurise le plan.</p></div></div>", "ctx": "DEUXIÈME ANNÉE — CHAPITRE 1 : Mondialisation, ouverture internationale et déséquilibres extérieurs.\nL'ouverture internationale a trois dimensions : commerciale (échanges de biens et services entre résidents et non-résidents), productive (circulation des facteurs, IDE), financière et monétaire (capitaux de placement, devises, marché des changes).\nIDE = investissement réalisé dans un autre pays dans une logique productive et de contrôle durable. Investissement de portefeuille = achat d'actifs financiers étrangers dans une logique de placement. Distinguer capital productif et capital financier.\nMondialisation = processus d'interdépendance et d'intégration croissantes. Charles-Albert Michalet : processus multidimensionnel, trois configurations — internationale (commerce), multinationale (IDE, implantation des firmes), globale (fragmentation productive et unification financière). Hypermondialisation = cumul des trois dimensions, ouverture quantitativement sans précédent.\nPierre-Noël Giraud : les globalisations comme généralisation des compétitions entre territoires. Compétition pour attirer les capitaux. Privilège exorbitant américain lié au statut international du dollar.\nDéplacement du centre de gravité : domination européenne lors de la première mondialisation, leadership américain après 1945, déplacement vers l'Asie émergente avec l'hypermondialisation. BRICS : rééquilibrage après deux siècles de domination occidentale. Chine : d'acteur secondaire à géant économique ; rivalité économique et technologique avec les États-Unis ; arsenalisation de la politique économique. Décrochage relatif de l'Europe : baisse du poids dans le PIB mondial et des parts de marché. Divergence croissante entre pays en développement.\nAsymétries : Prebisch et la logique centre / périphérie, détérioration des termes de l'échange, DIT traditionnelle (spécialisation verticale). Acemoglu et Robinson : institutions extractives. Théories de l'échange inégal. Économie du développement. Limites des stratégies trop fermées. Malédiction des ressources = l'abondance de matières premières peut freiner la diversification et le développement.\nFirmes multinationales : d'abord recherche de ressources et de marchés, puis firme globale et DIPP (décomposition internationale des processus productifs). Qui fixe les règles, l'État ou la firme ? Stratégies offensives (Chine), défensives (États-Unis), indécises (Union européenne).\nGagnants et perdants : le ménage consommateur est généralement gagnant, le ménage travailleur gagnant ou perdant selon son exposition, le ménage épargnant peut bénéficier de la globalisation financière. Milanovic : big bang des inégalités avec la révolution industrielle ; courbe de l'éléphant 1988-2008 ; la mondialisation réduit les inégalités entre pays tout en renforçant certaines inégalités internes.\nBalance des paiements : enregistre les opérations entre résidents et non-résidents ; compte courant (biens, services, revenus, transferts), compte de capital, compte financier (mouvements de capitaux). Équilibrée par construction. Solde commercial ≠ solde courant. Identité : Y = C + I + G + X − M et Y = C + S + T, d'où X − M = (S − I) + (T − G). Déficits jumeaux sous Reagan. Un déficit extérieur traduit un besoin de financement ; il n'est pas toujours un problème : tout dépend de son origine et de sa soutenabilité. Déséquilibres extérieurs mondiaux et inquiétudes sur la stabilité financière internationale.\nMesure : taux d'ouverture = [(X + M) / 2] / PIB × 100 ; taux d'exportation = X / PIB × 100. Problème du double comptage des biens intermédiaires dans les chaînes de valeur. Commerce en valeur ajoutée : ne retient que la valeur créée dans chaque pays, corrige les soldes bilatéraux.\nChaînes de valeur mondiales = fragmentation des étapes de production entre plusieurs pays. Contenu en importations des exportations. Dépendances et vulnérabilités, ruptures d'approvisionnement, relocalisation, souveraineté économique.\nHistoire : première mondialisation jusqu'en 1914 (révolution des transports, étalon-or, migrations massives de l'Europe vers les Amériques, première mondialisation financière). Repli de l'entre-deux-guerres : protectionnisme, effondrement des flux, basculement de puissance vers les États-Unis. Après 1945 : remondialisation, hypermondialisation, nouvelle géographie des échanges vers l'Asie. Mondialisation contemporaine : moins migratoire, beaucoup plus financière et productive. Depuis 2008 : ralentissement du commerce mondial, slowbalization, question de la démondialisation et de la fragmentation ; la stagnation du taux d'ouverture ne signifie pas nécessairement une démondialisation.", "map": {"title": "Deuxième année — Chapitre 1 : Mondialisation, ouverture internationale et déséquilibres", "sub": "Dimensions de l’ouverture, définitions et configurations, asymétries et inégalités, balance des paiements, mesure du commerce, chaînes de valeur, histoire des mondialisations.", "core": "Mondialisation", "branches": [{"title": "Dimensions de l’ouverture", "items": ["Commerciale : biens et services", "Productive : IDE, facteurs", "Financière et monétaire : capitaux, devises"]}, {"title": "Définir la mondialisation", "items": ["Interdépendance et intégration", "Michalet : internationale → multinationale → globale", "Hypermondialisation = cumul des trois"]}, {"title": "Asymétries", "items": ["Prebisch : centre / périphérie, termes de l’échange", "Échange inégal, DIT traditionnelle", "Acemoglu & Robinson : institutions extractives"]}, {"title": "Gagnants et perdants", "items": ["Consommateur gagnant, travailleur exposé", "Milanovic : courbe de l’éléphant", "Inégalités entre pays vs internes"]}, {"title": "Balance des paiements", "items": ["Compte courant / compte financier", "X − M = (S − I) + (T − G)", "Déficits jumeaux, soutenabilité"]}, {"title": "Mesurer la mondialisation", "items": ["Taux d’ouverture, taux d’exportation", "Double comptage des biens intermédiaires", "Commerce en valeur ajoutée"]}, {"title": "Chaînes de valeur", "items": ["DIPP et fragmentation", "Dépendances et vulnérabilités", "Relocalisation, souveraineté"]}, {"title": "Histoire des mondialisations", "items": ["Première mondialisation : étalon-or, migrations", "Entre-deux-guerres : protectionnisme, repli", "Depuis 1945 : remondialisation, slowbalization"]}], "legend": [{"k": "Auteurs", "v": "Michalet, Giraud, Prebisch, Acemoglu & Robinson, Milanovic."}, {"k": "Pièges", "v": "Mondialisation ≠ commerce seul ; solde commercial ≠ solde courant ; balance des paiements équilibrée par construction ; déficit extérieur ≠ problème automatique ; DIT traditionnelle ≠ DIPP ; slowbalization ≠ démondialisation ; décrochage européen relatif, non absolu."}, {"k": "Repères", "v": "Première mondialisation jusqu’en 1914 · étalon-or · entre-deux-guerres : protectionnisme et basculement vers les États-Unis · après 1945 : remondialisation · courbe de l’éléphant 1988-2008 · ralentissement depuis 2008."}], "schemas": [{"title": "Les trois dimensions de l’ouverture", "tag": "Mécanisme", "flow": ["Ouverture commerciale", "Ouverture productive (IDE, DIPP)", "Ouverture financière", "Ouverture monétaire", "Cumul des trois", "Hypermondialisation"], "note": "L’hypermondialisation additionne les dimensions, elle ne les remplace pas."}, {"title": "Du solde extérieur à ses causes", "tag": "Balance des paiements", "flow": ["Solde courant", "X − M", "(S − I) épargne privée", "(T − G) solde public", "Besoin de financement", "Contrepartie au compte financier"], "note": "Le déficit extérieur renvoie aux comportements d’épargne, pas seulement à la compétitivité."}, {"title": "Le biais du double comptage", "tag": "Mesure", "flow": ["Fragmentation des chaînes", "Biens intermédiaires", "Passages répétés aux frontières", "Flux bruts gonflés", "Commerce en valeur ajoutée", "Soldes bilatéraux corrigés"], "note": "Les statistiques traditionnelles surestiment l’ouverture réelle."}, {"title": "Les phases historiques", "tag": "Histoire", "flow": ["Première mondialisation (→1914)", "Repli de l’entre-deux-guerres", "Remondialisation après 1945", "Hypermondialisation", "Ralentissement depuis 2008", "Slowbalization / fragmentation"], "note": "L’ouverture n’est pas irréversible : elle dépend de choix politiques."}]}, "quiz": [{"type": "qcm", "q": "L’ouverture commerciale désigne les échanges :", "opts": ["De capitaux financiers", "De biens et de services", "De devises", "De main-d’œuvre"], "ans": 1, "exp": "Bonne réponse : B) De biens et de services", "ch": 21, "id": "ch21-qcm-1"}, {"type": "qcm", "q": "Un IDE se distingue d’un investissement de portefeuille parce qu’il :", "opts": ["Est toujours plus petit", "Relève d’une logique productive et de contrôle", "Ne traverse pas les frontières", "Concerne uniquement l’État"], "ans": 1, "exp": "Bonne réponse : B) Relève d’une logique productive et de contrôle", "ch": 21, "id": "ch21-qcm-2"}, {"type": "qcm", "q": "L’investissement de portefeuille correspond à :", "opts": ["Une prise de contrôle d’entreprise", "L’achat d’actifs financiers étrangers dans une logique de placement", "Un prêt bancaire national", "Une exportation de services"], "ans": 1, "exp": "Bonne réponse : B) L’achat d’actifs financiers étrangers dans une logique de placement", "ch": 21, "id": "ch21-qcm-3"}, {"type": "qcm", "q": "Le passage par le marché des changes est nécessaire parce que :", "opts": ["Les prix sont fixes", "Les opérations internationales impliquent des devises différentes", "L’État l’impose", "Les banques l’exigent"], "ans": 1, "exp": "Bonne réponse : B) Les opérations internationales impliquent des devises différentes", "ch": 21, "id": "ch21-qcm-4"}, {"type": "qcm", "q": "Les trois dimensions de l’ouverture internationale sont :", "opts": ["Agricole, industrielle, tertiaire", "Commerciale, productive, financière et monétaire", "Publique, privée, mixte", "Locale, nationale, mondiale"], "ans": 1, "exp": "Bonne réponse : B) Commerciale, productive, financière et monétaire", "ch": 21, "id": "ch21-qcm-5"}, {"type": "qcm", "q": "Pour Michalet, la mondialisation est :", "opts": ["Un phénomène purement commercial", "Un processus multidimensionnel", "Une politique publique", "Un régime monétaire"], "ans": 1, "exp": "Bonne réponse : B) Un processus multidimensionnel", "ch": 21, "id": "ch21-qcm-6"}, {"type": "qcm", "q": "La configuration multinationale de Michalet met au centre :", "opts": ["Le commerce de biens", "L’investissement direct et l’implantation des firmes", "Les migrations", "L’étalon-or"], "ans": 1, "exp": "Bonne réponse : B) L’investissement direct et l’implantation des firmes", "ch": 21, "id": "ch21-qcm-7"}, {"type": "qcm", "q": "La configuration globale se caractérise par :", "opts": ["Le repli national", "La fragmentation de la production et l’unification financière", "La fin des échanges", "Le troc"], "ans": 1, "exp": "Bonne réponse : B) La fragmentation de la production et l’unification financière", "ch": 21, "id": "ch21-qcm-8"}, {"type": "qcm", "q": "L’hypermondialisation correspond :", "opts": ["Au remplacement du commerce par la finance", "Au cumul des dimensions commerciale, productive et financière", "À la démondialisation", "Au protectionnisme"], "ans": 1, "exp": "Bonne réponse : B) Au cumul des dimensions commerciale, productive et financière", "ch": 21, "id": "ch21-qcm-9"}, {"type": "qcm", "q": "Pierre-Noël Giraud analyse les globalisations comme :", "opts": ["Une harmonisation des économies", "Une généralisation des compétitions entre territoires", "Une baisse des échanges", "Un phénomène purement monétaire"], "ans": 1, "exp": "Bonne réponse : B) Une généralisation des compétitions entre territoires", "ch": 21, "id": "ch21-qcm-10"}, {"type": "qcm", "q": "Le « privilège exorbitant » désigne l’avantage tiré par les États-Unis :", "opts": ["De leur agriculture", "Du statut international du dollar", "De leur démographie", "De leurs matières premières"], "ans": 1, "exp": "Bonne réponse : B) Du statut international du dollar", "ch": 21, "id": "ch21-qcm-11"}, {"type": "qcm", "q": "Les BRICS regroupent :", "opts": ["Brésil, Russie, Inde, Chine, Afrique du Sud", "Belgique, Roumanie, Irlande, Chypre, Suède", "Brésil, Rwanda, Inde, Canada, Serbie", "Bolivie, Russie, Iran, Chine, Soudan"], "ans": 0, "exp": "Bonne réponse : A) Brésil, Russie, Inde, Chine, Afrique du Sud", "ch": 21, "id": "ch21-qcm-12"}, {"type": "qcm", "q": "Selon Prebisch, la spécialisation primaire conduit à :", "opts": ["Une amélioration des termes de l’échange", "Une détérioration des termes de l’échange", "Une industrialisation rapide", "Une hausse des salaires"], "ans": 1, "exp": "Bonne réponse : B) Une détérioration des termes de l’échange", "ch": 21, "id": "ch21-qcm-13"}, {"type": "qcm", "q": "Les termes de l’échange rapportent :", "opts": ["Le PIB aux exportations", "Le prix des exportations au prix des importations", "L’épargne à l’investissement", "Les impôts aux dépenses"], "ans": 1, "exp": "Bonne réponse : B) Le prix des exportations au prix des importations", "ch": 21, "id": "ch21-qcm-14"}, {"type": "qcm", "q": "La DIT traditionnelle repose sur :", "opts": ["Une spécialisation verticale centre / périphérie", "Une fragmentation des processus productifs", "L’autarcie", "Le libre-échange intégral"], "ans": 0, "exp": "Bonne réponse : A) Une spécialisation verticale centre / périphérie", "ch": 21, "id": "ch21-qcm-15"}, {"type": "qcm", "q": "La DIPP signifie :", "opts": ["Division internationale des prix de production", "Décomposition internationale des processus productifs", "Dette interne des pays pauvres", "Demande intérieure par produit"], "ans": 1, "exp": "Bonne réponse : B) Décomposition internationale des processus productifs", "ch": 21, "id": "ch21-qcm-16"}, {"type": "qcm", "q": "Une chaîne de valeur mondiale correspond à :", "opts": ["Une entreprise unique", "La fragmentation des étapes de production entre plusieurs pays", "Un accord douanier", "Un indice boursier"], "ans": 1, "exp": "Bonne réponse : B) La fragmentation des étapes de production entre plusieurs pays", "ch": 21, "id": "ch21-qcm-17"}, {"type": "qcm", "q": "Acemoglu et Robinson mettent en avant le rôle :", "opts": ["Du climat", "Des institutions extractives", "De la démographie", "Des transports"], "ans": 1, "exp": "Bonne réponse : B) Des institutions extractives", "ch": 21, "id": "ch21-qcm-18"}, {"type": "qcm", "q": "La malédiction des ressources désigne :", "opts": ["L’épuisement des matières premières", "Le fait que l’abondance de ressources peut freiner le développement", "Une taxe sur les exportations", "Une crise monétaire"], "ans": 1, "exp": "Bonne réponse : B) Le fait que l’abondance de ressources peut freiner le développement", "ch": 21, "id": "ch21-qcm-19"}, {"type": "qcm", "q": "La courbe de l’éléphant a été popularisée par :", "opts": ["Branko Milanovic", "Raúl Prebisch", "Charles-Albert Michalet", "Pierre-Noël Giraud"], "ans": 0, "exp": "Bonne réponse : A) Branko Milanovic", "ch": 21, "id": "ch21-qcm-20"}, {"type": "qcm", "q": "La courbe de l’éléphant montre que la mondialisation :", "opts": ["Réduit toutes les inégalités", "Réduit les inégalités entre pays mais renforce certaines inégalités internes", "Augmente toutes les inégalités", "N’a aucun effet"], "ans": 1, "exp": "Bonne réponse : B) Réduit les inégalités entre pays mais renforce certaines inégalités internes", "ch": 21, "id": "ch21-qcm-21"}, {"type": "qcm", "q": "La balance des paiements enregistre :", "opts": ["Le budget de l’État", "Les opérations entre résidents et non-résidents", "Les prix à la consommation", "La masse monétaire"], "ans": 1, "exp": "Bonne réponse : B) Les opérations entre résidents et non-résidents", "ch": 21, "id": "ch21-qcm-22"}, {"type": "qcm", "q": "Le compte courant comprend notamment :", "opts": ["Uniquement les biens", "Les biens, les services, les revenus et les transferts courants", "Uniquement les capitaux", "Uniquement l’or"], "ans": 1, "exp": "Bonne réponse : B) Les biens, les services, les revenus et les transferts courants", "ch": 21, "id": "ch21-qcm-23"}, {"type": "qcm", "q": "Le compte financier enregistre :", "opts": ["Les échanges de biens", "Les mouvements de capitaux entre résidents et non-résidents", "Les impôts", "Les salaires"], "ans": 1, "exp": "Bonne réponse : B) Les mouvements de capitaux entre résidents et non-résidents", "ch": 21, "id": "ch21-qcm-24"}, {"type": "qcm", "q": "L’identité macroéconomique du solde extérieur s’écrit :", "opts": ["X − M = (S − I) + (T − G)", "X + M = C + I", "Y = C + S", "M = X + G"], "ans": 0, "exp": "Bonne réponse : A) X − M = (S − I) + (T − G)", "ch": 21, "id": "ch21-qcm-25"}, {"type": "qcm", "q": "Un déficit courant traduit :", "opts": ["Une capacité de financement", "Un besoin de financement vis-à-vis du reste du monde", "Un excédent d’épargne", "Une baisse des importations"], "ans": 1, "exp": "Bonne réponse : B) Un besoin de financement vis-à-vis du reste du monde", "ch": 21, "id": "ch21-qcm-26"}, {"type": "qcm", "q": "Les « déficits jumeaux » associent :", "opts": ["Déficit public et déficit extérieur", "Déficit commercial et excédent courant", "Inflation et chômage", "Dette privée et dette publique"], "ans": 0, "exp": "Bonne réponse : A) Déficit public et déficit extérieur", "ch": 21, "id": "ch21-qcm-27"}, {"type": "qcm", "q": "La balance des paiements est :", "opts": ["Toujours déficitaire", "Équilibrée par construction", "Toujours excédentaire", "Indépendante des capitaux"], "ans": 1, "exp": "Bonne réponse : B) Équilibrée par construction", "ch": 21, "id": "ch21-qcm-28"}, {"type": "qcm", "q": "Le taux d’ouverture mesure :", "opts": ["Le poids du commerce extérieur dans le PIB", "Le taux de chômage", "Le taux d’épargne", "L’inflation importée"], "ans": 0, "exp": "Bonne réponse : A) Le poids du commerce extérieur dans le PIB", "ch": 21, "id": "ch21-qcm-29"}, {"type": "qcm", "q": "Le commerce en valeur ajoutée corrige :", "opts": ["Les variations de change", "Le double comptage des biens intermédiaires", "Les erreurs statistiques", "L’inflation"], "ans": 1, "exp": "Bonne réponse : B) Le double comptage des biens intermédiaires", "ch": 21, "id": "ch21-qcm-30"}, {"type": "qcm", "q": "Le double comptage provient :", "opts": ["Des services financiers", "Du passage répété des biens intermédiaires aux frontières", "Des migrations", "Des transferts publics"], "ans": 1, "exp": "Bonne réponse : B) Du passage répété des biens intermédiaires aux frontières", "ch": 21, "id": "ch21-qcm-31"}, {"type": "qcm", "q": "La première mondialisation s’achève :", "opts": ["En 1870", "En 1914", "En 1945", "En 1971"], "ans": 1, "exp": "Bonne réponse : B) En 1914", "ch": 21, "id": "ch21-qcm-32"}, {"type": "qcm", "q": "Le régime monétaire de la première mondialisation était :", "opts": ["Le flottement généralisé", "L’étalon-or", "Le bimétallisme régional", "L’euro"], "ans": 1, "exp": "Bonne réponse : B) L’étalon-or", "ch": 21, "id": "ch21-qcm-33"}, {"type": "qcm", "q": "Les migrations de la première mondialisation se dirigeaient surtout :", "opts": ["De l’Asie vers l’Europe", "de l’Europe vers les Amériques", "De l’Afrique vers l’Asie", "Des Amériques vers l’Europe"], "ans": 1, "exp": "Bonne réponse : B) de l’Europe vers les Amériques", "ch": 21, "id": "ch21-qcm-34"}, {"type": "qcm", "q": "L’entre-deux-guerres se caractérise par :", "opts": ["Une ouverture record", "Le protectionnisme et l’effondrement des flux", "La fin des États-nations", "La création de l’OMC"], "ans": 1, "exp": "Bonne réponse : B) Le protectionnisme et l’effondrement des flux", "ch": 21, "id": "ch21-qcm-35"}, {"type": "qcm", "q": "Le basculement de puissance de l’entre-deux-guerres profite :", "opts": ["À l’Empire britannique", "Aux États-Unis", "À la Chine", "À la Russie"], "ans": 1, "exp": "Bonne réponse : B) Aux États-Unis", "ch": 21, "id": "ch21-qcm-36"}, {"type": "qcm", "q": "La mondialisation contemporaine est, par rapport à la première :", "opts": ["Plus migratoire", "Moins migratoire et beaucoup plus financière", "Identique", "Uniquement commerciale"], "ans": 1, "exp": "Bonne réponse : B) Moins migratoire et beaucoup plus financière", "ch": 21, "id": "ch21-qcm-37"}, {"type": "qcm", "q": "La slowbalization désigne :", "opts": ["Un recul massif des échanges", "Un ralentissement de la progression de l’ouverture", "Une accélération du commerce", "Une crise monétaire"], "ans": 1, "exp": "Bonne réponse : B) Un ralentissement de la progression de l’ouverture", "ch": 21, "id": "ch21-qcm-38"}, {"type": "qcm", "q": "Depuis 2008, le commerce mondial :", "opts": ["Progresse plus vite qu’avant", "Voit sa progression ralentir", "S’est effondré", "A disparu"], "ans": 1, "exp": "Bonne réponse : B) Voit sa progression ralentir", "ch": 21, "id": "ch21-qcm-39"}, {"type": "qcm", "q": "La stagnation du taux d’ouverture signifie :", "opts": ["Une démondialisation certaine", "Pas nécessairement une véritable démondialisation", "Une hausse des droits de douane", "La fin des chaînes de valeur"], "ans": 1, "exp": "Bonne réponse : B) Pas nécessairement une véritable démondialisation", "ch": 21, "id": "ch21-qcm-40"}, {"type": "qcm", "q": "L’arsenalisation de la politique économique désigne :", "opts": ["La hausse des dépenses militaires", "L’usage des instruments économiques comme moyens de rapport de force", "La privatisation de l’armée", "Une politique budgétaire expansive"], "ans": 1, "exp": "Bonne réponse : B) L’usage des instruments économiques comme moyens de rapport de force", "ch": 21, "id": "ch21-qcm-41"}, {"type": "qcm", "q": "Le décrochage européen se mesure notamment par :", "opts": ["La hausse du PIB européen", "La baisse du poids de l’Europe dans le PIB mondial et de ses parts de marché", "La hausse des exportations", "La baisse du chômage"], "ans": 1, "exp": "Bonne réponse : B) La baisse du poids de l’Europe dans le PIB mondial et de ses parts de marché", "ch": 21, "id": "ch21-qcm-42"}, {"type": "vf", "q": "L’ouverture internationale se limite aux échanges de biens et de services.", "ans": false, "exp": "Faux : elle comporte aussi une dimension productive, financière et monétaire.", "ch": 21, "id": "ch21-vf-1"}, {"type": "vf", "q": "Un IDE relève d’une logique productive, contrairement à l’investissement de portefeuille.", "ans": true, "exp": "Exact : l’IDE vise un contrôle durable de l’activité, le portefeuille un simple placement.", "ch": 21, "id": "ch21-vf-2"}, {"type": "vf", "q": "Pour Michalet, la mondialisation se réduit au commerce international.", "ans": false, "exp": "Non : il montre au contraire qu’elle est un processus multidimensionnel.", "ch": 21, "id": "ch21-vf-3"}, {"type": "vf", "q": "L’hypermondialisation remplace les formes antérieures d’internationalisation.", "ans": false, "exp": "Faux : elle correspond à leur cumul, pas à leur remplacement.", "ch": 21, "id": "ch21-vf-4"}, {"type": "vf", "q": "Le statut international du dollar procure aux États-Unis un avantage de financement.", "ans": true, "exp": "Exact : c’est le « privilège exorbitant ».", "ch": 21, "id": "ch21-vf-5"}, {"type": "vf", "q": "Selon Prebisch, la spécialisation primaire améliore les termes de l’échange des périphéries.", "ans": false, "exp": "Non : elle les détériore, obligeant à exporter davantage pour importer autant.", "ch": 21, "id": "ch21-vf-6"}, {"type": "vf", "q": "La DIT traditionnelle et la DIPP désignent la même chose.", "ans": false, "exp": "Faux : la DIT traditionnelle est une spécialisation verticale par produits, la DIPP une fragmentation des étapes de production.", "ch": 21, "id": "ch21-vf-7"}, {"type": "vf", "q": "La malédiction des ressources signifie que l’abondance de matières premières garantit le développement.", "ans": false, "exp": "C’est l’inverse : elle peut freiner la diversification et le développement.", "ch": 21, "id": "ch21-vf-8"}, {"type": "vf", "q": "La courbe de l’éléphant permet de concilier réduction des inégalités entre pays et hausse de certaines inégalités internes.", "ans": true, "exp": "Exact : c’est précisément le paradoxe qu’elle résout.", "ch": 21, "id": "ch21-vf-9"}, {"type": "vf", "q": "La balance des paiements peut être durablement déséquilibrée sur son total.", "ans": false, "exp": "Faux : elle est équilibrée par construction ; ce sont ses soldes internes qui peuvent l’être.", "ch": 21, "id": "ch21-vf-10"}, {"type": "vf", "q": "Le solde commercial et le solde courant sont équivalents.", "ans": false, "exp": "Non : le compte courant intègre aussi les services, les revenus et les transferts.", "ch": 21, "id": "ch21-vf-11"}, {"type": "vf", "q": "Un déficit courant traduit un besoin de financement vis-à-vis du reste du monde.", "ans": true, "exp": "Exact : il doit trouver une contrepartie dans le compte financier.", "ch": 21, "id": "ch21-vf-12"}, {"type": "vf", "q": "Un déficit extérieur est toujours le signe d’un problème économique.", "ans": false, "exp": "Non : il peut financer un investissement productif ; tout dépend de son origine et de sa soutenabilité.", "ch": 21, "id": "ch21-vf-13"}, {"type": "vf", "q": "L’identité X − M = (S − I) + (T − G) relie le solde extérieur à l’épargne et au solde public.", "ans": true, "exp": "Exact : c’est l’identité macroéconomique centrale du chapitre.", "ch": 21, "id": "ch21-vf-14"}, {"type": "vf", "q": "Le taux d’ouverture mesure le poids du commerce extérieur dans le PIB.", "ans": true, "exp": "Exact : c’est l’indicateur traditionnel principal.", "ch": 21, "id": "ch21-vf-15"}, {"type": "vf", "q": "Le commerce en valeur ajoutée donne les mêmes résultats que les statistiques brutes.", "ans": false, "exp": "Non : il corrige le double comptage des biens intermédiaires et modifie les classements.", "ch": 21, "id": "ch21-vf-16"}, {"type": "vf", "q": "La première mondialisation était plus migratoire que la mondialisation actuelle.", "ans": true, "exp": "Exact : les mouvements de population d’avant 1914 étaient proportionnellement bien plus massifs.", "ch": 21, "id": "ch21-vf-17"}, {"type": "vf", "q": "L’entre-deux-guerres est une période d’approfondissement de la mondialisation.", "ans": false, "exp": "Faux : c’est une période de repli, de protectionnisme et d’effondrement des flux.", "ch": 21, "id": "ch21-vf-18"}, {"type": "vf", "q": "La slowbalization équivaut à une démondialisation avérée.", "ans": false, "exp": "Non : la progression ralentit, mais l’ouverture ne recule pas massivement.", "ch": 21, "id": "ch21-vf-19"}, {"type": "vf", "q": "La montée des BRICS peut se lire comme un rééquilibrage après deux siècles de domination occidentale.", "ans": true, "exp": "Exact : c’est la lecture historique proposée dans le chapitre.", "ch": 21, "id": "ch21-vf-20"}, {"type": "open", "q": "Distinguez les trois dimensions de l’ouverture internationale.", "sample": "L’ouverture commerciale porte sur les échanges de biens et de services entre résidents et non-résidents. L’ouverture productive concerne la circulation des facteurs de production, notamment à travers les investissements directs à l’étranger. L’ouverture financière et monétaire recouvre la circulation des capitaux de placement et les mouvements de devises qui les accompagnent. La mondialisation ne se réduit donc pas au commerce.", "ch": 21, "id": "ch21-open-1"}, {"type": "open", "q": "Distinguez IDE et investissement de portefeuille.", "sample": "L’investissement direct à l’étranger est réalisé dans une logique productive : il vise un contrôle durable de l’activité implantée à l’étranger. L’investissement de portefeuille est un achat d’actifs financiers étrangers dans une logique de placement, sans prise de contrôle. Le premier relève de l’ouverture productive, le second de l’ouverture financière, et leur mobilité diffère fortement.", "ch": 21, "id": "ch21-open-2"}, {"type": "open", "q": "Présentez les trois configurations de la mondialisation chez Michalet.", "sample": "La configuration internationale repose essentiellement sur les échanges commerciaux entre nations. La configuration multinationale met au centre l’implantation des firmes à l’étranger et l’investissement direct. La configuration globale se caractérise par la fragmentation de la production et l’unification des marchés financiers. Michalet montre ainsi que la mondialisation est un processus multidimensionnel.", "ch": 21, "id": "ch21-open-3"}, {"type": "open", "q": "Qu’est-ce que l’hypermondialisation ?", "sample": "L’hypermondialisation désigne une ouverture quantitativement sans précédent, née du cumul des trois dimensions : échanges commerciaux, fragmentation productive et circulation massive des capitaux. Elle ne remplace pas les formes antérieures d’internationalisation mais les additionne, ce qui explique l’intensité des interdépendances contemporaines.", "ch": 21, "id": "ch21-open-4"}, {"type": "open", "q": "Expliquez l’analyse de Prebisch sur les termes de l’échange.", "sample": "Prebisch montre que les pays spécialisés dans les produits primaires subissent une détérioration tendancielle de leurs termes de l’échange : le prix de leurs exportations progresse moins vite que celui de leurs importations manufacturées. Ils doivent donc exporter toujours davantage pour financer un même volume d’importations, ce qui enferme les périphéries dans leur spécialisation.", "ch": 21, "id": "ch21-open-5"}, {"type": "open", "q": "Qu’est-ce que la malédiction des ressources ?", "sample": "La malédiction des ressources désigne le paradoxe selon lequel l’abondance de matières premières peut ralentir la diversification et le développement au lieu de les favoriser. La rente tirée des ressources décourage l’investissement dans d’autres secteurs, peut nourrir des institutions extractives et expose l’économie à la volatilité des cours mondiaux.", "ch": 21, "id": "ch21-open-6"}, {"type": "open", "q": "Que montre la courbe de l’éléphant ?", "sample": "Elle représente les gains de revenu par percentile mondial entre 1988 et 2008. Elle met en évidence un double mouvement : de forts gains pour les classes moyennes des pays émergents et pour les très hauts revenus mondiaux, mais une quasi-stagnation pour les classes populaires des pays développés. Elle permet ainsi de concilier réduction des inégalités entre pays et renforcement de certaines inégalités internes.", "ch": 21, "id": "ch21-open-7"}, {"type": "open", "q": "Comment lit-on une balance des paiements ?", "sample": "La balance des paiements enregistre toutes les opérations entre résidents et non-résidents. Le compte courant regroupe les biens, les services, les revenus et les transferts courants ; le compte financier enregistre les mouvements de capitaux. L’ensemble est équilibré par construction : un déficit courant a nécessairement une contrepartie dans le compte financier.", "ch": 21, "id": "ch21-open-8"}, {"type": "open", "q": "Expliquez l’identité X − M = (S − I) + (T − G).", "sample": "Le solde extérieur est égal à la somme du solde d’épargne privée et du solde public. Un déficit extérieur traduit donc soit une épargne privée insuffisante au regard de l’investissement, soit un déficit public, soit les deux. Cette identité déplace l’analyse : le déficit commercial n’est pas seulement un problème de compétitivité, il renvoie aux comportements d’épargne et de finances publiques.", "ch": 21, "id": "ch21-open-9"}, {"type": "open", "q": "Un déficit extérieur est-il nécessairement un problème ?", "sample": "Non. Un déficit courant traduit un besoin de financement, mais sa portée dépend de son origine : s’il finance un investissement productif, il peut préparer une croissance future et se résorber. Il devient préoccupant lorsqu’il finance de la consommation, qu’il repose sur des capitaux volatils ou qu’il devient insoutenable au regard des engagements extérieurs accumulés.", "ch": 21, "id": "ch21-open-10"}, {"type": "open", "q": "Pourquoi le commerce en valeur ajoutée modifie-t-il la mesure de la mondialisation ?", "sample": "Les statistiques traditionnelles comptent la valeur totale d’un bien à chaque passage de frontière. Avec la fragmentation des chaînes de valeur, les biens intermédiaires traversent plusieurs fois les frontières, ce qui produit un double comptage et surestime les flux. Le commerce en valeur ajoutée ne retient que la valeur créée dans chaque pays et modifie sensiblement les soldes bilatéraux.", "ch": 21, "id": "ch21-open-11"}, {"type": "open", "q": "Qu’est-ce qu’une chaîne de valeur mondiale et quelles vulnérabilités crée-t-elle ?", "sample": "Une chaîne de valeur mondiale correspond à la fragmentation des étapes de production entre plusieurs pays, chacune localisée selon les conditions de coût, de compétence ou d’accès au marché. Elle procure des gains d’efficacité, mais crée des dépendances sur des intrants critiques et expose les économies aux ruptures d’approvisionnement, ce qui nourrit aujourd’hui les débats sur la relocalisation.", "ch": 21, "id": "ch21-open-12"}, {"type": "open", "q": "Comparez la première mondialisation et la mondialisation contemporaine.", "sample": "La première mondialisation, jusqu’en 1914, reposait sur la révolution des transports, l’étalon-or et des migrations massives, notamment européennes vers les Amériques. La mondialisation contemporaine est nettement moins migratoire, mais beaucoup plus financière et surtout productive, avec la fragmentation internationale des processus de production que la première ne connaissait pas.", "ch": 21, "id": "ch21-open-13"}, {"type": "open", "q": "Quelles leçons tirer du repli de l’entre-deux-guerres ?", "sample": "La montée du protectionnisme et l’effondrement des flux montrent que l’ouverture internationale n’est jamais irréversible : elle dépend de choix politiques et d’un cadre institutionnel. Cette période s’accompagne aussi d’un basculement de puissance vers les États-Unis, ce qui rappelle que les phases de repli redistribuent les positions dominantes.", "ch": 21, "id": "ch21-open-14"}, {"type": "open", "q": "Assistons-nous à une démondialisation depuis 2008 ?", "sample": "Le commerce mondial progresse moins vite depuis la crise et le taux d’ouverture stagne : on parle de slowbalization. Mais l’ouverture ne recule pas massivement et les chaînes de valeur demeurent. Il s’agit donc moins d’une démondialisation que d’un ralentissement accompagné d’une fragmentation : les échanges se recomposent en blocs régionaux et affinitaires.", "ch": 21, "id": "ch21-open-15"}], "topics": {"ouverture": ["ouverture", "commercial", "productive", "financière", "devise", "change"], "mondialisation": ["mondialisation", "michalet", "hypermondialisation", "globalisation", "interdépendance"], "asymétries": ["prebisch", "termes de l’échange", "centre", "périphérie", "échange inégal", "extractive", "malédiction"], "inégalités": ["milanovic", "éléphant", "inégalit", "gagnant", "perdant"], "balance des paiements": ["balance", "compte courant", "compte financier", "solde", "déficit", "excédent", "épargne"], "mesure": ["taux d’ouverture", "valeur ajoutée", "double comptage", "indicateur", "intermédiaire"], "chaînes de valeur": ["dipp", "chaîne de valeur", "fragmentation", "relocalisation", "dépendance", "vulnérabilit"], "histoire": ["première mondialisation", "entre-deux-guerres", "étalon-or", "1914", "1945", "slowbalization", "démondialisation", "protectionnisme"]}, "subjects": [{"id": "ch21-1", "chapter": 21, "num": 1, "title": "La mondialisation se réduit-elle au commerce international ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 9", "commentaire": "Sujet d’ouverture du chapitre. Michalet est incontournable. Le piège serait de rester sur la seule dimension commerciale.", "intro": "Quand un pays s’ouvre au reste du monde, il ne se contente pas d’échanger des biens et des services. L’ouverture internationale comporte aussi une dimension productive et une dimension financière et monétaire, que Charles-Albert Michalet a systématisées.", "problematique": "La mondialisation peut-elle être analysée à partir des seuls échanges commerciaux, ou exige-t-elle une lecture multidimensionnelle ?", "plan": ["I. Le commerce constitue la dimension la plus visible", "A. L’ouverture commerciale", "1) Échanges de biens et de services", "Entre résidents et non-résidents.", "2) Le taux d’ouverture en donne la mesure", "Il rapporte le commerce extérieur au PIB.", "B. Une dimension historiquement première", "1) La première mondialisation en vit surtout", "Révolution des transports et essor des flux.", "2) La DIT traditionnelle l’organise", "Spécialisation verticale centre / périphérie.", "II. Mais deux autres dimensions sont décisives", "A. L’ouverture productive", "1) L’IDE relève d’une logique de contrôle", "Il se distingue du placement financier.", "2) La DIPP fragmente la chaîne de valeur", "Les étapes se répartissent entre territoires.", "B. L’ouverture financière et monétaire", "1) Les capitaux circulent massivement", "Investissements de portefeuille et titres.", "2) Le marché des changes est le passage obligé", "Toute opération implique des devises."], "conclusion": "Réduire la mondialisation au commerce revient à en manquer l’essentiel. Michalet montre qu’elle articule trois configurations, et l’hypermondialisation correspond précisément au cumul des dimensions commerciale, productive et financière."}, {"id": "ch21-2", "chapter": 21, "num": 2, "title": "La mondialisation profite-t-elle à tous ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 7", "commentaire": "Sujet central. Milanovic et la courbe de l’éléphant sont attendus, ainsi que la distinction inégalités entre pays / inégalités internes.", "intro": "La spécialisation internationale crée des gains, mais elle ne garantit pas leur répartition équitable. Les mêmes individus peuvent d’ailleurs être gagnants comme consommateurs et perdants comme travailleurs.", "problematique": "Les gains de la mondialisation se diffusent-ils à l’ensemble des pays et des groupes sociaux ?", "plan": ["I. Des gains réels et largement diffusés", "A. Pour les consommateurs", "1) Des biens plus variés et moins chers", "Le pouvoir d’achat progresse.", "2) L’accès aux innovations s’élargit", "Les technologies se diffusent.", "B. Pour les pays émergents", "1) Un rattrapage spectaculaire", "La Chine en est l’illustration.", "2) Les inégalités entre pays se réduisent", "Le centre de gravité se déplace vers l’Asie.", "II. Mais des perdants nettement identifiés", "A. Selon l’exposition à la concurrence", "1) Le ménage travailleur est inégalement exposé", "Secteur et qualification sont décisifs.", "2) Les classes populaires du Nord stagnent", "La courbe de l’éléphant le montre.", "B. Selon la position dans la division du travail", "1) Les spécialisations n’ont pas la même valeur ajoutée", "Prebisch et la détérioration des termes de l’échange.", "2) La divergence s’accroît entre pays en développement", "Tous ne s’insèrent pas de la même manière."], "conclusion": "La mondialisation accroît la richesse globale et réduit les écarts entre nations, mais elle redistribue à l’intérieur des pays. La courbe de l’éléphant résout ce paradoxe apparent : gains pour les émergents et les très hauts revenus, stagnation pour les classes populaires du Nord."}, {"id": "ch21-3", "chapter": 21, "num": 3, "title": "Un déficit extérieur est-il toujours un problème ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 1", "commentaire": "Sujet très attendu. L’identité X − M = (S − I) + (T − G) doit structurer le raisonnement.", "intro": "Un déficit courant traduit un besoin de financement vis-à-vis du reste du monde. On y voit spontanément un signe de faiblesse. L’identité macroéconomique invite pourtant à une lecture plus fine.", "problematique": "Le déficit extérieur constitue-t-il en lui-même un déséquilibre préoccupant ?", "plan": ["I. Un signal qui mérite attention", "A. Un besoin de financement", "1) Les importations excèdent les exportations", "Le solde courant devient négatif.", "2) Une contrepartie financière est nécessaire", "Le compte financier équilibre la balance.", "B. Des situations de vulnérabilité", "1) Les déficits jumeaux", "Reagan combine déficit public et extérieur.", "2) La dépendance aux capitaux volatils", "Un retournement peut être brutal.", "II. Mais un diagnostic qui dépend de l’origine", "A. L’identité macroéconomique éclaire les causes", "1) X − M = (S − I) + (T − G)", "Épargne privée et solde public en cause.", "2) Le déficit n’est pas qu’un problème de compétitivité", "Il renvoie aux comportements d’épargne.", "B. Un déficit peut être soutenable", "1) S’il finance l’investissement productif", "Il prépare une croissance future.", "2) Le privilège exorbitant américain", "Le statut du dollar en abaisse le coût."], "conclusion": "Le déficit extérieur n’est pas un problème en soi : il traduit un besoin de financement dont la portée dépend de son origine et de sa soutenabilité. Financer de l’investissement productif n’équivaut pas à financer de la consommation par des capitaux volatils."}, {"id": "ch21-4", "chapter": 21, "num": 4, "title": "Comment mesurer la mondialisation commerciale ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Opposer indicateurs traditionnels et commerce en valeur ajoutée. Le double comptage est le cœur du sujet.", "intro": "Le taux d’ouverture rapporte le commerce extérieur au PIB : c’est l’indicateur traditionnel. Mais la fragmentation des chaînes de valeur en fausse la lecture.", "problematique": "Les indicateurs traditionnels rendent-ils compte de la réalité des échanges dans un monde de chaînes de valeur fragmentées ?", "plan": ["I. Les indicateurs traditionnels", "A. Le taux d’ouverture", "1) Il rapporte le commerce extérieur au PIB", "Il mesure l’intensité de l’insertion.", "2) Le taux d’exportation complète la mesure", "Il isole la performance à l’exportation.", "B. Leur utilité", "1) Ils permettent la comparaison internationale", "Les séries sont longues et disponibles.", "2) Ils éclairent les grandes phases historiques", "Première mondialisation, repli, hypermondialisation.", "II. Mais un biais majeur : le double comptage", "A. Le problème", "1) Les biens intermédiaires franchissent plusieurs fois les frontières", "Chaque passage est compté intégralement.", "2) Les flux sont donc surestimés", "L’ouverture apparaît plus forte qu’elle n’est.", "B. Le commerce en valeur ajoutée", "1) Il ne retient que la valeur créée dans chaque pays", "Le double comptage est neutralisé.", "2) Il modifie les soldes bilatéraux", "Les déséquilibres apparents se réduisent."], "conclusion": "Le taux d’ouverture reste un repère commode, mais la fragmentation productive le rend trompeur. Le commerce en valeur ajoutée corrige le double comptage et redessine la mesure réelle de l’intégration commerciale."}, {"id": "ch21-5", "chapter": 21, "num": 5, "title": "Les chaînes de valeur mondiales fragilisent-elles les économies ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 9", "commentaire": "Il faut équilibrer gains d’efficacité et dépendances. La relocalisation apparaît en réponse.", "intro": "La DIPP fragmente la chaîne de valeur entre plusieurs territoires afin de localiser chaque étape là où les conditions sont les plus favorables. Cette organisation procure des gains, mais elle crée aussi des dépendances.", "problematique": "La fragmentation internationale de la production constitue-t-elle d’abord une source d’efficacité ou de vulnérabilité ?", "plan": ["I. Une source d’efficacité", "A. Des gains de spécialisation", "1) Chaque étape est localisée au mieux", "Coût, compétence ou accès au marché.", "2) Les coûts de production baissent", "Les prix finaux en bénéficient.", "B. Une insertion facilitée des pays en développement", "1) On s’insère sur un segment, pas sur un produit entier", "L’entrée est moins exigeante.", "2) La montée en gamme devient possible", "La Chine en fournit l’exemple.", "II. Mais une source de vulnérabilité", "A. Des dépendances critiques", "1) Certains intrants n’ont pas d’alternative", "La rupture bloque toute la chaîne.", "2) Le contenu en importations des exportations mesure l’exposition", "L’autonomie est plus faible qu’il n’y paraît.", "B. Des réponses politiques", "1) La relocalisation de productions stratégiques", "La sécurité prime alors sur le coût.", "2) L’arsenalisation de la politique économique", "Les dépendances deviennent des leviers."], "conclusion": "Les chaînes de valeur mondiales procurent des gains d’efficacité et ouvrent des voies d’insertion aux pays en développement. Mais elles créent des dépendances critiques : la vulnérabilité n’est pas le prix accidentel de l’efficacité, elle en est le revers structurel."}, {"id": "ch21-6", "chapter": 21, "num": 6, "title": "La mondialisation est-elle réversible ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "L’entre-deux-guerres est la référence historique décisive ; la slowbalization le cas contemporain.", "intro": "L’ouverture internationale paraît une tendance irrésistible. L’effondrement des flux durant l’entre-deux-guerres rappelle pourtant qu’elle dépend de choix politiques et d’un cadre institutionnel.", "problematique": "L’intégration internationale constitue-t-elle un mouvement irréversible, ou peut-elle se retourner ?", "plan": ["I. Un précédent historique incontestable", "A. Le repli de l’entre-deux-guerres", "1) Montée du protectionnisme", "Droits de douane et restrictions.", "2) Effondrement des flux commerciaux et financiers", "L’ouverture recule massivement.", "B. Un basculement de puissance", "1) L’Europe perd son leadership", "La première mondialisation s’achève en 1914.", "2) Les États-Unis s’imposent", "Les phases de repli redistribuent les positions.", "II. Mais un ralentissement contemporain qui n’est pas un retournement", "A. La slowbalization", "1) La progression ralentit depuis 2008", "Le taux d’ouverture stagne.", "2) Les flux ne s’effondrent pas", "Les chaînes de valeur demeurent.", "B. Une recomposition plutôt qu’un repli", "1) La régionalisation progresse", "Les échanges se concentrent par zones.", "2) La fragmentation suit des logiques d’affinité", "Les blocs se redessinent."], "conclusion": "L’entre-deux-guerres prouve que la mondialisation peut se retourner : elle n’a rien d’un processus naturel. Mais la phase actuelle relève davantage du ralentissement et de la recomposition que d’une véritable démondialisation."}, {"id": "ch21-7", "chapter": 21, "num": 7, "title": "La spécialisation internationale est-elle toujours avantageuse ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 3", "commentaire": "Prebisch et la malédiction des ressources doivent nuancer la lecture par les avantages comparatifs.", "intro": "La spécialisation crée des gains à l’échange. Mais toutes les spécialisations ne se valent pas : elles n’offrent ni la même valeur ajoutée, ni les mêmes perspectives de développement.", "problematique": "La spécialisation selon les avantages comparatifs bénéficie-t-elle également à tous les pays ?", "plan": ["I. Des gains réels à l’échange", "A. Le principe de la spécialisation", "1) Chacun produit ce qu’il fait relativement le mieux", "La production mondiale augmente.", "2) Les consommateurs en bénéficient", "Prix plus bas, offre plus variée.", "B. Des trajectoires de rattrapage", "1) L’insertion peut amorcer l’industrialisation", "La DIPP facilite l’entrée par segment.", "2) La montée en gamme est possible", "L’avantage initial peut être dépassé.", "II. Mais des spécialisations inégalement favorables", "A. L’enfermement des périphéries", "1) Prebisch et la détérioration des termes de l’échange", "Exporter plus pour importer autant.", "2) La DIT traditionnelle fige les positions", "Matières premières au Sud, industrie au Nord.", "B. Des blocages spécifiques", "1) La malédiction des ressources", "L’abondance freine la diversification.", "2) Les institutions extractives", "Acemoglu et Robinson en montrent l’effet."], "conclusion": "La spécialisation engendre des gains globaux, mais sa valeur dépend du segment occupé. Une spécialisation primaire peut enfermer un pays dans la détérioration de ses termes de l’échange, ce que les institutions et les stratégies d’insertion peuvent corriger — ou aggraver."}, {"id": "ch21-8", "chapter": 21, "num": 8, "title": "Les firmes multinationales ont-elles pris le pas sur les États ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 9", "commentaire": "Sujet de rapport de force. Il faut montrer l’interdépendance plutôt qu’une domination univoque.", "intro": "Les premières firmes multinationales recherchaient surtout des ressources ou des marchés. Avec la firme globale et la DIPP, elles organisent désormais leur production à l’échelle mondiale, ce qui interroge la capacité des États à fixer les règles.", "problematique": "Qui, des États ou des firmes globales, détermine aujourd’hui les règles de l’économie mondiale ?", "plan": ["I. Un pouvoir croissant des firmes", "A. La firme globale arbitre entre territoires", "1) Elle localise chaque étape au mieux", "La DIPP lui en donne les moyens.", "2) Les territoires entrent en compétition", "Giraud parle de généralisation des compétitions.", "B. Des marges de manœuvre étatiques réduites", "1) La concurrence fiscale et réglementaire", "Les États s’alignent pour attirer.", "2) La mobilité du capital contraint", "Le rapport de force se déplace.", "II. Mais des États qui conservent des leviers", "A. Des stratégies nationales assumées", "1) La Chine mène une stratégie offensive", "Montée en gamme et conquête de positions.", "2) Les États-Unis adoptent une logique défensive", "Protection de l’appareil productif.", "B. L’arsenalisation de la politique économique", "1) Sanctions et contrôles des exportations", "Les dépendances deviennent des armes.", "2) Le cadre réglementaire reste étatique", "L’accès aux marchés se négocie."], "conclusion": "Les firmes globales ont gagné un pouvoir d’arbitrage considérable entre territoires. Mais les États conservent des leviers décisifs, et l’arsenalisation récente de la politique économique montre qu’ils peuvent transformer l’interdépendance en instrument de puissance."}, {"id": "ch21-9", "chapter": 21, "num": 9, "title": "Le centre de gravité de l’économie mondiale s’est-il déplacé ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Sujet historique : domination européenne, leadership américain, montée de l’Asie. Le décrochage européen doit apparaître.", "intro": "La première mondialisation était dominée par l’Europe ; l’après-1945 consacre le leadership américain ; l’hypermondialisation déplace le centre de gravité vers l’Asie émergente.", "problematique": "Assiste-t-on à un véritable basculement de la puissance économique mondiale ?", "plan": ["I. Un déplacement historique avéré", "A. Trois phases successives", "1) Domination européenne jusqu’en 1914", "La première mondialisation en porte la marque.", "2) Leadership américain après 1945", "Le dollar en est le pivot.", "B. La montée de l’Asie émergente", "1) L’affirmation des BRICS", "Un rééquilibrage après deux siècles.", "2) La Chine, d’acteur secondaire à géant", "Rivalité économique et technologique.", "II. Mais une contestation encore partielle", "A. La puissance monétaire américaine résiste", "1) Le privilège exorbitant demeure", "Le dollar attire durablement les capitaux.", "2) La domination financière est peu entamée", "Les alternatives restent limitées.", "B. Un décrochage surtout européen", "1) Le poids de l’UE dans le PIB mondial recule", "Les parts de marché diminuent.", "2) La divergence s’accroît entre émergents", "Tous ne rattrapent pas."], "conclusion": "Le centre de gravité productif et commercial s’est bel et bien déplacé vers l’Asie. Mais la puissance monétaire et financière américaine reste peu contestée : le basculement est réel sur le terrain industriel, encore inachevé sur le terrain monétaire."}, {"id": "ch21-10", "chapter": 21, "num": 10, "title": "La balance des paiements est-elle un bon indicateur de la santé d’une économie ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 2", "commentaire": "Attention au piège : elle est équilibrée par construction. Ce sont ses soldes internes qui informent.", "intro": "La balance des paiements enregistre l’ensemble des opérations entre résidents et non-résidents. Équilibrée par construction, elle n’en livre pas moins des informations décisives par la lecture de ses soldes.", "problematique": "Que nous apprend réellement la balance des paiements sur la situation d’une économie ?", "plan": ["I. Un instrument de lecture précieux", "A. Une architecture informative", "1) Le compte courant", "Biens, services, revenus, transferts.", "2) Le compte financier", "Mouvements de capitaux.", "B. Des enseignements sur le financement", "1) Besoin ou capacité de financement", "Le solde courant le révèle.", "2) La nature des capitaux entrants", "Investissement direct ou placement volatil.", "II. Mais un indicateur à manier avec prudence", "A. Des limites comptables", "1) L’équilibre est automatique", "Le total n’a pas de valeur diagnostique.", "2) Solde commercial ≠ solde courant", "La confusion est fréquente.", "B. Une interprétation qui dépend du contexte", "1) L’identité X − M = (S − I) + (T − G)", "Les causes peuvent être internes.", "2) Le statut monétaire modifie la contrainte", "Le privilège exorbitant américain en témoigne."], "conclusion": "La balance des paiements ne dit rien par son total, équilibré par construction. Mais la lecture de ses soldes, éclairée par l’identité macroéconomique, révèle le mode de financement d’une économie et la nature de sa dépendance extérieure."}, {"id": "ch21-11", "chapter": 21, "num": 11, "title": "Les déséquilibres extérieurs mondiaux sont-ils dangereux ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Il faut distinguer le déficit d’un pays et la persistance de déséquilibres à l’échelle mondiale.", "intro": "À l’échelle mondiale, les déficits des uns sont les excédents des autres. La persistance de tels écarts entre grandes zones nourrit les inquiétudes sur la stabilité financière internationale.", "problematique": "La persistance de larges déséquilibres courants entre grandes zones menace-t-elle la stabilité de l’économie mondiale ?", "plan": ["I. Des motifs d’inquiétude réels", "A. Une accumulation d’engagements", "1) Les déficits se financent par endettement extérieur", "Les positions nettes se dégradent.", "2) Un retournement peut être brutal", "Les capitaux volatils se retirent vite.", "B. Une source de tensions", "1) Les excédents alimentent les accusations de concurrence déloyale", "Le protectionnisme s’en nourrit.", "2) L’arsenalisation de la politique économique", "Le déséquilibre devient un motif de conflit.", "II. Mais des déséquilibres partiellement soutenables", "A. Une contrepartie logique", "1) L’identité macroéconomique l’explique", "Épargne, investissement et solde public.", "2) Les excédents traduisent parfois une demande intérieure faible", "Le problème n’est pas seulement chez le déficitaire.", "B. Des asymétries de contrainte", "1) Le privilège exorbitant américain", "Le financement reste aisé.", "2) La mesure en valeur ajoutée réduit les écarts apparents", "Le double comptage gonfle les soldes bilatéraux."], "conclusion": "Les déséquilibres mondiaux inquiètent parce qu’ils accumulent des engagements et nourrissent les tensions commerciales. Mais leur danger doit être relativisé : ils ont une contrepartie comptable logique, et leur mesure elle-même est biaisée par le double comptage."}, {"id": "ch21-12", "chapter": 21, "num": 12, "title": "La première mondialisation et la mondialisation actuelle sont-elles comparables ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Comparaison structurée attendue : migrations, finance, production. La DIPP est l’élément vraiment nouveau.", "intro": "On compare souvent l’ouverture d’avant 1914 à celle d’aujourd’hui. Les niveaux quantitatifs peuvent se rapprocher, mais la nature des flux a profondément changé.", "problematique": "La mondialisation contemporaine prolonge-t-elle la première mondialisation ou en diffère-t-elle par nature ?", "plan": ["I. Des points communs frappants", "A. Une intensité comparable des échanges", "1) Des taux d’ouverture élevés dans les deux cas", "La révolution des transports puis le conteneur.", "2) Une intégration financière forte", "L’étalon-or hier, la globalisation financière aujourd’hui.", "B. Des mécanismes semblables", "1) Spécialisation et gains à l’échange", "La logique économique demeure.", "2) Des tensions et des contestations", "Les deux périodes en sont traversées.", "II. Mais des différences décisives", "A. Les migrations ont reculé", "1) Avant 1914, des flux massifs vers les Amériques", "Le travail circulait largement.", "2) Aujourd’hui, le capital circule plus que les hommes", "L’asymétrie s’est inversée.", "B. La production s’est fragmentée", "1) La DIPP n’a pas d’équivalent historique", "Hier on échangeait des produits finis.", "2) Les chaînes de valeur créent des dépendances inédites", "La nature de l’interdépendance change."], "conclusion": "Les deux mondialisations se rapprochent par l’intensité des flux, mais diffèrent par leur nature : la première était migratoire et commerciale, la seconde est financière et surtout productive. La fragmentation des processus productifs constitue la rupture décisive."}, {"id": "ch21-13", "chapter": 21, "num": 13, "title": "Pourquoi certains pays réussissent-ils leur insertion dans la mondialisation et d’autres non ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 7", "commentaire": "Sujet de synthèse sur les stratégies d’insertion. Ne pas se limiter aux dotations en facteurs.", "intro": "Certains pays ont converti l’ouverture en rattrapage spectaculaire ; d’autres sont restés enfermés dans une spécialisation peu rémunératrice. La divergence entre pays en développement s’est même accrue.", "problematique": "Qu’est-ce qui distingue les stratégies d’insertion gagnantes des stratégies perdantes ?", "plan": ["I. Des stratégies gagnantes", "A. S’insérer puis monter en gamme", "1) Entrer par un segment de chaîne de valeur", "La DIPP abaisse le ticket d’entrée.", "2) Accumuler compétences et technologies", "La Chine illustre la trajectoire.", "B. Des institutions favorables", "1) Elles sécurisent l’investissement", "Acemoglu et Robinson par contraste.", "2) L’État peut mener une stratégie offensive", "Politique industrielle et attractivité.", "II. Des stratégies perdantes", "A. L’enfermement dans la spécialisation primaire", "1) La détérioration des termes de l’échange", "Prebisch en fournit le mécanisme.", "2) La malédiction des ressources", "La rente décourage la diversification.", "B. Les excès inverses", "1) Les stratégies trop fermées ont montré leurs limites", "Réduire la dépendance ne suffit pas.", "2) Les institutions extractives bloquent", "Un bon diagnostic ne fait pas une bonne stratégie."], "conclusion": "La réussite tient moins à la dotation initiale qu’à la capacité de progresser dans la chaîne de valeur, portée par des institutions qui sécurisent l’investissement. À l’inverse, la rente primaire et les institutions extractives figent les positions, et la fermeture ne constitue pas une alternative."}, {"id": "ch21-14", "chapter": 21, "num": 14, "title": "La mondialisation réduit-elle les inégalités ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 7", "commentaire": "Ne pas confondre inégalités entre pays et inégalités internes. La courbe de l’éléphant tranche le paradoxe.", "intro": "La mondialisation est accusée d’aggraver les inégalités autant qu’elle est créditée du rattrapage des émergents. Ces deux constats ne sont contradictoires qu’en apparence.", "problematique": "La mondialisation accroît-elle ou réduit-elle les inégalités, et à quelle échelle ?", "plan": ["I. Une réduction des inégalités entre pays", "A. Le rattrapage des émergents", "1) La Chine et l’Asie émergente", "Le centre de gravité se déplace.", "2) Les BRICS s’affirment", "Rééquilibrage après deux siècles.", "B. Un mécanisme identifié", "1) L’insertion productive permet l’industrialisation", "Les revenus progressent.", "2) Milanovic parle de résorption du big bang", "La divergence de 1800 se réduit.", "II. Mais un creusement des inégalités internes", "A. Le constat de la courbe de l’éléphant", "1) Gains des classes moyennes émergentes", "Et des très hauts revenus mondiaux.", "2) Stagnation des classes populaires du Nord", "La trompe de l’éléphant.", "B. Des effets différenciés", "1) Le ménage travailleur est exposé selon sa qualification", "Le consommateur, lui, est gagnant.", "2) La divergence s’accroît entre pays du Sud", "Tous ne rattrapent pas."], "conclusion": "La mondialisation réduit les inégalités entre nations tout en renforçant certaines inégalités à l’intérieur des pays. La courbe de l’éléphant résout ce paradoxe : c’est l’échelle d’observation qui détermine la réponse."}, {"id": "ch21-15", "chapter": 21, "num": 15, "title": "L’ouverture financière est-elle un facteur de stabilité ou d’instabilité ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 2", "commentaire": "Distinguer IDE et capitaux de portefeuille est décisif : la volatilité n’est pas la même.", "intro": "La mondialisation contemporaine est beaucoup plus financière que la première. Cette circulation massive des capitaux facilite le financement des économies, mais elle en accroît aussi la sensibilité aux chocs.", "problematique": "La globalisation financière améliore-t-elle le financement des économies ou fragilise-t-elle leur stabilité ?", "plan": ["I. Un apport réel au financement", "A. Une allocation élargie de l’épargne", "1) Les capitaux vont où ils sont utiles", "Les besoins de financement sont couverts.", "2) L’épargnant diversifie ses placements", "Le risque se répartit.", "B. Un soutien à l’investissement productif", "1) L’IDE apporte capital et technologie", "Il s’inscrit dans la durée.", "2) Il accompagne l’insertion dans les chaînes de valeur", "Le transfert de compétences suit.", "II. Mais une source d’instabilité", "A. La volatilité des capitaux de portefeuille", "1) Ils peuvent se retirer brutalement", "Le financement se tarit d’un coup.", "2) La dépendance extérieure devient un risque", "Les déficits courants y sont exposés.", "B. La propagation des chocs", "1) L’interdépendance financière transmet les crises", "2008 en fournit l’illustration.", "2) Les asymétries persistent", "Le privilège exorbitant protège les États-Unis."], "conclusion": "La globalisation financière élargit l’accès au financement et soutient l’investissement productif lorsqu’elle passe par l’IDE. Mais les capitaux de portefeuille, volatils, peuvent se retourner brutalement : la stabilité dépend moins du volume des flux que de leur nature."}, {"id": "ch21-16", "chapter": 21, "num": 16, "title": "La compétition entre territoires est-elle inévitable ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Giraud est central. Montrer que la compétition porte sur les capitaux et les activités, pas seulement sur les produits.", "intro": "Pierre-Noël Giraud analyse les globalisations comme une généralisation des compétitions. Les territoires ne rivalisent plus seulement par leurs
