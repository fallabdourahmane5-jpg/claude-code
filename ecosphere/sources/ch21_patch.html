produits, mais pour attirer capitaux, activités et compétences.", "problematique": "La mondialisation impose-t-elle nécessairement une mise en concurrence des territoires ?", "plan": ["I. Une compétition largement imposée", "A. La mobilité du capital la nourrit", "1) La firme globale arbitre entre sites", "La DIPP en donne les moyens.", "2) Les territoires s’alignent pour attirer", "Fiscalité, réglementation, infrastructures.", "B. Une extension du champ concurrentiel", "1) Des produits aux facteurs de production", "La compétition change de nature.", "2) Les emplois deviennent l’enjeu", "Le ménage travailleur est exposé.", "II. Mais des marges de manœuvre politiques", "A. Des stratégies nationales différenciées", "1) Offensive chinoise, défensive américaine", "Les choix ne sont pas identiques.", "2) L’Union européenne peine à se définir", "La stratégie reste indécise.", "B. Des régulations possibles", "1) La coordination fiscale limite le moins-disant", "La compétition peut être encadrée.", "2) L’arsenalisation montre le retour du politique", "Les États reprennent l’initiative."], "conclusion": "La mobilité du capital rend la compétition entre territoires difficilement évitable, et elle s’étend des produits aux facteurs. Mais son intensité dépend de choix politiques : les stratégies nationales divergent et la coordination peut en limiter les effets."}, {"id": "ch21-17", "chapter": 21, "num": 17, "title": "Le protectionnisme est-il toujours nuisible ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 3", "commentaire": "Le repli de l’entre-deux-guerres sert de contre-exemple historique, mais le protectionnisme éducateur mérite d’être évoqué.", "intro": "L’entre-deux-guerres reste le symbole des effets destructeurs du protectionnisme. Pourtant, la question du degré d’ouverture souhaitable resurgit aujourd’hui avec les dépendances révélées par les chaînes de valeur.", "problematique": "La protection commerciale est-elle nécessairement contraire à l’intérêt économique d’un pays ?", "plan": ["I. Un coût économique bien identifié", "A. L’exemple de l’entre-deux-guerres", "1) Montée des droits de douane", "Les flux s’effondrent.", "2) Une aggravation de la crise", "Le repli devient cumulatif.", "B. Des pertes durables", "1) Les consommateurs paient plus cher", "Le pouvoir d’achat recule.", "2) Les stratégies trop fermées ont échoué", "Réduire la dépendance n’a pas suffi.", "II. Mais des justifications recevables", "A. Des protections temporaires", "1) Protéger une industrie naissante", "Le temps d’atteindre la compétitivité.", "2) Accompagner une montée en gamme", "La stratégie chinoise l’illustre.", "B. Des enjeux non marchands", "1) Sécuriser des approvisionnements critiques", "Les vulnérabilités des chaînes de valeur.", "2) La souveraineté économique", "L’arsenalisation en fait un enjeu de puissance."], "conclusion": "Le protectionnisme généralisé a un coût démontré, dont l’entre-deux-guerres reste l’illustration. Mais une protection ciblée et temporaire peut se justifier pour développer une industrie ou sécuriser des approvisionnements critiques : c’est son caractère systématique qui est nuisible."}, {"id": "ch21-18", "chapter": 21, "num": 18, "title": "La Chine a-t-elle gagné la mondialisation ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 7", "commentaire": "Sujet de cas. Montrer la trajectoire et ses limites actuelles : érosion de l’avantage comparatif initial.", "intro": "D’acteur secondaire, la Chine est devenue un géant économique et un rival technologique des États-Unis. Sa trajectoire est le cas d’insertion réussie par excellence.", "problematique": "La trajectoire chinoise constitue-t-elle une réussite achevée de l’insertion dans la mondialisation ?", "plan": ["I. Une insertion remarquablement réussie", "A. Une stratégie offensive", "1) Entrée par les segments intensifs en travail", "La DIPP en offrait l’opportunité.", "2) Accumulation de compétences et de technologies", "La montée en gamme suit.", "B. Une puissance désormais globale", "1) Poids déterminant dans le commerce mondial", "Le centre de gravité se déplace.", "2) Rivalité économique et technologique avec les États-Unis", "La compétition devient stratégique.", "II. Mais une réussite qui rencontre ses limites", "A. L’érosion de l’avantage initial", "1) Le coût du travail augmente", "Certaines activités partent ailleurs.", "2) La concurrence des économies moins développées", "Le modèle se déplace.", "B. Des vulnérabilités nouvelles", "1) L’exposition aux mesures d’arsenalisation", "Contrôles technologiques et sanctions.", "2) La puissance monétaire reste américaine", "Le privilège exorbitant n’est pas entamé."], "conclusion": "La Chine offre l’exemple le plus abouti d’une insertion convertie en puissance, par une stratégie offensive de montée en gamme. Mais l’érosion de son avantage comparatif initial et sa dépendance persistante au système monétaire américain montrent que la partie n’est pas jouée."}, {"id": "ch21-19", "chapter": 21, "num": 19, "title": "L’Europe décroche-t-elle dans l’économie mondiale ?", "mobiliser": "2ᵉ année ch. 1", "commentaire": "Sujet de diagnostic. Mesurer le décrochage sans exagérer : il est relatif, pas absolu.", "intro": "Le poids de l’Union européenne dans le PIB mondial recule, de même que ses parts de marché. Ce décrochage interroge sa capacité à peser dans la compétition entre grandes zones.", "problematique": "Le recul relatif de l’Europe traduit-il un déclin ou une simple redistribution mondiale ?", "plan": ["I. Un décrochage mesurable", "A. Un poids économique en recul", "1) La part dans le PIB mondial diminue", "La croissance est plus lente qu’ailleurs.", "2) Les parts de marché s’érodent", "La compétitivité est en question.", "B. Une stratégie difficile à définir", "1) Ni offensive comme la Chine", "Ni défensive comme les États-Unis.", "2) Une coordination incomplète", "Les intérêts nationaux divergent.", "II. Mais un recul à relativiser", "A. Un phénomène largement mécanique", "1) Le rattrapage des émergents réduit toutes les parts", "Le recul est relatif, non absolu.", "2) Le niveau de vie reste élevé", "La richesse par habitant demeure forte.", "B. Des atouts conservés", "1) Un marché intérieur intégré", "Un pouvoir normatif réel.", "2) Une capacité de régulation", "Elle peut peser sur les règles mondiales."], "conclusion": "Le décrochage européen est réel dans les parts de marché et le poids relatif, mais il résulte largement du rattrapage des émergents. Ce qui fait défaut tient moins aux atouts économiques qu’à la définition d’une stratégie d’insertion claire."}, {"id": "ch21-20", "chapter": 21, "num": 20, "title": "Mondialisation et souveraineté économique sont-elles compatibles ?", "mobiliser": "2ᵉ année ch. 1 · 1ʳᵉ année ch. 9", "commentaire": "Sujet de synthèse du chapitre. Les dépendances des chaînes de valeur et l’arsenalisation en sont le cœur.", "intro": "La mondialisation a longtemps été pensée comme un jeu à somme positive. La révélation des dépendances critiques et l’usage des instruments économiques comme armes ont remis la souveraineté au centre du débat.", "problematique": "L’intégration internationale est-elle conciliable avec la maîtrise par un État de ses choix économiques ?", "plan": ["I. Une tension réelle", "A. Les dépendances contraignent", "1) Les chaînes de valeur créent des points de blocage", "Un intrant critique suffit.", "2) La mobilité du capital limite les marges de manœuvre", "La compétition fiscale s’impose.", "B. L’économie devient une arme", "1) Sanctions et contrôles des exportations", "L’arsenalisation se généralise.", "2) L’interdépendance se retourne", "Elle devient un levier de puissance.", "II. Mais une conciliation possible", "A. Des instruments de reprise en main", "1) Relocalisation de productions stratégiques", "La sécurité prime sur le coût.", "2) Politique industrielle et normes", "L’État garde des leviers.", "B. Un arbitrage à assumer", "1) L’autarcie a montré ses limites", "Les stratégies fermées ont échoué.", "2) La souveraineté est sélective", "Elle porte sur les secteurs critiques."], "conclusion": "La mondialisation restreint la souveraineté économique en créant des dépendances et en mettant les territoires en concurrence. Mais la réponse n’est pas la fermeture, dont l’échec est documenté : elle réside dans une souveraineté sélective, concentrée sur les secteurs véritablement critiques."}], "card": "<div class=\"cc cc-annee2\" data-c=\"21\" onclick=\"openCh(21)\"><div class=\"cc-num\">// DEUXIÈME ANNÉE · CHAPITRE 01</div><div class=\"cc-title\">Mondialisation, ouverture internationale et déséquilibres extérieurs</div><div class=\"cc-desc\">Les trois dimensions de l’ouverture, les configurations de Michalet, les asymétries centre / périphérie, la courbe de l’éléphant, la balance des paiements, le commerce en valeur ajoutée, les chaînes de valeur mondiales et l’histoire des mondialisations.</div><div class=\"cc-tags\"><span class=\"tag tag-a2\">2ᵉ année</span><span class=\"tag\">Mondialisation</span><span class=\"tag\">Balance des paiements</span><span class=\"tag\">Inégalités</span></div><div class=\"cc-btns\"><button class=\"btn btn-p\" onclick=\"event.stopPropagation();openCh(21)\">📖 Cours</button><button class=\"btn btn-g\" onclick=\"event.stopPropagation();startQuiz(21)\">🎯 Quiz IA</button></div></div>"};var K = String(D.key);

function applyContent(){

  try{ if(typeof CH_CONTEXT !== 'undefined' && !CH_CONTEXT[D.key]) CH_CONTEXT[D.key] = D.ctx; }catch(e){}
  try{ if(typeof MAP_DATA   !== 'undefined' && !MAP_DATA[D.key])   MAP_DATA[D.key]   = D.map; }catch(e){}
  try{
    if(typeof SUBJECTS_BANK_PREMIUM !== 'undefined' && !SUBJECTS_BANK_PREMIUM.some(function(s){return s.chapter===D.key;})){
      D.subjects.forEach(function(s){ SUBJECTS_BANK_PREMIUM.push(s); });
    }
  }catch(e){}
  try{ var QB = window.ECOSPHERE_QUESTION_BANK; if(QB && !QB[K]) QB[K] = D.quiz; }catch(e){}
  try{
    var AB = window.__ECO_ADV_ALL_BANK;
    if(AB && Array.isArray(AB) && !AB.some(function(q){return q.ch===D.key;})){
      D.adv.forEach(function(q){ AB.push(q); });
    }
  }catch(e){}
}
applyContent();
var RE = new RegExp('\\bchapitres?\\s*0*' + D.key + '\\b', 'gi');
function relabelNode(root){
  if(!root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  var cibles = [];
  while((n = w.nextNode())) if(RE.test(n.nodeValue)) cibles.push(n);
  cibles.forEach(function(t){
    t.nodeValue = t.nodeValue.replace(RE, function(m){
      return m === m.toUpperCase() ? D.label.toUpperCase() : D.label;
    });
  });
}
var enCours = false;
function relabelAll(){
  if(enCours) return;
  enCours = true;
  try{ relabelAllInner(); } finally { enCours = false; }
}
function relabelAllInner(){
  ['#pg-chapter','#pg-quiz','#pg-maps','#pg-subjects','#pg-search','#pg-home','#pg-fc','#pg-prog','#pg-graphs']
    .forEach(function(sel){ try{ relabelNode(document.querySelector(sel)); }catch(e){} });
}
function surveiller(){
  if(!window.MutationObserver) return;
  ['#pg-quiz','#pg-chapter','#pg-search','#pg-maps','#pg-subjects','#pg-home','#pg-prog','#pg-fc']
    .forEach(function(sel){
      var el = document.querySelector(sel);
      if(!el || el.__a2obs) return;
      el.__a2obs = true;
      var mo = new MutationObserver(function(){
        if(enCours) return;
        enCours = true;
        try{ relabelNode(el); } finally { enCours = false; }
      });
      try{ mo.observe(el, {childList:true, subtree:true, characterData:true}); }catch(e){}
    });
}
function badgeChapitre(){
  var h = document.querySelector('#pg-chapter .ch-title, #pg-chapter h1, #pg-chapter .chapter-title');
  if(h && !h.querySelector('.a2-badge') && RE.test(h.textContent + ' ')){
    h.insertAdjacentHTML('afterbegin', '<span class="a2-badge">2ᵉ année</span>');
  }
}
function addCard(){
  var grid = document.querySelector('.cg');
  if(grid && !grid.querySelector('[data-c="' + K + '"]')) grid.insertAdjacentHTML('beforeend', D.card);
}
function addQuizButton(){
  var grid = document.querySelector('.quiz-options-grid');
  if(grid && grid.innerText.indexOf('2ᵉ année') === -1){
    var html = '<button class="qo-btn" onclick="startQuiz(' + D.key + ')">2ᵉ année — Ch. 1<span>Mondialisation</span></button>';
    var btns = [].slice.call(grid.querySelectorAll('.qo-btn'));
    var last = btns.filter(function(b){ return /Chapitre \d+/.test(b.textContent); }).pop();
    if(last) last.insertAdjacentHTML('afterend', html);
    else grid.insertAdjacentHTML('beforeend', html);
  }
}
function extendSubjects(){
  var tabs = document.getElementById('subjTabsPremium');
  if(tabs && tabs.textContent.indexOf('2ᵉ année') === -1){
    tabs.insertAdjacentHTML('beforeend',
      '<button class="subj-tab' + (window.currentSubjChapter===D.key?' on':'') +
      '" onclick="setSubjectChapterPremium(' + D.key + ')">2ᵉ année — Ch. 1</button>');
  }
  var grid = document.getElementById('subjChaptersPremium');
  if(grid && grid.children.length && !grid.querySelector('[data-a2ch1]')){
    grid.insertAdjacentHTML('beforeend',
      '<div class="subj-ch-card" data-a2ch1="1" onclick="setSubjectChapterPremium(' + D.key + ')">' +
      '<div class="subj-ch-num"><span class="a2-badge">2ᵉ année</span>Chapitre 1</div>' +
      '<div class="subj-ch-title">Sujets corrigés</div>' +
      '<div class="subj-ch-count">' + D.subjects.length + ' dissertations corrigées</div></div>');
  }
}
if(typeof window.renderSubjectsPremium === 'function'){
  var oldRSP = window.renderSubjectsPremium;
  window.renderSubjectsPremium = function(){
    var r = oldRSP.apply(this, arguments);
    try{ extendSubjects(); relabelNode(document.querySelector('#pg-subjects')); }catch(e){}
    return r;
  };
}
if(typeof window.openCh === 'function'){
  var oldOpenCh = window.openCh;
  window.openCh = function(n){
    var r = oldOpenCh.apply(this, arguments);
    setTimeout(function(){
      try{
        if(String(n) === K){
          var c = document.getElementById('sect-cours');
          if(c && (!c.innerHTML || c.innerHTML.length < 1000)) c.innerHTML = D.cours;
        }
        relabelNode(document.querySelector('#pg-chapter'));
        badgeChapitre();
      }catch(e){}
    }, 0);
    return r;
  };
}
if(typeof window.renderMaps === 'function'){
  var oldRM = window.renderMaps;
  window.renderMaps = function(){
    var r = oldRM.apply(this, arguments);
    try{ relabelNode(document.querySelector('#pg-maps')); }catch(e){}
    return r;
  };
}
if(typeof window.doSearch === 'function'){
  var oldDS = window.doSearch;
  window.doSearch = function(){
    var r = oldDS.apply(this, arguments);
    try{ relabelNode(document.getElementById('search-res')); }catch(e){}
    return r;
  };
}
if(typeof window.showPg === 'function'){
  var oldShowPg = window.showPg;
  window.showPg = function(pg){
    var r = oldShowPg.apply(this, arguments);
    try{
      if(pg==='subjects') setTimeout(extendSubjects, 0);
      if(pg==='quiz')     setTimeout(addQuizButton, 0);
      if(pg==='home')     setTimeout(addCard, 0);
      setTimeout(relabelAll, 90);
    }catch(e){}
    return r;
  };
}
function refreshIndex(){
  try{ if(typeof rebuildSearchIndex === 'function') rebuildSearchIndex(); }catch(e){}
  try{ if(typeof buildFC === 'function') buildFC(); }catch(e){}
}
function boot(){
  applyContent(); addCard(); addQuizButton(); extendSubjects(); refreshIndex();
  surveiller(); relabelAll();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
setTimeout(boot, 800);
setTimeout(boot, 1800);
setTimeout(function(){ relabelAll(); }, 3000);
setTimeout(function(){ relabelAll(); }, 4500);
})();
</script>
