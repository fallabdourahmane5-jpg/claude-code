tage débiteur vis-à-vis du reste du monde.</p>\n<h4>Exemple français</h4>\n<p>Une part importante de la dette française est détenue par :</p>\n<p>👉 des non-résidents.</p>\n<p>Cl</p>\n<p>L’accumulation des déficits courants augmente les engagements de la nation envers le reste du monde et dégrade sa position extérieure nette.</p>\n<ul><li>La question devient donc : comment continuer à attirer ces capitaux ?</li><li>Pour financer son déficit, un pays doit rester attractif</li><li>Attirer des IDE</li></ul>\n<p>Il faut notamment :</p>\n<ul><li>infrastructures de qualité ;</li><li>stabilité politique ;</li><li>sécurité juridique ;</li><li>fiscalité attractive ;</li><li>marché intéressant ;</li><li>main-d’œuvre compétente.</li></ul>\n<h4>Logique</h4>\n<p>attractivité du territoire → IDE entrants.</p>\n<h3>AB. Attirer des investissements de portefeuille</h3>\n<p>Les investisseurs recherchent :</p>\n<p>👉 un bon couple rendement / risque.</p>\n<p>Donc le pays doit proposer :</p>\n<ul><li>actifs sûrs ;</li><li>rendements intéressants ;</li><li>taux d’intérêt suffisamment attractifs.</li></ul>\n<p>Cl</p>\n<p>Le financement d’un déficit extérieur dépend de l’attractivité du pays, que celle-ci repose sur ses perspectives productives pour les IDE ou sur le couple rendement-risque de ses actifs financiers.</p>\n<p>Mais cette dépendance peut devenir dangereuse si les investisseurs changent brutalement de comportement.</p>\n<h3>AC. Le risque de sudden stop</h3>\n<p>Un sudden stop correspond à un arrêt brutal des entrées de capitaux étrangers.</p>\n<p>Cela peut être accompagné de :</p>\n<p>👉 sorties massives de capitaux.</p>\n<h4>Pourquoi ?</h4>\n<ul><li>crise politique ;</li><li>perte de confiance ;</li><li>hausse du risque ;</li><li>meilleur rendement ailleurs ;</li><li>modification des taux d’intérêt internationaux.</li></ul>\n<p>Cl</p>\n<p>Un sudden stop désigne un arrêt brutal des entrées de capitaux étrangers, susceptible de provoquer une crise de financement dans une économie dépendante des capitaux extérieurs.</p>\n<p>Ce risque est particulièrement fort quand les acteurs domestiques se sont endettés dans une devise étrangère.</p>\n<h3>AD. Le danger de la dette en devises</h3>\n<p>Supposons qu’un pays emprunte en :</p>\n<p>👉 dollars.</p>\n<p>Mais ses revenus sont en :</p>\n<p>👉 monnaie nationale.</p>\n<p>Si sa monnaie se déprécie :</p>\n<ul><li>la dette en dollars devient beaucoup plus lourde en monnaie nationale.</li></ul>\n<h4>Mécanisme</h4>\n<p>monnaie nationale ↓ → valeur de la dette en dollars ↑ → difficultés de remboursement ↑.</p>\n<h4>Idée</h4>\n<p>L’endettement en devises accroît la vulnérabilité extérieure car une dépréciation de la monnaie nationale augmente mécaniquement le poids réel de la dette étrangère.</p>\n<p>Pourtant, malgré tous ces risques, un déficit extérieur peut parfois être parfaitement normal.</p>\n<h3>AE. Pourquoi un déficit courant n’est-il pas nécessairement mauvais ?</h3>\n<h3>AF. Premier cas : le déficit est temporaire</h3>\n<p>Un déficit ponctuel peut être provoqué par :</p>\n<ul><li>hausse temporaire du prix du pétrole ;</li><li>choc géopolitique ;</li><li>crise énergétique ;</li><li>événement exceptionnel.</li></ul>\n<h4>Exemple</h4>\n<p>Une facture énergétique s’envole brutalement.</p>\n<p>Importations en valeur ↑ → déficit courant.</p>\n<p>Mais si le choc disparaît :</p>\n<p>👉 déficit peut se résorber.</p>\n<p>Cl</p>\n<p>Un déficit courant ponctuel n’est pas nécessairement préoccupant lorsqu’il résulte d’un choc temporaire, comme une hausse exceptionnelle de la facture énergétique.</p>\n<p>Plus profondément, un déficit peut même être associé à une dynamique économique positive.</p>\n<h3>AG. Un déficit peut révéler un investissement élevé</h3>\n<p>Rappel :</p>\n<ul><li>X − M = (S − I) + (T − G)</li><li>Supposons le budget public équilibré.</li></ul>\n<p>Si :</p>\n<ul><li>X − M &lt; 0</li><li>alors :</li><li>S − I &lt; 0</li><li><strong>donc</strong> :</li><li>I &gt; S</li><li>Le pays investit davantage qu’il n’épargne.</li></ul>\n<p>Cela peut être :</p>\n<p>👉 une très bonne nouvelle.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’il finance :</p>\n<ul><li>infrastructures ;</li><li>usines ;</li><li>éducation ;</li><li>industrialisation ;</li><li>croissance future.</li></ul>\n<h4>Idée</h4>\n<p>Un déficit extérieur peut être le signe d’un fort dynamisme d’investissement lorsque celui-ci dépasse temporairement l’épargne domestique et nécessite le recours à l’épargne étrangère.</p>\n<p>Cette situation est particulièrement fréquente au début du développement économique.</p>\n<h3>AH. Nurkse : la faiblesse de l’épargne peut bloquer le développement</h3>\n<h3>AI. Le cercle vicieux de la pauvreté</h3>\n<h4>Formule célèbre</h4>\n<h4>« Un pays est pauvre parce qu’il est pauvre. »</h4>\n<p>Pour Nurkse, la faiblesse des revenus réduit l’épargne disponible, ce qui limite l’investissement et empêche les gains de productivité nécessaires au développement.</p>\n<p>Le problème est alors de trouver une source de financement extérieure.</p>\n<h3>AJ. Rostow : le take-off nécessite un fort taux d’investissement</h3>\n<h4>Rostow</h4>\n<p>Le take-off correspond au :</p>\n<p>👉 décollage économique.</p>\n<p>Selon lui un taux d’investissement élevé, autour de :</p>\n<p>👉 15 % du PIB dans l’ordre de grandeur évoqué.</p>\n<p>Mais si :</p>\n<ul><li>épargne nationale trop faible → investissement impossible.</li></ul>\n<h4>Solution</h4>\n<p>👉 attirer l’épargne étrangère.</p>\n<p>Cl</p>\n<p>Le décollage économique suppose une hausse forte de l’investissement ; lorsque l’épargne domestique est insuffisante, le financement extérieur peut donc jouer un rôle décisif dans le take-off.</p>\n<p>C’est précisément ce que permet la globalisation financière.</p>\n<h3>AK. La globalisation financière peut casser le cercle vicieux de Nurkse</h3>\n<p>La globalisation financière permet :</p>\n<p>👉 aux capitaux de circuler entre pays.</p>\n<p>Donc un pays avec :</p>\n<ul><li>faible épargne ;</li><li>fort besoin d’investissement ;</li><li>peut recevoir :</li></ul>\n<p>👉 l’épargne du reste du monde.</p>\n<h4>Mécanisme</h4>\n<h4>épargne domestique faible</h4>\n<p>capitaux étrangers → investissement ↑ → productivité ↑ → croissance ↑.</p>\n<h4>Exemples</h4>\n<p>pays d’Amérique latine.</p>\n<p>Cl</p>\n<p>La mobilité internationale des capitaux peut permettre à une économie pauvre de dépasser la contrainte d’épargne domestique en finançant son développement par l’épargne du reste du monde.</p>\n<p>L’exemple historique du recyclage des pétrodollars illustre parfaitement ce mécanisme.</p>\n<h3>AL. Le recyclage des pétrodollars dans les années 1970</h3>\n<h3>AM. Le choc pétrolier enrichit les pays exportateurs de pétrole</h3>\n<p>Dans les années 1970 :</p>\n<ul><li>prix du pétrole ↑ fortement.</li></ul>\n<p>Les pays de l’OPEP enregistrent :</p>\n<p>👉 d’importants excédents courants.</p>\n<p>Donc :</p>\n<p>👉 accumulation de capitaux.</p>\n<p>Cette manne financière est souvent appelée :</p>\n<p>👉 pétrodollars.</p>\n<p>Mais leurs systèmes financiers domestiques ne peuvent pas absorber toute cette épargne.</p>\n<h3>AN. Les capitaux sont placés dans les banques occidentales</h3>\n<p>Les grandes banques :</p>\n<ul><li>américaines ;</li><li>européennes ;</li><li>récupèrent cette épargne.</li></ul>\n<p>Puis elles cherchent :</p>\n<p>👉 où la placer avec rendement.</p>\n<p>Les capitaux sont alors prêtés à :</p>\n<ul><li>pays d’Amérique latine ;</li><li>économies émergentes ;</li><li>pays en développement.</li></ul>\n<h4>Mécanisme</h4>\n<p>OPEP → excédents → banques occidentales → prêts aux PED.</p>\n<p>C’est :</p>\n<p>👉 le recyclage des pétrodollars.</p>\n<p>Cl</p>\n<p>Le recyclage des pétrodollars désigne la réorientation des excédents financiers des pays exportateurs de pétrole vers les banques occidentales, puis vers les économies en développement à la recherche de financements.</p>\n<p>Ce financement extérieur soutient d’abord fortement le développement.</p>\n<h3>AO. Le financement extérieur fonctionne… jusqu’au retournement des conditions financières</h3>\n<p>Les PED :</p>\n<ul><li>disposent de peu d’épargne ;</li><li>veulent beaucoup investir ;</li><li>empruntent à l’étranger.</li></ul>\n<p>Au départ :</p>\n<p>👉 cela soutient leur croissance.</p>\n<p>Mais ils deviennent :</p>\n<p>👉 dépendants des conditions financières internationales.</p>\n<p>Cl</p>\n<p>Le recours aux capitaux étrangers permet de financer le développement, mais il expose les économies bénéficiaires aux retournements des taux d’intérêt et des flux financiers internationaux.</p>\n<p>Le retournement majeur intervient avec Paul Volcker à la tête de la Fed.</p>\n<h3>AP. Le choc Volcker et la crise de la dette latino-américaine</h3>\n<h3>AQ. Paul Volcker arrive à la Fed en 1979</h3>\n<p>Contexte :</p>\n<p>👉 inflation élevée.</p>\n<p>Pour lutter contre l’inflation :</p>\n<p>👉 la Fed augmente fortement les taux d’intérêt.</p>\n<h4>Mécanisme</h4>\n<p>taux américains ↑ → placements américains plus attractifs.</p>\n<p>Les capitaux mondiaux commencent alors à revenir massivement vers les États-Unis.</p>\n<h3>AR. Les États-Unis deviennent une « pompe aspirante » à capitaux</h3>\n<p>Les investisseurs se disent :</p>\n<div class=\"alertb\"><p>👉 pourquoi placer dans un PED risqué si les États-Unis offrent désormais un rendement élevé ?</p></div>\n<p>Donc :</p>\n<ul><li>capitaux quittent les économies émergentes → capitaux retournent vers les États-Unis.</li></ul>\n<h4>Conséquence</h4>\n<p>Les PED qui dépendaient de ces entrées connaissent :</p>\n<p>👉 un sudden stop.</p>\n<p>Le Mexique est l’un des premiers pays à entrer en crise.</p>\n<h3>AS. La crise mexicaine de 1982</h3>\n<p>Le Mexique :</p>\n<ul><li>possède un déficit extérieur ;</li><li>s’est endetté en dollars ;</li><li>dépend des capitaux étrangers.</li></ul>\n<p>Mais :</p>\n<ul><li>entrées de capitaux ↓</li><li>taux d’intérêt ↑</li><li>dette en dollars lourde.</li></ul>\n<p>Résultat :</p>\n<p>👉 incapacité à financer et rembourser normalement sa dette.</p>\n<p>C’est le début de :</p>\n<p>👉 la crise de la dette latino-américaine.</p>\n<p>Cl</p>\n<p>Le resserrement monétaire de Volcker transforme la dépendance financière des économies latino-américaines en crise de dette : les capitaux repartent vers les États-Unis tandis que le coût des dettes libellées en dollars explose.</p>\n<p>Cette expérience montre que le déficit courant d’un pays en développement peut être normal au début de son rattrapage, mais seulement si son financement reste soutenable.</p>\n<h3>AT. La bonne question : pourquoi le pays est-il en déficit ?</h3>\n<p>Il faut toujours distinguer plusieurs situations.</p>\n<h4>Déficit inquiétant</h4>\n<p>S’il vient de :</p>\n<ul><li>manque de compétitivité ;</li><li>désindustrialisation ;</li><li>consommation excessive ;</li><li>déficit public chronique ;</li><li>dépendance énergétique ;</li><li>dette extérieure excessive.</li></ul>\n<p>👉 problème structurel.</p>\n<h4>Déficit moins inquiétant</h4>\n<p>S’il vient de :</p>\n<ul><li>choc temporaire ;</li><li>fort investissement productif ;</li><li>phase de rattrapage ;</li><li>financement d’infrastructures.</li></ul>\n<p>👉 peut être normal, voire positif.</p>\n<p>Cl</p>\n<p>L’interprétation d’un déficit courant doit donc porter sur son origine : un déficit de consommation et de désindustrialisation est plus préoccupant qu’un déficit destiné à financer une accumulation productive et le rattrapage économique.</p>\n<h3>AU. Et inversement : un excédent n’est pas toujours une bonne nouvelle</h3>\n<p>Un excédent courant signifie :</p>\n<p>👉 S &gt; I, toutes choses égales par ailleurs.</p>\n<p>Cela peut être positif :</p>\n<ul><li>compétitivité forte ;</li><li>exportations dynamiques.</li></ul>\n<p>Mais cela peut aussi révéler :</p>\n<p>👉 un investissement domestique insuffisant.</p>\n<p>Le pays épargne beaucoup, mais n’investit pas assez chez lui.</p>\n<h4>Idée centrale</h4>\n<p>Un excédent peut donc signifier :</p>\n<p>👉 sous-investissement domestique.</p>\n<p>Cl</p>\n<p>Un excédent courant ne constitue pas automatiquement un signe de bonne santé : il peut aussi refléter une épargne excessive relativement à un investissement domestique insuffisant.</p>\n<h3>AV. Conclusion</h3>\n<p>Un déficit courant ne doit jamais être interprété mécaniquement.</p>\n<p>Il peut signaler :</p>\n<ul><li>perte de compétitivité ;</li><li>désindustrialisation ;</li><li>dépendance énergétique ;</li><li>déficit public chronique ;</li><li>dépendance aux capitaux étrangers.</li><li>Dans ce cas, il est préoccupant.</li></ul>\n<p>Mais il peut aussi correspondre :</p>\n<ul><li>à un choc temporaire ;</li><li>à un fort investissement ;</li><li>à une phase normale de développement.</li></ul>\n<p>Pour les pays pauvres, la mobilité internationale des capitaux peut même permettre de dépasser le cercle vicieux de Nurkse et de financer le take-off de Rostow.</p>\n<p>Cependant, cette dépendance au financement extérieur crée une vulnérabilité majeure :</p>\n<p>👉 le risque de sudden stop.</p>\n<p>L’expérience latino-américaine après le choc Volcker montre ainsi que les capitaux étrangers peuvent accélérer le développement, mais aussi transformer brutalement un déficit soutenable en crise de dette.</p>\n<h4>Idée</h4>\n<p>Un déficit courant ne constitue donc pas en lui-même un indicateur suffisant de fragilité : il devient préoccupant lorsqu’il finance une consommation ou des déséquilibres structurels plutôt qu’un investissement productif, et surtout lorsque son financement dépend de capitaux étrangers instables susceptibles de provoquer un sudden stop.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>VIII. Les déséquilibres extérieurs mondiaux : pourquoi inquiètent-ils ?</h2>\n<p>Pourquoi les déficits et excédents courants sont-ils devenus un problème collectif au niveau mondial ?</p>\n<h3>A. Idée générale</h3>\n<p>Un déficit n’est pas toujours « mauvais » et un excédent n’est pas toujours « bon ».</p>\n<p>Le vrai problème apparaît lorsque les déséquilibres :</p>\n<ul><li>sont durables ;</li><li>deviennent très importants ;</li><li>traduisent des stratégies de croissance déséquilibrées ;</li><li>créent des dépendances financières ;</li><li>alimentent les tensions commerciales ;</li><li>augmentent le risque de crise.</li></ul>\n<p>On parle alors de :</p>\n<p>👉 déséquilibres extérieurs mondiauxou👉 global imbalances.</p>\n<h4>Idée centrale</h4>\n<p>Ces déséquilibres ne sont pas simplement les problèmes isolés de certains pays.</p>\n<p>Ils sont liés entre eux :</p>\n<ul><li>le déficit des uns correspond à la capacité de financement des autres ;</li><li>les flux de capitaux permettent à ces déséquilibres de durer ;</li><li>ils peuvent donc créer un risque systémique.</li></ul>\n<p>Cl</p>\n<p>Les déséquilibres extérieurs deviennent un problème collectif lorsqu’ils reflètent des stratégies de croissance durablement déséquilibrées et qu’ils sont entretenus par des flux internationaux de capitaux susceptibles de provoquer des fragilités financières et des tensions géopolitiques.</p>\n<p>Avant de comprendre pourquoi ils inquiètent aujourd’hui, il faut rappeler qu’un excédent courant lui-même peut être le symptôme d’un déséquilibre interne.</p>\n<h3>B. Un excédent courant n’est pas forcément une bonne nouvelle</h3>\n<h3>C. Le cas de la zone euro</h3>\n<p>La zone euro présente depuis plusieurs années un :</p>\n<p>👉 excédent courant important.</p>\n<p>Hors années exceptionnelles, cet excédent a souvent dépassé :</p>\n<p>👉 environ 3 % du PIB de la zone euro.</p>\n<p>A priori, on pourrait penser :</p>\n<ul><li>exportations &gt; importations → économie compétitive → bonne nouvelle.</li><li>Mais cette interprétation est trop simple.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’un excédent courant peut signifier :</p>\n<p>👉 épargne trop élevée par rapport à l’investissement.</p>\n<p>Rappel :</p>\n<ul><li>X − M = (S − I) + (T − G)</li><li>Si le solde extérieur est très positif, cela peut refléter :</li></ul>\n<p>👉 S &gt; I.</p>\n<p>Donc :</p>\n<p>👉 une partie de l’épargne n’est pas investie sur le territoire.</p>\n<p>Cl</p>\n<p>Un excédent courant peut révéler une forte compétitivité, mais également un sous-investissement domestique lorsque l’épargne excède durablement l’investissement.</p>\n<p>Le cas allemand illustre particulièrement bien ce problème.</p>\n<h3>D. L’Allemagne : un excédent élevé qui révèle un sous-investissement</h3>\n<h3>E. Une forte épargne</h3>\n<p>L’Allemagne présente traditionnellement :</p>\n<p>👉 une épargne élevée.</p>\n<p>Plusieurs facteurs l’expliquent :</p>\n<ul><li>vieillissement de la population ;</li><li>comportement prudent des ménages ;</li><li>réformes de la protection sociale ;</li><li>anticipation de dépenses futures.</li></ul>\n<h4>Idée essentielle</h4>\n<p>Quand la protection sociale devient moins généreuse :</p>\n<p>👉 les ménages peuvent augmenter leur épargne de précaution.</p>\n<p>Mais le problème principal se trouve du côté de l’investissement.</p>\n<h3>F. Un investissement insuffisant</h3>\n<p>L’investissement public allemand a longtemps été faible.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que l’Allemagne s’inscrit dans une tradition :</p>\n<p>👉 ordolibérale.</p>\n<p>Cela signifie notamment :</p>\n<ul><li>importance de la discipline budgétaire ;</li><li>méfiance vis-à-vis des déficits publics ;</li><li>priorité donnée à l’équilibre des finances publiques.</li></ul>\n<p>Résultat :</p>\n<p>👉 certaines infrastructures ont été insuffisamment modernisées.</p>\n<p>On insiste aussi sur :</p>\n<ul><li>un retard numérique ;</li><li>un investissement privé trop faible ;</li><li>une spécialisation encore très liée aux technologies de la deuxième révolution industrielle.</li></ul>\n<h4>Idée</h4>\n<p>L’excédent courant allemand doit être nuancé car il reflète en partie une épargne élevée associée à un investissement public et privé insuffisant.</p>\n<p>C’est précisément pour corriger ce sous-investissement que l’Allemagne cherche désormais à relancer fortement l’investissement.</p>\n<h3>G. Le retour de l’investissement allemand</h3>\n<p>L’Allemagne cherche à assouplir ses contraintes budgétaires pour financer :</p>\n<ul><li>infrastructures ;</li><li>transition énergétique ;</li><li>autonomie stratégique ;</li><li>défense.</li></ul>\n<p>On évoque notamment :</p>\n<p>👉 un vaste plan d’investissement de l’ordre de 500 milliards d’euros.</p>\n<h4>Idée centrale</h4>\n<p>L’objectif est de réduire :</p>\n<p>👉 l’écart entre épargne et investissement.</p>\n<p>Donc potentiellement :</p>\n<p>👉 de réduire l’excédent courant.</p>\n<div class=\"db\"><div class=\"dt\">La même logique vaut à l’échelle mondiale</div><div class=\"dd\">les principaux déséquilibres traduisent des modèles de croissance différents mais eux-mêmes déséquilibrés.</div></div>\n<h3>H. Hélène Rey : les déséquilibres mondiaux reflètent des stratégies de croissance déséquilibrées</h3>\n<p>L’idée essentielle est que les déséquilibres mondiaux excessifs sont la conséquence de :</p>\n<p>👉 stratégies nationales de croissance elles-mêmes déséquilibrées.</p>\n<p>Les principales zones concernées sont :</p>\n<ul><li>États-Unis ;</li><li>Chine ;</li><li>Union européenne ;</li><li>pays exportateurs de pétrole.</li></ul>\n<p>Cl</p>\n<p>Selon Hélène Rey, les déséquilibres extérieurs mondiaux ne sont pas de simples anomalies comptables : ils reflètent les faiblesses structurelles des modèles de croissance nationaux.</p>\n<p>Ces faiblesses prennent des formes différentes selon les économies.</p>\n<h3>I. Les États-Unis : une croissance soutenue par le déficit et l’épargne étrangère</h3>\n<h3>J. Un déficit public massif</h3>\n<p>Les États-Unis ont un déficit public proche de :</p>\n<p>👉 6 % du PIB dans l’ordre de grandeur du cours.</p>\n<p>Cela signifie :</p>\n<ul><li>G &gt; T.</li></ul>\n<p>Donc :</p>\n<ul><li>T − G &lt; 0.</li></ul>\n<p>Ce déficit contribue directement :</p>\n<p>👉 au déficit extérieur.</p>\n<h3>K. Un investissement supérieur à l’épargne</h3>\n<p>Le déficit américain reflète une croissance fondée sur une forte demande intérieure, un déficit public élevé et un investissement supérieur à l’épargne nationale, ce qui rend nécessaire l’entrée de capitaux étrangers.</p>\n<div class=\"db\"><div class=\"dt\">La Chine se situe à l’opposé</div><div class=\"dd\">elle épargne énormément et produit davantage que sa demande interne ne peut absorber.</div></div>\n<h3>L. La Chine : surépargne, surinvestissement et surcapacités</h3>\n<h3>M. Un taux d’épargne extrêmement élevé</h3>\n<p>On retient un taux d’épargne des ménages chinois dépassant :</p>\n<p>👉 40 % du revenu disponible.</p>\n<p>C’est exceptionnellement élevé.</p>\n<h4>Pourquoi ?</h4>\n<p>Trois grandes raisons sont avancées.</p>\n<h4>Première raison : l’épargne de précaution</h4>\n<p>La protection sociale chinoise est relativement moins développée que dans les économies occidentales.</p>\n<p>Les ménages épargnent donc pour :</p>\n<ul><li>santé ;</li><li>retraite ;</li><li>chômage ;</li><li>dépenses futures.</li></ul>\n<h4>Mécanisme</h4>\n<p>protection sociale faible → incertitude ↑ → épargne de précaution ↑.</p>\n<p>Cl</p>\n<p>La faiblesse relative de la protection sociale chinoise encourage une forte épargne de précaution des ménages.</p>\n<p>Le facteur démographique renforce cette tendance.</p>\n<h4>Deuxième raison : le déséquilibre démographique</h4>\n<p>La politique de l’enfant unique a contribué à :</p>\n<p>👉 un déséquilibre entre hommes et femmes.</p>\n<p>Certaines familles ont accru leur épargne pour améliorer la position de leur fils sur le :</p>\n<p>👉 marché matrimonial.</p>\n<p>L’idée importante n’est pas le détail sociologique, mais le mécanisme :</p>\n<ul><li>déséquilibre démographique → comportements d’épargne plus élevés.</li></ul>\n<h4>Idée</h4>\n<p>Certains travaux relient également la forte épargne chinoise aux déséquilibres démographiques issus de la politique de l’enfant unique, qui ont renforcé les incitations patrimoniales des ménages.</p>\n<p>La crise immobilière a encore accentué la prudence des ménages.</p>\n<h4>Troisième raison : la crise immobilière</h4>\n<p>Depuis environ 2020 :</p>\n<ul><li>crise immobilière ;</li><li>difficultés de grands promoteurs ;</li><li>perte de valeur de certains investissements immobiliers.</li></ul>\n<p>Cela produit :</p>\n<p>👉 un effet richesse négatif.</p>\n<p>Les ménages ayant perdu une partie de leur patrimoine cherchent à :</p>\n<p>👉 reconstituer leur épargne.</p>\n<h4>Idée</h4>\n<p>La crise immobilière chinoise a renforcé l’épargne des ménages en provoquant un effet richesse négatif qui les incite à reconstituer leur patrimoine.</p>\n<p>Mais la Chine n’épargne pas seulement beaucoup : elle investit aussi énormément.</p>\n<h3>N. La Chine est en situation de surcapacité productive</h3>\n<h3>O. Un investissement productif massif</h3>\n<p>La Chine investit énormément dans :</p>\n<ul><li>industrie ;</li><li>technologies ;</li><li>infrastructures ;</li><li>capacités de production.</li></ul>\n<p>Le problème est que :</p>\n<p>👉 la demande interne ne progresse pas aussi vite.</p>\n<p>Donc :</p>\n<ul><li>capacités de production</li><li>consommation domestique.</li></ul>\n<p>C’est une situation de :</p>\n<p>👉 surcapacité productive.</p>\n<p>Cl</p>\n<p>La Chine combine un taux d’épargne très élevé et un investissement productif massif, au point que ses capacités de production dépassent les possibilités d’absorption de sa demande intérieure.</p>\n<p>Cette surcapacité produit deux conséquences importantes.</p>\n<h3>P. Première conséquence des surcapacités chinoises : la déflation</h3>\n<p>Quand l’offre est supérieure à la demande :</p>\n<p>👉 pression à la baisse sur les prix.</p>\n<p>Donc :</p>\n<ul><li>prix ↓.</li></ul>\n<p>C’est une situation de :</p>\n<p>👉 déflation.</p>\n<h4>Conséquence extérieure</h4>\n<p>prix chinois ↓ → compétitivité-prix ↑.</p>\n<p>Les produits chinois deviennent encore plus compétitifs sur les marchés internationaux.</p>\n<h4>Idée</h4>\n<p>Les surcapacités productives chinoises exercent une pression déflationniste sur les prix domestiques et renforcent par conséquent la compétitivité-prix des exportations chinoises.</p>\n<p>La seconde conséquence est encore plus directe sur la balance courante.</p>\n<h3>Q. Deuxième conséquence : la Chine doit exporter ses surplus</h3>\n<p>Si :</p>\n<ul><li>production &gt; demande intérieure,</li></ul>\n<p>alors une partie de la production doit être :</p>\n<p>👉 vendue à l’étranger.</p>\n<p>Donc :</p>\n<ul><li>exportations ↑.</li></ul>\n<p>Cela alimente :</p>\n<p>👉 les excédents courants chinois.</p>\n<h4>Mécanisme</h4>\n<p>surinvestissement → surcapacités → consommation interne insuffisante → exportations forcées → excédent courant ↑.</p>\n<h4>Idée</h4>\n<p>L’excédent chinois reflète en partie un modèle de croissance déséquilibré dans lequel la production progresse plus rapidement que la consommation intérieure, obligeant l’économie à exporter ses surplus.</p>\n<p>En théorie, un tel excédent devrait faire apprécier le yuan.</p>\n<h3>R. Le rôle du taux de change chinois</h3>\n<p>Un excédent courant important devrait normalement :</p>\n<p>→ augmenter la demande de yuan → faire apprécier le yuan.</p>\n<p>Mais la banque centrale chinoise peut intervenir sur le marché des changes pour :</p>\n<ul><li>La Chine limite l’appréciation spontanée de sa monnaie afin d’éviter qu’un yuan trop fort ne réduise la compétitivité de ses exportations.</li></ul>\n<div class=\"db\"><div class=\"dt\">L’Europe présente un autre modèle de déséquilibre</div><div class=\"dd\">une épargne relativement élevée mais un investissement insuffisant.</div></div>\n<h3>S. L’Union européenne : forte épargne et sous-investissement</h3>\n<p>L’excédent européen reflète moins une demande extérieure exceptionnelle qu’un écart persistant entre une épargne abondante et un investissement domestique insuffisant.</p>\n<p>Les remèdes théoriques sont donc connus et différents selon les zones.</p>\n<h3>T. Comment réduire les déséquilibres américains ?</h3>\n<p>Les économistes préconisent notamment :</p>\n<p>👉 un assainissement budgétaire.</p>\n<p>Cela peut passer par :</p>\n<ul><li>augmentation de certains impôts ;</li><li>réduction du déficit public ;</li><li>recettes fiscales supplémentaires.</li><li>Le cours mentionne notamment :</li><li>fiscalité progressive sur les revenus ;</li><li>mise en place éventuelle d’une TVA fédérale.</li></ul>\n<h4>Objectif</h4>\n<p>T ↑ → T − G moins négatif → déficit public ↓ → déficit courant ↓.</p>\n<p>Cl</p>\n<p>Pour réduire le déficit extérieur américain, le FMI préconise notamment un assainissement budgétaire visant à rapprocher les recettes publiques du niveau élevé des dépenses.</p>\n<p>La Chine doit au contraire stimuler davantage sa demande intérieure.</p>\n<h3>U. Comment rééquilibrer la croissance chinoise ?</h3>\n<p>Le rééquilibrage chinois suppose de réduire le poids de l’investissement productif et de renforcer la protection sociale ainsi que les services afin de stimuler la consommation intérieure.</p>\n<p>Pour l’Europe, la logique est exactement inverse : il faut investir davantage.</p>\n<h3>V. Comment réduire l’excédent européen ?</h3>\n<p>Le remède central :</p>\n<p>👉 augmenter l’investissement.</p>\n<p>Cela passe par :</p>\n<ul><li>développement du capital-risque ;</li><li>marché européen des capitaux plus intégré ;</li><li>unification des marchés de biens et services ;</li><li>investissement dans le numérique ;</li><li>investissement dans l’énergie ;</li><li>investissement dans la défense ;</li><li>attraction accrue des IDE.</li></ul>\n<h4>Rapport Draghi</h4>\n<p>Il insiste précisément sur :</p>\n<p>👉 le besoin d’investissement massif pour restaurer la compétitivité européenne.</p>\n<h4>Idée</h4>\n<p>Le rééquilibrage européen suppose de mobiliser davantage l’épargne domestique vers l’investissement productif grâce à des marchés de capitaux plus intégrés et à une politique d’investissement ambitieuse.</p>\n<p>Le problème est que ces politiques ne peuvent être menées efficacement de manière totalement indépendante.</p>\n<h3>W. Les déséquilibres mondiaux exigent une coordination internationale</h3>\n<p>Les déséquilibres sont :</p>\n<p>👉 interdépendants.</p>\n<p>Le déficit américain correspond en partie :</p>\n<p>👉 aux excédents d’autres pays.</p>\n<p>Si une seule zone ajuste brutalement :</p>\n<p>👉 elle peut supporter seule le coût de l’ajustement.</p>\n<p>Donc les économistes recommandent :</p>\n<p>👉 une correction coordonnée.</p>\n<h4>Idée</h4>\n<p>La réduction des déséquilibres mondiaux suppose une coordination internationale, car les déficits des uns correspondent nécessairement aux capacités de financement des autres.</p>\n<p>Mais cette coordination est aujourd’hui très difficile compte tenu des tensions géopolitiques.</p>\n<h3>X. Le problème : l’écart entre la solution économique et la réalité géopolitique</h3>\n<p>L’obstacle principal à la résorption des déséquilibres mondiaux est politique : les solutions économiques sont connues, mais elles supposent une coordination précisément rendue difficile par la fragmentation géopolitique actuelle.</p>\n<p>Ces déséquilibres sont rendus possibles par la circulation internationale des capitaux.</p>\n<h3>Y. Le haut et le bas de la balance des paiements se répondent</h3>\n<h3>Z. Déficit courant</h3>\n<p>déficit courant → besoin de financement → entrée nette de capitaux.</p>\n<h3>AA. Excédent courant</h3>\n<p>excédent courant → capacité de financement → sortie nette de capitaux.</p>\n<p>Le pays prête au reste du monde.</p>\n<h4>Idée</h4>\n<p>Les déséquilibres courants ont nécessairement une contrepartie financière : les économies déficitaires attirent les capitaux que les économies excédentaires placent à l’étranger.</p>\n<p>Une autre composante importante du compte financier concerne les réserves détenues par les banques centrales.</p>\n<h3>AB. Les avoirs de réserve</h3>\n<p>Les avoirs de réserve sont :</p>\n<p>👉 les réserves de devises détenues par les banques centrales.</p>\n<p>Exemples :</p>\n<ul><li>dollars ;</li><li>euros ;</li><li>yen ;</li><li>or selon la présentation plus large des réserves.</li></ul>\n<p>Ces réserves servent notamment à :</p>\n<ul><li>intervenir sur le marché des changes ;</li><li>payer des importations ;</li><li>faire face à une sortie de capitaux ;</li><li>assurer le service de la dette extérieure.</li></ul>\n<p>Cl</p>\n<p>Les réserves de change constituent un stock de devises mobilisable par la banque centrale pour faire face aux besoins de paiements extérieurs ou aux tensions financières.</p>\n<p>Le Mexique au début des années 1980 montre ce qui se passe lorsque ces réserves s’épuisent.</p>\n<h3>AC. Le Mexique : les réserves comme dernier amortisseur</h3>\n<p>Lors de la crise de 1982 :</p>\n<ul><li>fuite des capitaux ;</li><li>investissements de portefeuille sortent ;</li><li>déficit courant persiste ;</li><li>nouvelles entrées insuffisantes.</li></ul>\n<p>Dans un premier temps :</p>\n<p>👉 le Mexique utilise ses réserves de devises.</p>\n<p>Mais ces réserves sont :</p>\n<p>👉 limitées.</p>\n<p>Quand elles deviennent insuffisantes :</p>\n<p>→ incapacité de payer → cessation de paiement.</p>\n<h4>Conséquence</h4>\n<p>Besoin d’une aide internationale et d’une restructuration de la dette.</p>\n<p>Cl</p>\n<p>Lorsque les capitaux privés cessent d’entrer, les réserves de change peuvent temporairement financer le déficit extérieur, mais leur épuisement peut conduire à une crise de paiement.</p>\n<p>La situation inverse se rencontre dans les économies excédentaires qui accumulent des réserves et des actifs étrangers.</p>\n<h3>AD. Les excédents permettent l’accumulation de devises et de fonds souverains</h3>\n<h3>AE. Le cas chinois</h3>\n<p>Les excédents chinois des années 2000 entraînent :</p>\n<p>👉 accumulation de dollars.</p>\n<p>La Chine utilise ces capitaux notamment pour acheter :</p>\n<p>👉 des titres de dette américaine.</p>\n<h3>AF. Les fonds souverains</h3>\n<p>Les États disposant d’excédents importants peuvent créer des :</p>\n<p>👉 fonds souverains.</p>\n<p><strong>Exemples</strong> :</p>\n<ul><li>Qatar ;</li><li>Émirats arabes unis ;</li><li>Norvège ;</li><li>Chine.</li></ul>\n<p>Ces fonds investissent dans :</p>\n<ul><li>obligations ;</li><li>actions ;</li><li>immobilier ;</li><li>infrastructures ;</li><li>entreprises étrangères.</li></ul>\n<p>Cl</p>\n<p>Les excédents courants permettent aux États d’accumuler des actifs extérieurs, parfois gérés par des fonds souverains chargés de placer cette épargne sur les marchés internationaux.</p>\n<p>Cette mécanique repose entièrement sur la mondialisation financière.</p>\n<h3>AG. La mondialisation financière permet l’existence durable des déséquilibres extérieurs</h3>\n<p>La mondialisation financière correspond à la circulation internationale des capitaux.</p>\n<p>À partir des années 1980-1990, un vaste :</p>\n<p>👉 marché mondial des capitaux se met en place.</p>\n<h4>Sans mobilité des capitaux</h4>\n<p>Un pays devrait :</p>\n<ul><li>financer son investissement par son épargne domestique ;</li><li>financer ses dépenses publiques par ses recettes domestiques.</li></ul>\n<p>Donc les déséquilibres extérieurs seraient beaucoup plus difficiles à maintenir.</p>\n<h4>Avec mobilité des capitaux</h4>\n<p>Pays déficitaires → empruntent.</p>\n<p>Pays excédentaires → prêtent.</p>\n<h4>Idée</h4>\n<p>La globalisation financière permet la persistance des déséquilibres extérieurs en transférant l’épargne des pays en capacité de financement vers les économies en besoin de financement.</p>\n<p>Mais cette interconnexion transforme aussi les déséquilibres nationaux en risques collectifs.</p>\n<h3>AH. Pourquoi les déséquilibres mondiaux inquiètent-ils aujourd’hui ?</h3>\n<p>Trois grandes raisons.</p>\n<h3>AI. Première inquiétude : ils révèlent des fragilités internes</h3>\n<p>Chaque déséquilibre traduit un problème domestique.</p>\n<h4>États-Unis</h4>\n<ul><li>déficit public ;</li><li>faible épargne.</li></ul>\n<h4>Chine</h4>\n<ul><li>surépargne ;</li><li>surinvestissement ;</li><li>surcapacités ;</li><li>consommation insuffisante.</li></ul>\n<h4>Europe</h4>\n<p>sous-investissement.</p>\n<h4>Allemagne</h4>\n<ul><li>épargne forte ;</li><li>investissement insuffisant.</li></ul>\n<h4>Idée centrale</h4>\n<p>Les déséquilibres extérieurs sont :</p>\n<p>👉 les symptômes extérieurs de problèmes internes.</p>\n<p>Cl</p>\n<p>Les déséquilibres mondiaux inquiètent d’abord parce qu’ils révèlent des fragilités internes susceptibles de se transformer en crises économiques ou financières.</p>\n<p>L’expérience de 2008 renforce cette inquiétude.</p>\n<h3>AJ. Deuxième inquiétude : le précédent de 2008</h3>\n<p>Avant 2008 :</p>\n<p>👉 les déséquilibres mondiaux avaient fortement augmenté.</p>\n<p>Ils ont participé :</p>\n<p>👉 à la circulation internationale des capitaux ;</p>\n<p>et donc :</p>\n<p>👉 à la diffusion de la crise financière.</p>\n<h4>Idée</h4>\n<p>Une crise initialement localisée dans :</p>\n<p>👉 le marché américain des subprimes</p>\n<p>a fini par devenir :</p>\n<p>👉 une crise financière mondiale.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que les systèmes financiers étaient :</p>\n<p>👉 fortement interconnectés.</p>\n<p>Cl</p>\n<p>Le précédent de 2008 nourrit les inquiétudes actuelles : des déséquilibres extérieurs importants combinés à une forte intégration financière peuvent transformer une crise locale en crise mondiale.</p>\n<p>À cela s’ajoute aujourd’hui une dimension politique beaucoup plus forte.</p>\n<h3>AK. Troisième inquiétude : ils alimentent les tensions protectionnistes</h3>\n<p>Les déséquilibres extérieurs ont également une dimension géopolitique car ils alimentent les accusations de concurrence déloyale et favorisent le retour des politiques protectionnistes.</p>\n<p>C’est pourquoi ils redeviennent une priorité internationale.</p>\n<p>Les déséquilibres mondiaux n’ont pas encore retrouvé les niveaux observés avant 2008, mais leur réouverture depuis la fin des années 2010 suffit à raviver les inquiétudes sur la stabilité du système financier international.</p>\n<p>Ce qui est réellement nouveau aujourd’hui n’est donc pas l’identité des pays déficitaires ou excédentaires.</p>\n<p>La nouveauté se trouve plutôt dans la nature des capitaux qui les financent.</p>\n<h3>AL. Les nouveaux déséquilibres sont davantage financés par des capitaux privés</h3>\n<p>Avant :</p>\n<ul><li>une partie importante des flux provenait notamment :</li></ul>\n<p>👉 des réserves officielles et fonds souverains.</p>\n<p>Aujourd’hui, davantage de flux sont portés par :</p>\n<ul><li>fonds d’investissement ;</li><li>fonds de gestion ;</li><li>hedge funds ;</li><li>institutions financières non bancaires.</li></ul>\n<h4>Mot-clé</h4>\n<p>👉 institutions financières non bancaires.</p>\n<p>Cl</p>\n<p>La nouveauté des déséquilibres contemporains tient moins à leur géographie qu’à leur financement croissant par des acteurs financiers privés non bancaires.</p>\n<p>Cette évolution inquiète parce que ces acteurs ont un comportement différent des banques traditionnelles ou des fonds souverains.</p>\n<h3>AM. Pourquoi les institutions financières non bancaires inquiètent-elles ?</h3>\n<h3>AN. Une recherche de rendement plus forte</h3>\n<p>Ces acteurs recherchent souvent :</p>\n<p>👉 rendement élevé.</p>\n<p>Donc :</p>\n<p>👉 prise de risque plus importante.</p>\n<p>Ils peuvent investir dans :</p>\n<ul><li>actions technologiques ;</li><li>actifs spéculatifs ;</li><li>produits financiers complexes.</li></ul>\n<h3>AO. Une régulation moins stricte</h3>\n<p>Ils ne sont pas soumis exactement aux mêmes contraintes prudentielles que les banques.</p>\n<p>👉 ils sont moins directement encadrés par les dispositifs du type Bâle I, II, III.</p>\n<h4>Résultat</h4>\n<h4>risque ↑</h4>\n<p>interconnexion ↑ → vulnérabilité financière ↑.</p>\n<p>Cl</p>\n<p>Le financement croissant des déséquilibres par des institutions financières non bancaires inquiète car ces acteurs sont souvent plus enclins au risque et moins strictement encadrés par la réglementation prudentielle bancaire.</p>\n<p>Ce changement se combine à une interrogation nouvelle sur les actifs américains eux-mêmes.</p>\n<h3>AP. Les États-Unis fournissent traditionnellement l’actif sûr mondial</h3>\n<p>La capacité des États-Unis à fournir l’actif sûr mondial constitue l’un des fondements de leur aptitude à financer durablement leurs déficits extérieurs.</p>\n<p>Mais cette réputation commence à être davantage questionnée.</p>\n<h3>AQ. La soutenabilité de la dette américaine devient une source d’inquiétude</h3>\n<p>👉 dette publique américaine &gt; 120 % du PIB.</p>\n<p>Et certaines projections conduisent vers :</p>\n<p>👉 environ 140 % du PIB à horizon de quelques années.</p>\n<p>En parallèle :</p>\n<ul><li>déficit budgétaire élevé ;</li><li>déficit extérieur ;</li><li>possible dédollarisation partielle.</li></ul>\n<p>Donc la question devient :</p>\n<p>👉 les titres du Trésor américain resteront-ils toujours perçus comme totalement sûrs ?</p>\n<p>Cl</p>\n<p>L’augmentation rapide de la dette américaine commence à fragiliser l’idée selon laquelle les titres publics américains constituent sans discussion l’actif sûr mondial.</p>\n<p>D’autant que les capitaux privés ne se dirigent plus seulement vers les obligations publiques américaines.</p>\n<h3>AR. Les capitaux étrangers se dirigent de plus en plus vers les actions</h3>\n<p>Les investisseurs privés achètent davantage :</p>\n<p>👉 des actions américaines.</p>\n<p>Notamment dans :</p>\n<p>👉 les entreprises liées à l’intelligence artificielle.</p>\n<p>Cela renforce :</p>\n<ul><li>concentration financière ;</li><li>valorisations élevées ;</li><li>risque de bulle.</li></ul>\n<h4>Risque</h4>\n<p>Si :</p>\n<ul><li>bulle IA éclate,</li></ul>\n<p>alors :</p>\n<ul><li>pertes financières ;</li><li>sorties de capitaux ;</li><li>contagion internationale.</li></ul>\n<h4>Idée</h4>\n<p>La concentration croissante des flux internationaux sur les actions technologiques américaines accroît le risque systémique si les valorisations liées à l’intelligence artificielle se révèlent excessives.</p>\n<h3>AS. Conclusion</h3>\n<p>Les déséquilibres extérieurs doivent être interprétés avec prudence.</p>\n<p>Un déficit n’est pas automatiquement mauvais, tout comme un excédent n’est pas automatiquement positif.</p>\n<p>Les déséquilibres actuels révèlent surtout des modèles de croissance profondément différents :</p>\n<div class=\"db\"><div class=\"dt\">États-Unis</div><div class=\"dd\">déficit public et manque d’épargne ;</div></div>\n<div class=\"db\"><div class=\"dt\">Chine</div><div class=\"dd\">surépargne, surinvestissement et surcapacités ;</div></div>\n<div class=\"db\"><div class=\"dt\">Europe</div><div class=\"dd\">épargne élevée et sous-investissement.</div></div>\n<p>La mondialisation financière permet à ces modèles de coexister puisque l’épargne des pays excédentaires finance les pays déficitaires.</p>\n<p>Mais cette interdépendance crée aussi un risque collectif.</p>\n<p>La réouverture des global imbalances, leur financement croissant par des institutions financières non bancaires et la concentration des flux vers les actifs technologiques américains augmentent aujourd’hui les inquiétudes sur la stabilité du système financier mondial.</p>\n<h4>Idée</h4>\n<p>Les déséquilibres extérieurs contemporains sont moins préoccupants par leur niveau que par les fragilités internes qu’ils révèlent et par la nature de leur financement : dans un système financier mondialisé, l’accumulation de déficits et d’excédents peut transformer des déséquilibres nationaux en risque systémique mondial.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>IX. Mesurer la mondialisation commerciale : des indicateurs traditionnels au commerce en valeur ajoutée</h2>\n<h4>Comment mesurer réellement l’ouverture commerciale d’un pays ?</h4>\n<h4>Idée générale</h4>\n<p>Pour mesurer la mondialisation commerciale, on utilise traditionnellement plusieurs indicateurs :</p>\n<ul><li>taux d’ouverture ;</li><li>taux de couverture ;</li><li>taux de pénétration ;</li><li>part exportée de la production ;</li><li>termes de l’échange.</li></ul>\n<p>Mais ces indicateurs ont une limite importante :</p>\n<p>👉 ils mesurent les échanges en valeur brute.</p>\n<p>Or, avec la fragmentation internationale de la production, un même bien peut :</p>\n<ul><li>franchir plusieurs frontières ;</li><li>incorporer des composants venus de plusieurs pays ;</li><li>être assemblé dans un pays qui ne crée qu’une faible part de sa valeur.</li></ul>\n<p>Il devient donc nécessaire de mesurer le commerce :</p>\n<p>👉 en valeur ajoutée.</p>\n<h4>Idée</h4>\n<p>Les indicateurs traditionnels de mondialisation commerciale restent utiles, mais ils deviennent insuffisants avec le développement des chaînes de valeur mondiales, car ils mesurent les échanges en valeur brute et surestiment parfois la contribution réelle des pays à la production.</p>\n<p>Il faut donc commencer par maîtriser les indicateurs traditionnels avant de comprendre pourquoi ils doivent être complétés.</p>\n<h3>A. Le taux d’ouverture : l’indicateur traditionnel principal</h3>\n<p>Le taux d’ouverture mesure le poids des échanges extérieurs dans l’économie.</p>\n<p>La version simplifiée regarde :</p>\n<ul><li>X / PIB × 100</li><li>En 2025, le taux d’ouverture mondial est proche de :</li></ul>\n<p>👉 30 %.</p>\n<p>Cela signifie qu’en moyenne :</p>\n<p>👉 près d’un tiers de la production mondiale est liée aux exportations.</p>\n<p>Cl</p>\n<p>Le taux d’ouverture mesure le poids des échanges extérieurs relativement à la richesse produite sur le territoire et constitue l’indicateur traditionnel de l’intégration commerciale d’une économie.</p>\n<p>La mesure complète tient compte à la fois des exportations et des importations.</p>\n<h3>B. Définition complète</h3>\n<p>Le taux d’ouverture peut s’écrire :</p>\n<ul><li>[(X + M) / 2] / PIB × 100</li><li>Exemple France</li><li>Environ : 👉 28 %.</li></ul>\n<p>Cela signifie qu’une part importante de l’activité française est directement liée aux échanges internationaux.</p>\n<p>Il ne faut pas confondre taux d’ouverture et taux de couverture.</p>\n<h3>C. Le taux de couverture</h3>\n<div class=\"formula\">Taux de couverture = X / M × 100</div>\n<p>Il mesure :</p>\n<p>👉 la capacité des exportations à couvrir les importations.</p>\n<div class=\"formula\">Si taux = 100 %</div>\n<div class=\"formula\">X = M</div>\n<p>👉 équilibre commercial.</p>\n<div class=\"formula\">Si taux &gt; 100 %</div>\n<div class=\"formula\">X &gt; M</div>\n<p>👉 excédent commercial.</p>\n<div class=\"formula\">Si taux &lt; 100 %</div>\n<div class=\"formula\">X &lt; M</div>\n<p>👉 déficit commercial.</p>\n<h4>Idée</h4>\n<p>Le taux de couverture compare la valeur des exportations à celle des importations et permet donc de savoir si le commerce extérieur est excédentaire ou déficitaire.</p>\n<p>Le taux de pénétration répond à une autre question : quelle part de la demande intérieure dépend de l’étranger ?</p>\n<h3>D. Le taux de pénétration</h3>\n<p>Il mesure la part de la demande intérieure satisfaite par les importations.</p>\n<p>On peut l’utiliser :</p>\n<ul><li>pour toute l’économie ;</li><li>par secteur ;</li><li>par branche.</li></ul>\n<h4>Exemple</h4>\n<p>Pour les véhicules électriques :</p>\n<p>👉 quelle part de la demande nationale est satisfaite par des importations ?</p>\n<h4>Exemple énergétique</h4>\n<p>Pour le pétrole en France :</p>\n<div class=\"alertb\"><p>👉 quasiment toute la demande doit être satisfaite par des importations, faute de production domestique significative.</p></div>\n<h4>Idée centrale</h4>\n<p>Plus le taux de pénétration est élevé :</p>\n<p>👉 plus le pays dépend des importations pour satisfaire sa demande.</p>\n<p>Cl</p>\n<p>Le taux de pénétration mesure la dépendance d’une économie ou d’un secteur à l’égard des importations pour satisfaire sa demande intérieure.</p>\n<p>L’indicateur inverse consiste à regarder quelle part de la production domestique est vendue à l’étranger.</p>\n<h3>E. La part exportée de la production</h3>\n<p>On regarde :</p>\n<p>👉 quelle proportion de la production nationale est exportée.</p>\n<p>Cela renseigne sur :</p>\n<ul><li>l’orientation externe de l’économie ;</li><li>la dépendance à la demande étrangère.</li></ul>\n<h4>Si cette part est élevée</h4>\n<p>Le pays est :</p>\n<p>👉 très dépendant des débouchés extérieurs.</p>\n<h4>Idée</h4>\n<p>La part exportée de la production permet d’évaluer le caractère extraverti d’une économie en mesurant la part de sa production destinée à la demande étrangère.</p>\n<p>Les termes de l’échange, eux, ne mesurent pas des montants mais des évolutions de prix.</p>\n<p>Les termes de l’échange mesurent l’évolution relative des prix des exportations et des importations et non leur montant total.</p>\n<p>Ces indicateurs permettent de suivre historiquement l’ouverture commerciale mondiale.</p>\n<h3>F. L’évolution historique du taux d’ouverture mondial</h3>\n<p>La première mondialisation correspond à une forte hausse de l’ouverture commerciale mondiale, qui atteint environ 15 % du PIB à la veille de la Première Guerre mondiale.</p>\n<p>Les guerres et la crise de l’entre-deux-guerres inversent ensuite cette dynamique.</p>\n<p>L’après-guerre rétablit progressivement l’ouverture commerciale, mais il faut attendre les années 1980 pour retrouver les niveaux d’intégration atteints avant 1914.</p>\n<p>La véritable rupture intervient avec l’hypermondialisation.</p>\n<p>L’hypermondialisation se caractérise par des taux d’ouverture proches de 30 %, soit environ le double du maximum atteint lors de la première mondialisation.</p>\n<p>La stagnation récente du taux d’ouverture ne signifie donc pas nécessairement une véritable démondialisation.</p>\n<p>La stagnation récente du taux d’ouverture traduit davantage un ralentissement de l’hypermondialisation qu’un retour massif à la fermeture des économies.</p>\n<p>L’ouverture varie toutefois beaucoup selon les pays.</p>\n<p>L’Union européenne est fortement exposée aux chocs commerciaux internationaux car une part importante de son activité dépend des échanges extérieurs.</p>\n<p>Les États-Unis et la Chine apparaissent relativement moins ouverts selon cet indicateur.</p>\n<h3>G. Première limite du taux d’ouverture : il dépend de la taille du pays</h3>\n<h3>H. Les petits pays sont mécaniquement plus ouverts</h3>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’un petit pays :</p>\n<ul><li>produit moins de variété de biens ;</li><li>dépend davantage des importations ;</li><li>possède un marché intérieur plus petit ;</li><li>exporte davantage relativement à son PIB.</li></ul>\n<h4>Inversement</h4>\n<p>Un grand pays :</p>\n<ul><li>peut produire davantage de biens lui-même ;</li><li>dispose d’un grand marché intérieur ;</li><li>dépend moins des échanges relativement à son PIB.</li></ul>\n<h4>Exemple</h4>\n<p>États-Unis :</p>\n<p>👉 grand territoire + forte demande intérieure → taux d’ouverture plus faible.</p>\n<h4>Idée</h4>\n<p>Le taux d’ouverture est fortement influencé par la taille du pays : les petites économies ont mécaniquement tendance à être plus ouvertes que les grandes économies disposant d’un vaste marché intérieur.</p>\n<p>Mais une deuxième limite est encore plus importante dans une économie fragmentée internationalement.</p>\n<h3>I. Deuxième limite : le numérateur et le dénominateur ne mesurent pas la même chose</h3>\n<p>Le taux d’ouverture compare des exportations comptabilisées en valeur brute à un PIB mesuré en valeur ajoutée, ce qui peut fortement biaiser l’indicateur dans les économies spécialisées dans l’assemblage.</p>\n<p>Le cas de l’iPhone permet de comprendre immédiatement le problème.</p>\n<h3>J. L’iPhone : l’exemple du « Made in World »</h3>\n<p>Un iPhone peut être :</p>\n<ul><li>conçu aux États-Unis ;</li><li>utiliser des composants provenant de plusieurs pays ;</li><li>être assemblé en Chine ;</li><li>être réexporté vers le reste du monde.</li></ul>\n<p>Supposons :</p>\n<p>👉 prix exporté = 1 000 dollars.</p>\n<p>Mais la valeur réellement créée en Chine lors de l’assemblage n’est qu’une petite partie du prix.</p>\n<p>environ :</p>\n<p>👉 4 %.</p>\n<p>Donc :</p>\n<ul><li>1 000 × 4 % = 40 dollars.</li></ul>\n<h4>Dans les exportations chinoises</h4>\n<p>On compte :</p>\n<p>👉 1 000 dollars.</p>\n<h4>Dans le PIB chinois</h4>\n<p>On ne compte que :</p>\n<p>👉 environ 40 dollars de valeur ajoutée domestique.</p>\n<h4>Résultat</h4>\n<p>Le taux d’ouverture chinois peut être :</p>\n<p>👉 artificiellement élevé.</p>\n<h4>Idée</h4>\n<p>L’exemple de l’iPhone montre que les statistiques commerciales brutes attribuent à la Chine la valeur totale du bien exporté alors que seule une faible partie de cette valeur a réellement été créée sur son territoire.</p>\n<p>Le biais est particulièrement fort pour les pays ateliers.</p>\n<h3>K. Les pays ateliers ont des taux d’ouverture artificiellement élevés</h3>\n<p>Un pays atelier :</p>\n<ul><li>importe des composants ;</li><li>les assemble ;</li><li>réexporte le produit fini.</li></ul>\n<p>Donc :</p>\n<ul><li>importations élevées</li><li>exportations élevéesmaisvaleur ajoutée domestique faible.</li></ul>\n<h4>Conséquence</h4>\n<p>Le taux d’ouverture peut dépasser :</p>\n<p>👉 100 %.</p>\n<p>Exemples :</p>\n<ul><li>Vietnam ;</li><li>certains pays d’Asie ;</li><li>certains pays d’Europe de l’Est.</li></ul>\n<h4>Idée</h4>\n<p>Les pays ateliers peuvent présenter des taux d’ouverture supérieurs à 100 % car les flux bruts d’importation et de réexportation sont très élevés relativement à la faible valeur ajoutée domestique.</p>\n<p>L’évolution chinoise confirme également cette limite.</p>\n<h3>L. Pourquoi le taux d’ouverture chinois diminue-t-il depuis 2008 ?</h3>\n<p>Le taux d’ouverture chinois atteint un maximum proche de :</p>\n<p>👉 40 % autour de 2008.</p>\n<p>Puis :</p>\n<p>👉 il diminue.</p>\n<p>Cela ne signifie pas nécessairement que la Chine se ferme.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que la Chine :</p>\n<ul><li>produit davantage de composants elle-même ;</li><li>remplace certaines importations ;</li><li>monte en gamme ;</li><li>augmente sa valeur ajoutée domestique.</li></ul>\n<h4>Mécanisme</h4>\n<p>valeur ajoutée domestique ↑ → PIB ↑ relativement aux flux bruts → taux d’ouverture ↓.</p>\n<h4>Idée</h4>\n<p>La baisse du taux d’ouverture chinois reflète en partie sa montée en gamme : la Chine produit désormais davantage d’intrants domestiquement au lieu de se limiter à l’assemblage de composants importés.</p>\n<div class=\"db\"><div class=\"dt\">Ces limites expliquent l’émergence d’un nouvel outil</div><div class=\"dd\">la mesure du commerce international en valeur ajoutée.</div></div>\n<h3>M. Une nouvelle mesure : le commerce en valeur ajoutée</h3>\n<p>À partir du début des années 2010, les économistes cherchent à mesurer :</p>\n<p>👉 non plus seulement la valeur brute des échanges,</p>\n<p>mais :</p>\n<p>👉 la valeur réellement créée dans chaque pays.</p>\n<p>Cette approche est devenue indispensable avec :</p>\n<p>👉 les chaînes de valeur mondiales.</p>\n<h4>Idée</h4>\n<p>Le commerce en valeur ajoutée vise à attribuer à chaque pays uniquement la part de valeur qu’il a effectivement créée dans un bien ou un service échangé internationalement.</p>\n<p>Cette mesure repose sur les tableaux entrées-sorties des économies.</p>\n<h3>N. Comment mesure-t-on le commerce en valeur ajoutée ?</h3>\n<p>On utilise notamment :</p>\n<p>👉 les tableaux entrées-sorties.</p>\n<p>Ils permettent de savoir :</p>\n<ul><li>quels intrants sont utilisés ;</li><li>lesquels sont domestiques ;</li><li>lesquels sont importés ;</li><li>quelle valeur ajoutée est créée à chaque étape.</li></ul>\n<h4>Donc</h4>\n<p>On peut décomposer une exportation entre :</p>\n<ul><li>valeur ajoutée domestique ;</li><li>valeur ajoutée étrangère.</li></ul>\n<h4>Idée</h4>\n<p>Les tableaux entrées-sorties permettent de décomposer les exportations selon l’origine domestique ou étrangère des consommations intermédiaires utilisées dans la production.</p>\n<p>Cette nouvelle mesure met en évidence le rôle central des chaînes de valeur mondiales.</p>\n<h3>O. Les chaînes de valeur mondiales</h3>\n<p>Une chaîne de valeur mondiale correspond à la fragmentation des différentes étapes de production entre plusieurs pays.</p>\n<p>Synonymes :</p>\n<ul><li>fragmentation de la chaîne de valeur ;</li><li>division internationale du processus productif ;</li><li>DIPP.</li></ul>\n<h4>Les firmes multinationales</h4>\n<p>Elles répartissent les activités selon :</p>\n<p>👉 les avantages comparatifs des territoires.</p>\n<p>Exemples :</p>\n<ul><li>R&amp;D dans un pays avancé ;</li><li>composants ailleurs ;</li><li>assemblage dans un pays à bas coûts ;</li><li>marketing dans un autre pays.</li></ul>\n<p>Cl</p>\n<p>Une chaîne de valeur mondiale apparaît lorsque les différentes étapes de conception, production, assemblage et commercialisation d’un bien sont réparties entre plusieurs pays selon leurs avantages comparatifs.</p>\n<p>Le développement des chaînes de valeur transforme profondément la nature même du commerce international.</p>\n<h3>P. Une grande partie du commerce porte désormais sur des biens intermédiaires</h3>\n<p>Dans le commerce traditionnel :</p>\n<p>👉 on imagine un pays qui exporte un produit fini.</p>\n<p>Mais aujourd’hui, une grande partie des échanges concerne :</p>\n<p>👉 des biens intermédiaires.</p>\n<p>On retient environ :</p>\n<div class=\"alertb\"><p>👉 un tiers à plus d’un tiers des échanges de biens, autour de 36 %, selon l’indicateur présenté.</p></div>\n<h4>Idée</h4>\n<p>Le développement des chaînes de valeur mondiales a transformé le commerce international en multipliant les échanges de biens intermédiaires destinés à être réutilisés dans des processus productifs situés dans d’autres pays.</p>\n<p>Cette fragmentation augmente aussi la part de valeur étrangère contenue dans les exportations.</p>\n<h3>Q. La valeur ajoutée étrangère dans les exportations a fortement progressé</h3>\n<p>On mesure :</p>\n<p>👉 la part des importations incorporées dans les exportations.</p>\n<p>Autrement dit :</p>\n<p>👉 quelle part de ce que j’exporte a en réalité été produite à l’étranger ?</p>\n<p>Cette part a fortement augmenté avec l’hypermondialisation.</p>\n<ul><li>doublement sur environ 20 ans ;</li><li>pic autour de 2013 ;</li><li>ordre de grandeur proche de 40 % selon les données évoquées.</li></ul>\n<h4>Idée</h4>\n<p>La hausse de la valeur ajoutée étrangère incorporée dans les exportations montre que les économies sont devenues beaucoup plus interdépendantes dans leurs processus de production.</p>\n<p>Cette mesure permet donc d’identifier plus précisément les dépendances productives.</p>\n<h3>R. Le commerce en valeur ajoutée révèle les dépendances aux intrants étrangers</h3>\n<p>Un pays peut exporter énormément.</p>\n<p>Mais pour exporter :</p>\n<p>👉 il peut dépendre fortement de composants étrangers.</p>\n<h4>Exemple automobile</h4>\n<p>Une industrie automobile peut être localisée en Allemagne mais utiliser :</p>\n<ul><li>composants asiatiques ;</li><li>semi-conducteurs étrangers ;</li><li>matières premières importées.</li></ul>\n<p>Donc :</p>\n<ul><li>production domestique apparente≠ autonomie productive.</li></ul>\n<h4>Idée</h4>\n<p>L’analyse en valeur ajoutée permet de révéler des dépendances invisibles dans les statistiques brutes en mesurant la part des intrants étrangers nécessaires à la production exportée.</p>\n<p>Ces dépendances deviennent particulièrement visibles lorsqu’un maillon de la chaîne se bloque.</p>\n<h3>S. Le risque de rupture des chaînes de valeur mondiales</h3>\n<p>Une chaîne de valeur est :</p>\n<p>👉 interdépendante.</p>\n<p>Si un seul fournisseur important disparaît :</p>\n<ul><li>production retardée ;</li><li>usine arrêtée ;</li><li>pénurie ;</li><li>hausse des prix.</li><li>Exemples possibles</li><li>semi-conducteurs ;</li><li>composants automobiles ;</li><li>énergie ;</li><li>matières premières critiques.</li></ul>\n<h4>Idée centrale</h4>\n<p>Plus une économie dépend d’intrants importés :</p>\n<p>👉 plus elle est vulnérable à un choc externe.</p>\n<h4>Idée</h4>\n<p>La fragmentation internationale des processus productifs accroît l’efficacité mais aussi la vulnérabilité, car la défaillance d’un seul maillon peut perturber l’ensemble de la chaîne de production mondiale.</p>\n<p>Les chaînes de valeur mondiales n’ont cependant pas toutes la même géographie.</p>\n<h3>T. Première forme de chaîne de valeur : l’araignée</h3>\n<p>Une chaîne de valeur en araignée se caractérise par la convergence de nombreux composants vers un pays atelier chargé de l’assemblage final.</p>\n<p>Dans d’autres secteurs, le produit passe successivement d’un pays à un autre.</p>\n<h3>U. Deuxième forme : la chaîne en serpent</h3>\n<p>Une chaîne de valeur en serpent correspond à une succession d’étapes productives réalisées dans différents pays, le produit s’enrichissant progressivement de valeur ajoutée à chaque frontière franchie.</p>\n<p>Les pays peuvent aussi occuper des positions différentes dans ces chaînes.</p>\n<h3>V. L’intégration dans les chaînes de valeur mondiales</h3>\n<p>Être fortement intégré signifie :</p>\n<p>👉 participer intensément à une production fragmentée internationalement.</p>\n<p>Cela présente deux faces.</p>\n<h4>Avantage</h4>\n<p>Le pays peut devenir :</p>\n<p>👉 un maillon indispensable.</p>\n<h4>Risque</h4>\n<p>Il devient :</p>\n<p>👉 dépendant.</p>\n<p>Dépendance possible :</p>\n<ul><li>aux importations d’intrants ;</li><li>à la demande étrangère ;</li><li>aux décisions des firmes multinationales.</li></ul>\n<h4>Idée</h4>\n<p>Une forte intégration dans les chaînes de valeur mondiales constitue à la fois une source d’opportunités productives et une source de dépendance aux intrants, aux débouchés et aux décisions des firmes multinationales.</p>\n<p>La nature de cette dépendance dépend aussi de la position du pays dans la chaîne.</p>\n<h3>W. Insertion en amont et insertion en aval</h3>\n<h3>X. Insertion en amont</h3>\n<p>Un pays est en amont lorsqu’il fournit :</p>\n<p>👉 les intrants de base nécessaires aux autres productions.</p>\n<p>Exemples :</p>\n<ul><li>pétrole ;</li><li>gaz ;</li><li>minerais ;</li><li>matières premières agricoles.</li></ul>\n<p>Ces pays ont souvent :</p>\n<p>👉 peu besoin d’intrants étrangers pour produire.</p>\n<p>Mais :</p>\n<p>👉 leur production est indispensable aux autres.</p>\n<p>Cl</p>\n<p>Une insertion en amont correspond à la fourniture d’intrants fondamentaux utilisés dans les étapes suivantes de la production mondiale.</p>\n<p>À l’inverse, certains pays se situent davantage en fin de chaîne.</p>\n<h3>Y. Insertion en aval</h3>\n<p>Un pays est en aval lorsqu’il :</p>\n<ul><li>importe beaucoup d’intrants ;</li><li>assemble ;</li><li>transforme ;</li><li>exporte le produit final.</li></ul>\n<h4>Exemple</h4>\n<p>La Chine dans sa phase d’« atelier du monde ».</p>\n<p>Cl</p>\n<p>Une insertion en aval correspond à une spécialisation dans les dernières étapes du processus productif, notamment l’assemblage de composants importés avant réexportation.</p>\n<p>Le pourcentage de valeur ajoutée étrangère dans les exportations permet de repérer ces différentes situations.</p>\n<h3>Z. ⸻</h3>\n<h3>AA. XXVII. Comment lire le degré d’intégration dans les chaînes de valeur ?</h3>\n<p>On regarde :</p>\n<p>👉 la part de valeur ajoutée étrangère dans les exportations.</p>\n<h4>Si elle est faible</h4>\n<p>Cela signifie :</p>\n<p>👉 beaucoup de valeur est produite domestiquement.</p>\n<p>Le pays dépend moins d’intrants étrangers.</p>\n<h4>Si elle est élevée</h4>\n<p>Cela signifie :</p>\n<p>👉 une grande partie de ses exportations repose sur des composants importés.</p>\n<p>Donc :</p>\n<p>👉 forte intégration dans les CVM.</p>\n<h4>Idée</h4>\n<p>Plus la part de valeur ajoutée étrangère dans les exportations est élevée, plus le pays dépend d’intrants étrangers pour produire ses exportations.</p>\n<p>Les groupes de pays occupent des positions très différentes.</p>\n<h3>AB. Les exportateurs de matières premières : peu de valeur ajoutée étrangère</h3>\n<p>Les pays producteurs de :</p>\n<ul><li>pétrole ;</li><li>gaz ;</li><li>minerais ;</li><li>produits agricoles ;</li></ul>\n<p>utilisent généralement :</p>\n<p>👉 peu d’intrants étrangers pour produire leur exportation principale.</p>\n<p>Donc :</p>\n<ul><li>part de VA étrangère faible.</li></ul>\n<p>Ils sont :</p>\n<p>👉 plutôt en amont.</p>\n<h4>Mais</h4>\n<p>Ils peuvent être très dépendants :</p>\n<p>👉 des débouchés internationaux.</p>\n<p>Cl</p>\n<p>Les exportateurs de matières premières sont souvent faiblement dépendants d’intrants étrangers mais fortement dépendants de la demande mondiale pour leurs ressources.</p>\n<p>Les pays avancés occupent souvent une position intermédiaire.</p>\n<h3>AC. Les pays avancés : une insertion intermédiaire</h3>\n<p>Les pays avancés :</p>\n<ul><li>utilisent certains intrants importés ;</li><li>mais produisent aussi beaucoup de composants ;</li><li>sont spécialisés dans des activités à forte valeur ajoutée.</li></ul>\n<p>Donc :</p>\n<p>👉 dépendance aux intrants étrangers modérée.</p>\n<p>Ils gardent souvent :</p>\n<ul><li>R&amp;D ;</li><li>design ;</li><li>services ;</li><li>technologie ;</li><li>activités à forte valeur ajoutée.</li></ul>\n<p>Cl</p>\n<p>Les pays avancés occupent généralement une position intermédiaire dans les chaînes de valeur car ils utilisent des intrants étrangers tout en conservant une forte capacité domestique de production à haute valeur ajoutée.</p>\n<p>Les pays ateliers sont au contraire parmi les plus dépendants.</p>\n<h3>AD. Les pays ateliers : très forte valeur ajoutée étrangère dans les exportations</h3>\n<p>Les pays ateliers présentent une forte intégration en aval car une grande partie de la valeur de leurs exportations provient de composants importés.</p>\n<p>Le cas chinois montre enfin que cette insertion évolue avec le développement.</p>\n<h3>AE. La Chine : une trajectoire non linéaire dans les chaînes de valeur</h3>\n<h3>AF. Première phase : intégration croissante</h3>\n<p>Dans les années 1990-2000 :</p>\n<p>👉 la Chine s’intègre de plus en plus aux CVM.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’elle devient :</p>\n<p>👉 l’atelier du monde.</p>\n<p>Elle importe :</p>\n<ul><li>composants ;</li><li>pièces ;</li><li>intrants.</li></ul>\n<p>Puis :</p>\n<p>👉 assemble et réexporte.</p>\n<p>L’adhésion à l’OMC en 2001 accélère ce processus.</p>\n<h4>Idée</h4>\n<p>Dans la première phase de son développement exportateur, la Chine accroît fortement son intégration aux chaînes de valeur mondiales en devenant une grande plateforme d’assemblage.</p>\n<p>Mais la poursuite du développement modifie ensuite la nature de cette insertion.</p>\n<h3>AG. Deuxième phase : montée en gamme et réinternalisation</h3>\n<p>Au fur et à mesure du développement :</p>\n<ul><li>la Chine :</li><li>développe ses propres fournisseurs ;</li><li>produit davantage de composants ;</li><li>maîtrise davantage de technologies ;</li><li>remplace certaines importations.</li></ul>\n<p>Donc :</p>\n<p>👉 valeur ajoutée étrangère dans les exportations ↓.</p>\n<p>Et :</p>\n<p>👉 valeur ajoutée domestique ↑.</p>\n<h4>Idée centrale</h4>\n<p>La Chine devient :</p>\n<p>👉 moins un simple pays atelier</p>\n<p>et davantage :</p>\n<p>👉 une puissance industrielle intégrée.</p>\n<p>Cl</p>\n<p>La montée en gamme chinoise réduit progressivement sa dépendance aux intrants étrangers : une part croissante de la valeur de ses exportations est désormais créée sur son propre territoire.</p>\n<h3>AH. L’insertion dans les chaînes de valeur n’est donc pas linéaire</h3>\n<p>Le développement économique peut produire une trajectoire en cloche dans les chaînes de valeur : le pays devient d’abord plus dépendant des intrants étrangers avant de réinternaliser progressivement les étapes productives lors de sa montée en gamme.</p>\n<h3>AI. Conclusion</h3>\n<p>Les indicateurs traditionnels comme le taux d’ouverture restent indispensables pour mesurer la mondialisation commerciale, mais ils ne suffisent plus à comprendre une économie dans laquelle les produits sont « made in world ».</p>\n<p>La fragmentation internationale de la production conduit à compter plusieurs fois certains flux et à attribuer artificiellement à des pays ateliers la valeur totale de biens qu’ils n’ont que partiellement produits.</p>\n<p>La mesure du commerce en valeur ajoutée permet de corriger ce biais en identifiant précisément :</p>\n<ul><li>la valeur créée domestiquement ;</li><li>la valeur importée ;</li><li>la dépendance aux intrants étrangers ;</li><li>la position des pays dans les chaînes de valeur mondiales.</li></ul>\n<p>Elle montre ainsi qu’un pays peut être très inséré dans le commerce mondial sans pour autant créer une grande part de la valeur du produit qu’il exporte.</p>\n<p>Cl</p>\n<p>Le développement des chaînes de valeur mondiales rend les statistiques commerciales brutes de moins en moins pertinentes : mesurer le commerce en valeur ajoutée permet de distinguer la simple participation aux échanges de la véritable capacité d’un territoire à créer et capter la valeur au sein de la production mondiale.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>X. Chaînes de valeur mondiales, dépendances et vulnérabilités</h2>\n<p>En quoi les chaînes de valeur mondiales créent-elles de nouvelles dépendances entre les pays ?</p>\n<h3>A. Idée générale</h3>\n<p>La mesure du commerce en valeur ajoutée permet de voir quelque chose que les statistiques commerciales traditionnelles montrent mal :</p>\n<p>👉 les dépendances réelles entre les économies.</p>\n<p>Un pays peut sembler produire et exporter énormément, mais dépendre :</p>\n<ul><li>d’intrants étrangers ;</li><li>de technologies étrangères ;</li><li>de matières premières critiques ;</li><li>de services financiers étrangers ;</li><li>de débouchés étrangers ;</li><li>ou de capitaux étrangers.</li></ul>\n<h4>Idée centrale</h4>\n<p>Plus les chaînes de valeur sont fragmentées internationalement, plus les économies deviennent :</p>\n<p>👉 interdépendantes.</p>\n<p>Cette interdépendance peut être :</p>\n<ul><li>une source d’efficacité ;</li><li>mais aussi une source de vulnérabilité.</li></ul>\n<p>Cl</p>\n<p>Le développement des chaînes de valeur mondiales renforce l’interdépendance entre les économies en augmentant leur dépendance aux intrants, aux technologies, aux capitaux et aux débouchés étrangers.</p>\n<p>La première forme de dépendance apparaît directement dans la composition des exportations.</p>\n<h3>B. La hausse de la valeur ajoutée étrangère dans les exportations</h3>\n<h3>C. Une baisse du « made in » domestique</h3>\n<p>La valeur ajoutée intérieure des exportations mesure :</p>\n<p>👉 la part de la valeur exportée qui a réellement été produite sur le territoire national.</p>\n<p>Autrement dit :</p>\n<ul><li>valeur ajoutée intérieure élevée = beaucoup de production domestique ;</li><li>valeur ajoutée intérieure faible = forte dépendance aux intrants étrangers.</li></ul>\n<p>La baisse de la valeur ajoutée intérieure contenue dans les exportations traduit l’internationalisation croissante des processus productifs et la dépendance accrue aux intrants étrangers.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">dans les principales économies européennes, la part de valeur ajoutée domestique dans les exportations est passée d’environ 85-90 % dans les années 1960 à près de 70 % aujourd’hui, ce qui traduit une dépendance accrue aux intrants étrangers.</div></div>\n<p>Cette dépendance ne concerne pas uniquement les produits industriels ordinaires : elle devient particulièrement problématique lorsqu’elle porte sur des biens indispensables.</p>\n<h3>D. Les matériaux critiques : une nouvelle vulnérabilité stratégique</h3>\n<p>Un matériau est dit critique lorsqu’il est :</p>\n<ul><li>indispensable à la production ;</li><li>difficilement substituable ;</li><li>concentré dans un petit nombre de pays fournisseurs.</li></ul>\n<h4>Exemple</h4>\n<p>👉 lithium.</p>\n<p>Mais on peut aussi penser à :</p>\n<ul><li>terres rares ;</li><li>cobalt ;</li><li>nickel ;</li><li>certains semi-conducteurs.</li></ul>\n<h4>Idée</h4>\n<p>Un matériau devient critique lorsqu’une économie dépend fortement de son importation et qu’une interruption de l’approvisionnement peut perturber des secteurs entiers de production.</p>\n<p>Cette question de dépendance ne concerne pas seulement les biens matériels.</p>\n<h3>E. La dépendance existe aussi dans les services</h3>\n<h3>F. Les pays avancés sont dominés par le tertiaire</h3>\n<p>Dans un pays comme la France :</p>\n<p>👉 le secteur des services représente la majeure partie :</p>\n<ul><li>de l’emploi ;</li><li>de la valeur ajoutée ;</li><li>de l’activité économique.</li></ul>\n<p>On pourrait penser que les services sont moins dépendants des intrants étrangers.</p>\n<p>C’est souvent vrai.</p>\n<p>Mais certains services sont au contraire très fortement dépendants.</p>\n<h3>G. L’exemple des paiements</h3>\n<p>Pour les paiements dématérialisés internationaux, les grandes infrastructures sont largement dominées par :</p>\n<p>👉 Visa👉 Mastercard.</p>\n<p>Deux entreprises américaines.</p>\n<p>Donc :</p>\n<p>👉 dépendance européenne vis-à-vis d’infrastructures de paiement étrangères.</p>\n<p>Cela pose une question de :</p>\n<p>👉 souveraineté financière et monétaire.</p>\n<h4>Idée importante</h4>\n<ul><li>L’Europe cherche donc à développer :</li><li>ses propres systèmes de paiement ;</li><li>des infrastructures européennes ;</li><li>à terme des outils comme l’euro numérique.</li></ul>\n<h4>Limite</h4>\n<p>Ces nouveaux systèmes ont du mal à s’imposer à cause des :</p>\n<p>👉 effets de réseau.</p>\n<p>Plus un système est utilisé :</p>\n<div class=\"alertb\"><p>→ plus il devient pratique → plus de commerçants l’acceptent → plus de consommateurs l’utilisent → plus il devient dominant.</p></div>\n<h4>Idée</h4>\n<p>La dépendance aux chaînes de valeur ne concerne pas seulement l’industrie : elle touche aussi les services stratégiques, comme les paiements, où la domination d’acteurs étrangers pose une question de souveraineté.</p>\n<p>Cette question de souveraineté conduit directement à l’idée de « made in ».</p>\n<p>Ces nouvelles dépendances concernent aussi fortement les pays en développement, notamment dans leurs relations avec la Chine.</p>\n<h3>H. La dépendance croissante des pays en développement à la Chine</h3>\n<h3>I. La Chine est devenue un partenaire central</h3>\n<p>Depuis les années 2000, la Chine est devenue :</p>\n<ul><li>un grand fournisseur ;</li><li>un grand client ;</li><li>un investisseur ;</li><li>un créancier.</li></ul>\n<p>Elle occupe donc une place centrale dans de nombreuses économies du Sud.</p>\n<p>Cette dépendance est particulièrement visible :</p>\n<p>👉 en Afrique👉 en Asie du Sud-Est.</p>\n<p>Cl</p>\n<p>L’essor économique chinois a créé de nouvelles dépendances commerciales et financières dans de nombreux pays en développement.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">la Chine est devenue un partenaire commercial central de nombreux pays en développement, ce qui accroît leur exposition aux variations de l’économie chinoise.</div></div>\n<p>Cette dépendance est particulièrement forte dans l’espace asiatique.</p>\n<h3>J. L’Asie : une intégration régionale autour de la Chine</h3>\n<p>Le modèle d’Akamatsu montre que l’industrialisation asiatique repose sur une diffusion régionale de la production et des avantages comparatifs entre économies successivement intégrées.</p>\n<h3>K. L’ASEAN</h3>\n<p>L’ASEAN regroupe plusieurs économies du Sud-Est asiatique, notamment :</p>\n<ul><li>Vietnam ;</li><li>Indonésie ;</li><li>Thaïlande ;</li><li>Singapour ;</li><li>Cambodge ;</li><li>Laos ;</li><li>etc.</li></ul>\n<p>Ces pays sont fortement intégrés :</p>\n<p>👉 aux chaînes de valeur asiatiques.</p>\n<p>Donc :</p>\n<p>👉 très exposés à l’économie chinoise.</p>\n<p>Cette intégration régionale s’est encore renforcée avec le RCEP.</p>\n<h3>L. Le RCEP : un immense espace de libre-échange asiatique</h3>\n<h4>Fonction</h4>\n<p>Le RCEP facilite :</p>\n<ul><li>échanges ;</li><li>production régionale ;</li><li>circulation des biens intermédiaires ;</li><li>chaînes de valeur asiatiques.</li></ul>\n<h4>Conséquence</h4>\n<p>Les économies de la région deviennent :</p>\n<p>👉 encore plus interdépendantes.</p>\n<h4>Idée</h4>\n<p>Le RCEP renforce l’intégration productive asiatique en facilitant les échanges au sein d’un espace représentant environ un tiers de l’économie mondiale.</p>\n<p>Cette intégration signifie aussi qu’un ralentissement chinois peut rapidement se diffuser aux autres pays.</p>\n<h3>M. Comment un ralentissement chinois se diffuse-t-il ?</h3>\n<p>Une crise ne reste pas forcément dans son pays d’origine.</p>\n<p>Elle se diffuse à travers :</p>\n<p>👉 des canaux de transmission.</p>\n<p>Dans le cas de la Chine, deux canaux principaux apparaissent :</p>\n<ul><li>canal commercial ;</li><li>canal financier.</li></ul>\n<p>Cl</p>\n<p>La forte intégration à la Chine transforme les difficultés chinoises en chocs internationaux par l’intermédiaire de plusieurs canaux de transmission.</p>\n<p>Le premier canal est le plus immédiat : le commerce.</p>\n<h3>N. Premier canal : le canal commercial</h3>\n<h3>O. Effet volume</h3>\n<p>La Chine est un très grand importateur mondial.</p>\n<p>Elle importe notamment :</p>\n<ul><li>matières premières ;</li><li>énergie ;</li><li>produits intermédiaires ;</li><li>produits agricoles.</li></ul>\n<p>Si la croissance chinoise ralentit :</p>\n<p>→ demande chinoise ↓ → importations chinoises ↓ → exportations des partenaires ↓.</p>\n<p>C’est l’effet volume.</p>\n<h4>Idée</h4>\n<p>Un ralentissement chinois réduit les importations du pays et donc les volumes exportés par ses partenaires commerciaux.</p>\n<h3>P. Effet prix</h3>\n<p>La Chine pèse tellement lourd sur certains marchés que lorsque sa demande baisse :</p>\n<p>→ prix mondiaux ↓.</p>\n<p>Exemple :</p>\n<ul><li>pétrole ;</li><li>minerais ;</li><li>matières premières.</li></ul>\n<p>Donc les exportateurs subissent :</p>\n<ul><li>une baisse des quantités exportées ;</li><li>une baisse du prix de leurs exportations.</li></ul>\n<h4>Double effet</h4>\n<p>demande chinoise ↓ → volumes exportés ↓</p>\n<p>prix ↓ → recettes extérieures ↓.</p>\n<h4>Idée</h4>\n<p>Le canal commercial passe à la fois par un effet volume et un effet prix : la baisse de la demande chinoise réduit les quantités exportées et peut faire baisser les cours mondiaux.</p>\n<p>Mais la Chine est également un fournisseur majeur de capitaux.</p>\n<h3>Q. Deuxième canal : le canal financier</h3>\n<h3>R. La Chine exporte des capitaux</h3>\n<p>La Chine présente traditionnellement :</p>\n<p>👉 des excédents courants importants.</p>\n<p>Donc elle dispose :</p>\n<p>👉 d’une capacité de financement.</p>\n<p>Elle peut donc faire sortir des capitaux sous forme :</p>\n<ul><li>d’IDE ;</li><li>de prêts ;</li><li>de placements.</li></ul>\n<h3>S. Les Nouvelles routes de la soie</h3>\n<p>Depuis les années 2010, notamment autour de l’initiative des :</p>\n<p>👉 Nouvelles routes de la soie</p>\n<p>la Chine finance :</p>\n<ul><li>ports ;</li><li>routes ;</li><li>chemins de fer ;</li><li>infrastructures ;</li><li>projets énergétiques.</li><li>Dans de nombreux PED.</li></ul>\n<h4>Conséquence</h4>\n<p>Ces pays dépendent aussi :</p>\n<p>👉 du financement chinois.</p>\n<h4>Idée</h4>\n<p>La puissance financière chinoise renforce son influence sur les pays en développement par l’intermédiaire des IDE, des prêts et du financement d’infrastructures.</p>\n<p>Mais cette dépendance financière peut elle-même devenir une vulnérabilité.</p>\n<h3>T. La dette envers la Chine : une vulnérabilité supplémentaire</h3>\n<p>Certains pays africains ou asiatiques :</p>\n<ul><li>empruntent fortement à la Chine ;</li><li>financent leurs infrastructures par ces prêts ;</li><li>augmentent leur dette extérieure.</li></ul>\n<h4>Problème</h4>\n<p>Si les projets ne génèrent pas suffisamment de revenus :</p>\n<p>→ difficulté à rembourser → dette extérieure ↑ → vulnérabilité financière ↑.</p>\n<h4>Idée centrale</h4>\n<p>La Chine peut donc être à la fois :</p>\n<ul><li>partenaire de développement ;</li><li>créancier important.</li></ul>\n<h4>Idée</h4>\n<p>Les prêts chinois peuvent soutenir l’investissement des pays en développement, mais ils peuvent également accroître leur vulnérabilité extérieure lorsqu’ils augmentent fortement leur endettement.</p>\n<p>Les chaînes de valeur mondiales ont aussi une conséquence majeure sur l’efficacité du protectionnisme.</p>\n<h3>U. Les chaînes de valeur rendent le protectionnisme plus complexe</h3>\n<h3>V. Le raisonnement traditionnel</h3>\n<p>On pourrait penser :</p>\n<ul><li>droits de douane ↑ → importations ↓ → production nationale protégée.</li></ul>\n<p>Mais dans une chaîne de valeur mondiale, une entreprise nationale importe elle-même :</p>\n<p>👉 des composants étrangers.</p>\n<p>Donc :</p>\n<ul><li>droits de douane sur les intrants → coût de production ↑ → compétitivité de l’entreprise nationale ↓.</li></ul>\n<h4>Idée</h4>\n<p>Dans une économie organisée en chaînes de valeur mondiales, protéger les producteurs nationaux par des droits de douane peut paradoxalement les pénaliser lorsqu’ils dépendent d’intrants importés.</p>\n<p>C’est précisément ce qui explique les difficultés des droits de douane généralisés.</p>\n<h3>W. L’exemple des droits de douane américains</h3>\n<p>La fragmentation internationale de la production brouille la distinction entre protection des producteurs nationaux et taxation des importations, car les entreprises nationales sont elles-mêmes souvent importatrices d’intrants.</p>\n<h3>X. Les chaînes de valeur créent donc un arbitrage</h3>\n<p>Les CVM produisent :</p>\n<ul><li>Des gains</li><li>baisse des coûts ;</li><li>spécialisation ;</li><li>productivité ;</li><li>accès aux technologies ;</li><li>intégration internationale.</li></ul>\n<h4>Mais aussi des risques</h4>\n<ul><li>dépendance ;</li><li>fragilité ;</li><li>transmis
