les firmes étrangères, ces territoires développent de véritables politiques d’attractivité.</p>\n<h3>I. Les politiques d’attractivité</h3>\n<p>Une politique d’attractivité cherche à rendre un territoire intéressant pour les investisseurs étrangers.</p>\n<p>Elle peut reposer sur :</p>\n<ul><li>fiscalité avantageuse ;</li><li>infrastructures ;</li><li>main-d’œuvre abondante ;</li><li>coûts salariaux faibles ;</li><li>simplification administrative ;</li><li>accès au marché.</li></ul>\n<h4>Exemple chinois</h4>\n<p>Les migrations internes permettent de déplacer une importante main-d’œuvre rurale vers les zones industrielles.</p>\n<p>Cela permet :</p>\n<p>👉 une offre de travail abondante,</p>\n<p>donc historiquement :</p>\n<p>👉 des coûts salariaux faibles.</p>\n<h4>Idée</h4>\n<p>Les politiques d’attractivité combinent avantages fiscaux, infrastructures et disponibilité de la main-d’œuvre afin d’attirer sur le territoire les capitaux productifs étrangers.</p>\n<p>Mais attirer des entreprises étrangères ne suffit pas à garantir le développement : encore faut-il que leur présence bénéficie durablement au tissu productif national.</p>\n<h3>J. Le transfert de technologie : transformer l’IDE en instrument de rattrapage</h3>\n<h3>K. L’objectif n’est pas simplement d’accueillir des usines étrangères</h3>\n<p>Un pays peut accueillir de nombreuses entreprises étrangères tout en restant :</p>\n<p>👉 une simple plateforme d’assemblage.</p>\n<p>Dans ce cas :</p>\n<ul><li>emplois créés ;</li><li>exportations augmentent ;</li></ul>\n<p>mais :</p>\n<p>👉 le pays maîtrise peu la technologie.</p>\n<p>Une stratégie plus ambitieuse cherche à obtenir :</p>\n<ul><li>transferts de savoir-faire ;</li><li>formation de travailleurs ;</li><li>apprentissage technologique ;</li><li>partenariats avec entreprises locales.</li></ul>\n<h4>Idée essentielle</h4>\n<p>IDE≠ automatiquement développement.</p>\n<p>Ce qui compte est :</p>\n<p>👉 ce que le pays apprend grâce à l’IDE.</p>\n<p>Cl</p>\n<p>L’efficacité développementale des IDE dépend moins de leur volume que de leur capacité à produire des externalités technologiques et à renforcer les compétences du tissu productif local.</p>\n<p>Lorsque cet apprentissage fonctionne, le pays peut progressivement remplacer les firmes ou composants étrangers par ses propres productions.</p>\n<h3>L. Du pays atelier au producteur autonome</h3>\n<p>Première étape :</p>\n<p>👉 assemblage pour des firmes étrangères.</p>\n<p>Puis :</p>\n<p>👉 apprentissage.</p>\n<p>Puis :</p>\n<p>👉 production de composants.</p>\n<p>Puis :</p>\n<p>👉 développement d’entreprises nationales.</p>\n<p>Puis :</p>\n<p>👉 marques et technologies propres.</p>\n<h4>Mécanisme</h4>\n<p>IDE → apprentissage → technologie → entreprises domestiques → montée en gamme → autonomie productive accrue.</p>\n<h4>Exemple</h4>\n<p>La Chine passe progressivement :</p>\n<ul><li>de l’assemblage de produits étrangers ;</li><li>à la production de composants ;</li><li>puis à l’émergence de grandes entreprises nationales.</li></ul>\n<h4>Idée</h4>\n<p>La réussite du rattrapage suppose que l’accueil des FMN constitue une étape transitoire permettant aux entreprises domestiques d’acquérir les compétences nécessaires pour remonter progressivement les chaînes de valeur.</p>\n<p>Cette stratégie peut donc être gagnante pour le pays d’accueil mais également pour les entreprises étrangères qui bénéficient initialement de nouvelles opportunités.</p>\n<h3>M. Une relation initialement gagnant-gagnant entre émergents et FMN</h3>\n<h3>N. Les firmes des pays avancés bénéficient des faibles coûts</h3>\n<p>Les FMN s’implantent notamment pour :</p>\n<ul><li>réduire leurs coûts ;</li><li>accéder à une main-d’œuvre abondante ;</li><li>produire à grande échelle.</li></ul>\n<h4>Logique initiale</h4>\n<p>👉 logique de coût.</p>\n<p>Cela permet :</p>\n<ul><li>coûts de production ↓ ;</li><li>profits ↑ ;</li><li>compétitivité ↑.</li></ul>\n<p>Mais lorsque les revenus du pays progressent, une autre motivation devient progressivement centrale.</p>\n<h3>O. De la logique de coût à la logique de marché</h3>\n<p>Les travailleurs deviennent aussi :</p>\n<p>👉 des consommateurs.</p>\n<p>Avec l’augmentation des revenus :</p>\n<ul><li>marché intérieur s’élargit ;</li><li>demande automobile ↑ ;</li><li>demande électronique ↑ ;</li><li>consommation ↑.</li></ul>\n<p>Les FMN s’implantent alors également pour :</p>\n<p>👉 vendre directement sur ce marché.</p>\n<h4>Exemple</h4>\n<p>Les entreprises automobiles allemandes se développent fortement en Chine.</p>\n<p>Mais à mesure que les entreprises chinoises montent en gamme :</p>\n<p>👉 les producteurs locaux deviennent capables de concurrencer les entreprises étrangères.</p>\n<p>Cl</p>\n<p>L’implantation des FMN dans les émergents peut passer d’une logique de réduction des coûts à une logique de conquête du marché intérieur lorsque le développement entraîne l’apparition d’une classe moyenne solvable.</p>\n<p>L’ouverture réussie peut donc permettre de transformer progressivement les avantages comparatifs du pays.</p>\n<h3>P. La montée en gamme transforme les avantages comparatifs</h3>\n<h3>Q. Les avantages comparatifs ne sont pas nécessairement figés</h3>\n<p>Un pays peut initialement disposer d’un avantage dans :</p>\n<ul><li>travail peu qualifié ;</li><li>textile ;</li><li>assemblage.</li></ul>\n<p>Mais grâce à :</p>\n<ul><li>éducation ;</li><li>investissement ;</li><li>technologie ;</li><li>politique industrielle ;</li></ul>\n<p>Il peut développer de nouveaux avantages dans :</p>\n<ul><li>automobile ;</li><li>électronique ;</li><li>numérique ;</li><li>semi-conducteurs.</li></ul>\n<h4>Idée centrale</h4>\n<p>👉 Les avantages comparatifs peuvent être construits.</p>\n<p>Cl</p>\n<p>L’expérience des économies asiatiques montre que les avantages comparatifs ne sont pas nécessairement naturels ou définitifs : une politique industrielle peut progressivement les transformer en faveur d’activités à plus forte valeur ajoutée.</p>\n<p>Cette transformation explique pourquoi la montée en gamme chinoise provoque aujourd’hui autant de tensions avec les économies avancées.</p>\n<h3>R. Chine / États-Unis : la bataille pour la frontière technologique</h3>\n<p>À mesure que la Chine monte en gamme, ses spécialisations se rapprochent de celles des États-Unis.</p>\n<p>La concurrence concerne désormais :</p>\n<ul><li>intelligence artificielle ;</li><li>batteries ;</li><li>véhicules électriques ;</li><li>semi-conducteurs ;</li><li>télécommunications ;</li><li>technologies vertes.</li></ul>\n<p>Il ne s’agit plus seulement d’une complémentarité :</p>\n<div class=\"db\"><div class=\"dt\">États-Unis</div><div class=\"dd\">technologieChine = assemblage.</div></div>\n<p>Il existe de plus en plus :</p>\n<p>👉 concurrence directe sur les mêmes secteurs.</p>\n<p>La frontière technologique correspond aux technologies et méthodes de production les plus avancées disponibles à un moment donné.</p>\n<h4>Idée</h4>\n<p>La montée en gamme chinoise transforme progressivement une relation de complémentarité en concurrence directe, la Chine contestant désormais aux États-Unis leur position à la frontière technologique.</p>\n<p>Cependant, toutes les stratégies d’insertion dans la mondialisation ne débouchent pas sur une telle transformation productive.</p>\n<h3>S. Les perdants : la malédiction des ressources</h3>\n<h3>T. Le paradoxe de l’abondance</h3>\n<p>Certains pays disposent de ressources naturelles considérables :</p>\n<ul><li>pétrole ;</li><li>gaz ;</li><li>minerais ;</li><li>matières premières.</li></ul>\n<p>On pourrait penser que cette richesse facilite nécessairement leur développement.</p>\n<p>Pourtant, elle peut devenir :</p>\n<p>👉 une malédiction des ressources.</p>\n<p>Le pays reste :</p>\n<ul><li>dépendant d’une seule ressource ;</li><li>peu diversifié ;</li><li>vulnérable aux prix mondiaux.</li></ul>\n<p>Cl</p>\n<p>La malédiction des ressources désigne le paradoxe selon lequel l’abondance de matières premières peut ralentir la diversification et le développement au lieu de les favoriser.</p>\n<p>L’un des mécanismes économiques les plus importants de cette malédiction passe par le taux de change.</p>\n<h3>U. Le mécanisme du taux de change</h3>\n<h3>V. Comment le commerce influence-t-il la monnaie ?</h3>\n<p>Tout échange international possède :</p>\n<p>👉 une contrepartie monétaire.</p>\n<h4>Exemple</h4>\n<p>Une entreprise française importe un produit chinois.</p>\n<p>Elle doit obtenir des yuans.</p>\n<p>Elle :</p>\n<ul><li>vend des euros ;</li><li>demande des yuans.</li></ul>\n<p>Inversement, une entreprise chinoise qui achète français :</p>\n<ul><li>vend des yuans ;</li><li>demande des euros.</li></ul>\n<p>Le taux de change dépend notamment de :</p>\n<p>👉 l’offre et de la demande de monnaies.</p>\n<p>On peut donc établir un lien simple, toutes choses égales par ailleurs, entre commerce extérieur et taux de change.</p>\n<h3>W. Déficit commercial et dépréciation</h3>\n<p>Si :</p>\n<p>👉 importations &gt; exportations,</p>\n<p>le pays présente :</p>\n<p>👉 un déficit commercial.</p>\n<p>Les résidents ont davantage besoin de devises étrangères pour régler leurs importations.</p>\n<p>Donc, toutes choses égales par ailleurs :</p>\n<ul><li>offre de monnaie nationale ↑ → pression à la baisse sur sa valeur.</li></ul>\n<p>On parle de :</p>\n<p>👉 dépréciation.</p>\n<p>La logique s’inverse lorsque le pays exporte davantage qu’il n’importe.</p>\n<h3>X. Excédent commercial et appréciation</h3>\n<p>Si :</p>\n<p>👉 exportations &gt; importations,</p>\n<p>les étrangers doivent davantage demander la monnaie du pays pour payer ses produits.</p>\n<p>Donc :</p>\n<ul><li>demande de monnaie nationale ↑ → valeur de la monnaie ↑.</li></ul>\n<p>On parle :</p>\n<p>👉 d’appréciation.</p>\n<p>Les taux de change dépendent également :</p>\n<ul><li>des taux d’intérêt ;</li><li>des capitaux financiers ;</li><li>des anticipations ;</li><li>des banques centrales.</li></ul>\n<h4>Idée</h4>\n<p>Toutes choses égales par ailleurs, un excédent commercial exerce une pression à l’appréciation de la monnaie tandis qu’un déficit commercial tend à exercer une pression à sa dépréciation.</p>\n<p>Or une variation de la monnaie modifie directement la compétitivité-prix des entreprises.</p>\n<h3>Y. Taux de change et compétitivité-prix</h3>\n<h3>Z. Une monnaie qui s’apprécie rend les produits domestiques plus chers</h3>\n<p>Si la monnaie nationale :</p>\n<p>👉 s’apprécie,</p>\n<p>les produits domestiques deviennent relativement plus coûteux pour les acheteurs étrangers.</p>\n<p>Donc :</p>\n<ul><li>exportations plus difficiles → compétitivité-prix ↓.</li><li>Une dépréciation produit généralement l’effet inverse.</li></ul>\n<h3>AA. Une monnaie qui se déprécie peut améliorer la compétitivité-prix</h3>\n<p>monnaie ↓ → produits domestiques moins chers pour étrangers → exportations potentiellement ↑.</p>\n<h4>Idée</h4>\n<div class=\"db\"><div class=\"dt\">Le taux de change influence la compétitivité-prix</div><div class=\"dd\">une appréciation renchérit les exportations tandis qu’une dépréciation tend à rendre les produits nationaux plus compétitifs.</div></div>\n<p>Ce mécanisme permet précisément de comprendre pourquoi l’exportation massive de ressources naturelles peut affaiblir le reste de l’économie.</p>\n<h3>AB. La maladie hollandaise : comment une ressource peut empêcher la diversification</h3>\n<h3>AC. Les exportations de ressources font apprécier la monnaie</h3>\n<p>Supposons qu’un pays découvre énormément de pétrole.</p>\n<p>Ses exportations augmentent fortement.</p>\n<p>Donc :</p>\n<ul><li>demande de monnaie nationale ↑ → monnaie s’apprécie.</li><li>Cela semble positif.</li></ul>\n<p>Mais :</p>\n<p>👉 les autres entreprises exportatrices deviennent moins compétitives.</p>\n<h4>Mécanisme</h4>\n<p>boom des ressources → exportations ↑ → monnaie ↑ → compétitivité des autres secteurs ↓ → industrie décline → dépendance aux ressources ↑.</p>\n<p>C’est ce qu’on appelle :</p>\n<p>👉 la maladie hollandaise.</p>\n<h4>Idée</h4>\n<p>La maladie hollandaise désigne le mécanisme par lequel un boom des exportations de matières premières provoque une appréciation du taux de change qui pénalise les autres secteurs exportateurs et freine la diversification productive.</p>\n<p>À ce problème de compétitivité s’ajoute la forte instabilité des prix des matières premières.</p>\n<h3>AD. Une dépendance à des prix extrêmement volatils</h3>\n<p>Les prix :</p>\n<ul><li>pétrole ;</li><li>gaz ;</li><li>minerais ;</li><li>peuvent fortement varier.</li></ul>\n<p>Ainsi :</p>\n<ul><li>prix ↑ → revenus d’exportation ↑.</li></ul>\n<p>Mais :</p>\n<ul><li>prix ↓ → recettes ↓ brutalement.</li></ul>\n<p>Le pays devient donc dépendant :</p>\n<p>👉 de facteurs internationaux qu’il contrôle peu.</p>\n<h4>Deux effets</h4>\n<h4>Effet prix</h4>\n<p>variation du cours mondial.</p>\n<h4>Effet volume</h4>\n<p>variation des quantités effectivement exportées.</p>\n<h4>Idée</h4>\n<p>La spécialisation dans les matières premières rend également la croissance instable car les recettes du pays dépendent simultanément de prix internationaux très volatils et des volumes exportés.</p>\n<p>Tous les perdants ne souffrent cependant pas d’une abondance de ressources : certains sont enfermés dans une spécialisation dont les prix évoluent défavorablement.</p>\n<h3>AE. La spécialisation impasse</h3>\n<p>Une spécialisation impasse correspond à une spécialisation qui empêche durablement le pays d’améliorer son niveau de vie.</p>\n<p>Cela peut arriver lorsqu’un pays exporte :</p>\n<ul><li>biens agricoles ;</li><li>matières premières simples ;</li><li>biens à faible valeur ajoutée ;</li><li>dont les prix augmentent peu ou diminuent.</li></ul>\n<p>Pendant ce temps, il importe :</p>\n<ul><li>machines ;</li><li>technologies ;</li><li>biens manufacturés ;</li><li>dont les prix augmentent davantage.</li></ul>\n<h4>Résultat</h4>\n<p>👉 son pouvoir d’achat extérieur se dégrade.</p>\n<p>C’est précisément ce que Prebisch analyse avec les termes de l’échange.</p>\n<p>Pour Prebisch, la spécialisation primaire peut entraîner une détérioration des termes de l’échange : le prix des exportations progresse moins vite que celui des importations, ce qui réduit progressivement le pouvoir d’achat extérieur des pays périphériques.</p>\n<p>Cette situation peut aller jusqu’à produire un résultat paradoxal : exporter davantage sans devenir réellement plus riche.</p>\n<h3>AF. Bhagwati : la croissance appauvrissante</h3>\n<p>Bhagwati développe l’idée de :</p>\n<p>👉 croissance appauvrissante.</p>\n<p>Dans certaines circonstances exceptionnelles :</p>\n<ul><li>le pays augmente fortement ses exportations ;</li><li>mais cette augmentation fait tellement diminuer leur prix relatif ;</li><li>que la détérioration des termes de l’échange annule les gains de croissance.</li></ul>\n<h4>Paradoxe</h4>\n<p>production ↑maisbien-être ↓.</p>\n<h4>Idée</h4>\n<p>Bhagwati montre avec la croissance appauvrissante qu’une hausse de la production exportée peut, dans certaines circonstances, détériorer suffisamment les termes de l’échange pour réduire finalement le bien-être du pays.</p>\n<p>La mondialisation produit donc des trajectoires très différentes entre pays, mais elle transforme également la distribution des revenus à l’intérieur même des économies.</p>\n<h3>AG. Les inégalités au sein des pays se rouvrent depuis les années 1980</h3>\n<h3>AH. Une évolution historique en trois temps</h3>\n<p>Après une période de compression des écarts durant l’après-guerre, la plupart des grandes économies connaissent depuis les années 1980 une réouverture des inégalités de revenus et de patrimoine.</p>\n<p>Branko Milanovic propose un moyen simple de retenir les trois grandes familles d’explications.</p>\n<h3>AI. Milanovic : les facteurs TOP de la réouverture des inégalités</h3>\n<div class=\"formula\">T = Technologie</div>\n<p>Le progrès technique n’avantage pas nécessairement tous les travailleurs de la même manière.</p>\n<p>Il peut être :</p>\n<p>👉 biaisé en faveur des travailleurs qualifiés.</p>\n<h4>Pourquoi ?</h4>\n<p>Les nouvelles technologies :</p>\n<ul><li>augmentent la productivité des qualifiés ;</li><li>remplacent certaines tâches routinières ;</li><li>réduisent la demande de certains travailleurs peu qualifiés.</li></ul>\n<h4>Mécanisme</h4>\n<p>technologie → demande travail qualifié ↑ → rémunération qualifiés ↑ → écarts salariaux ↑.</p>\n<h4>Idée</h4>\n<p>Le progrès technique biaisé accroît les inégalités lorsqu’il augmente davantage la productivité et la rémunération des travailleurs qualifiés que celles des travailleurs peu qualifiés.</p>\n<p>Mais le progrès technique n’est pas le seul facteur : l’ouverture internationale modifie elle aussi la demande relative de travail.</p>\n<div class=\"formula\">O = Ouverture</div>\n<p>👉 mondialisation.</p>\n<p>L’ouverture peut accroître les inégalités internes par :</p>\n<ul><li>concurrence des pays à bas salaires ;</li><li>délocalisations ;</li><li>transformation des spécialisations ;</li><li>modification de la demande de qualifications.</li></ul>\n<p>Dans les pays avancés, certains travailleurs :</p>\n<ul><li>industriels ;</li><li>peu qualifiés ;</li><li>exposés à la concurrence ;</li><li>peuvent être perdants.</li></ul>\n<p>Alors que :</p>\n<ul><li>travailleurs très qualifiés ;</li><li>détenteurs de capital ;</li><li>entreprises internationalisées ;</li><li>peuvent gagner davantage.</li></ul>\n<p>Cl</p>\n<p>L’ouverture internationale peut accroître les inégalités au sein des économies développées lorsqu’elle met sous pression les travailleurs exposés à la concurrence mondiale tout en augmentant les revenus des facteurs les plus mobiles et les plus qualifiés.</p>\n<p>Enfin, les inégalités dépendent également directement des choix collectifs de redistribution.</p>\n<div class=\"formula\">P = Politique</div>\n<p>Les politiques publiques influencent directement :</p>\n<p>👉 la distribution des revenus après impôts et transferts.</p>\n<p>Depuis les années 1980, plusieurs pays ont :</p>\n<ul><li>diminué certains taux marginaux supérieurs d’imposition ;</li><li>réduit certaines formes de taxation du capital ;</li><li>modifié leurs systèmes redistributifs.</li></ul>\n<p>Thomas Piketty insiste particulièrement sur :</p>\n<p>👉 les facteurs politiques et institutionnels.</p>\n<p>Pour lui, la hausse des inégalités n’est pas simplement une conséquence automatique :</p>\n<ul><li>de la technologie ;</li><li>ou de la mondialisation.</li></ul>\n<p>Elle dépend fortement :</p>\n<p>👉 des choix politiques.</p>\n<h4>Idée</h4>\n<p>Pour Piketty, la dynamique des inégalités ne peut être expliquée par les seules forces du marché : elle dépend fondamentalement des institutions fiscales, sociales et politiques qui déterminent la répartition des revenus et du patrimoine.</p>\n<h3>AJ. Conclusion</h3>\n<p>Les trajectoires de développement montrent que la question centrale n’est pas de savoir s’il faut être ouvert ou fermé à la mondialisation.</p>\n<p>La véritable question est :</p>\n<p>👉 comment s’insérer dans la mondialisation ?</p>\n<p>Les pays qui ont réussi leur rattrapage, notamment en Asie, ont généralement combiné :</p>\n<ul><li>intervention stratégique de l’État ;</li><li>ouverture progressive ;</li><li>accueil sélectif des IDE ;</li><li>transferts technologiques ;</li><li>montée en gamme ;</li><li>transformation des avantages comparatifs.</li></ul>\n<p>À l’inverse, certains pays restent enfermés dans :</p>\n<ul><li>la malédiction des ressources ;</li><li>la maladie hollandaise ;</li><li>la volatilité des matières premières ;</li><li>la détérioration des termes de l’échange.</li></ul>\n<p>La mondialisation réduit ainsi certaines inégalités entre pays grâce au rattrapage des émergents mais peut simultanément accroître les inégalités au sein des économies.</p>\n<p>Cl</p>\n<p>L’expérience des pays émergents montre que les bénéfices de la mondialisation dépendent moins du degré d’ouverture que de la capacité à maîtriser cette ouverture : les stratégies gagnantes utilisent les IDE et les échanges pour acquérir des technologies et transformer les avantages comparatifs, tandis que les spécialisations primaires peuvent enfermer les économies dans la dépendance et la faible valeur ajoutée.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>V. Mondialisation, inégalités et courbe de l’éléphant</h2>\n<p>Pourquoi l’ouverture internationale peut-elle accroître les inégalités au sein des pays alors qu’elle réduit certaines inégalités entre pays ?</p>\n<h3>A. Idée générale</h3>\n<p>L’effet de la mondialisation sur les inégalités est ambigu.</p>\n<p>D’un côté, l’hypermondialisation a permis le rattrapage de grands pays émergents, notamment la Chine.</p>\n<p>→ Les inégalités entre certains pays ont donc diminué.</p>\n<p>Mais, d’un autre côté, l’ouverture internationale modifie la répartition des revenus à l’intérieur</p>\n<p>→ Les inégalités au sein des pays peuvent donc augmenter.</p>\n<p>L’effet distributif de la mondialisation est double : le rattrapage des émergents tend à réduire les écarts internationaux, tandis que la modification de la rémunération des facteurs et les délocalisations peuvent accroître les inégalités internes aux économies développées.</p>\n<p>Pour comprendre pourquoi l’ouverture modifie les revenus à l’intérieur d’un pays, il faut revenir à l’une des principales conséquences distributives du modèle HOS.</p>\n<h3>B. Stolper-Samuelson : le commerce international modifie la rémunération des facteurs</h3>\n<h3>C. Un résultat issu du modèle HOS</h3>\n<p>Il faut retenir l’intuition :</p>\n<div class=\"alertb\"><p>👉 lorsqu’un pays s’ouvre au commerce, les différents facteurs de production ne bénéficient pas tous de la même manière de l’ouverture.</p></div>\n<h4>Pourquoi ?</h4>\n<p>Parce que la demande pour certains facteurs augmente tandis que la demande pour d’autres diminue.</p>\n<h4>Idée</h4>\n<p>Le théorème de Stolper-Samuelson montre que l’ouverture commerciale produit des effets distributifs en modifiant différemment la rémunération des facteurs de production selon leur abondance et leur utilisation dans les secteurs exposés au commerce.</p>\n<p>Dans les pays développés, cette logique peut notamment opposer travail qualifié et travail peu qualifié.</p>\n<h3>D. Travail qualifié contre travail peu qualifié</h3>\n<p>Dans une économie avancée, le travail qualifié est relativement abondant par rapport à de nombreux pays à bas salaires.</p>\n<p>L’ouverture internationale peut donc accroître la demande pour :</p>\n<p>👉 les travailleurs qualifiés.</p>\n<p>Dans les économies développées, l’ouverture peut accroître la prime aux qualifications en augmentant relativement la demande de travail qualifié et en mettant davantage sous pression les travailleurs peu qualifiés exposés à la concurrence des pays à bas salaires.</p>\n<p>Le mécanisme théorique de Stolper-Samuelson est renforcé, dans la mondialisation contemporaine, par la possibilité pour les entreprises de déplacer directement leur production.</p>\n<h3>E. Les délocalisations renforcent certains effets distributifs de la mondialisation</h3>\n<p>Les délocalisations peuvent amplifier les effets distributifs de l’ouverture en concentrant les destructions d’emplois sur certaines catégories de travailleurs tandis que les activités qualifiées et internationalisées bénéficient davantage de la mondialisation.</p>\n<p>La mondialisation peut donc accroître les inégalités internes. Mais pour mesurer son effet sur les inégalités mondiales, il faut également tenir compte du rattrapage spectaculaire de certains pays émergents.</p>\n<h3>F. Milanovic et la courbe de l’éléphant1988-2008 (déjà vu en 1ere année)</h3>\n<h4>Pourquoi 1988-2008 ?</h4>\n<h3>G. 1988-1989 : extension du capitalisme mondial</h3>\n<p>La fin des années 1980 correspond à :</p>\n<ul><li>chute du bloc soviétique ;</li><li>transition des économies socialistes ;</li><li>ouverture de nouveaux marchés ;</li><li>généralisation du modèle de marché.</li></ul>\n<p>Avec la disparition du bloc soviétique :</p>\n<div class=\"alertb\"><p>👉 une partie beaucoup plus importante de l’économie mondiale entre dans les échanges internationaux.</p></div>\n<h4>Exemple</h4>\n<p>La Russie et les anciens pays socialistes connaissent :</p>\n<ul><li>libéralisation ;</li><li>privatisations ;</li><li>ouverture internationale ;</li></ul>\n<p>mais aussi, dans plusieurs cas :</p>\n<p>👉 forte augmentation des inégalités internes.</p>\n<p>À l’autre extrémité de la période se trouve un événement qui remet profondément en question le modèle de mondialisation libérale.</p>\n<h3>H. 2008 : une rupture</h3>\n<p>La crise financière mondiale de 2008 marque :</p>\n<p>👉 le début d’une remise en question beaucoup plus forte de l’hypermondialisation.</p>\n<p>Elle alimente :</p>\n<ul><li>critique de la finance ;</li><li>contestation des élites ;</li><li>rejet du libre-échange ;</li><li>retour du protectionnisme.</li></ul>\n<h4>Idée essentielle</h4>\n<p>1988-2008 constitue donc une période particulièrement représentative de :</p>\n<p>👉 l’hypermondialisation libérale.</p>\n<p>Cl</p>\n<p>Milanovic retient la période 1988-2008 car elle correspond à une phase d’intensification exceptionnelle de la mondialisation, comprise entre l’ouverture des économies anciennement socialistes (fin du bloc soviétique) et la rupture provoquée par la crise financière mondiale.</p>\n<p>Il peut alors comparer l’évolution des revenus des individus selon leur position dans la distribution mondiale des revenus.</p>\n<p>Les classes populaires des économies développées apparaissent comme des perdants relatifs de l’hypermondialisation : leur niveau de vie reste élevé à l’échelle mondiale mais progresse beaucoup moins rapidement que celui des émergents et des plus hauts revenus.</p>\n<p>Cette stagnation relative s’explique notamment par l’exposition de ces travailleurs aux transformations du commerce mondial.</p>\n<p>La faible progression des revenus des classes populaires des pays avancés peut nourrir un sentiment de déclassement lorsque celles-ci supportent les coûts locaux de la concurrence internationale tout en observant les gains élevés des émergents et des catégories les plus riches.</p>\n<p>Cette évolution économique possède alors des conséquences politiques majeures.</p>\n<h3>I. De la mondialisation aux réactions politiques protectionnistes</h3>\n<h3>J. Un sentiment d’injustice</h3>\n<p>Le discours économique classique dit :</p>\n<p>👉 le commerce augmente la richesse globale.</p>\n<p>Mais un travailleur exposé peut répondre :</p>\n<p>👉 « peut-être globalement, mais pas pour moi ».</p>\n<p>C’est une distinction fondamentale entre :</p>\n<p>👉 gain collectif</p>\n<p>et</p>\n<p>👉 répartition individuelle des gains.</p>\n<h4>Idée centrale</h4>\n<p>Une politique peut être :</p>\n<p>👉 efficace au niveau agrégé,</p>\n<p>mais produire :</p>\n<p>👉 des perdants identifiables.</p>\n<p>Cl</p>\n<p>La hausse du revenu mondial ne garantit pas l’acceptabilité politique de la mondialisation : les gains agrégés peuvent coexister avec des pertes concentrées sur certaines catégories sociales.</p>\n<p>Les forces politiques hostiles à la mondialisation peuvent alors exploiter ce sentiment de déclassement.</p>\n<h3>K. Le vote populiste et le retour du protectionnisme</h3>\n<p>Les populations se considérant comme perdantes peuvent soutenir des partis proposant :</p>\n<ul><li>droits de douane ;</li><li>relocalisation ;</li><li>limitation des importations ;</li><li>préférence nationale ;</li><li>protection de l’industrie.</li></ul>\n<h4>Exemple</h4>\n<p>Aux États-Unis :</p>\n<p>👉 soutien de certaines anciennes régions industrielles à Donald Trump.</p>\n<p>Le discours est :</p>\n<ul><li>concurrence étrangère → industrie américaine détruite → droits de douane → protection des emplois.</li></ul>\n<h4>Chaîne logique</h4>\n<p>mondialisation → gains inégalement répartis → déclassement de certaines catégories → mécontentement politique → populisme → protectionnisme.</p>\n<p>Cl</p>\n<p>Les conséquences distributives de l’hypermondialisation contribuent au retour du protectionnisme lorsque les catégories qui se considèrent comme perdantes soutiennent des mouvements politiques promettant de restaurer une protection face à la concurrence internationale.</p>\n<p>La courbe de l’éléphant permet ainsi de résoudre le paradoxe observé précédemment : la mondialisation peut réduire les inégalités entre pays tout en renforçant certaines inégalités internes.</p>\n<h3>L. Conclusion</h3>\n<p>La mondialisation transforme profondément la répartition mondiale des revenus.</p>\n<p>Le théorème de Stolper-Samuelson explique d’abord pourquoi l’ouverture commerciale peut favoriser certains facteurs de production au détriment d’autres, notamment en augmentant dans les pays développés l’écart entre travailleurs qualifiés et travailleurs exposés à la concurrence internationale.</p>\n<p>Les délocalisations renforcent ces effets en concentrant certaines pertes d’emplois dans les secteurs manufacturiers.</p>\n<p>Mais simultanément, l’hypermondialisation permet le rattrapage spectaculaire des grands émergents.</p>\n<p>La courbe de l’éléphant de Milanovic met ainsi en évidence trois groupes :</p>\n<ul><li>👉 classes moyennes émergentes : grands gagnants ;</li><li>👉 top 1 % mondial : grands gagnants ;</li><li>👉 classes populaires des pays développés : perdants relatifs.</li></ul>\n<p>Cette répartition explique en partie pourquoi une mondialisation favorable à la croissance mondiale peut néanmoins provoquer :</p>\n<ul><li>mécontentement ;</li><li>contestation politique ;</li><li>protectionnisme.</li></ul>\n<p>Cl</p>\n<p>Le paradoxe distributif de l’hypermondialisation réside dans le fait qu’elle a contribué au rattrapage historique des classes moyennes émergentes tout en fragilisant certaines catégories des économies avancées, créant ainsi les conditions économiques et politiques d’un retour du protectionnisme.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>VI. La balance des paiements : lecture, analyse et déséquilibres extérieurs</h2>\n<p>Comment lire une balance des paiements et que nous apprend-elle sur le financement d’une économie ?</p>\n<h3>A. Idée générale</h3>\n<p>La balance des paiements est le document de référence pour mesurer les flux entre une économie nationale et le reste du monde.</p>\n<p>Elle enregistre :</p>\n<ul><li>les échanges de biens ;</li><li>les échanges de services ;</li><li>les revenus ;</li><li>les transferts ;</li><li>les IDE ;</li><li>les placements financiers ;</li><li>les prêts et emprunts.</li></ul>\n<p>Elle permet donc de répondre à deux grandes questions :</p>\n<ul><li>Comment un pays échange-t-il avec le reste du monde ?</li></ul>\n<h4>Comment finance-t-il ses éventuels déficits extérieurs ?</h4>\n<h4>Idée centrale</h4>\n<p>La balance des paiements est toujours :</p>\n<p>👉 comptablement équilibrée.</p>\n<p>Mais cela ne signifie pas qu’il n’existe aucun déséquilibre.</p>\n<p>Il peut y avoir :</p>\n<ul><li>déficit commercial ;</li><li>excédent commercial ;</li><li>déficit courant ;</li><li>excédent courant ;</li><li>entrées nettes de capitaux ;</li><li>sorties nettes de capitaux.</li></ul>\n<p>Cl</p>\n<p>La balance des paiements est un document comptable qui enregistre l’ensemble des transactions entre résidents et non-résidents ; si elle est nécessairement équilibrée dans son ensemble, ses différents sous-comptes peuvent révéler d’importants déséquilibres extérieurs.</p>\n<p>Il faut donc distinguer deux étapes : d’abord lire la balance des paiements, puis interpréter les soldes qu’elle fait apparaître.</p>\n<h3>B. La balance des paiements est un document comptable en partie double</h3>\n<p>La balance des paiements recense tous les flux économiques et financiers entre résidents et non-résidents pendant une période donnée.</p>\n<h4>Résident / non-résident</h4>\n<p>Ce qui compte n’est pas forcément la nationalité, mais le lieu principal d’activité économique.</p>\n<p>Par exemple :</p>\n<ul><li>une entreprise étrangère implantée durablement en France peut être résidente française ;</li><li>un Français installé durablement ailleurs peut être non-résident.</li></ul>\n<p>Comme tout document comptable, la balance des paiements fonctionne en partie double.</p>\n<h3>C. Le principe de la double entrée</h3>\n<p>Chaque opération possède :</p>\n<p>👉 une contrepartie.</p>\n<h4>Exemple</h4>\n<p>La France exporte un bien pour 100 €.</p>\n<p>Il y a :</p>\n<ul><li>sortie d’un bien ;</li><li>entrée d’un paiement de 100 €.</li></ul>\n<p>Donc l’opération est enregistrée deux fois.</p>\n<h4>Conséquence</h4>\n<p>👉 la balance des paiements est nécessairement équilibrée.</p>\n<h4>Idée</h4>\n<p>Le principe de la partie double implique que toute transaction réelle ou financière possède une contrepartie, ce qui garantit l’équilibre comptable global de la balance des paiements.</p>\n<p>Pour lire ce document, il faut distinguer le « haut » de la balance des paiements du « bas ».</p>\n<h3>D. Le haut de la balance : le compte des transactions courantes</h3>\n<h3>E. Que contient-il ?</h3>\n<p>Le compte des transactions courantes comprend :</p>\n<ul><li>les biens ;</li><li>les services ;</li><li>les revenus primaires ;</li><li>les revenus secondaires.</li></ul>\n<p>On commence par la partie la plus intuitive : les biens et services.</p>\n<h3>F. Les biens et services</h3>\n<h4>1-Les biens</h4>\n<p>On retrouve :</p>\n<ul><li>exportations de marchandises ;</li><li>importations de marchandises.</li></ul>\n<h4>Crédit</h4>\n<p>👉 flux entrant de paiement.</p>\n<h4>Débit</h4>\n<p>👉 flux sortant de paiement.</p>\n<p>Donc :</p>\n<ul><li>exportation = crédit ;</li><li>importation = débit.</li></ul>\n<p>Les services fonctionnent selon la même logique.</p>\n<h4>2-Les services</h4>\n<p>Exemples :</p>\n<ul><li>tourisme ;</li><li>transport ;</li><li>services financiers ;</li><li>services aux entreprises.</li></ul>\n<h4>Exemple du tourisme</h4>\n<p>Un touriste étranger dépense en France :</p>\n<p>👉 cela revient à une exportation de service.</p>\n<p>Un Français dépense à l’étranger :</p>\n<p>👉 cela revient à une importation de service.</p>\n<h4>Idée</h4>\n<p>Les dépenses d’un non-résident en France sont assimilées à des exportations de services, tandis que les dépenses d’un résident français à l’étranger sont assimilées à des importations.</p>\n<p>Le solde commercial ne doit cependant pas être confondu avec le solde courant, car le compte courant comprend aussi des revenus.</p>\n<h3>G. Solde commercial ≠ solde courant</h3>\n<h3>H. Le solde commercial</h3>\n<p>Au sens strict :</p>\n<p>👉 biens uniquement.</p>\n<p>Au sens élargi :</p>\n<p>👉 biens + services.</p>\n<h4>Exemple France 2025</h4>\n<ul><li>exportations de biens : 624 Md€ ;</li><li>importations de biens : 682 Md€.</li></ul>\n<p>Donc :</p>\n<ul><li>624 − 682 = −58 Md€</li></ul>\n<p>👉 déficit commercial de biens : 58 Md€.</p>\n<p>Pour les services :</p>\n<ul><li>crédits : 380 ;</li><li>débits : 335.</li></ul>\n<p>Donc :</p>\n<ul><li>+45 Md€</li><li>Solde biens + services</li><li>−58 + 45 = −13 Md€ environ.</li></ul>\n<p>Mais le compte courant inclut encore deux catégories de revenus.</p>\n<h3>I. Les revenus primaires</h3>\n<p>Les revenus primaires correspondent aux revenus directement liés à la participation à la production.</p>\n<p>Ils comprennent notamment :</p>\n<ul><li>revenus du travail ;</li><li>revenus du capital.</li></ul>\n<h4>Revenus du travail</h4>\n<p>Exemples :</p>\n<ul><li>travailleurs frontaliers ;</li><li>expatriés.</li></ul>\n<h4>Revenus du capital</h4>\n<p>Exemples :</p>\n<ul><li>dividendes ;</li><li>intérêts ;</li><li>revenus d’IDE.</li></ul>\n<h4>Exemple</h4>\n<p>Un résident français détient des actions Apple :</p>\n<p>👉 les dividendes reçus depuis les États-Unis constituent un revenu primaire entrant.</p>\n<p>Inversement :</p>\n<ul><li>un non-résident détient une obligation française → intérêts payés vers l’étranger.</li></ul>\n<h4>France 2025</h4>\n<p>Le tableau donne :</p>\n<p>👉 +51 Md€ de solde de revenus primaires.</p>\n<p>On insiste sur le rôle important des :</p>\n<p>👉 revenus du capital provenant des investissements français à l’étranger.</p>\n<p>Cl</p>\n<p>Les revenus primaires retracent notamment les rémunérations du travail et du capital entre résidents et non-résidents, ce qui permet à un pays fortement investi à l’étranger de recevoir d’importants revenus de patrimoine.</p>\n<p>À ces revenus issus de la production s’ajoutent les transferts courants.</p>\n<h3>J. Les revenus secondaires</h3>\n<p>Les revenus secondaires correspondent à des transferts sans contrepartie productive directe.</p>\n<p>Exemples :</p>\n<ul><li>aide publique au développement ;</li><li>transferts entre administrations publiques ;</li><li>certains transferts européens.</li></ul>\n<h4>France 2025</h4>\n<p>Le tableau donne :</p>\n<p>👉 −50 Md€.</p>\n<h4>Pourquoi un solde négatif ?</h4>\n<p>La France étant un pays riche :</p>\n<p>👉 elle verse davantage de transferts au reste du monde qu’elle n’en reçoit.</p>\n<p>Cl</p>\n<p>Les revenus secondaires correspondent à des transferts courants sans contrepartie directe, tels que l’aide publique au développement ou certains transferts entre administrations.</p>\n<p>En additionnant biens, services, revenus primaires et revenus secondaires, on obtient le solde du compte courant.</p>\n<h3>K. Le solde courant de la France en 2025</h3>\n<p>La France est en déficit courant.</p>\n<p>Mais ce déficit reste relativement faible par rapport au déficit des seuls biens.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que :</p>\n<ul><li>excédent des services ;</li><li>excédent des revenus primaires ;</li></ul>\n<p>compensent une grande partie :</p>\n<p>👉 du déficit commercial.</p>\n<h4>Idée</h4>\n<p>En 2025, la France présente un déficit courant limité car ses excédents de services et de revenus primaires compensent en grande partie son déficit commercial de biens.</p>\n<p>Ces soldes peuvent également être analysés selon les partenaires commerciaux.</p>\n<h3>L. Les déséquilibres commerciaux bilatéraux de la France</h3>\n<h4>Avec la Chine</h4>\n<p>D’après le tableau 2025 :</p>\n<ul><li>exportations : 38 Md€</li><li>importations : 74,7 Md€</li><li>solde : −36,7 Md€</li></ul>\n<p>👉 fort déficit bilatéral.</p>\n<h4>Idée clé</h4>\n<p>La Chine est l’un des principaux contributeurs au déficit commercial français.</p>\n<h4>Avec l’Allemagne</h4>\n<p>solde : −10,9 Md€.</p>\n<p>👉 déficit également.</p>\n<h4>Avec les États-Unis</h4>\n<p>solde : +11,1 Md€.</p>\n<p>👉 excédent bilatéral français.</p>\n<h4>Intérêt politique</h4>\n<p>Ce type de déficit américain vis-à-vis de partenaires européens alimente le discours selon lequel :</p>\n<p>👉 les échanges seraient déséquilibrés ou injustes.</p>\n<p>Cl</p>\n<p>Les soldes bilatéraux montrent que le déficit global français masque des situations très différentes selon les partenaires, avec un déficit marqué vis-à-vis de la Chine mais un excédent vis-à-vis des États-Unis.</p>\n<p>Les déséquilibres ne sont pas propres à la France : certains pays sont structurellement excédentaires, d’autres durablement déficitaires.</p>\n<h3>M. Des pays durablement excédentaires et déficitaires</h3>\n<h3>N. Pays souvent excédentaires</h3>\n<p>On retrouve notamment :</p>\n<ul><li>Chine ;</li><li>Allemagne ;</li><li>Japon ;</li><li>Danemark.</li><li>Ces pays exportent durablement beaucoup.</li></ul>\n<h3>O. Pays souvent déficitaires</h3>\n<p>Le cas le plus emblématique est :</p>\n<p>👉 les États-Unis.</p>\n<p>Leur déficit commercial est :</p>\n<ul><li>ancien ;</li><li>quasi continu depuis les années 1970 ;</li><li>très important.</li></ul>\n<p>👉 plus de 1 200 Md$ en 2025</p>\n<p>Soit environ :</p>\n<p>👉 4 % du PIB pour le compte courant d’après le passage du cours.</p>\n<h4>France</h4>\n<p>Déficit plus contenu :</p>\n<p>👉 généralement bien inférieur au déficit américain.</p>\n<p>Cl</p>\n<div class=\"db\"><div class=\"dt\">Les déséquilibres extérieurs peuvent être durables</div><div class=\"dd\">l’Allemagne ou la Chine présentent souvent des excédents, tandis que les États-Unis accumulent depuis plusieurs décennies d’importants déficits.</div></div>\n<p>Ces déséquilibres commerciaux et courants ont une conséquence fondamentale : ils déterminent si une nation est en besoin ou en capacité de financement.</p>\n<h3>P. Le compte de capital : un compte secondaire dans l’analyse</h3>\n<p>Entre le compte courant et le compte financier se trouve :</p>\n<p>👉 le compte de capital.</p>\n<p>Il enregistre notamment certains transferts en capital et certaines opérations sur actifs non financiers non produits.</p>\n<p>Exemples :</p>\n<ul><li>droits ;</li><li>licences ;</li><li>actifs incorporels.</li></ul>\n<h4>Idée</h4>\n<p>Il est quantitativement beaucoup moins central pour l’analyse macroéconomique étudiée ici.</p>\n<p>Donc l’essentiel est de retenir :</p>\n<p>👉 compte courant</p>\n<p>et</p>\n<p>👉 compte financier.</p>\n<p>On arrive alors au bas de la balance des paiements, qui enregistre les mouvements de capitaux.</p>\n<h3>Q. Le bas de la balance : le compte financier</h3>\n<p>Le compte financier enregistre les mouvements de capitaux entre résidents et non-résidents.</p>\n<p>On y trouve notamment :</p>\n<ul><li>IDE ;</li><li>investissements de portefeuille ;</li><li>produits dérivés ;</li><li>autres investissements ;</li><li>avoirs de réserve.</li></ul>\n<p>La première distinction essentielle concerne les IDE et les investissements de portefeuille.</p>\n<h3>R. IDE et investissements de portefeuille</h3>\n<p>Un IDE correspond à un investissement transfrontalier permettant d’exercer une influence durable sur une entreprise étrangère, conventionnellement à partir de 10 % du capital ou des droits de vote.</p>\n<p>En dessous de cette logique de contrôle, on parle davantage de placement financier.</p>\n<h3>S. L’investissement de portefeuille</h3>\n<p>Il s’agit d’un :</p>\n<p>👉 placement financier.</p>\n<p>Exemples :</p>\n<ul><li>actions ;</li><li>obligations ;</li><li>titres de dette.</li></ul>\n<p>L’objectif est principalement :</p>\n<p>👉 rendement / diversification.</p>\n<h4>Exemple</h4>\n<p>Un Français achète 5 % d’une entreprise américaine :</p>\n<p>👉 investissement de portefeuille.</p>\n<h4>Différence essentielle</h4>\n<p>IDE → logique productive / influence durable.</p>\n<p>Portefeuille → placement.</p>\n<p>Le compte financier distingue ensuite ce que les résidents possèdent à l’étranger de ce que les étrangers possèdent sur le territoire.</p>\n<h3>T. Avoirs et engagements</h3>\n<h3>U. Les avoirs</h3>\n<p>Un avoir correspond à un actif détenu par un résident sur le reste du monde.</p>\n<p>Exemples :</p>\n<ul><li>filiale française à l’étranger ;</li><li>action américaine détenue par un Français ;</li><li>créance sur l’étranger.</li></ul>\n<h4>Donc</h4>\n<p>IDE sortant → augmentation des avoirs.</p>\n<h3>V. Les engagements</h3>\n<p>Un engagement correspond à un actif domestique détenu par un non-résident.</p>\n<p>Exemples :</p>\n<ul><li>entreprise française détenue par un étranger ;</li><li>obligation française détenue par un investisseur étranger.</li></ul>\n<h4>Donc</h4>\n<p>IDE entrant → augmentation des engagements.</p>\n<h4>Idée</h4>\n<p>Dans le compte financier, les avoirs représentent les actifs détenus à l’étranger par les résidents, tandis que les engagements correspondent aux actifs domestiques détenus par les non-résidents.</p>\n<p>Le tableau français de 2025 permet de voir concrètement ces mouvements.</p>\n<h3>W. Lecture du compte financier français en 2025</h3>\n<p>IDE</p>\n<p>Avoirs :</p>\n<p>👉 50 Md€</p>\n<p>Engagements :</p>\n<p>👉 19 Md€</p>\n<p>Solde :</p>\n<p>👉 +31 Md€</p>\n<p>Interprétation :</p>\n<p>👉 sortie nette de capitaux au titre des IDE.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que les résidents français investissent davantage à l’étranger que les non-résidents n’investissent en France.</p>\n<h3>X. Investissements de portefeuille</h3>\n<p>Avoirs :</p>\n<p>👉 335 Md€</p>\n<p>Engagements :</p>\n<p>👉 202 Md€</p>\n<p>Solde :</p>\n<p>👉 +133 Md€</p>\n<p>Donc :</p>\n<p>👉 sortie nette de capitaux.</p>\n<h3>Y. Autres investissements</h3>\n<p>Avoirs :</p>\n<p>👉 281</p>\n<p>Engagements :</p>\n<p>👉 466</p>\n<p>Solde :</p>\n<p>👉 −185 Md€</p>\n<p>Ici :</p>\n<p>👉 la France reçoit davantage de capitaux.</p>\n<p>Donc :</p>\n<p>👉 entrée nette.</p>\n<h4>Bilan</h4>\n<p>Le compte financier est presque équilibré au total :</p>\n<p>👉 solde de l’ordre de 8 Md€.</p>\n<p>Cette lecture permet de comprendre une idée macroéconomique fondamentale : le haut et le bas de la balance des paiements se répondent.</p>\n<div class=\"db\"><div class=\"dt\">XDéficit courant</div><div class=\"dd\">besoin de financement</div></div>\n<h4>Le mécanisme</h4>\n<p>Si un pays présente :</p>\n<p>👉 un déficit courant,</p>\n<p>cela signifie qu’il dépense davantage vis-à-vis du reste du monde qu’il ne reçoit.</p>\n<p>Il est alors en :</p>\n<p>👉 besoin de financement.</p>\n<h4>Comment financer ce besoin ?</h4>\n<p>👉 grâce à des capitaux étrangers.</p>\n<p>Donc :</p>\n<ul><li>déficit courant → besoin de financement → entrée nette de capitaux.</li></ul>\n<h4>Idée</h4>\n<p>Un déficit courant traduit un besoin de financement de la nation qui doit être compensé par des entrées nettes de capitaux en provenance du reste du monde.</p>\n<p>La situation inverse correspond à une capacité de financement.</p>\n<div class=\"db\"><div class=\"dt\">Excédent courant</div><div class=\"dd\">capacité de financement</div></div>\n<p>Si :</p>\n<p>👉 compte courant &gt; 0,</p>\n<p>alors le pays dégage une :</p>\n<p>👉 capacité de financement.</p>\n<p>Il dispose d’une épargne supérieure à ses besoins domestiques.</p>\n<p>Il peut donc :</p>\n<ul><li>acheter des actifs étrangers ;</li><li>prêter au reste du monde ;</li><li>réaliser des IDE sortants.</li></ul>\n<h4>Schéma</h4>\n<p>excédent courant → capacité de financement → sortie nette de capitaux.</p>\n<p>Cl</p>\n<p>Un excédent courant signifie que la nation dispose d’une capacité de financement qu’elle peut utiliser pour acquérir des actifs étrangers ou prêter au reste du monde.</p>\n<p>Cette relation n’est pas simplement comptable : elle peut être démontrée à partir de l’équilibre emplois-ressources.</p>\n<h3>Z. L’équilibre macroéconomique fondamental</h3>\n<h3>AA. L’équilibre emplois-ressources en économie ouverte</h3>\n<p>Les ressources sont :</p>\n<p>👉 production nationale + importations.</p>\n<p>Donc :</p>\n<ul><li>Y + M = C + I + G + X</li><li>On réorganise :</li><li>Y = C + I + G + X − M</li><li>avec :</li><li>Y = revenu / production ;</li><li>C = consommation ;</li><li>I = investissement ;</li><li>G = dépenses publiques ;</li><li>X = exportations ;</li><li>M = importations.</li></ul>\n<p>On peut aussi regarder le revenu selon son utilisation.</p>\n<h3>AB. L’optique du revenu</h3>\n<p>Le revenu sert à :</p>\n<ul><li>consommer ;</li><li>épargner ;</li><li>payer les impôts.</li></ul>\n<p>Donc :</p>\n<ul><li>Y = C + S + T</li><li>avec :</li><li>S = épargne ;</li><li>T = prélèvements nets.</li></ul>\n<p>En combinant les deux écritures, on obtient une égalité fondamentale.</p>\n<h3>AC. L’équation à connaître absolument</h3>\n<p>On égalise :</p>\n<ul><li>C + I + G + X − M= C + S + T.</li><li>On simplifie C.</li></ul>\n<p>On obtient :</p>\n<ul><li>X − M = (S − I) + (T − G)</li><li>Interprétation</li><li>X − M</li></ul>\n<p>👉 solde extérieur.</p>\n<h4>S − I</h4>\n<p>👉 solde épargne-investissement privé.</p>\n<h4>T − G</h4>\n<p>👉 solde budgétaire public.</p>\n<h4>Idée</h4>\n<p>L’identité macroéconomique fondamentale montre que le solde extérieur d’un pays correspond à la somme de la capacité de financement du secteur privé et du solde budgétaire public.</p>\n<p>Cette identité permet immédiatement de comprendre pourquoi un déficit extérieur peut provenir d’un manque d’épargne privée ou d’un déficit public.</p>\n<h3>AD. Besoin de financement et épargne nationale</h3>\n<div class=\"formula\">Si I &gt; S</div>\n<p>L’investissement domestique est supérieur à l’épargne.</p>\n<p>Donc :</p>\n<p>👉 l’épargne nationale ne suffit pas.</p>\n<p>Le pays doit obtenir :</p>\n<p>👉 de l’épargne étrangère.</p>\n<p>Donc :</p>\n<ul><li>entrée de capitaux.</li></ul>\n<div class=\"formula\">Si G &gt; T</div>\n<p>Les dépenses publiques sont supérieures aux recettes.</p>\n<p>Donc :</p>\n<p>👉 déficit public.</p>\n<p>Cl</p>\n<p>Un déficit extérieur peut provenir soit d’un investissement supérieur à l’épargne privée, soit d’un déficit public, ces deux composantes déterminant ensemble le besoin de financement de la nation.</p>\n<p>Lorsque déficit public et déficit extérieur apparaissent simultanément, on parle de déficits jumeaux.</p>\n<h3>AE. Les déficits jumeaux</h3>\n<p>Les déficits jumeaux correspondent à la coexistence de déficit budgétaire et déficit courant.</p>\n<h4>Relation</h4>\n<p>déficit public ↑ → demande intérieure ↑ → importations ↑ → déficit courant ↑.</p>\n<h4>Idée</h4>\n<p>L’hypothèse des déficits jumeaux désigne la relation selon laquelle une dégradation du solde budgétaire peut, via l’augmentation de la demande intérieure et des importations, contribuer à creuser le déficit courant.</p>\n<p>Les États-Unis fournissent l’exemple historique le plus classique.</p>\n<h3>AF. Premier épisode américain : Reagan dans les années 1980</h3>\n<h3>AG. Politique budgétaire expansionniste</h3>\n<p>Sous Reagan :</p>\n<ul><li>baisse des prélèvements ;</li><li>hausse des dépenses ;</li><li>notamment défense et R&amp;D.</li></ul>\n<p>Résultat :</p>\n<p>👉 déficit public important.</p>\n<p>👉 5 % du PIB en 1985.</p>\n<h3>AH. En parallèle : déficit courant</h3>\n<p>Le déficit extérieur se creuse également.</p>\n<p>Contexte :</p>\n<ul><li>dollar fort ;</li><li>concurrence japonaise ;</li><li>tensions commerciales.</li></ul>\n<h4>Résultat</h4>\n<p>👉 premier grand épisode de déficits jumeaux.</p>\n<h4>Idée</h4>\n<p>Sous Reagan, la combinaison de baisses d’impôts et de dépenses militaires élevées creuse le déficit public tandis que la demande intérieure et l’appréciation du dollar participent à la détérioration du solde courant.</p>\n<p>Le phénomène réapparaît au début des années 2000.</p>\n<h3>AI. Deuxième épisode : George W. Bush</h3>\n<p>Facteurs :</p>\n<ul><li>baisses d’impôts ;</li><li>dépenses militaires ;</li><li>guerre en Irak ;</li><li>ralentissement lié à l’éclatement de la bulle internet.</li></ul>\n<p>Résultat :</p>\n<p>👉 déficit budgétaire.</p>\n<p>En parallèle :</p>\n<p>👉 déficit courant important.</p>\n<p>Donc :</p>\n<p>👉 nouvel épisode de déficits jumeaux.</p>\n<p>Une dynamique proche réapparaît avec les politiques budgétaires contemporaines américaines.</p>\n<h3>AJ. Troisième épisode : les mandats de Trump</h3>\n<p>Dès 2017 :</p>\n<ul><li>baisse des impôts ;</li><li>politique budgétaire expansionniste.</li></ul>\n<p>Puis dans les années 2020 :</p>\n<p>👉 déficit public très élevé.</p>\n<p>👉 6 % du PIB depuis 2022.</p>\n<p>Dans le même temps :</p>\n<p>👉 déficit courant américain très important.</p>\n<h4>En 2025</h4>\n<p>👉 plus de 1 200 Md$ de déficit courant/commercial selon l’indicateur présenté,</p>\n<p>environ :</p>\n<p>👉 4 % du PIB pour le déficit extérieur évoqué.</p>\n<p>Cl</p>\n<p>Les politiques de baisse d’impôts et de soutien à la demande menées aux États-Unis contribuent à maintenir simultanément un déficit budgétaire élevé et un déficit extérieur important.</p>\n<p>Il faut maintenant comprendre précisément le mécanisme causal reliant politique budgétaire et déficit extérieur.</p>\n<h3>AK. Pourquoi un déficit public peut-il creuser le déficit extérieur ?</h3>\n<h3>AL. La politique budgétaire stimule la demande</h3>\n<p><strong>Supposons</strong> :</p>\n<ul><li>dépenses publiques ↑ ; ou</li><li>impôts ↓.</li></ul>\n<p>Alors :</p>\n<ul><li>revenu disponible ↑ → consommation ↑.</li></ul>\n<p>Mais toute la demande supplémentaire ne porte pas sur des biens domestiques.</p>\n<h3>AM. Une partie de la demande porte sur les importations</h3>\n<p>Demande intérieure ↑ → achats de produits nationaux ↑</p>\n<p>mais aussi :</p>\n<p>→ importations ↑.</p>\n<p>Donc :</p>\n<ul><li>M ↑ → X − M ↓.</li></ul>\n<h4>Schéma</h4>\n<p>politique budgétaire expansionniste → demande ↑ → importations ↑ → déficit courant ↑.</p>\n<p>Cl</p>\n<p>Le lien entre déficit budgétaire et déficit courant passe par la demande intérieure : une relance budgétaire stimule les revenus et la consommation, dont une partie se porte sur les importations, ce qui détériore le solde extérieur.</p>\n<p>À côté des flux mesurés par la balance des paiements, il faut enfin distinguer une notion de stock : la position extérieure nette.</p>\n<h3>AN. Balance des paiements et position extérieure nette : flux contre stock</h3>\n<h3>AO. Balance des paiements</h3>\n<p>Elle mesure :</p>\n<p>👉 des flux sur une période.</p>\n<p>Exemple :</p>\n<ul><li>combien de capitaux sont entrés en 2025 ?</li></ul>\n<h3>AP. Position extérieure nette</h3>\n<p>Elle mesure :</p>\n<p>👉 un stock à une date donnée.</p>\n<p>Elle compare :</p>\n<ul><li>actifs détenus par les résidents à l’étranger ;</li><li>actifs nationaux détenus par les non-résidents.</li></ul>\n<h4>Formule</h4>\n<div class=\"db\"><div class=\"dt\">PEN</div><div class=\"dd\">actifs extérieurs détenus par les résidents − engagements envers le reste du monde</div></div>\n<p>CL</p>\n<p>La balance des paiements retrace des flux tandis que la position extérieure nette mesure le stock d’actifs et d’engagements accumulés vis-à-vis du reste du monde.</p>\n<p>Le signe de la position extérieure nette indique si le pays est créancier ou débiteur net.</p>\n<h3>AQ. Position extérieure positive : le pays est créancier net</h3>\n<h3>AR. Le mécanisme</h3>\n<p>Si :</p>\n<ul><li>avoirs extérieurs &gt; engagements</li><li>alors :</li><li>PEN &gt; 0</li><li>Le pays possède davantage d’actifs dans le reste du monde que les étrangers n’en possèdent chez lui.</li></ul>\n<p>Il est donc :</p>\n<p>👉 créancier net du reste du monde.</p>\n<h4>Exemple simplifié</h4>\n<p>Résidents possèdent à l’étranger :</p>\n<p>👉 1 000 milliards.</p>\n<p>Étrangers possèdent dans le pays :</p>\n<p>👉 700 milliards.</p>\n<p>Donc :</p>\n<ul><li>PEN = +300 milliards.</li></ul>\n<h4>Idée</h4>\n<p>Une position extérieure nette positive signifie que la nation est créancière nette : la valeur de ses actifs détenus à l’étranger excède celle de ses engagements envers les non-résidents.</p>\n<p>La situation inverse caractérise un pays débiteur net.</p>\n<div class=\"db\"><div class=\"dt\">Position extérieure négative</div><div class=\"dd\">le pays est débiteur net → on inverse les chiffres → -300 MDs</div></div>\n<p>Une position extérieure nette négative traduit une situation de débiteur net : le stock d’actifs domestiques détenu par les non-résidents dépasse les avoirs extérieurs des résidents.</p>\n<p>Cette notion est directement liée à l’accumulation passée des déficits et excédents courants.</p>\n<h3>AS. Pourquoi les déficits courants répétés dégradent-ils la position extérieure nette ?</h3>\n<h3>AT. Rappel : un déficit courant crée un besoin de financement</h3>\n<h4>Schéma</h4>\n<p>déficit courant → besoin de financement → entrées nettes de capitaux.</p>\n<p>Mais ces entrées de capitaux ne sont pas gratuites : elles correspondent souvent à une augmentation des engagements envers l’étranger.</p>\n<h3>AU. Les non-résidents accumulent des actifs domestiques</h3>\n<p>Les investisseurs étrangers peuvent :</p>\n<ul><li>acheter des obligations ;</li><li>acheter des actions ;</li><li>investir dans des entreprises ;</li><li>accorder des prêts.</li></ul>\n<p>Donc :</p>\n<ul><li>engagements extérieurs ↑.</li></ul>\n<p>Si cette situation se répète :</p>\n<p>👉 la PEN tend à devenir plus négative.</p>\n<h4>Mécanisme</h4>\n<p>déficits courants répétés → entrées nettes de capitaux → engagements extérieurs ↑ → PEN ↓.</p>\n<h4>Idée</h4>\n<p>L’accumulation de déficits courants tend à dégrader la position extérieure nette puisqu’elle oblige la nation à attirer des capitaux étrangers et augmente ainsi progressivement ses engagements envers le reste du monde.</p>\n<p>Inversement, les pays durablement excédentaires accumulent généralement des actifs étrangers.</p>\n<h3>AV. Pourquoi les excédents courants améliorent-ils généralement la PEN ?</h3>\n<p>Un pays en excédent courant dispose d’une :</p>\n<p>👉 capacité de financement.</p>\n<p>Il peut utiliser cette épargne excédentaire pour :</p>\n<ul><li>prêter à l’étranger ;</li><li>acheter des titres étrangers ;</li><li>réaliser des IDE sortants.</li></ul>\n<p>Donc :</p>\n<ul><li>avoirs extérieurs ↑.</li></ul>\n<h4>Schéma</h4>\n<p>excédent courant → capacité de financement → sortie nette de capitaux → acquisition d’actifs étrangers → PEN tend à ↑.</p>\n<p>Cl</p>\n<p>Des excédents courants répétés permettent à une économie d’accumuler des créances sur le reste du monde et tendent ainsi à améliorer sa position extérieure nette.</p>\n<p>La France offre précisément un exemple de pays dont la position extérieure nette est devenue négative.</p>\n<h3>AW. La France : une position extérieure nette négative</h3>\n<p>En 2025, la France présente une position extérieure nette d’environ −30 % du PIB, ce quisignifie qu’elle est débitrice nette vis-à-vis du reste du monde.</p>\n<p>Cette situation est cohérente avec les déficits extérieurs observés régulièrement en France.</p>\n<h3>AX. Le lien avec le déficit extérieur français</h3>\n<p>La France connaît régulièrement :</p>\n<p>👉 un déficit courant ou commercial.</p>\n<p>Cela contribue au fil du temps à :</p>\n<p>👉 dégrader la PEN.</p>\n<h4>Attention</h4>\n<p>Cela ne signifie pas que les Français n’investissent pas à l’étranger.</p>\n<p>Ils investissent énormément.</p>\n<p>La question porte sur :</p>\n<p>👉 le solde.</p>\n<p>Les engagements sont simplement :</p>\n<p>👉 supérieurs aux avoirs.</p>\n<h4>Idée</h4>\n<p>Une PEN négative ne signifie pas l’absence d’investissements français à l’étranger ; elle signifie seulement que leur valeur totale reste inférieure à celle des actifs français détenus par les non-résidents.</p>\n<p>Une position extérieure très négative peut devenir préoccupante lorsqu’elle traduit une dépendance excessive au financement étranger.</p>\n<h3>AY. Pourquoi une position extérieure trop négative peut-elle être problématique ?</h3>\n<h3>AZ. Une dépendance au reste du monde</h3>\n<p>Un pays qui finance durablement ses besoins grâce aux étrangers dépend de leur volonté de continuer à :</p>\n<ul><li>acheter sa dette ;</li><li>acheter ses actions ;</li><li>investir dans ses entreprises ;</li><li>lui accorder des prêts.</li></ul>\n<p>Le risque apparaît si les investisseurs étrangers décident :</p>\n<p>👉 de réduire leurs investissements.</p>\n<h4>Mécanisme</h4>\n<h4>dépendance capitaux étrangers</h4>\n<p>confiance ↓ → entrées de capitaux ↓ → financement plus difficile.</p>\n<p>Cl</p>\n<p>Une position extérieure très négative peut accroître la vulnérabilité d’une économie en la rendant dépendante du maintien de la confiance et des financements fournis par les investisseurs étrangers.</p>\n<p>C’est pour cette raison que l’Union européenne surveille notamment cet indicateur.</p>\n<h3>BA. Le seuil européen de surveillance</h3>\n<p>La procédure européenne de surveillance des déséquilibres macroéconomiques utilise une position extérieure nette inférieure à −35 % du PIB comme signal d’alerte, sans qu’il s’agisse pour autant d’un seuil automatique d’insoutenabilité.</p>\n<p>Le cas américain est encore beaucoup plus spectaculaire que celui de la France.</p>\n<h3>BB. Les États-Unis : une position extérieure nette extrêmement négative</h3>\n<p>Les États-Unis présentent une position extérieure nette extrêmement dégradée, de l’ordre de −90 % du PIB, conséquence de décennies de déficits courants et d’entrées massives de capitaux étrangers.</p>\n<p>Une telle situation devrait a priori susciter une forte inquiétude. Pourtant, les États-Unis continuent à recevoir énormément de capitaux.</p>\n<h3>BC. Pourquoi les États-Unis peuvent-ils maintenir une PEN aussi négative ?</h3>\n<h3>BD. Les actifs américains sont extrêmement demandés</h3>\n<p>Il y a d’importants achats étrangers de :</p>\n<ul><li>Obligations américaines ;</li><li>actions américaines.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce que les États-Unis disposent :</p>\n<ul><li>de marchés financiers très profonds ;</li><li>d’actifs liquides ;</li><li>d’entreprises très attractives ;</li><li>de titres publics considérés comme sûrs.</li></ul>\n<p>Mais surtout, les États-Unis disposent d’un avantage qu’aucune autre économie ne possède à la même échelle.</p>\n<h3>BE. Le rôle international du dollar</h3>\n<p>Le rôle international du dollar permet aux États-Unis de financer durablement leurs déficits extérieurs car la demande mondiale d’actifs américains reste exceptionnellement forte.</p>\n<p>Mais cette situation pose malgré tout une question fondamentale de soutenabilité.</p>\n<h3>BF. Le risque américain : que se passerait-il si les capitaux étrangers entraient moins ?</h3>\n<p>Aujourd’hui :</p>\n<ul><li>déficit courant américain → besoin de financement</li><li>mais :</li><li>forte demande d’actifs américains → entrées de capitaux importantes.</li></ul>\n<p>L’équilibre tient donc tant que :</p>\n<p>👉 les investisseurs internationaux souhaitent continuer à financer les États-Unis.</p>\n<h4>Si la demande diminuait fortement</h4>\n<p>Alors potentiellement :</p>\n<ul><li>financement extérieur plus difficile ;</li><li>taux d’intérêt ↑ ;</li><li>pression sur le dollar ;</li><li>nécessité de réduire le déficit extérieur ;</li><li>ajustement de la demande intérieure.</li></ul>\n<h4>Idée centrale</h4>\n<p>Le problème n’est pas simplement :</p>\n<p>👉 « la PEN est négative ».</p>\n<p>La véritable question est :</p>\n<p>👉 le pays conserve-t-il la capacité d’attirer durablement des capitaux ?</p>\n<p>Cl</p>\n<p>La soutenabilité d’une position extérieure négative dépend moins de son seul montant que de la capacité durable du pays à attirer les capitaux nécessaires au financement de ses déficits.</p>\n<p>La position extérieure nette permet donc de transformer l’analyse de court terme de la balance des paiements en une analyse patrimoniale de long terme.</p>\n<h3>BG. Le lien complet entre balance des paiements et position extérieure nette</h3>\n<h4>Étape 1</h4>\n<p>Un pays présente :</p>\n<p>👉 déficit courant.</p>\n<h4>Étape 2</h4>\n<p>Il est en :</p>\n<p>👉 besoin de financement.</p>\n<h4>Étape 3</h4>\n<p>Il attire :</p>\n<p>👉 capitaux étrangers.</p>\n<h4>Étape 4</h4>\n<p>Les non-résidents acquièrent :</p>\n<p>👉 davantage d’actifs domestiques.</p>\n<h4>Étape 5</h4>\n<p>Les engagements s’accumulent.</p>\n<h4>Étape 6</h4>\n<p>La position extérieure nette :</p>\n<p>👉 se dégrade.</p>\n<h4>Schéma</h4>\n<h4>Déficit courant</h4>\n<h4>Besoin de financement</h4>\n<h4>Entrées nettes de capitaux</h4>\n<h4>Engagements extérieurs ↑</h4>\n<h4>PEN se dégrade</h4>\n<p>Et inversement :</p>\n<ul><li>Excédent courant</li><li>Capacité de financement</li><li>Sorties nettes de capitaux</li><li>Avoirs extérieurs ↑</li><li>PEN s’améliore</li><li>Idée</li></ul>\n<p>La position extérieure nette constitue ainsi la trace patrimoniale de l’accumulation passée des déséquilibres extérieurs : des déficits courants répétés tendent à dégrader le patrimoine extérieur net, tandis que des excédents permettent d’accumuler des créances sur le reste du monde.</p>\n<h3>BH. Attention : une variation de la PEN ne vient pas uniquement des flux</h3>\n<p>Point important pour comprendre parfaitement la notion.</p>\n<p>La PEN dépend :</p>\n<ul><li>des nouveaux flux de capitaux ;</li><li>mais aussi de la variation de la valeur des actifs déjà détenus.</li></ul>\n<h4>Exemple</h4>\n<p>Un Français possède une action américaine valant 100.</p>\n<p>Si elle passe à 150 :</p>\n<p>👉 l’avoir extérieur français augmente de 50,</p>\n<p>même si le Français :</p>\n<p>👉 n’a acheté aucune nouvelle action.</p>\n<p>Cela vient d’un :</p>\n<p>👉 effet de valorisation.</p>\n<p>La PEN peut également varier à cause :</p>\n<ul><li>des cours boursiers ;</li><li>du prix des obligations ;</li><li>des taux de change.</li></ul>\n<p>Cl</p>\n<p>La position extérieure nette ne dépend pas seulement de l’accumulation des flux financiers : les variations de prix des actifs et de taux de change peuvent également modifier la valeur des avoirs et engagements existants.</p>\n<h3>BI. Conclusion</h3>\n<p>La balance des paiements permet de comprendre simultanément :</p>\n<ul><li>les échanges réels ;</li><li>les mouvements financiers ;</li><li>les besoins et capacités de financement des nations.</li></ul>\n<p>Son point essentiel est que :</p>\n<p>👉 le haut et le bas se répondent.</p>\n<p>Un pays en déficit courant doit se financer auprès du reste du monde, tandis qu’un pays en excédent courant dispose d’une capacité de financement qu’il peut placer à l’étranger.</p>\n<p>Cette relation est résumée par l’identité fondamentale :</p>\n<ul><li>X − M = (S − I) + (T − G)</li><li>Elle permet notamment de comprendre les déficits jumeaux, particulièrement visibles aux États-Unis.</li></ul>\n<p>Enfin, l’accumulation historique des flux financiers se retrouve dans la position extérieure nette, qui permet d’évaluer le patrimoine ou l’endettement net d’une économie vis-à-vis du reste du monde.</p>\n<p>Cl</p>\n<p>La balance des paiements ne constitue pas seulement un outil comptable de mesure des échanges : son articulation entre compte courant et compte financier révèle la contrainte de financement externe des nations, un déficit courant impliquant nécessairement un recours net à l’épargne du reste du monde.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>VII. Un déficit extérieur est-il toujours un problème ?</h2>\n<h4>Comment interpréter un déficit courant ou commercial ?</h4>\n<h3>A. Idée générale</h3>\n<p>Un déficit extérieur peut être :</p>\n<ul><li>le signe d’une faiblesse économique réelle ;</li><li>le signe d’une dépendance vis-à-vis de l’étranger ;</li><li>le résultat d’un manque de compétitivité ;</li><li>mais aussi parfois le reflet d’un investissement élevé et donc d’une dynamique de développement.</li></ul>\n<p>Donc :</p>\n<p>👉 un déficit extérieur n’est pas nécessairement mauvais en soi.</p>\n<p>Tout dépend :</p>\n<ul><li>de sa durée ;</li><li>de son ampleur ;</li><li>de sa cause ;</li><li>de la manière dont il est financé ;</li><li>de la capacité du pays à continuer à attirer des capitaux.</li></ul>\n<h4>Idée centrale</h4>\n<p>Il faut éviter deux erreurs :</p>\n<ul><li>penser qu’un déficit extérieur est toujours une catastrophe ;</li><li>penser qu’un excédent extérieur est toujours une bonne nouvelle.</li></ul>\n<p>Cl</p>\n<p>Un déficit courant n’est pas nécessairement alarmant : sa gravité dépend de ses causes, de sa persistance et de la capacité du pays à financer durablement son besoin de financement.</p>\n<p>Le cas américain illustre parfaitement cette nécessité de nuancer l’interprétation des déficits extérieurs.</p>\n<h3>B. Trump interprète le déficit américain comme le résultat d’une concurrence déloyale</h3>\n<h3>C. Le constat américain</h3>\n<p>Les États-Unis connaissent un déficit courant important, de l’ordre de :</p>\n<p>👉 3 à 4 % du PIB.</p>\n<p>Le déficit commercial est lui aussi très élevé.</p>\n<p>Donald Trump interprète principalement ce déficit comme le résultat :</p>\n<p>👉 des pratiques commerciales des autres pays.</p>\n<p>Mais les pratiques reprochées ne sont pas les mêmes selon les partenaires.</p>\n<h3>D. La Chine est accusée de fausser la concurrence</h3>\n<p>Trump reproche notamment à la Chine :</p>\n<ul><li>de subventionner ses entreprises ;</li><li>de soutenir artificiellement ses exportations ;</li><li>de maintenir un yuan sous-évalué ;</li><li>de fausser les règles du commerce international.</li></ul>\n<h4>Logique</h4>\n<p>subventions + monnaie faible → prix chinois plus bas → exportations chinoises plus compétitives → déficit américain.</p>\n<p>L’Union européenne est accusée d’un autre type de protectionnisme.</p>\n<h3>E. Les Européens sont accusés de protectionnisme réglementaire</h3>\n<p>Trump reproche à l’Union européenne :</p>\n<ul><li>des normes techniques ;</li><li>des normes sanitaires ;</li><li>des règles réglementaires ;</li><li>qui limiteraient l’accès des produits américains au marché européen.</li></ul>\n<p>Selon cette lecture :</p>\n<ul><li>normes européennes → exportations américaines freinées → déficit américain.</li></ul>\n<h4>Idée essentielle</h4>\n<p>Le déficit est donc interprété comme le résultat d’un commerce « injuste ».</p>\n<p>Mais cette lecture est jugée largement insuffisante par les économistes, car elle ignore les causes macroéconomiques internes du déficit américain.</p>\n<h3>F. Les vraies causes macroéconomiques du déficit américain</h3>\n<h3>G. Première cause : le déficit public</h3>\n<p>Rappel de l’identité fondamentale :</p>\n<ul><li>X − M = (S − I) + (T − G)</li><li>Avec :</li><li>X − M = solde extérieur ;</li></ul>\n<div class=\"db\"><div class=\"dt\">S − I</div><div class=\"dd\">solde épargne-investissement privé ;</div></div>\n<div class=\"formula\">T − G = solde public.</div>\n<p>Aux États-Unis :</p>\n<p>👉 T − G est fortement négatif.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que le déficit public est autour de :</p>\n<p>👉 6 % du PIB.</p>\n<p>Donc, toutes choses égales par ailleurs :</p>\n<ul><li>déficit public ↑ → solde extérieur se dégrade.</li></ul>\n<h4>Idée</h4>\n<p>Une partie importante du déficit courant américain s’explique par le déficit budgétaire élevé : selon l’identité macroéconomique, une dégradation du solde public tend à détériorer le solde extérieur.</p>\n<p>Mais le déficit public n’est pas la seule cause.</p>\n<h3>H. Deuxième cause : l’investissement est supérieur à l’épargne</h3>\n<p>Les États-Unis :</p>\n<p>👉 investissent davantage qu’ils n’épargnent.</p>\n<p><strong>Donc</strong> :</p>\n<ul><li>I &gt; S</li><li>et ainsi :</li><li>S − I &lt; 0</li><li>Cela crée :</li></ul>\n<p>👉 un besoin de financement.</p>\n<p>Ce besoin est financé par :</p>\n<p>👉 l’épargne du reste du monde.</p>\n<h4>Idée</h4>\n<p>Les États-Unis « vivent au-dessus de leurs moyens » dans le sens où :</p>\n<ul><li>consommation élevée ;</li><li>investissement élevé ;</li><li>épargne domestique insuffisante.</li><li>Ils doivent donc attirer des capitaux extérieurs.</li></ul>\n<p>On comprend donc qu’un déficit commercial ne peut pas être expliqué uniquement par les comportements des partenaires étrangers.</p>\n<h3>I. Premier signal inquiétant : un déficit peut révéler un problème de compétitivité</h3>\n<h3>J. Deux formes de compétitivité</h3>\n<p>La compétitivité peut être :</p>\n<ul><li>Compétitivité-prix=Capacité à vendre grâce à des prix faibles ou compétitifs.</li></ul>\n<p>Elle dépend notamment :</p>\n<ul><li>coûts du travail ;</li><li>productivité ;</li><li>taux de change ;</li><li>coûts de production.</li></ul>\n<div class=\"formula\">Compétitivité hors prix=Capacité à vendre grâce à :</div>\n<ul><li>qualité ;</li><li>innovation ;</li><li>marque ;</li><li>design ;</li><li>gamme ;</li><li>technologie.</li></ul>\n<h4>Idée</h4>\n<p>Un déficit extérieur peut révéler une insuffisance de compétitivité, soit par des coûts trop élevés, soit par une qualité, une innovation ou une différenciation insuffisantes.</p>\n<p>La France constitue un exemple classique d’un manque de cohérence entre coûts et gamme de production.</p>\n<h3>K. Le problème français : des coûts élevés pour une spécialisation trop moyenne gamme</h3>\n<h3>L. Le décalage français</h3>\n<p>La France souffre d’un décalage entre son niveau de coût et son positionnement productif : ses coûts sont proches de ceux des économies haut de gamme alors que sa spécialisation reste plus souvent moyenne gamme.</p>\n<p>Cette sensibilité au prix peut être mesurée grâce à l’élasticité-prix des exportations.</p>\n<h3>M. L’élasticité-prix des exportations</h3>\n<p>Une élasticité mesure la sensibilité d’une variable à la variation d’une autre.</p>\n<p>Ici, on mesure :</p>\n<p>👉 la réaction des exportations à une variation des prix.</p>\n<h4>Formule intuitive</h4>\n<div class=\"db\"><div class=\"dt\">Élasticité-prix des exportations</div><div class=\"dd\">variation % des exportations / variation % des prix</div></div>\n<h4>Exemple</h4>\n<p>Plus cette élasticité est faible, moins les exportations dépendent du prix.</p>\n<h3>N. Une élasticité faible révèle une forte compétitivité hors prix</h3>\n<h4>Allemagne</h4>\n<h4>Pourquoi ?</h4>\n<p>Parce que les clients achètent pour :</p>\n<ul><li>qualité ;</li><li>spécialisation ;</li><li>réputation ;</li><li>différenciation.</li></ul>\n<h4>Idée</h4>\n<p>Une faible élasticité-prix des exportations signifie que la demande étrangère est peu sensible aux prix, ce qui traduit généralement une forte compétitivité hors prix.</p>\n<p>La France est plus exposée à la concurrence par les prix.</p>\n<h3>O. La France : une élasticité plus élevée</h3>\n<p>On retient environ :</p>\n<p>👉 0,8.</p>\n<p>Donc si les prix augmentent de 10 % :</p>\n<p>→ les volumes exportés diminuent davantage qu’en Allemagne.</p>\n<p>Cela montre que :</p>\n<p>👉 les produits français sont plus substituables.</p>\n<p>Ils sont donc plus exposés à :</p>\n<p>👉 la compétitivité-prix.</p>\n<h4>Idée</h4>\n<p>L’élasticité-prix plus élevée des exportations françaises indique une plus forte dépendance à la compétitivité-prix et donc une moindre capacité à imposer des prix élevés grâce à la qualité ou à la différenciation.</p>\n<p>Le problème français est renforcé par un autre facteur structurel : la désindustrialisation et les stratégies des firmes multinationales.</p>\n<h3>P. Deuxième signal inquiétant : désindustrialisation et délocalisations</h3>\n<h3>Q. Le comportement des FMN françaises</h3>\n<p>Les firmes françaises ont souvent :</p>\n<p>👉 délocalisé une part importante de leur chaîne de production.</p>\n<p>Plus fortement que certaines entreprises allemandes.</p>\n<h4>Mécanisme</h4>\n<p>délocalisation → production domestique ↓ → biens réimportés ↑ → importations ↑ → déficit commercial ↑.</p>\n<p>Cl</p>\n<p>Les délocalisations peuvent contribuer au déficit commercial en réduisant la production domestique et en obligeant ensuite le pays à réimporter les biens destinés à satisfaire sa propre demande.</p>\n<p>Ce mécanisme peut être généralisé à la désindustrialisation.</p>\n<div class=\"db\"><div class=\"dt\">Désindustrialisation</div><div class=\"dd\">dépendance accrue aux importations</div></div>\n<p>Si un pays produit moins de biens industriels sur son territoire :</p>\n<p>👉 il doit davantage importer pour satisfaire sa demande.</p>\n<p>Donc :</p>\n<ul><li>désindustrialisation → offre domestique ↓ → importations ↑.</li></ul>\n<h4>Idée</h4>\n<p>Un déficit commercial persistant peut être le symptôme d’une désindustrialisation lorsque l’économie ne produit plus suffisamment de biens pour répondre à sa demande intérieure.</p>\n<p>La dépendance ne concerne pas uniquement l’industrie manufacturière : elle peut aussi être énergétique.</p>\n<h3>R. Troisième signal inquiétant : la dépendance énergétique</h3>\n<h3>S. Un déficit peut révéler une dépendance extérieure</h3>\n<p>Un pays peut importer massivement :</p>\n<ul><li>pétrole ;</li><li>gaz ;</li><li>charbon ;</li><li>électricité.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’il ne produit pas suffisamment d’énergie.</p>\n<p>Le déficit extérieur révèle alors :</p>\n<p>👉 une dépendance stratégique.</p>\n<h3>T. Exemple européen : le gaz russe</h3>\n<p>Avant 2022 :</p>\n<p>👉 environ 40 % des besoins gaziers européens étaient satisfaits par du gaz russe</p>\n<p>Après l’invasion de l’Ukraine :</p>\n<ul><li>l’Union européenne doit :</li><li>réduire sa dépendance ;</li><li>diversifier ses fournisseurs ;</li><li>développer de nouvelles infrastructures ;</li><li>acheter ailleurs.</li></ul>\n<h4>Conséquence</h4>\n<p>La dépendance commerciale devient :</p>\n<p>👉 un problème géopolitique et de sécurité.</p>\n<h4>Idée</h4>\n<p>Un déficit extérieur peut révéler une dépendance énergétique préoccupante lorsque l’économie dépend fortement d’un fournisseur étranger pour satisfaire des besoins essentiels.</p>\n<p>Un déficit extérieur peut également provoquer des effets monétaires particulièrement dangereux dans certains pays.</p>\n<h3>U. Quatrième signal inquiétant : le cercle vicieux des monnaies faibles</h3>\n<h3>V. Déficit extérieur et dépréciation</h3>\n<p>Toutes choses égales par ailleurs :</p>\n<ul><li>déficit commercial important → offre de monnaie nationale ↑ → monnaie se déprécie.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce que les résidents vendent leur monnaie pour acheter des devises afin de payer les importations.</p>\n<p>Cette dépréciation renchérit alors les importations.</p>\n<h3>W. Les importations deviennent plus chères</h3>\n<p>Si la monnaie nationale perd de sa valeur :</p>\n<p>👉 le dollar devient relativement plus cher.</p>\n<p>Or de nombreux biens sont libellés en dollars :</p>\n<ul><li>pétrole ;</li><li>matières premières ;</li><li>biens importés.</li></ul>\n<p>Donc :</p>\n<ul><li>mêmes quantités importées → coût en monnaie nationale ↑.</li></ul>\n<h4>Cercle vicieux</h4>\n<p>déficit extérieur → monnaie ↓ → importations plus chères → déficit extérieur ↑ → monnaie ↓ encore.</p>\n<p>C’est :</p>\n<ul><li>le cercle vicieux des monnaies faibles</li><li>Idée</li></ul>\n<p>Le cercle vicieux des monnaies faibles apparaît lorsqu’un déficit extérieur provoque une dépréciation qui renchérit les importations et aggrave à son tour le déficit.</p>\n<p>Cette spirale extérieure peut ensuite devenir une spirale inflationniste.</p>\n<h3>X. Dépréciation et inflation importée</h3>\n<p>Importations plus chères → coûts de production ↑ → prix domestiques ↑.</p>\n<p>Cela peut générer :</p>\n<p>👉 inflation importée.</p>\n<p>Dans les cas extrêmes :</p>\n<p>👉 hyperinflation.</p>\n<h4>Exemples</h4>\n<ul><li>Argentine ;</li><li>Liban ;</li><li>Turquie.</li></ul>\n<h4>Idée</h4>\n<p>La dépréciation monétaire peut transmettre le déséquilibre extérieur à l’économie domestique par l’inflation importée, particulièrement lorsque le pays dépend fortement de biens libellés en devises étrangères.</p>\n<p>Mais ce cercle vicieux ne s’enclenche pas nécessairement, car une monnaie plus faible peut également stimuler les exportations.</p>\n<h3>Y. Limite : une dépréciation peut aussi améliorer la compétitivité</h3>\n<p>Une monnaie qui se déprécie :</p>\n<p>👉 renchérit les importations</p>\n<p>mais aussi :</p>\n<p>👉 rend les exportations moins chères pour les étrangers.</p>\n<p>Donc :</p>\n<ul><li>exportations peuvent ↑.</li></ul>\n<p>À terme :</p>\n<ul><li>X ↑ → solde extérieur peut s’améliorer.</li></ul>\n<p>Cela renvoie ici à :</p>\n<p>👉 la courbe en J.</p>\n<h4>Idée générale</h4>\n<p>Dans un premier temps :</p>\n<ul><li>dépréciation → facture des importations ↑ → solde peut se dégrader.</li></ul>\n<p>Puis :</p>\n<ul><li>volumes exportés ↑</li><li>importations ↓ → solde s’améliore.</li></ul>\n<p>Cl</p>\n<p>Une dépréciation ne conduit donc pas nécessairement à un cercle vicieux : si les exportations réagissent suffisamment, le gain de compétitivité-prix peut à terme améliorer le solde extérieur, selon la logique de la courbe en J.</p>\n<p>Le quatrième grand problème d’un déficit durable concerne son financement.</p>\n<h3>Z. Cinquième signal inquiétant : le déficit doit être financé</h3>\n<div class=\"db\"><div class=\"dt\">Déficit courant</div><div class=\"dd\">besoin de financement</div></div>\n<p>Rappel :</p>\n<ul><li>déficit courant → besoin de financement.</li></ul>\n<p>Un déficit courant n’est soutenable que si le pays parvient à attirer durablement les capitaux étrangers nécessaires à son financement.</p>\n<p>Mais cette dépendance au financement étranger dégrade progressivement la position extérieure nette.</p>\n<h3>AA. Accumulation des engagements extérieurs</h3>\n<p>Déficits répétés → capitaux étrangers entrants → non-résidents détiennent davantage d’actifs domestiques → engagements extérieurs ↑ → PEN se dégrade.</p>\n<p>Le pays devient :</p>\n<p>👉 davan
