dialisation multidimensionnelle.</p>\n<h3>R. Une démondialisation sur tous les fronts</h3>\n<p>L’entre-deux-guerres constitue une véritable démondialisation car les flux commerciaux, migratoires, financiers et monétaires se contractent simultanément.</p>\n<p>Cette crise de la mondialisation s’accompagne aussi d’un basculement géopolitique majeur.</p>\n<h3>S. La suprématie européenne est profondément affaiblie</h3>\n<p>Avant 1914 :</p>\n<p>👉 Europe au centre du monde.</p>\n<p>Principales puissances :</p>\n<ul><li>Royaume-Uni ;</li><li>France ;</li><li>Allemagne.</li></ul>\n<p>Mais la Première Guerre mondiale :</p>\n<ul><li>détruit du capital ;</li><li>augmente les dettes ;</li><li>fragilise les États ;</li><li>réduit leur capacité productive ;</li><li>affaiblit leur poids international.</li></ul>\n<h4>Idée</h4>\n<p>La Première Guerre mondiale accélère le déclin relatif de l’Europe en affaiblissant les puissances qui avaient dominé l’économie mondiale depuis le XI Xe siècle.</p>\n<p>Dans le même temps, les États-Unis prennent une importance économique considérable.</p>\n<h3>T. Les États-Unis deviennent la première puissance productive</h3>\n<p>En 1928 :</p>\n<p>👉 les États-Unis réalisent environ 42 % de la production industrielle mondiale.</p>\n<p>C’est énorme.</p>\n<p>Ils deviennent donc :</p>\n<p>👉 la principale puissance industrielle.</p>\n<h4>Mais paradoxe</h4>\n<p>Ils ne réalisent qu’environ :</p>\n<p>👉 14 % des exportations mondiales.</p>\n<h4>Interprétation</h4>\n<p>Ils produisent énormément :</p>\n<p>👉 mais exportent relativement peu.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que :</p>\n<ul><li>immense marché intérieur ;</li><li>faible dépendance extérieure ;</li><li>économie encore relativement tournée vers elle-même.</li></ul>\n<h4>Idée</h4>\n<p>À la fin des années 1920, les États-Unis dominent déjà la production industrielle mondiale mais restent une économie relativement peu internationalisée, leur poids commercial demeurant très inférieur à leur poids productif.</p>\n<p>Cela signifie qu’ils ne jouent pas encore pleinement le rôle de leader du système mondial.</p>\n<h3>U. Avant 1945, les États-Unis ne sont pas encore le leader de l’ordre économique mondial</h3>\n<p>Ils sont :</p>\n<p>👉 la première puissance économique.</p>\n<p>Mais ils ne sont pas encore :</p>\n<p>👉 le véritable organisateur du système international.</p>\n<h4>Exemple monétaire</h4>\n<p>La principale monnaie internationale reste :</p>\n<p>👉 la livre sterling.</p>\n<p>Pas encore :</p>\n<p>👉 le dollar.</p>\n<h4>Exemple commercial</h4>\n<p>Les États-Unis :</p>\n<ul><li>sont protectionnistes ;</li><li>restent relativement isolationnistes ;</li><li>n’organisent pas encore activement l’ouverture mondiale.</li></ul>\n<h4>Idée</h4>\n<p>Avant 1945, les États-Unis disposent de la puissance économique sans encore exercer pleinement le leadership institutionnel et monétaire qui caractérisera l’après-guerre.</p>\n<p>Ce décalage entre puissance économique et leadership international va disparaître après la Seconde Guerre mondiale.</p>\n<h3>V. Après 1945 : les États-Unis prennent véritablement le leadership</h3>\n<p>Après la Seconde Guerre mondiale :</p>\n<div class=\"alertb\"><p>👉 les États-Unis décident de jouer un rôle central dans l’organisation de l’économie mondiale.</p></div>\n<p>Ils participent à la mise en place :</p>\n<ul><li>de nouvelles règles commerciales ;</li><li>d’un nouveau système monétaire ;</li><li>d’institutions internationales ;</li><li>d’un nouvel ordre économique.</li></ul>\n<h4>Idée centrale</h4>\n<p>Ils deviennent :</p>\n<p>👉 le moteur de la remondialisation.</p>\n<p>Cl</p>\n<p>C’est seulement après 1945 que les États-Unis transforment leur suprématie économique en véritable leadership international en organisant les règles de la nouvelle mondialisation.</p>\n<h3>W. Conclusion</h3>\n<p>Le repli de l’entre-deux-guerres montre comment une mondialisation peut se défaire.</p>\n<p>La crise de 1929 conduit les États à chercher des solutions nationales à un problème mondial. Chacun tente de protéger son marché, de limiter ses importations et de gagner en compétitivité.</p>\n<p>Mais ces stratégies se neutralisent mutuellement et produisent :</p>\n<ul><li>une guerre commerciale ;</li><li>une guerre monétaire ;</li><li>un effondrement des échanges ;</li><li>une contraction des migrations et des capitaux.</li></ul>\n<p>Cette période accélère également le déclin de la suprématie européenne et l’ascension des États-Unis.</p>\n<p>Cl</p>\n<p>Le repli de l’entre-deux-guerres illustre l’échec des stratégies non coopératives : en cherchant chacun à exporter sa crise, les États provoquent collectivement un effondrement des échanges et transforment le ralentissement économique en véritable démondialisation.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XVII. La mondialisation depuis 1945 : remondialisation, hypermondialisation et nouvelle géographie des échanges</h2>\n<p>Comment la mondialisation se reconstruit-elle après 1945, puis change-t-elle profondément de nature à partir des années 1980-1990 ?</p>\n<h3>A. Idée générale</h3>\n<p>Depuis 1945, on peut distinguer deux grandes phases :</p>\n<ul><li>la remondialisation, de 1945 aux années 1980 ;</li><li>l’hypermondialisation, à partir de la fin des années 1980 / début des années 1990 jusqu’à la crise de 2008.</li></ul>\n<p>Depuis 2008, une nouvelle question apparaît :</p>\n<div class=\"alertb\"><p>👉 sommes-nous encore dans l’hypermondialisation, ou sommes-nous entrés dans une nouvelle phase de ralentissement, de régionalisation voire de démondialisation partielle ?</p></div>\n<h4>Idée</h4>\n<p>La mondialisation d’après-guerre repose d’abord sur une reconstruction progressive des échanges, puis l’hypermondialisation se distingue par :</p>\n<ul><li>une explosion des flux ;</li><li>la fragmentation des chaînes de valeur ;</li><li>la montée en puissance des services ;</li><li>l’intégration de nouveaux pays ;</li><li>la montée de la Chine ;</li><li>la baisse des barrières commerciales ;</li><li>une régionalisation accrue.</li></ul>\n<h4>Idée</h4>\n<p>La mondialisation d’après 1945 se déroule en deux temps : une remondialisation progressive sous l’impulsion des États-Unis, puis une hypermondialisation caractérisée par l’explosion des échanges, la fragmentation des chaînes de valeur et l’intégration croissante des économies émergentes.</p>\n<p>La première phase est celle d’un retour progressif à l’ouverture après l’effondrement de l’entre-deux-guerres.</p>\n<h3>B. 1945-1980 : une remondialisation progressive</h3>\n<h3>C. Les échanges progressent plus vite que le PIB</h3>\n<p>Depuis l’après-guerre, le commerce international progresse plus rapidement que la production mondiale (PIB), ce qui entraîne une hausse durable des taux d’ouverture.</p>\n<p>Mais cette réouverture est d’abord lente.</p>\n<h3>D. La remondialisation reste longtemps incomplète</h3>\n<p>La remondialisation d’après-guerre est progressive : il faut attendre les années 1980 pour retrouver les niveaux d’ouverture commerciale de 1913.</p>\n<p>Cette remondialisation repose sur plusieurs facteurs.</p>\n<h3>E. Première raison : la baisse des coûts de transport et de communication</h3>\n<p>La conteneurisation constitue l’une des grandes innovations de l’après-guerre en réduisant fortement les coûts logistiques du commerce international.</p>\n<h3>F. La baisse des coûts de communication</h3>\n<p>La baisse des coûts de communication complète la révolution logistique en rendant plus simple la coordination d’activités productives dispersées à l’échelle mondiale.</p>\n<p>Mais contrairement à la première mondialisation, l’après-guerre repose aussi sur une forte volonté institutionnelle.</p>\n<h3>G. Deuxième raison : le multilatéralisme commercial</h3>\n<h3>H. Le GATT</h3>\n<p>Après 1945, les États-Unis organisent un cadre commercial multilatéral.</p>\n<p>Le GATT vise à :</p>\n<p>👉 réduire les obstacles au commerce.</p>\n<h4>Résultat</h4>\n<p>À la sortie de la Seconde Guerre mondiale :</p>\n<p>👉 droits de douane moyens ≈ 40 %.</p>\n<p>À la fin des années 1960 :</p>\n<p>👉 environ 10 %.</p>\n<p>Donc :</p>\n<p>👉 division par quatre.</p>\n<h4>Idée</h4>\n<p>Le GATT organise une baisse coordonnée des droits de douane et constitue l’un des piliers de la remondialisation commerciale.</p>\n<p>Sur le plan monétaire, la stabilité est aussi recherchée.</p>\n<h3>I. Bretton Woods réduit le risque de change</h3>\n<p>Après 1945 :</p>\n<p>👉 mise en place d’un système de changes fixes.</p>\n<p>Les monnaies sont ancrées :</p>\n<p>👉 au dollar.</p>\n<p>Le dollar est lui-même lié :</p>\n<p>👉 à l’or.</p>\n<h4>Pourquoi cela favorise-t-il le commerce ?</h4>\n<p>Parce que les entreprises ont moins d’incertitude sur :</p>\n<p>👉 le taux de change futur.</p>\n<h4>Exemple</h4>\n<p>Une entreprise signe un contrat aujourd’hui et doit payer dans six mois.</p>\n<p>Si le taux de change fluctue fortement :</p>\n<p>👉 risque de perte.</p>\n<p>Avec un change fixe :</p>\n<p>👉 ce risque diminue fortement.</p>\n<h4>Conséquence</h4>\n<p>risque de change ↓ → coût d’assurance ↓ → commerce ↑.</p>\n<h4>Idée</h4>\n<p>Le système de Bretton Woods favorise le commerce international en réduisant l’incertitude liée aux fluctuations des taux de change.</p>\n<p>Cette coopération reste cependant surtout occidentale.</p>\n<h3>J. Un multilatéralisme limité par la guerre froide</h3>\n<p>La remondialisation de l’après-guerre reste géopolitiquement limitée par la guerre froide ; l’effondrement du bloc soviétique permettra ensuite une véritable mondialisation à l’échelle planétaire. La fin du bloc communiste est donc l’une des grandes conditions du passage à l’hypermondialisation.</p>\n<p>Les États-Unis utilisent aussi leur puissance pour soutenir la reconstruction des économies alliées.</p>\n<h3>K. Le soft power économique américain</h3>\n<p>Le soutien américain à la reconstruction (avec le plan Marshall) permet à la fois de consolider le bloc occidental et de créer de nouveaux débouchés pour les entreprises américaines.</p>\n<p>Cette libéralisation existe également au niveau régional.</p>\n<h3>L. La construction européenne renforce les échanges intra-zone</h3>\n<p>La construction européenne :</p>\n<ul><li>réduit les barrières internes ;</li><li>crée progressivement un marché commun ;</li><li>favorise les échanges intra-européens.</li></ul>\n<h4>Conséquence</h4>\n<p>👉 la régionalisation progresse en parallèle du multilatéralisme.</p>\n<h4>Idée</h4>\n<p>La construction européenne montre que la libéralisation commerciale d’après-guerre se développe à la fois au niveau mondial et régional.</p>\n<p>Sur le plan géographique, les pays industrialisés dominent encore largement cette phase.</p>\n<h3>M. La domination des pays industrialisés</h3>\n<p>Pendant la remondialisation :</p>\n<p>👉 les pays industrialisés représentent environ les deux tiers du commerce mondial.</p>\n<p>Mais un pays monte extrêmement rapidement :</p>\n<p>👉 le Japon.</p>\n<h3>N. Le rattrapage spectaculaire du Japon</h3>\n<p>Le Japon réalise après 1945 un rattrapage exceptionnel, fondé sur une stratégie industrielle volontariste et une montée en gamme rapide.</p>\n<p>Cette montée en puissance inquiète alors les États-Unis, comme la Chine les inquiétera plus tard.</p>\n<h3>O. Le Japon des années 1980 : la “Chine” de l’époque</h3>\n<p>Les États-Unis reprochent au Japon :</p>\n<ul><li>une industrie fortement soutenue par l’État ;</li><li>un marché protégé ;</li><li>un yen jugé sous-évalué ;</li><li>une concurrence considérée comme déloyale.</li></ul>\n<h4>Réaction</h4>\n<p>👉 accords du Plaza.</p>\n<p>Objectif :</p>\n<ul><li>faire baisser le dollar ;</li><li>faire apprécier le yen ;</li><li>restaurer la compétitivité américaine.</li></ul>\n<h4>Idée</h4>\n<p>Dans les années 1980, le Japon joue un rôle comparable à celui de la Chine aujourd’hui : sa montée en puissance industrielle nourrit des accusations de concurrence déloyale et des tensions commerciales.</p>\n<p>Les pays européens utilisent aussi des mesures protectionnistes ciblées.</p>\n<h3>P. Le tariff jumping</h3>\n<p>Exemple :</p>\n<p>👉 restrictions françaises sur les véhicules japonais.</p>\n<h4>Que font les firmes japonaises ?</h4>\n<p>Elles s’implantent directement en Europe.</p>\n<p>Exemple :</p>\n<p>👉 Toyota à Valenciennes.</p>\n<p>C’est du :</p>\n<p>👉 tariff jumping.</p>\n<p>Le tariff jumping consiste à contourner un droit de douane en produisant directement sur le marché protégé.</p>\n<h4>Exemple contemporain</h4>\n<p>BYD :</p>\n<p>👉 projet d’implantation en Hongrie pour contourner les droits de douane européens.</p>\n<p>Cl</p>\n<p>Le tariff jumping montre que le protectionnisme peut modifier la localisation des firmes plutôt que simplement réduire les échanges.</p>\n<p>À partir de la fin des années 1980, la mondialisation change d’échelle.</p>\n<h3>Q. L’hypermondialisation : une nouvelle phase</h3>\n<p>L’hypermondialisation commence avec la fin de la guerre froide, l’accélération de la libéralisation commerciale et financière et l’intégration de nouveaux pays à l’économie mondiale.</p>\n<p>Elle se distingue de la remondialisation par plusieurs traits nouveaux.</p>\n<h3>R. Premier trait : le deuxième dégroupage de Baldwin</h3>\n<p>Le deuxième dégroupage de Baldwin correspond à la fragmentation internationale de la production, qui transforme le commerce de biens finis en commerce de tâches et de biens intermédiaires.</p>\n<p>La deuxième nouveauté est la montée du numérique et des services.</p>\n<h3>S. Deuxième trait : la dématérialisation de la mondialisation</h3>\n<p>Les nouvelles technologies permettent d’internationaliser :</p>\n<ul><li>services bancaires ;</li><li>centres d’appels ;</li><li>services juridiques ;</li><li>informatique ;</li><li>services numériques.</li></ul>\n<h4>Idée centrale</h4>\n<p>On peut désormais échanger :</p>\n<p>👉 des services sans déplacer physiquement un bien.</p>\n<h4>Conséquence</h4>\n<p>La mondialisation devient :</p>\n<p>👉 plus difficile à mesurer.</p>\n<h4>Idée</h4>\n<p>Les technologies numériques dématérialisent une partie de la mondialisation en rendant internationalement échangeables des services autrefois non délocalisables.</p>\n<div class=\"db\"><div class=\"dt\">Troisième nouveauté</div><div class=\"dd\">davantage de pays participent réellement aux échanges.</div></div>\n<h3>T. Troisième trait : la démocratisation de la mondialisation</h3>\n<p>Pendant la première mondialisation :</p>\n<p>👉 participation concentrée sur quelques grandes puissances.</p>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 beaucoup plus de PED s’intègrent.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’il n’est plus nécessaire de maîtriser toute une industrie.</p>\n<p>Un pays peut :</p>\n<p>👉 prendre en charge une seule étape de la chaîne de valeur.</p>\n<h4>Exemple</h4>\n<ul><li>assemblage ;</li><li>textile ;</li><li>composants ;</li><li>centre d’appels.</li></ul>\n<p>Cl</p>\n<p>La fragmentation productive facilite l’intégration des pays en développement car elle leur permet de se spécialiser dans une seule tâche sans devoir maîtriser l’ensemble du processus industriel.</p>\n<p>Cette démocratisation modifie également le sens des flux.</p>\n<h3>U. Quatrième trait : les flux deviennent multidirectionnels</h3>\n<div class=\"db\"><div class=\"dt\">L’hypermondialisation transforme la géographie des flux</div><div class=\"dd\">les échanges ne sont plus seulement dominés par le Nord mais deviennent de plus en plus multidirectionnels.</div></div>\n<p>Le symbole principal de ce changement est la Chine.</p>\n<h3>V. La Chine devient l’acteur majeur de l’hypermondialisation</h3>\n<p>La Chine adopte une stratégie :</p>\n<p>👉 extravertie.</p>\n<p>Cela signifie que son développement repose largement sur :</p>\n<p>👉 les exportations.</p>\n<p>La Chine utilise d’abord les chaînes de valeur mondiales comme pays atelier avant de monter progressivement en gamme et d’augmenter la part de valeur ajoutée domestique dans ses exportations.</p>\n<p>Son adhésion à l’OMC accélère cette insertion.</p>\n<h3>W. 2001 : l’adhésion de la Chine à l’OMC</h3>\n<p>L’adhésion de la Chine à l’OMC en 2001 constitue un accélérateur majeur de son insertion dans les chaînes de valeur mondiales.</p>\n<p>Cette montée de l’Asie modifie profondément la géographie du commerce mondial.</p>\n<h3>X. Le centre de gravité du commerce mondial se déplace</h3>\n<h3>Y. Première mondialisation / remondialisation</h3>\n<p>Centre de gravité :</p>\n<p>👉 Atlantique.</p>\n<p>Principal axe :</p>\n<p>👉 Europe ↔ États-Unis.</p>\n<h4>Hypermondialisation</h4>\n<p>Centre de gravité :</p>\n<p>👉 Pacifique.</p>\n<p>Principaux acteurs systémiques :</p>\n<ul><li>Chine ;</li><li>États-Unis.</li></ul>\n<p>Cl</p>\n<p>L’hypermondialisation déplace le centre de gravité du commerce mondial de l’Atlantique vers le Pacifique.</p>\n<p>La Chine devient alors la première puissance exportatrice.</p>\n<h3>Z. La Chine, première puissance commerciale</h3>\n<p>La Chine représente aujourd’hui environ :</p>\n<p>👉 15 % des exportations mondiales de marchandises.</p>\n<p>Elle est :</p>\n<p>👉 premier exportateur mondial.</p>\n<p>Et :</p>\n<p>👉 deuxième importateur mondial, derrière les États-Unis.</p>\n<h4>Pourquoi c’est important ?</h4>\n<p>Parce qu’un grand importateur possède :</p>\n<p>👉 un pouvoir de marché.</p>\n<p>Si sa demande baisse :</p>\n<p>→ prix mondiaux peuvent baisser.</p>\n<h4>Idée</h4>\n<p>La Chine est devenue un acteur systémique du commerce mondial à la fois par son poids dans les exportations et par son pouvoir de marché comme grand importateur.</p>\n<p>Mais cette montée en puissance s’accompagne d’un changement de modèle chinois.</p>\n<h3>AA. De la croissance extensive à la croissance intensive</h3>\n<p>Avant :</p>\n<p>👉 croissance extensive.</p>\n<p>C’est-à-dire :</p>\n<ul><li>beaucoup d’investissement ;</li><li>beaucoup de travail ;</li><li>beaucoup de capacités de production.</li></ul>\n<p>Puis :</p>\n<p>👉 croissance intensive.</p>\n<p>C’est-à-dire :</p>\n<ul><li>innovation ;</li><li>productivité ;</li><li>technologie ;</li><li>montée en gamme.</li></ul>\n<h4>Exemples</h4>\n<ul><li>Made in China ;</li><li>véhicules électriques ;</li><li>aéronautique ;</li><li>technologies avancées.</li></ul>\n<h4>Idée</h4>\n<p>La Chine cherche progressivement à passer d’une croissance extensive fondée sur l’accumulation des facteurs à une croissance intensive fondée sur l’innovation et la montée en gamme.</p>\n<p>Cela crée de nouvelles tensions avec les pays avancés.</p>\n<h3>AB. La montée en gamme chinoise change la nature de la concurrence</h3>\n<p>Tant que la Chine produisait :</p>\n<p>👉 textiles, jouets, biens simples,</p>\n<p>les pays avancés étaient relativement peu menacés sur leurs secteurs à forte valeur ajoutée.</p>\n<p>Mais lorsqu’elle entre sur :</p>\n<ul><li>véhicules électriques ;</li><li>aéronautique ;</li><li>numérique ;</li><li>haute technologie ;</li></ul>\n<p>elle concurrence directement :</p>\n<p>👉 les avantages comparatifs des pays avancés.</p>\n<p>Cl</p>\n<p>La montée en gamme chinoise transforme une relation de complémentarité en une relation de concurrence directe avec les économies avancées.</p>\n<p>Un autre trait de l’hypermondialisation est la poursuite de la baisse des barrières commerciales.</p>\n<h3>AC. Cinquième trait : la poursuite de la baisse des droits de douane</h3>\n<p>Fin des années 1960 :</p>\n<p>👉 droits moyens ≈ 10 %.</p>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 ils tombent autour de 4 %.</p>\n<h4>Conséquence</h4>\n<p>barrières ↓ → échanges ↑.</p>\n<h4>Idée</h4>\n<p>L’hypermondialisation prolonge la libéralisation commerciale en réduisant les droits de douane moyens à des niveaux historiquement très faibles.</p>\n<p>Cette baisse est organisée dans un cadre multilatéral élargi.</p>\n<h3>AD. Le GATT devient l’OMC en 1995</h3>\n<p>Aujourd’hui :</p>\n<p>👉 environ 166 membres.</p>\n<h4>Conséquence</h4>\n<p>Pratiquement tous les échanges mondiaux sont couverts par :</p>\n<p>👉 des règles communes.</p>\n<h4>Idée</h4>\n<p>La création de l’OMC en 1995 généralise le cadre multilatéral du commerce international et étend les règles commerciales à presque toute l’économie mondiale.</p>\n<p>Mais l’OMC connaît aujourd’hui une crise profonde.</p>\n<h3>AE. La crise du multilatéralisme</h3>\n<p>Le cycle de Doha commence en :</p>\n<p>👉 2001.</p>\n<p>Il échoue progressivement et est considéré comme largement bloqué.</p>\n<h4>Problème</h4>\n<p>Les États :</p>\n<ul><li>ne parviennent plus à se mettre d’accord ;</li><li>utilisent davantage des mesures unilatérales ;</li><li>contournent les règles.</li></ul>\n<h4>Question</h4>\n<p>👉 à quoi sert une règle si les grandes puissances ne la respectent plus ?</p>\n<h4>Idée</h4>\n<p>La crise du cycle de Doha illustre l’essoufflement du multilatéralisme commercial et explique en partie le retour des accords régionaux et du minilatéralisme.</p>\n<p>Face à cette crise du cadre mondial, les accords régionaux prennent de plus en plus d’importance.</p>\n<h3>AF. La régionalisation des échanges</h3>\n<p>La régionalisation désigne l’augmentation des échanges entre pays appartenant à une même zone.</p>\n<p>On parle de :</p>\n<ul><li>Exemple Europe</li><li>Environ :</li></ul>\n<p>👉 60 % des échanges de l’UE sont intra-européens.</p>\n<p>Si on raisonne plus largement par continent :</p>\n<p>👉 environ deux tiers des échanges européens ont lieu avec d’autres pays européens.</p>\n<p>Cl</p>\n<p>La régionalisation correspond à une concentration croissante des échanges à l’intérieur de grands ensembles économiques régionaux.</p>\n<p>La régionalisation peut s’expliquer par deux types de facteurs.</p>\n<h3>AG. Pourquoi échange-t-on davantage avec ses voisins ?</h3>\n<h3>AH. Première raison : la proximité</h3>\n<ul><li>coûts de transport faibles ;</li><li>proximité culturelle ;</li><li>normes similaires ;</li><li>langues ;</li><li>habitudes commerciales.</li></ul>\n<h4>Donc</h4>\n<p>distance ↓ → échanges ↑.</p>\n<h3>AI. Deuxième raison : le volontarisme politique</h3>\n<p>Les États créent :</p>\n<p>👉 des accords commerciaux régionaux, ACR.</p>\n<p>Exemples :</p>\n<ul><li>Union européenne ;</li><li>Mercosur ;</li><li>accords UE-Inde.</li></ul>\n<h4>Idée</h4>\n<p>La régionalisation résulte à la fois de la proximité géographique et de choix politiques visant à organiser des espaces commerciaux intégrés.</p>\n<p>L’Asie donne un exemple particulier de régionalisation productive.</p>\n<h3>AJ. Akamatsu et le vol d’oies sauvages</h3>\n<p>Le modèle du vol d’oies sauvages montre comment la montée en gamme d’une économie peut diffuser le développement industriel à l’ensemble d’une région.</p>\n<p>La régionalisation devient aussi une réponse politique à l’échec du multilatéralisme.</p>\n<h3>AK. Du multilatéralisme au minilatéralisme</h3>\n<p>Quand il devient difficile de négocier à 160 pays :</p>\n<p>👉 on négocie à quelques-uns.</p>\n<p>C’est :</p>\n<p>👉 le minilatéralisme.</p>\n<h4>Idée</h4>\n<p>petit groupe de pays → règles communes → coopération plus facile.</p>\n<h4>Idée</h4>\n<p>Le minilatéralisme constitue une réponse à la crise du multilatéralisme en privilégiant des accords commerciaux entre groupes restreints de pays.</p>\n<p>L’hypermondialisation modifie aussi la nature des biens et services échangés.</p>\n<h3>AL. La nature des échanges : domination des biens manufacturés</h3>\n<p>Pendant la première mondialisation :</p>\n<p>👉 produits primaires dominants.</p>\n<p>Après 1945 :</p>\n<p>👉 biens manufacturés dominants.</p>\n<p>Ils représentent aujourd’hui environ :</p>\n<div class=\"alertb\"><p>👉 les trois quarts du commerce mondial de marchandises, selon l’ordre de grandeur du cours.</p></div>\n<h4>Idée</h4>\n<p>La seconde mondialisation se distingue de la première par la domination durable des produits manufacturés dans le commerce international.</p>\n<p>Mais les services progressent rapidement.</p>\n<h3>AM. Les services prennent une place croissante</h3>\n<p>Aujourd’hui :</p>\n<div class=\"alertb\"><p>👉 les services représentent environ un quart des échanges internationaux selon l’ordre de grandeur du cours.</p></div>\n<p>Depuis environ 2005 :</p>\n<p>👉 le commerce des services progresse plus vite que celui des marchandises.</p>\n<h4>Pourquoi ?</h4>\n<ul><li>numérique ;</li><li>finance ;</li><li>transport ;</li><li>services professionnels ;</li><li>télécommunications.</li></ul>\n<h4>Idée</h4>\n<p>La progression plus rapide du commerce des services traduit la dématérialisation croissante de la mondialisation.</p>\n<p>Une autre évolution majeure est la montée du commerce intrabranche.</p>\n<h3>AN. Le commerce intrabranche</h3>\n<p>Le commerce intrabranche correspond à l’échange international de biens appartenant à une même branche de production.</p>\n<p>Les deux types de commerce ne reposent pas sur la même logique.</p>\n<div class=\"db\"><div class=\"dt\">Interbranche</div><div class=\"dd\">échange de différences</div></div>\n<p>Commerce interbranche :</p>\n<p>👉 chaque pays produit ce que l’autre ne produit pas.</p>\n<p>Il repose davantage sur :</p>\n<ul><li>différences de dotations ;</li><li>avantages comparatifs ;</li><li>spécialisations distinctes.</li></ul>\n<h4>Exemple</h4>\n<p>pétrole contre automobiles.</p>\n<h4>Idée</h4>\n<p>Le commerce interbranche repose principalement sur la complémentarité entre économies disposant de spécialisations différentes.</p>\n<p>Le commerce intrabranche repose au contraire sur la différenciation.</p>\n<div class=\"db\"><div class=\"dt\">Intrabranche</div><div class=\"dd\">échange de similarité</div></div>\n<p>Exemple :</p>\n<ul><li>France exporte Renaultet importe BMW.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce que les consommateurs recherchent :</p>\n<p>👉 de la diversité.</p>\n<p>Les produits rendent un service proche mais :</p>\n<ul><li>marque différente ;</li><li>qualité différente ;</li><li>design différent ;</li><li>gamme différente.</li></ul>\n<h4>Idée</h4>\n<p>Le commerce intrabranche permet de satisfaire une demande de diversité en échangeant des produits similaires mais différenciés.</p>\n<p>Il peut pourtant être perçu très différemment selon l’origine des biens.</p>\n<h3>AO. Intrabranche entre pays avancés vs concurrence avec pays à bas coûts</h3>\n<h4>France-Allemagne</h4>\n<p>Voitures contre voitures :</p>\n<p>👉 souvent perçu positivement.</p>\n<h4>Pourquoi ?</h4>\n<p>👉 diversité.</p>\n<h4>Europe-Chine</h4>\n<p>Véhicules électriques chinois :</p>\n<p>👉 concurrence perçue comme plus menaçante.</p>\n<h4>Pourquoi ?</h4>\n<ul><li>différence de coûts ;</li><li>subventions ;</li><li>impact sur l’emploi industriel.</li></ul>\n<h4>Idée centrale</h4>\n<p>Économiquement :</p>\n<p>👉 les deux sont du commerce intrabranche.</p>\n<p>Mais politiquement :</p>\n<p>👉 perception différente.</p>\n<h4>Idée</h4>\n<p>Le même commerce intrabranche peut être perçu comme bénéfique entre économies comparables et comme une menace lorsqu’il oppose des producteurs domestiques à des concurrents à bas coûts.</p>\n<p>La fragmentation productive a cependant relancé une forme particulière de commerce de différences.</p>\n<h3>AP. Les chaînes de valeur relancent le commerce interbranche</h3>\n<p>Avec la DIPP :</p>\n<p>👉 chaque pays réalise une tâche différente.</p>\n<p>Donc même au sein d’un même produit :</p>\n<ul><li>conception ici ;</li><li>composant là ;</li><li>assemblage ailleurs.</li></ul>\n<p>On échange alors :</p>\n<p>👉 des différences de tâches.</p>\n<h4>Idée</h4>\n<p>La fragmentation des chaînes de valeur réintroduit une logique interbranche au sein même de la production d’un bien, chaque pays se spécialisant dans une étape différente.</p>\n<h3>AQ. Depuis 2008 : un plafond de l’ouverture ?</h3>\n<p>Avant 2008 :</p>\n<p>👉 commerce mondial croît beaucoup plus vite que PIB.</p>\n<p>Depuis 2008 :</p>\n<p>👉 élasticité du commerce au PIB se rapproche de 1.</p>\n<h4>Cela signifie</h4>\n<p>Si PIB ↑ de 1 % :</p>\n<p>👉 commerce ↑ autour de 1 %.</p>\n<p>Donc :</p>\n<ul><li>X et PIB progressent au même rythme.</li></ul>\n<h4>Conséquence</h4>\n<p>taux d’ouverture :</p>\n<p>👉 stagne.</p>\n<p>Autour de :</p>\n<p>👉 29-30 %.</p>\n<h4>Idée</h4>\n<p>Depuis la crise de 2008, le commerce mondial progresse à un rythme beaucoup plus proche de celui du PIB, ce qui explique la stagnation du taux d’ouverture mondial.</p>\n<p>Mais les échanges restent très sensibles aux crises.</p>\n<h3>AR. Le commerce mondial sur-réagit aux cycles économiques</h3>\n<p>En 2008-2009 :</p>\n<p>👉 PIB mondial baisse peu relativement,</p>\n<p>mais :</p>\n<p>👉 commerce mondial chute d’environ 12 %.</p>\n<p>Puis :</p>\n<p>👉 fort rebond l’année suivante.</p>\n<h4>C’est une forte élasticité</h4>\n<p>Avant 2008 :</p>\n<p>👉 élasticité commerce/PIB &gt; 1.</p>\n<h4>Idée</h4>\n<p>Le commerce mondial est plus volatil que la production car les échanges internationaux sur-réagissent traditionnellement aux variations de l’activité économique.</p>\n<p>Cette stagnation récente alimente la question d’une sortie de l’hypermondialisation.</p>\n<h3>AS. Les fragilités de l’hypermondialisation</h3>\n<p>Dès le début des années 2010, plusieurs économistes identifient des risques.</p>\n<h3>AT. 1-Risque de guerre commerciale</h3>\n<p>Montée de la Chine → tensions → protectionnisme.</p>\n<p>Cela se concrétise fortement à partir de :</p>\n<p>👉 2017.</p>\n<h3>AU. 2-Enjeu environnemental</h3>\n<p>Plus d’échanges :</p>\n<p>→ transport ↑ → émissions ↑.</p>\n<p>D’où l’idée :</p>\n<p>👉 faut-il relocaliser pour réduire l’empreinte carbone ?</p>\n<h3>AV. 3-Dépendance aux ressources essentielles</h3>\n<p>Exemples :</p>\n<ul><li>céréales ;</li><li>énergie ;</li><li>métaux critiques.</li></ul>\n<p>Une rupture :</p>\n<p>→ prix ↑ → pénuries → inflation.</p>\n<h4>Idée</h4>\n<p>L’hypermondialisation révèle ses fragilités lorsqu’elle crée des dépendances commerciales, environnementales et stratégiques difficilement soutenables en période de crise.</p>\n<h3>AW. Conclusion</h3>\n<p>La mondialisation depuis 1945 se caractérise d’abord par une lente reconstruction des échanges, puis par une phase d’accélération sans précédent à partir des années 1980-1990.</p>\n<p>L’hypermondialisation transforme profondément l’économie mondiale :</p>\n<ul><li>production fragmentée ;</li><li>chaînes de valeur mondiales ;</li><li>montée des services ;</li><li>intégration des pays émergents ;</li><li>déplacement du centre de gravité vers l’Asie ;</li><li>montée en puissance de la Chine ;</li><li>régionalisation des échanges.</li></ul>\n<p>Mais depuis 2008, le modèle semble atteindre un plafond :</p>\n<ul><li>taux d’ouverture stagnant ;</li><li>chaînes de valeur plus courtes ;</li><li>protectionnisme ;</li><li>tensions géopolitiques ;</li><li>crise du multilatéralisme.</li></ul>\n<p>Cl</p>\n<p>L’hypermondialisation a transformé la mondialisation d’un simple accroissement des échanges en une organisation mondiale de la production ; depuis 2008, la stagnation du taux d’ouverture et le retour des tensions commerciales suggèrent toutefois que cette phase pourrait avoir atteint ses limites.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XVIII. Mondialisation contemporaine : moins migratoire, beaucoup plus financière</h2>\n<p>En quoi la mondialisation contemporaine se distingue-t-elle de la première mondialisation par la mobilité des hommes et surtout des capitaux ?</p>\n<h3>A. Idée générale</h3>\n<p>La mondialisation contemporaine est :</p>\n<p>👉 moins migratoire que la première mondialisation,</p>\n<p>mais :</p>\n<p>👉 beaucoup plus financière.</p>\n<p>Deux faits majeurs apparaissent :</p>\n<ul><li>les migrations internationales restent importantes, mais leur poids dans la population mondiale est inférieur à celui de la fin du XI Xe siècle ;</li><li>les flux de capitaux explosent, surtout avec la libéralisation financière des années 1980-1990.</li></ul>\n<h4>Idée centrale</h4>\n<p>La mobilité contemporaine concerne donc davantage :</p>\n<p>👉 le capital que le travail.</p>\n<p>Cl</p>\n<p>La mondialisation contemporaine se distingue de la première mondialisation par une mobilité internationale du travail relativement plus faible, mais par une circulation des capitaux d’une ampleur sans précédent.</p>\n<p>Les migrations contemporaines restent importantes mais inférieures à celles de la première mondialisation</p>\n<p>Malgré l’augmentation du nombre absolu de migrants, la part des migrants internationaux dans la population mondiale reste nettement inférieure à celle observée lors de la première mondialisation.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">en 2020, les migrants internationaux représentent environ 3,6 % de la population mondiale, soit une proportion inférieure à celle de la première mondialisation.</div></div>\n<p>Mais surtout, la géographie réelle des migrations est très différente de l’image qu’on en donne souvent.</p>\n<h3>B. Première idée reçue : les migrations ne sont pas principalement Sud-Nord</h3>\n<p>On imagine souvent :</p>\n<p>👉 Sud → Nord.</p>\n<p>Mais les flux sont plus diversifiés.</p>\n<p>Le cours donne environ :</p>\n<ul><li>Sud-Sud : 38 % ;</li><li>Sud-Nord : 35 % ;</li><li>Nord-Nord : 22 % ;</li><li>Nord-Sud : part plus faible.</li></ul>\n<h4>Idée importante</h4>\n<div class=\"alertb\"><p>👉 les migrations Sud-Sud sont au moins aussi importantes, voire légèrement supérieures, aux migrations Sud-Nord.</p></div>\n<h4>Pourquoi ?</h4>\n<p>Deux grandes raisons :</p>\n<ul><li>certains pays du Sud connaissent une forte croissance et attirent de la main-d’œuvre ;</li><li>les réfugiés vont souvent d’abord dans les pays voisins.</li></ul>\n<h4>Exemples</h4>\n<ul><li>Qatar ;</li><li>pays du Golfe ;</li><li>pays voisins de zones de conflit.</li></ul>\n<p>Cl</p>\n<p>La géographie des migrations contemporaines est largement multipolaire : les migrations Sud-Sud sont aussi importantes que les migrations Sud-Nord.</p>\n<p>Une deuxième idée reçue concerne l’origine sociale des migrants.</p>\n<h3>C. Deuxième idée reçue : « la misère ne migre pas »</h3>\n<h4>Idée</h4>\n<p>Les migrations internationales ne proviennent pas principalement des populations les plus pauvres, car migrer suppose précisément de disposer de ressources financières, éducatives et relationnelles minimales. Donc</p>\n<p>Les migrants volontaires viennent souvent :</p>\n<p>👉 des pays à revenu intermédiaire.</p>\n<p>Notamment :</p>\n<p>👉 des pays à revenu intermédiaire bas.</p>\n<p>Le profil des migrants arrivant dans les pays développés confirme cette idée.</p>\n<h3>D. Le profil économique des migrants en France</h3>\n<h4>Idée importante</h4>\n<p>Immigration :</p>\n<ul><li>≠ seulement main-d’œuvre peu qualifiée.</li></ul>\n<p>Elle comprend aussi :</p>\n<ul><li>étudiants ;</li><li>ingénieurs ;</li><li>personnels qualifiés ;</li><li>professions intermédiaires.</li></ul>\n<p>👉 environ la moitié dispose d’un diplôme de l’enseignement supérieur.</p>\n<p>Cl</p>\n<p>L’immigration contemporaine concerne largement des individus jeunes et en âge de travailler, dont une part importante dispose d’un niveau élevé de qualification.</p>\n<p>La France apparaît même relativement peu ouverte par rapport à plusieurs autres pays avancés.</p>\n<h3>E. La France est relativement moins ouverte à l’immigration que certains pays comparables</h3>\n<p>La France reste un grand pays d’immigration mais son dynamisme migratoire est plus faible que celui observé dans plusieurs autres économies avancées.</p>\n<p>D’un point de vue économique, les effets de l’immigration sont généralement beaucoup plus nuancés que les représentations politiques.</p>\n<h3>F. Immigration et finances publiques : un effet globalement proche de la neutralité</h3>\n<p>Les migrants sont souvent :</p>\n<ul><li>jeunes ;</li><li>actifs ;</li><li>consommateurs ;</li><li>contribuables.</li></ul>\n<p>Donc ils :</p>\n<p>👉 utilisent certains services publics,</p>\n<p>mais :</p>\n<p>👉 paient aussi impôts et cotisations.</p>\n<h4>Résultat</h4>\n<p>👉 un effet globalement neutre sur les finances publiques.</p>\n<h4>Idée</h4>\n<p>L’effet budgétaire de l’immigration est généralement limité car les dépenses publiques supplémentaires sont largement compensées par les impôts, les cotisations et la consommation des migrants.</p>\n<p>Sur le marché du travail, l’idée d’une substitution systématique entre immigrés et natifs est également contestée.</p>\n<h3>G. Immigration et emploi : davantage de complémentarité que de substitution</h3>\n<p>L’immigration ne se traduit pas nécessairement par une substitution aux travailleurs natifs car migrants et natifs occupent souvent des segments différents du marché du travail.</p>\n<p>👉 ils répondent parfois à des pénuries de main-d’œuvre.</p>\n<h3>H. Le marché secondaire du travail</h3>\n<p>marché secondaire du travail.</p>\n<p>Il rassemble notamment :</p>\n<ul><li>emplois précaires ;</li><li>faibles salaires ;</li><li>conditions difficiles ;</li><li>faible progression professionnelle.</li></ul>\n<p>Les immigrés de première génération y sont souvent surreprésentés.</p>\n<h4>Conséquence</h4>\n<p>La concurrence peut davantage avoir lieu :</p>\n<p>👉 entre différentes vagues migratoires</p>\n<p>qu’entre :</p>\n<p>👉 immigrés et natifs.</p>\n<p>La pression concurrentielle de l’immigration peut se concentrer sur le marché secondaire du travail et toucher davantage les migrants déjà installés que l’ensemble des travailleurs natifs.</p>\n<p>La complémentarité peut également produire des effets indirects sur l’emploi des natifs.</p>\n<h3>I. Immigration et activité féminine</h3>\n<p>Exemple :</p>\n<ul><li>garde d’enfants ;</li><li>aide à domicile ;</li><li>personnel de ménage.</li></ul>\n<p>Les travailleurs immigrés y sont souvent nombreux.</p>\n<p>Cela peut :</p>\n<p>👉 libérer du temps de travail pour d’autres actifs. Notamment les femmes.</p>\n<h4>Mécanisme</h4>\n<p>services domestiques disponibles → contraintes familiales ↓ → participation au marché du travail ↑.</p>\n<h4>Idée</h4>\n<p>L’immigration peut accroître indirectement l’offre de travail des natifs lorsqu’elle développe des services complémentaires, notamment dans la garde d’enfants et l’aide domestique.</p>\n<p>Les effets de l’immigration sont également positifs sur la croissance.</p>\n<h3>J. Immigration et croissance extensive</h3>\n<p>immigration → population active ↑ → quantité de travail ↑ → production potentielle ↑.</p>\n<p>Cl</p>\n<p>L’immigration soutient mécaniquement la croissance extensive en augmentant la quantité de travail disponible dans l’économie.</p>\n<p>Mais l’effet peut aussi concerner la croissance intensive.</p>\n<h3>K. Immigration et croissance intensive</h3>\n<p>La croissance intensive repose sur :</p>\n<ul><li>innovation ;</li><li>productivité ;</li><li>entrepreneuriat.</li></ul>\n<p>Lorsqu’on cite cite l’exemple américain.</p>\n<h4>Silicon Valley</h4>\n<p>Environ :</p>\n<div class=\"alertb\"><p>👉 44 % des entreprises auraient au moins un fondateur immigré selon l’étude citée dans le cours.</p></div>\n<h4>Brevets</h4>\n<p>Les immigrés sont également :</p>\n<p>👉 surreprésentés parmi les déposants de brevets.</p>\n<p>Exemple évoqué :</p>\n<ul><li>autour de 10 % de la population ;</li><li>mais environ 25 % des déposants de brevets sur une période étudiée.</li></ul>\n<h4>Explication possible</h4>\n<p>Les migrants peuvent avoir :</p>\n<ul><li>forte sélection ;</li><li>qualification ;</li><li>mobilité ;</li><li>prise de risque élevée.</li></ul>\n<p>Cl</p>\n<p>L’immigration peut aussi soutenir la croissance intensive par l’innovation, l’entrepreneuriat et la surreprésentation de certains migrants dans les activités technologiques.</p>\n<p>L’immigration produit également des effets importants dans les pays d’origine.</p>\n<h3>L. Les transferts des migrants : une ressource majeure pour les pays d’origine</h3>\n<p>Les migrants envoient de l’argent à leur famille.</p>\n<p>Les transferts des migrants constituent une source majeure de devises et de revenu pour de nombreux pays en développement.</p>\n<div class=\"db\"><div class=\"dt\">Maroc</div><div class=\"dd\">environ 10 % du PIB selon l’ordre de grandeur évoqué.</div></div>\n<p>Mais cette émigration peut aussi retirer au pays d’origine une partie de son capital humain.</p>\n<h3>M. La fuite des cerveaux</h3>\n<p>L’émigration qualifiée peut affaiblir les capacités de développement des pays d’origine lorsqu’elle entraîne une fuite durable du capital humain.</p>\n<p>Cette difficulté peut contribuer à empêcher certains pays de franchir un nouveau stade de développement.</p>\n<h3>N. La trappe à revenu intermédiaire</h3>\n<p>On rapproche ce phénomène de la :</p>\n<p>👉 trappe à revenu intermédiaire.</p>\n<p>Un pays :</p>\n<ul><li>n’est plus pauvre ;</li><li>mais n’arrive pas à rejoindre les pays développés.</li></ul>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’il peut manquer :</p>\n<ul><li>d’innovation ;</li><li>de capital humain ;</li><li>de productivité ;</li><li>de technologies.</li></ul>\n<p>La fuite des travailleurs qualifiés peut donc :</p>\n<p>👉 renforcer cette trappe.</p>\n<h4>Idée</h4>\n<p>La fuite des cerveaux peut contribuer à la trappe à revenu intermédiaire en privant les économies émergentes des compétences nécessaires à leur montée en gamme.</p>\n<p>Si la mobilité des personnes reste relativement limitée, la mobilité du capital connaît au contraire une explosion spectaculaire.</p>\n<h3>O. La mondialisation productive : la montée des IDE</h3>\n<h3>P. Dans les années 1950-1960 : premiers grands IDE américains vers l’Europe</h3>\n<p>Les entreprises américaines s’implantent en Europe.</p>\n<h4>Pourquoi ?</h4>\n<h4>Première raison</h4>\n<p>👉 croissance rapide du marché européen.</p>\n<h4>Deuxième raison</h4>\n<p>👉 construction européenne et tarif extérieur commun.</p>\n<p>Avec le traité de Rome en 1957 :</p>\n<p>👉 mise en place progressive d’une union douanière.</p>\n<h4>Réaction des FMN américaines</h4>\n<p>Elles pratiquent :</p>\n<p>👉 le tariff jumping.</p>\n<p>Elles produisent directement en Europe.</p>\n<h4>Exemples</h4>\n<ul><li>Ford ;</li><li>General Motors.</li></ul>\n<h4>Idée</h4>\n<p>Dans les années 1950-1960, les IDE américains vers l’Europe répondent principalement à une logique de marché et permettent de contourner les barrières commerciales européennes.</p>\n<p>On parle ici d’IDE horizontaux.</p>\n<h3>Q. Les IDE horizontaux</h3>\n<p>Un IDE horizontal consiste à reproduire à l’étranger une activité productive afin de satisfaire directement le marché local.</p>\n<p>À partir des années 1970-1990, la logique change.</p>\n<h3>R. La montée des IDE verticaux</h3>\n<p>Avec :</p>\n<ul><li>Asie émergente ;</li><li>Maghreb ;</li></ul>\n<p>les FMN commencent à décomposer :</p>\n<p>👉 leur chaîne de production.</p>\n<p>Elles implantent seulement :</p>\n<p>👉 certaines étapes.</p>\n<h4>Objectif</h4>\n<p>👉 réduire les coûts.</p>\n<h4>Exemple</h4>\n<ul><li>assemblage ;</li><li>textile ;</li><li>électronique ;</li><li>composants.</li></ul>\n<p>Cl</p>\n<p>Les IDE verticaux correspondent à une fragmentation internationale de la production destinée à exploiter les différences de coûts et de dotations factorielles entre pays.</p>\n<p>C’est précisément ce type d’IDE qui nourrit les chaînes de valeur mondiales.</p>\n<h3>S. Les filiales-ateliers au cœur de l’hypermondialisation</h3>\n<p>Les FMN créent :</p>\n<p>👉 des filiales-ateliers.</p>\n<p>Elles réalisent :</p>\n<ul><li>une seule tâche ;</li><li>une étape spécifique ;</li><li>un segment de la chaîne de valeur.</li></ul>\n<h4>Conséquence</h4>\n<p>biens intermédiaires → passent plusieurs frontières → production finale.</p>\n<h4>Idée</h4>\n<p>Le développement des filiales-ateliers transforme les FMN en réseaux mondiaux de production au sein desquels circulent continuellement les biens intermédiaires.</p>\n<p>Cette montée des IDE modifie profondément leur géographie.</p>\n<h3>T. Les IDE deviennent beaucoup plus multipolaires</h3>\n<h3>U. Au départ : domination du Nord</h3>\n<p>Pendant longtemps :</p>\n<p>👉 pays développés ≈ 90 % des IDE sortants.</p>\n<p>Au début des années 1990 :</p>\n<p>👉 environ 3/4 des IDE entrants vont encore vers les pays développés.</p>\n<h3>V. Aujourd’hui : montée du Sud global</h3>\n<p>👉 pays avancés ≈ 2/3 à 3/4 des IDE sortants ;</p>\n<p>donc :</p>\n<p>👉 environ 1/4 à 1/3 provient du Sud global.</p>\n<p>Pour les IDE entrants :</p>\n<p>👉 pays avancés ≈ 35 %.</p>\n<p>Donc :</p>\n<p>👉 près des deux tiers vont désormais vers les pays émergents et en développement.</p>\n<p>Cl</p>\n<p>La géographie des IDE s’est profondément rééquilibrée : les pays émergents sont devenus à la fois des destinations majeures et des investisseurs internationaux importants.</p>\n<p>La Chine est emblématique de cette transformation.</p>\n<h3>W. La Chine devient exportatrice nette d’IDE</h3>\n<p>Au départ :</p>\n<p>👉 IDE entrants &gt; IDE sortants.</p>\n<p>La Chine reçoit les capitaux étrangers pour :</p>\n<ul><li>développer son industrie ;</li><li>acquérir des technologies ;</li><li>intégrer les CVM.</li></ul>\n<p>Puis progressivement :</p>\n<p>👉 IDE sortants ↑.</p>\n<p>Aujourd’hui, certaines années :</p>\n<p>👉 IDE sortants &gt; IDE entrants.</p>\n<h4>Pourquoi ?</h4>\n<p>Trois grandes raisons.</p>\n<h3>X. Pourquoi la Chine investit-elle massivement à l’étranger ?</h3>\n<h4>Acquérir des technologies</h4>\n<p>IDE → rachat / prise de participation → savoir-faire étranger → montée en gamme.</p>\n<h4>Écouler et internationaliser sa production</h4>\n<p>Surcapacités en Chine → investissements à l’étranger → nouveaux débouchés.</p>\n<p>Exemple :</p>\n<p>👉 infrastructures des Routes de la soie.</p>\n<h4>Sécuriser les approvisionnements</h4>\n<p>La Chine investit dans :</p>\n<ul><li>minerais ;</li><li>énergie ;</li><li>métaux critiques ;</li><li>infrastructures.</li></ul>\n<p>Notamment :</p>\n<p>👉 en Afrique.</p>\n<h4>Objectif</h4>\n<p>sécuriser les ressources nécessaires au numérique et à la transition énergétique.</p>\n<h4>Idée</h4>\n<p>Les IDE chinois servent simultanément à acquérir des technologies, ouvrir des débouchés et sécuriser les approvisionnements stratégiques.</p>\n<p>Il faut cependant distinguer les flux annuels des stocks accumulés.</p>\n<h3>Y. Flux d’IDE et stocks d’IDE</h3>\n<h4>Flux</h4>\n<p>👉 nouveaux investissements réalisés pendant une année.</p>\n<h4>Stock</h4>\n<p>👉 valeur cumulée de l’ensemble des investissements déjà détenus.</p>\n<p>Même si les PED réalisent davantage d’IDE qu’avant :</p>\n<p>👉 les pays avancés dominent encore largement les stocks.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce qu’ils investissent à l’étranger :</p>\n<p>👉 depuis beaucoup plus longtemps.</p>\n<h4>Idée</h4>\n<p>La montée des pays émergents est particulièrement visible dans les flux récents d’IDE, mais les économies avancées restent dominantes lorsqu’on raisonne en stocks accumulés.</p>\n<p>L’autre transformation fondamentale concerne les investissements de portefeuille.</p>\n<h3>Z. La globalisation financière s’accélère à partir des années 1970-1980</h3>\n<p>Les États libéralisent progressivement :</p>\n<p>👉 les mouvements internationaux de capitaux.</p>\n<h4>Exemple européen</h4>\n<p>La liberté de circulation des capitaux devient pleinement organisée au début des années 1990.</p>\n<h4>Idée</h4>\n<p>La globalisation financière correspond à la suppression progressive des obstacles à la circulation internationale des capitaux et constitue l’un des traits majeurs de l’hypermondialisation.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">l’ouverture financière mondiale augmente fortement des années 1990 à 2007, puis chute brutalement avec la crise de 2008. Après la crise, les IDE prennent une part relativement plus importante dans les flux internationaux de capitaux.</div></div>\n<p>Plusieurs facteurs expliquent cette libéralisation.</p>\n<h3>AA. Première raison : financer les déficits publics</h3>\n<p>À partir des années 1970 :</p>\n<ul><li>croissance plus faible ;</li><li>chômage ↑ ;</li><li>dépenses publiques ↑ ;</li><li>recettes fiscales ralentissent.</li></ul>\n<p>C’est un :</p>\n<p>👉 effet de ciseaux.</p>\n<h4>Exemple français</h4>\n<p>Depuis environ 1974-1975 :</p>\n<p>👉 les finances publiques françaises sont durablement déficitaires.</p>\n<h4>Solution</h4>\n<p>Les États émettent :</p>\n<p>👉 des obligations.</p>\n<p>Mais l’épargne nationale ne suffit pas toujours.</p>\n<p>Donc :</p>\n<p>👉 ouverture aux capitaux étrangers.</p>\n<h4>Idée</h4>\n<p>La libéralisation financière répond en partie au besoin croissant des États de financer leurs déficits publics par l’émission de titres accessibles aux investisseurs internationaux.</p>\n<p>Le deuxième facteur est le recyclage des pétrodollars.</p>\n<h3>AB. Deuxième raison : le recyclage des pétrodollars</h3>\n<p>Après les chocs pétroliers :</p>\n<ul><li>pays de l’OPEP → recettes pétrolières ↑ → excédents courants ↑ → épargne considérable.</li></ul>\n<p>Mais leurs systèmes financiers sont :</p>\n<p>👉 peu profonds.</p>\n<p>Ils placent donc leur argent :</p>\n<p>👉 dans les banques occidentales.</p>\n<p>Les banques recyclent ensuite ces capitaux vers :</p>\n<ul><li>pays développés ;</li><li>Amérique latine ;</li><li>économies émergentes.</li></ul>\n<h4>Idée</h4>\n<p>Le recyclage des pétrodollars alimente la mondialisation financière en transformant les excédents des pays pétroliers en prêts et placements internationaux.</p>\n<p>Ce processus conduit à une circulation beaucoup plus importante des capitaux, mais aussi beaucoup plus instable.</p>\n<h3>AC. Le choc Volcker montre la fragilité de cette finance mondialisée</h3>\n<p>Paul Volcker augmente fortement :</p>\n<p>👉 les taux d’intérêt américains.</p>\n<p>Conséquence :</p>\n<ul><li>rendement aux États-Unis ↑ → capitaux quittent les PED → retour vers les États-Unis.</li></ul>\n<p>Cela provoque :</p>\n<p>👉 sudden stops.</p>\n<p>Cl</p>\n<p>Le choc Volcker montre que la mobilité internationale des capitaux peut brutalement inverser les flux et transformer une dépendance financière en crise de dette.</p>\n<p>La composition des flux de capitaux est alors essentielle pour comprendre leur danger.</p>\n<div class=\"db\"><div class=\"dt\">IDE vs investissements de portefeuille</div><div class=\"dd\">une différence fondamentale de volatilité</div></div>\n<h3>AD. Les IDE</h3>\n<p>Ils sont :</p>\n<ul><li>productifs ;</li><li>durables ;</li><li>difficiles à déplacer rapidement.</li></ul>\n<p>Exemple :</p>\n<p>👉 usine.</p>\n<p>Donc :</p>\n<p>👉 faible liquidité.</p>\n<h3>AE. Investissements de portefeuille</h3>\n<p>Ils sont :</p>\n<ul><li>financiers ;</li><li>liquides ;</li><li>très faciles à vendre.</li></ul>\n<p>Un investisseur peut :</p>\n<p>👉 vendre au Mexique et acheter en Thaïlande en quelques secondes.</p>\n<p>Donc :</p>\n<p>👉 forte volatilité.</p>\n<h4>Idée</h4>\n<p>Les investissements de portefeuille sont beaucoup plus déstabilisants que les IDE car leur forte liquidité permet des mouvements massifs et extrêmement rapides de capitaux.</p>\n<p>La structure des flux internationaux a justement beaucoup changé autour de 2008.</p>\n<h3>AF. Avant 2008, les flux financiers les plus volatils dominent</h3>\n<p>Première mondialisation :</p>\n<p>👉 80-90 % portefeuille / prêts.</p>\n<p>Puis seconde mondialisation :</p>\n<p>👉 montée des IDE.</p>\n<p>Avec la globalisation financière :</p>\n<p>👉 investissements de portefeuille et autres flux financiers augmentent fortement.</p>\n<p>À la veille de 2008 :</p>\n<ul><li>2/3 de flux financiers non-IDE ;</li><li>1/3 d’IDE.</li></ul>\n<h4>Conséquence</h4>\n<p>Le système devient :</p>\n<p>👉 très volatil.</p>\n<p>La crise de 2008 modifie cette structure.</p>\n<h3>AG. Après 2008 : relatif rééquilibrage vers les IDE</h3>\n<p>La crise financière de 2008 a réduit la part des flux financiers les plus volatils et augmenté le poids relatif des IDE dans la mondialisation financière. Une situation proche de :</p>\n<p>👉 50/50</p>\n<p>La globalisation financière devient :</p>\n<p>👉 relativement moins instable qu’avant 2008.</p>\n<h3>AH. Comparaison : première mondialisation vs hypermondialisation</h3>\n<p>C’est ce qui conduit au paradoxe de Lucas.</p>\n<h3>AI. Le paradoxe de Lucas</h3>\n<p>En 1990, Robert Lucas pose une question :</p>\n<div class=\"alertb\"><p>👉 pourquoi les capitaux ne vont-ils pas massivement des pays riches vers les pays pauvres, où leur rendement devrait théoriquement être plus élevé ?</p></div>\n<p>Et même :</p>\n<p>👉 pourquoi observe-t-on parfois des flux Sud → Nord ?</p>\n<p>C’est le :</p>\n<p>👉 paradoxe de Lucas.</p>\n<h4>Idée</h4>\n<p>Le paradoxe de Lucas désigne le fait que les capitaux ne se dirigent pas systématiquement des pays riches vers les pays pauvres malgré une rentabilité théorique plus élevée du capital dans ces derniers.</p>\n<p>Une dernière différence concerne le comportement des firmes multinationales.</p>\n<h3>AJ. Quatrième différence : les stratégies des FMN ont profondément changé</h3>\n<h4>Première mondialisation</h4>\n<p>Peu de FMN.</p>\n<p>IDE surtout pour :</p>\n<p>👉 sécuriser matières premières.</p>\n<p>Donc :</p>\n<p>👉 resource-seeking.</p>\n<h4>Après 1945</h4>\n<p>IDE horizontaux :</p>\n<p>👉 rechercher des marchés.</p>\n<h4>Hypermondialisation</h4>\n<p>IDE verticaux :</p>\n<p>👉 rationaliser la production.</p>\n<p>Donc :</p>\n<ul><li>fragmentation ;</li><li>coût du travail ;</li><li>chaînes de valeur ;</li><li>spécialisation des territoires.</li></ul>\n<p>Cl</p>\n<p>Les FMN sont passées d’une logique principalement extractive à des stratégies de marché puis à une organisation mondiale de la production fondée sur la fragmentation des chaînes de valeur.</p>\n<h3>AK. Un même pays peut changer de logique d’IDE</h3>\n<h4>Exemple chinois</h4>\n<p>Première phase :</p>\n<p>👉 implantation pour réduire les coûts.</p>\n<p>IDE vertical.</p>\n<p>Puis :</p>\n<p>👉 implantation pour satisfaire le marché chinois.</p>\n<p>IDE horizontal / logique de marché.</p>\n<h4>Idée importante</h4>\n<p>Les stratégies des FMN évoluent avec :</p>\n<p>👉 le développement du pays d’accueil.</p>\n<p>Cl</p>\n<p>À mesure qu’un pays se développe, il peut passer du statut de plateforme à bas coûts à celui de grand marché de consommation recherché par les firmes multinationales.</p>\n<h3>AL. Conclusion</h3>\n<p>La mondialisation contemporaine ne reproduit donc pas simplement la première mondialisation.</p>\n<p>La mobilité internationale des personnes reste proportionnellement plus faible qu’au XI Xe siècle, tandis que la circulation des capitaux atteint une ampleur sans précédent.</p>\n<p>La grande rupture réside surtout dans :</p>\n<ul><li>la montée des IDE ;</li><li>la fragmentation des chaînes de valeur ;</li><li>la globalisation financière ;</li><li>la diversification géographique des investisseurs ;</li><li>la montée de la Chine ;</li><li>la multiplication des flux Sud-Nord et Sud-Sud.</li></ul>\n<p>Les capitaux sont ainsi devenus un vecteur beaucoup plus important de mondialisation que les migrations.</p>\n<h4>Idée</h4>\n<p>Alors que la première mondialisation reposait largement sur la circulation des hommes et sur des capitaux principalement orientés du centre vers les périphéries, l’hypermondialisation se caractérise par une mobilité financière massive, multidirectionnelle et beaucoup plus volatile, au cœur de l’intégration économique contemporaine.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>XIX. Le ralentissement du commerce mondial depuis 2008 : slowbalization ou démondialisation ?</h2>\n<p>La mondialisation est-elle en train de s’arrêter, ou change-t-elle simplement de forme ?</p>\n<h3>A. Idée générale</h3>\n<p>Depuis la crise de 2008, un constat s’impose :</p>\n<p>👉 le commerce mondial ne progresse plus aussi vite qu’avant.</p>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 commerce mondial ↑ beaucoup plus vite que PIB mondial.</p>\n<p>Depuis 2008 :</p>\n<p>👉 commerce mondial ≈ PIB mondial.</p>\n<p>Donc :</p>\n<p>👉 le taux d’ouverture mondial stagne autour de 30 %.</p>\n<p>Cette évolution a conduit à parler de :</p>\n<p>👉 slowbalization,</p>\n<p>c’est-à-dire :</p>\n<p>👉 un ralentissement de la mondialisation.</p>\n<p>Mais il faut être très prudent :</p>\n<ul><li>ralentissement de la mondialisation ≠ nécessairement démondialisation.</li></ul>\n<h4>Idée centrale</h4>\n<p>Depuis 2008, la mondialisation ne disparaît pas, mais :</p>\n<ul><li>sa progression ralentit ;</li><li>les chaînes de valeur se raccourcissent ;</li><li>les États cherchent davantage de souveraineté ;</li><li>le protectionnisme progresse ;</li><li>la géographie des échanges se transforme.</li></ul>\n<h4>Idée</h4>\n<p>Depuis la crise de 2008, l’économie mondiale semble être entrée dans une phase de slowbalization : l’ouverture ne recule pas massivement, mais sa progression ralentit tandis que les flux commerciaux et productifs se recomposent.</p>\n<p>Avant de parler de démondialisation, il faut distinguer ralentissement, démondialisation factuelle et projet politique de démondialisation.</p>\n<h3>B. La mondialisation est-elle irréversible ?</h3>\n<p>Pendant longtemps, l’ouverture internationale a été considérée comme :</p>\n<p>👉 presque inéluctable.</p>\n<p>L’idée dominante était :</p>\n<ul><li>capitalisme → développement des échanges → ouverture croissante → intégration toujours plus forte.</li></ul>\n<p>Cette vision est présente chez différents auteurs, même avec des conclusions très différentes.</p>\n<h3>C. Ricardo : l’échange comme prolongement du capitalisme</h3>\n<p>Pour Ricardo :</p>\n<p>👉 les échanges internationaux permettent de préserver le profit.</p>\n<p>Exemple :</p>\n<ul><li>importer du blé moins cher → prix du pain ↓ → salaire de subsistance ↓ → profits ↑.</li></ul>\n<p>Donc :</p>\n<p>👉 le commerce international aide à lutter contre la baisse du taux de profit.</p>\n<h3>D. Marx : le capitalisme a besoin de nouveaux débouchés</h3>\n<p>Marx considère que le capitalisme connaît des contradictions internes.</p>\n<p>Les producteurs cherchent :</p>\n<ul><li>à réduire les salaires ;</li><li>à accroître la productivité ;</li><li>à accumuler du capital.</li></ul>\n<p>Mais cela peut provoquer :</p>\n<p>👉 une insuffisance de demande.</p>\n<p>Donc :</p>\n<ul><li>production ↑mais demande interne insuffisante → nécessité de trouver des débouchés extérieurs → exportations.</li></ul>\n<h4>Idée</h4>\n<p>Chez Marx comme chez Ricardo, pour des raisons différentes, l’ouverture extérieure apparaît comme un mécanisme permettant au capitalisme de dépasser certaines de ses contradictions internes.</p>\n<h3>E. Thatcher et le « There Is No Alternative »</h3>\n<p>Au début des années 1980, Margaret Thatcher résume cette logique par :</p>\n<p>👉 There Is No Alternative.</p>\n<p>L’idée :</p>\n<p>👉 on ne peut pas aller contre la mondialisation et la concurrence internationale.</p>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 l’ouverture est donc souvent perçue comme irréversible.</p>\n<p>Cl</p>\n<p>L’hypermondialisation s’est accompagnée de l’idée que l’intégration internationale constituait une évolution inévitable à laquelle les États devaient nécessairement s’adapter.</p>\n<p>La crise de 2008 remet profondément en cause cette conviction.</p>\n<h3>F. 2008 : le grand réveil</h3>\n<p>La crise financière mondiale montre plusieurs fragilités :</p>\n<ul><li>interdépendance excessive ;</li><li>transmission rapide des crises ;</li><li>forte volatilité des capitaux ;</li><li>vulnérabilité des économies ouvertes.</li></ul>\n<p>Elle provoque donc :</p>\n<p>👉 une méfiance croissante envers la mondialisation.</p>\n<h4>En interne</h4>\n<p>Les mouvements populistes exploitent :</p>\n<p>👉 le mécontentement des perdants de la mondialisation.</p>\n<h4>En externe</h4>\n<p>Les tensions géopolitiques se renforcent :</p>\n<ul><li>États-Unis / Chine ;</li><li>Russie / Occident ;</li><li>tensions commerciales ;</li><li>rivalités technologiques.</li></ul>\n<h4>Idée</h4>\n<p>La crise de 2008 constitue une rupture politique et économique en révélant les vulnérabilités de l’hypermondialisation et en alimentant une contestation croissante de l’ouverture internationale.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">depuis 2008, l’ouverture mondiale ne s’effondre pas, mais sa progression ralentit nettement, ce qui conduit à parler de slowbalization.</div></div>\n<p>Il faut maintenant définir précisément ce qu’on appelle « démondialisation ».</p>\n<h3>G. Deux sens possibles du mot démondialisation</h3>\n<h3>H. La démondialisation au sens factuel</h3>\n<p>Elle correspond à une volonté des pays de réduire leur participation aux échanges internationaux.</p>\n<p>Cela peut prendre plusieurs formes.</p>\n<h4>1-Protectionnisme</h4>\n<ul><li>droits de douane ;</li><li>quotas ;</li><li>normes ;</li><li>restrictions.</li></ul>\n<h4>2-Substitution aux importations</h4>\n<p>Produire davantage :</p>\n<p>👉 sur le territoire national.</p>\n<h4>3-Fermeture financière</h4>\n<p>Limiter :</p>\n<ul><li>flux de capitaux ;</li><li>prêts en devises ;</li><li>investissements étrangers.</li></ul>\n<h4>4-Filtrage des IDE</h4>\n<p>Les États peuvent refuser certains investissements étrangers.</p>\n<h4>Exemple</h4>\n<p>Projet de rachat de Carrefour par Couche-Tard :</p>\n<p>👉 refus français au nom de la souveraineté alimentaire.</p>\n<h4>Idée</h4>\n<p>Au sens factuel, la démondialisation désigne l’ensemble des stratégies par lesquelles les États cherchent à limiter leur dépendance commerciale, productive ou financière vis-à-vis de l’extérieur.</p>\n<p>Mais le terme possède aussi une signification politique plus forte.</p>\n<h3>I. La démondialisation comme projet politique</h3>\n<p>Le terme est notamment associé à :</p>\n<p>👉 Walden Bello, au début des années 2000.</p>\n<p>L’idée :</p>\n<p>👉 il faut volontairement réduire certaines interdépendances mondiales.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que la mondialisation serait :</p>\n<ul><li>inégalitaire ;</li><li>favorable aux pays avancés ;</li><li>destructrice pour certains PED ;</li><li>incompatible avec certains objectifs écologiques.</li></ul>\n<h4>Donc</h4>\n<p>La démondialisation devient :</p>\n<p>👉 un projet altermondialiste.</p>\n<h4>Objectif</h4>\n<p>Construire des échanges :</p>\n<ul><li>plus équilibrés ;</li><li>plus équitables ;</li><li>plus respectueux de l’environnement.</li></ul>\n<h4>Idée</h4>\n<p>Au sens politique, la démondialisation ne désigne pas seulement un recul spontané des flux mais un projet volontaire de réorganisation de l’économie mondiale autour de relations jugées plus soutenables et plus équitables.</p>\n<p>Dans les faits, on observe surtout un ralentissement du commerce mondial depuis 2008.</p>\n<h3>J. Depuis 2008, le commerce mondial progresse beaucoup moins vite</h3>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 commerce mondial ↑ beaucoup plus vite que PIB.</p>\n<p>👉 commerce ≈ 1,5 fois plus dynamique que PIB.</p>\n<p>Pendant les années 1990-2000 :</p>\n<p>👉 parfois environ 2 fois plus rapide.</p>\n<p>Depuis 2008 :</p>\n<p>👉 commerce mondial ≈ croissance du PIB mondial.</p>\n<h4>Donc</h4>\n<p>élasticité du commerce au PIB :</p>\n<p>👉 ≈ 1.</p>\n<h4>Conséquence</h4>\n<p>Si :</p>\n<ul><li>commerce ↑ au même rythme que PIB,</li></ul>\n<p>alors :</p>\n<p>👉 taux d’ouverture stagne.</p>\n<p>👉 autour de 29-30 %.</p>\n<h4>Idée</h4>\n<p>Depuis 2008, l’élasticité du commerce mondial au PIB s’est rapprochée de 1, ce qui explique la stagnation du taux d’ouverture mondial autour de 30 %.</p>\n<p>Une partie de ce ralentissement est conjoncturelle.</p>\n<h3>K. Une composante conjoncturelle : les grandes récessions</h3>\n<p>Les échanges internationaux :</p>\n<p>👉 sur-réagissent aux crises.</p>\n<p>Deux exemples récents :</p>\n<ul><li>crise financière de 2008 ;</li><li>crise sanitaire de 2020.</li></ul>\n<p>Dans les deux cas :</p>\n<p>👉 commerce ↓ beaucoup plus fortement que PIB.</p>\n<h4>Pourquoi ?</h4>\n<p>Les entreprises réduisent rapidement :</p>\n<ul><li>investissements ;</li><li>stocks ;</li><li>commandes ;</li><li>importations intermédiaires.</li></ul>\n<p>Donc :</p>\n<ul><li>récession → commerce mondial chute fortement.</li></ul>\n<h4>Idée</h4>\n<p>Le commerce international est fortement procyclique : il chute davantage que le PIB pendant les grandes récessions, ce qui explique une partie de son ralentissement récent.</p>\n<p>Elle montre :</p>\n<ul><li>faible baisse en 1982 ;</li><li>résistance en 1991 ;</li><li>forte chute en 2008 ;</li><li>chute encore plus brutale en 2020.</li></ul>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">les récessions de 2008 et 2020 provoquent une chute beaucoup plus forte des importations mondiales que les récessions précédentes, ce qui montre la forte sensibilité du commerce aux crises.</div></div>\n<p>Mais les crises ne suffisent pas à expliquer la stagnation depuis quinze ans.</p>\n<h3>L. Le ralentissement est surtout structurel</h3>\n<p>Trois grandes explications doivent être retenues :</p>\n<ul><li>le rééquilibrage du modèle chinois ;</li><li>le raccourcissement des chaînes de valeur mondiales ;</li><li>la résurgence du protectionnisme.</li></ul>\n<h4>Idée</h4>\n<p>Le ralentissement du commerce mondial ne s’explique pas seulement par les crises : il repose surtout sur des transformations structurelles des modèles productifs, des politiques publiques et des chaînes de valeur.</p>\n<h3>M. Premier facteur structurel : la transformation du modèle chinois</h3>\n<h3>N. L’ouverture progressive de la Chine</h3>\n<p>À partir de la fin des années 1970-1980 :</p>\n<ul><li>La Chine devient : l’atelier du monde.</li><li>Mais la stratégie chinoise évolue après 2008.</li></ul>\n<h3>O. La Chine cherche d’abord à rééquilibrer sa croissance</h3>\n<p>Avant 2008 :</p>\n<p>👉 modèle très extraverti.</p>\n<p>Les exportations représentent autour de :</p>\n<p>👉 35 % du PIB chinois en 2006.</p>\n<p>En 2024 :</p>\n<p>👉 environ 21 %.</p>\n<h4>Donc</h4>\n<p>la Chine cherche à développer :</p>\n<p>👉 son marché intérieur.</p>\n<p>Cette volonté apparaît notamment dans le :</p>\n<p>👉 14e plan quinquennal 2021-2025.</p>\n<p>Objectif :</p>\n<p>👉 construire un marché intérieur fort.</p>\n<h4>Problème</h4>\n<p>La consommation intérieure chinoise reste insuffisante.</p>\n<p>Donc :</p>\n<p>👉 les exportations restent essentielles.</p>\n<h4>Idée</h4>\n<p>Après 2008, la Chine tente de réduire sa dépendance à la demande extérieure en développant son marché intérieur, mais la faiblesse persistante de la consommation limite ce rééquilibrage.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">la stratégie chinoise se déplace progressivement du développement quantitatif vers l’innovation, l’industrie moderne et la souveraineté technologique.</div></div>\n<p>Ce rééquilibrage passe surtout par une montée en gamme très rapide.</p>\n<h3>P. La montée en gamme chinoise</h3>\n<p>En 2015, lancement de :</p>\n<p>👉 Made in China 2025.</p>\n<p>Objectif :</p>\n<p>👉 produire davantage de technologies sur le territoire chinois.</p>\n<p>Le projet est notamment de réduire :</p>\n<p>👉 la dépendance technologique étrangère.</p>\n<h4>Exemple emblématique : l’iPhone</h4>\n<p>iPhone 3G, 2009 :</p>\n<p>👉 valeur ajoutée chinoise ≈ 4 %.</p>\n<p>iPhone X, 2018 :</p>\n<p>👉 environ 25 %</p>\n<h4>Donc</h4>\n<p>Chine :</p>\n<ul><li>assemblage → composants → technologie → valeur ajoutée domestique ↑.</li></ul>\n<h4>Idée</h4>\n<p>La montée en gamme chinoise se traduit par une augmentation rapide de la valeur ajoutée domestique incorporée dans ses exportations et par une réduction de sa dépendance aux composants étrangers.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">la Chine remplace progressivement une logique d’assemblage à partir d’intrants importés par une production domestique plus complète et à plus forte valeur ajoutée.</div></div>\n<p>Elle permet de montrer :</p>\n<ul><li>hausse de la VA chinoise dans l’iPhone ;</li><li>exportations qui progressent plus vite que les importations ;</li><li>recul du processing trade ;</li><li>montée du commerce ordinaire chinois.</li><li>Cette transformation conduit à un nouveau choc chinois.</li></ul>\n<h3>Q. Du premier au deuxième choc chinois</h3>\n<h3>R. Premier choc chinois</h3>\n<p>Début des années 2000.</p>\n<p>Après l’entrée à l’OMC :</p>\n<p>👉 explosion des exportations chinoises.</p>\n<div class=\"formula\">Chine = atelier du monde.</div>\n<h3>S. Deuxième choc chinois</h3>\n<p>Aujourd’hui, les exportations chinoises sont davantage centrées sur :</p>\n<ul><li>véhicules électriques ;</li><li>batteries ;</li><li>panneaux solaires ;</li><li>technologies avancées.</li></ul>\n<p>Donc :</p>\n<p>👉 la Chine concurrence désormais les pays avancés sur leurs propres avantages comparatifs.</p>\n<h4>Idée</h4>\n<p>Le deuxième choc chinois se distingue du premier par la nature des biens exportés : la Chine ne concurrence plus seulement les industries à bas coûts mais également les secteurs technologiques et industriels à forte valeur ajoutée.</p>\n<p>Cette montée en gamme modifie aussi les coûts chinois.</p>\n<h3>T. La Chine n’est plus un pays à très bas salaires</h3>\n<p>Les salaires chinois ont fortement augmenté.</p>\n<p>Ils sont désormais :</p>\n<p>👉 supérieurs à ceux de nombreux pays émergents.</p>\n<p>Dans certaines zones :</p>\n<p>👉 proches des niveaux observés dans certains pays d’Europe de l’Est ou du Sud.</p>\n<h4>Conséquence</h4>\n<p>La Chine est moins attractive uniquement pour :</p>\n<p>👉 le coût du travail.</p>\n<p>Cela favorise :</p>\n<ul><li>déplacement vers Vietnam ;</li><li>Bangladesh ;</li><li>Laos ;</li><li>autres pays asiatiques.</li></ul>\n<h4>Idée</h4>\n<p>La montée en gamme de la Chine réduit progressivement son avantage comparatif fondé sur le faible coût du travail et pousse certaines activités intensives en main-d’œuvre vers des économies moins développées.</p>\n<p>Ce phénomène participe à un deuxième mouvement majeur : le raccourcissement des chaînes de valeur mondiales.</p>\n<h3>U. Deuxième facteur structurel : le raccourcissement des chaînes de valeur mondiales</h3>\n<p>Pendant l’hypermondialisation :</p>\n<p>👉 les chaînes de valeur se sont allongées.</p>\n<p>Chaque étape pouvait être réalisée :</p>\n<p>👉 dans le pays où elle coûtait le moins cher.</p>\n<p>Aujourd’hui :</p>\n<p>👉 cette dynamique ralentit.</p>\n<p>Le FMI parle :</p>\n<p>👉 d’un raccourcissement des CVM.</p>\n<div class=\"db\"><div class=\"dt\">Lecture</div><div class=\"dd\">l’hypermondialisation s’est accompagnée d’un allongement des chaînes de valeur mondiales jusqu’à la crise de 2008 ; depuis, leur poids stagne, signe d’un essoufflement de la fragmentation internationale de la production.</div></div>\n<p>Le graphique montre :</p>\n<ul><li>forte hausse de la part du commerce lié aux CVM entre les années 1970 et 2008 ;</li><li>puis stagnation autour de 40-45 %.</li></ul>\n<p>Ce raccourcissement vient à la fois des États et des entreprises.</p>\n<h3>V. Premier moteur : la volonté des États</h3>\n<p>Les crises récentes montrent que :</p>\n<p>👉 dépendre de fournisseurs éloignés peut être dangereux.</p>\n<p>Exemples :</p>\n<ul><li>Covid ;</li><li>Ukraine ;</li><li>tensions sino-américaines ;</li><li>blocage de Suez ;</li><li>tensions dans certaines routes maritimes.</li></ul>\n<h4>Conséquence</h4>\n<p>Les États cherchent :</p>\n<p>👉 davantage de souveraineté.</p>\n<p>Ils encouragent donc :</p>\n<ul><li>relocalisation ;</li><li>réindustrialisation ;</li><li>diversification des fournisseurs.</li></ul>\n<h3>W. Reshoring, nearshoring et friendshoring</h3>\n<h4>Reshoring</h4>\n<p>👉 relocaliser dans son propre pays.</p>\n<h4>Nearshoring</h4>\n<p>👉 déplacer la production vers un pays géographiquement proche.</p>\n<h4>Friendshoring</h4>\n<p>👉 privilégier les pays considérés comme politiquement fiables.</p>\n<p>Terme popularisé notamment par :</p>\n<p>👉 Janet Yellen.</p>\n<h4>Idée centrale</h4>\n<p>On ne cherche plus uniquement :</p>\n<p>👉 le coût minimal.</p>\n<p>On cherche aussi :</p>\n<p>👉 la sécurité.</p>\n<h4>Idée</h4>\n<p>Les stratégies de reshoring, nearshoring et friendshoring traduisent le passage d’une logique d’optimisation pure des coûts à une logique combinant efficacité, résilience et sécurité géopolitique.</p>\n<p>Mais les entreprises elles-mêmes revoient leurs calculs.</p>\n<h3>X. Deuxième moteur : les entreprises réévaluent le coût réel de la délocalisation</h3>\n<p>Pendant les années 1990 :</p>\n<p>👉 énorme avantage à produire loin.</p>\n<p>Aujourd’hui, les arbitrages ont changé.</p>\n<h4>1-Salaires ↑ dans les pays émergents</h4>\n<p>Chine notamment.</p>\n<div class=\"formula\">2-Pays encore peu chers = infrastructures parfois moins performantes</div>\n<p>Donc :</p>\n<p>👉 coût logistique ↑.</p>\n<h4>3-Transport plus volatil</h4>\n<ul><li>tensions géopolitiques ;</li><li>Suez ;</li><li>détroits ;</li><li>guerres ;</li><li>événements climatiques.</li></ul>\n<h4>4-Risque de rupture des intrants</h4>\n<p>Un seul composant absent :</p>\n<p>👉 toute la production peut s’arrêter.</p>\n<p>Cl</p>\n<p>Les entreprises intègrent désormais dans leurs choix de localisation non seulement les coûts salariaux mais aussi les risques logistiques, géopolitiques et d’approvisionnement.</p>\n<p>À cela s’ajoutent des considérations de qualité et d’image.</p>\n<h3>Y. Produire localement peut redevenir avantageux</h3>\n<p>Produire près du consommateur peut permettre :</p>\n<ul><li>contrôle qualité ↑ ;</li><li>délais ↓ ;</li><li>image de marque ↑ ;</li><li>empreinte carbone ↓ ;</li><li>traçabilité ↑.</li></ul>\n<h4>Made in France / Made in Europe</h4>\n<p>Peut devenir :</p>\n<p>👉 un argument commercial.</p>\n<h4>De plus</h4>\n<p>Les industries modernes sont souvent :</p>\n<p>👉 très capitalistiques.</p>\n<p>Donc :</p>\n<ul><li>coût du travail ↓ en importance relative.</li></ul>\n<h4>Exemple</h4>\n<p>Industries :</p>\n<ul><li>semi-conducteurs ;</li><li>batteries ;</li><li>robotique ;</li><li>technologies avancées.</li></ul>\n<h4>Idée</h4>\n<p>La relocalisation devient plus crédible dans les industries fortement capitalistiques, où le coût du travail pèse moins lourd et où la qualité, la sécurité d’approvisionnement et l’image locale prennent davantage d’importance.</p>\n<p>Le troisième grand facteur du ralentissement est le retour du protectionnisme.</p>\n<h3>Z. Troisième facteur : la résurgence du protectionnisme</h3>\n<p>Le protectionnisme n’a pas commencé avec Trump.</p>\n<p>Depuis la crise de 2008 :</p>\n<p>👉 les mesures protectionnistes augmentent.</p>\n<p>Malgré les engagements du G20 :</p>\n<p>👉 apparition d’un protectionnisme furtif.</p>\n<h3>AA. Le protectionnisme furtif</h3>\n<p>Il s’agit d’un protectionnisme :</p>\n<p>👉 moins visible que les droits de douane.</p>\n<h4>Exemples</h4>\n<h4>Union européenne</h4>\n<p>👉 normes sanitaires / environnementales.</p>\n<h4>Chine</h4>\n<p>👉 subventions et soutien public aux producteurs domestiques.</p>\n<p>Cl</p>\n<p>Le protectionnisme contemporain est souvent furtif : plutôt que d’utiliser uniquement les droits de douane, les États recourent aux normes, aux subventions et aux exigences de contenu local.</p>\n<p>Puis le protectionnisme tarifaire revient ouvertement.</p>\n<h3>AB. Trump et le retour du protectionnisme tarifaire</h3>\n<p>Le symbole est le :</p>\n<p>👉 Liberation Day du 2 avril 2025.</p>\n<p>Trump annonce des droits de douane :</p>\n<ul><li>plancher autour de 10 % ;</li><li>plus élevés pour certains partenaires ;</li><li>logique bilatérale liée aux déficits commerciaux américains.</li></ul>\n<h4>Conséquence</h4>\n<p>👉 retour spectaculaire des droits de douane comme instrument de politique économique.</p>\n<h4>Idée</h4>\n<p>Le retour des droits de douane sous Trump marque le passage d’un protectionnisme largement furtif à un protectionnisme tarifaire assumé et explicitement utilisé comme instrument de puissance.</p>\n<p>Pourtant, le commerce mondial ne s’est pas effondré.</p>\n<h3>AC. Le paradoxe : le commerce mondial résiste au protectionnisme</h3>\n<p>Malgré :</p>\n<ul><li>tarifs ;</li><li>tensions ;</li><li>sanctions ;</li><li>politiques industrielles ;</li></ul>\n<p>le commerce mondial continue :</p>\n<p>👉 à progresser.</p>\n<p>L’OMC cite une croissance du commerce mondial en 2025 autour de :</p>\n<p>👉 4,6 %.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que les flux :</p>\n<p>👉 se réorganisent.</p>\n<p>Ils ne disparaissent pas forcément.</p>\n<p>Exemple :</p>\n<ul><li>Chine → moins États-UnismaisChine → davantage Europe / autres PED.</li></ul>\n<h4>Idée centrale</h4>\n<p>Le protectionnisme modifie plus :</p>\n<p>👉 la géographie des échanges</p>\n<p>que :</p>\n<p>👉 leur volume global.</p>\n<h4>Idée</h4>\n<p>Le retour du protectionnisme ne provoque pas nécessairement un effondrement du commerce mondial : il entraîne surtout une recomposition géographique des flux.</p>\n<p>Cela explique pourquoi il est excessif de parler aujourd’hui d’une véritable démondialisation.</p>\n<h3>AD. Peut-on parler de démondialisation ?</h3>\n<h4>Oui, certains éléments vont dans ce sens</h4>\n<ul><li>protectionnisme ↑ ;</li><li>filtrage des IDE ;</li><li>relocalisations ;</li><li>friendshoring ;</li><li>raccourcissement des chaînes de valeur ;</li><li>méfiance envers les capitaux volatils.</li></ul>\n<h4>Mais non, au sens strict</h4>\n<p>Parce que :</p>\n<ul><li>commerce mondial reste très élevé ;</li><li>taux d’ouverture ≈ 30 % ;</li><li>flux financiers restent massifs ;</li><li>CVM restent centrales ;</li><li>entreprises restent internationalisées ;</li><li>les échanges changent de direction plus qu’ils ne disparaissent.</li></ul>\n<h4>Conclusion</h4>\n<p>👉 on peut parler davantage de :</p>\n<h4>slowbalization</h4>\n<p>ou :</p>\n<p>👉 reconfiguration de la mondialisation.</p>\n<h4>Idée</h4>\n<p>La période actuelle relève moins d’une véritable démondialisation que d’une reconfiguration de l’intégration mondiale, marquée par davantage de régionalisation, de sécurité économique et de tensions géopolitiques.</p>\n<h3>AE. Les cinq grandes ères de la mondialisation</h3>\n<p>À retenir pour replacer historiquement :</p>\n<ul><li>1-1870-1914</li></ul>\n<p>👉 première mondialisation.</p>\n<h4>2-1914-1945</h4>\n<p>👉 guerres + protectionnisme + démondialisation.</p>\n<h4>3-1945-1980</h4>\n<p>👉 remondialisation progressive.</p>\n<h4>4-1980-2008</h4>\n<p>👉 hypermondialisation.</p>\n<h4>5-Depuis 2008</h4>\n<p>👉 slowbalization / reconfiguration.</p>\n<h4>Idée</h4>\n<p>L’histoire de la mondialisation n’est pas linéaire mais composée de vagues successives d’ouverture, de fermeture et de recomposition.</p>\n<h4>Conclusion</h4>\n<p>Depuis 2008, la mondialisation n’est plus dans la dynamique explosive de l’hypermondialisation.</p>\n<p>Le commerce progresse moins vite, les chaînes de valeur cessent de s’allonger, les États veulent davantage de souveraineté et les entreprises réévaluent les risques de la fragmentation productive.</p>\n<p>Mais parler de démondialisation serait excessif.</p>\n<p>Les échanges restent historiquement très élevés et la mondialisation continue :</p>\n<p>👉 elle change de forme.</p>\n<p>On passe progressivement d’une mondialisation fondée principalement sur :</p>\n<ul><li>l’efficacité et la minimisation des coûts</li><li>à une mondialisation intégrant davantage :</li><li>la sécurité, la souveraineté, la résilience et les alliances géopolitiques.</li></ul>\n<h4>Idée</h4>\n<div class=\"db\"><div class=\"dt\">Depuis 2008, la mondialisation ne disparaît pas</div><div class=\"dd\">elle se ralentit et se recompose. La recherche du coût minimal cède progressivement la place à une logique où la sécurité économique, la résilience des chaînes de valeur et la proximité géopolitique deviennent des critères essentiels de l’organisation des échanges.</div></div>\n</div>", "notions": [["Ouverture internationale", "Ensemble des liens d’une économie avec le reste du monde : échanges de biens et services, circulation des facteurs de production et mouvements de capitaux."], ["Ouverture commerciale", "Échanges de biens et de services entre les résidents d’un pays et le reste du monde ; dimension strictement commerciale de la mondialisation."], ["Ouverture productive", "Circulation internationale des facteurs de production, notamment le capital productif et le tr
