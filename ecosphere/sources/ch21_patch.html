<script id="eco-annee2-ch1-v174">
(function(){
'use strict';
if(window.__ECO_A2_CH1) return;
window.__ECO_A2_CH1 = true;var D = {"key": 21, "label": "Deuxième année — Chapitre 1", "title": "Mondialisation, ouverture internationale et déséquilibres extérieurs", "sub": "Dimensions de l’ouverture · Michalet · asymétries et termes de l’échange · courbe de l’éléphant · balance des paiements · commerce en valeur ajoutée · chaînes de valeur · histoire des mondialisations", "cours": "<div class=\"nb ch21-premium-course\">\n<h2>I. Les différentes dimensions de l’ouverture internationale</h2>\n<h4>Que signifie l’ouverture d’une économie ?</h4>\n<h4>Idée générale</h4>\n<p>Quand un pays s’ouvre au reste du monde, il ne se contente pas d’échanger des biens et des services.</p>\n<p>L’ouverture internationale peut prendre plusieurs formes :</p>\n<ul><li>une ouverture commerciale ;</li><li>une ouverture productive ;</li><li>une ouverture financière et monétaire.</li><li>Il faut donc distinguer les différents types de flux internationaux.</li></ul>\n<h4>Idée centrale</h4>\n<p>La mondialisation ne concerne pas uniquement le commerce international.</p>\n<p>Elle repose aussi sur :</p>\n<ul><li>la circulation des facteurs de production ;</li><li>la circulation des capitaux financiers ;</li><li>les mouvements de devises qui accompagnent ces échanges.</li></ul>\n<h4>Idée</h4>\n<p>L’ouverture internationale ne se limite pas aux échanges de biens et de services : elle comporte également une dimension productive, liée à la mobilité des facteurs de production, et une dimension financière et monétaire, liée aux mouvements de capitaux et de devises.</p>\n<p>Il faut donc commencer par distinguer la forme la plus simple d’ouverture : l’ouverture commerciale.</p>\n<h3>A. L’ouverture commerciale : les échanges de biens et de services</h3>\n<p>L’ouverture commerciale désigne les échanges de :</p>\n<ul><li>biens ;</li><li>services ;</li><li>entre les résidents d’un pays et le reste du monde.</li></ul>\n<p>C’est ce qu’on appelle :</p>\n<p>👉 le commerce international.</p>\n<h4>Exemple</h4>\n<p>Une entreprise française vend des voitures en Allemagne.</p>\n<p>→ Il s’agit d’une exportation de biens.</p>\n<p>Un Français achète un service numérique fourni par une entreprise américaine.</p>\n<p>→ Il s’agit d’une importation de services.</p>\n<h4>Mot-clé à retenir</h4>\n<div class=\"db\"><div class=\"dt\">Commerce international</div><div class=\"dd\">échanges internationaux de biens et de services.</div></div>\n<h4>Idée</h4>\n<p>L’ouverture commerciale correspond aux échanges de biens et de services entre résidents et non-résidents ; elle constitue donc la dimension strictement commerciale de la mondialisation.</p>\n<p>Mais une économie ouverte n’échange pas uniquement ce qu’elle produit : elle peut également échanger les facteurs nécessaires à la production.</p>\n<h3>B. L’ouverture productive : la circulation des facteurs de production</h3>\n<h3>C. Quels sont les facteurs de production concernés ?</h3>\n<p>Deux grands facteurs de production peuvent circuler entre les pays :</p>\n<ul><li>Le capital productif</li><li>Le capital productif circule notamment à travers :</li></ul>\n<p>👉 les investissements directs à l’étranger (IDE).</p>\n<p>Un IDE correspond à un investissement réalisé dans un autre pays dans une logique productive.</p>\n<p>Exemples :</p>\n<ul><li>création d’une usine à l’étranger ;</li><li>acquisition d’une entreprise étrangère ;</li><li>implantation d’une filiale.</li></ul>\n<p>Le capital n’est pas le seul facteur de production à pouvoir franchir les frontières.</p>\n<h4>Le travail</h4>\n<p>Le facteur travail peut lui aussi circuler.</p>\n<p>On s’intéresse surtout aux :</p>\n<p>👉 migrations internationales de travail.</p>\n<p>Autrement dit :</p>\n<ul><li>un individu quitte un pays pour aller travailler dans un autre.</li></ul>\n<h4>Exemple</h4>\n<p>Un ingénieur français part travailler au Canada.</p>\n<p>→ Il y a circulation internationale du facteur travail.</p>\n<p>À partir du moment où ce sont les facteurs de production eux-mêmes qui circulent, on dépasse le simple commerce international.</p>\n<h3>D. Pourquoi parle-t-on d’ouverture productive ?</h3>\n<p>Quand un pays permet :</p>\n<ul><li>l’entrée ou la sortie de capital productif ;</li><li>l’entrée ou la sortie de travailleurs ;</li></ul>\n<p>il y a :</p>\n<p>👉 ouverture productive.</p>\n<p>Cette ouverture modifie directement la localisation de la production.</p>\n<h4>Mécanisme</h4>\n<p>IDE + migrations de travail → mobilité des facteurs de production → production organisée à l’échelle internationale.</p>\n<h4>Idée</h4>\n<p>L’ouverture productive désigne la mobilité internationale des facteurs de production, principalement le capital productif à travers les IDE et le travail à travers les migrations internationales.</p>\n<p>La mondialisation économique comporte donc déjà deux dimensions : commerciale et productive. Mais tous les mouvements de capitaux ne servent pas à produire.</p>\n<h3>E. Il faut distinguer capital productif et capital financier</h3>\n<h3>F. L’IDE : un investissement productif</h3>\n<p>Lorsqu’un acteur réalise un IDE, son objectif est de participer à une activité productive.</p>\n<p>Il cherche notamment à :</p>\n<ul><li>contrôler une entreprise ;</li><li>produire à l’étranger ;</li><li>créer une filiale ;</li><li>développer une activité.</li></ul>\n<p>L’IDE est donc lié :</p>\n<p>👉 à la production.</p>\n<p>À l’inverse, certains capitaux traversent les frontières uniquement dans une logique de placement.</p>\n<h3>G. L’investissement de portefeuille : un placement financier</h3>\n<p>Un investissement de portefeuille correspond à l’achat d’actifs financiers étrangers dans une logique de :</p>\n<ul><li>rendement ;</li><li>diversification ;</li><li>sécurité.</li></ul>\n<p>L’objectif principal n’est pas de contrôler directement une activité productive.</p>\n<h4>Exemples</h4>\n<p>Un résident français peut acheter :</p>\n<ul><li>une action américaine ;</li><li>une obligation allemande ;</li><li>un bon du Trésor américain.</li></ul>\n<p>Dans ce cas :</p>\n<p>👉 il réalise un placement financier international.</p>\n<h4>Mot-clé</h4>\n<div class=\"db\"><div class=\"dt\">Investissement de portefeuille</div><div class=\"dd\">placement financier, et non investissement productif.</div></div>\n<h4>Idée</h4>\n<p>Contrairement à l’IDE, l’investissement de portefeuille ne vise pas directement le contrôle d’une activité productive : il correspond avant tout à une logique de placement et de rendement financier.</p>\n<p>L’achat d’un actif financier étranger entraîne cependant une autre conséquence : il faut généralement convertir une monnaie dans une autre.</p>\n<h3>H. L’ouverture financière devient aussi une ouverture monétaire</h3>\n<h3>I. Exemple : l’achat d’un bon du Trésor américain</h3>\n<p>Supposons qu’un résident français souhaite acheter un :</p>\n<p>👉 bon du Trésor américain.</p>\n<p>Il s’agit d’un titre de dette émis par les États-Unis.</p>\n<h4>Pourquoi l’acheter ?</h4>\n<p>Deux raisons principales peuvent être avancées.</p>\n<h4>Rechercher un rendement</h4>\n<p>L’investisseur souhaite :</p>\n<ul><li>placer son argent ;</li><li>obtenir un revenu ;</li><li>éventuellement bénéficier d’une appréciation du dollar.</li><li>Mais le rendement n’est pas la seule motivation.</li></ul>\n<h4>Rechercher un actif sûr</h4>\n<p>Les titres du Trésor américain sont traditionnellement considérés comme des actifs extrêmement sûrs.</p>\n<p>Ils jouent donc un rôle central dans le système financier mondial.</p>\n<p>On peut parler d’ :</p>\n<p>👉 actif sûr mondial.</p>\n<h4>Idée</h4>\n<p>Les titres du Trésor américain sont particulièrement recherchés car ils associent liquidité, sécurité et rôle central du dollar dans le système monétaire international.</p>\n<p>Mais pour acheter cet actif américain, un résident français doit généralement obtenir des dollars.</p>\n<h3>J. Le passage par le marché des changes</h3>\n<p>Le résident français dispose initialement d’euros.</p>\n<p>Pour acheter un actif américain :</p>\n<ul><li>il offre des euros ;</li><li>il demande des dollars.</li></ul>\n<p>Donc :</p>\n<ul><li>offre d’euros ↑demande de dollars ↑.</li></ul>\n<p>Cela se déroule sur :</p>\n<p>👉 le marché des changes.</p>\n<h4>Conséquence</h4>\n<p>Les mouvements internationaux de capitaux influencent :</p>\n<p>👉 les taux de change.</p>\n<p>Un seul achat a peu d’effet.</p>\n<p>Mais si de nombreux investisseurs achètent des actifs américains :</p>\n<ul><li>demande de dollars ↑ → pression à l’appréciation du dollar.</li></ul>\n<h4>Idée</h4>\n<p>Les mouvements internationaux de capitaux ont une dimension monétaire car ils impliquent des conversions de devises et influencent donc l’offre, la demande et le taux de change des monnaies.</p>\n<p>On comprend alors que l’ouverture internationale possède plusieurs dimensions qui se complètent mais qu’il faut distinguer clairement.</p>\n<h3>K. Les trois dimensions fondamentales de l’ouverture internationale</h3>\n<h3>L. 1. Ouverture commerciale</h3>\n<p>Elle concerne :</p>\n<p>👉 les biens et services.</p>\n<p>Donc :</p>\n<p>👉 commerce international.</p>\n<p>Mais les facteurs nécessaires à la production circulent également.</p>\n<h3>M. 2. Ouverture productive</h3>\n<p>Elle concerne :</p>\n<ul><li>capital productif ;</li><li>travail.</li><li>Exemples :</li><li>IDE ;</li><li>migrations internationales de travail.</li></ul>\n<p>Enfin, les capitaux peuvent circuler sans objectif directement productif.</p>\n<h3>N. 3. Ouverture financière et monétaire</h3>\n<p>Elle concerne :</p>\n<ul><li>investissements de portefeuille ;</li><li>prêts ;</li><li>placements financiers ;</li><li>mouvements de devises ;</li><li>taux de change.</li></ul>\n<p>Cl</p>\n<p>La mondialisation repose donc sur trois grandes formes d’ouverture : commerciale par les échanges de biens et services, productive par la mobilité du capital et du travail, et financière et monétaire par les mouvements de capitaux et de devises.</p>\n<h3>O. Pourquoi cette distinction est-elle importante ?</h3>\n<p>Elle permet de comprendre le découpage.</p>\n<h4>Mondialisation économique</h4>\n<p>Elle regroupe principalement :</p>\n<ul><li>Dimension commerciale</li><li>biens ;</li><li>services.</li><li>Dimension productive</li><li>IDE ;</li><li>migrations de travail ;</li><li>organisation internationale de la production.</li></ul>\n<p>Mais les économies peuvent également être intégrées par les flux financiers.</p>\n<h4>Mondialisation financière et monétaire</h4>\n<p>Elle concerne :</p>\n<ul><li>placements ;</li><li>titres financiers ;</li><li>prêts ;</li><li>mouvements de capitaux ;</li><li>monnaies ;</li><li>taux de change.</li></ul>\n<h4>Idée</h4>\n<p>La distinction entre mondialisation économique et mondialisation financière permet de séparer les flux liés à la production et aux échanges réels des flux liés aux placements, aux financements et aux monnaies.</p>\n<h3>P. Conclusion</h3>\n<p>L’ouverture d’une économie ne peut pas être réduite au seul commerce international.</p>\n<p>Elle comporte plusieurs dimensions.</p>\n<p>D’abord, l’ouverture commerciale permet l’échange de biens et de services.</p>\n<p>Ensuite, l’ouverture productive permet la circulation internationale du capital productif et du travail, notamment grâce aux IDE et aux migrations.</p>\n<p>Enfin, l’ouverture financière et monétaire permet la circulation des capitaux de placement et entraîne des échanges de devises susceptibles d’influencer les taux de change.</p>\n<p>La mondialisation doit être appréhendée comme un processus multidimensionnel : aux échanges commerciaux de biens et services s’ajoutent la mobilité internationale des facteurs de production et la circulation des capitaux financiers, laquelle possède également une dimension monétaire par son influence sur les taux de change.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>II. Définir la mondialisation et comprendre ses premiers enjeux</h2>\n<p>Qu’est-ce que la mondialisation et pourquoi transforme-t-elle la hiérarchie économique mondiale ?</p>\n<h4>Idée générale</h4>\n<p>La mondialisation ne désigne pas simplement le fait que les pays commercent davantage entre eux.</p>\n<p>Elle correspond à un processus dynamique par lequel les économies deviennent progressivement :</p>\n<ul><li>plus ouvertes ;</li><li>plus interdépendantes ;</li><li>plus intégrées.</li></ul>\n<p>Cette intégration repose sur la multiplication de plusieurs types de flux :</p>\n<ul><li>biens et services ;</li><li>investissements directs étrangers ;</li><li>capitaux financiers ;</li><li>personnes.</li></ul>\n<p>La mondialisation est donc un phénomène :</p>\n<p>👉 dynamique, parce qu’elle évolue dans le temps ;</p>\n<p>👉 multidimensionnel, parce qu’elle prend plusieurs formes ;</p>\n<div class=\"alertb\"><p>👉 cumulatif, parce que les nouvelles dimensions ne remplacent pas nécessairement les anciennes.</p></div>\n<h4>Idée centrale</h4>\n<p>Au cours de l’histoire, la mondialisation a connu plusieurs vagues au sein desquelles la dimension dominante a changé :</p>\n<ul><li>commerce → production → finance.</li></ul>\n<p>Dans le même temps, l’ouverture internationale modifie la hiérarchie mondiale :</p>\n<ul><li>certains pays émergent ;</li><li>d’autres décrochent ;</li><li>le leadership économique est régulièrement contesté.</li></ul>\n<h4>Idée</h4>\n<p>La mondialisation désigne un processus dynamique et multidimensionnel d’intensification des flux internationaux qui accroît l’interdépendance des économies et conduit progressivement à leur intégration au sein d’un espace économique mondial.</p>\n<p>Avant d’étudier les différentes vagues de mondialisation, il faut précisément comprendre ce que recouvre cette notion.</p>\n<h3>A. La mondialisation : un processus d’interdépendance et d’intégration croissantes</h3>\n<h3>B. Les définitions institutionnelles convergent autour de plusieurs idées</h3>\n<p>Les grandes institutions proposent des définitions différentes dans leur formulation, mais qui reposent sur un même noyau.</p>\n<h4>Le FMI : libre circulation et intégration</h4>\n<p>Pour le FMI, la mondialisation repose sur les progrès de la libre circulation :</p>\n<ul><li>des idées ;</li><li>des personnes ;</li><li>des biens ;</li><li>des services ;</li><li>des capitaux.</li></ul>\n<p>Cette circulation conduit progressivement à :</p>\n<p>👉 l’intégration des économies et des sociétés.</p>\n<h4>Idée essentielle</h4>\n<p>La mondialisation ne correspond donc pas seulement à « davantage d’échanges ».</p>\n<p>Ces échanges rapprochent progressivement les économies et rendent leur fonctionnement plus dépendant les unes des autres.</p>\n<p>Cette idée d’intégration est complétée par l’OCDE, qui insiste davantage sur la mobilité des ressources et sur l’interdépendance.</p>\n<h4>L’OCDE : un processus dynamique et multidimensionnel</h4>\n<p>Pour l’OCDE, la mondialisation est un processus :</p>\n<ul><li>dynamique ;</li><li>multidimensionnel ;</li><li>d’intégration économique.</li></ul>\n<p>Elle permet une mobilité internationale croissante des ressources nationales.</p>\n<p>Dans le même temps :</p>\n<p>👉 l’interdépendance des économies augmente.</p>\n<h4>Mot-clé</h4>\n<p>👉 Interdépendance</p>\n<p>Cela signifie que les décisions ou les événements économiques intervenant dans un pays affectent davantage les autres économies.</p>\n<h4>Exemple simple</h4>\n<p>Si un pays abandonne la production d’un médicament parce qu’il se spécialise dans d’autres activités, il devient dépendant des pays qui le produisent.</p>\n<p>La spécialisation crée donc :</p>\n<ul><li>gains de productivité → mais aussi dépendance vis-à-vis des importations.</li></ul>\n<h4>Idée</h4>\n<p>L’approfondissement de la spécialisation internationale accroît l’efficacité productive mais renforce simultanément l’interdépendance des économies en augmentant leur dépendance mutuelle aux échanges.</p>\n<p>L’INSEE élargit encore cette analyse en insistant sur l’interconnexion croissante entre les sociétés elles-mêmes.</p>\n<h4>L’INSEE : une interconnexion mondiale croissant</h4>\n<p>Pour l’INSEE, la mondialisation correspond à une :</p>\n<p>👉 interconnexion croissante à l’échelle mondiale.</p>\n<p>Cette interconnexion concerne :</p>\n<ul><li>les personnes ;</li><li>les institutions ;</li><li>les territoires ;</li><li>les sociétés.</li></ul>\n<p>Elle résulte notamment de l’augmentation :</p>\n<ul><li>des flux de biens et services ;</li><li>des capitaux ;</li><li>des personnes ;</li><li>des connaissances.</li></ul>\n<h4>Idée clé</h4>\n<p>La mondialisation dépasse donc le seul domaine commercial.</p>\n<p>Elle relie progressivement les économies et les sociétés au-delà des frontières nationales.</p>\n<p>Ces définitions permettent de construire une définition générale directement utilisable en dissertation.</p>\n<h3>C. La définition à retenir</h3>\n<p>La mondialisation — ou globalisation — désigne :</p>\n<div class=\"alertb\"><p>👉 un processus qui conduit à l’interdépendance croissante des économies en raison de la multiplication des flux économiques et financiers, faisant progressivement de l’économie mondiale un espace de plus en plus intégré.</p></div>\n<p>Mais chaque mot de cette définition est important, en particulier le terme « processus ».</p>\n<h3>D. Pourquoi parler de « processus » ?</h3>\n<p>Un processus désigne :</p>\n<p>👉 une dynamique qui se déroule dans le temps.</p>\n<p>La mondialisation n’est donc pas un état définitif.</p>\n<p>Elle peut :</p>\n<ul><li>progresser ;</li><li>ralentir ;</li><li>changer de forme ;</li><li>voire connaître des phases de recul.</li></ul>\n<p>C’est pourquoi on peut se demander aujourd’hui :</p>\n<p>👉 assistons-nous toujours à davantage de mondialisation ?</p>\n<p>ou</p>\n<p>👉 sommes-nous entrés dans une phase de démondialisation ou de fragmentation ?</p>\n<h4>Idée</h4>\n<p>Parler de mondialisation comme d’un processus permet d’insister sur son caractère historique et réversible : l’ouverture internationale connaît des accélérations, des ralentissements et parfois des phases de repli.</p>\n<p>La mondialisation implique également une intégration croissante, notion qu’il faut manier précisément dans une copie.</p>\n<h3>E. Interdépendance et intégration ne signifient pas exactement la même chose</h3>\n<h4>Interdépendance</h4>\n<p>Les économies dépendent davantage les unes des autres.</p>\n<h4>Intégration</h4>\n<p>Les différents espaces nationaux deviennent progressivement les composantes d’un marché mondial plus unifié.</p>\n<p>Autrement dit :</p>\n<ul><li>multiplication des flux → interdépendance → intégration croissante de l’économie mondiale.</li></ul>\n<h4>Attention en dissertation</h4>\n<p>Si le sujet ne porte que sur :</p>\n<ul><li>les flux ;</li><li>les échanges ;</li><li>l’ouverture ;</li><li>il n’est pas toujours nécessaire de mobiliser toute la définition jusqu’à l’idée d’intégration.</li></ul>\n<p>La mondialisation étant multidimensionnelle, il faut maintenant distinguer les différentes formes qu’elle prend et comprendre comment leur importance relative a évolué historiquement.</p>\n<h3>F. Charles-Albert Michalet : la mondialisation est un processus multidimensionnel</h3>\n<h3>G. L’apport de Michalet</h3>\n<h4>Michalet, Qu’est-ce que la mondialisation ? ,2002</h4>\n<p>Michalet montre que la mondialisation ne peut pas être réduite au commerce international.</p>\n<p>Elle comporte plusieurs dimensions :</p>\n<ul><li>échanges de biens et services ;</li><li>investissements directs étrangers ;</li><li>circulation des capitaux financiers.</li></ul>\n<h4>Idée centrale</h4>\n<p>L’originalité de Michalet est de montrer que :</p>\n<p>👉 la hiérarchie de ces dimensions évolue dans le temps.</p>\n<p>Une dimension particulière domine chaque grande période de mondialisation.</p>\n<p>Mais les dimensions précédentes ne disparaissent pas nécessairement.</p>\n<p>Il y a donc :</p>\n<p>👉 accumulation des formes de mondialisation.</p>\n<p>Cl</p>\n<p>Pour Charles-Albert Michalet, la mondialisation est un processus multidimensionnel dont les composantes commerciale, productive et financière se développent successivement tout en se cumulant.</p>\n<p>Cette évolution permet à Michalet de distinguer trois grandes configurations historiques.</p>\n<h3>H. Première configuration : la dimension internationale</h3>\n<h4>1-Une mondialisation dominée par le commerce</h4>\n<p>La première configuration repose principalement sur :</p>\n<p>👉 l’ouverture des économies nationales aux échanges de biens et services.</p>\n<p>C’est donc la dimension :</p>\n<p>👉 commerciale.</p>\n<p>Le commerce international correspond à l’ensemble des opérations d’achat et de vente de biens et de services entre résidents et non-résidents.</p>\n<h4>Acteur central</h4>\n<p>👉 les États jouent un rôle fondamental.</p>\n<p>Ce sont eux qui déterminent largement :</p>\n<ul><li>les conditions d’ouverture ;</li><li>les droits de douane ;</li><li>les accords commerciaux ;</li><li>les relations internationales.</li></ul>\n<p>Cette dimension domine particulièrement la première grande vague historique de mondialisation.</p>\n<h4>2-La première mondialisation : 1870-1913</h4>\n<p>La période 1870-1913 est traditionnellement qualifiée de :</p>\n<p>👉 première mondialisation.</p>\n<p>Elle repose principalement sur :</p>\n<ul><li>essor du commerce ;</li><li>baisse des coûts de transport ;</li><li>développement des échanges internationaux ;</li><li>spécialisation internationale.</li></ul>\n<p>La dimension dominante est donc :</p>\n<p>👉 commerciale.</p>\n<h4>Ordre de grandeur</h4>\n<p>On retient un taux d’ouverture moyen atteignant environ :</p>\n<p>👉 14 à 15 % à son sommet.</p>\n<h4>Idée</h4>\n<p>La première mondialisation, entre 1870 et 1913, correspond principalement à une internationalisation commerciale dans laquelle l’essor des échanges de biens et services constitue le moteur essentiel de l’ouverture.</p>\n<p>Cette première mondialisation connaît ensuite une rupture profonde avant qu’une nouvelle vague d’ouverture n’apparaisse après la Seconde Guerre mondiale.</p>\n<h3>I. Deuxième configuration : la dimension multinationale</h3>\n<h4>1-Le développement des IDE et des firmes multinationales</h4>\n<p>Après 1945, la mondialisation change de nature.</p>\n<p>Les entreprises ne se contentent plus de vendre à l’étranger.</p>\n<p>Elles vont également :</p>\n<p>👉 produire à l’étranger.</p>\n<p>Cela passe par :</p>\n<ul><li>les IDE ;</li><li>l’implantation de filiales ;</li><li>les firmes multinationales.</li></ul>\n<h4>Acteur central</h4>\n<p>👉 Les firmes multinationales (FMN).</p>\n<p>La mobilité internationale des facteurs de production augmente.</p>\n<h4>Idée</h4>\n<p>Après la Seconde Guerre mondiale, la mondialisation devient davantage productive : l’essor des IDE permet aux firmes multinationales d’organiser directement une partie croissante de leur production à l’échelle internationale.</p>\n<p>Cette nouvelle organisation de la production prépare une transformation encore plus profonde lorsque les entreprises commencent à fragmenter leurs chaînes de valeur entre plusieurs territoires.</p>\n<h4>2-La fragmentation internationale de la production</h4>\n<p>Les entreprises peuvent répartir différentes étapes de production entre plusieurs pays.</p>\n<p>Par exemple :</p>\n<ul><li>conception dans un pays → composants produits ailleurs → assemblage dans un autre pays → commercialisation mondiale.</li></ul>\n<p>On parle de :</p>\n<p>👉 fragmentation internationale des processus productifs.</p>\n<p>La production elle-même devient mondiale.</p>\n<p>À partir des années 1980-1990, une troisième dimension prend cependant une importance considérable : la circulation des capitaux financiers.</p>\n<h3>J. Troisième configuration : la dimension globale</h3>\n<h4>1-La prédominance croissante de la finance</h4>\n<p>À partir des années 1980-1990 :</p>\n<ul><li>les mouvements internationaux de capitaux explosent ;</li><li>les marchés financiers deviennent plus intégrés ;</li><li>les investisseurs institutionnels prennent une place croissante.</li></ul>\n<p>La mondialisation prend donc une dimension :</p>\n<p>👉 financière.</p>\n<h4>Globalisation financière</h4>\n<p>Elle repose sur :</p>\n<ul><li>libéralisation des mouvements de capitaux ;</li><li>déréglementation financière ;</li><li>internationalisation des placements ;</li><li>intégration des marchés financiers.</li></ul>\n<h4>Acteurs centraux</h4>\n<ul><li>banques ;</li><li>investisseurs institutionnels ;</li><li>fonds ;</li><li>marchés financiers ;</li><li>FMN.</li></ul>\n<h4>Idée</h4>\n<p>À partir des années 1980, l’ouverture croissante des marchés de capitaux donne naissance à une configuration globale de la mondialisation caractérisée par la prédominance de la finance internationale.</p>\n<p>Cependant, domination de la finance ne signifie pas disparition des échanges commerciaux ou productifs.</p>\n<h4>2 -Une logique cumulative</h4>\n<p>Dans la troisième vague :</p>\n<ul><li>le commerce continue ;</li><li>les IDE continuent ;</li><li>les capitaux financiers explosent.</li></ul>\n<p>Donc :</p>\n<ul><li>commercial + productif + financier → hypermondialisation.</li></ul>\n<h4>Idée fondamentale</h4>\n<p>Les trois configurations de Michalet sont :</p>\n<p>👉 cumulatives.</p>\n<p>Cl</p>\n<p>L’hypermondialisation ne remplace pas les formes antérieures d’internationalisation : elle correspond au cumul d’échanges commerciaux, de fragmentation productive et de circulation massive des capitaux.</p>\n<p>Cette accumulation explique pourquoi l’ouverture atteint à partir des années 1990-2000 des niveaux historiquement inédits.</p>\n<h3>K. De la mondialisation à l’hypermondialisation</h3>\n<h3>L. Une ouverture quantitativement sans précédent</h3>\n<p>Lors de la première mondialisation :</p>\n<p>👉 taux d’ouverture maximal ≈ 15 %.</p>\n<p>Au sommet de l’hypermondialisation :</p>\n<p>👉 taux d’ouverture ≈ 30 %.</p>\n<p>Autrement dit :</p>\n<ul><li>le poids des échanges dans l’économie mondiale est environ deux fois plus élevé.</li></ul>\n<h4>Idée essentielle</h4>\n<p>La troisième vague est la première à rendre la mondialisation véritablement :</p>\n<p>👉 mondiale.</p>\n<p>De nombreux pays auparavant relativement fermés participent désormais intensément aux échanges internationaux.</p>\n<h4>Idée</h4>\n<p>L’hypermondialisation se distingue des vagues précédentes par un degré d’ouverture sans précédent, marqué par le cumul des flux commerciaux, productifs et financiers et par l’intégration d’un nombre croissant de pays.</p>\n<p>Mais cette dynamique semble depuis plusieurs années perdre de sa vigueur.</p>\n<h3>M. Le ralentissement contemporain de la mondialisation</h3>\n<p>Le taux d’ouverture :</p>\n<ul><li>cesse de progresser fortement ;</li><li>stagne ;</li><li>peut même diminuer légèrement selon les périodes.</li></ul>\n<p>D’où une nouvelle interrogation :</p>\n<p>👉 sommes-nous entrés dans une démondialisation ?</p>\n<p>Ou plutôt :</p>\n<p>👉 dans une mondialisation différente, davantage fragmentée et régionalisée ?</p>\n<p>L’augmentation des flux et de l’interdépendance ne signifie cependant pas que tous les pays bénéficient également de la mondialisation. L’ouverture pose immédiatement une question de répartition.</p>\n<h3>N. Premier enjeu de la mondialisation : comment se répartissent les gains ?</h3>\n<h3>O. La spécialisation crée des gains mais aussi des différences</h3>\n<h4>Smith et Ricardo</h4>\n<p>Les premières théories du commerce international montrent que les pays ont intérêt à :</p>\n<p>👉 se spécialiser.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que la spécialisation permet :</p>\n<ul><li>gains de productivité ;</li><li>efficacité accrue ;</li><li>baisse des coûts ;</li><li>augmentation de la production.</li><li>Mais toutes les spécialisations ne se valent pas.</li></ul>\n<p>Une activité à :</p>\n<ul><li>forte technologie ;</li><li>forte valeur ajoutée ;</li><li>forte productivité ;</li><li>ne produit pas les mêmes revenus qu’une activité :</li><li>peu qualifiée ;</li><li>facilement reproductible ;</li><li>à faible valeur ajoutée.</li></ul>\n<h4>Idée centrale</h4>\n<p>Il faut donc distinguer :</p>\n<p>👉 gain global à l’échange</p>\n<p>et</p>\n<p>👉 répartition de ce gain.</p>\n<h4>Idée</h4>\n<p>Le commerce international peut accroître la richesse globale sans garantir une répartition équitable des gains, puisque les spécialisations internationales n’offrent ni la même valeur ajoutée ni le même pouvoir de marché.</p>\n<p>Cette question de répartition interdit donc de présenter la mondialisation comme un processus naturellement harmonieux.</p>\n<h3>P. La mondialisation a toujours été traversée de tensions</h3>\n<p>Une erreur serait de considérer que la mondialisation :</p>\n<ul><li>bénéficie automatiquement à tous ;</li><li>rapproche nécessairement les intérêts des États ;</li><li>produit naturellement une prospérité partagée.</li></ul>\n<p>Historiquement :</p>\n<p>👉 les périodes d’ouverture sont aussi traversées par des rapports de force.</p>\n<p>Les tensions portent notamment sur :</p>\n<ul><li>leadership économique ;</li><li>accès aux marchés ;</li><li>technologie ;</li><li>monnaies ;</li><li>capitaux ;</li><li>spécialisation.</li></ul>\n<h4>Idée</h4>\n<p>La mondialisation ne supprime pas les rapports de puissance : en mettant les territoires et les acteurs en concurrence, elle peut au contraire intensifier les tensions économiques et géopolitiques.</p>\n<p>Pierre-Noël Giraud permet précisément de comprendre cette dimension concurrentielle.</p>\n<h3>Q. Pierre-Noël Giraud : les globalisations comme généralisation des compétitions</h3>\n<h3>R. Une mondialisation qui met les territoires en concurrence</h3>\n<h4>Pierre-Noël Giraud</h4>\n<p>Dans ses analyses des globalisations, il insiste sur une :</p>\n<p>👉 généralisation des compétitions.</p>\n<p>Cette compétition concerne d’abord les territoires.</p>\n<p>Les firmes globales peuvent choisir :</p>\n<ul><li>où produire ;</li><li>où investir ;</li><li>où déclarer certaines activités ;</li><li>où installer leurs sièges ou filiales.</li></ul>\n<p>Les États cherchent donc à attirer :</p>\n<ul><li>IDE ;</li><li>entreprises ;</li><li>emplois ;</li><li>capitaux.</li></ul>\n<h4>Mécanisme</h4>\n<p>mobilité des firmes → mise en concurrence des territoires → politiques d’attractivité.</p>\n<h4>Idée</h4>\n<p>La mondialisation renforce la concurrence entre territoires puisque la mobilité des firmes leur permet d’arbitrer entre différentes localisations et contraint les États à développer des politiques d’attractivité.</p>\n<p>Cette concurrence concerne également les capitaux financiers.</p>\n<h3>S. La compétition pour attirer les capitaux</h3>\n<p>Les capitaux internationaux recherchent :</p>\n<p>👉 le meilleur couple rendement / risque.</p>\n<p>Un pays souhaitant attirer des capitaux peut être poussé à proposer :</p>\n<ul><li>des rendements élevés ;</li><li>une fiscalité attractive ;</li><li>un environnement financier favorable.</li></ul>\n<h4>Problème</h4>\n<p>Des taux d’intérêt élevés :</p>\n<p>👉 attirent potentiellement les capitaux ;</p>\n<p>mais :</p>\n<p>👉 rendent aussi l’investissement domestique plus coûteux.</p>\n<p>Il existe donc un arbitrage.</p>\n<h4>Mécanisme</h4>\n<p>taux d’intérêt ↑ → capitaux étrangers attirés</p>\n<p>mais aussi :</p>\n<ul><li>taux d’intérêt ↑ → coût du crédit ↑ → investissement ↓.</li></ul>\n<p>Les États-Unis occupent toutefois une position particulière puisqu’ils peuvent attirer massivement les capitaux sans offrir nécessairement les rendements les plus élevés.</p>\n<h3>T. Le « privilège exorbitant » américain</h3>\n<p>Le dollar occupe une place centrale dans le système monétaire international.</p>\n<p>Les actifs américains, notamment les titres publics, sont particulièrement recherchés.</p>\n<p>Les États-Unis peuvent donc :</p>\n<ul><li>attirer beaucoup de capitaux ;</li><li>emprunter dans leur propre monnaie ;</li><li>bénéficier d’une forte demande internationale pour leurs actifs.</li></ul>\n<p>C’est ce que l’on qualifie traditionnellement de :</p>\n<p>👉 « privilège exorbitant » du dollar.</p>\n<h4>Idée</h4>\n<p>Le statut international du dollar confère aux États-Unis un privilège exorbitant en leur permettant d’attirer durablement les capitaux étrangers et de financer leurs déséquilibres dans des conditions particulièrement favorables.</p>\n<p>Ces compétitions ne sont pas figées : la puissance relative des différents pays évolue avec les vagues de mondialisation.</p>\n<h3>U. La mondialisation déplace progressivement le centre de gravité de l’économie mondiale</h3>\n<h3>V. Première mondialisation : la domination européenne</h3>\n<p>Entre 1870 et 1913 :</p>\n<p>👉 le centre de gravité de l’économie mondiale se situe en Europe occidentale.</p>\n<p>Le pays dominant est notamment :</p>\n<p>👉 le Royaume-Uni.</p>\n<p>Il bénéficie :</p>\n<ul><li>de son avance industrielle ;</li><li>de son empire ;</li><li>de sa puissance commerciale ;</li><li>de sa puissance financière.</li></ul>\n<h4>Idée</h4>\n<p>La première mondialisation est largement structurée autour de l’Europe occidentale et du Royaume-Uni, qui combine alors domination industrielle, commerciale, financière et impériale.</p>\n<p>Après deux guerres mondiales, cette domination européenne s’efface au profit des États-Unis.</p>\n<h3>W. Après 1945 : leadership américain</h3>\n<p>Dans la deuxième vague de mondialisation :</p>\n<p>👉 les États-Unis deviennent la puissance dominante.</p>\n<p>Ils bénéficient notamment :</p>\n<ul><li>d’un poids économique considérable ;</li><li>d’une avance technologique ;</li><li>du rôle du dollar ;</li><li>de leurs FMN ;</li><li>de leur puissance financière.</li></ul>\n<p>Pendant plusieurs décennies :</p>\n<p>👉 le leadership américain est très peu contesté.</p>\n<p>La troisième vague de mondialisation modifie cependant cette hiérarchie avec l’émergence spectaculaire de l’Asie.</p>\n<h3>X. Hypermondialisation : déplacement vers l’Asie émergente</h3>\n<p>À partir des dernières décennies du XXe siècle :</p>\n<p>👉 le centre de gravité économique se déplace progressivement vers l’Asie.</p>\n<p>Au premier rang :</p>\n<p>👉 la Chine.</p>\n<p>La Chine connaît :</p>\n<ul><li>industrialisation rapide ;</li><li>croissance très forte ;</li><li>montée en gamme ;</li><li>progression de ses exportations ;</li><li>développement technologique.</li></ul>\n<p>Elle devient progressivement capable de contester les États-Unis.</p>\n<h4>Idée</h4>\n<p>L’hypermondialisation accompagne un déplacement du centre de gravité économique mondial vers l’Asie émergente, dont la Chine constitue le principal moteur.</p>\n<p>Cette évolution prend une dimension particulièrement visible avec l’affirmation des BRICS.</p>\n<h3>Y. L’entrée sur la scène internationale des BRICS</h3>\n<h3>Z. Le retour du poids économique des grands émergents</h3>\n<p>Les données historiques de Maddison permettent d’apporter une perspective de long terme.</p>\n<h4>En 1700</h4>\n<p>Les futurs BRIC représentent déjà environ :</p>\n<p>👉 51 % du PIB mondial dans le tableau du cours.</p>\n<h4>En 1820</h4>\n<p>Ils représentent encore environ :</p>\n<p>👉 55 % du PIB mondial.</p>\n<p>Puis l’industrialisation occidentale transforme totalement la hiérarchie.</p>\n<h4>En 1950</h4>\n<p>Leur poids chute fortement.</p>\n<p>Dans le même temps :</p>\n<ul><li>Europe occidentale ↑ ;</li><li>États-Unis ↑ fortement.</li></ul>\n<h4>Idée clé</h4>\n<p>Du point de vue chinois, l’émergence actuelle peut donc être interprétée comme :</p>\n<div class=\"alertb\"><p>👉 un retour vers une puissance économique historiquement ancienne, et non seulement comme une émergence totalement nouvelle.</p></div>\n<p>La montée des BRICS peut être interprétée comme un rééquilibrage historique de l’économie mondiale après deux siècles de domination occidentale issus de la révolution industrielle.</p>\n<p>Cette remontée devient spectaculaire à partir de la fin du XXe siècle.</p>\n<h3>AA. La Chine : d’un acteur secondaire à un géant économique</h3>\n<p>La part de la Chine dans le PIB mondial en PPA augmente considérablement.</p>\n<p>La Chine passe :</p>\n<p>👉 d’un poids relativement faible</p>\n<p>à</p>\n<p>👉 l’un des principaux pôles de l’économie mondiale.</p>\n<p>Dans le même temps :</p>\n<ul><li>la part relative du G7 diminue ;</li><li>celle des BRICS augmente.</li></ul>\n<p>👉 36 % du PIB mondial en PPA pour les BRICS+ en 2022 ;</p>\n<p>👉 25 % des exportations mondiales en 2021.</p>\n<h4>Idée</h4>\n<p>L’essor chinois et plus largement celui des BRICS traduit une redistribution progressive du poids économique mondial au détriment relatif des puissances traditionnelles du G7.</p>\n<p>Cette redistribution de la puissance économique nourrit logiquement une compétition pour le leadership mondial.</p>\n<h3>AB. Chine / États-Unis : une nouvelle bataille pour le leadership</h3>\n<h3>AC. Une rivalité économique et technologique</h3>\n<p>La Chine ne concurrence plus les États-Unis uniquement sur :</p>\n<ul><li>des produits peu sophistiqués ;</li><li>des activités à faible coût.</li></ul>\n<p>Elle cherche également à atteindre :</p>\n<p>👉 la frontière technologique.</p>\n<p>La rivalité porte donc sur :</p>\n<ul><li>numérique ;</li><li>IA ;</li><li>semi-conducteurs ;</li><li>technologies vertes ;</li><li>industries stratégiques.</li></ul>\n<h4>Idée fondamentale</h4>\n<p>Le conflit n’est plus simplement :</p>\n<p>👉 pays développé contre pays atelier.</p>\n<p>Il devient :</p>\n<p>👉 puissance technologique contre puissance technologique.</p>\n<p>Cl</p>\n<p>La montée en gamme chinoise transforme la concurrence sino-américaine en une rivalité pour la frontière technologique et, au-delà, pour le leadership économique mondial.</p>\n<p>Face à cette contestation, les États-Unis utilisent de plus en plus directement leurs instruments économiques comme instruments de puissance.</p>\n<h3>AD. L’arsenalisation de la politique économique</h3>\n<p>On peut parler d’ :</p>\n<p>👉 arsenalisation de la politique économique</p>\n<p>lorsque des instruments économiques sont utilisés comme des armes de puissance.</p>\n<p>Exemples :</p>\n<ul><li>droits de douane ;</li><li>sanctions ;</li><li>restrictions technologiques ;</li><li>contrôle des exportations ;</li><li>restrictions aux investissements.</li></ul>\n<p>Objectif notamment :</p>\n<p>👉 ralentir la montée en gamme du rival.</p>\n<h4>Idée</h4>\n<p>L’arsenalisation de la politique économique traduit le retour de la puissance dans les relations commerciales : tarifs douaniers, sanctions et restrictions technologiques deviennent des instruments de rivalité stratégique.</p>\n<p>Cette compétition concerne également la monnaie, même si la domination américaine y reste particulièrement forte.</p>\n<h3>AE. Une contestation encore limitée de la puissance monétaire et financière américaine</h3>\n<p>La Chine cherche également à renforcer :</p>\n<p>👉 le rôle international du yuan.</p>\n<p>Mais le dollar conserve aujourd’hui une place dominante :</p>\n<ul><li>monnaie internationale ;</li><li>monnaie de réserve ;</li><li>monnaie de transaction ;</li><li>monnaie de financement.</li></ul>\n<p>La puissance financière américaine est donc :</p>\n<p>👉 moins contestée que sa domination industrielle ou commerciale.</p>\n<h4>Idée</h4>\n<p>Si le leadership industriel et technologique américain est de plus en plus contesté, la domination monétaire et financière des États-Unis demeure beaucoup plus difficile à remettre en cause en raison du rôle central du dollar.</p>\n<p>Le déplacement de la puissance vers l’Asie se fait parallèlement au recul relatif de l’Europe.</p>\n<h3>AF. Le décrochage relatif de l’Europe dans l’économie mondiale</h3>\n<h3>AG. Une diminution du poids dans le PIB mondial</h3>\n<p>Dans les années 1990 :</p>\n<ul><li>plusieurs grandes économies européennes figurent parmi les toutes premières puissances mondiales.</li></ul>\n<p>Depuis :</p>\n<p>👉 leur poids relatif a diminué.</p>\n<p>Les principaux pays européens représentent aujourd’hui une part beaucoup plus faible du PIB mondial qu’il y a quelques décennies.</p>\n<h4>Attention</h4>\n<p>Il s’agit d’un :</p>\n<p>👉 déclin relatif, et non nécessairement d’un appauvrissement absolu.</p>\n<p>Les économies européennes peuvent continuer à croître tout en :</p>\n<p>👉 croissant moins vite que les émergents.</p>\n<h4>Idée</h4>\n<p>Le décrochage européen est avant tout relatif : l’Europe ne s’appauvrit pas nécessairement en valeur absolue, mais son poids dans l’économie mondiale diminue sous l’effet de la croissance beaucoup plus rapide des économies asiatiques.</p>\n<p>Ce phénomène apparaît également dans les parts de marché internationales.</p>\n<h3>AH. Une diminution des parts de marché européennes</h3>\n<p>L’Europe perd progressivement des parts dans :</p>\n<p>👉 le commerce mondial.</p>\n<p>Dans le même temps :</p>\n<p>👉 l’Asie en gagne fortement.</p>\n<p>Les États-Unis connaissent également une baisse relative sur certains indicateurs, mais le recul européen est particulièrement marqué.</p>\n<h4>Idée essentielle</h4>\n<p>La mondialisation transforme donc la hiérarchie des puissances.</p>\n<p>Elle favorise :</p>\n<ul><li>certains rattrapages ;</li><li>certaines émergences ;</li></ul>\n<p>mais provoque aussi :</p>\n<ul><li>des déclassements relatifs.</li></ul>\n<p>Cependant, l’émergence asiatique ne signifie pas que tous les pays en développement convergent vers les économies avancées.</p>\n<p>La mondialisation favorise une convergence entre certains pays mais une divergence entre les pays en développement</p>\n<h3>AI. Le rattrapage spectaculaire de certains émergents</h3>\n<p>Plusieurs pays connaissent une croissance très rapide :</p>\n<ul><li>Chine ;</li><li>Inde ;</li><li>Vietnam ;</li><li>plus largement une partie importante de l’Asie.</li></ul>\n<p>Ils se rapprochent progressivement des niveaux de développement des économies avancées.</p>\n<p>On parle de :</p>\n<p>👉 convergence.</p>\n<h4>Mécanisme</h4>\n<p>insertion internationale réussie → industrialisation → productivité ↑ → croissance ↑ → niveau de vie ↑ → rattrapage.</p>\n<h4>Idée</h4>\n<p>L’intégration réussie de plusieurs économies asiatiques dans la mondialisation a favorisé un processus de convergence en leur permettant de rattraper progressivement une partie de leur retard sur les économies avancées.</p>\n<p>Mais tous les pays en développement n’ont pas connu cette trajectoire.</p>\n<h3>AJ. Une divergence croissante entre pays en développement</h3>\n<p>Certains pays :</p>\n<p>👉 montent rapidement en gamme.</p>\n<p>D’autres :</p>\n<div class=\"alertb\"><p>👉 restent spécialisés dans des activités à faible productivité ou dans les matières premières.</p></div>\n<p>Par conséquent :</p>\n<ul><li>les écarts peuvent se réduire entre certains émergents et les pays riches</li><li>tout en :</li></ul>\n<p>👉 augmentant entre pays en développement eux-mêmes.</p>\n<h4>Exemple</h4>\n<p>On oppose notamment :</p>\n<ul><li>forte progression asiatique ;</li><li>recul relatif de certaines économies africaines dans les échanges mondiaux.</li></ul>\n<h4>Idée</h4>\n<p>L’hypermondialisation a réduit certains écarts Nord-Sud mais elle a simultanément accru l’hétérogénéité du monde en développement, opposant des émergents engagés dans un rattrapage rapide à des économies demeurées en marge des dynamiques productives mondiales.</p>\n<p>Cette divergence conduit directement à s’interroger sur les raisons pour lesquelles certaines spécialisations internationales favorisent le développement alors que d’autres enferment les économies dans des trajectoires peu favorables.</p>\n<h3>AK. Première ouverture vers la suite : la malédiction des ressources</h3>\n<p>La mondialisation ne suffit donc pas à garantir le développement.</p>\n<p>Certains pays restent dépendants :</p>\n<ul><li>des matières premières ;</li><li>de produits agricoles ;</li><li>de ressources énergétiques.</li></ul>\n<p>Cette spécialisation peut produire :</p>\n<ul><li>volatilité des revenus ;</li><li>faible diversification ;</li><li>dépendance extérieure ;</li><li>difficultés d’industrialisation.</li></ul>\n<p>On parle :</p>\n<p>👉 la malédiction des ressources.</p>\n<h4>Idée</h4>\n<p>Ainsi, si l’ouverture internationale a permis le rattrapage spectaculaire de certains émergents, elle n’a pas bénéficié uniformément aux pays en développement : la spécialisation dans les ressources naturelles peut au contraire constituer un obstacle durable à la diversification et au développement.</p>\n<h3>AL. Conclusion</h3>\n<p>La mondialisation est un processus dynamique, multidimensionnel et cumulatif d’intensification des flux internationaux.</p>\n<p>Avec Charles-Albert Michalet, on distingue trois configurations successives :</p>\n<ul><li>commerce → production → finance.</li></ul>\n<p>Cette évolution conduit à l’hypermondialisation, caractérisée par un niveau d’ouverture historiquement inédit.</p>\n<p>Mais cette intégration ne produit pas une prospérité uniformément répartie.</p>\n<p>Elle transforme profondément la hiérarchie internationale :</p>\n<ul><li>recul relatif de l’Europe ;</li><li>maintien de la puissance américaine ;</li><li>émergence de l’Asie ;</li><li>montée spectaculaire de la Chine et des BRICS.</li></ul>\n<p>Elle produit donc simultanément :</p>\n<p>👉 intégration</p>\n<p>et</p>\n<p>👉 compétition.</p>\n<p>Cl</p>\n<p>La mondialisation ne saurait être réduite à une simple intensification du commerce : processus multidimensionnel et cumulatif, elle transforme simultanément l’organisation de la production, la circulation des capitaux et la hiérarchie des puissances, faisant de l’intégration croissante de l’économie mondiale une source à la fois de convergence et de nouvelles rivalités.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>III. Une mondialisation asymétrique : rapports de force, gagnants / perdants et inégalités</h2>\n<p>Pourquoi la mondialisation est-elle source de tensions et d’inégalités ?</p>\n<h3>A. Idée générale</h3>\n<p>La mondialisation rapproche les économies, mais elle ne les place pas toutes dans une situation équivalente.</p>\n<p>Elle est profondément :</p>\n<p>👉 asymétrique.</p>\n<p>Cela signifie qu’il existe des déséquilibres entre :</p>\n<ul><li>pays ;</li><li>entreprises ;</li><li>travailleurs ;</li><li>consommateurs ;</li><li>épargnants.</li></ul>\n<p>Certains acteurs disposent de davantage :</p>\n<ul><li>de pouvoir ;</li><li>de capital ;</li><li>de technologie ;</li><li>d’information ;</li><li>de capacité de négociation.</li></ul>\n<p>Ils peuvent donc tirer davantage profit de l’ouverture internationale que d’autres.</p>\n<h4>Idée centrale</h4>\n<p>La mondialisation produit donc simultanément :</p>\n<ul><li>des gains ;</li><li>des dépendances ;</li><li>des rapports de force ;</li><li>des gagnants ;</li><li>des perdants.</li></ul>\n<p>Elle ne peut donc pas être considérée comme un processus automatiquement harmonieux.</p>\n<p>Cl</p>\n<p>La mondialisation est un processus asymétrique : l’intégration croissante des économies ne supprime pas les rapports de force mais peut au contraire les renforcer, en répartissant inégalement les gains issus de l’ouverture internationale.</p>\n<p>Cette asymétrie apparaît dès la première mondialisation, au cours de laquelle les puissances coloniales imposent largement la spécialisation des territoires dominés.</p>\n<h3>B. La première mondialisation est profondément asymétrique</h3>\n<p>Une asymétrie désigne une situation de déséquilibre entre plusieurs acteurs.</p>\n<p>L’exemple classique est :</p>\n<p>👉 l’asymétrie d’information.</p>\n<p>Un acteur possède davantage d’informations qu’un autre et peut en tirer un avantage.</p>\n<p>Mais ici, l’idée est plus générale.</p>\n<p>Une asymétrie peut concerner :</p>\n<ul><li>pouvoir économique ;</li><li>technologie ;</li><li>capacité militaire ;</li><li>accès au financement ;</li><li>spécialisation productive ;</li><li>pouvoir de négociation.</li></ul>\n<h4>Mécanisme</h4>\n<p>déséquilibre entre acteurs → pouvoir différent → gains différents → rapport de domination possible.</p>\n<h4>Idée</h4>\n<p>Une asymétrie économique correspond à un déséquilibre entre acteurs qui permet à certains d’exercer un pouvoir ou d’obtenir des gains supérieurs au détriment des autres.</p>\n<p>Lors de la première mondialisation, cette asymétrie prend une forme particulièrement forte avec la colonisation.</p>\n<h3>C. Centre / périphérie : une spécialisation imposée</h3>\n<h3>D. Prebisch : la logique centre / périphérie</h3>\n<p>Prebisch distingue :</p>\n<p>👉 le centre</p>\n<p>et</p>\n<p>👉 la périphérie.</p>\n<p>Le centre correspond aux économies industrialisées.</p>\n<p>La périphérie correspond aux économies spécialisées dans :</p>\n<ul><li>matières premières ;</li><li>produits agricoles ;</li><li>activités à faible valeur ajoutée.</li></ul>\n<p>Pendant la colonisation, les puissances européennes imposent largement aux territoires colonisés une spécialisation répondant à leurs propres besoins.</p>\n<h4>Exemple</h4>\n<p>Les colonies exportent :</p>\n<ul><li>coton ;</li><li>minerais ;</li><li>produits agricoles ;</li><li>ressources naturelles.</li></ul>\n<p>Les puissances coloniales transforment ces matières premières en :</p>\n<p>👉 produits manufacturés.</p>\n<p>Puis elles revendent une partie de ces produits aux territoires périphériques.</p>\n<h4>Idée</h4>\n<p>La première mondialisation organise une division hiérarchisée entre un centre industrialisé et une périphérie spécialisée dans l’approvisionnement en matières premières, ce qui crée une relation structurellement asymétrique.</p>\n<p>Cette spécialisation internationale correspond à ce qu’on appelle traditionnellement la division internationale du travail.</p>\n<h3>E. La DIT traditionnelle</h3>\n<p>Attention :</p>\n<p>👉 ici, il faut parler de DIT traditionnelleet non de DIPP.</p>\n<p>La division internationale du travail désigne la répartition des productions entre les pays.</p>\n<p>Dans sa forme traditionnelle :</p>\n<ul><li>Pays du centre</li></ul>\n<p>→ produits manufacturés.</p>\n<h4>Pays périphériques</h4>\n<p>→ matières premières et produits primaires.</p>\n<h4>Schéma</h4>\n<p>Périphérie → matières premières → Centre</p>\n<p>Centre → transformation industrielle → produits manufacturés → exportations vers la périphérie.</p>\n<h4>Idée</h4>\n<p>La DIT traditionnelle repose sur une spécialisation verticale de l’économie mondiale : les pays périphériques fournissent les matières premières tandis que les pays du centre concentrent les activités industrielles à plus forte valeur ajoutée.</p>\n<p>Cette division du travail ne relève pas uniquement du marché : elle repose aussi sur des institutions construites pour servir les intérêts des puissances dominantes.</p>\n<h3>F. Acemoglu et Robinson : les institutions extractives</h3>\n<p>Ils distinguent notamment :</p>\n<ul><li>institutions inclusives ;</li><li>institutions extractives.</li></ul>\n<h4>Institutions extractives</h4>\n<p>Elles sont conçues pour extraire les ressources d’une partie de la population ou du territoire au bénéfice d’une minorité.</p>\n<p>Dans le contexte colonial :</p>\n<ul><li>terres ;</li><li>mines ;</li><li>main-d’œuvre ;</li><li>ressources naturelles ;</li><li>sont organisées au profit des puissances coloniales.</li></ul>\n<h4>Conséquence</h4>\n<p>Ces institutions ne favorisent pas :</p>\n<ul><li>investissement local ;</li><li>innovation ;</li><li>industrialisation autonome ;</li><li>développement inclusif.</li></ul>\n<h4>Idée</h4>\n<p>Acemoglu et Robinson montrent que la colonisation a souvent installé des institutions extractives destinées à capter les ressources locales au profit des puissances dominantes, freinant ainsi la formation d’un développement autonome.</p>\n<p>Après les indépendances, les économistes du développement cherchent précisément à comprendre pourquoi ces anciennes colonies restent beaucoup plus pauvres que les anciennes puissances coloniales.</p>\n<h3>G. Les théories de l’échange inégal dénoncent les asymétries héritées de la mondialisation</h3>\n<h3>H. L’apparition de l’économie du développement</h3>\n<p>Après la Seconde Guerre mondiale :</p>\n<ul><li>décolonisation ;</li><li>indépendances ;</li><li>maintien d’importants écarts de niveau de vie.</li></ul>\n<p>Une nouvelle branche de l’économie se développe :</p>\n<p>👉 l’économie du développement.</p>\n<p>Elle cherche notamment à comprendre pourquoi certains pays restent :</p>\n<ul><li>peu industrialisés ;</li><li>dépendants ;</li><li>spécialisés dans les produits primaires.</li></ul>\n<p>Plusieurs auteurs considèrent alors que la structure même des échanges internationaux contribue au maintien de ces écarts.</p>\n<p>Prebisch montre que la spécialisation primaire peut enfermer les pays périphériques dans une détérioration des termes de l’échange, les obligeant à exporter toujours davantage pour financer leurs importations de produits manufacturés.</p>\n<p>Cette analyse nourrit ensuite des approches plus radicales qui considèrent que le commerce mondial repose sur de véritables rapports de domination. Comme le montre d’Aghiri avec la théorie de l’échange inégal</p>\n<p>Les théories de l’échange inégal montrent que le commerce international peut reproduire les rapports de domination lorsque les pays échangent des productions incorporant des niveaux de rémunération et de valeur ajoutée très différents.</p>\n<p>Le diagnostic d’une spécialisation défavorable peut être pertinent, mais les solutions proposées pour s’extraire du commerce mondial ont souvent rencontré de lourdes difficultés.</p>\n<h3>I. Un bon diagnostic ne signifie pas nécessairement une bonne stratégie de développement</h3>\n<h3>J. La volonté de réduire la dépendance extérieure</h3>\n<p>Face à l’échange inégal, plusieurs pays cherchent à :</p>\n<ul><li>réduire les importations ;</li><li>développer une industrie nationale ;</li><li>protéger leur marché ;</li><li>nationaliser certaines entreprises.</li></ul>\n<p>L’objectif est logique :</p>\n<p>👉 devenir moins dépendant du centre.</p>\n<p>Mais l’industrialisation protégée peut échouer lorsque le marché intérieur est insuffisant.</p>\n<h3>K. Les limites des stratégies trop fermées</h3>\n<p>Plusieurs problèmes apparaissent :</p>\n<ul><li>demande intérieure faible ;</li><li>marchés nationaux étroits ;</li><li>manque de concurrence ;</li><li>entreprises publiques parfois peu productives ;</li><li>risques de rente ;</li><li>mauvaise allocation du capital ;</li><li>corruption.</li></ul>\n<h4>Mécanisme</h4>\n<p>protection excessive → faible concurrence → productivité faible → coûts élevés → industrie peu compétitive.</p>\n<h4>Idée centrale</h4>\n<p>Le problème n’est donc pas nécessairement l’ouverture elle-même.</p>\n<p>Le véritable enjeu est :</p>\n<p>👉 la manière dont un pays s’insère dans la mondialisation.</p>\n<p>Cl</p>\n<p>Le constat structuraliste des asymétries internationales peut être pertinent sans pour autant justifier une fermeture complète : une stratégie de développement réussie suppose davantage une insertion maîtrisée qu’un retrait durable des échanges mondiaux.</p>\n<p>Mais les rapports de force ne concernent pas seulement les États entre eux : la mondialisation provoque également des tensions entre les États et les firmes multinationales.</p>\n<h3>L. Mondialisation et tensions entre États et firmes multinationales</h3>\n<h3>M. Les premières FMN recherchent surtout des ressources ou des marchés</h3>\n<p>Les premières firmes multinationales apparaissent déjà lors de la première mondialisation.</p>\n<p>Elles réalisent des IDE pour deux grandes raisons.</p>\n<h4>1-Logique d’approvisionnement</h4>\n<p>Objectif :</p>\n<p>👉 se rapprocher d’une ressource.</p>\n<p>Exemples :</p>\n<ul><li>minerais ;</li><li>pétrole ;</li><li>matières premières agricoles.</li></ul>\n<p>Certaines entreprises cherchent également à dépasser l’étroitesse de leur marché national.</p>\n<h4>2-Logique de marché</h4>\n<p>Une entreprise peut s’implanter à l’étranger pour :</p>\n<p>👉 vendre directement sur un marché plus vaste.</p>\n<p>C’est particulièrement important pour les entreprises issues de petits pays.</p>\n<h4>Exemple</h4>\n<p>👉 Nestlé en Suisse.</p>\n<p>Le marché domestique suisse étant limité, l’entreprise a rapidement intérêt à penser ses débouchés à l’échelle internationale.</p>\n<h4>Idée</h4>\n<p>Les premières firmes multinationales internationalisent leur production principalement pour sécuriser leurs approvisionnements ou accéder à des marchés plus vastes.</p>\n<p>À partir des années 1980, leur stratégie change profondément : elles ne se contentent plus de produire dans plusieurs pays, elles fragmentent leur processus de production à l’échelle mondiale.</p>\n<h3>N. La firme globale et la DIPP</h3>\n<p>La DIPP signifie décomposition internationale des processus productifs.</p>\n<p>Une entreprise découpe sa chaîne de production en plusieurs étapes et localise chacune là où elle est la plus rentable.</p>\n<h4>Exemple</h4>\n<p>R&amp;D → pays développé.</p>\n<p>Fabrication de composants → autre pays.</p>\n<p>Assemblage → pays à bas coût.</p>\n<p>Marketing / finance / services → pays développé.</p>\n<h4>Idée</h4>\n<p>La DIPP consiste à fragmenter la chaîne de valeur entre plusieurs territoires afin de localiser chaque étape du processus productif là où les conditions de coût, de compétence ou de marché sont les plus favorables.</p>\n<p>Cette fragmentation est souvent représentée par la courbe du sourire.</p>\n<h4>La courbe du sourire</h4>\n<p>La courbe du sourire montre que la fragmentation des chaînes de valeur tend à concentrer les activités à forte valeur ajoutée — conception, R&amp;D, marketing et services — dans les économies avancées, tandis que l’assemblage est davantage localisé dans les pays à bas coûts.</p>\n<p>Cette mobilité accrue des entreprises modifie profondément le rapport de force avec les États.</p>\n<h3>O. Qui fixe désormais les règles : l’État ou la firme ?</h3>\n<p>Les firmes globales peuvent arbitrer entre les territoires.</p>\n<p>Elles peuvent :</p>\n<ul><li>déplacer leurs usines ;</li><li>délocaliser ;</li><li>choisir leurs fournisseurs ;</li><li>modifier leurs investissements.</li></ul>\n<p>Les États cherchent donc à :</p>\n<ul><li>conserver les entreprises ;</li><li>attirer les IDE ;</li><li>empêcher certaines délocalisations ;</li><li>protéger certaines activités stratégiques.</li></ul>\n<h4>Tension fondamentale</h4>\n<p>👉 souveraineté de l’État</p>\n<h4>contre</h4>\n<p>👉 mobilité de la firme globale.</p>\n<h4>Idée</h4>\n<p>La mondialisation productive modifie le rapport de force entre États et firmes multinationales : la mobilité des entreprises limite l’autonomie des politiques nationales tandis que les États cherchent à reprendre le contrôle sur les implantations et les secteurs stratégiques.</p>\n<p>Les États ne réagissent cependant pas tous de la même manière à ces transformations.</p>\n<h3>P. Stratégies offensives et défensives des États</h3>\n<h3>Q. La Chine : une stratégie offensive</h3>\n<p>La Chine met en place depuis plusieurs décennies :</p>\n<ul><li>politique industrielle ;</li><li>soutien aux entreprises nationales ;</li><li>investissements stratégiques ;</li><li>politiques commerciales ;</li><li>montée en gamme technologique.</li></ul>\n<p>L’objectif est de :</p>\n<p>👉 conquérir de nouvelles positions dans l’économie mondiale.</p>\n<p>On peut donc parler de :</p>\n<p>👉 stratégie offensive.</p>\n<p>Cl</p>\n<p>La stratégie chinoise est offensive dans la mesure où l’État utilise activement les politiques industrielles, commerciales et technologiques pour modifier à son avantage la spécialisation du pays.</p>\n<p>Les États-Unis réagissent notamment à cette montée en puissance en cherchant à protéger leurs positions.</p>\n<h3>R. Les États-Unis : une logique davantage défensive</h3>\n<p>Les États-Unis accusent notamment la Chine de :</p>\n<ul><li>concurrence déloyale ;</li><li>subventions massives ;</li><li>transferts forcés de technologie ;</li><li>distorsions commerciales.</li></ul>\n<p>Ils répondent par :</p>\n<ul><li>droits de douane ;</li><li>restrictions ;</li><li>contrôles technologiques.</li><li>Idée essentielle</li></ul>\n<p>Il s’agit de :</p>\n<p>👉 ralentir la progression du concurrent.</p>\n<h4>Idée</h4>\n<p>Le protectionnisme américain contemporain peut être interprété comme une stratégie défensive visant à préserver les positions industrielles et technologiques des États-Unis face à la montée en puissance chinoise.</p>\n<p>L’Union européenne adopte une position plus hésitante car son identité économique repose historiquement davantage sur l’ouverture et la concurrence.</p>\n<h3>S. L’Union européenne : une stratégie plus difficile à définir</h3>\n<p>L’Union européenne est historiquement très attachée :</p>\n<ul><li>à la concurrence ;</li><li>au libre-échange ;</li><li>aux règles multilatérales.</li></ul>\n<p>Elle est donc moins habituée à utiliser :</p>\n<ul><li>droits de douane ;</li><li>protectionnisme ;</li><li>politique industrielle très verticale.</li></ul>\n<p>Mais la montée des tensions pousse l’Europe à réfléchir davantage à :</p>\n<ul><li>protection des industries ;</li><li>politique commerciale ;</li><li>réindustrialisation ;</li><li>compétitivité-prix ;</li><li>souveraineté économique.</li></ul>\n<h4>Idée</h4>\n<p>L’Union européenne se trouve confrontée à une tension entre son attachement historique au libre-échange et la nécessité croissante de défendre ses intérêts industriels dans un environnement international plus conflictuel.</p>\n<p>Les tensions liées à la mondialisation ne concernent pas seulement les pays et les entreprises. Elles apparaissent également à l’intérieur même des ménages.</p>\n<h3>T. Les mêmes individus peuvent être gagnants et perdants de la mondialisation</h3>\n<h3>U. Le ménage consommateur : généralement gagnant</h3>\n<p>Les importations provenant de pays à bas salaires permettent :</p>\n<ul><li>baisse des prix ;</li><li>plus grande variété ;</li><li>accès à davantage de biens.</li></ul>\n<p>Exemples :</p>\n<ul><li>textile ;</li><li>électronique ;</li><li>smartphones ;</li><li>équipements.</li></ul>\n<h4>Conséquence</h4>\n<p>👉 gain de pouvoir d’achat.</p>\n<p>👉 1 000 € par an de gain de pouvoir d’achat moyen lié aux échanges avec la Chine.</p>\n<h4>Idée</h4>\n<p>En tant que consommateur, le ménage bénéficie de la mondialisation grâce à la baisse des prix des produits importés, ce qui augmente son pouvoir d’achat réel.</p>\n<p>Mais ce même consommateur est aussi un travailleur, et son intérêt peut alors être totalement différent.</p>\n<h3>V. Le ménage travailleur : gagnant ou perdant selon son exposition</h3>\n<p>Si le travailleur exerce dans :</p>\n<ul><li>textile ;</li><li>assemblage ;</li><li>industrie facilement délocalisable ;</li></ul>\n<p>il peut subir :</p>\n<ul><li>concurrence étrangère ;</li><li>délocalisations ;</li><li>chômage ;</li><li>baisse des salaires.</li></ul>\n<p>À l’inverse, certains travailleurs :</p>\n<ul><li>très qualifiés ;</li><li>innovants ;</li><li>employés dans des secteurs compétitifs ;</li><li>peuvent bénéficier fortement de la mondialisation.</li></ul>\n<h4>Idée clé</h4>\n<p>L’effet dépend donc :</p>\n<p>👉 de l’exposition du travailleur à la concurrence internationale.</p>\n<p>Cl</p>\n<p>Le travailleur peut être perdant de la mondialisation lorsque son emploi est directement exposé à la concurrence internationale, même s’il bénéficie simultanément de prix plus faibles en tant que consommateur.</p>\n<p>Le même ménage possède enfin une troisième identité économique : celle d’épargnant.</p>\n<h3>W. Le ménage épargnant : bénéfices potentiels de la globalisation financière</h3>\n<p>La globalisation financière permet :</p>\n<ul><li>diversification des placements ;</li><li>accès à davantage d’actifs ;</li><li>recherche d’un meilleur rendement ;</li><li>diversification du risque.</li></ul>\n<h4>Principe</h4>\n<p>👉 optimiser le couple rendement / risque.</p>\n<h4>Idée</h4>\n<p>En tant qu’épargnant, le ménage peut bénéficier de la mondialisation financière qui élargit les possibilités de placement et permet une meilleure diversification du risque.</p>\n<p>Il est donc impossible de dresser une frontière simple entre gagnants et perdants : un même individu peut gagner comme consommateur et perdre comme travailleur.</p>\n<h3>X. Pourquoi la réponse à « qui gagne à la mondialisation ? » est-elle nécessairement complexe ?</h3>\n<p>Un ménage peut être simultanément :</p>\n<ul><li>Consommateur</li></ul>\n<p>👉 gagnant.</p>\n<h4>Travailleur</h4>\n<p>👉 potentiellement perdant.</p>\n<h4>Épargnant</h4>\n<p>👉 potentiellement gagnant.</p>\n<p>Cela dépend :</p>\n<ul><li>du secteur ;</li><li>du revenu ;</li><li>du patrimoine ;</li><li>du niveau de qualification ;</li><li>de l’exposition à la concurrence.</li></ul>\n<h4>Idée</h4>\n<p>La distinction entre gagnants et perdants de la mondialisation ne peut être établie de manière univoque car un même agent occupe simultanément plusieurs positions économiques dont les intérêts peuvent être contradictoires.</p>\n<p>Cette ambiguïté se retrouve lorsque l’on passe des individus aux pays et que l’on analyse l’évolution des inégalités mondiales.</p>\n<h3>Y. Milanovic : la mondialisation transforme profondément les inégalités mondiales</h3>\n<h3>Z. Le « big bang » des inégalités mondiales</h3>\n<p>Il utilise l’image d’un :</p>\n<p>👉 big bang des inégalités globales.</p>\n<p>La révolution industrielle crée une rupture majeure.</p>\n<h4>Pourquoi ?</h4>\n<p>Parce que certains pays :</p>\n<ul><li>s’industrialisent ;</li><li>connaissent de forts gains de productivité ;</li><li>s’enrichissent rapidement.</li></ul>\n<p>Alors que d’autres restent :</p>\n<ul><li>agricoles ;</li><li>peu productifs ;</li><li>peu industrialisés.</li></ul>\n<h4>Conséquence</h4>\n<p>👉 les inégalités entre pays explosent.</p>\n<h4>Idée</h4>\n<p>Pour Milanovic, la révolution industrielle provoque un « big bang » des inégalités mondiales en faisant diverger brutalement les trajectoires des pays industrialisés et des économies restées à l’écart de l’industrialisation.</p>\n<p>Pour analyser précisément ces inégalités, il faut distinguer les écarts entre pays des écarts internes aux pays.</p>\n<h3>AA. Mesurer les inégalités : l’intérêt de l’indice de Theil</h3>\n<p>L’indice de Theil est un indicateur d’inégalité.</p>\n<p>Comme le coefficient de Gini :</p>\n<ul><li>faible valeur → faible inégalité ;</li><li>valeur élevée → forte inégalité.</li></ul>\n<p>Mais il possède un avantage important :</p>\n<p>👉 il peut être décomposé.</p>\n<h3>AB. Deux dimensions des inégalités</h3>\n<p>L’indice permet de distinguer :</p>\n<ul><li>Inégalités entre pays</li><li>Différences de niveau de vie moyen entre nations.</li></ul>\n<h4>Inégalités au sein des pays</h4>\n<p>Différences entre individus appartenant à un même pays.</p>\n<h4>Idée essentielle</h4>\n<p>Les inégalités mondiales dépendent donc simultanément :</p>\n<ul><li>de l’écart entre pays ;</li><li>de la répartition interne à chaque pays.</li></ul>\n<p>Cl</p>\n<p>L’indice de Theil permet de décomposer les inégalités globales entre une composante inter-pays et une composante intra-pays, ce qui facilite l’analyse des effets différenciés de la mondialisation.</p>\n<p>Historiquement, les inégalités entre pays ont d’abord fortement augmenté avant que l’hypermondialisation n’inverse partiellement cette dynamique.</p>\n<h3>AC. L’hypermondialisation entraîne une baisse des inégalités entre certains pays</h3>\n<h3>AD. L’émergence asiatique réduit certains écarts internationaux</h3>\n<p>La troisième vague de mondialisation permet à certains pays émergents de connaître :</p>\n<ul><li>forte croissance ;</li><li>industrialisation ;</li><li>exportations ;</li><li>rattrapage technologique.</li></ul>\n<p>Le meilleur exemple est :</p>\n<p>👉 la Chine.</p>\n<p>En 1990 :</p>\n<p>👉 le niveau de vie américain était environ 24 fois supérieur au niveau de vie chinois.</p>\n<p>En 2024 :</p>\n<p>👉 l’écart est ramené à environ 3,2 fois.</p>\n<h4>Idée essentielle</h4>\n<p>La Chine rattrape très rapidement les pays riches.</p>\n<p>Cl</p>\n<p>L’hypermondialisation contribue à réduire les inégalités moyennes entre certains pays grâce au rattrapage spectaculaire des grands émergents asiatiques, au premier rang desquels la Chine.</p>\n<p>Mais ce rattrapage chinois ne doit pas être confondu avec une convergence générale de tous les pays en développement.</p>\n<h3>AE. Une divergence entre pays en développement</h3>\n<p>On compare notamment la Chine et l’Inde.</p>\n<p>En 1990 :</p>\n<div class=\"alertb\"><p>👉 le niveau de vie chinois est encore inférieur à celui de l’Inde selon le document étudié.</p></div>\n<p>En 2024 :</p>\n<p>👉 le niveau de vie chinois devient largement supérieur.</p>\n<p>Cela signifie que :</p>\n<p>👉 les trajectoires des pays en développement divergent.</p>\n<p>La même idée vaut avec plusieurs économies africaines dont la progression relative est beaucoup plus lente.</p>\n<h4>Mécanisme</h4>\n<p>certains PED réussissent leur insertion → rattrapage rapide.</p>\n<p>D’autres restent spécialisés dans :</p>\n<ul><li>matières premières ;</li><li>faible valeur ajoutée ;</li><li>secteurs peu productifs.</li></ul>\n<p>→ rattrapage lent.</p>\n<h4>Idée</h4>\n<p>La réduction des inégalités entre pays développés et grands émergents masque une divergence croissante au sein du monde en développement, certains pays asiatiques progressant beaucoup plus rapidement que de nombreuses économies africaines.</p>\n<p>On comprend donc pourquoi l’impact de la mondialisation sur les inégalités demeure profondément ambigu.</p>\n<h3>AF. Conclusion</h3>\n<p>La mondialisation ne peut être comprise comme un processus uniforme bénéficiant de la même manière à tous les acteurs.</p>\n<p>Elle est fondamentalement asymétrique.</p>\n<p>Historiquement, cette asymétrie apparaît dès la première mondialisation avec :</p>\n<ul><li>colonisation ;</li><li>DIT traditionnelle ;</li><li>spécialisation centre / périphérie ;</li><li>institutions extractives.</li></ul>\n<p>Dans les formes plus récentes de mondialisation, les rapports de force se déplacent vers :</p>\n<ul><li>États contre firmes globales ;</li><li>travailleurs qualifiés contre travailleurs exposés ;</li><li>territoires attractifs contre territoires fragilisés.</li></ul>\n<p>La mondialisation peut donc simultanément :</p>\n<p>👉 enrichir certains émergents ;</p>\n<p>👉 réduire certaines inégalités entre pays ;</p>\n<p>tout en :</p>\n<p>👉 accroissant les écarts entre individus ou entre pays en développement.</p>\n<p>Cl</p>\n<p>La mondialisation ne supprime pas les rapports de domination ; elle les transforme : des asymétries coloniales de la première mondialisation aux tensions contemporaines entre États, firmes globales et travailleurs, l’ouverture internationale produit des gains importants mais profondément inégalement répartis.</p>\n</div>\n<div class=\"nb ch21-premium-course\">\n<h2>IV. Stratégies gagnantes et perdantes d’insertion dans la mondialisation</h2>\n<p>Pourquoi certains pays profitent-ils de la mondialisation alors que d’autres restent enfermés dans des spécialisations défavorables ?</p>\n<h3>A. Idée générale</h3>\n<p>Tous les pays ne profitent pas de la mondialisation de la même manière.</p>\n<p>L’ouverture internationale ne suffit pas, à elle seule, à provoquer le développement.</p>\n<p>Ce qui compte est :</p>\n<ul><li>la manière dont le pays s’ouvre ;</li><li>le rôle joué par l’État ;</li><li>la nature des IDE reçus ;</li><li>la capacité à obtenir des transferts de technologie ;</li><li>la capacité à diversifier la production ;</li><li>surtout, la capacité à monter en gamme.</li></ul>\n<p>Les grands gagnants de la mondialisation ont généralement suivi une stratégie de :</p>\n<p>👉 remontée de filière.</p>\n<p>À l’inverse, certains pays restent enfermés dans :</p>\n<ul><li>les matières premières ;</li><li>les productions agricoles ;</li><li>des activités peu sophistiquées ;</li><li>des secteurs dont les prix internationaux évoluent défavorablement.</li></ul>\n<h4>Idée centrale</h4>\n<p>La mondialisation ne crée donc pas automatiquement le développement :</p>\n<div class=\"alertb\"><p>👉 une insertion réussie suppose une ouverture maîtrisée permettant la transformation progressive de la structure productive.</p></div>\n<p>Cl</p>\n<p>Les pays gagnants de la mondialisation ne sont pas ceux qui se sont simplement ouverts aux échanges, mais ceux qui ont utilisé l’ouverture comme instrument de transformation productive, notamment grâce à une politique de montée en gamme et d’acquisition technologique.</p>\n<p>La première caractéristique commune aux trajectoires asiatiques réussies est précisément l’existence d’un État capable d’organiser cette transformation productive.</p>\n<h3>B. Les stratégies gagnantes reposent sur une montée en gamme organisée</h3>\n<h4>Qu’est-ce que la montée en gamme ?</h4>\n<p>La montée en gamme désigne le déplacement progressif de la spécialisation productive vers des activités plus complexes, plus productives et à plus forte valeur ajoutée.</p>\n<p>Cette transformation ne se produit cependant pas automatiquement sous l’effet du marché : elle a souvent été activement organisée par l’État.</p>\n<h3>C. Première condition de réussite : un État stratège</h3>\n<h4>La Corée du Sud : exemple emblématique</h4>\n<p>La Corée du Sud constitue l’un des exemples les plus spectaculaires de remontée de filière.</p>\n<p>Elle est passée :</p>\n<ul><li>d’une économie relativement pauvre ;</li><li>spécialisée dans des productions simples ;</li></ul>\n<p>à une économie présente dans :</p>\n<ul><li>automobile ;</li><li>électronique ;</li><li>construction navale ;</li><li>semi-conducteurs ;</li><li>technologies avancées.</li></ul>\n<p>Cette transformation repose notamment sur :</p>\n<p>👉 une politique industrielle volontariste.</p>\n<p>L’État :</p>\n<ul><li>sélectionne des secteurs ;</li><li>organise le financement ;</li><li>soutient certaines entreprises ;</li><li>encourage les exportations ;</li><li>investit dans l’éducation ;</li><li>exige progressivement davantage de compétitivité.</li></ul>\n<h4>Idée</h4>\n<p>La Corée du Sud montre qu’une insertion réussie dans la mondialisation peut résulter d’une stratégie industrielle dans laquelle l’État accompagne les entreprises nationales vers des activités de plus en plus technologiques.</p>\n<p>Cette logique d’État stratège apparaît également dans le développement japonais.</p>\n<h4>Le Japon et le MITI</h4>\n<p>Le MITI joue après-guerre un rôle important dans :</p>\n<ul><li>l’orientation industrielle ;</li><li>la sélection de secteurs stratégiques ;</li><li>l’organisation du rattrapage technologique ;</li><li>le soutien aux exportations.</li></ul>\n<h4>Idée essentielle</h4>\n<p>Le Japon n’abandonne donc pas entièrement sa spécialisation au marché.</p>\n<p>Il organise :</p>\n<p>👉 la transformation de ses avantages comparatifs.</p>\n<h4>Idée</h4>\n<p>L’expérience japonaise illustre le rôle de l’État développeur : par l’intermédiaire du MITI, les pouvoirs publics ont accompagné la transformation des avantages comparatifs et la montée en gamme industrielle.</p>\n<p>Mais un État fort ne signifie pas nécessairement un État qui ferme son économie. Les trajectoires gagnantes reposent au contraire sur une ouverture sélective et pragmatique.</p>\n<h3>D. Deuxième condition : une ouverture maîtrisée plutôt qu’une ouverture brutale</h3>\n<h3>E. S’ouvrir sans libéraliser tous les flux simultanément</h3>\n<p>Les économies asiatiques ayant réussi leur rattrapage n’ont généralement pas ouvert immédiatement et totalement :</p>\n<ul><li>leur commerce ;</li><li>leur système financier ;</li><li>leurs mouvements de capitaux.</li></ul>\n<p>L’ouverture est :</p>\n<p>👉 progressive et sélective.</p>\n<h4>Idée</h4>\n<p>Les stratégies asiatiques de rattrapage ont reposé sur une ouverture pragmatique : les flux utiles au développement ont été encouragés tandis que d’autres mouvements, notamment financiers, sont restés plus étroitement contrôlés.</p>\n<p>L’un des flux les plus recherchés est précisément l’investissement direct étranger.</p>\n<h3>F. Attirer les IDE pour accélérer l’industrialisation</h3>\n<p>Les IDE entrants permettent à des entreprises étrangères de :</p>\n<ul><li>créer des usines ;</li><li>ouvrir des filiales ;</li><li>investir dans les capacités productives locales.</li></ul>\n<p>Pour le pays d’accueil, cela apporte :</p>\n<ul><li>capital ;</li><li>emplois ;</li><li>savoir-faire ;</li><li>technologies ;</li><li>accès aux marchés internationaux.</li></ul>\n<h4>Mécanisme</h4>\n<p>IDE entrants → capital productif ↑ → production ↑ → emplois ↑ → technologie potentiellement diffusée → productivité ↑.</p>\n<p>Cl</p>\n<p>Les IDE entrants peuvent accélérer le rattrapage lorsqu’ils ne constituent pas seulement une entrée de capitaux mais permettent également l’apprentissage productif et la diffusion des technologies.</p>\n<p>La Chine illustre particulièrement bien cette stratégie avec la création de zones économiques spéciales.</p>\n<h3>G. La Chine : les zones économiques spéciales comme outil d’ouverture maîtrisée</h3>\n<h3>H. Les zones économiques spéciales</h3>\n<p>À partir de la période d’ouverture engagée à la fin des années 1970 et au début des années 1980, la Chine développe des :</p>\n<p>👉 zones économiques spéciales (ZES).</p>\n<p>Ce sont des territoires dans lesquels les entreprises étrangères bénéficient de conditions particulièrement favorables.</p>\n<p>Elles peuvent notamment profiter :</p>\n<ul><li>d’une fiscalité attractive ;</li><li>de règles administratives simplifiées ;</li><li>d’infrastructures adaptées ;</li><li>d’une main-d’œuvre abondante ;</li><li>d’un accès facilité au territoire chinois.</li></ul>\n<h4>Idée essentielle</h4>\n<p>La Chine n’ouvre donc pas immédiatement tout son territoire de manière uniforme.</p>\n<p>Elle :</p>\n<p>👉 expérimente l’ouverture dans des espaces délimités.</p>\n<p>Cl</p>\n<p>Les zones économiques spéciales chinoises constituent un instrument d’ouverture sélective permettant d’attirer les IDE tout en conservant un contrôle étatique sur le rythme et les modalités de l’internationalisation.</p>\n<p>Pour attirer
