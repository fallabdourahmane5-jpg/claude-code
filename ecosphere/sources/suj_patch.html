ration procurent main-d’œuvre qualifiée, fournisseurs proches et diffusion des savoir-faire.", "3) La Silicon Valley en constitue l’exemple contemporain le plus célèbre.", "II. Mais l’intégration conserve ses raisons d’être", "A. Les coûts de transaction justifient la hiérarchie", "1) Coase établit dès 1937 que le recours au marché a un coût de recherche, de négociation et de contrôle.", "2) Williamson montre que la rationalité limitée et l’opportunisme rendent le contrat risqué.", "3) Internaliser reste préférable lorsque les actifs sont spécifiques à la relation.", "B. Chandler décrit des structures adaptées à la taille", "1) La forme U, fonctionnelle, convient aux entreprises de taille modeste.", "2) La forme M, multidivisionnelle, devient nécessaire avec la croissance et la diversification.", "3) Ces structures montrent que la grande entreprise a su se réorganiser plutôt que disparaître.", "C. Le réseau crée ses propres dépendances", "1) Le coordinateur impose ses conditions à des partenaires plus petits et moins diversifiés.", "2) La perte d’un donneur d’ordres peut menacer l’existence d’un sous-traitant.", "3) Les ruptures d’approvisionnement récentes ont révélé la fragilité de ces chaînes.", "III. Les deux formes coexistent et se combinent", "A. Une coexistence documentée", "1) François et Lemercier distinguent entreprises distribuées et entreprises intégrées.", "2) Les deux formes répondent à des contraintes différentes de coût, de contrôle et d’incertitude.", "3) Aucune ne s’est substituée à l’autre dans le capitalisme contemporain.", "B. Des modèles hybrides s’imposent", "1) Amazon combine intégration verticale — logistique, stockage, distribution — et plateforme ouverte à d’autres vendeurs.", "2) L’entreprise choisit d’intégrer là où l’incertitude est forte et d’externaliser ailleurs.", "3) La frontière de la firme devient mobile et se redéfinit en permanence.", "C. La relocalisation réactive l’intégration", "1) Les dépendances critiques révélées par les chaînes de valeur remettent la sécurité au premier plan.", "2) Certaines productions stratégiques sont réintégrées malgré un coût supérieur.", "3) L’arbitrage de Williamson se rejoue donc sur un critère nouveau, celui de la robustesse."], "conclusion": "La firme-réseau introduit une flexibilité et un ancrage territorial que l’entreprise intégrée n’offre pas, et la fragmentation productive lui a donné une place centrale. Mais elle ne remplace pas le modèle hiérarchique, dont les coûts de transaction continuent de justifier l’existence. Le cas d’Amazon montre que les deux logiques se combinent, et les ruptures récentes des chaînes de valeur réactivent même l’argument de l’intégration."}, "ch9-17": {"title": "Le démantèlement est-il une solution efficace contre les monopoles ?", "mobiliser": "Ch. 9 (antitrust, démantèlement, contrôle des concentrations) · Ch. 5 (monopole naturel) · Ch. 8 (capitalisme industriel) · 2ᵉ année ch. 1 (régulation des acteurs mondiaux)", "commentaire": "Il faut nuancer par l’ironie historique : les sociétés issues du démantèlement de la Standard Oil refusionnent dans les années 1990. Le sujet oppose une sanction structurelle, spectaculaire mais réversible, et des instruments préventifs. AT&T et Microsoft fournissent les autres cas. Le monopole naturel rappelle qu’il existe des situations où le démantèlement serait contre-productif.", "intro": "Le démantèlement consiste à découper une entreprise dominante en plusieurs sociétés indépendantes. Appliqué à la Standard Oil de John D. Rockefeller en 1911, il constitue l’arme ultime des autorités de la concurrence et le symbole de la puissance publique face aux trusts. Son efficacité dans la durée est pourtant discutée : dans les années 1990, plusieurs sociétés issues de ce démantèlement ont refusionné dans un contexte de mondialisation.", "problematique": "Le démantèlement permet-il de restaurer durablement la concurrence sur un marché dominé ?", "plan": ["I. Une arme puissante et dissuasive", "A. Une action directe sur la structure du marché", "1) Le pouvoir de marché est fractionné entre plusieurs entités désormais autonomes.", "2) La sanction atteint la position elle-même et non seulement le comportement.", "3) Le démantèlement de la Standard Oil en 1911 demeure la référence historique de cette logique.", "B. Une menace qui infléchit les comportements", "1) AT&T a été effectivement démantelé, ce qui a constitué un précédent majeur.", "2) Microsoft y a échappé de peu dans les années 1990, mais la perspective a pesé sur ses pratiques.", "3) L’existence même de cette sanction exerce un effet dissuasif sur les firmes dominantes.", "C. Une réponse aux positions inexpugnables", "1) Lorsque les barrières à l’entrée sont infranchissables, la sanction comportementale ne suffit plus.", "2) Les amendes peuvent être absorbées comme un simple coût d’exploitation.", "3) Seule une intervention structurelle rouvre alors la possibilité d’une concurrence effective.", "II. Mais une efficacité limitée dans le temps", "A. Les refusions annulent partiellement l’effet", "1) Dans les années 1990, plusieurs sociétés issues du démantèlement de Rockefeller se sont regroupées.", "2) La mondialisation a fourni le motif de ces rapprochements, au nom de la taille critique.", "3) La structure démantelée tend donc à se reconstituer si les forces économiques demeurent.", "B. Les logiques de concentration persistent", "1) Les économies d’échelle continuent de rendre la grande taille avantageuse.", "2) Les effets de réseau produisent une reconcentration rapide dans le numérique.", "3) Le démantèlement traite le symptôme sans modifier les déterminants de la concentration.", "C. Une sanction lourde et risquée", "1) Elle peut détruire des synergies productives réelles et des économies d’échelle légitimes.", "2) Elle serait contre-productive dans un monopole naturel, où la duplication est inefficace.", "3) Sa mise en œuvre est longue, complexe et juridiquement incertaine.", "III. Les instruments préventifs sont désormais privilégiés", "A. Agir en amont plutôt qu’en aval", "1) Le contrôle des concentrations examine les fusions avant qu’elles ne créent la position dominante.", "2) La définition du marché pertinent y est décisive, comme l’a montré l’affaire Alstom-Siemens.", "3) Empêcher la formation du problème coûte moins que le défaire ensuite.", "B. Détecter et sanctionner les comportements", "1) La procédure de clémence permet de révéler les cartels secrets en incitant à la dénonciation.", "2) L’abus de position dominante est sanctionné sans remettre en cause l’existence de la firme.", "3) L’approche par la contestabilité oriente l’action vers la levée des barrières à l’entrée.", "C. La régulation ex ante complète l’arsenal", "1) Le Digital Markets Act interdit certaines pratiques par principe aux plateformes structurantes.", "2) Il agit en continu plutôt qu’au terme de procédures longues.", "3) Il vise à restaurer la contestabilité sans recourir au découpage des entreprises."], "conclusion": "Le démantèlement modifie directement la structure du marché et exerce un effet dissuasif réel, comme l’attestent les cas de la Standard Oil, d’AT&T et de Microsoft. Mais son efficacité s’érode : les refusions des années 1990 rappellent que les forces économiques de concentration persistent après la sanction. C’est pourquoi les autorités privilégient désormais la prévention — contrôle des concentrations, clémence, régulation ex ante — plutôt que cette arme lourde et réversible."}, "ch9-15": {"title": "Les effets d’agglomération expliquent-ils la localisation des entreprises ?", "mobiliser": "Ch. 9 (districts industriels, Marshall, agglomération) · Ch. 6 (croissance endogène, externalités) · Ch. 8 (industrialisation, territoires) · 2ᵉ année ch. 1 (DIPP, délocalisation, attractivité)", "commentaire": "Marshall et les districts industriels sont attendus, avec la Silicon Valley comme exemple contemporain. Le piège serait de s’en tenir aux avantages : la mondialisation autorise l’éclatement des activités, et l’agglomération crée ses propres fragilités. Le sujet appelle donc une réponse nuancée où la proximité explique beaucoup sans tout expliquer.", "intro": "La proximité géographique renforce les réseaux d’entreprises. Alfred Marshall l’avait déjà observé dans ses Principes d’économie politique publiés en 1890, en décrivant les districts industriels : des concentrations locales d’entreprises spécialisées bénéficiant d’une main-d’œuvre, de savoir-faire et de fournisseurs communs. La Silicon Valley en constitue aujourd’hui l’illustration la plus célèbre. Pourtant, la fragmentation internationale de la production disperse au contraire les activités.", "problematique": "Dans quelle mesure la concentration géographique des activités procure-t-elle des avantages décisifs de localisation ?", "plan": ["I. Des avantages économiques bien identifiés", "A. Un marché du travail spécialisé", "1) La main-d’œuvre qualifiée est disponible localement, ce qui réduit les coûts et délais de recrutement.", "2) Les salariés trouvent plus facilement un autre employeur, ce qui les attire vers le territoire.", "3) Les savoir-faire se transmettent par la mobilité des personnes entre entreprises voisines.", "B. Un tissu dense de fournisseurs", "1) La proximité des sous-traitants réduit les coûts logistiques et les délais de production.", "2) Elle facilite les ajustements rapides en cas de variation de la demande.", "3) Les relations répétées réduisent les coûts de transaction et limitent l’opportunisme.", "C. Une diffusion rapide de l’innovation", "1) Les échanges informels accélèrent la circulation des connaissances techniques.", "2) Les externalités de connaissance profitent à l’ensemble du district sans contrepartie marchande.", "3) La croissance endogène montre que ces externalités entretiennent durablement la productivité.", "II. Mais une explication partielle de la localisation", "A. D’autres facteurs pèsent lourdement", "1) Les coûts de production, les salaires et la fiscalité orientent fortement les choix d’implantation.", "2) L’accès au marché final peut primer sur la proximité des concurrents.", "3) Les infrastructures et la stabilité institutionnelle conditionnent l’attractivité d’un territoire.", "B. La mondialisation autorise l’éclatement", "1) La décomposition internationale des processus productifs répartit les étapes entre plusieurs pays.", "2) Chaque module est localisé là où les conditions de coût ou de compétence sont les meilleures.", "3) La baisse des coûts de transport et de communication a rendu cette dispersion possible.", "C. La firme-réseau relativise la proximité physique", "1) La coordination contractuelle peut s’exercer à distance, sans colocalisation.", "2) Les outils numériques réduisent le besoin de contacts directs pour de nombreuses activités.", "3) Le district cède alors la place à une chaîne de valeur étendue à l’échelle mondiale.", "III. Une concentration qui comporte aussi des risques", "A. Une dépendance territoriale", "1) Une crise sectorielle frappe simultanément toutes les entreprises du district.", "2) La spécialisation locale réduit la capacité de reconversion du territoire.", "3) La désindustrialisation a durement touché les bassins les plus spécialisés.", "B. Des coûts locaux croissants", "1) Le succès du district renchérit le foncier et les salaires.", "2) Ces hausses peuvent chasser les activités les moins rentables.", "3) La Silicon Valley illustre cette tension entre attractivité et coût de la localisation.", "C. Un arbitrage désormais réévalué", "1) Les ruptures d’approvisionnement ont révélé les vulnérabilités des chaînes dispersées.", "2) La relocalisation de productions stratégiques réintroduit un critère de sécurité.", "3) La proximité redevient un argument, non plus d’efficacité seulement, mais de robustesse."], "conclusion": "Les effets d’agglomération procurent des avantages substantiels — main-d’œuvre spécialisée, fournisseurs proches, diffusion rapide de l’innovation — que Marshall avait identifiés dès 1890. Ils n’expliquent pourtant pas seuls la localisation : coûts, accès aux marchés et fragmentation internationale pèsent tout autant, et la concentration territoriale engendre ses propres fragilités. Les ruptures récentes des chaînes de valeur redonnent néanmoins à la proximité une valeur de robustesse."}, "ch9-16": {"title": "La concentration des entreprises menace-t-elle la démocratie ?", "mobiliser": "Ch. 9 (risques fiscal, économique et politique, DMA) · Ch. 10 (pouvoir, information, Bronner) · Ch. 1 (État, fiscalité) · Ch. 7 (inégalités) · 2ᵉ année ch. 1 (souveraineté numérique, GAFAM)", "commentaire": "Sujet à forte dimension politique. Il faut mobiliser les trois risques identifiés dans le chapitre — fiscal, économique et politique — puis montrer que l’enjeu démocratique tient surtout au contrôle de l’information. Bronner apporte le marché cognitif. Le piège serait de rester dans l’indignation : il faut montrer des mécanismes et rappeler les instruments de réponse.", "intro": "Les très grandes entreprises ne se contentent pas d’occuper des positions économiques dominantes : elles pèsent sur les finances publiques, sur la structure des marchés et sur le débat public. Plusieurs auteurs contemporains alertent sur les dérives du capitalisme numérique, où le contrôle des données et des flux d’information se concentre entre quelques mains. La question dépasse alors l’efficacité économique pour atteindre les conditions mêmes de la délibération démocratique.", "problematique": "Le pouvoir acquis par les très grandes entreprises constitue-t-il une menace pour le fonctionnement démocratique ?", "plan": ["I. Un pouvoir qui excède le champ économique", "A. Un risque fiscal", "1) L’optimisation fiscale réduit les recettes publiques et les marges de manœuvre des États.", "2) La mobilité des profits complique l’assiette de l’impôt pour les activités immatérielles.", "3) La concurrence fiscale entre territoires accentue ce déséquilibre.", "B. Un risque économique", "1) Les barrières à l’entrée freinent la dynamique concurrentielle et figent les positions.", "2) La dépendance des partenaires et des sous-traitants s’accroît avec la taille du donneur d’ordres.", "3) La contestabilité s’effondre là où les effets de réseau sont les plus puissants.", "C. Un risque politique", "1) Le lobbying pèse sur l’élaboration des règles qui encadrent ces mêmes entreprises.", "2) Certaines firmes exercent des fonctions — infrastructures, satellites, paiements — relevant historiquement des États.", "3) Leur influence peut ainsi concurrencer la décision publique.", "II. Un enjeu proprement démocratique : le contrôle de l’information", "A. Les plateformes structurent l’espace public", "1) Elles maîtrisent les flux d’information et les modalités de leur diffusion.", "2) Gérald Bronner montre que ce marché cognitif dérégulé favorise les contenus les plus attractifs.", "3) Les logiques d’audience et les algorithmes orientent ce qui devient visible.", "B. La délibération collective s’en trouve affectée", "1) L’insularité cognitive enferme les individus dans des chambres d’écho.", "2) Le biais de confirmation y renforce les opinions préexistantes.", "3) La loi de Brandolini rappelle qu’il est bien plus coûteux de réfuter une fausse information que de la produire.", "C. La souveraineté devient un enjeu public", "1) La souveraineté numérique désigne la capacité d’un État à maîtriser technologies, données et infrastructures.", "2) La dépendance à des acteurs étrangers réduit l’autonomie de décision publique.", "3) L’arsenalisation de la politique économique transforme ces dépendances en leviers de rapport de force.", "III. Des réponses existent, mais leur portée est incertaine", "A. Les instruments classiques conservent leur utilité", "1) Les lois antitrust et le contrôle des concentrations encadrent la formation des positions dominantes.", "2) La sanction de l’abus de position dominante demeure un instrument effectif.", "3) Le démantèlement reste disponible, malgré ses limites démontrées.", "B. La régulation ex ante change d’échelle", "1) Le Digital Markets Act vise explicitement les plateformes structurantes.", "2) Il interdit certaines pratiques par principe plutôt qu’après constat d’abus.", "3) Il assortit ces interdictions de sanctions financières élevées.", "C. L’efficacité dépend de la coordination internationale", "1) Une régulation régionale se heurte à des acteurs de dimension mondiale.", "2) Les divergences entre États-Unis, Union européenne et Chine limitent la portée des règles.", "3) L’enjeu démocratique excède donc les seuls instruments de la politique de concurrence."], "conclusion": "La concentration produit des risques fiscaux et économiques documentés, mais l’enjeu le plus lourd est politique : le contrôle des données et des flux d’information par quelques acteurs affecte les conditions de la délibération collective. Les instruments classiques de la concurrence restent utiles et le Digital Markets Act marque un tournant, mais leur efficacité dépendra d’une coordination internationale encore incertaine."}, "ch9-19": {"title": "La taille de l’entreprise détermine-t-elle son organisation ?", "mobiliser": "Ch. 9 (Chandler, formes U et M, PME/ETI) · Ch. 8 (taylorisme, toyotisme, organisation du travail) · Ch. 10 (Crozier, bureaucratie, rationalité limitée) · 2ᵉ année ch. 1 (firmes globales, DIPP)", "commentaire": "Chandler est central avec les formes U et M. Il faut aussi mobiliser taylorisme et toyotisme comme rationalités productives distinctes, puis montrer que la stratégie et l’environnement pèsent autant que la dimension. Crozier apporte la limite décisive : l’organisation réelle s’écarte toujours de l’organigramme, quelle que soit la taille.", "intro": "Une petite entreprise ne s’organise pas comme un grand groupe : les circuits de décision, la répartition des responsabilités et les modes de contrôle y diffèrent profondément. Alfred Chandler a montré que la croissance et la diversification imposent des transformations structurelles, avec le passage de la forme fonctionnelle à la forme multidivisionnelle. La taille apparaît ainsi comme un déterminant majeur, sans pour autant épuiser l’explication.", "problematique": "Dans quelle mesure la croissance de l’entreprise commande-t-elle son mode d’organisation ?", "plan": ["I. La taille impose des structures nouvelles", "A. De la forme U à la forme M", "1) La forme U est fonctionnelle : elle structure l’entreprise par grands métiers, production, commercial, finance.", "2) Elle convient aux entreprises de taille modeste dont l’activité reste homogène.", "3) La forme M est multidivisionnelle : elle organise le groupe par produits ou par zones géographiques.", "B. La diversification appelle la décentralisation", "1) Les divisions gagnent en autonomie opérationnelle à mesure que les activités se différencient.", "2) La direction générale se recentre sur la stratégie et l’allocation du capital.", "3) Le conglomérat pousse cette logique à son terme, au risque de la décote de conglomérat.", "C. La coordination devient elle-même un coût", "1) Les coûts d’organisation interne croissent avec la taille et le nombre d’échelons.", "2) Williamson montre que ce coût borne l’avantage de l’internalisation.", "3) Au-delà d’un seuil, externaliser redevient préférable à intégrer.", "II. Mais le mode de production pèse tout autant", "A. Deux rationalités productives distinctes", "1) Le taylorisme sépare conception et exécution et fonde l’organisation scientifique du travail.", "2) Le toyotisme mise sur la polyvalence, la qualité totale et le juste-à-temps.", "3) Ces modèles s’appliquent à des entreprises de tailles très différentes.", "B. La technologie structure l’organisation", "1) L’intensité capitalistique conditionne le degré de standardisation des tâches.", "2) Le numérique permet une coordination à distance qui réduit le besoin d’échelons intermédiaires.", "3) La production modulaire dissocie organisation interne et frontière juridique de la firme.", "C. La stratégie précède parfois la structure", "1) Le choix d’internaliser ou d’externaliser dépend des coûts de transaction, non de la seule dimension.", "2) La firme-réseau coordonne par contrat un ensemble d’entreprises de tailles diverses.", "3) Apple illustre une organisation mondiale reposant sur des partenaires qu’elle ne possède pas.", "III. L’organisation réelle échappe partiellement à la structure formelle", "A. Crozier distingue deux mondes", "1) Le monde formel est celui de l’organigramme et des règles écrites.", "2) Le monde informel est celui des relations réelles et des arrangements quotidiens.", "3) L’écart entre les deux existe dans les petites comme dans les grandes structures.", "B. Les acteurs disposent de marges de manœuvre", "1) La maîtrise d’une zone d’incertitude confère du pouvoir indépendamment du rang hiérarchique.", "2) L’enquête sur la SEITA montre des ouvriers d’entretien en position décisive.", "3) L’organisation est donc un jeu d’acteurs autant qu’un dispositif structurel.", "C. La rationalité organisationnelle reste limitée", "1) Herbert Simon montre que les décisions se prennent en information incomplète.", "2) Le cercle vicieux bureaucratique produit de la rigidité indépendamment de la forme retenue.", "3) Aucune structure ne garantit donc à elle seule l’efficacité du fonctionnement réel."], "conclusion": "La taille commande largement l’organisation, comme l’illustre le passage de la forme U à la forme M décrit par Chandler, et la coordination devient elle-même un coût qui borne la croissance. Mais le mode de production, la technologie et la stratégie pèsent tout autant, et Crozier rappelle que l’organisation réelle s’écarte toujours de l’organigramme. La structure résulte donc d’un arbitrage, non d’une contrainte mécanique de dimension."}, "ch9-20": {"title": "Que nous apprend l’entreprise sur la méthode des économistes ?", "mobiliser": "Ch. 9 (théories de la firme, modèle SCP, abstraction) · Ch. 3 (courants, méthode en économie) · Ch. 4 (modélisation, hypothèses) · Ch. 10 (démarche sociologique, idéal-type) · Ch. 6 (théories concurrentes)", "commentaire": "Sujet réflexif, à traiter comme une conclusion de chapitre. Il faut montrer la démarche : observer des régularités, construire des concepts transposables, puis en mesurer la limite. La théorie de l’agence sert d’exemple de généralisation réussie. Le modèle SCP illustre au contraire le risque du déterminisme. Ne pas transformer le sujet en dissertation d’épistémologie déconnectée du chapitre.", "intro": "L’entreprise n’est pas seulement un objet d’étude : la manière dont les économistes l’analysent révèle leur méthode. Face au même objet, la théorie néoclassique voit un automate combinant capital et travail, l’approche contractuelle un nœud de contrats, l’approche transactionnelle une alternative au marché. Cette pluralité d’interprétations d’un même phénomène éclaire la façon dont la science économique construit ses concepts et en éprouve la portée.", "problematique": "En quoi l’analyse de l’entreprise éclaire-t-elle la démarche même de la science économique ?", "plan": ["I. Une démarche de généralisation à partir de l’observation", "A. Partir de régularités observées", "1) Les économistes repèrent des comportements récurrents : concentration, ententes, barrières à l’entrée.", "2) L’étude de Combe sur 111 cartels entre 1969 et 2009 illustre cette démarche empirique.", "3) Le cas particulier devient alors matériau pour une analyse plus générale.", "B. Construire des concepts transposables", "1) Les coûts de transaction, forgés par Coase puis Williamson, dépassent le seul cas de la firme.", "2) L’asymétrie d’information s’applique à l’assurance, au crédit ou au marché du travail.", "3) La théorie de l’agence, née du rapport actionnaire-manager, éclaire toute relation principal-agent.", "C. Formaliser pour comparer", "1) L’indice de Lerner permet de mesurer le pouvoir de marché indépendamment du secteur.", "2) Le modèle SCP fournit une grille commune applicable à des industries très différentes.", "3) La formalisation rend possible la comparaison et le test des hypothèses.", "II. Mais une méthode qui comporte ses limites", "A. Le risque de l’abstraction excessive", "1) La firme néoclassique réduite à une fonction de production néglige l’organisation réelle.", "2) Le modèle SCP impose une causalité unilatérale que les faits démentent.", "3) L’abstraction facilite le raisonnement mais peut écraser la diversité des situations.", "B. Les hypothèses conditionnent les conclusions", "1) La rationalité parfaite conduit à des résultats que la rationalité limitée invalide.", "2) Herbert Simon montre que relâcher cette hypothèse change l’analyse de fond en comble.", "3) Le choix des hypothèses est donc un acte théorique, non une simple commodité technique.", "C. Les approches concurrentes coexistent durablement", "1) Approche contractuelle et approche transactionnelle ne se sont pas départagées.", "2) Chacune éclaire une dimension différente du même objet.", "3) Le désaccord entre écoles n’est donc pas un échec mais un mode de progression.", "III. Une démarche qui gagne à s’ouvrir aux autres sciences sociales", "A. La sociologie éclaire ce que l’économie modélise", "1) Crozier montre par l’enquête ce que les modèles supposent : l’écart entre règle et pratique.", "2) Weber construit l’idéal-type comme instrument de comparaison, non comme description du réel.", "3) Les deux disciplines partagent donc une même exigence de conceptualisation.", "B. L’entreprise est un objet partagé", "1) Économistes et sociologues étudient la même organisation avec des outils distincts.", "2) Les frontières se brouillent : certains sociologues analysent les phénomènes économiques.", "3) L’analyse de la firme bénéficie de ce croisement méthodologique.", "C. La validité se juge à la portée explicative", "1) Une théorie vaut par sa capacité à rendre compte de faits qu’elle n’avait pas anticipés.", "2) Les coûts de transaction expliquent aujourd’hui les arbitrages de relocalisation.", "3) C’est cette fécondité, plus que l’élégance formelle, qui fonde la valeur d’un concept."], "conclusion": "L’étude de l’entreprise révèle une méthode qui part de régularités observées pour construire des concepts transposables, du coût de transaction à la théorie de l’agence. Elle en montre aussi les limites : abstraction excessive, dépendance aux hypothèses, déterminisme du modèle SCP. La coexistence durable d’approches concurrentes n’est pas un échec mais le mode même de progression de la discipline, que le dialogue avec la sociologie enrichit encore."}}, MOB = {"10": {"1": "Ch. 10 (Weber, rationalisation, bureaucratie ; Crozier, zone d’incertitude) · Ch. 9 (rationalité limitée, théories de la firme) · Ch. 4 (rationalité du producteur) · Ch. 8 (organisation du travail) · Auteurs : Weber, Simon, Crozier, Morel, Bronner", "2": "Ch. 10 (bureaucratie wébérienne, cercle vicieux, monde formel/informel) · Ch. 9 (coûts de transaction, hiérarchie) · Ch. 8 (taylorisme, formes U et M) · Auteurs : Weber (L’Éthique protestante, 1905), Crozier (Le Phénomène bureaucratique, 1963)", "3": "Ch. 10 (holisme et individualisme méthodologiques, fait social, action sociale) · Ch. 3 (méthode et courants en économie) · Ch. 4 (individualisme méthodologique) · Auteurs : Durkheim (Les Règles de la méthode sociologique, 1895), Weber", "4": "Ch. 10 (Crozier, analyse stratégique, SEITA, sources de pouvoir) · Ch. 9 (théorie de l’agence, gouvernance) · Ch. 8 (managers, actionnaires) · Auteurs : Crozier et Friedberg (L’Acteur et le système, 1977), Marx, Weber", "5": "Ch. 10 (Morel, décisions absurdes, métarègles ; Asch, Janis) · Ch. 9 (rationalité limitée, Simon) · Ch. 4 (rationalité du décideur) · Auteurs : Morel, Asch (1951), Janis (Groupthink, 1982), Kahneman, Simon", "6": "Ch. 10 (Bronner, marché cognitif, avarice cognitive, loi de Brandolini) · Ch. 8 (plateformes, capitalisme numérique) · Ch. 9 (pouvoir des plateformes, DMA) · Auteurs : Bronner (La Démocratie des crédules, 2013 ; Apocalypse cognitive, 2021), Kahneman", "7": "Ch. 10 (Durkheim, intégration et régulation ; Castel, désaffiliation) · Ch. 1 (revenu, pauvreté monétaire) · Ch. 8 (salariat, précarisation) · Ch. 7 (inégalités) · Auteurs : Durkheim (De la division du travail social, 1893), Castel (Les Métamorphoses de la question sociale, 1995), Aubenas (Le Quai de Ouistreham, 2010)", "8": "Ch. 10 (solidarités mécanique et organique, anomie, groupe professionnel) · Ch. 8 (division du travail, industrialisation) · Ch. 3 (Smith, division du travail) · Auteurs : Durkheim (De la division du travail social, 1893), Smith", "9": "Ch. 10 (chômage BIT, catégories France Travail, halo du chômage, désaffiliation) · Ch. 1 (revenu, pauvreté) · Ch. 6 (croissance et emploi) · Ch. 7 (inégalités) · Auteurs : Castel, Aubenas", "10": "Ch. 10 (syndicats, taux de syndicalisation, institutionnalisation des conflits) · Ch. 8 (désindustrialisation, monde ouvrier) · Ch. 2ᵉ année ch. 1 (mondialisation, ubérisation) · Auteurs : Durkheim (groupe professionnel), Castel", "11": "Ch. 10 (coopération et conflit, interdépendance, Crozier) · Ch. 9 (théorie de l’agence, nœud de contrats) · Ch. 8 (gouvernance, parties prenantes) · Auteurs : Crozier, Durkheim, Alchian et Demsetz, Jensen et Meckling", "12": "Ch. 10 (conformisme d’Asch, Groupthink de Janis, métarègles de Morel) · Ch. 9 (décision en organisation) · Ch. 4 (rationalité) · Auteurs : Asch (1951), Janis (1982), Morel, Kahneman", "13": "Ch. 10 (idéal-type, bureaucratie, cercle vicieux bureaucratique) · Ch. 9 (hiérarchie et coûts de transaction) · Ch. 3 (méthode et abstraction) · Auteurs : Weber, Crozier (Le Phénomène bureaucratique, 1963 ; L’Acteur et le système, 1977)", "14": "Ch. 10 (rationalisation, désenchantement du monde, cage d’acier) · Ch. 8 (industrialisation, taylorisme) · Ch. 6 (progrès technique) · Ch. 3 (modernité et pensée économique) · Auteurs : Weber ancement, capitaux) · Ch. 6 (croissance) · Auteurs : Hélène Rey, Nurkse", "4": "2ᵉ année ch. 1 (taux d’ouverture, commerce en valeur ajoutée, double comptage) · Ch. 9 (chaînes de valeur, DIPP) · Ch. 6 (mesure du PIB) · Auteurs : Baldwin, Bairoch", "5": "2ᵉ année ch. 1 (chaînes de valeur, dépendances, relocalisation) · Ch. 9 (concentration verticale, coûts de transaction) · Ch. 8 (organisation productive) · Auteurs : Baldwin (dégroupages), Williamson", "6": "2ᵉ année ch. 1 (entre-deux-guerres, Hawley-Smoot 1930, slowbalization) · Ch. 3 (libre-échange et protectionnisme) · Ch. 6 (crises et croissance) · Auteurs : Bairoch (Mythes et paradoxes de l’histoire économique, 1993), List", "7": "2ᵉ année ch. 1 (spécialisation, termes de l’échange, malédiction des ressources) · Ch. 3 (Smith, Ricardo, avantages comparatifs) · Ch. 7 (développement, dépendance) · Auteurs : Ricardo, Prebisch, Acemoglu et Robinson", "8": "2ᵉ année ch. 1 (FMN, firme globale, arsenalisation) · Ch. 9 (concentration, pouvoir de marché, DMA) · Ch. 8 (gouvernance, capitalisme) · Auteurs : Michalet, Giraud", "9": "2ᵉ année ch. 1 (déplacement du centre de gravité, BRICS, privilège exorbitant) · Ch. 7 (émergents, rattrapage) · Ch. 6 (croissance comparée) · Auteurs : Michalet, Giraud, Milanovic", "10": "2ᵉ année ch. 1 (balance des paiements, comptes courant et financier) · Ch. 2 (financement de l’économie) · Ch. 1 (épargne, capacité de financement) · Auteurs : Hélène Rey", "11": "2ᵉ année ch. 1 (déséquilibres mondiaux, déficits jumeaux, position extérieure) · Ch. 2 (globalisation financière) · Ch. 6 (croissance déséquilibrée) · Auteurs : Hélène Rey, Volcker (choc de 1979)", "12": "2ᵉ année ch. 1 (première mondialisation, étalon-or, migrations, DIPP) · Ch. 8 (révolutions industrielles) · Ch. 2 (systèmes monétaires) · Auteurs : Bairoch, Baldwin, Béraud", "13": "2ᵉ année ch. 1 (stratégies d’insertion, montée en gamme, malédiction des ressources) · Ch. 7 (stratégies de développement, institutions) · Ch. 9 (montée function appliquer(){
  if(typeof SUBJECTS_BANK_PREMIUM === 'undefined') return false;
  var n9 = 0, nm = 0, na = 0;
  SUBJECTS_BANK_PREMIUM.forEach(function(s){
    /* 1. chapitre 9 : corrigés entièrement refondus */
    var r = NEW9[s.id];
    if(r){
      s.mobiliser    = r.mobiliser;
      s.commentaire  = r.commentaire;
      s.intro        = r.intro;
      s.problematique= r.problematique;
      s.plan         = r.plan;
      s.conclusion   = r.conclusion;
      n9++;
      return;
    }
    /* 2. chapitres 10 et 2e année : « chapitres à mobiliser » analysés */
    var cle = String(s.chapter);
    if(MOB[cle] && MOB[cle][String(s.num)]){
      s.mobiliser = MOB[cle][String(s.num)];
      nm++;
      return;
    }
    /* 3. chapitres 1 à 8 : ajout transversal ciblé */
    var base = String(s.mobiliser || '').trim();
    if(base && /^[0-9,\s]+$/.test(base)){ base = 'Ch. ' + base.replace(/\s+/g,' '); s.mobiliser = base; }
    var add = ADD18[s.id];
    if(add && s.mobiliser.indexOf(add) === -1){
      s.mobiliser = base ? (base + ' · ' + add) : add;
      na++;
    }
  });
  window.__ECO_MAJ_SUJ_STATS = {ch9:n9, mobiliser:nm, enrichis:na};
  return true;
}
function rafraichir(){
  try{ if(typeof window.renderSubjectsPremium === 'function') window.renderSubjectsPremium(); }catch(e){}
}
function boot(){ if(appliquer()) rafraichir(); }
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
setTimeout(boot, 900);
setTimeout(boot, 2400);
if(typeof window.showPg === 'function'){
  var old = window.showPg;
  window.showPg = function(pg){
    var r = old.apply(this, arguments);
    if(pg === 'subjects'){ try{ appliquer(); setTimeout(rafraichir, 40); }catch(e){} }
    return r;
  };
}
})();
</script>
