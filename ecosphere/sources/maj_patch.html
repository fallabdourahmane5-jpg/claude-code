
<script id="eco-maj-fiches-recherche-auteurs">
(function(){
'use strict';
if(window.__ECO_MAJ_FRA) return;
window.__ECO_MAJ_FRA = true;
var NOUVEAUX = [{"name": "Oliver Williamson", "dates": "1932-2020", "courant": "Néo-institutionnaliste", "idea": "Coûts de transaction ; opportunisme ; internalisation", "oeuvres": [], "detail": "Prolonge Coase et Simon. Montre que certaines entreprises internalisent des activités afin de réduire les coûts de transaction. Ses deux hypothèses majeures sont la rationalité limitée et l’opportunisme des agents.", "phrase": "Pour Williamson, la firme constitue une alternative au marché : elle réduit les coûts de transaction, l’incertitude et l’opportunisme.", "ch": 9, "chapters": [9]}, {"name": "Armen Alchian", "dates": "1914-2013", "courant": "Approche contractuelle", "idea": "Firme comme nœud de contrats ; travail en équipe", "oeuvres": [], "detail": "Avec Harold Demsetz, analyse la firme comme un « nœud de contrats » entre des acteurs aux intérêts divers tenus de travailler ensemble. La difficulté de mesurer la contribution de chacun justifie le contrôle.", "phrase": "Pour Alchian et Demsetz, la firme n’est pas différente du marché : c’est un ensemble de contrats.", "ch": 9, "chapters": [9]}, {"name": "Harold Demsetz", "dates": "1930-2019", "courant": "Approche contractuelle", "idea": "Nœud de contrats ; contrôle du travail en équipe", "oeuvres": [], "detail": "Coauteur avec Armen Alchian de l’analyse contractuelle de la firme, où le créancier résiduel perçoit le revenu restant une fois les autres apporteurs rémunérés et a donc intérêt à l’efficacité.", "phrase": "Demsetz montre que le contrôle exercé dans la firme découle de la difficulté à mesurer l’apport de chacun.", "ch": 9, "chapters": [9]}, {"name": "Alfred Marshall", "dates": "1842-1924", "courant": "Néoclassique", "idea": "Districts industriels ; économies externes", "oeuvres": ["Principes d’économie politique (1890)"], "detail": "Développe la notion de district industriel : une concentration locale d’entreprises spécialisées qui bénéficient d’une main-d’œuvre, de savoir-faire et de fournisseurs communs.", "phrase": "Marshall théorise dès 1890 les avantages de la concentration géographique des activités.", "ch": 9, "chapters": [9]}, {"name": "Edward Chamberlin", "dates": "1899-1967", "courant": "Néoclassique", "idea": "Concurrence monopolistique ; différenciation des produits", "oeuvres": [], "detail": "Développe en 1933 la théorie de la concurrence monopolistique : de nombreuses entreprises vendent des produits différenciés, chacune disposant d’un petit pouvoir de marché sur son segment.", "phrase": "Chamberlin montre que la différenciation réduit la substituabilité et confère un pouvoir de marché.", "ch": 9, "chapters": [9]}, {"name": "William Baumol", "dates": "1922-2017", "courant": "Économie industrielle", "idea": "Théorie des marchés contestables", "oeuvres": [], "detail": "Avec John Panzar et Robert Willig, développe dans les années 1980 la théorie des marchés contestables : un marché est contestable si l’entrée et la sortie sont libres, sans coûts irrécupérables importants.", "phrase": "Pour Baumol, c’est la menace d’entrée, et non le nombre d’entreprises, qui discipline les prix.", "ch": 9, "chapters": [9]}, {"name": "John Panzar", "dates": "", "courant": "Économie industrielle", "idea": "Marchés contestables", "oeuvres": [], "detail": "Coauteur, avec William Baumol et Robert Willig, de la théorie des marchés contestables développée dans les années 1980.", "phrase": "Panzar contribue à déplacer le critère de la concurrence de l’atomicité vers la libre entrée.", "ch": 9, "chapters": [9]}, {"name": "Robert Willig", "dates": "", "courant": "Économie industrielle", "idea": "Marchés contestables", "oeuvres": [], "detail": "Coauteur, avec William Baumol et John Panzar, de la théorie des marchés contestables développée dans les années 1980.", "phrase": "Willig participe à montrer qu’un marché concentré peut rester concurrentiel s’il demeure contestable.", "ch": 9, "chapters": [9]}, {"name": "Edward Mason", "dates": "", "courant": "Économie industrielle", "idea": "Modèle SCP (Structure-Comportements-Performances)", "oeuvres": [], "detail": "À l’origine du modèle SCP au sein de l’économie industrielle, repris et formalisé par Joe Bain dans les années 1950.", "phrase": "Mason pose l’idée que la structure du marché conditionne les comportements des firmes.", "ch": 9, "chapters": [9]}, {"name": "Joe Bain", "dates": "", "courant": "Économie industrielle", "idea": "Modèle SCP ; barrières à l’entrée", "oeuvres": [], "detail": "Formalise dans les années 1950 le modèle Structure-Comportements-Performances, qui relie la configuration du marché aux stratégies des entreprises puis à leurs résultats.", "phrase": "Bain systématise le lien entre structure de marché, comportements et performances.", "ch": 9, "chapters": [9]}, {"name": "Emmanuel Combe", "dates": "", "courant": "Économie de la concurrence", "idea": "Politique de la concurrence ; cartels ; approche élargie", "oeuvres": ["La politique de la concurrence (2016)"], "detail": "Étudie 111 cartels entre 1969 et 2009 et montre qu’ils sont souvent durables, augmentent les prix et apparaissent surtout sur des marchés oligopolistiques. Oppose une approche standard de la concurrence, fondée sur l’atomicité, à une approche élargie fondée sur la contestabilité.", "phrase": "Selon Combe, environ 1 % des fusions ont été refusées entre 2010 et 2020.", "ch": 9, "chapters": [9]}, {"name": "John D. Rockefeller", "dates": "1839-1937", "courant": "Industriel (figure historique)", "idea": "Standard Oil ; trust pétrolier ; démantèlement de 1911", "oeuvres": [], "detail": "Fonde la Standard Oil Company en 1870 et bâtit un trust pétrolier dominant, démantelé en 1911 en application des lois antitrust américaines. Dans les années 1990, plusieurs sociétés issues de ce démantèlement refusionnent.", "phrase": "Le cas Rockefeller illustre à la fois la puissance des trusts et les limites du démantèlement.", "ch": 9, "chapters": [9]}, {"name": "Jack Welch", "dates": "1935-2020", "courant": "Dirigeant d’entreprise (figure historique)", "idea": "Gestion de General Electric ; logique managériale", "oeuvres": [], "detail": "Dirige General Electric pendant plus de trente ans. Sa stratégie repose sur les rachats d’entreprises, les restructurations, les licenciements massifs et la recherche permanente de performance.", "phrase": "Welch incarne la logique managériale du conglomérat diversifié.", "ch": 9, "chapters": [9]}, {"name": "Émile Durkheim", "dates": "1858-1917", "courant": "Sociologie (holisme méthodologique)", "idea": "Fait social ; solidarités mécanique et organique ; anomie ; intégration", "oeuvres": ["De la division du travail social (1893)", "Les Règles de la méthode sociologique (1895)", "Le Suicide (1897)"], "detail": "Fondateur de la sociologie française, créateur de la revue L’Année sociologique en 1896. Invite à traiter les faits sociaux comme des choses. Distingue la solidarité mécanique, fondée sur la ressemblance, et la solidarité organique, fondée sur la complémentarité d’individus spécialisés. Analyse les pathologies du lien social : l’anomie, défaut de régulation, et l’égoïsme, défaut d’intégration.", "phrase": "Pour Durkheim, le travail intègre parce qu’il crée des relations, rattache à un groupe et fournit des normes.", "ch": 10, "chapters": [10]}, {"name": "Elton Mayo", "dates": "1880-1949", "courant": "École des relations humaines", "idea": "Effet Hawthorne ; facteur humain au travail", "oeuvres": ["The Human Problems of an Industrial Civilization (1933)"], "detail": "Mène à partir des années 1920 les enquêtes de la Western Electric Company. L’expérience sur l’éclairage puis la Test Room révèlent que la productivité augmente indépendamment des conditions matérielles. Ses travaux donnent naissance à l’École des relations humaines, qui analyse l’entreprise comme un système social.", "phrase": "Mayo critique la conception mécaniste du travail de Taylor : la motivation dépend aussi des relations et du sens.", "ch": 10, "chapters": [10]}, {"name": "Gérald Bronner", "dates": "", "courant": "Sociologie cognitive", "idea": "Marché cognitif ; avarice cognitive ; démocratie des crédules", "oeuvres": ["La Démocratie des crédules (2013)", "Apocalypse cognitive (2021)"], "detail": "Analyse le marché cognitif comme un lieu où se rencontrent une offre et une demande d’informations. Montre que la dérégulation de ce marché par Internet ne garantit pas la progression de la rationalité : les invariants mentaux, dont l’avarice cognitive, et les logiques d’audience favorisent les contenus les plus attractifs.", "phrase": "Bronner rapproche l’avarice cognitive du « système 1 » de Kahneman : un mode de pensée rapide, intuitif et automatique.", "ch": 10, "chapters": [10]}, {"name": "Christian Morel", "dates": "", "courant": "Sociologie des organisations", "idea": "Décisions absurdes ; métarègles", "oeuvres": [], "detail": "Cherche à comprendre pourquoi des organisations rationnelles composées d’individus compétents produisent des décisions absurdes. Il identifie des causes individuelles (crainte de contester l’autorité, autocensure), collectives (conformisme, pensée de groupe) et cognitives, et propose des métarègles pour les prévenir.", "phrase": "Pour Morel, une décision absurde est une œuvre collective, non une faute individuelle.", "ch": 10, "chapters": [10]}, {"name": "Michel Crozier", "dates": "1922-2013", "courant": "Sociologie des organisations", "idea": "Analyse stratégique ; zone d’incertitude ; cercle vicieux bureaucratique", "oeuvres": ["Le Phénomène bureaucratique (1963)", "L’Acteur et le système (1977, avec Erhard Friedberg)"], "detail": "Enquête dans une entreprise qu’il appelle le « monopole industriel » — en réalité la SEITA — et montre que les ouvriers d’entretien tirent leur pouvoir de la maîtrise de la réparation des machines. Distingue le monde formel de l’organigramme et le monde informel des relations réelles.", "phrase": "Pour Crozier, le pouvoir est diffus et relationnel : il appartient à qui maîtrise une zone d’incertitude.", "ch": 10, "chapters": [10]}, {"name": "Erhard Friedberg", "dates": "", "courant": "Sociologie des organisations", "idea": "Analyse stratégique des organisations", "oeuvres": ["L’Acteur et le système (1977, avec Michel Crozier)"], "detail": "Coauteur avec Michel Crozier de L’Acteur et le système (1977), ouvrage fondateur de l’analyse stratégique des organisations.", "phrase": "Friedberg contribue à penser l’organisation comme un jeu d’acteurs disposant de marges de manœuvre.", "ch": 10, "chapters": [10]}, {"name": "Robert Castel", "dates": "1933-2013", "courant": "Sociologie du travail", "idea": "Société salariale ; désaffiliation", "oeuvres": ["Les Métamorphoses de la question sociale (1995)"], "detail": "Étudie l’évolution de la condition salariale et sa fragilisation à partir de la montée du chômage et de la précarité. Montre que la société salariale avait fait de l’emploi un support d’intégration en associant au salaire un statut et des droits sociaux.", "phrase": "Pour Castel, la perte d’emploi enclenche une désaffiliation : perte de protections, de relations et d’identité.", "ch": 10, "chapters": [10]}, {"name": "Florence Aubenas", "dates": "", "courant": "Journalisme d’immersion", "idea": "Travailleurs précaires ; conditions de vie", "oeuvres": ["Le Quai de Ouistreham (2010)"], "detail": "Enquête en immersion sur le monde des travailleurs précaires : bas salaires, difficultés de transport, isolement social.", "phrase": "Aubenas donne à voir de l’intérieur la réalité quotidienne de l’emploi précaire.", "ch": 10, "chapters": [10]}, {"name": "Solomon Asch", "dates": "1907-1996", "courant": "Psychologie sociale", "idea": "Conformisme ; paradigme d’Asch", "oeuvres": [], "detail": "Son expérience de 1951 montre qu’un individu peut adopter publiquement une réponse qu’il sait pourtant erronée sous l’effet de la pression conformiste exercée par le groupe.", "phrase": "L’expérience d’Asch établit le pouvoir du conformisme sur la décision individuelle.", "ch": 10, "chapters": [10]}, {"name": "Irving Janis", "dates": "1918-1990", "courant": "Psychologie sociale", "idea": "Groupthink (pensée de groupe)", "oeuvres": [], "detail": "Développe en 1982 la notion de Groupthink, ou pensée de groupe : la recherche d’unanimité au sein d’un groupe cohésif étouffe les objections et dégrade la qualité de la décision.", "phrase": "Pour Janis, l’illusion de l’unanimité fait passer le silence pour un accord.", "ch": 10, "chapters": [10]}, {"name": "Simone Weil", "dates": "1909-1943", "courant": "Philosophie", "idea": "Condition ouvrière ; expérience du travail en usine", "oeuvres": [], "detail": "En 1934, la philosophe fait l’expérience du travail en usine et en tire une analyse de la condition ouvrière vécue de l’intérieur.", "phrase": "Simone Weil décrit l’épreuve concrète du travail industriel et ses effets sur la personne.", "ch": 10, "chapters": [10]}, {"name": "Werner Sombart", "dates": "1863-1941", "courant": "Sociologie et économie allemandes", "idea": "Sciences sociales allemandes ; revue fondée avec Weber", "oeuvres": [], "detail": "Participe en 1903, avec Max Weber, à la création d’une importante revue allemande de sciences sociales.", "phrase": "Sombart accompagne Weber dans l’institutionnalisation des sciences sociales allemandes.", "ch": 10, "chapters": [10]}, {"name": "James March", "dates": "1928-2018", "courant": "Théorie des organisations", "idea": "Décision en organisation ; rationalité limitée", "oeuvres": [], "detail": "Chercheur américain dont Michel Crozier contribue à faire connaître les travaux en France, aux côtés de ceux d’Herbert Simon et de Robert Merton.", "phrase": "March appartient au courant qui analyse la décision organisationnelle sous contrainte de rationalité limitée.", "ch": 10, "chapters": [10]}, {"name": "Charles-Albert Michalet", "dates": "", "courant": "Économie internationale", "idea": "Mondialisation multidimensionnelle ; trois configurations", "oeuvres": ["Qu’est-ce que la mondialisation ? (2002)"], "detail": "Montre que la mondialisation ne peut pas être réduite au commerce international. Il distingue trois configurations : internationale, centrée sur les échanges commerciaux ; multinationale, centrée sur l’implantation des firmes et l’investissement direct ; globale, marquée par la fragmentation productive et l’unification financière.", "phrase": "Pour Michalet, la mondialisation est un processus multidimensionnel et cumulatif.", "ch": 21, "chapters": [21]}, {"name": "Pierre-Noël Giraud", "dates": "", "courant": "Économie internationale", "idea": "Globalisations ; généralisation des compétitions", "oeuvres": [], "detail": "Analyse les globalisations comme une généralisation des compétitions : les territoires ne rivalisent plus seulement par leurs produits, mais pour attirer capitaux, activités et compétences.", "phrase": "Pour Giraud, la mondialisation met les territoires eux-mêmes en concurrence.", "ch": 21, "chapters": [21]}, {"name": "Friedrich List", "dates": "1789-1846", "courant": "Économie nationale", "idea": "Protectionnisme éducateur ; industries naissantes", "oeuvres": [], "detail": "Affirme en 1841 qu’une industrie naissante ne peut pas toujours affronter immédiatement une industrie étrangère déjà compétitive, et qu’elle doit être temporairement protégée pour acquérir les capacités productives nécessaires.", "phrase": "Pour List, la protection doit être transitoire et orientée vers l’acquisition de compétences.", "ch": 21, "chapters": [21]}, {"name": "Richard Baldwin", "dates": "", "courant": "Économie internationale", "idea": "Dégroupages ; chaînes de valeur mondiales", "oeuvres": [], "detail": "Analyse la mondialisation à travers le concept de « dégroupage ». Le premier dégroupage sépare le lieu de production du lieu de consommation, rendu possible par la baisse des coûts de transport.", "phrase": "Pour Baldwin, chaque dégroupage redéfinit la géographie de la production mondiale.", "ch": 21, "chapters": [21]}, {"name": "Hélène Rey", "dates": "", "courant": "Macroéconomie internationale", "idea": "Déséquilibres mondiaux ; modèles de croissance", "oeuvres": [], "detail": "Montre que les déséquilibres extérieurs mondiaux ne sont pas de simples anomalies comptables : ils reflètent des stratégies nationales de croissance elles-mêmes déséquilibrées et les faiblesses structurelles des modèles nationaux.", "phrase": "Pour Hélène Rey, le déséquilibre extérieur renvoie au modèle de croissance qui le produit.", "ch": 21, "chapters": [21]}, {"name": "Wolfgang Stolper", "dates": "", "courant": "Commerce international", "idea": "Théorème Stolper-Samuelson", "oeuvres": [], "detail": "Coauteur avec Paul Samuelson du théorème montrant que l’ouverture commerciale produit des effets distributifs : elle modifie différemment la rémunération des facteurs de production selon leur abondance et leur usage dans les secteurs exposés.", "phrase": "Le théorème Stolper-Samuelson explique pourquoi le commerce fait des gagnants et des perdants à l’intérieur d’un pays.", "ch": 21, "chapters": [21]}, {"name": "Alain Béraud", "dates": "", "courant": "Histoire de la pensée économique", "idea": "Structure des flux de capitaux de la première mondialisation", "oeuvres": [], "detail": "Montre que 80 à 90 % des mouvements de capitaux de la première mondialisation correspondent à des investissements de portefeuille, les IDE n’en représentant qu’une faible part.", "phrase": "Selon Béraud, la première mondialisation financière était d’abord une mondialisation de portefeuille.", "ch": 21, "chapters": [21]}, {"name": "Paul Volcker", "dates": "1927-2019", "courant": "Politique monétaire", "idea": "Désinflation ; choc de taux de 1979", "oeuvres": [], "detail": "Arrive à la tête de la Réserve fédérale américaine en 1979 dans un contexte d’inflation élevée, et engage une politique de forte hausse des taux d’intérêt.", "phrase": "Le tournant Volcker de 1979 marque le passage à une politique monétaire résolument anti-inflationniste.", "ch": 21, "chapters": [21]}];
var LIENS = [["Ronald Coase", 9], ["Herbert Simon", 9], ["Michael Jensen", 9], ["William Meckling", 9], ["Alfred Chandler", 9], ["Abba Lerner", 9], ["Frederick Taylor", 9], ["Max Weber", 10], ["Daniel Kahneman", 10], ["Frederick Taylor", 10], ["Karl Marx", 10], ["Raúl Prebisch", 21], ["Daron Acemoglu", 21], ["James A. Robinson", 21], ["Branko Milanovic", 21], ["Paul Bairoch", 21], ["Ragnar Nurkse", 21], ["Thomas Piketty", 21], ["Paul Samuelson", 21], ["David Ricardo", 21], ["Adam Smith", 21]];

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

/* ---------- 1. AUTEURS ---------- */
function poserAuteurs(){
  if(typeof AUTHORS === 'undefined') return false;
  NOUVEAUX.forEach(function(a){
    var f = AUTHORS.find(function(x){ return norm(x.name) === norm(a.name); });
    if(f){
      f.chapters = Array.from(new Set([].concat(f.chapters || [f.ch], a.ch)));
      if(!f.oeuvres || !f.oeuvres.length) f.oeuvres = a.oeuvres;
      return;
    }
    AUTHORS.push(a);
  });
  LIENS.forEach(function(p){
    var f = AUTHORS.find(function(x){ return norm(x.name) === norm(p[0]); });
    if(f) f.chapters = Array.from(new Set([].concat(f.chapters || [f.ch], p[1])));
  });
  return true;
}

/* ---------- 2. FICHES : puces de filtre manquantes ---------- */
var CHIPS = [[9,'Ch.9'],[10,'Ch.10'],[21,'2ᵉ année — Ch.1']];
function poserChips(){
  var bar = document.querySelector('#pg-fc .fc-controls');
  if(!bar) return;
  CHIPS.forEach(function(c){
    var deja = [].slice.call(bar.querySelectorAll('button')).some(function(b){
      return b.textContent.trim() === c[1];
    });
    if(deja) return;
    var btn = document.createElement('button');
    btn.className = 'btn btn-g btn-sm';
    btn.textContent = c[1];
    btn.setAttribute('onclick', 'filterFC(' + c[0] + ')');
    bar.appendChild(btn);
  });
}

/* ---------- 2 bis. FICHES : badge « CH.21 » -> libelle d'annee ---------- */
function relabelBadges(racine){
  var zone = racine || document;
  var badges = zone.querySelectorAll('.fc-badge');
  for(var i=0;i<badges.length;i++){
    var t = badges[i].textContent;
    if(t.indexOf('21') === -1) continue;
    var nt = t.replace(/CH[.\s]*21(?![0-9])/i, '2ᵉ ANNÉE · CH.1');
    if(nt !== t) badges[i].textContent = nt;
  }
}
function surveillerFiches(){ relabelBadges(document.querySelector('#pg-fc .fc-grid')); }
/* le rendu des fiches recree les badges : on relabellise apres chaque rendu */
['renderFC','filterFC','flipFC'].forEach(function(fn){
  if(typeof window[fn] !== 'function' || window[fn].__a2wrapped) return;
  var old = window[fn];
  var w = function(){
    var r = old.apply(this, arguments);
    try{ setTimeout(surveillerFiches, 0); }catch(e){}
    return r;
  };
  w.__a2wrapped = true;
  window[fn] = w;
});

/* ---------- 3. RECHERCHE : reconstruire les index ---------- */
function rafraichirIndex(){
  try{ if(typeof rebuildSearchIndex === 'function') rebuildSearchIndex(); }catch(e){}
  try{ if(typeof renderAuthors === 'function' && document.getElementById('ag')) renderAuthors(); }catch(e){}
}

function boot(){
  poserAuteurs();
  poserChips();
  surveillerFiches();
  rafraichirIndex();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
setTimeout(boot, 900);
setTimeout(boot, 2200);
setTimeout(boot, 4200);

if(typeof window.showPg === 'function'){
  var old = window.showPg;
  window.showPg = function(pg){
    var r = old.apply(this, arguments);
    try{
      if(pg === 'fc'){ setTimeout(function(){ poserChips(); surveillerFiches(); }, 60);
                       setTimeout(surveillerFiches, 400); setTimeout(surveillerFiches, 1000); }
      if(pg === 'authors') setTimeout(function(){ poserAuteurs(); rafraichirIndex(); }, 60);
    }catch(e){}
    return r;
  };
}
})();
</script>
